<title>大模型情报局 · LLM Papers Tracker</title>
<script>/* P1-4: apply saved/system theme before first paint */
try{if(localStorage.getItem('llm_theme')==='dark'||(!localStorage.getItem('llm_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;padding:1.5rem 2rem;text-align:center}
header h1{font-size:1.8rem;margin-bottom:.3rem}
header p{opacity:.8;font-size:.85rem}
.tabs{display:flex;justify-content:space-between;gap:.6rem;padding:.8rem;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.nav-group{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center}
.nav-group.pages{border-left:1px solid #e8e8e8;border-right:1px solid #e8e8e8;padding:0 .7rem}
.tab{padding:.45rem 1.1rem;border-radius:2rem;cursor:pointer;border:2px solid #302b63;background:white;font-weight:600;transition:all .2s;font-size:.82rem;text-decoration:none;color:#302b63}
.tab.active,.tab:hover{background:#302b63;color:white}
.tab.page-link{background:#f6f4fd;border-color:#d9d2f0}
.tab.page-link:hover{background:#302b63;border-color:#302b63;color:white}
.tab.action{padding:.45rem .65rem;border-color:#e3e3e3;color:#999;font-size:.88rem;font-weight:400}
.tab.action:hover{border-color:#302b63;color:#302b63;background:#f6f4fd}
/* Today-update bar */
.today-bar{display:flex;align-items:center;gap:.55rem;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:.5rem .9rem;font-size:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.today-bar.stale{background:#f8fafc;border-color:#e2e8f0;color:#64748b}
.today-bar b{font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* Topic multi-select chips */
.tag-chips{display:flex;flex-wrap:wrap;gap:.35rem;flex-basis:100%;align-items:center}
.tag-chips .lbl{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-right:.15rem}
.tchip{padding:.2rem .65rem;border-radius:1rem;font-size:.74rem;font-weight:600;cursor:pointer;border:1.5px solid #d8d3f0;color:#302b63;background:white;transition:all .15s;user-select:none}
.tchip:hover{border-color:#302b63}
.tchip.on{background:#302b63;color:white;border-color:#302b63}
.tchip .cnt{opacity:.6;font-weight:400;font-size:.68rem;margin-left:.2rem}
.result-info a{color:#302b63;text-decoration:none;margin-left:.5rem}
.result-info a:hover{text-decoration:underline}
/* Changelog modal */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:4vh 1rem}
.modal-mask.open{display:flex}
.modal{background:white;border-radius:14px;max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:1.2rem 1.4rem;position:relative}
.modal-close{position:absolute;top:.7rem;right:.9rem;background:none;border:none;font-size:1.1rem;cursor:pointer;color:#999}
.cl-entry{margin-bottom:1.1rem}
.cl-entry h3{font-size:.95rem;color:#302b63;margin-bottom:.15rem}
.cl-date{font-size:.72rem;color:#999;margin-bottom:.35rem}
.cl-entry li{font-size:.82rem;color:#444;margin-left:1.1rem;line-height:1.7}
html.dark .modal{background:#1e2233;color:#d6d9e2}
html.dark .cl-entry h3{color:#b3ade6}
html.dark .cl-entry li{color:#b9bdca}
/* Main layout */
.main-layout{display:grid;grid-template-columns:260px 1fr;gap:0;max-width:1200px;margin:0 auto;padding:1rem}
/* Company timeline sidebar */
.sidebar{background:white;border-radius:12px;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);height:calc(100vh - 160px);overflow:hidden;display:flex;flex-direction:column;position:sticky;top:80px}
.sidebar h3{font-size:.82rem;color:#302b63;font-weight:700;margin-bottom:.8rem;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.sidebar h3 span{font-size:.7rem;color:#aaa;font-weight:400}
.timeline-list{overflow-y:auto;flex:1;cursor:grab;user-select:none;padding-right:4px}
.timeline-list:active{cursor:grabbing}
.timeline-list::-webkit-scrollbar{width:4px}
.timeline-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.tl-item{padding:.5rem .6rem;border-left:2px solid #e0e0e0;margin-left:.5rem;margin-bottom:.3rem;cursor:pointer;transition:border-color .2s,background .2s;border-radius:0 6px 6px 0}
.tl-item:hover{border-left-color:#302b63;background:#f5f0ff}
.tl-date{font-size:.65rem;color:#aaa;margin-bottom:.15rem}
.tl-company{font-size:.68rem;font-weight:700;margin-bottom:.1rem}
.tl-title{font-size:.72rem;color:#444;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-zh{font-size:.68rem;color:#888;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* Right content */
.content{padding-left:1rem}
.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select{padding:.38rem .65rem;border:1px solid #ddd;border-radius:8px;font-size:.82rem;background:white;outline:none}
.fg input:focus,.fg select:focus{border-color:#302b63}
.fg.grow{flex:1;min-width:160px}
.result-info{font-size:.78rem;color:#999;margin-bottom:.6rem}
.section{display:none}
.section.active{display:block}
.card{background:white;border-radius:10px;padding:1rem 1.2rem;margin-bottom:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:box-shadow .2s;position:relative}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card-meta{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}
.badge{font-size:.72rem;padding:.15rem .55rem;border-radius:1rem;font-weight:600;white-space:nowrap}
.badge.cite{background:#fff3e0;color:#e65100}
.badge.cite.warm{background:#fff3e0;color:#e65100;border:1.5px solid #ff9800}
.badge.cite.high{background:#e8f5e9;color:#2e7d32;border:1.5px solid #66bb6a}
.badge.company{font-size:.72rem;padding:.15rem .55rem;border-radius:1rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.badge.company .cdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.badge.date{background:#ede7f6;color:#4527a0}
.badge.venue-conf{background:#e3f2fd;color:#1565c0}
.badge.venue-journal{background:#e8f5e9;color:#2e7d32}
.badge.venue-preprint{background:#f5f5f5;color:#757575}
.badge.if{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.badge.ccf{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.badge.tag{background:#e3f2fd;color:#1565c0;cursor:pointer}
.badge.tag:hover{background:#1565c0;color:white}
.arxiv-link{font-size:.8rem;color:#302b63;text-decoration:none;font-weight:600}
.arxiv-link:hover{text-decoration:underline}
.card h3{font-size:.92rem;line-height:1.5;margin-bottom:.15rem;padding-right:2rem}
.title-zh{font-size:.84rem;color:#555;margin-bottom:.3rem;padding-right:2rem}
.authors{font-size:.8rem;color:#666;margin-bottom:.35rem}
.abstract{font-size:.8rem;color:#555;line-height:1.6;border-top:1px solid #f0f0f0;padding-top:.4rem;margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav-btn{position:absolute;top:.9rem;right:.9rem;background:none;border:none;font-size:1.2rem;cursor:pointer;opacity:.3;transition:opacity .2s,transform .2s}
.fav-btn:hover{opacity:.8;transform:scale(1.2)}
.fav-btn.active{opacity:1}
/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:.3rem;margin-top:1rem;flex-wrap:wrap}
.page-btn{padding:.35rem .65rem;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:.8rem;transition:all .2s;min-width:32px;text-align:center}
.page-btn:hover,.page-btn.active{background:#302b63;color:white;border-color:#302b63}
.page-btn.dots{cursor:default;border:none;background:none}
.page-jump{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:#999;margin-left:.3rem}
.page-jump input{width:44px;padding:.3rem .4rem;border:1px solid #ddd;border-radius:6px;font-size:.78rem;text-align:center;outline:none}
.page-jump input:focus{border-color:#302b63}
.empty{text-align:center;padding:3rem;color:#999}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.topic-card{background:white;border-radius:10px;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s}
.topic-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.topic-card h4{font-size:.92rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.topic-card p{font-size:.78rem;color:#666;line-height:1.5}
.topic-count{font-size:.7rem;background:#302b63;color:white;border-radius:1rem;padding:.1rem .45rem}
.loading{text-align:center;padding:3rem;color:#999}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.78rem;margin-top:1rem}
@media(max-width:800px){.main-layout{grid-template-columns:1fr}.sidebar{display:none}}

.badge.tag-Agent{background:#fff3e0;color:#e65100}
.badge.tag-RAG{background:#e8f5e9;color:#2e7d32}
.badge.tag-Reasoning{background:#e3f2fd;color:#1565c0}
.badge.tag-Multimodal{background:#fce4ec;color:#880e4f}
.badge.tag-Fine-tuning{background:#f3e5f5;color:#6a1b9a}
.badge.tag-Safety{background:#e0f2f1;color:#004d40}
.badge.tag-LLM{background:#e8eaf6;color:#283593}
.badge.tag-MCP{background:#fff8e1;color:#f57f17}
/* sidebar filters */
.sidebar-filters{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.7rem;flex-shrink:0}
.sidebar-filters select{padding:.3rem .5rem;border:1px solid #e0e0e0;border-radius:6px;font-size:.75rem;background:white;outline:none;color:#333}
.sidebar-filters select:focus{border-color:#302b63}
/* learning path */
.stage{margin-bottom:1.5rem}
.stage-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.stage-head h2{font-size:1.05rem;color:#302b63}
.stage-num{background:#302b63;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.stage-intro{font-size:.85rem;color:#555;line-height:1.6;margin-bottom:.5rem}
.concept-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.concept-chip{font-size:.72rem;background:#ede7f6;color:#4527a0;border-radius:1rem;padding:.2rem .6rem;cursor:help}
.learn-note{font-size:.82rem;color:#2e7d32;background:#f1f8e9;border-radius:6px;padding:.4rem .6rem;line-height:1.5}
/* ── P1-4: dark mode overrides ── */
html.dark body{background:#12141f;color:#d6d9e2}
html.dark header{background:linear-gradient(135deg,#0a0918,#1c1840,#161628)}
html.dark .tabs{background:#1a1d2c;border-color:#2b2f45}
html.dark .tab{background:#1a1d2c;color:#b3ade6;border-color:#4c4783}
html.dark .tab.active,html.dark .tab:hover{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .tab.page-link{background:#232741;border-color:#3c4060}
html.dark .tab.action{border-color:#3c4060;color:#8a8fa8}
html.dark .tab.action:hover{background:#232741;color:#b3ade6;border-color:#5b54b8}
html.dark .nav-group.pages{border-color:#2b2f45}
html.dark .sidebar,html.dark .card,html.dark .topic-card{background:#1e2233;box-shadow:0 2px 8px rgba(0,0,0,.35)}
html.dark .sidebar h3{color:#b3ade6}
html.dark .tl-item{border-left-color:#3c4060}
html.dark .tl-item:hover{background:#262a40;border-left-color:#5b54b8}
html.dark .tl-title{color:#c6c9d6}
html.dark .tl-zh{color:#7d8197}
html.dark .fg label{color:#7d8197}
html.dark .fg input,html.dark .fg select,html.dark .sidebar-filters select{background:#232741;border-color:#3c4060;color:#d6d9e2}
html.dark .tchip{background:#232741;border-color:#3c4060;color:#b3ade6}
html.dark .tchip:hover{border-color:#5b54b8}
html.dark .tchip.on{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .today-bar{background:#14261c;border-color:#1f5138;color:#7ee2ae}
html.dark .today-bar.stale{background:#1a1d2c;border-color:#2b2f45;color:#8a8fa8}
html.dark .card h3{color:#e4e6ee}
html.dark .title-zh{color:#b9bdca}
html.dark .authors{color:#9aa0b4}
html.dark .abstract{color:#a9adbd;border-top-color:#2b2f45}
html.dark .learn-note{background:#17251c;color:#7ee2ae}
html.dark .result-info,html.dark .page-jump{color:#7d8197}
html.dark .page-btn{background:#232741;border-color:#3c4060;color:#c6c9d6}
html.dark .page-btn:hover,html.dark .page-btn.active{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .page-jump input{background:#232741;border-color:#3c4060;color:#d6d9e2}
html.dark .topic-card p{color:#9aa0b4}
html.dark .concept-chip{background:#2b2545;color:#c9b8f5}
html.dark .stage-head h2{color:#b3ade6}
html.dark .stage-intro{color:#a9adbd}
html.dark .empty,html.dark .loading{color:#6b7086}
html.dark footer{color:#565b70}
html.dark .arxiv-link{color:#9d95e8}
</style>
</head>
<body>
<header>
  <h1>🤖 大模型情报局</h1>
  <p id="header-sub">AI 大模型前沿论文追踪 · 每日自动更新</p>
  <p id="header-fresh" style="font-size:.72rem;opacity:.6;margin-top:.25rem"></p>
</header>
<div class="tabs">
  <div class="nav-group">
    <button class="tab active" data-tab="latest" onclick="showTab('latest',this)">🆕 最新</button>
    <button class="tab" data-tab="hot" onclick="showTab('hot',this)">🔥 高引用</button>
    <button class="tab" data-tab="topics" onclick="showTab('topics',this)">🏷️ 主题</button>
    <button class="tab" data-tab="learn" onclick="showTab('learn',this)">📚 学习路径</button>
    <button class="tab" data-tab="favorites" onclick="showTab('favorites',this)">⭐ 收藏</button>
  </div>
  <div class="nav-group pages">
    <a class="tab page-link" href="timeline/">📅 时间轴</a>
    <a class="tab page-link" href="models/">🧬 模型</a>
  </div>
  <div class="nav-group">
    <button class="tab action" onclick="openChangelog()" title="查看版本更新说明">📝</button>
    <button class="tab action" id="btn-theme" onclick="toggleTheme()" title="切换深色 / 浅色模式">🌙</button>
    <button class="tab action" onclick="refreshData()" title="重新加载数据">🔄</button>
    <button class="tab action" id="btn-update" onclick="triggerUpdate()" title="触发 GitHub Actions 抓取最新论文（每日北京时间 09:00 自动执行）">⚡</button>
  </div>
</div>
<div class="modal-mask" id="cl-mask" onclick="if(event.target===this)closeChangelog()">
  <div class="modal" id="cl-modal"></div>
</div>
<div class="main-layout">
  <!-- Left sidebar: company timeline -->
  <div class="sidebar">
    <h3>🏢 公司论文 <span>可拖拽滚动</span></h3>
    <div class="sidebar-filters">
  <select id="tl-company" onchange="filterTimeline()">
    <option value="">全部公司</option>
    <option value="OpenAI">OpenAI</option>
    <option value="Google">Google</option>
    <option value="Meta">Meta</option>
    <option value="Anthropic">Anthropic</option>
    <option value="Mistral">Mistral</option>
    <option value="Qwen">Qwen</option>
    <option value="DeepSeek">DeepSeek</option>
    <option value="Baidu">Baidu</option>
    <option value="Zhipu">Zhipu</option>
    <option value="Moonshot">Moonshot</option>
    <option value="MiniMax">MiniMax</option>
    <option value="Xiaomi">Xiaomi</option>
    <option value="Tencent">Tencent</option>
    <option value="Microsoft">Microsoft</option>
    <option value="Nvidia">Nvidia</option>
    <option value="IBM">IBM</option>
    <option value="AllenAI">AllenAI</option>
    <option value="TII">TII</option>
    <option value="xAI">xAI</option>
    <option value="01.AI">01.AI</option>
    <option value="Baichuan">Baichuan</option>
    <option value="InternLM">InternLM</option>
    <option value="Databricks">Databricks</option>
    <option value="AI21">AI21</option>
    <option value="LG">LG</option>
    <option value="Cohere">Cohere</option>
    <option value="ByteDance">ByteDance</option>
    <option value="StepFun">StepFun</option>
    <option value="Meituan">Meituan</option>
    <option value="AntGroup">AntGroup</option>
    <option value="ModelBest">ModelBest</option>
    <option value="Huawei">Huawei</option>
    <option value="Skywork">Skywork</option>
    <option value="SenseTime">SenseTime</option>
  </select>
  <select id="tl-tag" onchange="filterTimeline()">
    <option value="">全部标签</option>
    <option value="RAG">RAG</option>
    <option value="Agent">Agent</option>
    <option value="Reasoning">Reasoning</option>
    <option value="Multimodal">Multimodal</option>
    <option value="Fine-tuning">Fine-tuning</option>
    <option value="Safety">Safety</option>
    <option value="LLM">LLM</option>
    <option value="MCP">MCP</option>
  </select>
</div>
<div class="timeline-list" id="timeline-list"><div class="loading" style="padding:1rem;font-size:.8rem">加载中...</div></div>
  </div>
  <!-- Right content -->
  <div class="content">
    <div class="today-bar" id="today-bar" style="display:none"></div>
    <div class="toolbar" id="toolbar">
      <div class="fg grow"><label>搜索</label><input type="text" id="q" placeholder="标题、作者、关键词（支持中文）..." oninput="applyFilter()"></div>
      <div class="tag-chips" id="tag-chips"><span class="lbl">主题</span></div>
      <div class="fg"><label>公司</label>
        <select id="company-filter" onchange="applyFilter()" title="覆盖近期公司论文索引（company-papers.json）">
          <option value="">全部</option>
        </select>
      </div>
      <div class="fg"><label>排序</label>
        <select id="sort" onchange="applyFilter()">
          <option value="date">最新日期</option>
          <option value="cite">引用量</option>
          <option value="title">标题</option>
        </select>
      </div>
      <div class="fg"><label>年份</label>
        <select id="year" onchange="applyFilter()">
          <option value="">全部</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
        </select>
      </div>
    </div>
    <div id="kw-bar"></div>
    <div class="result-info" id="result-info"></div>
    <div id="latest" class="section active"><div class="loading">加载中...</div></div>
    <div id="hot" class="section"></div>
    <div id="topics" class="section"></div>
    <div id="learn" class="section"></div>
    <div id="favorites" class="section"></div>

// ── API config ───────────────────────────────────────────
// Data loads go DIRECTLY to GitHub Pages (same-origin, fast, CDN-cached).
// Only favorites persistence uses the Cloudflare Worker (it writes to the
// repo via GitHub API). This avoids the slow worker-first double-hop that
// made page loads laggy.
const API_BASE = ''; // data loads straight from GitHub Pages
const FAV_API = 'https://llm-tracker-api.llm-tracker-api.workers.dev';

function api(path) {
  // Relative path on GitHub Pages (repo prefix handled by browser)
  return 'api' + path + (path.includes('?') ? '&' : '?') + 't=' + Date.now();
}

async function apiFetch(path) {
  const url = api(path);
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp;
  } catch (e) {
    // GitHub Pages can be slow/blocked; retry once via the Worker proxy.
    try {
      const alt = FAV_API + '/api' + path + (path.includes('?') ? '&' : '?') + 't=' + Date.now();
      const resp = await fetch(alt);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp;
    } catch (e2) {
      throw e;
    }
  }
}

function extractKws(text,limit){
  if(!text)return[];

  for(const {canon,re} of KW_LEXICON){
    if(re.test(text)){found.push(canon);if(limit&&found.length>=limit)break;}
  }
  return found;
}

function relTime(iso){
  if(!iso) return '';
  const d=Date.now()-new Date(iso).getTime();
  const m=Math.floor(d/60000);
  if(m<1) return '刚刚';
  if(m<60) return m+' 分钟前';
  const h=Math.floor(m/60);
  if(h<24) return h+' 小时前';
  return Math.floor(h/24)+' 天前';
}
function updateFreshLine(){

}
function buildTodayBar(){
  const bar=document.getElementById('today-bar');
  if(!PAPERS.length){bar.style.display='none';return;}
  const newest=PAPERS.reduce((a,b)=>((b.date||'')>(a.date||'')?b:a));
  const D=newest.date;
  if(!D){bar.style.display='none';return;}
  const same=PAPERS.filter(p=>p.date===D);
  const hitBoundary=same.length>=API_PAGE_SIZE; // newest date may continue beyond page 1
  const topics=new Set(); same.forEach(p=>(p.tags||[]).forEach(t=>topics.add(t)));
  const hot=same.filter(p=>(p.cite||0)>=100).length;
  const today=new Date().toISOString().slice(0,10);
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const fresh=(D===today||D===yest);
  bar.className='today-bar'+(fresh?'':' stale');
  bar.innerHTML=(fresh?'<span class="pulse"></span>':'')
    +'<b>📈 最近更新 '+D+'</b>'
    +'<span>新增 '+same.length+(hitBoundary?'+':'')+' 篇 · 覆盖 '+topics.size+' 个主题'+(hot?' · 高引 '+hot+' 篇':'')+'</span>'
    +'<span style="margin-left:auto;opacity:.7">全库 '+totalPapers.toLocaleString()+' 篇</span>';
  bar.style.display='flex';
}

function saveFavsLocal(){

function syncFavsURL(){
  return FAV_API ? (FAV_API + '/api/favorites') : '';

function pushFavs(){
  const u=syncFavsURL();
  if(!u) return;
  fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([...favorites])})
    .then(r=>{
      if(r.ok){showToast('⭐ 收藏已同步到云端');}
      else{console.warn('收藏同步失败',r.status);showToast('⚠️ 收藏同步失败('+r.status+')，稍后重试',4000);}
    })
    .catch(e=>{console.warn('收藏同步网络错误',e);showToast('⚠️ 云端不可达，收藏仅存本机',4000);});
}
let favSyncTimer=null;
function scheduleFavSync(){
  saveFavsLocal();
  clearTimeout(favSyncTimer);
  favSyncTimer=setTimeout(pushFavs,800); // debounce
}
async function loadCloudFavs(){
  const u=syncFavsURL();
  if(!u) return;
  try{
    const resp=await fetch(u);
    if(!resp.ok) return;
    const cloud=await resp.json();
    if(!Array.isArray(cloud)) return;
    // Merge: union of local + cloud (cloud is authoritative source)
    let changed=false;
    cloud.forEach(id=>{if(!favorites.has(id)){favorites.add(id);changed=true;}});
    // If local had items cloud lacks, push local up (someone starred on this device)
    if(changed) saveFavsLocal();
    if(changed||favorites.size>cloud.length) scheduleFavSync();
  }catch(e){console.warn('云端收藏拉取失败',e);}
}

async function filterData(){
  const q=document.getElementById('q').value.toLowerCase();
  const tagF=[...selectedTags]; // multi-select topics (OR)
  const coF=document.getElementById('company-filter').value;
  const sortF=document.getElementById('sort').value;
  const yearF=document.getElementById('year').value;

  // If no filter and data is loaded: use in-memory PAPERS (fast path)
  const noFilter = !q && !tagF.length && !coF && !yearF && !selectedKws.size && currentTab !== 'hot' && currentTab !== 'favorites';
  if (noFilter && PAPERS.length >= totalPapers) {
    let data = [...PAPERS];
    if (sortF === 'cite') data.sort((a, b) => b.cite - a.cite);
    else if (sortF === 'title') data.sort((a, b) => a.title.localeCompare(b.title));
    else data.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return data;
  }

  // Search: use search index to find matching IDs, then load needed pages
  let matches;
  if (currentTab === 'favorites') {
    matches = SEARCH_INDEX.filter(si => favorites.has(si.id));
  } else if (currentTab === 'hot') {
    matches = SEARCH_INDEX.filter(si => si.c >= 500);
  } else {
    matches = [...SEARCH_INDEX];
  }

  if (q) {
    matches = matches.filter(si =>
      (si.t || '').toLowerCase().includes(q) ||
      (si.tz || '').includes(q) ||
      (si.tg || []).join(' ').toLowerCase().includes(q)
    );
  }
  if (tagF.length) matches = matches.filter(si => tagF.some(t => (si.tg || []).includes(t)));
  if (coF) {
    const set = COMPANY_IDS[coF];
    matches = set ? matches.filter(si => set.has(si.id)) : [];
  }
  if (yearF) matches = matches.filter(si => si.y == yearF);
  if (selectedKws.size) {
    // keyword filter: title-derived auto keywords OR manual custom tags
    const tm = kwTitleMap();
    matches = matches.filter(si => {
      const auto = tm[si.id] || [];
      const manual = customTags[si.id] || [];
      return [...selectedKws].every(k => auto.includes(k) || manual.includes(k));
    });
  }

  // Sort
  if (sortF === 'cite') {
    matches.sort((a, b) => b.c - a.c);
  } else if (sortF === 'title') {
    matches.sort((a, b) => (a.t || '').localeCompare(b.t || ''));
  }
  // default: newest first (search index is already in date order)

  // Load needed pages for results
  const neededPages = new Set();
  matches.forEach(si => {
    const idx = PAPERS.findIndex(p => p.id === si.id);
    if (idx === -1) {
      // Paper not loaded yet — figure out which API page it's on
      // Search index order matches PAPERS order (both newest-first)
      const siIdx = SEARCH_INDEX.findIndex(x => x.id === si.id);
      neededPages.add(apiPageForIndex(siIdx));
    }
  });

  // Load all needed pages in parallel
  if (neededPages.size > 0) {
    await Promise.all([...neededPages].map(p => loadApiPage(p).catch(() => {})));
  }

  // Now build the result from PAPER_MAP
  let data = matches.map(si => PAPER_MAP[si.id]).filter(Boolean);
  return data;
}

function renderCard(p){

  const tags=(p.tags||[]).map(t=>`<span class="badge tag tag-${t}" onclick="filterByTag('${t}')">${t}</span>`).join(' ');
  const citeCls=p.cite>=1000?'high':(p.cite>=100?'warm':'');
  const co=p.company?`<span class="badge company" style="background:${COLORS[p.company]||'#302b63'}14;color:${COLORS[p.company]||'#302b63'};border:1px solid ${COLORS[p.company]||'#302b63'}40" title="公司论文"><span class="cdot" style="background:${COLORS[p.company]||'#302b63'}"></span>${p.company}</span>`:'';
  return `<div class="card">
    <button class="fav-btn ${fav?'active':''}" data-id="${p.id}" onclick="toggleFav('${p.id}')">⭐</button>
    <div class="card-meta">
      ${tags}
      <span class="badge cite ${citeCls}">📊 ${(p.cite||0).toLocaleString()}</span>
      <span class="badge date">📅 ${p.date||String(p.year)||''}</span>
      ${co}
      <a class="arxiv-link" href="https://arxiv.org/abs/${p.id}" target="_blank">arXiv ↗</a>
      ${PDFS.has(p.id)?`<a class="arxiv-link" href="https://raw.githubusercontent.com/Xplore-LAB/llm-tracker/pdfs/pdfs/${p.id}.pdf" target="_blank">📄 PDF</a>`:''}
    </div>
    <h3>${p.title}</h3>
    ${p.title_zh?`<div class="title-zh">📖 ${p.title_zh}</div>`:''}
    <div class="authors">👤 ${p.authors}</div>
    ${p.note?`<div class="learn-note">📌 ${p.note}</div>`:''}
    <div class="abstract">${p.abstract}</div>
    ${renderKwRow(p)}
  </div>`;
}

// Keyword row: auto-extracted (dashed, from title+note+abstract, topic names excluded)
// + manual custom tags (solid) + inline add-tag input.
function renderKwRow(p){
  const auto=extractKws((p.title||'')+' '+(p.title_zh||'')+' '+(p.note||'')+' '+(p.abstract||''),8)
    .filter(k=>!(p.tags||[]).includes(k)).slice(0,5);
  const manual=customTags[p.id]||[];
  if(!auto.length&&!manual.length&&!p.id)return '';
  const autoHtml=auto.map(k=>`<span class="kw" title="自动提取，点击筛选" onclick="addKwFilter('${k.replace(/'/g,"\\'")}')">#${k}</span>`).join('');
  const manualHtml=manual.map(t=>`<span class="kw custom" title="人工标签" onclick="addKwFilter('${t.replace(/'/g,"\\'")}')">#${t}<span class="rm" title="删除标签" onclick="event.stopPropagation();rmCustomTag('${p.id}','${t.replace(/'/g,"\\'")}')">✕</span></span>`).join('');
  return `<div class="kw-row">${autoHtml}${manualHtml}
    <button class="kw-add" title="添加人工标签" onclick="this.style.display='none';document.getElementById('kw-input-${p.id}').style.display='inline-block';document.getElementById('kw-input-${p.id}').focus()">＋标签</button>
    <input class="kw-input" id="kw-input-${p.id}" style="display:none" placeholder="回车添加" maxlength="20"
      onkeydown="if(event.key==='Enter'){addCustomTag('${p.id}')}else if(event.key==='Escape'){this.style.display='none';this.previousElementSibling.style.display=''}">
  </div>`;
}

function renderPagination(total, page){
  const totalPages=Math.ceil(total/PAGE_SIZE);
  if(totalPages<=1) return '';
  const pages=[];
  // always show first, last, current±2
  const show=new Set([1,totalPages,page,page-1,page+1,page-2,page+2].filter(p=>p>=1&&p<=totalPages));
  const sorted=[...show].sort((a,b)=>a-b);
  let html='<div class="pagination">';
  let prev=0;
  sorted.forEach(p=>{
    if(p-prev>1) html+=`<span class="page-btn dots">…</span>`;
    html+=`<button class="page-btn ${p===page?'active':''}" onclick="renderSection(${p})">${p}</button>`;
    prev=p;
  });
  html+=`<div class="page-jump">跳至<input type="number" min="1" max="${totalPages}" placeholder="${page}" onkeydown="if(event.key==='Enter'){const v=parseInt(this.value);if(v>=1&&v<=${totalPages})renderSection(v)}">页</div>`;
  html+='</div>';
  return html;
}

async function renderSection(page){
  currentPage=page||1;
  const data=await filterData();
  const total=data.length;
  const slice=data.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  const filtered=isFiltered();
  document.getElementById('result-info').innerHTML=filtered
    ?'当前 <b>'+total.toLocaleString()+'</b> / '+totalPapers.toLocaleString()+' 篇 <a href="javascript:clearFilters()">✕ 清除筛选</a>'
    :'共 '+total.toLocaleString()+' 篇';
  let html=slice.length?slice.map(renderCard).join(''):'<div class="empty">暂无论文 📭</div>';
  html+=renderPagination(total,currentPage);
  document.getElementById(currentTab).innerHTML=html;
}

function filterByTag(tag){
  selectedTags=new Set([tag]);
  renderTagChips();applyFilter();
}

// ── P1-3: URL state sync (shareable filter views) ────────
let PENDING_COMPANY='';
function syncURL(){
  const p=new URLSearchParams();
  if(currentTab!=='latest')p.set('tab',currentTab);
  const q=document.getElementById('q').value.trim();if(q)p.set('q',q);
  if(selectedTags.size)p.set('tags',[...selectedTags].join(','));
  if(selectedKws.size)p.set('kws',[...selectedKws].join(','));
  const co=document.getElementById('company-filter').value;if(co)p.set('company',co);
  const y=document.getElementById('year').value;if(y)p.set('year',y);
  const s=document.getElementById('sort').value;if(s!=='date')p.set('sort',s);
  const qs=p.toString();
  history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));
}
function restoreFromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('q'))document.getElementById('q').value=p.get('q');
  if(p.get('tags'))selectedTags=new Set(p.get('tags').split(',').filter(t=>TOPICS.some(x=>x.key===t)));
  if(p.get('kws'))selectedKws=new Set(p.get('kws').split(',').filter(Boolean));
  if(p.get('year'))document.getElementById('year').value=p.get('year');
  if(p.get('sort'))document.getElementById('sort').value=p.get('sort');
  if(p.get('company'))PENDING_COMPANY=p.get('company'); // applied once the company select is populated
  renderTagChips();renderKwBar();
  const tab=p.get('tab');
  const valid=['latest','hot','topics','learn','favorites'];
  const t=valid.includes(tab)?tab:'latest';
  const btn=document.querySelector('.tab[data-tab="'+t+'"]');
  showTab(t,btn);
}
function applyFilter(){syncURL();if(currentTab!=='topics')renderSection(1);}

function showTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab[data-tab]').forEach(t=>t.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  el.classList.add('active');
  document.getElementById('toolbar').style.display=(tab==='topics'||tab==='learn')?'none':'flex';
  document.getElementById('result-info').textContent='';
  syncURL();
  if(tab==='topics')renderTopics();else if(tab==='learn')renderLearn();else renderSection(1);
}

function renderTopics(){
  document.getElementById('topics').innerHTML='<div class="topic-grid">'+TOPICS.map(t=>{
    const count=SEARCH_INDEX.filter(si=>(si.tg||[]).includes(t.key)).length;
    return `<div class="topic-card" onclick="selectTopic('${t.key}')">
      <h4>${t.icon} ${t.name} <span class="topic-count">${count}</span></h4>
      <p>${t.desc}</p></div>`;
  }).join('')+'</div>';
}

function selectTopic(tag){
  selectedTags=new Set([tag]);
  renderTagChips();
  const btn=document.querySelector('.tab[data-tab="latest"]');
  showTab('latest',btn);btn.classList.add('active');
}

// ── Learning path ─────────────────────────────────────────
let LEARN_PATH=null;
function renderLearn(){
  const el=document.getElementById('learn');
  if(LEARN_PATH){el.innerHTML=buildLearnHtml();return;}
  el.innerHTML='<div class="loading">加载中...</div>';
  apiFetch('/learning-path.json').then(r=>r.json()).then(d=>{
    LEARN_PATH=d;
    el.innerHTML=buildLearnHtml();
  }).catch(()=>{
    el.innerHTML='<div class="empty">学习路径数据加载失败，请刷新重试</div>';
  });
}
function venueBadge(p){
  const v=p.venue;
  if(!v) return '';
  if(v.type==='conference'){
    return `<span class="badge venue-conf">🏛️ ${v.name}${v.ccf?' · CCF-'+v.ccf:''}</span>`;
  }
  if(v.type==='journal'){
    let ifs=v.if?`<span class="badge if">影响因子 ${v.if}${v.ifYear?' ('+v.ifYear+')':''}</span>`:'';
    return `<span class="badge venue-journal">📖 ${v.name}</span>${ifs}`;
  }
  return `<span class="badge venue-preprint">📄 ${v.name||'arXiv 预印本'}</span>`;
}
function buildLearnHtml(){
  const idMap=PAPER_MAP;
  return LEARN_PATH.stages.map((s,i)=>{
    const concepts=(s.concepts||[]).map(c=>`<span class="concept-chip" title="${c.desc}">💡 ${c.term}</span>`).join('');
    const papers=(s.papers||[]).map(p=>{
      const hit=idMap[p.id];
      const fav=hit&&favorites.has(p.id);
      // 引用量：优先学习路径内嵌的权威值，其次数据库中的值；0 或缺失则不显示
      let citeBadge='';
      const cite=p.cite!=null?p.cite:(hit?hit.cite:null);
      if(cite>0) citeBadge=`<span class="badge cite ${cite>=1000?'high':''}">📊 ${cite.toLocaleString()}</span>`;
      return `<div class="card">
        ${hit?`<button class="fav-btn ${fav?'active':''}" data-id="${p.id}" onclick="toggleFav('${p.id}')">⭐</button>`:''}
        <div class="card-meta">
          ${citeBadge}
          ${venueBadge(p)}
          <a class="arxiv-link" href="https://arxiv.org/abs/${p.id}" target="_blank">arXiv:${p.id} ↗</a>
        </div>
        <h3>${p.title}</h3>
        <div class="learn-note">📌 ${p.note}</div>
      </div>`;
    }).join('');
    return `<div class="stage">
      <div class="stage-head"><span class="stage-num">${i+1}</span><h2>${s.icon} ${s.title}</h2></div>
      <p class="stage-intro">${s.intro}</p>
      <div class="concept-row">${concepts}</div>
      ${papers}
    </div>`;
  }).join('');
}

// ── API data loading ──────────────────────────────────────
async function loadApiPage(pageNum) {
  if (loadedApiPages.has(pageNum)) return;
  const resp = await apiFetch('/papers/page-' + String(pageNum).padStart(3, '0') + '.json');
  if (!resp.ok) throw new Error('Failed to load page ' + pageNum);
  const page = await resp.json();
  page.forEach(p => {
    if (!PAPER_MAP[p.id]) {
      PAPER_MAP[p.id] = p;
      PAPERS.push(p);
    }
  });
  loadedApiPages.add(pageNum);
}

async function loadData() {
  try {
    // 1. Load index (metadata)
    const idxResp = await apiFetch('/index.json');
    if (idxResp.ok) {
      const idx = await idxResp.json();
      totalPapers = idx.total;
      totalApiPages = idx.totalPages;
      DATA_UPDATED = idx.updated || null;
      updateFreshLine();
    }
    // 2. Load search index (~2MB, enables client-side search)
    const siResp = await apiFetch('/search-index.json');
    if (siResp.ok) {
      SEARCH_INDEX = await siResp.json();
      if (!totalPapers) totalPapers = SEARCH_INDEX.length;
      if (!totalApiPages) totalApiPages = Math.ceil(totalPapers / API_PAGE_SIZE);
      renderTagChips();
    }
    // 3. Load PDF availability index (enables 📄 PDF links on cards)
    const pdfResp = await apiFetch('/pdfs-index.json');
    if (pdfResp.ok) {
      const pdfIds = await pdfResp.json();
      PDFS = new Set(pdfIds);
    }
    // 4. Load first page of papers
    await loadApiPage(1);
    document.getElementById('header-sub').textContent =
      'AI 大模型前沿论文追踪 · 共 ' + totalPapers + ' 篇 · 每日自动更新';
    buildTodayBar();
    restoreFromURL(); // P1-3: honor shared ?tab=&q=&tags=&company=&year=&sort= links
    loadCompanyTimeline();
  } catch (e) {
    console.error('Data load failed:', e);
    document.getElementById('latest').innerHTML =
      '<div class="empty">数据加载失败，请刷新重试</div>';
  }
}

// Need to load a specific API page for a given paper index
function apiPageForIndex(idx) {
  return Math.floor(idx / API_PAGE_SIZE) + 1;
}

// ── Manual update ──────────────────────────────────────────
function showToast(msg, duration) {
  duration = duration || 3000;
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#302b63;color:white;padding:.7rem 1.5rem;border-radius:2rem;font-size:.85rem;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, duration);
}

async function refreshData() {
  showToast('🔄 正在刷新数据...');
  try {
    // Clear caches
    PAPERS = [];
    PAPER_MAP = {};
    SEARCH_INDEX = [];
    loadedApiPages.clear();
    // Reload index
    const idxResp = await apiFetch('/index.json');
    if (idxResp.ok) {
      const idx = await idxResp.json();
      totalPapers = idx.total;
      totalApiPages = idx.totalPages;
      DATA_UPDATED = idx.updated || DATA_UPDATED;
      updateFreshLine();
    }
    // Reload search index
    const siResp = await apiFetch('/search-index.json');
    if (siResp.ok) { SEARCH_INDEX = await siResp.json(); renderTagChips(); }
    // Reload first page
    await loadApiPage(1);
    buildTodayBar();
    // Reload company data
    const coResp = await apiFetch('/company-papers.json');
    if (coResp.ok) {
      ALL_COMPANY_PAPERS = await coResp.json();
      COMPANY_IDS={};
      ALL_COMPANY_PAPERS.forEach(p=>{if(p.company){(COMPANY_IDS[p.company]=COMPANY_IDS[p.company]||new Set()).add(p.id);}});
      populateCompanyFilter(ALL_COMPANY_PAPERS);
      filterTimeline();
    }
    document.getElementById('header-sub').textContent =
      'AI 大模型前沿论文追踪 · 共 ' + totalPapers + ' 篇 · 每日自动更新';
    renderSection(currentPage);
    showToast('✅ 数据已刷新！共 ' + totalPapers + ' 篇论文');
  } catch (e) {
    showToast('❌ 刷新失败，请稍后重试', 5000);
  }
}

function triggerUpdate() {
  const btn = document.getElementById('btn-update');
  btn.textContent = '⏳ 提交中...';
  btn.disabled = true;

  fetch('https://api.github.com/repos/Xplore-LAB/llm-tracker/actions/workflows/update-papers.yml/dispatches', {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ ref: 'master' })
  }).then(res => {
    if (res.ok) {
      showToast('✅ 已触发更新！数据将在 1~2 分钟内刷新', 5000);
      btn.textContent = '✅ 已提交';
      setTimeout(() => {
        btn.textContent = '⚡ 更新数据';
        btn.disabled = false;
      }, 10000);
    } else if (res.status === 401 || res.status === 403) {
      // Not logged in — open GitHub Actions page
      showToast('🔑 请先登录 GitHub，已为您打开页面', 4000);
      window.open('https://github.com/Xplore-LAB/llm-tracker/actions', '_blank');
      btn.textContent = '⚡ 更新数据';
      btn.disabled = false;
    } else {
      throw new Error('HTTP ' + res.status);
    }
  }).catch(() => {
    showToast('❌ 触发失败，请手动前往 GitHub Actions', 5000);
    window.open('https://github.com/Xplore-LAB/llm-tracker/actions', '_blank');
    btn.textContent = '⚡ 更新数据';
    btn.disabled = false;
  });
}

}

function closeChangelog(){

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChangelog();});
