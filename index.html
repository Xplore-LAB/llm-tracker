<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;padding:1.6rem 2rem 1.4rem;text-align:center;border-bottom:4px double rgba(255,255,255,.35)}
header h1{font-size:1.8rem;margin-bottom:.3rem;letter-spacing:.14em}
header p{opacity:.8;font-size:.85rem}
.tabs{display:flex;justify-content:space-between;gap:.6rem;padding:.8rem;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.nav-group{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center}
.nav-group.pages{border-left:1px solid #e8e8e8;border-right:1px solid #e8e8e8;padding:0 .7rem}
.tab{padding:.45rem 1.1rem;border-radius:2rem;cursor:pointer;border:2px solid #302b63;background:white;font-weight:600;transition:all .2s;font-size:.82rem;text-decoration:none;color:#302b63}
.tab.active,.tab:hover{background:#302b63;color:white}
.tab.page-link{background:#f6f4fd;border-color:#d9d2f0}
.tab.page-link:hover{background:#302b63;border-color:#302b63;color:white}
.tab.action{padding:.45rem .65rem;border-color:#e3e3e3;color:#999;font-size:.88rem;font-weight:400}
.tab.action:hover{border-color:#302b63;color:#302b63;background:#f6f4fd}
/* Today-update bar */
.today-bar{display:flex;align-items:center;gap:.55rem;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:.5rem .9rem;font-size:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.today-bar.stale{background:#f8fafc;border-color:#e2e8f0;color:#64748b}
.today-bar b{font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* Topic multi-select chips */
.tag-chips{display:flex;flex-wrap:wrap;gap:.35rem;flex-basis:100%;align-items:center}
.tag-chips .lbl{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-right:.15rem}
.tchip{padding:.2rem .65rem;border-radius:1rem;font-size:.74rem;font-weight:600;cursor:pointer;border:1.5px solid #d8d3f0;color:#302b63;background:white;transition:all .15s;user-select:none}
.tchip:hover{border-color:#302b63}
.tchip.on{background:#302b63;color:white;border-color:#302b63}
.tchip .cnt{opacity:.6;font-weight:400;font-size:.68rem;margin-left:.2rem}
.result-info a{color:#302b63;text-decoration:none;margin-left:.5rem}
.result-info a:hover{text-decoration:underline}
/* Changelog modal */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:4vh 1rem}
.modal-mask.open{display:flex}
.modal{background:white;border-radius:14px;max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:1.2rem 1.4rem;position:relative}
.modal-close{position:absolute;top:.7rem;right:.9rem;background:none;border:none;font-size:1.1rem;cursor:pointer;color:#999}
.cl-entry{margin-bottom:1.1rem}
.cl-entry h3{font-size:.95rem;color:#302b63;margin-bottom:.15rem}
.cl-date{font-size:.72rem;color:#999;margin-bottom:.35rem}
.cl-entry li{font-size:.82rem;color:#444;margin-left:1.1rem;line-height:1.7}
html.dark .modal{background:#1e2233;color:#d6d9e2}
html.dark .cl-entry h3{color:#b3ade6}
html.dark .cl-entry li{color:#b9bdca}
/* Main layout */
.main-layout{display:grid;grid-template-columns:260px 1fr;gap:0;max-width:1200px;margin:0 auto;padding:1rem}
/* Company timeline sidebar */
.sidebar{background:white;border-radius:12px;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);height:calc(100vh - 160px);overflow:hidden;display:flex;flex-direction:column;position:sticky;top:80px}
.sidebar h3{font-size:.82rem;color:#302b63;font-weight:700;margin-bottom:.8rem;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.sidebar h3 span{font-size:.7rem;color:#aaa;font-weight:400}
.timeline-list{overflow-y:auto;flex:1;cursor:grab;user-select:none;padding-right:4px}
.timeline-list:active{cursor:grabbing}
.timeline-list::-webkit-scrollbar{width:4px}
.timeline-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.tl-item{padding:.5rem .6rem;border-left:2px solid #e0e0e0;margin-left:.5rem;margin-bottom:.3rem;cursor:pointer;transition:border-color .2s,background .2s;border-radius:0 6px 6px 0}
.tl-item:hover{border-left-color:#302b63;background:#f5f0ff}
.tl-date{font-size:.65rem;color:#aaa;margin-bottom:.15rem}
.tl-company{font-size:.68rem;font-weight:700;margin-bottom:.1rem}
.tl-title{font-size:.72rem;color:#444;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-zh{font-size:.68rem;color:#888;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* Right content */
.content{padding-left:1rem}
.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select{padding:.38rem .65rem;border:1px solid #ddd;border-radius:8px;font-size:.82rem;background:white;outline:none}
.fg input:focus,.fg select:focus{border-color:#302b63}
.fg.grow{flex:1;min-width:160px}
.result-info{font-size:.78rem;color:#999;margin-bottom:.6rem}
.section{display:none}
.section.active{display:block}
.card{background:white;border-radius:10px;padding:1rem 1.2rem;margin-bottom:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;position:relative;border-left:3px solid transparent}
.card:hover{box-shadow:0 6px 20px rgba(48,43,99,.16);transform:translateY(-2px);border-left-color:#302b63}
.card-meta{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}
.badge{font-size:.72rem;padding:.15rem .55rem;border-radius:1rem;font-weight:600;white-space:nowrap}
.badge.cite{background:#fff3e0;color:#e65100}
.badge.cite.warm{background:#fff3e0;color:#e65100;border:1.5px solid #ff9800}
.badge.cite.high{background:#e8f5e9;color:#2e7d32;border:1.5px solid #66bb6a}
.badge.company{font-size:.72rem;padding:.15rem .55rem;border-radius:1rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.badge.company .cdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.badge.date{background:#ede7f6;color:#4527a0}
.badge.venue-conf{background:#e3f2fd;color:#1565c0}
.badge.venue-journal{background:#e8f5e9;color:#2e7d32}
.badge.venue-preprint{background:#f5f5f5;color:#757575}
.badge.if{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.badge.ccf{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.badge.tag{background:#e3f2fd;color:#1565c0;cursor:pointer}
.badge.tag:hover{background:#1565c0;color:white}
.arxiv-link{font-size:.8rem;color:#302b63;text-decoration:none;font-weight:600}
.arxiv-link:hover{text-decoration:underline}
/* ── P2: keyword tags (auto-extracted + manual custom) ── */
.kw-row{display:flex;flex-wrap:wrap;gap:.32rem;align-items:center;margin-top:.55rem;padding-top:.5rem;border-top:1px dashed #ece6ff}
.kw{font-size:.7rem;line-height:1;padding:.28rem .62rem .3rem;border-radius:1rem;background:#f6f4fd;color:#5b54a8;border:1px dashed #c9c2e8;cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;gap:.32rem;font-weight:500}
.kw:hover{background:#ede9fe;border-color:#a594e0;border-style:solid;color:#3d3784;transform:translateY(-1px)}
.kw::before{content:"";width:5px;height:5px;border-radius:50%;background:#a594e8;flex-shrink:0}
.kw.custom{background:#fff7e6;color:#92400e;border-color:#fcd34d;border-style:solid;font-weight:600}
.kw.custom:hover{background:#fef3c7;border-color:#d97706;color:#78350f}
.kw.custom::before{background:#d97706}
.kw .rm{margin-left:.1rem;font-size:.95em;opacity:.5;cursor:pointer;line-height:1;padding:0 2px;border-radius:50%}
.kw .rm:hover{opacity:1;color:#dc2626;background:#fee2e2}
.kw-add{font-size:1rem;line-height:1;width:22px;height:22px;padding:0;border-radius:50%;border:1px dashed #c9c2e8;background:transparent;color:#9089b8;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s ease}
.kw-add:hover{border-style:solid;border-color:#302b63;color:#302b63;background:#f6f4fd;transform:rotate(90deg)}
.kw-input{font-size:.72rem;padding:.3rem .55rem;border:1px solid #c9c2e8;border-radius:.6rem;background:#fff;color:#333;outline:none;width:90px;font-family:inherit}
.kw-input:focus{border-color:#302b63}
.card h3{font-size:.92rem;line-height:1.5;margin-bottom:.15rem;padding-right:2rem}
.title-zh{font-size:.84rem;color:#555;margin-bottom:.3rem;padding-right:2rem}
.authors{font-size:.8rem;color:#666;margin-bottom:.35rem}
.abstract{font-size:.8rem;color:#555;line-height:1.6;border-top:1px solid #f0f0f0;padding-top:.4rem;margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav-btn{position:absolute;top:.9rem;right:.9rem;background:none;border:none;font-size:1.2rem;cursor:pointer;opacity:.3;transition:opacity .2s,transform .2s}
.fav-btn:hover{opacity:.8;transform:scale(1.2)}
.fav-btn.active{opacity:1}
/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:.3rem;margin-top:1rem;flex-wrap:wrap}
.page-btn{padding:.35rem .65rem;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:.8rem;transition:all .2s;min-width:32px;text-align:center}
.page-btn:hover,.page-btn.active{background:#302b63;color:white;border-color:#302b63}
.page-btn.dots{cursor:default;border:none;background:none}
.page-jump{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:#999;margin-left:.3rem}
.page-jump input{width:44px;padding:.3rem .4rem;border:1px solid #ddd;border-radius:6px;font-size:.78rem;text-align:center;outline:none}
.page-jump input:focus{border-color:#302b63}
.empty{text-align:center;padding:3rem;color:#999}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.topic-card{background:white;border-radius:10px;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s}
.topic-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.topic-card h4{font-size:.92rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.topic-card p{font-size:.78rem;color:#666;line-height:1.5}
.topic-count{font-size:.7rem;background:#302b63;color:white;border-radius:1rem;padding:.1rem .45rem}
.loading{text-align:center;padding:3rem;color:#999}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.78rem;margin-top:1rem}
@media(max-width:800px){.main-layout{grid-template-columns:1fr}.sidebar{display:none}}

.badge.tag-Agent{background:#fff3e0;color:#e65100}
.badge.tag-RAG{background:#e8f5e9;color:#2e7d32}
.badge.tag-Reasoning{background:#e3f2fd;color:#1565c0}
.badge.tag-Multimodal{background:#fce4ec;color:#880e4f}
.badge.tag-Fine-tuning{background:#f3e5f5;color:#6a1b9a}
.badge.tag-Safety{background:#e0f2f1;color:#004d40}
.badge.tag-LLM{background:#e8eaf6;color:#283593}
.badge.tag-MCP{background:#fff8e1;color:#f57f17}
/* sidebar filters */
.sidebar-filters{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.7rem;flex-shrink:0}
.sidebar-filters select{padding:.3rem .5rem;border:1px solid #e0e0e0;border-radius:6px;font-size:.75rem;background:white;outline:none;color:#333}
.sidebar-filters select:focus{border-color:#302b63}
/* learning path */
.stage{margin-bottom:1.5rem}
.stage-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.stage-head h2{font-size:1.05rem;color:#302b63}
.stage-num{background:#302b63;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.stage-intro{font-size:.85rem;color:#555;line-height:1.6;margin-bottom:.5rem}
.concept-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.concept-chip{font-size:.72rem;background:#ede7f6;color:#4527a0;border-radius:1rem;padding:.2rem .6rem;cursor:help}
.learn-note{font-size:.82rem;color:#2e7d32;background:#f1f8e9;border-radius:6px;padding:.4rem .6rem;line-height:1.5}
/* ── P1-4: dark mode overrides ── */
html.dark body{background:#12141f;color:#d6d9e2}
html.dark header{background:linear-gradient(135deg,#0a0918,#1c1840,#161628)}
html.dark .tabs{background:#1a1d2c;border-color:#2b2f45}
html.dark .tab{background:#1a1d2c;color:#b3ade6;border-color:#4c4783}
html.dark .tab.active,html.dark .tab:hover{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .tab.page-link{background:#232741;border-color:#3c4060}
html.dark .tab.action{border-color:#3c4060;color:#8a8fa8}
html.dark .tab.action:hover{background:#232741;color:#b3ade6;border-color:#5b54b8}
html.dark .nav-group.pages{border-color:#2b2f45}
html.dark .sidebar,html.dark .card,html.dark .topic-card{background:#1e2233;box-shadow:0 2px 8px rgba(0,0,0,.35)}
html.dark .sidebar h3{color:#b3ade6}
html.dark .tl-item{border-left-color:#3c4060}
html.dark .tl-item:hover{background:#262a40;border-left-color:#5b54b8}
html.dark .tl-title{color:#c6c9d6}
html.dark .tl-zh{color:#7d8197}
html.dark .fg label{color:#7d8197}
html.dark .fg input,html.dark .fg select,html.dark .sidebar-filters select{background:#232741;border-color:#3c4060;color:#d6d9e2}
html.dark .tchip{background:#232741;border-color:#3c4060;color:#b3ade6}
html.dark .tchip:hover{border-color:#5b54b8}
html.dark .tchip.on{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .today-bar{background:#14261c;border-color:#1f5138;color:#7ee2ae}
html.dark .today-bar.stale{background:#1a1d2c;border-color:#2b2f45;color:#8a8fa8}
html.dark .card h3{color:#e4e6ee}
html.dark .title-zh{color:#b9bdca}
html.dark .authors{color:#9aa0b4}
html.dark .abstract{color:#a9adbd;border-top-color:#2b2f45}
