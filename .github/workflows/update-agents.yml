name: Update Agents Daily

on:
  schedule:
    - cron: '30 2 * * *'   # UTC 02:30 = 北京 10:30，与论文管线(01:00)错开
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover agent news (RSS + Google News + HN)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python3 scripts/discover_agent_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json agents-inbox.json daily_summary_agents.txt
          git diff --staged --quiet || (git commit -m "chore(agents): daily discover $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send Feishu notification
        if: env.FEISHU_WEBHOOK != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -f daily_summary_agents.txt ]; then
            python3 << 'PYEOF'
          import urllib.request, json, os
          webhook = os.environ['FEISHU_WEBHOOK']
          msg = open('daily_summary_agents.txt').read()
          text = msg + '\n查看：https://xplore-lab.github.io/llm-tracker/agents/\n审核合并：python3 scripts/merge_agent_news.py'
          data = json.dumps({'msg_type':'text','content':{'text':text}}).encode()
          req = urllib.request.Request(webhook, data, headers={'Content-Type':'application/json'})
          print(urllib.request.urlopen(req).read().decode())
          PYEOF
          fi
