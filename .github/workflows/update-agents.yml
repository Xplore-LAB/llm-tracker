name: Update Agents Daily

on:
  schedule:
    - cron: '30 2 * * *'   # UTC 02:30 = 北京 10:30，与论文管线(01:00)错开
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve LLM config (secrets first, ai-assistant.js fallback)
        env:
          S_LLM_BASE_URL: ${{ secrets.AGENTS_LLM_BASE_URL }}
          S_LLM_API_KEY: ${{ secrets.AGENTS_LLM_API_KEY }}
          S_LLM_MODEL: ${{ secrets.AGENTS_LLM_MODEL }}
        run: |
          python3 << 'PYEOF'
          import re, os
          base = os.environ.get('S_LLM_BASE_URL', '').strip()
          key = os.environ.get('S_LLM_API_KEY', '').strip()
          model = os.environ.get('S_LLM_MODEL', '').strip()
          src = 'repo secrets'
          if not (base and key and model):
              s = open('assets/ai-assistant.js', encoding='utf-8').read()
              def pick(k):
                  m = re.search(k + r"\s*:\s*'([^']*)'", s)
                  return m.group(1) if m else ''
              endpoint, key, model = pick('endpoint'), pick('apiKey'), pick('model')
              assert endpoint and key and model, 'AI_CONFIG 解析失败'
              base = endpoint.replace('/chat/completions', '').rstrip('/')
              src = 'ai-assistant.js'
          else:
              base = base.replace('/chat/completions', '').rstrip('/')
          print(f'::add-mask::{key}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"LLM_BASE_URL={base}\nLLM_API_KEY={key}\nLLM_MODEL={model}\n")
          print('LLM config loaded from', src + ':', base, model)
          PYEOF

      - name: Discover agent news (RSS + Google News + HN)
        run: python3 scripts/discover_agent_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json agents-inbox.json daily_summary_agents.txt
          git diff --staged --quiet || (git commit -m "chore(agents): daily discover $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -n "$FEISHU_WEBHOOK" ] && [ -f daily_summary_agents.txt ]; then
            python3 << 'PYEOF'
          import urllib.request, json, os
          webhook = os.environ['FEISHU_WEBHOOK']
          msg = open('daily_summary_agents.txt').read()
          text = msg + '\n查看：https://xplore-lab.github.io/llm-tracker/agents/\n审核合并：python3 scripts/merge_agent_news.py'
          data = json.dumps({'msg_type':'text','content':{'text':text}}).encode()
          req = urllib.request.Request(webhook, data, headers={'Content-Type':'application/json'})
          print(urllib.request.urlopen(req).read().decode())
          PYEOF
          fi
