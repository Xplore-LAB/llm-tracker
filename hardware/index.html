<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#14304d;color:#d8e8f5;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,rgba(127,196,255,.06) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(127,196,255,.06) 0 1px,transparent 1px 28px),repeating-linear-gradient(0deg,rgba(127,196,255,.13) 0 1px,transparent 1px 140px),repeating-linear-gradient(90deg,rgba(127,196,255,.13) 0 1px,transparent 1px 140px)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(700px 460px at 12% 6%,rgba(127,196,255,.10),transparent 60%),radial-gradient(760px 540px at 88% 30%,rgba(255,209,102,.05),transparent 60%),radial-gradient(640px 540px at 18% 88%,rgba(127,196,255,.07),transparent 60%)}
header{background:linear-gradient(160deg,#0d2338,#1a4066 55%,#0d2338);color:#eaf4fc;padding:2.2rem 2rem 1.8rem;text-align:center;position:relative;z-index:1;border-bottom:3px solid #7fc4ff}
header h1{font-size:2rem;font-weight:800;letter-spacing:.22em;text-shadow:0 2px 8px rgba(0,0,0,.4)}
header p{opacity:.8;font-size:.85rem;margin-top:.4rem;letter-spacing:.14em;color:#a8cbe8}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:rgba(13,35,56,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(127,196,255,.3);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:1.5px solid #7fc4ff;background:rgba(20,48,77,.85);font-weight:600;font-size:.82rem;text-decoration:none;color:#bcd9ef;transition:all .2s}
.tab:hover,.tab.active{background:#7fc4ff;color:#0d2338}
.stats{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:1rem 1rem .2rem;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(127,196,255,.3);border-radius:1rem;padding:.35rem 1rem;font-size:.78rem;color:#9db9d2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.stat b{color:#eaf4fc;font-size:.95rem;margin-right:.15rem}
.era-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem;max-width:1180px;margin:1.2rem auto 3rem;padding:0 1.2rem;position:relative;z-index:1}
.era-card{position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(127,196,255,.32);border-radius:6px;padding:1rem 1.15rem;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.25),inset 3px 0 0 var(--ec);transition:transform .25s,box-shadow .25s,border-color .25s}
.era-card:hover{transform:translateY(-3px);border-color:#ffd166;box-shadow:0 12px 28px rgba(0,0,0,.35),inset 3px 0 0 var(--ec)}
.era-num{color:var(--ec);font-size:.72rem;font-weight:800;margin-right:.4rem;opacity:.85;letter-spacing:.05em}
.era-go{position:absolute;top:.95rem;right:1rem;font-size:.72rem;font-weight:700;color:var(--ec)}
.era-head{max-width:980px;margin:1.2rem auto .8rem;padding:0 1.2rem;position:relative;z-index:1;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.back-btn{font-size:.78rem;font-weight:600;color:#bcd9ef;background:rgba(20,48,77,.9);border:1.5px solid #7fc4ff;border-radius:1rem;padding:.35rem .9rem;cursor:pointer;align-self:center}
.back-btn:hover{background:#7fc4ff;color:#0d2338}
.era-head h2{font-size:1.3rem;font-weight:800;color:#eaf4fc;letter-spacing:.08em}
.era-head .sub{font-size:.78rem;color:#9db9d2}
.wrap{max-width:980px;margin:0 auto 3rem;padding:0 1.2rem;position:relative;z-index:1}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(127,196,255,.3);border-radius:6px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 5px 18px rgba(0,0,0,.22)}
.panel h3{font-size:1rem;font-weight:800;color:#eaf4fc;margin-bottom:.5rem;letter-spacing:.06em}
.panel .intro{font-size:.8rem;color:#b8d2e6;line-height:1.65;margin-bottom:.5rem}
.note-line{font-size:.78rem;color:#ffd166;line-height:1.6;border-top:1px dashed rgba(127,196,255,.35);padding-top:.5rem;margin-top:.5rem}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;background:rgba(13,35,56,.4)}
.tbl th{background:rgba(127,196,255,.14);color:#cfe6f8;font-weight:700;text-align:left;padding:.45rem .6rem;border:1px solid rgba(127,196,255,.3);white-space:nowrap}
.tbl td{padding:.45rem .6rem;border:1px solid rgba(127,196,255,.16);color:#b8d2e6;line-height:1.5;vertical-align:top}
.tbl tr:nth-child(even) td{background:rgba(127,196,255,.05)}
.tbl-wrap{overflow-x:auto}
.term-search{width:100%;max-width:340px;padding:.5rem .9rem;border:1.5px solid rgba(127,196,255,.45);border-radius:1.5rem;background:#0d2338;font-size:.85rem;outline:none;color:#eaf4fc;margin-bottom:.7rem}
.term-search:focus{border-color:#ffd166}
.term-search::placeholder{color:#5f7f9d}
.vendor{background:rgba(255,255,255,.05);border:1px solid rgba(127,196,255,.3);border-radius:6px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 5px 18px rgba(0,0,0,.22),inset 3px 0 0 #7fc4ff}
.vendor h3{font-size:1.05rem;font-weight:800;color:#eaf4fc;letter-spacing:.05em}
.vendor .vpos{font-size:.76rem;color:#ffd166;font-weight:600;margin:.15rem 0 .5rem;line-height:1.5}
.vendor h6{font-size:.7rem;color:#7fc4ff;letter-spacing:.1em;margin:.5rem 0 .2rem}
.vendor li,.vendor p{font-size:.79rem;color:#b8d2e6;line-height:1.65}
.vendor ul{padding-left:1.1rem}
.vendor .vstory{font-size:.79rem;color:#b8d2e6;line-height:1.65;border-top:1px dashed rgba(127,196,255,.35);padding-top:.5rem;margin-top:.5rem;font-style:italic}
.faq{background:rgba(255,255,255,.05);border:1px solid rgba(127,196,255,.3);border-radius:6px;margin-bottom:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.2);overflow:hidden}
.faq-q{padding:.85rem 1.1rem;cursor:pointer;font-weight:700;font-size:.9rem;color:#eaf4fc;display:flex;align-items:center;gap:.5rem;user-select:none;letter-spacing:.03em}
.faq-q:hover{background:rgba(127,196,255,.08)}
.faq-q .arr{margin-left:auto;color:#7fc4ff;transition:transform .2s}
.faq.open .faq-q .arr{transform:rotate(180deg)}
.faq-a{display:none;padding:0 1.1rem .9rem}
.faq.open .faq-a{display:block}
.faq-concl{font-size:.82rem;color:#ffd166;font-weight:700;line-height:1.6;margin-bottom:.4rem}
.faq-a p{font-size:.79rem;color:#b8d2e6;line-height:1.65;margin-bottom:.4rem}
.tree{position:relative;max-width:860px;margin:1rem auto 0;padding:1rem 0 3rem}
.spine{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(180deg,#7fc4ff,#4a90c4,#7fc4ff);box-shadow:0 0 10px rgba(127,196,255,.5)}
.year-node{position:relative;display:flex;justify-content:center;margin:2rem 0 1.2rem;z-index:2}
.medal{min-width:76px;height:52px;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0 1rem;background:radial-gradient(circle at 34% 30%,#1a4066,#0d2338 75%);border:2px solid #7fc4ff;box-shadow:0 0 0 5px rgba(127,196,255,.12),0 6px 16px rgba(0,0,0,.35)}
.medal span{font-size:1.05rem;font-weight:800;color:#cfe6f8;letter-spacing:.08em}
.ev{position:relative;width:50%;padding:.4rem 2.8rem 1.2rem;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;z-index:2}
.ev.show{opacity:1;transform:none}
.ev.left{left:0;text-align:right}
.ev.right{left:50%;text-align:left}
.vnode{position:absolute;top:1.2rem;width:15px;height:15px;border-radius:50%;background:var(--c);border:3px solid #0d2338;box-shadow:0 0 0 2.5px var(--c),0 0 10px rgba(127,196,255,.5)}
.ev.left .vnode{right:-8px}
.ev.right .vnode{left:-8px}
.card{display:inline-block;max-width:100%;text-align:left;border-radius:6px;padding:.7rem 1rem;background:rgba(255,255,255,.06);border:1px solid rgba(127,196,255,.32);box-shadow:0 4px 14px rgba(0,0,0,.25),inset 3px 0 0 var(--c)}
.ev.right .card{box-shadow:0 4px 14px rgba(0,0,0,.25),inset -3px 0 0 var(--c)}
.ev-cat{font-size:.64rem;font-weight:700;color:var(--c);background:rgba(127,196,255,.1);border-radius:.4rem;padding:.1rem .45rem}
.ev-title{font-size:.92rem;font-weight:800;color:#eaf4fc;line-height:1.4;margin:.25rem 0 .1rem;letter-spacing:.03em}
.ev-org{font-size:.7rem;font-weight:700;color:var(--c)}
.ev-note{font-size:.76rem;color:#b8d2e6;line-height:1.55;margin-top:.2rem}
.ev-top{display:flex;align-items:center;gap:.5rem}
.ev-date{font-size:.66rem;color:#7f9dbb;letter-spacing:.06em}
.ev-cat{margin-left:auto}
.legend{display:flex;justify-content:center;gap:.45rem;flex-wrap:wrap;padding:.6rem 1rem;position:relative;z-index:1}
.lg-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;padding:.22rem .7rem;border-radius:1rem;border:1.5px solid var(--c);color:var(--c);background:rgba(20,48,77,.85);cursor:pointer;user-select:none;transition:all .15s}
.lg-chip.on{background:var(--c);color:#0d2338}
.lg-chip.all{border-color:#bcd9ef;color:#bcd9ef}
.lg-chip.all.on{background:#bcd9ef;color:#0d2338}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7rem;margin-bottom:.8rem}
.cg{display:flex;flex-direction:column;gap:3px}
.cg label{font-size:.7rem;color:#9db9d2;letter-spacing:.04em}
.cg input,.cg select{padding:.45rem .6rem;border:1.5px solid rgba(127,196,255,.45);border-radius:6px;font-size:.84rem;background:#0d2338;outline:none;color:#eaf4fc}
.cg input:focus,.cg select:focus{border-color:#ffd166}
.calc-btn{background:#7fc4ff;color:#0d2338;border:none;border-radius:1rem;padding:.55rem 1.6rem;font-size:.86rem;font-weight:800;cursor:pointer;letter-spacing:.05em}
.calc-btn:hover{background:#ffd166}
.calc-result{display:none;margin-top:.8rem;border-top:1px dashed rgba(127,196,255,.35);padding-top:.7rem}
.calc-result.show{display:block}
.cr-line{font-size:.8rem;color:#b8d2e6;line-height:1.7}
.cr-total{font-size:1.05rem;font-weight:800;color:#ffd166;margin:.3rem 0;letter-spacing:.05em}
.cr-rec{font-size:.84rem;font-weight:700;color:#ffe1a1;background:rgba(255,209,102,.12);border-radius:6px;padding:.45rem .7rem;margin-top:.3rem}
footer{text-align:center;padding:1.5rem;color:#6f8dab;font-size:.78rem;position:relative;z-index:1}
footer a{color:#9fc3e0}
html.dark body{background:#0a1c2e}
html.dark header{background:linear-gradient(160deg,#071627,#0f2a44 55%,#071627)}
@media(max-width:700px){
  .spine{left:14px}
  .year-node{justify-content:flex-start;padding-left:40px}
  .ev{width:100%;left:0!important;text-align:left!important;padding:.4rem .8rem 1.1rem 40px}
  .ev .vnode{left:8px!important;right:auto!important}
}
/* ── 移动端导航折叠 ── */
.nav-toggle{display:none}
@media(max-width:768px){
  header{padding:1.3rem 1rem 1.1rem}
  header h1{font-size:1.4rem;letter-spacing:.12em}
  header p{font-size:.76rem}
  .nav-toggle{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.7rem auto .3rem;padding:.5rem 1.4rem;border-radius:2rem;border:1.5px solid #7fc4ff;background:#14304d;color:#bcd9ef;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit;position:sticky;top:0;z-index:11;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .tabs{display:none;flex-direction:column;align-items:stretch;gap:.4rem;padding:.7rem;position:static}
  .tabs.open{display:flex}
  .tab{text-align:center}
  .wrap{padding:0 .7rem}
  .panel{padding:.8rem .9rem}
  .panel h3{font-size:.95rem}
  .panel .intro{font-size:.76rem}
  html.dark .nav-toggle{background:#0a1c2e}
  .stats{padding:.7rem .6rem .15rem;gap:.3rem}
  .stat{font-size:.66rem;padding:.22rem .6rem}
  .era-grid{padding:0 .7rem;gap:.6rem;grid-template-columns:1fr}
  .era-card{padding:.9rem .9rem}
  .calc-grid{grid-template-columns:1fr 1fr;gap:.5rem}
  .calc-card{padding:.7rem .8rem}
  .era-head{flex-wrap:wrap;gap:.3rem}
  .era-head h3{font-size:.95rem}
  .faq-q{font-size:.85rem;padding:.65rem .8rem}
  .year-node{flex-wrap:wrap;gap:.3rem;font-size:.78rem}
  .medal{font-size:.66rem;padding:2px 5px}

  header p,header h1,.hero p,.hero h1,.hero .sub,.hero .note,.toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .kicker,.ch-hero .meta{word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .era-card p,.era-card li,.panel p,.panel li,.term p,.term li,.entry p,.entry li,.card p,.stat{word-break:break-all;overflow-wrap:break-word}
  .badge,.kv .k,.kv .l,.stat,.fchip{word-break:break-all}
  .tbl-wrap,.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl{font-size:.78rem;min-width:480px}
  .stat{font-size:.64rem;padding:.2rem .55rem}
  .era-card{padding:.8rem .85rem}
  .era-card p{font-size:.85rem;line-height:1.6}
  .calc-card{padding:.65rem .75rem}
  .calc-card .v{font-size:1.1rem}
  .calc-card .l{font-size:.62rem}
  .era-head h3{font-size:.92rem}
  .faq-q{font-size:.82rem;padding:.55rem .7rem}
  .year-node{font-size:.78rem;flex-wrap:wrap;gap:.3rem}
  .medal{font-size:.62rem;padding:2px 5px}
  .legend{font-size:.66rem;flex-wrap:wrap;gap:.3rem;padding:0 .7rem}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  header h1,header p,.hero h1,.hero p,.hero .sub,.hero .note{max-width:100%;word-break:break-all;overflow-wrap:break-word;white-space:normal;line-height:1.5;box-sizing:border-box}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
