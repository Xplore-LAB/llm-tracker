<title>模型发布时序 · 大模型情报局</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;padding:1.5rem 2rem;text-align:center}
header h1{font-size:1.8rem;margin-bottom:.3rem}
header p{opacity:.8;font-size:.85rem}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #302b63;background:white;font-weight:600;font-size:.82rem;text-decoration:none;color:#302b63}
.tab:hover,.tab.active{background:#302b63;color:white}
.page{max-width:1200px;margin:0 auto;padding:1rem}
/* ── toolbar ────────────────────────────────────── */
.toolbar{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:.8rem 1rem;margin-bottom:1rem}
.search-row{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.search-row input{flex:1;padding:.45rem .8rem;border:1px solid #ddd;border-radius:8px;font-size:.85rem;outline:none}
.search-row input:focus{border-color:#302b63}
.search-row .hint{font-size:.72rem;color:#aaa;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.chips + .chips{margin-top:.4rem}
.chips .lbl-t{font-size:.72rem;color:#999;margin-right:.1rem}
.chip{padding:.18rem .6rem;border-radius:1rem;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--c);color:var(--c);background:white;transition:all .15s;user-select:none}
.chip.on{background:var(--c);color:white}
.chip.all{border-color:#302b63;color:#302b63}
.chip.all.on{background:#302b63;color:white}
.chip.logo-chip{display:inline-flex;align-items:center;gap:.3rem}
/* ── logo ───────────────────────────────────────── */
.logo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;overflow:hidden;flex-shrink:0;font-style:normal;font-size:.66rem;font-weight:800;color:white;background:var(--c,#302b63)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:white}
.logo.lg{width:22px;height:22px;font-size:.75rem}
/* ── timeline chart ─────────────────────────────── */
.range-bar{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem}
.range-bar .lbl-t{font-size:.75rem;color:#999}
.range-btn{padding:.25rem .8rem;border:1.5px solid #302b63;border-radius:1rem;background:white;color:#302b63;font-size:.75rem;font-weight:600;cursor:pointer}
.range-btn.on{background:#302b63;color:white}
.chart-wrap{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:.8rem .5rem .5rem;overflow-x:auto;margin-bottom:1rem}
.chart{min-width:1150px;position:relative}
.axis{position:relative;height:18px;border-bottom:2px solid #e0e0e0;margin-left:92px;margin-right:8px}
.axis span{position:absolute;top:0;transform:translateX(-50%);font-size:.68rem;color:#999;white-space:nowrap}
.lane{display:flex;align-items:stretch;border-bottom:1px solid #f5f5f5}
.lane:nth-child(even){background:#fafafc}
.lane-name{flex:0 0 84px;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:.3rem;padding-right:8px;border-right:2px solid #e0e0e0;cursor:pointer}
.lane-name:hover{text-decoration:underline}
.lane-body{flex:1;position:relative;height:30px}
.lane-body.labels{height:64px}
.grid{position:absolute;top:0;bottom:0;border-left:1px solid #f2f2f6}
.node{position:absolute;top:50%;transform:translate(-50%,-50%);text-decoration:none;z-index:2}
.node .dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 auto;border:2px solid white;box-shadow:0 0 0 1px var(--c);transition:transform .15s}
.node.extra .dot{background:white}
.node .lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:600;color:var(--c);white-space:nowrap;display:none;bottom:12px}
.lane-body.labels .node .lbl{display:block}
.lane-body.labels .node.r1 .lbl{bottom:23px;opacity:.85}
.lane-body.labels .node.r2 .lbl{bottom:34px;opacity:.7}
.node:hover{z-index:5}
.node:hover .dot{transform:scale(1.6)}
.node:hover .lbl{display:block;background:white;padding:1px 4px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* ── series list ────────────────────────────────── */
.list-info{font-size:.78rem;color:#999;margin:.4rem 0 .6rem}
.series-card{background:white;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.6rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.series-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.series-head h3{font-size:.92rem}
.co-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;color:white;border-radius:.8rem;padding:.14rem .5rem .14rem .2rem;font-weight:700}
.cnt{font-size:.7rem;background:#302b63;color:white;border-radius:1rem;padding:.1rem .45rem}
.meta{font-size:.72rem;color:#999}
.paper-row{padding:.35rem 0;border-top:1px solid #f5f5f5}
.paper-row .p-meta{font-size:.72rem;color:#999;margin-bottom:.1rem}
.paper-row a{color:#333;text-decoration:none;font-size:.84rem;font-weight:600}
.paper-row a:hover{color:#302b63;text-decoration:underline}
.learn-note{font-size:.8rem;color:#2e7d32;background:#f1f8e9;border-radius:6px;padding:.3rem .55rem;margin-top:.25rem;line-height:1.5}
mark{background:#fff3b0;border-radius:2px;padding:0 1px}
.pagination{display:flex;align-items:center;justify-content:center;gap:.3rem;margin-top:1rem;flex-wrap:wrap}
.page-btn{padding:.35rem .65rem;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:.8rem;min-width:32px;text-align:center}
.page-btn:hover,.page-btn.active{background:#302b63;color:white;border-color:#302b63}
.page-btn.dots{cursor:default;border:none;background:none}
.loading,.empty{text-align:center;padding:3rem;color:#999}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.78rem;margin-top:1rem}
/* ── detail modal ───────────────────────────────── */
.modal-mask{position:fixed;inset:0;background:rgba(15,12,41,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2.5rem 1rem}
.modal-mask.open{display:flex}
.modal{background:white;border-radius:14px;max-width:780px;width:100%;padding:1.2rem 1.4rem;box-shadow:0 12px 48px rgba(0,0,0,.3);position:relative}
.modal-close{position:absolute;top:.7rem;right:.9rem;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#999}
.modal-close:hover{color:#333}
.modal-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem}
.modal-head h2{font-size:1.25rem}
.modal-date{font-size:.78rem;color:#999}
.arch{width:100%;border:1px solid #eee;border-radius:8px;margin:.7rem 0;background:#fafafa}
.arch-cap{font-size:.7rem;color:#aaa;text-align:center;margin-top:-.4rem;margin-bottom:.5rem}
.modal-note{font-size:.85rem;color:#2e7d32;background:#f1f8e9;border-radius:8px;padding:.5rem .8rem;line-height:1.6;margin:.5rem 0}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}
.btn{padding:.4rem .95rem;border-radius:1.5rem;border:1.5px solid #302b63;color:#302b63;font-size:.8rem;font-weight:600;text-decoration:none;transition:all .15s}
.btn:hover{background:#302b63;color:white}
.modal-papers{border-top:1px solid #f0f0f0;margin-top:.7rem;padding-top:.5rem}
.modal-papers h4{font-size:.85rem;color:#302b63;margin-bottom:.2rem}
/* ── P1-1: table view ── */
.list-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.view-toggle{margin-left:auto;display:flex;gap:.3rem}
.vt-btn{padding:.25rem .7rem;border:1.5px solid #302b63;border-radius:1rem;background:white;color:#302b63;font-size:.75rem;font-weight:600;cursor:pointer}
.vt-btn.on{background:#302b63;color:white}
.mtable{width:100%;border-collapse:collapse;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;font-size:.82rem;min-width:760px}
.mtable th{padding:.55rem .7rem;text-align:left;font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #eee;cursor:pointer;user-select:none;white-space:nowrap}
.mtable th:hover{color:#302b63}
.mtable th .arrow{font-size:.6rem}
.mtable td{padding:.5rem .7rem;border-bottom:1px solid #f3f3f6;vertical-align:middle}
.mtable tbody tr:hover td{background:#faf9ff;cursor:pointer}
.mtable .co-cell{display:flex;align-items:center;gap:.35rem;font-weight:600;font-size:.78rem;white-space:nowrap}
/* ── P1-5: tech profile card ── */
.tech-card{border:1px solid #e6e2f5;border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;background:#faf9ff}
.tech-card h5{font-size:.8rem;color:#302b63;margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.tech-src{font-size:.64rem;font-weight:400;background:#e8f5e9;color:#2e7d32;border-radius:1rem;padding:.08rem .5rem}
.tech-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem}
.tech-group h6{font-size:.7rem;color:#999;margin-bottom:.25rem}
.tech-row{font-size:.76rem;color:#444;line-height:1.55;margin-bottom:.2rem}
.tech-row b{color:#302b63;font-weight:600}
.tech-ref{font-size:.66rem;color:#302b63;text-decoration:none;margin-left:.25rem}
.tech-ref:hover{text-decoration:underline}
.tech-links{margin-top:.5rem;border-top:1px dashed #e6e2f5;padding-top:.45rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.tech-links .lbl{font-size:.7rem;color:#999}
.tech-links a{font-size:.72rem;color:#302b63;text-decoration:none;background:white;border:1px solid #d9d2f0;border-radius:1rem;padding:.12rem .55rem}
.tech-links a:hover{background:#302b63;color:white}
/* ── P2: compare matrix ────────────────────────── */
.cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#fff;border:1px solid #d9d2f0;border-radius:14px;box-shadow:0 8px 28px rgba(48,43,99,.2);padding:.55rem .85rem;display:none;align-items:center;gap:.5rem;z-index:60;max-width:92vw;flex-wrap:wrap;font-size:.78rem}
.cmp-bar.show{display:flex}
.cmp-bar .lbl{color:#999;font-size:.72rem}
.cmp-chip{background:#302b63;color:#fff;border-radius:1rem;font-size:.7rem;padding:.16rem .55rem;display:inline-flex;gap:.35rem;align-items:center;white-space:nowrap}
.cmp-chip b{cursor:pointer;font-weight:700;opacity:.75}
.cmp-chip b:hover{opacity:1}
.cmp-go{background:#302b63;color:#fff;border:none;border-radius:1rem;padding:.38rem .95rem;font-weight:700;font-size:.78rem;cursor:pointer}
.cmp-go:hover{background:#241f4e}
.cmp-clear{background:none;border:none;color:#999;font-size:.72rem;cursor:pointer;text-decoration:underline}
.cmp-pick{cursor:pointer;color:#302b63;white-space:nowrap}
.cmp-pick:hover{text-decoration:underline}
.cmp-pick.on{color:#fff;background:#302b63;border-radius:1rem;padding:.05rem .55rem;text-decoration:none}
.cmp-wrap{overflow:auto;max-height:62vh;border:1px solid #eee;border-radius:8px}
.cmp-tbl{border-collapse:collapse;width:100%;font-size:.74rem;background:#fff;min-width:640px}
.cmp-tbl th,.cmp-tbl td{border:1px solid #eee;padding:.4rem .55rem;vertical-align:top;text-align:left;line-height:1.5}
.cmp-tbl td:first-child{position:sticky;left:0;background:#faf9ff;min-width:104px;font-weight:700;color:#302b63;z-index:2}
.cmp-tbl thead th{background:#302b63;color:#fff;position:sticky;top:0;z-index:3;min-width:130px}
.cmp-tbl tr.grp td{background:#f3f0fb;font-weight:700;color:#302b63;font-size:.7rem;letter-spacing:.04em}
.cmp-tbl td.empty-cell{color:#ccc;text-align:center}
.cmp-note{font-size:.72rem;color:#999;margin:.45rem 0;line-height:1.6}
.tech-hit{font-size:.78rem;color:#7c3aed;background:#f5f2ff;border-radius:6px;padding:.3rem .55rem;margin-top:.25rem;line-height:1.5}
.tech-hit b{color:#5b21b6}
/* ── 移动端自适应 ── */
.nav-toggle{display:none}

  body{font-size:15px}
