<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型发布时序 · LLM Papers Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;padding:1.5rem 2rem;text-align:center}
header h1{font-size:1.8rem;margin-bottom:.3rem}
header p{opacity:.8;font-size:.85rem}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #302b63;background:white;font-weight:600;font-size:.82rem;text-decoration:none;color:#302b63}
.tab:hover,.tab.active{background:#302b63;color:white}
.page{max-width:1200px;margin:0 auto;padding:1rem}
/* ── toolbar ────────────────────────────────────── */
.toolbar{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:.8rem 1rem;margin-bottom:1rem}
.search-row{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.search-row input{flex:1;padding:.45rem .8rem;border:1px solid #ddd;border-radius:8px;font-size:.85rem;outline:none}
.search-row input:focus{border-color:#302b63}
.search-row .hint{font-size:.72rem;color:#aaa;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.chips + .chips{margin-top:.4rem}
.chips .lbl-t{font-size:.72rem;color:#999;margin-right:.1rem}
.chip{padding:.18rem .6rem;border-radius:1rem;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--c);color:var(--c);background:white;transition:all .15s;user-select:none}
.chip.on{background:var(--c);color:white}
.chip.all{border-color:#302b63;color:#302b63}
.chip.all.on{background:#302b63;color:white}
.chip.logo-chip{display:inline-flex;align-items:center;gap:.3rem}
/* ── logo ───────────────────────────────────────── */
.logo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;overflow:hidden;flex-shrink:0;font-style:normal;font-size:.66rem;font-weight:800;color:white;background:var(--c,#302b63)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:white}
.logo.lg{width:22px;height:22px;font-size:.75rem}
/* ── timeline chart ─────────────────────────────── */
.range-bar{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem}
.range-bar .lbl-t{font-size:.75rem;color:#999}
.range-btn{padding:.25rem .8rem;border:1.5px solid #302b63;border-radius:1rem;background:white;color:#302b63;font-size:.75rem;font-weight:600;cursor:pointer}
.range-btn.on{background:#302b63;color:white}
.chart-wrap{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:.8rem .5rem .5rem;overflow-x:auto;margin-bottom:1rem}
.chart{min-width:1150px;position:relative}
.axis{position:relative;height:18px;border-bottom:2px solid #e0e0e0;margin-left:92px;margin-right:8px}
.axis span{position:absolute;top:0;transform:translateX(-50%);font-size:.68rem;color:#999;white-space:nowrap}
.lane{display:flex;align-items:stretch;border-bottom:1px solid #f5f5f5}
.lane:nth-child(even){background:#fafafc}
.lane-name{flex:0 0 84px;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:.3rem;padding-right:8px;border-right:2px solid #e0e0e0;cursor:pointer}
.lane-name:hover{text-decoration:underline}
.lane-body{flex:1;position:relative;height:30px}
.lane-body.labels{height:64px}
.grid{position:absolute;top:0;bottom:0;border-left:1px solid #f2f2f6}
.node{position:absolute;top:50%;transform:translate(-50%,-50%);text-decoration:none;z-index:2}
.node .dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 auto;border:2px solid white;box-shadow:0 0 0 1px var(--c);transition:transform .15s}
.node.extra .dot{background:white}
.node .lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:600;color:var(--c);white-space:nowrap;display:none;bottom:12px}
.lane-body.labels .node .lbl{display:block}
.lane-body.labels .node.r1 .lbl{bottom:23px;opacity:.85}
.lane-body.labels .node.r2 .lbl{bottom:34px;opacity:.7}
.node:hover{z-index:5}
.node:hover .dot{transform:scale(1.6)}
.node:hover .lbl{display:block;background:white;padding:1px 4px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* ── series list ────────────────────────────────── */
.list-info{font-size:.78rem;color:#999;margin:.4rem 0 .6rem}
.series-card{background:white;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.6rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.series-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.series-head h3{font-size:.92rem}
.co-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;color:white;border-radius:.8rem;padding:.14rem .5rem .14rem .2rem;font-weight:700}
.cnt{font-size:.7rem;background:#302b63;color:white;border-radius:1rem;padding:.1rem .45rem}
.meta{font-size:.72rem;color:#999}
.paper-row{padding:.35rem 0;border-top:1px solid #f5f5f5}
.paper-row .p-meta{font-size:.72rem;color:#999;margin-bottom:.1rem}
.paper-row a{color:#333;text-decoration:none;font-size:.84rem;font-weight:600}
.paper-row a:hover{color:#302b63;text-decoration:underline}
.learn-note{font-size:.8rem;color:#2e7d32;background:#f1f8e9;border-radius:6px;padding:.3rem .55rem;margin-top:.25rem;line-height:1.5}
mark{background:#fff3b0;border-radius:2px;padding:0 1px}
.pagination{display:flex;align-items:center;justify-content:center;gap:.3rem;margin-top:1rem;flex-wrap:wrap}
.page-btn{padding:.35rem .65rem;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:.8rem;min-width:32px;text-align:center}
.page-btn:hover,.page-btn.active{background:#302b63;color:white;border-color:#302b63}
.page-btn.dots{cursor:default;border:none;background:none}
.loading,.empty{text-align:center;padding:3rem;color:#999}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.78rem;margin-top:1rem}
/* ── detail modal ───────────────────────────────── */
.modal-mask{position:fixed;inset:0;background:rgba(15,12,41,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2.5rem 1rem}
.modal-mask.open{display:flex}
.modal{background:white;border-radius:14px;max-width:780px;width:100%;padding:1.2rem 1.4rem;box-shadow:0 12px 48px rgba(0,0,0,.3);position:relative}
.modal-close{position:absolute;top:.7rem;right:.9rem;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#999}
.modal-close:hover{color:#333}
.modal-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem}
.modal-head h2{font-size:1.25rem}
.modal-date{font-size:.78rem;color:#999}
.arch{width:100%;border:1px solid #eee;border-radius:8px;margin:.7rem 0;background:#fafafa}
.arch-cap{font-size:.7rem;color:#aaa;text-align:center;margin-top:-.4rem;margin-bottom:.5rem}
.modal-note{font-size:.85rem;color:#2e7d32;background:#f1f8e9;border-radius:8px;padding:.5rem .8rem;line-height:1.6;margin:.5rem 0}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}
.btn{padding:.4rem .95rem;border-radius:1.5rem;border:1.5px solid #302b63;color:#302b63;font-size:.8rem;font-weight:600;text-decoration:none;transition:all .15s}
.btn:hover{background:#302b63;color:white}
.modal-papers{border-top:1px solid #f0f0f0;margin-top:.7rem;padding-top:.5rem}
.modal-papers h4{font-size:.85rem;color:#302b63;margin-bottom:.2rem}
</style>
</head>
<body>
<header>
  <h1>🧬 模型发布时序</h1>
  <p id="header-sub">主流厂商模型发布一览 · 数据来自 arXiv 追踪库</p>
</header>
<div class="tabs">
  <a class="tab" href="../">📄 论文追踪</a>
  <a class="tab active" href="./">🧬 模型时序</a>
  <a class="tab" href="../timeline/">📅 时间轴</a>
</div>
<div class="page">
  <div class="toolbar">
    <div class="search-row">
      <input type="text" id="q" placeholder="搜索公司 / 模型 / 论文标题 / 介绍..." oninput="query=this.value.trim();page=1;render()">
      <span class="hint" id="hint"></span>
    </div>
    <div class="chips" id="meta-chips"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="range-bar">
    <span class="lbl-t">时间范围</span>
    <button class="range-btn" data-r="6m" onclick="setRange('6m')">近半年</button>
    <button class="range-btn on" data-r="1y" onclick="setRange('1y')">近一年</button>
    <button class="range-btn" data-r="2y" onclick="setRange('2y')">近两年</button>
    <button class="range-btn" data-r="all" onclick="setRange('all')">全部</button>
    <span class="lbl-t" style="margin-left:auto">● arXiv 论文　○ 官方发布（报告/仓库/博客）</span>
  </div>
  <div class="chart-wrap"><div class="chart" id="chart"><div class="loading">加载中...</div></div></div>
  <div class="list-info" id="list-info"></div>
  <div id="list"></div>
  <div id="pager"></div>
</div>
<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="modal"></div>
</div>
<footer>Curated by Kevin · Data from arXiv · <a href="https://github.com/Xplore-LAB" style="color:#302b63">GitHub</a></footer>
<script>
const COLORS={OpenAI:'#10a37f',Google:'#4285f4',Meta:'#0866ff',Anthropic:'#d97706',Mistral:'#7c3aed',Qwen:'#dc2626',DeepSeek:'#0891b2',Baidu:'#e11d48',Zhipu:'#0d9488',Moonshot:'#4f46e5',MiniMax:'#a21caf',Xiaomi:'#ff6900',Tencent:'#0052d9',Microsoft:'#107c10',Nvidia:'#76b900',IBM:'#0f62fe',AllenAI:'#ea580c',TII:'#8b5cf6',xAI:'#1f2937','01.AI':'#14b8a6',Baichuan:'#f59e0b',InternLM:'#6366f1',Databricks:'#ff3621',AI21:'#d946ef',LG:'#a50034',Cohere:'#39594d',ByteDance:'#1e37ff',StepFun:'#6d28d9',Meituan:'#eab308',AntGroup:'#1677ff',ModelBest:'#84cc16',Huawei:'#c7000b',Skywork:'#0ea5e9',SenseTime:'#0284c7'};
// region: cn/us/other ; open: open/mixed/closed ; dom: logo domain
const META={
  OpenAI:{region:'us',open:'mixed',dom:'openai.com'},
  Google:{region:'us',open:'mixed',dom:'google.com'},
  Meta:{region:'us',open:'open',dom:'meta.com'},
  Anthropic:{region:'us',open:'closed',dom:'anthropic.com'},
  Mistral:{region:'other',open:'open',dom:'mistral.ai',flag:'🇫🇷'},
  Qwen:{region:'cn',open:'open',dom:'qwen.ai'},
  DeepSeek:{region:'cn',open:'open',dom:'deepseek.com'},
  Baidu:{region:'cn',open:'open',dom:'baidu.com'},
  Zhipu:{region:'cn',open:'open',dom:'zhipuai.cn'},
  Moonshot:{region:'cn',open:'open',dom:'moonshot.cn'},
  MiniMax:{region:'cn',open:'open',dom:'minimax.io'},
  Xiaomi:{region:'cn',open:'open',dom:'mi.com'},
  Tencent:{region:'cn',open:'open',dom:'tencent.com'},
  Microsoft:{region:'us',open:'open',dom:'microsoft.com'},
  Nvidia:{region:'us',open:'open',dom:'nvidia.com'},
  IBM:{region:'us',open:'open',dom:'ibm.com'},
  AllenAI:{region:'us',open:'open',dom:'allenai.org'},
  TII:{region:'other',open:'open',dom:'tii.ae',flag:'🇦🇪'},
  xAI:{region:'us',open:'mixed',dom:'x.ai'},
  '01.AI':{region:'cn',open:'open',dom:'01.ai'},
  Baichuan:{region:'cn',open:'open',dom:'baichuan-ai.com'},
  InternLM:{region:'cn',open:'open',dom:'shlab.org.cn'},
  Databricks:{region:'us',open:'open',dom:'databricks.com'},
  AI21:{region:'other',open:'open',dom:'ai21.com',flag:'🇮🇱'},
  LG:{region:'other',open:'open',dom:'lg.com',flag:'🇰🇷'},
  Cohere:{region:'other',open:'open',dom:'cohere.com',flag:'🇨🇦'},
  ByteDance:{region:'cn',open:'mixed',dom:'bytedance.com'},
  StepFun:{region:'cn',open:'open',dom:'stepfun.com'},
  Meituan:{region:'cn',open:'open',dom:'meituan.com'},
  AntGroup:{region:'cn',open:'open',dom:'antgroup.com'},
  ModelBest:{region:'cn',open:'open',dom:'modelbest.cn'},
  Huawei:{region:'cn',open:'mixed',dom:'huawei.com'},
  Skywork:{region:'cn',open:'open',dom:'skywork.ai'},
  SenseTime:{region:'cn',open:'mixed',dom:'sensetime.com'},
};
const REGION_LABEL={cn:'🇨🇳 中国',us:'🇺🇸 美国',other:'🌍 其他'};
const OPEN_LABEL={open:'🔓 开放权重',mixed:'🔓 混合',closed:'🔒 闭源'};
function flagOf(co){const m=META[co];return m?(m.flag||(m.region==='cn'?'🇨🇳':'🇺🇸')):'';}
function openTag(co){const m=META[co];return m?({open:'🔓',mixed:'🔓',closed:'🔒'}[m.open]):'';}

const color=c=>COLORS[c]||'#302b63';
// main code/weights repo per company (for the detail modal button)
const COMPANY_GH={
  OpenAI:'https://github.com/openai/gpt-oss',
  Google:'https://github.com/google-deepmind/gemma',
  Meta:'https://github.com/meta-llama/llama3',
  Mistral:'https://github.com/mistralai/mistral-inference',
  Qwen:'https://github.com/QwenLM/Qwen3',
  DeepSeek:'https://github.com/deepseek-ai/DeepSeek-V3',
  Baidu:'https://github.com/PaddlePaddle/ERNIE',
  Zhipu:'https://github.com/THUDM/GLM-4',
  Moonshot:'https://github.com/MoonshotAI/Kimi-K2',
  MiniMax:'https://github.com/MiniMax-AI/MiniMax-01',
  Xiaomi:'https://github.com/XiaomiMiMo/MiMo',
  Tencent:'https://github.com/Tencent/Tencent-Hunyuan-Large',
  Microsoft:'https://github.com/microsoft/Phi-3CookBook',
  Nvidia:'https://github.com/NVIDIA/NeMo',
  IBM:'https://github.com/ibm-granite',
  AllenAI:'https://github.com/allenai/OLMo',
  xAI:'https://github.com/xai-org/grok-1',
  '01.AI':'https://github.com/01-ai/Yi',
  Baichuan:'https://github.com/baichuan-inc/Baichuan2',
  InternLM:'https://github.com/InternLM/InternLM',
  Databricks:'https://github.com/databricks/dbrx',
  AI21:'https://github.com/ai21labs/Jamba',
  LG:'https://github.com/LG-AI-EXAONE',
  TII:'https://huggingface.co/tiiuae',
  Cohere:'https://huggingface.co/cohereforai',
  ByteDance:'https://github.com/ByteDance-Seed/seed-oss',
  StepFun:'https://github.com/stepfun-ai',
  Meituan:'https://github.com/meituan-longcat',
  AntGroup:'https://huggingface.co/inclusionAI',
  ModelBest:'https://github.com/OpenBMB/MiniCPM',
  Skywork:'https://github.com/SkyworkAI',
};
const dkey=m=>m.replace(/[\s\-.]/g,'').toLowerCase();
const nkey=(co,model)=>co+'|'+dkey(model);
const PAGE_SIZE=12;
let DATA=null, PDFS=new Set(), FIGS={}, NODE_MAP={}, SERIES_MAP={}, SEL=new Set(), REGION=null, OPEN=null, RANGE='1y', query='', page=1;

Promise.all([
  fetch('../models.json?t='+Date.now()).then(r=>r.json()),
  fetch('../pdfs-index.json?t='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]),
  fetch('../models-figures.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([data,pdfIds,figs])=>{
  DATA=data;
  PDFS=new Set(pdfIds);
  FIGS=figs;
  DATA.models.forEach(m=>{NODE_MAP[nkey(m.company,m.model)]=m;});
  DATA.groups.forEach(g=>g.series.forEach(s=>{SERIES_MAP[nkey(g.company,s.model)]=s;}));
  const n=data.models.length;
  document.getElementById('header-sub').textContent=`主流厂商模型发布一览 · ${n} 个模型系列 · 数据来自 arXiv 追踪库`;
  renderChips();
  render();
}).catch(()=>{
  document.getElementById('chart').innerHTML='<div class="empty">数据加载失败，请刷新重试</div>';
});

function logoHTML(co,cls){
  const m=META[co]||{};
  const letter=co.replace(/[^A-Za-z]/g,'')[0]||'?';
  const src=m.dom?`https://www.google.com/s2/favicons?domain=${m.dom}&sz=64`:'';
  return `<i class="logo ${cls||''}" style="--c:${color(co)}">${letter}${src?`<img src="${src}" onerror="this.remove()" loading="lazy">`:''}</i>`;
}

function allCompanies(){
  const s=new Set(DATA.groups.map(g=>g.company));
  DATA.models.forEach(m=>s.add(m.company));
  return [...s];
}
function activeCompanies(){
  let base=SEL.size?[...SEL]:allCompanies();
  if(REGION)base=base.filter(co=>(META[co]||{}).region===REGION);
  if(OPEN)base=base.filter(co=>(META[co]||{}).open===OPEN);
  return base;
}
function toggleCompany(co){
  if(SEL.has(co))SEL.delete(co);else SEL.add(co);
  page=1;renderChips();render();
}
function clearSel(){SEL.clear();page=1;renderChips();render();}
function setRegion(r){REGION=REGION===r?null:r;page=1;renderChips();render();}
function setOpen(o){OPEN=OPEN===o?null:o;page=1;renderChips();render();}
function setRange(r){
  RANGE=r;
  document.querySelectorAll('.range-btn').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  renderChart();
}

function renderChips(){
  document.getElementById('meta-chips').innerHTML=
    '<span class="lbl-t">分类</span>'+
    Object.entries(REGION_LABEL).map(([k,v])=>`<span class="chip all ${REGION===k?'on':''}" style="--c:#302b63" onclick="setRegion('${k}')">${v}</span>`).join('')+
    '<span class="lbl-t" style="margin-left:.4rem">开放度</span>'+
    Object.entries(OPEN_LABEL).map(([k,v])=>`<span class="chip all ${OPEN===k?'on':''}" style="--c:#302b63" onclick="setOpen('${k}')">${v}</span>`).join('');
  const bar=document.getElementById('chips');
  const all=`<span class="chip all ${SEL.size?'':'on'}" style="--c:#302b63" onclick="clearSel()">全部公司</span>`;
  const seriesCount={};
  DATA.groups.forEach(g=>{seriesCount[g.company]=g.series.length;});
  const order=[...new Set([...DATA.groups.map(g=>g.company),...DATA.models.map(m=>m.company)])];
  bar.innerHTML='<span class="lbl-t">公司</span>'+all+order.map(co=>{
    const on=SEL.has(co);
    return `<span class="chip logo-chip ${on?'on':''}" style="--c:${color(co)}" onclick="toggleCompany('${co}')">${logoHTML(co)}${co} ${seriesCount[co]||0}</span>`;
  }).join('');
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(s){
  if(!query)return esc(s);
  const q=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(s).replace(new RegExp(`(${q})`,'gi'),'<mark>$1</mark>');
}

function render(){renderChart();renderList();}

function rangeStart(){
  const t1=Date.now(), day=86400000;
  if(RANGE==='6m')return t1-183*day;
  if(RANGE==='1y')return t1-365*day;
  if(RANGE==='2y')return t1-730*day;
  return Date.parse(DATA.models.find(m=>m.date&&m.date.length>=10).date);
}

function makeTicks(t0,t1){
  const span=(t1-t0)/86400000, out=[];
  const d=new Date(t0);
  if(span>900){
    for(let y=d.getFullYear();y<=new Date(t1).getFullYear();y++)out.push([String(y),Date.parse(y+'-01-01')]);
  }else if(span>400){
    let y=d.getFullYear(),q=Math.floor(d.getMonth()/3)+1;
    while(Date.parse(`${y}-${String((q-1)*3+1).padStart(2,'0')}-01`)<=t1){
      out.push([`${y}Q${q}`,Date.parse(`${y}-${String((q-1)*3+1).padStart(2,'0')}-01`)]);
      q++;if(q>4){q=1;y++;}
    }
  }else{
    let y=d.getFullYear(),m=d.getMonth();
    while(Date.parse(`${y}-${String(m+1).padStart(2,'0')}-01`)<=t1){
      out.push([`${String(m+1).padStart(2,'0')}月`,Date.parse(`${y}-${String(m+1).padStart(2,'0')}-01`)]);
      m++;if(m>11){m=0;y++;}
    }
  }
  return out.filter(([,t])=>t>=t0&&t<=t1);
}

function renderChart(){
  const active=activeCompanies();
  const t0=rangeStart(), t1=Date.now();
  const inRange=m=>m.date&&m.date.length>=10&&Date.parse(m.date)>=t0;
  const models=DATA.models.filter(m=>inRange(m)&&active.includes(m.company));
  const lanes=active.filter(co=>models.some(m=>m.company===co)||SEL.has(co));
  const showLabels=lanes.length<=6;
  const X=d=>Math.min(99.3,Math.max(.7,(Date.parse(d)-t0)/(t1-t0)*100));
  const ticks=makeTicks(t0,t1);
  let html='<div class="axis">'+ticks.map(([l,x])=>`<span style="left:${X(new Date(x).toISOString().slice(0,10))}%">${l}</span>`).join('')+'</div>';
  if(!lanes.length){
    html+='<div class="empty">当前筛选条件下，该时间范围内没有模型发布 📭</div>';
  }
  html+=lanes.map(co=>{
    const nodes=models.filter(m=>m.company===co).map((m,i)=>{
      const r=showLabels?` r${i%3}`:'';
      const tip=`${m.model} · ${m.date}\n${m.title||m.note||''}\n点击查看详情`;
      return `<a class="node${r}${m.extra?' extra':''}" style="left:${X(m.date)}%;--c:${color(co)}" href="javascript:void(0)" onclick="showDetail('${nkey(m.company,m.model)}')" title="${tip}"><span class="lbl">${m.model}</span><span class="dot"></span></a>`;
    }).join('');
    const grid=ticks.map(([,x])=>`<span class="grid" style="left:${X(new Date(x).toISOString().slice(0,10))}%"></span>`).join('');
    return `<div class="lane"><div class="lane-name" style="color:${color(co)}" title="点击只看 ${co}" onclick="toggleCompany('${co}')">${logoHTML(co)}${co}</div><div class="lane-body ${showLabels?'labels':''}">${grid}${nodes}</div></div>`;
  }).join('');
  document.getElementById('chart').innerHTML=html;
  document.getElementById('hint').textContent=showLabels?'':'提示：选 ≤6 家公司可显示全部模型名，悬停节点看详情';
}

function latestDate(s){return s.papers.map(p=>p.date||'').sort().pop()||'';}
function matchSeries(s,q){
  q=q.toLowerCase();
  if(s.company.toLowerCase().includes(q)||s.model.toLowerCase().includes(q))return true;
  return s.papers.some(p=>p.title.toLowerCase().includes(q)||(p.note||'').includes(q));
}
function matchPaper(p,q){
  q=q.toLowerCase();
  return p.title.toLowerCase().includes(q)||(p.note||'').includes(q)||p.id.includes(q);
}

function renderList(){
  const active=activeCompanies();
  let series=[];
  DATA.groups.forEach(g=>{
    if(!active.includes(g.company))return;
    g.series.forEach(s=>series.push({company:g.company,model:s.model,papers:s.papers}));
  });
  if(query)series=series.filter(s=>matchSeries(s,query));
  series.sort((a,b)=>latestDate(b).localeCompare(latestDate(a)));
  const total=series.length;
  const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>totalPages)page=totalPages;
  const slice=series.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  document.getElementById('list-info').textContent=`共 ${total} 个模型系列 · 第 ${page}/${totalPages} 页`;
  document.getElementById('list').innerHTML=slice.length?slice.map(seriesCard).join(''):'<div class="empty">没有匹配的模型 📭</div>';
  renderPager(totalPages);
}

function seriesCard(s){
  const papers=query?s.papers.filter(p=>matchPaper(p,query)||s.model.toLowerCase().includes(query.toLowerCase())):s.papers;
  const dates=s.papers.map(p=>p.date).filter(Boolean).sort();
  return `<div class="series-card">
    <div class="series-head">
      <span class="co-chip" style="background:${color(s.company)}">${logoHTML(s.company)}${s.company} ${flagOf(s.company)}</span>
      <h3 style="color:${color(s.company)}">${hl(s.model)}</h3>
      <span class="cnt">${s.papers.length} 篇</span>
      <span class="meta">${dates[0]||''} ~ ${dates[dates.length-1]||''}</span>
      <span class="meta" style="cursor:pointer;color:#302b63;text-decoration:underline" onclick="showDetail('${nkey(s.company,s.model)}')">🔍 详情</span>
    </div>
    ${papers.map(paperRow).join('')||'<div style="font-size:.8rem;color:#bbb">系列名匹配，无标题命中的论文</div>'}
  </div>`;
}

function paperRow(p){
  return `<div class="paper-row">
    <div class="p-meta">📅 ${p.date||''} · <a href="https://arxiv.org/abs/${p.id}" target="_blank" style="font-weight:400;color:#302b63">arXiv:${p.id} ↗</a>${PDFS.has(p.id)?` · <a href="https://raw.githubusercontent.com/Xplore-LAB/Xplore-LAB.github.io/pdfs/pdfs/${p.id}.pdf" target="_blank" style="font-weight:400;color:#302b63">📄 PDF</a>`:''}</div>
    <a href="https://arxiv.org/abs/${p.id}" target="_blank">${hl(p.title)}</a>
    ${p.note?`<div class="learn-note">📌 ${hl(p.note)}</div>`:''}
  </div>`;
}

function renderPager(totalPages){
  if(totalPages<=1){document.getElementById('pager').innerHTML='';return;}
  const show=new Set([1,totalPages,page,page-1,page+1,page-2,page+2].filter(p=>p>=1&&p<=totalPages));
  const sorted=[...show].sort((a,b)=>a-b);
  let html='<div class="pagination">';
  if(page>1)html+=`<button class="page-btn" onclick="goPage(${page-1})">‹</button>`;
  let prev=0;
  sorted.forEach(p=>{
    if(p-prev>1)html+='<span class="page-btn dots">…</span>';
    html+=`<button class="page-btn ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`;
    prev=p;
  });
  if(page<totalPages)html+=`<button class="page-btn" onclick="goPage(${page+1})">›</button>`;
  html+='</div>';
  document.getElementById('pager').innerHTML=html;
}
function goPage(p){
  page=p;
  renderList();
  document.getElementById('list-info').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── detail modal ──────────────────────────────────
function showDetail(key){
  const m=NODE_MAP[key];
  if(!m)return;
  const s=SERIES_MAP[key];
  const papers=s?s.papers:[];
  const fig=FIGS[key];
  const gh=COMPANY_GH[m.company];
  const reportUrl=m.url||(m.id?`https://arxiv.org/abs/${m.id}`:'');
  const buttons=[
    reportUrl?`<a class="btn" href="${reportUrl}" target="_blank">📑 技术报告/官方发布 ↗</a>`:'',
    gh?`<a class="btn" href="${gh}" target="_blank">💻 代码/权重 ↗</a>`:'',
    (m.id&&PDFS.has(m.id))?`<a class="btn" href="https://raw.githubusercontent.com/Xplore-LAB/Xplore-LAB.github.io/pdfs/pdfs/${m.id}.pdf" target="_blank">📄 本地 PDF</a>`:'',
    m.id?`<a class="btn" href="https://arxiv.org/abs/${m.id}" target="_blank">arXiv:${m.id} ↗</a>`:'',
  ].filter(Boolean).join('');
  document.getElementById('modal').innerHTML=`
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div class="modal-head">
      ${logoHTML(m.company,'lg')}
      <h2 style="color:${color(m.company)}">${esc(m.model)}</h2>
      <span class="co-chip" style="background:${color(m.company)}">${m.company} ${flagOf(m.company)}</span>
      <span class="meta">${openTag(m.company)} ${{open:'开放权重',mixed:'混合开放',closed:'闭源'}[(META[m.company]||{}).open]||''}</span>
    </div>
    <div class="modal-date">📅 发布日期 ${m.date||'未知'}${papers.length?` · 追踪到 ${papers.length} 篇相关论文`:''}${m.extra?' · 官方发布（暂无 arXiv 论文）':''}</div>
    ${fig?`<img class="arch" src="${fig}" alt="${esc(m.model)} 结构图" loading="lazy"><div class="arch-cap">模型结构图 · 截自技术报告</div>`:''}
    ${m.note?`<div class="modal-note">📌 ${esc(m.note)}</div>`:''}
    ${m.title?`<div style="font-size:.82rem;color:#666;margin:.3rem 0">📄 ${esc(m.title)}</div>`:''}
    <div class="btn-row">${buttons}</div>
    ${papers.length?`<div class="modal-papers"><h4>系列论文（${papers.length}）</h4>${papers.map(paperRow).join('')}</div>`:''}
  `;
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
</script>
