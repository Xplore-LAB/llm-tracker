<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4efe0;color:#262c36;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:repeating-linear-gradient(0deg,rgba(55,65,79,.05) 0 1px,transparent 1px 30px)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(640px 420px at 12% 6%,rgba(156,47,47,.05),transparent 60%),radial-gradient(720px 520px at 88% 30%,rgba(55,65,79,.06),transparent 60%)}
header{background:linear-gradient(160deg,#232a34,#37414f 55%,#232a34);color:#f2ead6;padding:2.2rem 2rem 1.8rem;text-align:center;position:relative;z-index:1;border-bottom:4px double #c8b98a}
header h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:2rem;letter-spacing:.16em;text-shadow:0 2px 8px rgba(0,0,0,.35)}
header p{opacity:.75;font-size:.85rem;margin-top:.4rem;letter-spacing:.12em;color:#d5cdb4}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:rgba(244,239,224,.94);backdrop-filter:blur(8px);border-bottom:1px solid #d9cfae;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #37414f;background:#faf6ea;font-weight:600;font-size:.82rem;text-decoration:none;color:#37414f;transition:all .2s}
.tab:hover,.tab.active{background:#37414f;color:#f2ead6}
.fbar{position:sticky;top:3.4rem;z-index:9;background:rgba(244,239,224,.95);backdrop-filter:blur(8px);padding:.7rem 1rem .55rem;border-bottom:1px solid #d9cfae;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.fsearch{width:100%;max-width:420px;padding:.5rem 1rem;border:1.5px solid #b9ab7f;border-radius:1.5rem;background:#faf6ea;font-size:.86rem;outline:none;color:#262c36}
.fsearch:focus{border-color:#9c2f2f}
.fchips{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.fchip{font-size:.72rem;font-weight:600;padding:.22rem .7rem;border-radius:1rem;border:1.5px solid var(--c);color:var(--c);background:#faf6ea;cursor:pointer;user-select:none;transition:all .15s}
.fchip.on{background:var(--c);color:#f8f4e4}
.fchip.all{border-color:#37414f;color:#37414f}
.fchip.all.on{background:#37414f;color:#f2ead6}
.stats{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:.9rem 1rem .1rem;position:relative;z-index:1}
.stat{background:#faf6ea;border:1px solid #d9cfae;border-radius:1rem;padding:.35rem 1rem;font-size:.78rem;color:#6d6552;box-shadow:0 2px 8px rgba(55,65,79,.07)}
.stat b{color:#37414f;font-size:.95rem;margin-right:.15rem}
.grid{max-width:1060px;margin:1rem auto 3rem;padding:0 1.2rem;position:relative;z-index:1}.glossary-group{scroll-margin-top:10rem;margin:0 0 1.7rem}.group-head{display:flex;align-items:flex-end;gap:.8rem;padding:.7rem .85rem .6rem;border-bottom:2px solid var(--c);margin-bottom:.7rem;background:linear-gradient(90deg,rgba(255,251,240,.9),transparent)}.group-mark{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:Georgia,'Songti SC',serif;font-weight:700;font-size:.82rem}.group-title{font-family:Georgia,'Songti SC',serif;font-size:1.1rem;font-weight:700;color:#37414f}.group-count{font-size:.7rem;color:var(--c);font-weight:700}.group-intro{margin-left:auto;max-width:540px;font-size:.74rem;color:#786e5c;line-height:1.55}.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.8rem}
.term{background:#fbf7ec;border:1px solid #ddd2b2;border-radius:12px;box-shadow:0 4px 14px rgba(55,65,79,.08),inset 3px 0 0 var(--c);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;align-self:start}
.term.hash-hit{box-shadow:0 0 0 3px rgba(156,47,47,.5),0 4px 14px rgba(55,65,79,.08),inset 3px 0 0 var(--c)}
.term:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(55,65,79,.15),inset 3px 0 0 var(--c)}
.term-head{padding:.8rem 1rem .65rem}
.term-top{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.term-name{font-family:Georgia,'Songti SC',serif;font-size:1.02rem;font-weight:700;color:#9c2f2f}
.term-en{font-size:.72rem;font-style:italic;color:#8a7f63}
.term-cat{margin-left:auto;font-size:.64rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:.5rem;padding:.1rem .45rem;white-space:nowrap}
.term-def{font-size:.79rem;color:#55503e;line-height:1.6;margin-top:.35rem}
.term-body{display:none;padding:0 1rem .85rem;border-top:1px solid #e5dcc0}
.term.open .term-body{display:block}
.term-detail{font-size:.79rem;color:#4c4738;line-height:1.7;margin-top:.55rem}
.term-link{display:inline-block;margin-top:.45rem;font-size:.74rem;font-weight:700;color:#9c2f2f;text-decoration:none;border-bottom:1px dashed #9c2f2f}
.term-link:hover{opacity:.75}
.term-hint{text-align:right;font-size:.64rem;color:#b3a87f;padding:0 1rem .5rem}
.term.open .term-hint{display:none}
.empty{text-align:center;color:#8a7f63;padding:3rem;grid-column:1/-1;font-size:.86rem}
footer{text-align:center;padding:1.5rem;color:#97906f;font-size:.78rem;position:relative;z-index:1}
footer a{color:#37414f}
html.dark body{background:#1d2129;color:#d9d2bd}
html.dark body::before{background-image:repeating-linear-gradient(0deg,rgba(217,210,189,.04) 0 1px,transparent 1px 30px)}
html.dark header{background:linear-gradient(160deg,#14181f,#232b38 55%,#14181f);border-bottom-color:#5c5340}
html.dark .tabs{background:rgba(29,33,41,.94);border-color:#3d4450}
html.dark .tab{background:#252b36;color:#c9c2ab;border-color:#4a5364}
html.dark .tab:hover,html.dark .tab.active{background:#4a5364;color:#f2ead6}
html.dark .fbar{background:rgba(29,33,41,.95);border-color:#3d4450}
html.dark .fsearch{background:#14181f;border-color:#3d4450;color:#d9d2bd}
html.dark .fchip{background:#252b36}
html.dark .fchip.on{color:#f8f4e4}
html.dark .stat,html.dark .term{background:#252b36;border-color:#3d4450}
html.dark .group-head{background:linear-gradient(90deg,rgba(37,43,54,.95),transparent)}html.dark .group-title{color:#d9d2bd}html.dark .group-intro{color:#b8b09a}
html.dark .stat{color:#a39c83}
html.dark .stat b{color:#d9d2bd}
html.dark .term-name{color:#d98a8a}
html.dark .term-def,html.dark .term-detail{color:#b8b09a}
html.dark .term-body{border-top-color:#3d4450}
html.dark .term-link{color:#d98a8a;border-bottom-color:#d98a8a}
@media(max-width:700px){.group-grid{grid-template-columns:1fr}.group-head{align-items:flex-start;gap:.55rem;flex-wrap:wrap}.group-intro{margin-left:0;max-width:none;width:100%}}
/* ── 移动端导航折叠 ── */
.nav-toggle{display:none}
@media(max-width:768px){
  header{padding:1.3rem 1rem 1.1rem}
  header h1{font-size:1.45rem;letter-spacing:.1em}
  header p{font-size:.76rem}
  .nav-toggle{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.7rem auto .3rem;padding:.5rem 1.4rem;border-radius:2rem;border:2px solid #37414f;background:#faf6ea;color:#37414f;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit;position:sticky;top:0;z-index:11;box-shadow:0 2px 8px rgba(55,65,79,.15)}
  .tabs{display:none;flex-direction:column;align-items:stretch;gap:.4rem;padding:.7rem;position:static}
  .tabs.open{display:flex}
  .tab{text-align:center}
  .fbar{top:0;padding:.6rem .8rem .5rem}
  .fsearch{font-size:.9rem}
  .grid{padding:0 .7rem}
  html.dark .nav-toggle{background:#252b36;color:#c9c2ab;border-color:#4a5364}
  .fbar{top:0;padding:.5rem .7rem .45rem;gap:.4rem}
  .fsearch{font-size:.85rem;padding:7px 9px}
  .fchips{gap:.3rem}
  .fchips .chip{font-size:.66rem;padding:.15rem .5rem}
  .stats{padding:.6rem .7rem .1rem;gap:.3rem}
  .stat{font-size:.68rem;padding:.22rem .6rem}
  .grid{padding:0 .7rem;gap:.55rem;grid-template-columns:1fr}
  .term{padding:.8rem .9rem}
  .term h3{font-size:.95rem}
  .term-top{flex-wrap:wrap;gap:.3rem}

  header p,header h1,.hero p,.hero h1,.hero .sub,.hero .note,.toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .kicker,.ch-hero .meta{word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .era-card p,.era-card li,.panel p,.panel li,.term p,.term li,.entry p,.entry li,.card p,.stat{word-break:break-all;overflow-wrap:break-word}
  .badge,.kv .k,.kv .l,.stat,.fchip{word-break:break-all}
  .tbl-wrap,.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl{font-size:.78rem;min-width:480px}
  header p{word-break:break-all;line-height:1.5;padding:0 .4rem}
  .fbar{top:0;padding:.5rem .7rem .4rem;gap:.35rem}
  .fsearch{font-size:.82rem;padding:6px 9px}
  .fchips{gap:.25rem;flex-wrap:wrap}
  .fchips .chip{font-size:.62rem;padding:.12rem .5rem;word-break:break-all}
  .stats{padding:.55rem .7rem .1rem;gap:.25rem}
  .stat{font-size:.64rem;padding:.2rem .55rem}
  .grid{padding:0 .7rem;gap:.5rem;grid-template-columns:1fr}
  .term{padding:.75rem .85rem}
  .term h3{font-size:.92rem}
  .term p{font-size:.86rem;line-height:1.6}
  .term-top{flex-wrap:wrap;gap:.3rem}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  header h1,header p,.hero h1,.hero p,.hero .sub,.hero .note{max-width:100%;word-break:break-all;overflow-wrap:break-word;white-space:normal;line-height:1.5;box-sizing:border-box}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}

  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  header h1{font-size:1.05rem !important;letter-spacing:0 !important}

  #header-sub,#header-fresh{font-size:.6rem !important;line-height:1.5 !important;letter-spacing:0 !important;padding:0 .4rem !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important}
