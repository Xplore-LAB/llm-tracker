<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

原地、不稳定——通用首选。<b>归并</b>：稳定\x20n\x20log\x20n、需\x20O(n)\x20空间——<b>链表排序首选</b>（链表归并不需额外空间），也是求逆序对的载体。<b>堆排</b>：n\x20log\x20n、原地、不稳定——适合\x20TopK\x20和优先队列。<b>计数/桶排</b>：值域小时可到\x20O(n)。稳定性含义：相等元素的相对顺序不变——多字段排序（先按\x20A\x20再按\x20B）时必须用稳定排序。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Python\x20的\x20sorted\x20是什么？”——Timsort，归并+插入的混合，<b>稳定</b>；“什么时候必须稳定？”——多轮排序保留前一轮结果时。““'},{'c':'code','s':0x2,'lv':'⭐','q':_0x555838(0x272),'a':_0x555838(0x24a)},{'c':_0x555838(0x16b),'s':0x2,'lv':'⭐','q':_0x555838(0x2c4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':_0x555838(0x16b),'s':0x2,'lv':'🔥','q':_0x555838(0x144),'a':_0x555838(0x344)},{'c':_0x555838(0x16b),'s':0x2,'lv':'🔥','q':_0x555838(0x216),'a':_0x555838(0x1c3)},{'c':'code','s':0x3,'lv':'⭐','q':_0x555838(0x39c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':'code','s':0x3,'lv':'🔥','q':'单调栈与单调队列','a':_0x555838(0x1d4)},{'c':_0x555838(0x16b),'s':0x3,'lv':'🔥','q':'前缀和、差分与哈希优化','a':_0x555838(0x37a)},{'c':_0x555838(0x16b),'s':0x3,'lv':'🔥','q':'区间问题：合并、插入、调度','a':_0x555838(0x239)},{'c':_0x555838(0x16b),'s':0x4,'lv':'⭐','q':_0x555838(0x276),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（先说四步再写代码）</span><br>①\x20<b>状态定义</b>（dp[i]\x20表示什么，说清楚）②\x20<b>转移方程</b>\x20③\x20<b>初始化与边界</b>\x20④\x20<b>遍历顺序</b>。<b>0-1\x20背包</b>：dp[i][w]=max(不选\x20i,\x20选\x20i)，空间压成一维时<b>容量必须逆序遍历</b>（防同一物品被重复选）。<b>编辑距离（72）</b>：dp[i][j]=word1\x20前\x20i\x20个变成\x20word2\x20前\x20j\x20个的最小操作数；字符相等取\x20dp[i−1][j−1]，否则\x20min(插入,\x20删除,\x20替换)+1。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么想到状态定义？”——从“最后一步怎么来的”倒推；“其他高频？”——最长递增子序列（300，含二分优化\x20O(n\x20log\x20n)）、最长公共子序列、打家劫舍、股票买卖系列。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试时<b>先口述四步再动手写</b>——直接闷头写代码，写错了面试官也不知道你会不会。““'},{'c':_0x555838(0x16b),'s':0x4,'lv':'🔥','q':_0x555838(0x2cc),'a':_0x555838(0x17f)},{'c':_0x555838(0x16b),'s':0x5,'lv':'🔥','q':_0x555838(0x225),'a':_0x555838(0x27c)},{'c':'code','s':0x5,'lv':'💎','q':_0x555838(0x1d3),'a':_0x555838(0x1da)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x555838(0x186),'a':_0x555838(0x1b3)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x555838(0x366),'a':_0x555838(0x27e)},{'c':'ml','s':0x0,'lv':'⭐','q':'Adam\x20为什么有效？显存代价是多少？','a':_0x555838(0x37c)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x555838(0x197),'a':_0x555838(0x2fa)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x555838(0x35a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省显存加速，<b>权重主副本和优化器状态保\x20fp32</b>\x20保精度。<b>fp16</b>：尾数多、动态范围小\x20→\x20易上溢/下溢，必须配\x20<b>loss\x20scaling</b>（放大\x20loss\x20让小梯度不被舍入吃掉）。<b>bf16</b>：指数位与\x20fp32\x20相同（动态范围一样大）、尾数少\x20→\x20<b>基本不溢出、免\x20loss\x20scaling</b>，是当前大模型训练主流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“精度低了效果会掉吗？”——训练几乎无损（因为主副本是\x20fp32）；“fp8\x20呢？”——H100\x20起支持，训练已有实践，但需要更精细的缩放策略。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x555838(0x17a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x555838(0x136),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>BN</b>\x20沿\x20batch\x20维归一化\x20→\x20依赖\x20batch\x20统计量，推理要用滑动平均，batch\x20小或序列变长时不稳定，NLP\x20变长序列场景直接失效。<b>LN</b>\x20沿特征维对每个样本独立归一化\x20→与\x20batch\x20无关，<b>训练和推理行为完全一致</b>。进阶：<b>Pre-LN</b>（LN\x20放在残差分支之前）训练稳定性好、现代\x20LLM\x20标配；<b>RMSNorm</b>\x20去掉减均值只做缩放，计算更省、效果相当，Llama/Qwen\x20在用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Pre-LN和\x20Post-LN\x20差别？”——Post-LN\x20极限性能略好但需要小心\x20warmup\x20否则难收敛；Pre-LN\x20梯度更稳、深层可训，工业上选稳定；“归一化到底在解决什么？”——稳定每层输入分布、平滑损失曲面，让更大\x20lr\x20可用。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':'激活函数：ReLU\x20/\x20GELU\x20/\x20SiLU\x20/\x20SwiGLU','a':_0x555838(0x24d)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x555838(0x1bf),'a':_0x555838(0x38a)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x555838(0x14a),'a':_0x555838(0x358)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x555838(0x385),'a':_0x555838(0x362)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x555838(0x361),'a':_0x555838(0x2bb)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x555838(0x205),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x555838(0x21d)},{'c':'ml','s':0x3,'lv':'⭐','q':'数据并行\x20/\x20张量并行\x20/\x20流水线并行\x20/\x20ZeRO','a':_0x555838(0x350)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x555838(0x2a7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x555838(0x26e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>目的：用更低位宽表示权重（和/或激活）以省显存、提吞吐。<b>训练后量化\x20PTQ</b>（主流）：<b>GPTQ</b>逐层最小化量化误差、需要校准集；<b>AWQ</b>\x20识别并保护“重要通道”（激活幅值大的权重），精度损失更小、推理更快。<b>NF4</b>（QLoRA\x20用）针对正态分布权重设计。<b>W8A8</b>\x20指权重和激活都量化到\x208bit，吞吐收益更大但精度风险更高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“INT4\x20掉点吗？”——小模型掉得明显，大模型相对耐受；关键看任务，结构化/推理任务更敏感；“什么时候别量化？”——精度要求极高、或显存本来就够时。““““'},{'c':'llm','s':0x0,'lv':'⭐','q':_0x555838(0x148),'a':_0x555838(0x2f7)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x555838(0x32b),'a':_0x555838(0x219)},{'c':'llm','s':0x0,'lv':'🔥','q':'MHA\x20/\x20GQA\x20/\x20MQA\x20的区别与选择逻辑','a':_0x555838(0x2a4)},{'c':_0x555838(0x1ce),'s':0x0,'lv':'🔥','q':_0x555838(0x1ff),'a':_0x555838(0x14d)},{'c':_0x555838(0x1ce),'s':0x1,'lv':'⭐','q':_0x555838(0x226),'a':_0x555838(0x22c)},{'c':_0x555838(0x1ce),'s':0x1,'lv':'🔥','q':_0x555838(0x313),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':'llm','s':0x1,'lv':'🔥','q':_0x555838(0x398),'a':_0x555838(0x2be)},{'c':_0x555838(0x1ce),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x555838(0x2af)},{'c':_0x555838(0x1ce),'s':0x2,'lv':'⭐','q':_0x555838(0x1c5),'a':_0x555838(0x15a)},{'c':_0x555838(0x1ce),'s':0x2,'lv':'💎','q':_0x555838(0x274),'a':_0x555838(0x2fe)},{'c':_0x555838(0x1ce),'s':0x3,'lv':'⭐','q':_0x555838(0x2ca),'a':_0x555838(0x17d)},{'c':_0x555838(0x1ce),'s':0x3,'lv':'🔥','q':_0x555838(0x38f),'a':_0x555838(0x297)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x555838(0x1e2),'a':_0x555838(0x34b)},{'c':_0x555838(0x1ce),'s':0x4,'lv':'🔥','q':_0x555838(0x29e),'a':_0x555838(0x256)},{'c':_0x555838(0x1ce),'s':0x5,'lv':'🔥','q':_0x555838(0x1d8),'a':_0x555838(0x29d)},{'c':_0x555838(0x1ce),'s':0x5,'lv':'🔥','q':_0x555838(0x1b2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x555838(0x2f4),'a':_0x555838(0x2e9)},{'c':_0x555838(0x1ce),'s':0x5,'lv':'💎','q':_0x555838(0x391),'a':_0x555838(0x33f)},{'c':_0x555838(0x1ce),'s':0x5,'lv':'🔥','q':_0x555838(0x334),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x555838(0x1ce),'s':0x6,'lv':'⭐','q':_0x555838(0x14e),'a':_0x555838(0x21b)},{'c':_0x555838(0x1ce),'s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':_0x555838(0x365)},{'c':_0x555838(0x1ce),'s':0x7,'lv':'⭐','q':_0x555838(0x39b),'a':_0x555838(0x2e5)},{'c':_0x555838(0x1ce),'s':0x7,'lv':'🔥','q':_0x555838(0x1bb),'a':_0x555838(0x395)},{'c':'llm','s':0x7,'lv':'🔥','q':_0x555838(0x143),'a':_0x555838(0x13c)},{'c':_0x555838(0x1ce),'s':0x7,'lv':'💎','q':_0x555838(0x29b),'a':_0x555838(0x2c8)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x555838(0x27f),'a':_0x555838(0x16e)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x555838(0x1f3),'a':_0x555838(0x210)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x555838(0x388),'a':_0x555838(0x380)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x555838(0x1e8)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':_0x555838(0x1af)},{'c':'rl','s':0x2,'lv':'⭐','q':'PPO：为什么它是工业标准？','a':_0x555838(0x36f)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x555838(0x23b),'a':_0x555838(0x394)},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>SFT</b>：指令微调得到初始策略\x20π_ref\x20②\x20<b>训练奖励模型\x20RM</b>：同一\x20prompt\x20多个回答人工排序，用\x20pairwise\x20loss\x20训一个打分器（好回答分高于坏回答）③\x20<b>PPO\x20优化</b>：以\x20RM\x20打分为奖励更新策略，同时加\x20<b>KL\x20惩罚</b>约束不要偏离\x20π_ref\x20太远。奖励实际形式：R\x20=\x20RM(x,y)\x20−\x20β·KL(π‖π_ref)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“KL\x20防什么？”——防\x20reward\x20hacking（模型找\x20RM\x20漏洞，比如无脑变长、堆礼貌词）和能力退化；“RM\x20的问题？”——它只是人类偏好的<b>代理</b>，训练久了策略会过拟合这个代理，所以要监控\x20KL\x20和输出长度、定期换新数据训RM。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“为什么不直接用人类打分做奖励”——因为人工反馈太慢太贵，RM\x20是把稀疏人类信号<b>放大成可微、可高频查询的奖励函数</b>。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x555838(0x319),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':'GRPO：DeepSeek\x20为什么能扔掉\x20Critic','a':_0x555838(0x1fc)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x555838(0x36d),'a':_0x555838(0x30f)},{'c':'rl','s':0x3,'lv':'💎','q':_0x555838(0x2f0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x555838(0x1bc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x555838(0x2f3),'a':_0x555838(0x171)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x555838(0x13b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x555838(0x355),'a':_0x555838(0x1e6)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x555838(0x382),'a':_0x555838(0x1ca)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x555838(0x336),'a':_0x555838(0x137)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':_0x555838(0x39a)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x555838(0x326),'a':_0x555838(0x35e)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x555838(0x1a8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x555838(0x177),'a':_0x555838(0x200)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x555838(0x384),'a':_0x555838(0x271)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x555838(0x1e4),'a':_0x555838(0x168)},{'c':'pt','s':0x1,'lv':'💎','q':_0x555838(0x267),'a':_0x555838(0x1a0)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x555838(0x331),'a':_0x555838(0x26c)},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x555838(0x285)},{'c':'pt','s':0x2,'lv':'💎','q':_0x555838(0x33d),'a':_0x555838(0x2c7)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x555838(0x370),'a':_0x555838(0x141)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x555838(0x199),'a':_0x555838(0x222)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x555838(0x164),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x555838(0x14b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x555838(0x270)},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x555838(0x372)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':_0x555838(0x1c8)},{'c':_0x555838(0x151),'s':0x0,'lv':'⭐','q':_0x555838(0x17b),'a':_0x555838(0x237)},{'c':_0x555838(0x151),'s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x555838(0x151),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x555838(0x151),'s':0x1,'lv':'🔥','q':_0x555838(0x25d),'a':_0x555838(0x258)},{'c':_0x555838(0x151),'s':0x1,'lv':'⭐','q':_0x555838(0x1de),'a':_0x555838(0x1d2)},{'c':_0x555838(0x151),'s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x555838(0x351)},{'c':_0x555838(0x151),'s':0x2,'lv':'⭐','q':_0x555838(0x302),'a':_0x555838(0x19b)},{'c':_0x555838(0x151),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x555838(0x2ed)},{'c':_0x555838(0x151),'s':0x3,'lv':'💎','q':_0x555838(0x34f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x555838(0x151),'s':0x4,'lv':'⭐','q':_0x555838(0x1ac),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':'app','s':0x4,'lv':'⭐','q':_0x555838(0x1dc),'a':_0x555838(0x229)},{'c':_0x555838(0x151),'s':0x4,'lv':'🔥','q':_0x555838(0x37d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':_0x555838(0x151),'s':0x4,'lv':'🔥','q':_0x555838(0x25b),'a':_0x555838(0x2c3)},{'c':_0x555838(0x151),'s':0x5,'lv':'🔥','q':_0x555838(0x33b),'a':_0x555838(0x2d0)},{'c':_0x555838(0x151),'s':0x5,'lv':'💎','q':_0x555838(0x165),'a':_0x555838(0x26a)},{'c':_0x555838(0x151),'s':0x6,'lv':'⭐','q':_0x555838(0x31e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':'app','s':0x6,'lv':'⭐','q':_0x555838(0x1ab),'a':_0x555838(0x175)},{'c':_0x555838(0x151),'s':0x6,'lv':'🔥','q':_0x555838(0x209),'a':_0x555838(0x2b3)},{'c':_0x555838(0x151),'s':0x6,'lv':'💎','q':_0x555838(0x39d),'a':_0x555838(0x155)},{'c':_0x555838(0x151),'s':0x7,'lv':'⭐','q':_0x555838(0x33c),'a':_0x555838(0x131)},{'c':_0x555838(0x151),'s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':_0x555838(0x151),'s':0x7,'lv':'⭐','q':_0x555838(0x1b0),'a':_0x555838(0x265)},{'c':_0x555838(0x151),'s':0x7,'lv':'🔥','q':_0x555838(0x290),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>生成\x20SQL\x20→\x20语法校验\x20→\x20沙箱执行\x20→\x20报错或结果异常（空集、行数爆炸）→\x20<b>错误信息结构化回喂</b>模型重写\x20→\x20重试\x20N\x20轮封顶\x20→\x20仍失败则拒答/转人工。两个关键设计：错误信息要让模型知道“哪错了”（不是只说“错了”）；轮数必须封顶，防循环烧钱。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“会不会越改越错？”——会，所以封顶\x20+\x20保留初版对比；“提升多少？”——你项目里可执行率到\x2098%，很大程度靠这一环。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br>这套“生成-验证-修正”闭环和\x20OKC-SFT\x20的\x20Verification\x20字段是同一个思想：<b>让输出经过验证再交付</b>——两个项目在此交汇。““““““'},{'c':_0x555838(0x151),'s':0x7,'lv':'🔥','q':_0x555838(0x224),'a':_0x555838(0x20e)},{'c':_0x555838(0x166),'s':0x0,'lv':'⭐','q':'Python\x20GIL：是什么、影响什么、怎么绕','a':_0x555838(0x243)},{'c':'eng','s':0x0,'lv':'⭐','q':_0x555838(0x28b),'a':_0x555838(0x253)},{'c':'eng','s':0x0,'lv':'🔥','q':'装饰器与常见\x20Python\x20进阶考点','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>装饰器</b>本质是“函数包装函数”，@dec\x20等价于\x20f\x20=\x20dec(f)。带参数的装饰器是三层结构（参数层\x20→\x20装饰器层\x20→\x20wrapper\x20层），务必加\x20<b>functools.wraps</b>\x20保留原函数元信息。其他高频：<b>生成器</b>（yield，惰性求值省内存，处理大文件/流式响应必用）、<b>上下文管理器</b>（with\x20/\x20__enter__\x20__exit__，资源确保释放）、<b>深浅拷贝</b>（浅拷贝只复制容器、嵌套对象仍共享）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“默认参数用可变对象的坑？”——def\x20f(x=[])\x20所有调用共享同一个\x20list，经典\x20bug；“生成器和列表的区别？”——生成器不一次性占内存，适合流式；<b>LLM\x20流式输出（SSE）本质就是生成器</b>。“““'},{'c':'eng','s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x555838(0x1dd)},{'c':_0x555838(0x166),'s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':_0x555838(0x20b)},{'c':_0x555838(0x166),'s':0x1,'lv':'🔥','q':_0x555838(0x14c),'a':_0x555838(0x2c0)},{'c':_0x555838(0x166),'s':0x2,'lv':'⭐','q':_0x555838(0x169),'a':_0x555838(0x2b5)},{'c':_0x555838(0x166),'s':0x2,'lv':'🔥','q':_0x555838(0x338),'a':_0x555838(0x22a)},{'c':_0x555838(0x166),'s':0x3,'lv':'🔥','q':_0x555838(0x392),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>镜像\x20=\x20分层只读模板，容器\x20=\x20镜像的运行实例。核心命令：build\x20-t\x20/\x20run\x20-d\x20-p\x20端口\x20-v\x20卷\x20-e\x20环境变量\x20/\x20logs\x20-f\x20/\x20exec\x20-it\x20/\x20compose\x20up。最佳实践：.dockerignore\x20瘦身、<b>多阶段构建</b>（构建环境与运行环境分离）、非\x20root\x20用户运行、健康检查、依赖版本锁定。<b>GPU\x20场景</b>：需要\x20nvidia-container-toolkit，CUDA\x20版本要和驱动匹配——这是私有化部署最常踩的坑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用\x20Docker\x20部署\x20LLM？”——CUDA/依赖版本地狱，容器保证环境一致性、可复制、可回滚；“镜像太大怎么办？”——多阶段构建、精简基础镜像、模型权重挂载而非打进镜像。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>海光\x20DCU\x20环境的适配经历如果讲得出（驱动/算子/框架版本怎么对上的），这是很多人没有的稀缺经验。“““'},{'c':_0x555838(0x166),'s':0x3,'lv':'🔥','q':_0x555838(0x286),'a':_0x555838(0x220)},{'c':_0x555838(0x166),'s':0x3,'lv':'🔥','q':_0x555838(0x1e7),'a':_0x555838(0x1a4)},{'c':_0x555838(0x166),'s':0x4,'lv':'⭐','q':'系统设计题：设计一个企业级\x20RAG\x20问答服务','a':_0x555838(0x2b4)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x555838(0x262),'a':_0x555838(0x1f9)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x555838(0x1c2),'a':_0x555838(0x298)},{'c':_0x555838(0x166),'s':0x4,'lv':'💎','q':_0x555838(0x1fd),'a':_0x555838(0x203)},{'c':_0x555838(0x166),'s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个层面：①\x20<b>数据不出域</b>——这正是私有化部署的核心诉求，模型、向量库、日志全部本地\x20②\x20<b>权限最小化</b>——服务账号只读、文档级\x20ACL\x20在检索时过滤、行列级数据权限\x20③\x20<b>日志脱敏</b>——prompt\x20和响应可能含敏感信息，记录前脱敏或加密，设保留期\x20④\x20<b>可审计</b>——谁在什么时候问了什么、系统给了什么依据，要可追溯。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么工业客户坚持私有化？”——数据合规与商业秘密，这是国产算力\x20+\x20开源模型方案的存在理由；<b>你的项目正是这个背景，能讲清诉求逻辑就显得懂业务</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把“海光\x20DCU\x20+\x20Qwen\x20私有化\x20+\x20只读账号\x20+\x20行列权限”串成一条<b>合规驱动的架构决策链</b>，比单纯罗列技术栈有说服力得多。“““'},{'c':'story','s':0x0,'lv':'⭐','q':_0x555838(0x2a9),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':'story','s':0x0,'lv':'⭐','q':_0x555838(0x2cb),'a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':_0x555838(0x1d0),'s':0x1,'lv':'⭐','q':_0x555838(0x279),'a':_0x555838(0x15e)},{'c':_0x555838(0x1d0),'s':0x1,'lv':'⭐','q':_0x555838(0x301),'a':_0x555838(0x17c)},{'c':_0x555838(0x1d0),'s':0x2,'lv':'⭐','q':_0x555838(0x31f),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':'story','s':0x2,'lv':'🔥','q':_0x555838(0x246),'a':_0x555838(0x269)},{'c':'story','s':0x3,'lv':'⭐','q':_0x555838(0x18e),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>问题</b>：空分装置异常处置场景，大模型给的建议存在三个问题——<b>回答结构不稳定、缺少验证闭环、会生成不受支持的内容</b>。这三个问题在工业安全场景是不可接受的。<br><b>方法</b>：提出\x20OKC-SFT——把现场操作员的处置逻辑建模为六阶段知识链（<b>Diagnosis\x20→\x20Evidence\x20→\x20Causes\x20→\x20Actions\x20→\x20Verification\x20→\x20Risk\x20Boundary</b>），用结构化监督微调引导模型按这个链路输出。<br><b>数据</b>：基于操作规程、现场案例、工艺机理和专家经验构建\x20611\x20条监督样本，覆盖\x206\x20类任务；<b>不是凑数量，是按任务类型做覆盖设计</b>。<br><b>训练</b>：Qwen2.5-7B-Instruct\x20为基座，QLoRA\x20微调——611\x20条数据\x20+\x20有限算力下，全量微调既超显存又必过拟合。<br><b>实验</b>：三组对照（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）+\x20消融，证明提升来自<b>结构化监督</b>而非微调本身。<br><b>结果</b>：结构完整率\x2099.8%、关键点覆盖率\x200.5407→0.7378、Verification\x20与\x20Risk\x20Boundary\x20出现率\x20100%、幻觉率\x2034.4%→15.6%。<br><span\x20class=\x27lb\x27>⚓\x20金句（收尾用）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>“'},{'c':_0x555838(0x1d0),'s':0x3,'lv':'🔥','q':_0x555838(0x346),'a':_0x555838(0x2bf)},{'c':_0x555838(0x1d0),'s':0x4,'lv':'⭐','q':_0x555838(0x21f),'a':_0x555838(0x236)},{'c':_0x555838(0x1d0),'s':0x4,'lv':'⭐','q':_0x555838(0x306),'a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+\x20RL”这个方法词升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>千万别说“我是被调剂过去的”或“我其实想做\x20LLM\x20但没拿到”——一句话让整段经历变成减分项。“'},{'c':_0x555838(0x1d0),'s':0x5,'lv':'⭐','q':_0x555838(0x335),'a':'<span\x20class=\x27lb\x27>◈\x20五个高频问题的应答骨架</span><br>①\x20<b>你最大的缺点</b>：说一个<b>真实但不致命</b>的\x20+\x20你的改进动作。可用：“我早期倾向于把系统做全（前后端都自己上），导致核心链路打磨时间被摊薄；现在我会先明确什么是核心指标，再决定资源分配。”<br>②\x20<b>遇到的最大挑战</b>：讲技术难点（见\x208.2.2），不讲“时间紧”。<br>③\x20<b>团队冲突怎么处理</b>：<b>用你的学生工作经历</b>——这是它唯一的高价值用途，讲一次跨团队协调的具体事例\x20+\x20你的处理逻辑。<br>④\x20<b>为什么选我们公司/这个岗位</b>：必须做功课——具体到<b>业务线、产品、技术方向</b>，别说“贵公司平台好”。<br>⑤\x20<b>职业规划</b>：1年成为能独立交付\x20LLM\x20应用的工程师，3\x20年在某个方向（Agent\x20可靠性\x20/\x20评测体系）有深度积累。<b>别说想做管理。</b><br><span\x20class=\x27lb\x27>➤\x20要点</span><br>行为面的评分标准是<b>真诚\x20+\x20结构清晰\x20+\x20有反思</b>，不是回答漂亮。“'},{'c':_0x555838(0x1d0),'s':0x5,'lv':'🔥','q':'“你有什么想问我的？”——反问环节怎么用','a':_0x555838(0x257)},{'c':'story','s':0x5,'lv':'🔥','q':'面试后\x2024\x20小时：复盘怎么做才有复利','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>每场面试结束后<b>立刻</b>（记忆最清楚时）记四件事：①<b>被问到的所有问题</b>（尽量原话）②\x20<b>答得不好的题</b>及当时的卡点③\x20面试官追问的<b>方向和深度</b>（反映团队真实关注点）④\x20我的改进动作。<br>然后：把答不好的题<b>当天补进手册的对应章节</b>，标为“还不熟”，进入闪卡循环。<br><span\x20class=\x27lb\x27>➤\x20为什么这件事回报最高</b><br>秋招是<b>多轮迭代</b>的过程：同一个问题会在不同公司反复出现。<b>第一次答崩不丢人，第二次还崩才是浪费。</b>面经复盘是把单次失败转化为全局提升的唯一机制。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>用附录\x20C\x20的面经复盘模板，每场一份，存在同一个文件夹里。三场之后你会看到明显的规律。“'},{'c':_0x555838(0x381),'s':0x0,'lv':'⭐','q':_0x555838(0x2d1),'a':_0x555838(0x195)},{'c':_0x555838(0x381),'s':0x0,'lv':'⭐','q':_0x555838(0x15d),'a':'<span\x20class=\x27lb\x27>◈\x20五件必做</span><br>①\x20<b>简历改版（最高优先级）</b>：加腾讯实习那一栏（哪怕先写在做的方向和技术栈）；删掉“AI\x20Infra\x20/\x20Post-training”意向、只留“大模型应用研发\x20/\x20LLM\x20Agent”；技能栏删掉“了解\x20vLLM、KV\x20Cache”这类扛不住追问的表述；学生工作压到2\x20行以内。<br>②\x20<b>找\x20mentor\x20谈一次</b>：问清转正HC\x20情况\x20+\x20争取一个能量化的产出（哪怕是内部\x20demo\x20或实验结论）。<br>③\x20<b>目标公司清单</b>：分三档（冲刺\x20/\x20主力\x20/\x20保底）各\x205-8\x20家，查清投递批次和截止时间。<br>④\x20<b>手册第六章刷完一轮</b>（主战场优先）。<br>⑤\x20<b>刷题热身</b>：Hot100\x20里的哈希/双指针/滑窗，每天\x203\x20题。<br><span\x20class=\x27lb\x27>➤\x20本周验收标准</span><br>周日晚上能做到：<b>简历发出去不心虚+\x206.8\x20节NL2SQL\x20五题能不看稿讲完</b>。“'},{'c':_0x555838(0x381),'s':0x0,'lv':'🔥','q':_0x555838(0x2fb),'a':_0x555838(0x1cc)},{'c':_0x555838(0x381),'s':0x1,'lv':'🔥','q':_0x555838(0x24f),'a':_0x555838(0x280)},{'c':_0x555838(0x381),'s':0x1,'lv':'🔥','q':_0x555838(0x390),'a':_0x555838(0x2f6)},{'c':_0x555838(0x381),'s':0x2,'lv':'⭐','q':'面经复盘模板（每场面试后\x2024\x20小时内填）','a':'<span\x20class=\x27lb\x27>◈\x20模板（直接复制使用）</span><br><b>基本信息</b>：公司\x20/\x20部门\x20/\x20轮次\x20/\x20日期\x20/\x20时长\x20/\x20面试官画像（技术深度、关注方向）<br><b>被问问题清单</b>：逐条记录，尽量原话，标注\x20✅答好\x20/\x20⚠️勉强\x20/\x20❌答崩<br><b>答崩的题</b>：题目\x20+\x20我当时怎么答的\x20+\x20卡在哪\x20+\x20<b>正确答案应该是什么</b><br><b>面试官的追问方向</b>：他反复挖的是什么？（反映团队真实关注点）<br><b>我的表现问题</b>：语速、结构、有没有答非所问、有没有沉默<br><b>下一步动作</b>：要补的知识点（写进手册哪一节）+\x20要改的表达习惯<br><span\x20class=\x27lb\x27>➤\x20复利机制</span><br>把❌\x20的题<b>当天补进手册对应章节</b>并标记“还不熟”→\x20进闪卡循环\x20→\x20下次遇到就是✅。<b>这是整本手册最重要的使用方式：让它随你的面试一起长大。</b>“'},{'c':'plan','s':0x2,'lv':'🔥','q':_0x555838(0x283),'a':'<span\x20class=\x27lb\x27>◈\x20三种练法（从易到难）</span><br>①\x20<b>自问自答\x20+\x20录音</b>：打开手册随机抽题，出声回答并录音，回听时注意——有没有结构、有没有嗯啊、有没有说到点上。<b>回听是最痛苦也最有效的一步。</b><br>②\x20<b>让\x20AI\x20当面试官</b>：把你的简历和项目细节喂给模型，要求它扮演严格的面试官连续追问三层，不许放水。<br>③\x20<b>找人真练</b>：同学互面、学长学姐、或者<b>把前几场真实面试当模拟</b>（这就是先投主力档的意义）。<br><span\x20class=\x27lb\x27>➤\x20必须出声练的三样</span><br>·\x203\x20分钟自我介绍（练到掐表精准）<br>·\x20NL2SQL\x20项目讲述稿<br>·\x20OKC-SFT\x20论文讲述稿<br><span\x20class=\x27lb\x27>⚠\x20关键</span><br><b>看懂\x20≠\x20讲得出</b>。手册里的答案你默读时觉得都会，开口说会发现完全是另一回事——<b>这是本手册最容易被忽略的使用要求。</b>“'},{'c':_0x555838(0x381),'s':0x3,'lv':'🔥','q':_0x555838(0x18d),'a':_0x555838(0x130)},{'c':_0x555838(0x381),'s':0x3,'lv':'💎','q':_0x555838(0x252),'a':_0x555838(0x2e2)}],STORE_KEY=_0x555838(0x34d);let progress={};try{progress=JSON['parse'](localStorage['getItem'](STORE_KEY)||'{}');}catch(_0x65d8f7){}function saveProgress(){const _0x1cf361=_0x555838;localStorage[_0x1cf361(0x1c9)](STORE_KEY,JSON[_0x1cf361(0x1a2)](progress));}function cardId(_0x3af8fd){return'c'+_0x3af8fd;}let mode=_0x555838(0x14f),currentChap=_0x555838(0x217),levelFilter=_0x555838(0x217);const $=_0x49b1c5=>document[_0x555838(0x1f2)](_0x49b1c5);function chapOf(_0x644195){const _0x35b92c=_0x555838;return CHAPTERS[_0x35b92c(0x207)](_0x182821=>_0x182821['id']===_0x644195);}function chapIdx(_0x435553){const _0x18cdee=_0x555838;return CHAPTERS[_0x18cdee(0x1ec)](_0x440609=>_0x440609['id']===_0x435553);}function chapCards(_0x2e22fe){const _0x2ea97d
