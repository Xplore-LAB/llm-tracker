<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x27lb\x27>➤\x20常见追问</span><br>“初始化不当的症状？”——开局\x20loss\x20异常大或\x20NaN、或者\x20loss\x20长期不动；“为什么\x20LoRA\x20的\x20B\x20可以初始化为零？”——因为\x20A\x20是随机的，A·B\x20整体不为对称零，且这样保证起点\x20ΔW=0。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x39caac(0x22a),'a':_0x39caac(0x1ae)},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':_0x39caac(0x306)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x39caac(0x237),'a':_0x39caac(0x292)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x39caac(0x183),'a':_0x39caac(0xeb)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x39caac(0x25d),'a':_0x39caac(0x14b)},{'c':'ml','s':0x2,'lv':'💎','q':_0x39caac(0x1ab),'a':_0x39caac(0x32e)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x39caac(0x142),'a':_0x39caac(0x224)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x39caac(0x2ca),'a':_0x39caac(0x254)},{'c':'ml','s':0x3,'lv':'💎','q':_0x39caac(0x329),'a':_0x39caac(0x23d)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x39caac(0x321),'a':_0x39caac(0x13e)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x39caac(0x169),'a':_0x39caac(0xd0)},{'c':_0x39caac(0x2ed),'s':0x0,'lv':'🔥','q':_0x39caac(0x19f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>瓶颈是\x20<b>KV\x20Cache\x20的显存与访存带宽</b>，不是计算。MHA：Q/K/V\x20头数相同（32\x20头），Cache\x20最大。MQA：所有\x20Q\x20头共享1\x20组\x20K/V，Cache\x20缩到\x201/32，但质量掉得明显。<b>GQA</b>：折中——Q\x20头分组、组内共享\x20K/V（32\x20Q\x20头配\x208\x20KV\x20头），Cache\x20缩\x204\x20倍、质量几乎无损，所以成为工业标准（Llama-2/3-70B、Qwen2\x20全系）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“更进一步呢？”——DeepSeek\x20的\x20MLA\x20用低秩投影压缩\x20KV，压缩率更高且质量更好；“为什么不是压计算？”——decode\x20阶段是访存瓶颈（memory-bound），省访存才是省时间。““““““'},{'c':_0x39caac(0x2ed),'s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':_0x39caac(0x165)},{'c':_0x39caac(0x2ed),'s':0x1,'lv':'⭐','q':_0x39caac(0x16e),'a':_0x39caac(0x1eb)},{'c':_0x39caac(0x2ed),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':_0x39caac(0x302)},{'c':_0x39caac(0x2ed),'s':0x1,'lv':'🔥','q':_0x39caac(0xd3),'a':_0x39caac(0x26f)},{'c':_0x39caac(0x2ed),'s':0x2,'lv':'⭐','q':_0x39caac(0x158),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':_0x39caac(0x2ed),'s':0x2,'lv':'⭐','q':'参数量与显存估算（必考口算）','a':_0x39caac(0x186)},{'c':_0x39caac(0x2ed),'s':0x2,'lv':'💎','q':_0x39caac(0x2fd),'a':_0x39caac(0xf0)},{'c':_0x39caac(0x2ed),'s':0x3,'lv':'⭐','q':_0x39caac(0xe0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(logits/T)：T\x20大→分布变平（更随机多样），T\x20小→更尖锐（更确定），T→0\x20等价贪心。top-k：只在概率最高\x20k\x20个\x20token\x20里采样（固定截断）。<b>top-p（nucleus）</b>：取累积概率达\x20p\x20的最小\x20token\x20集合（动态截断，比\x20top-k\x20自适应）。工程经验：严肃任务（NL2SQL\x20/\x20代码\x20/\x20抽取）T=0~0.3；创作类\x200.7~1.0；<b>别同时激进调\x20T\x20和\x20top-p</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么复读？”——贪心/低温陷入局部最优形成循环，用\x20repetition_penalty\x20或适度提温；“T=0\x20一定可复现吗？”——不完全，浮点非确定性和批处理顺序会引入微小差异。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20用低温\x20+\x20结构约束，是“任务性质决定采样策略”的现成例子。““““““'},{'c':'llm','s':0x3,'lv':'🔥','q':'数值稳定的\x20softmax\x20与\x20logsumexp','a':_0x39caac(0x2c2)},{'c':_0x39caac(0x2ed),'s':0x4,'lv':'🔥','q':_0x39caac(0x29c),'a':_0x39caac(0x23b)},{'c':_0x39caac(0x2ed),'s':0x4,'lv':'🔥','q':_0x39caac(0xda),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':_0x39caac(0x2ed),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':_0x39caac(0x17b)},{'c':_0x39caac(0x2ed),'s':0x5,'lv':'🔥','q':_0x39caac(0x103),'a':_0x39caac(0x301)},{'c':_0x39caac(0x2ed),'s':0x5,'lv':'🔥','q':_0x39caac(0x211),'a':_0x39caac(0x238)},{'c':_0x39caac(0x2ed),'s':0x5,'lv':'💎','q':_0x39caac(0x239),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':_0x39caac(0x2ed),'s':0x5,'lv':'🔥','q':_0x39caac(0x1c0),'a':_0x39caac(0x1bb)},{'c':_0x39caac(0x2ed),'s':0x6,'lv':'⭐','q':_0x39caac(0xf5),'a':_0x39caac(0x26d)},{'c':_0x39caac(0x2ed),'s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':'llm','s':0x7,'lv':'⭐','q':_0x39caac(0x2b6),'a':_0x39caac(0x2f8)},{'c':'llm','s':0x7,'lv':'🔥','q':_0x39caac(0x2b0),'a':_0x39caac(0x1f5)},{'c':_0x39caac(0x2ed),'s':0x7,'lv':'🔥','q':_0x39caac(0x132),'a':_0x39caac(0x2d7)},{'c':'llm','s':0x7,'lv':'💎','q':_0x39caac(0x251),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x39caac(0x1f0),'a':_0x39caac(0x1c5)},{'c':'rl','s':0x0,'lv':'⭐','q':'价值函数与贝尔曼方程','a':_0x39caac(0x2e8)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x39caac(0x1e9),'a':_0x39caac(0x1cd)},{'c':'rl','s':0x1,'lv':'💎','q':_0x39caac(0xe8),'a':_0x39caac(0x233)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x39caac(0x166),'a':_0x39caac(0x1f9)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x39caac(0x2b2),'a':_0x39caac(0x1e6)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x39caac(0x12a),'a':_0x39caac(0x28c)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x39caac(0x215),'a':_0x39caac(0x20a)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x39caac(0x23e),'a':_0x39caac(0x20b)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x39caac(0x1f1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':_0x39caac(0x19e),'a':_0x39caac(0xea)},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':_0x39caac(0x16b)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x39caac(0x227),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x39caac(0x1d0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x39caac(0xee),'a':_0x39caac(0x179)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x39caac(0x1ea)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x39caac(0x2d9),'a':_0x39caac(0x339)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':_0x39caac(0x12c)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x39caac(0x21d),'a':_0x39caac(0x26a)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x39caac(0x130),'a':_0x39caac(0x121)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x39caac(0x1d5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x39caac(0x18c),'a':_0x39caac(0x253)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x39caac(0x25b),'a':_0x39caac(0xf4)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x39caac(0x29b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x39caac(0x17a),'a':_0x39caac(0x1b1)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x39caac(0x1a7),'a':_0x39caac(0x23c)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x39caac(0x113),'a':_0x39caac(0x2ee)},{'c':'pt','s':0x2,'lv':'💎','q':_0x39caac(0xfd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x39caac(0x2e3),'a':_0x39caac(0x2c3)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x39caac(0x163),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x39caac(0x1f3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x39caac(0x114),'a':_0x39caac(0x27c)},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x39caac(0x206)},{'c':'pt','s':0x3,'lv':'💎','q':_0x39caac(0xd9),'a':_0x39caac(0xd2)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':_0x39caac(0x1fc)},{'c':_0x39caac(0xe2),'s':0x0,'lv':'⭐','q':_0x39caac(0x1c2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':_0x39caac(0xe2),'s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x39caac(0xe2),'s':0x1,'lv':'⭐','q':_0x39caac(0x161),'a':_0x39caac(0x21f)},{'c':_0x39caac(0xe2),'s':0x1,'lv':'🔥','q':'为什么要混合检索（向量\x20+\x20BM25）？','a':_0x39caac(0x225)},{'c':_0x39caac(0xe2),'s':0x1,'lv':'⭐','q':'Rerank\x20为什么有效？和粗排怎么分工？','a':_0x39caac(0x21a)},{'c':_0x39caac(0xe2),'s':0x2,'lv':'🔥','q':_0x39caac(0x2e4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x39caac(0xe2),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x39caac(0x19d)},{'c':_0x39caac(0xe2),'s':0x3,'lv':'🔥','q':_0x39caac(0x30d),'a':_0x39caac(0x11a)},{'c':_0x39caac(0xe2),'s':0x3,'lv':'💎','q':_0x39caac(0x1c4),'a':_0x39caac(0x1a5)},{'c':_0x39caac(0xe2),'s':0x4,'lv':'⭐','q':_0x39caac(0x32c),'a':_0x39caac(0x129)},{'c':_0x39caac(0xe2),'s':0x4,'lv':'⭐','q':_0x39caac(0x272),'a':_0x39caac(0x188)},{'c':_0x39caac(0xe2),'s':0x4,'lv':'🔥','q':_0x39caac(0x252),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':_0x39caac(0xe2),'s':0x4,'lv':'🔥','q':_0x39caac(0x207),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':'app','s':0x5,'lv':'🔥','q':_0x39caac(0x122),'a':_0x39caac(0x115)},{'c':_0x39caac(0xe2),'s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x39caac(0xe2),'s':0x6,'lv':'⭐','q':_0x39caac(0x118),'a':_0x39caac(0x14a)},{'c':_0x39caac(0xe2),'s':0x6,'lv':'⭐','q':_0x39caac(0x10a),'a':_0x39caac(0x136)},{'c':_0x39caac(0xe2),'s':0x6,'lv':'🔥','q':_0x39caac(0x262),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可观测</b>：全链路\x20trace——每次调用记录\x20prompt/响应/耗时/token\x20消耗/工具轨迹，工具用\x20Langfuse/LangSmith\x20或自建日志表；线上效果靠采样评估\x20+\x20用户行为信号（重试率、采纳率、人工介入率）监控。<b>成本三杠杆</b>：模型路由（简单问题给小模型）、prompt\x20瘦身（历史压缩、检索精简）、缓存（相同/相似\x20query\x20直接命中）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么发现线上效果退化？”——固定评估集定期回归\x20+\x20行为信号异动告警。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署场景讲“GPU\x20资源有限\x20→\x20按问题复杂度路由不同尺寸模型”，贴工业实际。““““““'},{'c':_0x39caac(0xe2),'s':0x6,'lv':'💎','q':_0x39caac(0x249),'a':_0x39caac(0x2af)},{'c':_0x39caac(0xe2),'s':0x7,'lv':'⭐','q':_0x39caac(0x214),'a':_0x39caac(0x102)},{'c':_0x39caac(0xe2),'s':0x7,'lv':'🔥','q':_0x39caac(0x1fd),'a':_0x39caac(0x25f)},{'c':_0x39caac(0xe2),'s':0x7,'lv':'⭐','q':_0x39caac(0x319),'a':_0x39caac(0x124)},{'c':_0x39caac(0xe2),'s':0x7,'lv':'🔥','q':_0x39caac(0x155),'a':_0x39caac(0x2b8)},{'c':'app','s':0x7,'lv':'🔥','q':_0x39caac(0x12e),'a':_0x39caac(0x2eb)},{'c':_0x39caac(0x2cf),'s':0x0,'lv':'⭐','q':_0x39caac(0x2a3),'a':_0x39caac(0x1da)},{'c':_0x39caac(0x2cf),'s':0x0,'lv':'⭐','q':_0x39caac(0x138),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型：单线程内由<b>事件循环</b>调度多个协程，遇到\x20await\x20就让出控制权、IO\x20完成后被唤醒——一个线程可承载上万并发连接。三个概念：coroutine（协程对象，不await\x20不执行）、Task（被调度的执行单元）、事件循环。<b>最大的坑</b>：在async\x20函数里调用<b>阻塞</b>操作（time.sleep、同步\x20requests、重CPU\x20计算）会卡死整个事件循环——必须换asyncio.sleep\x20/\x20httpx\x20/\x20aiohttp，或用\x20run_in_executor\x20丢到线程池。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么并发跑多个请求？”——asyncio.gather或\x20create_task；“怎么控制并发数？”——Semaphore\x20限流，防打爆下游模型服务。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Agent\x20里并发调多个工具、批量调LLM\x20都靠这套——能讲出Semaphore\x20限流就显工程经验。“““'},{'c':_0x39caac(0x2cf),'s':0x0,'lv':'🔥','q':'装饰器与常见\x20Python\x20进阶考点','a':_0x39caac(0x137)},{'c':_0x39caac(0x2cf),'s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x39caac(0x2e9)},{'c':'eng','s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“幻读怎么解决？”——RR\x20下靠间隙锁（next-key\x20lock）；“分析型查询关心什么？”——你的场景主要是只读一致性快照，长事务会导致\x20undo\x20堆积，要注意。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>应用岗能讲清“四级别\x20+\x20MVCC\x20一句话\x20+\x20读写不互斥”就够，不必背锁的所有细节。“““'},{'c':_0x39caac(0x2cf),'s':0x1,'lv':'🔥','q':_0x39caac(0x28d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':_0x39caac(0x2cf),'s':0x2,'lv':'⭐','q':_0x39caac(0x11c),'a':_0x39caac(0x327)},{'c':'eng','s':0x2,'lv':'🔥','q':_0x39caac(0x222),'a':_0x39caac(0x27e)},{'c':_0x39caac(0x2cf),'s':0x3,'lv':'🔥','q':_0x39caac(0x18b),'a':_0x39caac(0x31e)},{'c':'eng','s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':'eng','s':0x3,'lv':'🔥','q':_0x39caac(0x2fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':_0x39caac(0x2cf),'s':0x4,'lv':'⭐','q':_0x39caac(0x273),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x39caac(0x2cf),'s':0x4,'lv':'🔥','q':_0x39caac(0x24d),'a':_0x39caac(0x2fc)},{'c':_0x39caac(0x2cf),'s':0x4,'lv':'🔥','q':_0x39caac(0xf7),'a':_0x39caac(0x2c9)},{'c':'eng','s':0x4,'lv':'💎','q':_0x39caac(0x1fa),'a':_0x39caac(0x14d)},{'c':_0x39caac(0x2cf),'s':0x4,'lv':'💎','q':_0x39caac(0xdb),'a':_0x39caac(0x1e7)},{'c':_0x39caac(0x185),'s':0x0,'lv':'⭐','q':'60秒自我介绍（电话面\x20/\x20开场用）','a':_0x39caac(0x245)},{'c':_0x39caac(0x185),'s':0x0,'lv':'⭐','q':_0x39caac(0x2f3),'a':_0x39caac(0x172)},{'c':_0x39caac(0x185),'s':0x1,'lv':'⭐','q':_0x39caac(0x318),'a':_0x39caac(0x154)},{'c':_0x39caac(0x185),'s':0x1,'lv':'⭐','q':_0x39caac(0x2f4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好答案的三个特征：①难点是<b>技术判断</b>而非体力活②\x20有<b>具体的失败经历</b>（试过什么不行）③\x20有<b>可迁移的认知沉淀</b>。<br>模板：“最难的不是让它跑通，而是<b>让它稳定</b>。跑通只要prompt\x20调对就行，但真实用户的问法千奇百怪。我最开始\x20SQL\x20生成正确率只有\x20X左右，问题集中在字段映射错和口径理解错。我做了三件事：schema\x20裁剪、口径库\x20RAG\x20注入、执行反馈修正循环。<b>这件事让我明白\x20LLM\x20应用的核心工作量不在调用模型，而在给它建好约束与验证机制。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>最后那句<b>认知沉淀</b>是加分核心——它说明你能从具体项目里抽象出方法论。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>如果初期的具体数字你不记得，别编——说“早期版本明显不稳定，主要错在字段映射”比编一个假数字安全得多。“'},{'c':_0x39caac(0x185),'s':0x2,'lv':'⭐','q':_0x39caac(0x1f2),'a':_0x39caac(0x2f7)},{'c':_0x39caac(0x185),'s':0x2,'lv':'🔥','q':'NL2SQL\x20项目的十个必问追问（自检清单）','a':_0x39caac(0x2dc)},{'c':_0x39caac(0x185),'s':0x3,'lv':'⭐','q':_0x39caac(0x213),'a':_0x39caac(0x2f9)},{'c':_0x39caac(0x185),'s':0x3,'lv':'🔥','q':_0x39caac(0x13a),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检</span><br>①\x20幻觉率的判定标准和流程？（必问，见\x205.4.5）<br>②\x20六个阶段是怎么定出来的、为什么是六个？<br>③\x20611\x20条数据的标注质量怎么保证、有没有多人校验？<br>④\x2090\x20条测试集是不是太小？统计上可信吗？<br>⑤\x20为什么不做\x20DPO\x20/\x20偏好对齐？<br>⑥\x20关键点覆盖率\x200.54→0.74\x20是怎么算的？<br>⑦\x20通用能力掉了吗？（有没有测MMLU/CMMLU）<br>⑧\x20为什么投\x20CAC\x20而不是ACL/EMNLP？<br><span\x20class=\x27lb\x27>➤\x20硬伤应对原则</span><br>④⑦\x20如果确实没做，<b>诚实承认\x20+\x20说明如果重做会怎么补</b>——“测试集\x2090\x20条对领域任务够用但统计功效有限，如果重做我会扩到\x20300\x20条并做多种子重复实验”。<b>承认局限并给出改进方案，比硬撑可信得多。</b><br>⑧\x20标准答法：“CAC\x20是自动化领域的会议，我的工作是工业控制场景的落地方法，投这里更贴合读者；如果做通用方法研究，我会选\x20NLP\x20会议。”——<b>把选择讲成定位，而不是能力上限。</b>“'},{'c':_0x39caac(0x185),'s':0x4,'lv':'⭐','q':_0x39caac(0x12b),'a':_0x39caac(0x1df)},{'c':_0x39caac(0x185),'s':0x4,'lv':'⭐','q':_0x39caac(0x255),'a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+\x20RL”这个方法词升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>千万别说“我是被调剂过去的”或“我其实想做\x20LLM\x20但没拿到”——一句话让整段经历变成减分项。“'},{'c':_0x39caac(0x185),'s':0x5,'lv':'⭐','q':_0x39caac(0x2b3),'a':_0x39caac(0x178)},{'c':'story','s':0x5,'lv':'🔥','q':_0x39caac(0x145),'a':'<span\x20class=\x27lb\x27>◈
