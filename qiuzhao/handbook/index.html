<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x\x20=\x20x\x20−\x20x.max(dim=-1,\x20keepdim=True)，再\x20exp\x20归一化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“keepdim\x20为什么要\x20True？”——保持维度以便广播；“为什么\x20RMSNorm\x20够用？”——实验发现\x20re-centering\x20贡献小、re-scaling\x20才是关键。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>忘记\x20eps、忘记\x20keepdim、用了有偏方差——三个常见扣分点。““'},{'c':_0x17d351(0x27e),'s':0x1,'lv':'⭐','q':_0x17d351(0x32e),'a':_0x17d351(0x3b9)},{'c':_0x17d351(0x27e),'s':0x1,'lv':'⭐','q':_0x17d351(0x2fa),'a':_0x17d351(0x249)},{'c':_0x17d351(0x27e),'s':0x1,'lv':'🔥','q':'排序算法对比与稳定性','a':_0x17d351(0x240)},{'c':_0x17d351(0x27e),'s':0x2,'lv':'⭐','q':_0x17d351(0x39d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>迭代</b>（首选，O(1)\x20空间）：prev=None,\x20cur=head；循环内四步固定顺序——nxt=cur.next\x20→\x20cur.next=prev\x20→\x20prev=cur\x20→\x20cur=nxt；返回\x20prev。<b>递归</b>：newHead=reverse(head.next)，然后\x20head.next.next=head、head.next=None，返回newHead。<b>K\x20个一组（LeetCode\x2025，困难高频）</b>：用哨兵节点\x20+\x20每次先探测是否够\x20k\x20个，够则反转该段并接回，注意保存段前驱和段尾。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“递归空间复杂度？”——O(n)\x20栈深度，长链表可能爆栈；“怎么少出错？”——<b>画图+\x20用哨兵节点（dummy\x20head）消除头节点特判</b>，这是链表题通用降错技巧。““'},{'c':_0x17d351(0x27e),'s':0x2,'lv':'⭐','q':_0x17d351(0x211),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':_0x17d351(0x27e),'s':0x2,'lv':'🔥','q':_0x17d351(0x39c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>递归三要素</b>：参数与返回值、终止条件、单层逻辑——想清这三点再写。<b>层序（BFS）</b>：队列\x20+\x20每轮记录当前层节点数分层输出（102）。<b>非递归前序</b>：栈，弹出访问后<b>先压右子再压左子</b>。<b>最近公共祖先（236）</b>：递归左右子树查找，若两侧都有返回则当前节点即答案，否则返回非空那侧。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“常考变种？”——锯齿层序（103）、右视图（199）、二叉树最大深度/直径、验证\x20BST（98，注意用上下界而非只比父子）、路径总和；“BST\x20的中序遍历有什么性质？”——升序，很多\x20BST\x20题的突破口。““'},{'c':_0x17d351(0x27e),'s':0x2,'lv':'🔥','q':_0x17d351(0x15d),'a':_0x17d351(0x146)},{'c':_0x17d351(0x27e),'s':0x3,'lv':'⭐','q':_0x17d351(0x382),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':'code','s':0x3,'lv':'🔥','q':_0x17d351(0x362),'a':_0x17d351(0x25c)},{'c':_0x17d351(0x27e),'s':0x3,'lv':'🔥','q':_0x17d351(0x1bb),'a':_0x17d351(0x1ce)},{'c':_0x17d351(0x27e),'s':0x3,'lv':'🔥','q':_0x17d351(0x329),'a':_0x17d351(0x142)},{'c':_0x17d351(0x27e),'s':0x4,'lv':'⭐','q':_0x17d351(0x2c1),'a':_0x17d351(0x24f)},{'c':'code','s':0x4,'lv':'🔥','q':_0x17d351(0x1d2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>网格搜索（岛屿数量\x20200）</b>：遍历网格，遇到\x20\x271\x27\x20就\x20DFS/BFS\x20把整块染成\x270\x27，计数\x20+1；注意\x20<b>visited\x20标记时机</b>（入队时标记而非出队时，否则重复入队）。<b>拓扑排序（207\x20课程表）</b>：统计入度→入度\x200\x20入队\x20→弹出并减邻接入度；<b>若弹出总数\x20&lt;\x20节点数则有环</b>。<b>回溯</b>：选择\x20→\x20递归\x20→\x20<b>撤销选择</b>，模板固定（全排列\x2046、子集\x2078、组合总和\x2039、N\x20皇后\x2051）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“BFS\x20和\x20DFS\x20怎么选？”——求<b>最短路径/最少步数</b>用\x20BFS（层数即步数），求<b>所有方案/连通性</b>用\x20DFS；“回溯怎么去重？”——先排序，同层跳过重复元素。““'},{'c':_0x17d351(0x27e),'s':0x5,'lv':'🔥','q':_0x17d351(0x190),'a':_0x17d351(0x3b3)},{'c':_0x17d351(0x27e),'s':0x5,'lv':'💎','q':'刷题策略：时间有限该怎么刷','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x17d351(0x21c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x17d351(0x1e5),'a':_0x17d351(0x3b0)},{'c':'ml','s':0x0,'lv':'⭐','q':'Adam\x20为什么有效？显存代价是多少？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Adam\x20=\x20<b>一阶动量</b>（梯度的指数滑动平均，平滑方向）+\x20<b>二阶动量</b>（梯度平方的滑动平均，做逐参数自适应步长）+\x20偏差修正。优势：收敛快、对超参不敏感、稀疏梯度友好——大模型默认选择。<b>代价（必背算术）</b>：每个参数多存两个\x20fp32\x20状态\x20=\x208\x20字节；加上\x20fp32\x20主权重和梯度，全量微调约\x20<b>16\x20字节/参数</b>，7B\x20就是\x20112GB\x20量级——这是“7B\x20全量微调必须多卡、单卡只能\x20LoRA”的根本原因。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“AdamW\x20和\x20Adam\x20的区别？”——AdamW\x20把\x20weight\x20decay\x20从梯度里<b>解耦</b>出来直接作用于权重，正则效果更正确，是现在的标准；“SGD\x20还有用吗？”——CV\x20里精调有时泛化更好，但LLM\x20场景几乎全用\x20AdamW。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这笔账直接支撑你选\x20QLoRA\x20的理由——见第三章「参数量与显存估算」。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x17d351(0x2ce),'a':_0x17d351(0x2e3)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x17d351(0x26c),'a':_0x17d351(0x388)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x17d351(0x349),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x17d351(0x383),'a':_0x17d351(0x344)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x17d351(0x25f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ReLU</b>：max(0,x)，快但负区梯度为零（神经元死亡）。<b>GELU</b>：x·Φ(x)，平滑版\x20ReLU，BERT/GPT\x20系用。<b>SiLU/Swish</b>：x·sigmoid(x)，平滑且有轻微负值。<b>SwiGLU</b>（现代\x20LLM\x20FFN\x20标配）：FFN(x)\x20=\x20(xW₁\x20⊙\x20SiLU(xW₃))W₂——<b>门控机制引入乘性交互</b>，表达能力更强；代价是多一个投影矩阵，所以通常把中间维度调小以保持参数量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么门控有效？”——乘性交互让网络能表达“条件性通过”，比纯加性变换表达力更强，实验上稳定优于\x20ReLU/GELU；“为什么\x20FFN\x20中间维度是\x208/3\x20倍而不是\x204\x20倍？”——正是为了在加了第三个矩阵后保持总参数量不变。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x17d351(0x1ab)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x17d351(0x2e2)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x17d351(0x258),'a':_0x17d351(0x31f)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x17d351(0x26e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x17d351(0x32d),'a':_0x17d351(0x270)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x17d351(0x29c),'a':_0x17d351(0x2f8)},{'c':'ml','s':0x2,'lv':'💎','q':_0x17d351(0x2ca),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x17d351(0x1cb),'a':_0x17d351(0x170)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x17d351(0x369),'a':_0x17d351(0x29f)},{'c':'ml','s':0x3,'lv':'💎','q':_0x17d351(0x33d),'a':_0x17d351(0x1c1)},{'c':_0x17d351(0x15a),'s':0x0,'lv':'⭐','q':'Self-Attention\x20的完整公式与每一步含义','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x17d351(0x15a),'s':0x0,'lv':'⭐','q':_0x17d351(0x295),'a':_0x17d351(0x2ae)},{'c':_0x17d351(0x15a),'s':0x0,'lv':'🔥','q':_0x17d351(0x250),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>瓶颈是\x20<b>KV\x20Cache\x20的显存与访存带宽</b>，不是计算。MHA：Q/K/V\x20头数相同（32\x20头），Cache\x20最大。MQA：所有\x20Q\x20头共享1\x20组\x20K/V，Cache\x20缩到\x201/32，但质量掉得明显。<b>GQA</b>：折中——Q\x20头分组、组内共享\x20K/V（32\x20Q\x20头配\x208\x20KV\x20头），Cache\x20缩\x204\x20倍、质量几乎无损，所以成为工业标准（Llama-2/3-70B、Qwen2\x20全系）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“更进一步呢？”——DeepSeek\x20的\x20MLA\x20用低秩投影压缩\x20KV，压缩率更高且质量更好；“为什么不是压计算？”——decode\x20阶段是访存瓶颈（memory-bound），省访存才是省时间。““““““'},{'c':'llm','s':0x0,'lv':'🔥','q':_0x17d351(0x304),'a':_0x17d351(0x1dd)},{'c':_0x17d351(0x15a),'s':0x1,'lv':'⭐','q':_0x17d351(0x179),'a':_0x17d351(0x17e)},{'c':_0x17d351(0x15a),'s':0x1,'lv':'🔥','q':_0x17d351(0x2ed),'a':_0x17d351(0x1fc)},{'c':_0x17d351(0x15a),'s':0x1,'lv':'🔥','q':_0x17d351(0x31e),'a':_0x17d351(0x384)},{'c':_0x17d351(0x15a),'s':0x2,'lv':'⭐','q':_0x17d351(0x284),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':'llm','s':0x2,'lv':'⭐','q':_0x17d351(0x3a5),'a':_0x17d351(0x165)},{'c':_0x17d351(0x15a),'s':0x2,'lv':'💎','q':'推理加速手段速览（应用岗水位）','a':_0x17d351(0x39f)},{'c':_0x17d351(0x15a),'s':0x3,'lv':'⭐','q':_0x17d351(0x18a),'a':_0x17d351(0x29a)},{'c':_0x17d351(0x15a),'s':0x3,'lv':'🔥','q':_0x17d351(0x356),'a':_0x17d351(0x18d)},{'c':_0x17d351(0x15a),'s':0x4,'lv':'🔥','q':_0x17d351(0x1d8),'a':_0x17d351(0x314)},{'c':_0x17d351(0x15a),'s':0x4,'lv':'🔥','q':_0x17d351(0x1ff),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x17d351(0x2ea),'a':_0x17d351(0x1c7)},{'c':_0x17d351(0x15a),'s':0x5,'lv':'🔥','q':'为什么主流是\x20Decoder-only？','a':_0x17d351(0x32a)},{'c':_0x17d351(0x15a),'s':0x5,'lv':'🔥','q':_0x17d351(0x283),'a':_0x17d351(0x267)},{'c':_0x17d351(0x15a),'s':0x5,'lv':'💎','q':_0x17d351(0x2c6),'a':_0x17d351(0x1f7)},{'c':_0x17d351(0x15a),'s':0x5,'lv':'🔥','q':_0x17d351(0x24c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x17d351(0x15a),'s':0x6,'lv':'⭐','q':_0x17d351(0x200),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':_0x17d351(0x15a),'s':0x6,'lv':'🔥','q':_0x17d351(0x154),'a':_0x17d351(0x390)},{'c':_0x17d351(0x15a),'s':0x7,'lv':'⭐','q':_0x17d351(0x1ea),'a':_0x17d351(0x27f)},{'c':_0x17d351(0x15a),'s':0x7,'lv':'🔥','q':_0x17d351(0x393),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x17d351(0x15a),'s':0x7,'lv':'🔥','q':_0x17d351(0x38b),'a':_0x17d351(0x17d)},{'c':_0x17d351(0x15a),'s':0x7,'lv':'💎','q':_0x17d351(0x239),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>马尔可夫决策过程\x20MDP\x20=\x20⟨S,\x20A,\x20P,\x20R,\x20γ⟩：状态空间、动作空间、状态转移概率、奖励函数、折扣因子。<b>马尔可夫性</b>：下一状态只依赖当前状态和动作，与更早历史无关。目标：学一个策略\x20π(a|s)\x20最大化<b>期望累积折扣回报</b>\x20G_t\x20=\x20Σ\x20γᵏ\x20r_{t+k}。γ\x20控制远视程度（0只看眼前，接近\x201\x20极度远视）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“RL\x20和监督学习的本质区别？”——监督学习有标准答案（每步都告诉你对不对），RL\x20只有<b>延迟且稀疏的标量奖励</b>，且数据分布由自己的策略决定（非i.i.d.）；“为什么要折扣？”——保证无限期回报收敛，同时表达对时间的偏好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把\x20LLM\x20生成套进这个框架：状态=已生成的上下文，动作=下一个\x20token，奖励=整段回答的人类偏好分——这就是\x20RLHF\x20的建模方式。这句话能一秒证明你不是死记概念。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x17d351(0x18c),'a':_0x17d351(0x1bf)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x17d351(0x34e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Q-learning：用贝尔曼最优方程做<b>时序差分</b>更新，Q(s,a)\x20←\x20Q(s,a)\x20+\x20α[r\x20+\x20γ\x20max_a\x27\x20Q(s\x27,a\x27)\x20−\x20Q(s,a)]，学到\x20Q\x20后贪心取\x20argmax\x20就是最优策略。它是\x20<b>off-policy</b>的（更新用\x20max，与实际采样策略无关），所以能用经验回放。<b>DQN</b>\x20三个关键工程技巧：①\x20神经网络近似\x20Q\x20②\x20<b>经验回放池</b>打破样本相关性\x20③\x20<b>目标网络</b>（延迟更新的\x20Q\x20副本）稳定\x20TD\x20目标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么需要目标网络？”——不然是“用自己预测自己”，目标随参数一起动会震荡甚至发散；“局限？”——只适合<b>离散动作</b>，连续/高维动作空间要用策略方法。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>游戏AI\x20的经典入口（Atari、棋牌类离散动作）——腾讯游戏算法场景可以从这里切入讲。““““““'},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x17d351(0x3a4),'a':_0x17d351(0x2d7)},{'c':'rl','s':0x2,'lv':'⭐','q':'PPO：为什么它是工业标准？','a':_0x17d351(0x1ac)},{'c':'rl','s':0x2,'lv':'🔥','q':'on-policy\x20vs\x20off-policy：区别与影响','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x17d351(0x2f9),'a':_0x17d351(0x278)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x17d351(0x1a3),'a':_0x17d351(0x28f)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x17d351(0x328),'a':_0x17d351(0x20b)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x17d351(0x185),'a':_0x17d351(0x1c6)},{'c':'rl','s':0x3,'lv':'💎','q':_0x17d351(0x219),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x17d351(0x25a),'a':_0x17d351(0x342)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x17d351(0x3b1),'a':_0x17d351(0x224)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x17d351(0x227),'a':_0x17d351(0x27d)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x17d351(0x21a),'a':_0x17d351(0x187)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x17d351(0x140),'a':_0x17d351(0x193)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':_0x17d351(0x281)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x17d351(0x153),'a':_0x17d351(0x330)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x17d351(0x2c7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x17d351(0x2d2),'a':_0x17d351(0x241)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x17d351(0x2ff),'a':_0x17d351(0x290)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x17d351(0x2b1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x17d351(0x309),'a':_0x17d351(0x395)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':_0x17d351(0x39e)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x17d351(0x33f),'a':_0x17d351(0x138)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x17d351(0x2a4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x17d351(0x32c),'a':_0x17d351(0x16e)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x17d351(0x1ba),'a':_0x17d351(0x276)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x17d351(0x1a7),'a':_0x17d351(0x20f)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x17d351(0x3bb),'a':_0x17d351(0x37d)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x17d351(0x35a),'a':_0x17d351(0x1fa)},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x17d351(0x151)},{'c':'pt','s':0x3,'lv':'💎','q':_0x17d351(0x2ba),'a':_0x17d351(0x3b6)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x17d351(0x157),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x17d351(0x1ee),'s':0x0,'lv':'⭐','q':_0x17d351(0x14b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':'app','s':0x0,'lv':'⭐','q':_0x17d351(0x195),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x17d351(0x1ee),'s':0x1,'lv':'⭐','q':_0x17d351(0x2bd),'a':_0x17d351(0x1e1)},{'c':_0x17d351(0x1ee),'s':0x1,'lv':'🔥','q':'为什么要混合检索（向量\x20+\x20BM25）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x17d351(0x1ee),'s':0x1,'lv':'⭐','q':_0x17d351(0x17c),'a':_0x17d351(0x208)},{'c':'app','s':0x2,'lv':'🔥','q':_0x17d351(0x2de),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x17d351(0x1ee),'s':0x2,'lv':'⭐','q':_0x17d351(0x346),'a':_0x17d351(0x257)},{'c':_0x17d351(0x1ee),'s':0x3,'lv':'🔥','q':_0x17d351(0x386),'a':_0x17d351(0x324)},{'c':'app','s':0x3,'lv':'💎','q':_0x17d351(0x302),'a':_0x17d351(0x1eb)},{'c':'app','s':0x4,'lv':'⭐','q':_0x17d351(0x286),'a':_0x17d351(0x308)},{'c':_0x17d351(0x1ee),'s':0x4,'lv':'⭐','q':_0x17d351(0x205),'a':_0x17d351(0x254)},{'c':'app','s':0x4,'lv':'🔥','q':_0x17d351(0x34c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':_0x17d351(0x21e),'a':_0x17d351(0x1fd)},{'c':_0x17d351(0x1ee),'s':0x5,'lv':'🔥','q':'多轮对话的上下文怎么管理？','a':_0x17d351(0x181)},{'c':_0x17d351(0x1ee),'s':0x5,'lv':'💎','q':_0x17d351(0x1f2),'a':_0x17d351(0x361)},{'c':_0x17d351(0x1ee),'s':0x6,'lv':'⭐','q':_0x17d351(0x2bb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x17d351(0x1ee),'s':0x6,'lv':'⭐','q':_0x17d351(0x189),'a':_0x17d351(0x3a6)},{'c':_0x17d351(0x1ee),'s':0x6,'lv':'🔥','q':_0x17d351(0x359),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可观测</b>：全链路\x20trace——每次调用记录\x20prompt/响应/耗时/token\x20消耗/工具轨迹，工具用\x20Langfuse/LangSmith\x20或自建日志表；线上效果靠采样评估\x20+\x20用户行为信号（重试率、采纳率、人工介入率）监控。<b>成本三杠杆</b>：模型路由（简单问题给小模型）、prompt\x20瘦身（历史压缩、检索精简）、缓存（相同/相似\x20query\x20直接命中）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么发现线上效果退化？”——固定评估集定期回归\x20+\x20行为信号异动告警。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署场景讲“GPU\x20资源有限\x20→\x20按问题复杂度路由不同尺寸模型”，贴工业实际。““““““'},{'c':_0x17d351(0x1ee),'s':0x6,'lv':'💎','q':'RAG\x20vs\x20微调：什么问题上哪个？','a':_0x17d351(0x277)},{'c':'app','s':0x7,'lv':'⭐','q':'NL2SQL\x20的五大难点与解法（主场第一题）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Schema\x20Linking</b>：口语字段映射到真实表/列\x20→\x20schema\x20裁剪\x20+\x20字段别名库\x20+\x20RAG\x20检索注入\x20②\x20<b>业务口径</b>：“上月销量”的定义\x20→\x20口径说明库\x20+\x20few-shot\x20示例\x20③\x20<b>复杂逻辑</b>：多表\x20join/嵌套聚合\x20→\x20任务分解、分步生成\x20④\x20<b>可靠性</b>：语法校验\x20+\x20执行反馈修正循环\x20+\x20查询要素完备性检查\x20⑤\x20<b>安全</b>：只读限制、行列权限、注入防护、LIMIT\x20强制。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>每个难点都会再挖一层（见本节后续条目）——这一条的答法决定面试官往哪挖。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>数据随时能报：10\x20张表\x20/\x20307\x20字段\x20/\x20约\x2090\x20万行真实工业数据，SQL\x20可执行率\x2098%、人工校验正确率\x2096%——<b>并且能讲清两个口径的区别</b>。““““““'},{'c':_0x17d351(0x1ee),'s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':_0x17d351(0x268)},{'c':_0x17d351(0x1ee),'s':0x7,'lv':'⭐','q':_0x17d351(0x1a4),'a':_0x17d351(0x1e0)},{'c':_0x17d351(0x1ee),'s':0x7,'lv':'🔥','q':_0x17d351(0x26b),'a':_0x17d351(0x256)},{'c':_0x17d351(0x1ee),'s':0x7,'lv':'🔥','q':_0x17d351(0x2d9),'a':_0x17d351(0x1e2)},{'c':_0x17d351(0x14a),'s':0x0,'lv':'⭐','q':_0x17d351(0x36c),'a':_0x17d351(0x20a)},{'c':_0x17d351(0x14a),'s':0x0,'lv':'⭐','q':_0x17d351(0x381),'a':_0x17d351(0x334)},{'c':_0x17d351(0x14a),'s':0x0,'lv':'🔥','q':'装饰器与常见\x20Python\x20进阶考点','a':_0x17d351(0x191)},{'c':_0x17d351(0x14a),'s':0x1,'lv':'⭐','q':_0x17d351(0x272),'a':_0x17d351(0x305)},{'c':_0x17d351(0x14a),'s':0x1,'lv':'🔥','q':_0x17d351(0x364),'a':_0x17d351(0x307)},{'c':'eng','s':0x1,'lv':'🔥','q':_0x17d351(0x380),'a':_0x17d351(0x36d)},{'c':_0x17d351(0x14a),'s':0x2,'lv':'⭐','q':_0x17d351(0x399),'a':_0x17d351(0x2f1)},{'c':'eng','s':0x2,'lv':'🔥','q':_0x17d351(0x2dd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':_0x17d351(0x14a),'s':0x3,'lv':'🔥','q':'Docker：镜像、容器与部署最佳实践','a':_0x17d351(0x2b6)},{'c':_0x17d351(0x14a),'s':0x3,'lv':'🔥','q':_0x17d351(0x1c5),'a':_0x17d351(0x36e)},{'c':_0x17d351(0x14a),'s':0x3,'lv':'🔥','q':_0x17d351(0x1a1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':_0x17d351(0x14a),'s':0x4,'lv':'⭐','q':_0x17d351(0x21f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x17d351(0x14a),'s':0x4,'lv':'🔥','q':_0x17d351(0x1f8),'a':_0x17d351(0x173)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x17d351(0x38a),'a':_0x17d351(0x2a3)},{'c':_0x17d351(0x14a),'s':0x4,'lv':'💎','q':_0x17d351(0x319),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心原则：<b>应用层无状态，会话状态外置</b>（Redis\x20存活跃会话\x20+\x20数据库落历史），这样服务可水平扩展、重启不丢会话。状态内容分层：结构化状态（当前任务、已确认参数）+\x20消息历史（可摘要压缩）+\x20用户画像（长期记忆，向量化）。要设计：会话\x20TTL、历史长度上限与压缩策略、并发同一会话的加锁、以及<b>敏感数据的存储与清理策略</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“历史太长怎么办？”——滑窗\x20+\x20摘要\x20+\x20结构化状态三层策略（见第六章\x206.6）；“怎么支持“重新生成”？”——保存每轮的请求快照（含检索结果和\x20prompt），才能可复现地重跑。“““'},{'c':'eng','s':0x4,'lv':'💎','q':_0x17d351(0x396),'a':_0x17d351(0x2b8)},{'c':_0x17d351(0x31a),'s':0x0,'lv':'⭐','q':'60秒自我介绍（电话面\x20/\x20开场用）','a':_0x17d351(0x3a3)},{'c':_0x17d351(0x31a),'s':0x0,'lv':'⭐','q':_0x17d351(0x1df),'a':_0x17d351(0x392)},{'c':_0x17d351(0x31a),'s':0x1,'lv':'⭐','q':_0x17d351(0x214),'a':_0x17d351(0x26f)},{'c':'story','s':0x1,'lv':'⭐','q':_0x17d351(0x348),'a':_0x17d351(0x298)},{'c':_0x17d351(0x31a),'s':0x2,'lv':'⭐','q':_0x17d351(0x271),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x
