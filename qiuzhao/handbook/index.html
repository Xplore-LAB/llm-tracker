<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

lb\x27>◈\x20核心回答（先说四步再写代码）</span><br>①\x20<b>状态定义</b>（dp[i]\x20表示什么，说清楚）②\x20<b>转移方程</b>\x20③\x20<b>初始化与边界</b>\x20④\x20<b>遍历顺序</b>。<b>0-1\x20背包</b>：dp[i][w]=max(不选\x20i,\x20选\x20i)，空间压成一维时<b>容量必须逆序遍历</b>（防同一物品被重复选）。<b>编辑距离（72）</b>：dp[i][j]=word1\x20前\x20i\x20个变成\x20word2\x20前\x20j\x20个的最小操作数；字符相等取\x20dp[i−1][j−1]，否则\x20min(插入,\x20删除,\x20替换)+1。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么想到状态定义？”——从“最后一步怎么来的”倒推；“其他高频？”——最长递增子序列（300，含二分优化\x20O(n\x20log\x20n)）、最长公共子序列、打家劫舍、股票买卖系列。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试时<b>先口述四步再动手写</b>——直接闷头写代码，写错了面试官也不知道你会不会。““'},{'c':_0x46c269(0x2ce),'s':0x4,'lv':'🔥','q':_0x46c269(0x3cd),'a':_0x46c269(0x1c6)},{'c':'code','s':0x5,'lv':'🔥','q':_0x46c269(0x1ee),'a':_0x46c269(0x323)},{'c':_0x46c269(0x2ce),'s':0x5,'lv':'💎','q':_0x46c269(0x34e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x46c269(0x1d2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x46c269(0x375),'a':_0x46c269(0x340)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x46c269(0x190),'a':_0x46c269(0x27e)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x46c269(0x2bf),'a':_0x46c269(0x2c4)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x46c269(0x387),'a':_0x46c269(0x3ab)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x46c269(0x328),'a':_0x46c269(0x3a4)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x46c269(0x265),'a':_0x46c269(0x2cb)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x46c269(0x23e),'a':_0x46c269(0x2b0)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x46c269(0x1a3),'a':_0x46c269(0x290)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x46c269(0x23d),'a':_0x46c269(0x18e)},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':_0x46c269(0x303)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x46c269(0x27c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x46c269(0x3ac),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x46c269(0x380),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x46c269(0x2be),'a':_0x46c269(0x1a4)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x46c269(0x2b9),'a':_0x46c269(0x37a)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x46c269(0x2ae),'a':_0x46c269(0x1af)},{'c':'ml','s':0x3,'lv':'💎','q':_0x46c269(0x2f3),'a':_0x46c269(0x3db)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x46c269(0x258),'a':_0x46c269(0x289)},{'c':_0x46c269(0x27b),'s':0x0,'lv':'⭐','q':_0x46c269(0x361),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x46c269(0x27b),'s':0x0,'lv':'🔥','q':_0x46c269(0x1d6),'a':_0x46c269(0x350)},{'c':'llm','s':0x0,'lv':'🔥','q':_0x46c269(0x1e8),'a':_0x46c269(0x310)},{'c':_0x46c269(0x27b),'s':0x1,'lv':'⭐','q':_0x46c269(0x21a),'a':_0x46c269(0x311)},{'c':_0x46c269(0x27b),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x46c269(0x27b),'s':0x1,'lv':'🔥','q':_0x46c269(0x2e0),'a':_0x46c269(0x3d0)},{'c':_0x46c269(0x27b),'s':0x2,'lv':'⭐','q':_0x46c269(0x29b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':'llm','s':0x2,'lv':'⭐','q':_0x46c269(0x1de),'a':_0x46c269(0x3da)},{'c':_0x46c269(0x27b),'s':0x2,'lv':'💎','q':_0x46c269(0x337),'a':_0x46c269(0x270)},{'c':'llm','s':0x3,'lv':'⭐','q':_0x46c269(0x3c0),'a':_0x46c269(0x331)},{'c':'llm','s':0x3,'lv':'🔥','q':_0x46c269(0x330),'a':_0x46c269(0x1b2)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x46c269(0x318),'a':_0x46c269(0x236)},{'c':_0x46c269(0x27b),'s':0x4,'lv':'🔥','q':_0x46c269(0x31f),'a':_0x46c269(0x3a5)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x46c269(0x241),'a':_0x46c269(0x3d9)},{'c':_0x46c269(0x27b),'s':0x5,'lv':'🔥','q':_0x46c269(0x1c3),'a':_0x46c269(0x273)},{'c':_0x46c269(0x27b),'s':0x5,'lv':'🔥','q':_0x46c269(0x36f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x46c269(0x27b),'s':0x5,'lv':'💎','q':_0x46c269(0x1e9),'a':_0x46c269(0x27d)},{'c':_0x46c269(0x27b),'s':0x5,'lv':'🔥','q':_0x46c269(0x28d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x46c269(0x27b),'s':0x6,'lv':'⭐','q':_0x46c269(0x379),'a':_0x46c269(0x208)},{'c':_0x46c269(0x27b),'s':0x6,'lv':'🔥','q':_0x46c269(0x2dd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':_0x46c269(0x27b),'s':0x7,'lv':'⭐','q':'幻觉的成因与全链路缓解手段','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因四层：①\x20训练数据本身有错/有噪\x20②\x20next-token\x20目标只奖励“像人话”，不奖励“是真的”\x20③\x20模型不知道自己不知道（知识边界缺失）\x20④\x20采样随机性引入漂移。缓解按链路排：数据清洗\x20→\x20SFT\x20加入<b>拒答与边界样本</b>\x20→\x20偏好对齐惩罚编造\x20→\x20<b>RAG\x20外挂知识\x20+\x20引用溯源</b>\x20→\x20结构化输出约束\x20→\x20生成后一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能彻底消除吗？”——不能，它是概率生成的内在属性；工程目标是<b>把幻觉控制在可接受范围并让它可被发现</b>（溯源、置信度、拒答）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>OKC-SFT\x20直接打这个问题：六段式知识链强制模型输出\x20Verification\x20和\x20Risk\x20Boundary，幻觉率\x2034.4%→15.6%，Verification/Risk\x20Boundary\x20出现率\x20100%——<b>“我不是在让模型少说错，是在让它必须自证”</b>，这句话能让面试官记住你。““““““'},{'c':_0x46c269(0x27b),'s':0x7,'lv':'🔥','q':'怎么判断模型“知不知道自己不知道”？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x46c269(0x27b),'s':0x7,'lv':'🔥','q':_0x46c269(0x19f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>不更新任何参数，只在\x20prompt\x20里给示例，模型就能完成新任务——GPT-3\x20的核心发现。主流解释（面试够用）：预训练中见过海量“任务-示例-答案”结构，模型学会了在上下文中做<b>模式补全\x20/\x20隐式贝叶斯任务推断</b>；也有研究认为注意力可以实现类似梯度下降的隐式优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“示例怎么选影响大吗？”——非常大：数量（3-5个通常够）、<b>格式一致性</b>（比内容正确性影响更大）、顺序（近端示例影响更强）、与query\x20的相似度（检索式选例更优）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目把\x20SQL\x20示例入库、按\x20query\x20检索注入，就是“检索式\x20few-shot\x20选例”的工程实现——这是\x20ICL\x20原理的直接应用。““““““'},{'c':_0x46c269(0x27b),'s':0x7,'lv':'💎','q':_0x46c269(0x277),'a':_0x46c269(0x384)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x46c269(0x329),'a':_0x46c269(0x224)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x46c269(0x383),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':'Q-learning\x20与\x20DQN：价值方法怎么工作','a':_0x46c269(0x21e)},{'c':'rl','s':0x1,'lv':'💎','q':_0x46c269(0x2ea),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x46c269(0x351),'a':_0x46c269(0x33a)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x46c269(0x364),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x46c269(0x1bf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x46c269(0x26c),'a':_0x46c269(0x3d6)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x46c269(0x2fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x46c269(0x3c5),'a':_0x46c269(0x22c)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x46c269(0x1ca),'a':_0x46c269(0x385)},{'c':'rl','s':0x3,'lv':'💎','q':_0x46c269(0x259),'a':_0x46c269(0x268)},{'c':'rl','s':0x4,'lv':'🔥','q':'奖励塑形与奖励黑客（游戏\x20RL\x20的核心难题）','a':_0x46c269(0x174)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x46c269(0x255),'a':_0x46c269(0x228)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x46c269(0x271)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':_0x46c269(0x29c)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x46c269(0x1a1),'a':_0x46c269(0x33b)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x46c269(0x371),'a':_0x46c269(0x1da)},{'c':'pt','s':0x1,'lv':'⭐','q':'LoRA：低秩假设到底在假设什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x46c269(0x2b5),'a':_0x46c269(0x33c)},{'c':'pt','s':0x1,'lv':'🔥','q':'LoRA的\x20rank\x20和\x20alpha\x20怎么定？','a':_0x46c269(0x282)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x46c269(0x36c),'a':_0x46c269(0x339)},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x46c269(0x2c9),'a':_0x46c269(0x249)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x46c269(0x327),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x46c269(0x245),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x46c269(0x262),'a':_0x46c269(0x187)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':_0x46c269(0x38c)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x46c269(0x19c),'a':_0x46c269(0x1f7)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x46c269(0x3b8),'a':_0x46c269(0x225)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x46c269(0x398),'a':_0x46c269(0x315)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x46c269(0x2ee),'a':_0x46c269(0x261)},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x46c269(0x1b3)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':_0x46c269(0x252)},{'c':_0x46c269(0x39c),'s':0x0,'lv':'⭐','q':_0x46c269(0x1d7),'a':_0x46c269(0x2fd)},{'c':_0x46c269(0x39c),'s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':_0x46c269(0x233)},{'c':'app','s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x46c269(0x39c),'s':0x1,'lv':'🔥','q':_0x46c269(0x3a2),'a':_0x46c269(0x2ed)},{'c':'app','s':0x1,'lv':'⭐','q':_0x46c269(0x1d1),'a':_0x46c269(0x35e)},{'c':'app','s':0x2,'lv':'🔥','q':_0x46c269(0x1cd),'a':_0x46c269(0x2d6)},{'c':'app','s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x46c269(0x352)},{'c':_0x46c269(0x39c),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x46c269(0x357)},{'c':_0x46c269(0x39c),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':_0x46c269(0x3e5)},{'c':_0x46c269(0x39c),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':_0x46c269(0x3c7)},{'c':_0x46c269(0x39c),'s':0x4,'lv':'⭐','q':_0x46c269(0x3bc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>让模型交替输出\x20Thought（推理）→\x20Action（调工具）→\x20Observation（结果）→\x20Thought……直到给出答案。价值：“想”和“做”交织，推理过程显式化，工具结果指导下一步——比直接输出答案可靠，比纯\x20CoT\x20多了与世界交互的能力。本质上\x20<b>ReAct\x20=\x20CoT\x20+\x20工具使用</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价？”——多轮调用、延迟高、token\x20贵、可能死循环（必须设\x20max_steps）；“现代框架和它的关系？”——LangGraph\x20等的\x20agent\x20loop\x20本质都是\x20ReAct\x20的工程化封装。““““““'},{'c':_0x46c269(0x39c),'s':0x4,'lv':'🔥','q':_0x46c269(0x2b8),'a':_0x46c269(0x1eb)},{'c':_0x46c269(0x39c),'s':0x4,'lv':'🔥','q':_0x46c269(0x2ec),'a':_0x46c269(0x2b4)},{'c':_0x46c269(0x39c),'s':0x5,'lv':'🔥','q':'多轮对话的上下文怎么管理？','a':_0x46c269(0x1fd)},{'c':'app','s':0x5,'lv':'💎','q':_0x46c269(0x308),'a':_0x46c269(0x20e)},{'c':_0x46c269(0x39c),'s':0x6,'lv':'⭐','q':_0x46c269(0x3a3),'a':_0x46c269(0x23b)},{'c':_0x46c269(0x39c),'s':0x6,'lv':'⭐','q':'Prompt\x20Injection：LLM\x20应用的头号安全问题','a':_0x46c269(0x3e8)},{'c':'app','s':0x6,'lv':'🔥','q':_0x46c269(0x20a),'a':_0x46c269(0x297)},{'c':_0x46c269(0x39c),'s':0x6,'lv':'💎','q':_0x46c269(0x22e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':'app','s':0x7,'lv':'⭐','q':_0x46c269(0x326),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Schema\x20Linking</b>：口语字段映射到真实表/列\x20→\x20schema\x20裁剪\x20+\x20字段别名库\x20+\x20RAG\x20检索注入\x20②\x20<b>业务口径</b>：“上月销量”的定义\x20→\x20口径说明库\x20+\x20few-shot\x20示例\x20③\x20<b>复杂逻辑</b>：多表\x20join/嵌套聚合\x20→\x20任务分解、分步生成\x20④\x20<b>可靠性</b>：语法校验\x20+\x20执行反馈修正循环\x20+\x20查询要素完备性检查\x20⑤\x20<b>安全</b>：只读限制、行列权限、注入防护、LIMIT\x20强制。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>每个难点都会再挖一层（见本节后续条目）——这一条的答法决定面试官往哪挖。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>数据随时能报：10\x20张表\x20/\x20307\x20字段\x20/\x20约\x2090\x20万行真实工业数据，SQL\x20可执行率\x2098%、人工校验正确率\x2096%——<b>并且能讲清两个口径的区别</b>。““““““'},{'c':_0x46c269(0x39c),'s':0x7,'lv':'🔥','q':_0x46c269(0x1bd),'a':_0x46c269(0x1e6)},{'c':'app','s':0x7,'lv':'⭐','q':_0x46c269(0x191),'a':_0x46c269(0x388)},{'c':_0x46c269(0x39c),'s':0x7,'lv':'🔥','q':'执行反馈修正循环：怎么设计才不翻车？','a':_0x46c269(0x3ba)},{'c':_0x46c269(0x39c),'s':0x7,'lv':'🔥','q':_0x46c269(0x1b7),'a':_0x46c269(0x20c)},{'c':_0x46c269(0x36a),'s':0x0,'lv':'⭐','q':'Python\x20GIL：是什么、影响什么、怎么绕','a':_0x46c269(0x2e9)},{'c':_0x46c269(0x36a),'s':0x0,'lv':'⭐','q':'asyncio：协程、事件循环、常见坑','a':_0x46c269(0x197)},{'c':_0x46c269(0x36a),'s':0x0,'lv':'🔥','q':_0x46c269(0x2f6),'a':_0x46c269(0x1a6)},{'c':_0x46c269(0x36a),'s':0x1,'lv':'⭐','q':_0x46c269(0x1bc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→ 下文长度）+\x20余量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“并发上不去为什么？”——多半是\x20KV\x20Cache\x20占满导致可并发序列数受限，用\x20GQA\x20模型\x20/\x20KV\x20量化\x20/\x20限制上下文长度解决；“怎么保P99\x20延迟？”——限制单请求最大生成长度\x20+\x20请求队列\x20+\x20优先级调度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能把这套算术和第二/三章的显存账本串起来讲，是应用岗里少见的<b>系统性思维</b>。“““'},{'c':'eng','s':0x4,'lv':'🔥','q':_0x46c269(0x307),'a':_0x46c269(0x3a1)},{'c':_0x46c269(0x36a),'s':0x4,'lv':'💎','q':_0x46c269(0x2d9),'a':_0x46c269(0x3bd)},{'c':_0x46c269(0x36a),'s':0x4,'lv':'💎','q':_0x46c269(0x1dd),'a':_0x46c269(0x1ba)},{'c':_0x46c269(0x203),'s':0x0,'lv':'⭐','q':'60秒自我介绍（电话面\x20/\x20开场用）','a':_0x46c269(0x305)},{'c':_0x46c269(0x203),'s':0x0,'lv':'⭐','q':_0x46c269(0x25f),'a':_0x46c269(0x216)},{'c':'story','s':0x1,'lv':'⭐','q':_0x46c269(0x309),'a':_0x46c269(0x1a0)},{'c':'story','s':0x1,'lv':'⭐','q':_0x46c269(0x3e0),'a':_0x46c269(0x3d2)},{'c':_0x46c269(0x203),'s':0x2,'lv':'⭐','q':_0x46c269(0x275),'a':_0x46c269(0x2fc)},{'c':_0x46c269(0x203),'s':0x2,'lv':'🔥','q':'NL2SQL\x20项目的十个必问追问（自检清单）','a':_0x46c269(0x3ca)},{'c':_0x46c269(0x203),'s':0x3,'lv':'⭐','q':_0x46c269(0x2ad),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>问题</b>：空分装置异常处置场景，大模型给的建议存在三个问题——<b>回答结构不稳定、缺少验证闭环、会生成不受支持的内容</b>。这三个问题在工业安全场景是不可接受的。<br><b>方法</b>：提出\x20OKC-SFT——把现场操作员的处置逻辑建模为六阶段知识链（<b>Diagnosis\x20→\x20Evidence\x20→\x20Causes\x20→\x20Actions\x20→\x20Verification\x20→\x20Risk\x20Boundary</b>），用结构化监督微调引导模型按这个链路输出。<br><b>数据</b>：基于操作规程、现场案例、工艺机理和专家经验构建\x20611\x20条监督样本，覆盖\x206\x20类任务；<b>不是凑数量，是按任务类型做覆盖设计</b>。<br><b>训练</b>：Qwen2.5-7B-Instruct\x20为基座，QLoRA\x20微调——611\x20条数据\x20+\x20有限算力下，全量微调既超显存又必过拟合。<br><b>实验</b>：三组对照（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）+\x20消融，证明提升来自<b>结构化监督</b>而非微调本身。<br><b>结果</b>：结构完整率\x2099.8%、关键点覆盖率\x200.5407→0.7378、Verification\x20与\x20Risk\x20Boundary\x20出现率\x20100%、幻觉率\x2034.4%→15.6%。<br><span\x20class=\x27lb\x27>⚓\x20金句（收尾用）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>“'},{'c':'story','s':0x3,'lv':'🔥','q':_0x46c269(0x3d7),'a':'<span\x20class=\x27lb\x27>◈\x20
