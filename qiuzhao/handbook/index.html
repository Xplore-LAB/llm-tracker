<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

0mid<br>\u3000else:\x20left\x20=\x20mid\x20+\x201<br>return\x20left<br>其中\x20check(mid)\x20表示“mid\x20满足条件”，返回的是<b>第一个满足条件的位置</b>。核心纪律：<b>区间语义全程一致</b>，mid\x20取左中位数时\x20right=mid\x20不会死循环。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“找最后一个满足的？”——把问题转成“第一个不满足的位置\x20−\x201”，别另写一套模板；“变种题？”——搜索旋转数组（33）、寻找峰值（162）、第一个错误版本（278）、答案二分（如“分割数组的最大值”410）。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>只背一种模板并把它写熟</b>，比记三种模板更可靠——现场紧张时记忆最容易串。““'},{'c':_0x3549c4(0x2ec),'s':0x1,'lv':'⭐','q':'快速排序与快速选择（TopK\x20核心）','a':_0x3549c4(0x215)},{'c':_0x3549c4(0x2ec),'s':0x1,'lv':'🔥','q':'排序算法对比与稳定性','a':_0x3549c4(0x165)},{'c':'code','s':0x2,'lv':'⭐','q':_0x3549c4(0x101),'a':_0x3549c4(0x15d)},{'c':_0x3549c4(0x2ec),'s':0x2,'lv':'⭐','q':_0x3549c4(0x1cd),'a':_0x3549c4(0x2cb)},{'c':'code','s':0x2,'lv':'🔥','q':'二叉树：遍历、层序与最近公共祖先','a':_0x3549c4(0x222)},{'c':'code','s':0x2,'lv':'🔥','q':_0x3549c4(0x28a),'a':_0x3549c4(0x2e0)},{'c':_0x3549c4(0x2ec),'s':0x3,'lv':'⭐','q':_0x3549c4(0x281),'a':_0x3549c4(0x2a6)},{'c':_0x3549c4(0x2ec),'s':0x3,'lv':'🔥','q':_0x3549c4(0x30c),'a':_0x3549c4(0x31f)},{'c':_0x3549c4(0x2ec),'s':0x3,'lv':'🔥','q':_0x3549c4(0x14f),'a':_0x3549c4(0x1de)},{'c':_0x3549c4(0x2ec),'s':0x3,'lv':'🔥','q':_0x3549c4(0x27f),'a':_0x3549c4(0x21d)},{'c':_0x3549c4(0x2ec),'s':0x4,'lv':'⭐','q':_0x3549c4(0x1f9),'a':_0x3549c4(0x16c)},{'c':_0x3549c4(0x2ec),'s':0x4,'lv':'🔥','q':_0x3549c4(0x2e2),'a':_0x3549c4(0x1c8)},{'c':_0x3549c4(0x2ec),'s':0x5,'lv':'🔥','q':'手写线程安全队列与限流器','a':_0x3549c4(0x24a)},{'c':'code','s':0x5,'lv':'💎','q':_0x3549c4(0x24e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3549c4(0x151),'a':_0x3549c4(0x270)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3549c4(0x148),'a':_0x3549c4(0x211)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3549c4(0x196),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Adam\x20=\x20<b>一阶动量</b>（梯度的指数滑动平均，平滑方向）+\x20<b>二阶动量</b>（梯度平方的滑动平均，做逐参数自适应步长）+\x20偏差修正。优势：收敛快、对超参不敏感、稀疏梯度友好——大模型默认选择。<b>代价（必背算术）</b>：每个参数多存两个\x20fp32\x20状态\x20=\x208\x20字节；加上\x20fp32\x20主权重和梯度，全量微调约\x20<b>16\x20字节/参数</b>，7B\x20就是\x20112GB\x20量级——这是“7B\x20全量微调必须多卡、单卡只能\x20LoRA”的根本原因。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“AdamW\x20和\x20Adam\x20的区别？”——AdamW\x20把\x20weight\x20decay\x20从梯度里<b>解耦</b>出来直接作用于权重，正则效果更正确，是现在的标准；“SGD\x20还有用吗？”——CV\x20里精调有时泛化更好，但LLM\x20场景几乎全用\x20AdamW。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这笔账直接支撑你选\x20QLoRA\x20的理由——见第三章「参数量与显存估算」。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':'为什么要\x20warmup\x20+\x20cosine\x20decay？','a':_0x3549c4(0x1ed)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x3549c4(0x138),'a':_0x3549c4(0x136)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x3549c4(0x319),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x3549c4(0x11c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>BN</b>\x20沿\x20batch\x20维归一化\x20→\x20依赖\x20batch\x20统计量，推理要用滑动平均，batch\x20小或序列变长时不稳定，NLP\x20变长序列场景直接失效。<b>LN</b>\x20沿特征维对每个样本独立归一化\x20→与\x20batch\x20无关，<b>训练和推理行为完全一致</b>。进阶：<b>Pre-LN</b>（LN\x20放在残差分支之前）训练稳定性好、现代\x20LLM\x20标配；<b>RMSNorm</b>\x20去掉减均值只做缩放，计算更省、效果相当，Llama/Qwen\x20在用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Pre-LN和\x20Post-LN\x20差别？”——Post-LN\x20极限性能略好但需要小心\x20warmup\x20否则难收敛；Pre-LN\x20梯度更稳、深层可训，工业上选稳定；“归一化到底在解决什么？”——稳定每层输入分布、平滑损失曲面，让更大\x20lr\x20可用。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':_0x3549c4(0x176),'a':_0x3549c4(0x109)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x3549c4(0x10e)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x3549c4(0x178),'a':_0x3549c4(0xca)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x3549c4(0x28f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>信号：训练\x20loss\x20持续降但<b>验证\x20loss\x20转升</b>；训练集指标远好于测试集；模型开始复述训练样本。对策按大模型语境的性价比排序：①\x20<b>更多/更干净的数据</b>（永远最有效）②\x20<b>早停</b>——监控验证集，SFT\x20里\x20epoch\x20设\x202~3\x20就是经验性防过拟合\x20③\x20<b>用\x20LoRA\x20限制可训练参数量</b>（小数据尤其有效）④\x20weight\x20decay\x20/\x20dropout\x20⑤\x20数据混合与多任务。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“小数据微调怎么防？”——LoRA\x20+\x20小\x20r\x20+\x20少\x20epoch\x20+\x20早停\x20+\x20掺通用数据，四件套；<b>你的\x20611\x20条数据场景正好适用这套组合，被问“数据这么少怎么保证不过拟合”时按这个答。</b>““““'},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x3549c4(0x111)},{'c':'ml','s':0x2,'lv':'🔥','q':'偏差-方差权衡，以及它在大模型时代的变化','a':_0x3549c4(0x26c)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x3549c4(0x2dd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x3549c4(0x324),'a':_0x3549c4(0x2aa)},{'c':'ml','s':0x3,'lv':'⭐','q':'数据并行\x20/\x20张量并行\x20/\x20流水线并行\x20/\x20ZeRO','a':_0x3549c4(0x205)},{'c':'ml','s':0x3,'lv':'⭐','q':'训练显存都花在哪了？（能算这笔账就赢一半）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':'量化：INT8\x20/\x20INT4\x20/\x20GPTQ\x20/\x20AWQ\x20一句话区分','a':_0x3549c4(0x199)},{'c':_0x3549c4(0x262),'s':0x0,'lv':'⭐','q':_0x3549c4(0x225),'a':_0x3549c4(0x287)},{'c':_0x3549c4(0x262),'s':0x0,'lv':'⭐','q':_0x3549c4(0x2a0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x3549c4(0x262),'s':0x0,'lv':'🔥','q':_0x3549c4(0x257),'a':_0x3549c4(0x19c)},{'c':_0x3549c4(0x262),'s':0x0,'lv':'🔥','q':_0x3549c4(0x2fb),'a':_0x3549c4(0xef)},{'c':_0x3549c4(0x262),'s':0x1,'lv':'⭐','q':_0x3549c4(0x147),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x3549c4(0x262),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':_0x3549c4(0xc3)},{'c':_0x3549c4(0x262),'s':0x1,'lv':'🔥','q':_0x3549c4(0x2ca),'a':_0x3549c4(0x185)},{'c':_0x3549c4(0x262),'s':0x2,'lv':'⭐','q':_0x3549c4(0x2af),'a':_0x3549c4(0x2d0)},{'c':_0x3549c4(0x262),'s':0x2,'lv':'⭐','q':_0x3549c4(0x1e2),'a':_0x3549c4(0x1c2)},{'c':_0x3549c4(0x262),'s':0x2,'lv':'💎','q':'推理加速手段速览（应用岗水位）','a':_0x3549c4(0xb5)},{'c':_0x3549c4(0x262),'s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':_0x3549c4(0x283)},{'c':_0x3549c4(0x262),'s':0x3,'lv':'🔥','q':_0x3549c4(0x192),'a':_0x3549c4(0xba)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x3549c4(0x286),'a':_0x3549c4(0x169)},{'c':_0x3549c4(0x262),'s':0x4,'lv':'🔥','q':_0x3549c4(0x289),'a':_0x3549c4(0x131)},{'c':_0x3549c4(0x262),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':_0x3549c4(0xff)},{'c':_0x3549c4(0x262),'s':0x5,'lv':'🔥','q':_0x3549c4(0x2c4),'a':_0x3549c4(0x122)},{'c':_0x3549c4(0x262),'s':0x5,'lv':'🔥','q':'Qwen\x20/\x20Llama\x20/\x20DeepSeek：架构差异一句话说清','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x3549c4(0x262),'s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':_0x3549c4(0x262),'s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':_0x3549c4(0x2d1)},{'c':_0x3549c4(0x262),'s':0x6,'lv':'⭐','q':'推理模型（R1\x20/\x20o1）与普通模型的本质区别','a':_0x3549c4(0xcb)},{'c':_0x3549c4(0x262),'s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':_0x3549c4(0x235)},{'c':_0x3549c4(0x262),'s':0x7,'lv':'⭐','q':'幻觉的成因与全链路缓解手段','a':_0x3549c4(0x11a)},{'c':_0x3549c4(0x262),'s':0x7,'lv':'🔥','q':_0x3549c4(0xf1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x3549c4(0x262),'s':0x7,'lv':'🔥','q':_0x3549c4(0x180),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>不更新任何参数，只在\x20prompt\x20里给示例，模型就能完成新任务——GPT-3\x20的核心发现。主流解释（面试够用）：预训练中见过海量“任务-示例-答案”结构，模型学会了在上下文中做<b>模式补全\x20/\x20隐式贝叶斯任务推断</b>；也有研究认为注意力可以实现类似梯度下降的隐式优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“示例怎么选影响大吗？”——非常大：数量（3-5个通常够）、<b>格式一致性</b>（比内容正确性影响更大）、顺序（近端示例影响更强）、与query\x20的相似度（检索式选例更优）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目把\x20SQL\x20示例入库、按\x20query\x20检索注入，就是“检索式\x20few-shot\x20选例”的工程实现——这是\x20ICL\x20原理的直接应用。““““““'},{'c':_0x3549c4(0x262),'s':0x7,'lv':'💎','q':_0x3549c4(0xbc),'a':_0x3549c4(0x2c9)},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x3549c4(0x127)},{'c':'rl','s':0x0,'lv':'⭐','q':'价值函数与贝尔曼方程','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x3549c4(0x10b),'a':_0x3549c4(0x145)},{'c':'rl','s':0x1,'lv':'💎','q':_0x3549c4(0x103),'a':_0x3549c4(0x12d)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':_0x3549c4(0xf5)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x3549c4(0xc0),'a':_0x3549c4(0x1e3)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x3549c4(0x11d),'a':_0x3549c4(0x310)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3549c4(0x229),'a':_0x3549c4(0x1e4)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3549c4(0x21f),'a':_0x3549c4(0x1d2)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3549c4(0x296),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':_0x3549c4(0x154),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一条主线：<b>不断削减对辅助模型和在线采样的依赖</b>。PPO：完整\x20RL，要\x20actor+critic+RM+reference\x20四模型，效果强但工程重。DPO：把奖励解析掉，<b>去掉\x20RM\x20和\x20RL\x20循环</b>，变离线监督学习——便宜稳定，但没探索。GRPO：保留在线\x20RL\x20的探索能力，但<b>去掉\x20critic</b>，用组内相对优势\x20+\x20可验证奖励——在推理任务上取得突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“实际项目怎么选？”——数据是成对偏好、要快出结果\x20→\x20DPO；任务有自动可验证的正确性（代码/数学/SQL）→\x20GRPO\x20类方法；有充足算力和标注团队要做通用对齐\x20→\x20PPO。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把NL2SQL\x20接进来：<b>“SQL\x20的执行结果是天然的可验证奖励信号——这个任务其实非常适合\x20GRPO\x20类方法，是我这个项目下一步最有价值的延伸方向。”</b>这句话把项目、RL\x20知识、技术前瞻三者串起来，是能让面试官眼睛一亮的答案。““““““'},{'c':'rl','s':0x3,'lv':'💎','q':_0x3549c4(0x275),'a':_0x3549c4(0x230)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x3549c4(0x284),'a':_0x3549c4(0xdc)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':_0x3549c4(0x2e9)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x3549c4(0xf3),'a':_0x3549c4(0x2a8)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x3549c4(0x30d)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3549c4(0x30a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3549c4(0x12f),'a':_0x3549c4(0x1d1)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3549c4(0x1d8),'a':_0x3549c4(0x263)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x3549c4(0x245),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x3549c4(0x291),'a':_0x3549c4(0x203)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x3549c4(0x2e7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':'灾难性遗忘：怎么发现、怎么缓解','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x3549c4(0x157),'a':_0x3549c4(0x23f)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Adapter</b>：层间插入小瓶颈网络——有效但增加推理延迟（不能合并）。<b>Prefix/Prompt\x20Tuning</b>：只训一小段可学习的虚拟token\x20前缀——参数极少但占用上下文长度、效果不稳。<b>LoRA</b>：低秩旁路，可合并零延迟——事实标准。<b>DoRA</b>：把\x20ΔW\x20分解为幅度和方向分别学习，效果优于\x20LoRA\x20且同样可合并。<b>AdaLoRA</b>：动态给不同层分配不同\x20rank。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20LoRA\x20赢了？”——可合并（零推理开销）+\x20效果接近全量\x20+\x20实现简单\x20+\x20可热插拔，四点齐备。“““““'},{'c':'pt','s':0x2,'lv':'⭐','q':_0x3549c4(0xcc),'a':_0x3549c4(0x190)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x3549c4(0x1d9),'a':_0x3549c4(0x311)},{'c':'pt','s':0x2,'lv':'💎','q':_0x3549c4(0x253),'a':_0x3549c4(0x290)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':_0x3549c4(0x2ab)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x3549c4(0x31d),'a':_0x3549c4(0x1c9)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x3549c4(0x2ef),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x3549c4(0x277),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x3549c4(0x1f4)},{'c':'pt','s':0x3,'lv':'💎','q':_0x3549c4(0x314),'a':_0x3549c4(0x2ae)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x3549c4(0xf6),'a':_0x3549c4(0x31b)},{'c':_0x3549c4(0xc4),'s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x3549c4(0x278)},{'c':_0x3549c4(0xc4),'s':0x0,'lv':'⭐','q':_0x3549c4(0xe5),'a':_0x3549c4(0x26f)},{'c':_0x3549c4(0xc4),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x3549c4(0x2f2)},{'c':_0x3549c4(0xc4),'s':0x1,'lv':'🔥','q':_0x3549c4(0x269),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x3549c4(0xc4),'s':0x1,'lv':'⭐','q':_0x3549c4(0x260),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x3549c4(0xc4),'s':0x2,'lv':'🔥','q':_0x3549c4(0x100),'a':_0x3549c4(0x17b)},{'c':_0x3549c4(0xc4),'s':0x2,'lv':'⭐','q':_0x3549c4(0x18f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x3549c4(0xc4),'s':0x3,'lv':'🔥','q':_0x3549c4(0x1c7),'a':_0x3549c4(0x254)},{'c':_0x3549c4(0xc4),'s':0x3,'lv':'💎','q':_0x3549c4(0x27a),'a':_0x3549c4(0xb2)},{'c':_0x3549c4(0xc4),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':_0x3549c4(0x2fe)},{'c':'app','s':0x4,'lv':'⭐','q':_0x3549c4(0x28c),'a':_0x3549c4(0x140)},{'c':_0x3549c4(0xc4),'s':0x4,'lv':'🔥','q':_0x3549c4(0x13d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':_0x3549c4(0x21b)},{'c':_0x3549c4(0xc4),'s':0x5,'lv':'🔥','q':_0x3549c4(0x25d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':_0x3549c4(0xc4),'s':0x5,'lv':'💎','q':_0x3549c4(0x2bd),'a':_0x3549c4(0x117)},{'c':'app','s':0x6,'lv':'⭐','q':_0x3549c4(0x316),'a':_0x3549c4(0x110)},{'c':'app','s':0x6,'lv':'⭐','q':_0x3549c4(0xe9),'a':_0x3549c4(0x191)},{'c':_0x3549c4(0xc4),'s':0x6,'lv':'🔥','q':_0x3549c4(0x28b),'a':_0x3549c4(0x128)},{'c':_0x3549c4(0xc4),'s':0x6,'lv':'💎','q':_0x3549c4(0x18d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':_0x3549c4(0xc4),'s':0x7,'lv':'⭐','q':_0x3549c4(0x2bc),'a':_0x3549c4(0x175)},{'c':_0x3549c4(0xc4),'s':0x7,'lv':'🔥','q':_0x3549c4(0x12e),'a':_0x3549c4(0x20a)},{'c':'app','s':0x7,'lv':'⭐','q':_0x3549c4(0x200),'a':_0x3549c4(0x1ad)},{'c':'app','s':0x7,'lv':'🔥','q':'执行反馈修正循环：怎么设计才不翻车？','a':_0x3549c4(0x1a2)},{'c':_0x3549c4(0xc4),'s':0x7,'lv':'🔥','q':_0x3549c4(0x19b),'a':_0x3549c4(0x285)},{'c':_0x3549c4(0x2bb),'s':0x0,'lv':'⭐','q':_0x3549c4(0x1cf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':_0x3549c4(0x2bb),'s':0x0,'lv':'⭐','q':_0x3549c4(0x22e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型：单线程内由<b>事件循环</b>调度多个协程，遇到\x20await\x20就让出控制权、IO\x20完成后被唤醒——一个线程可承载上万并发连接。三个概念：coroutine（协程对象，不await\x20不执行）、Task（被调度的执行单元）、事件循环。<b>最大的坑</b>：在async\x20函数里调用<b>阻塞</b>操作（time.sleep、同步\x20requests、重CPU\x20计算）会卡死整个事件循环——必须换asyncio.sleep\x20/\x20httpx\x20/\x20aiohttp，或用\x20run_in_executor\x20丢到线程池。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么并发跑多个请求？”——asyncio.gather或\x20create_task；“怎么控制并发数？”——Semaphore\x20限流，防打爆下游模型服务。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Agent\x20里并发调多个工具、批量调LLM\x20都靠这套——能讲出Semaphore\x20限流就显工程经验。“““'},{'c':_0x3549c4(0x2bb),'s':0x0,'lv':'🔥','q':'装饰器与常见\x20Python\x20进阶考点','a':_0x3549c4(0x183)},{'c':'eng','s':0x1,'lv':'⭐','q':_0x3549c4(0x249),'a':_0x3549c4(0x16e)},{'c':'eng','s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“幻读怎么解决？”——RR\x20下靠间隙锁（next-key\x20lock）；“分析型查询关心什么？”——你的场景主要是只读一致性快照，长事务会导致\x20undo\x20堆积，要注意。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>应用岗能讲清“四级别\x20+\x20MVCC\x20一句话\x20+\x20读写不互斥”就够，不必背锁的所有细节。“““'},{'c':'eng','s':0x1,'lv':'🔥','q':_0x3549c4(0x19d),'a':_0x3549c4(0xb6)},{'c':_0x3549c4(0x2bb),'s':0x2,'lv':'⭐','q':_0x3549c4(0x255),'a':_0x3549c4(0xf0)},{'c':'eng','s':0x2,'lv':'🔥','q':_0x3549c4(0x1b5),'a':_0x3549c4(0xbd)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x3549c4(0x13a),'a':_0x3549c4(0x21c)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x3549c4(0xe0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':'eng','s':0x3,'lv':'🔥','q':_0x3549c4(0x300),'a':_0x3549c4(0x2bf)},{'c':_0x3549c4(0x2bb),'s':0x4,'lv':'⭐','q':_0x3549c4(0x227),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':'eng','s':0x4,'lv':'🔥','q':_0x3549c4(0xfa),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三步：①\x20<b>算\x20token\x20量</b>——日活×\x20人均会话数\x20×\x20每会话平均输入/输出\x20token\x20②\x20<b>算算力</b>——推理吞吐按“单卡每秒可产出\x20tokens”估（受模型大小、batch、量化影响），除出需要多少卡；注意\x20<b>prefill\x20和\x20decode\x20分开算</b>（长输入吃\x20prefill\x20算力，长输出吃\x20decode\x20时间）③\x20<b>算显存</b>——权重（1B≈2GB）+\x20KV\x20Cache（每token\x20每层\x202×d×精度，乘以并发数和上下文长度）+\x20余量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“并发上不去为什么？”——多半是\x20KV\x20Cache\x20占满导致可并发序列数受限，用\x20GQA\x20模型\x20/\x20KV\x20量化\x20/\x20限制上下文长度解决；“怎么保P99\x20延迟？”——限制单请求最大生成长度\x20+\x20请求队列\x20+\x20优先级调度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能把这套算术和第二/三章的显存账本串起来讲，是应用岗里少见的<b>系统性思维</b>。“““'},{'c':'eng','s':0x4,'lv':'🔥','q':_0x3549c4(0x1fe),'a':_0x3549c4(0x2c8)},{'c':_0x3549c4(0x2bb),'s':0x4,'lv':'💎','q':_0x3549c4(0x23a),'a':_0x3549c4(0x258)},{'c':_0x3549c4(0x2bb),'s':0x4,'lv':'💎','q':_0x3549c4(0x150),'a':_0x3549c4(0x1dc)},{'c':_0x3549c4(0x2c7),'s':0x0,'lv':'⭐','q':_0x3549c4(0x295),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':_0x3549c4(0x2c7),'s':0x0,'lv':'⭐','q':_0x3549c4(0x1a1),'a':_0x3549c4(0x266)},{'c':_0x3549c4(0x2c7),'s':0x1,'lv':'⭐','q':_0x3549c4(0x24f),'a':_0x3549c4(0x12b)},{'c':_0x3549c4(0x2c7),'s':0x1,'lv':'⭐','q':_0x3549c4(0x170),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好答案的三个特征：①难点是<b>技术判断</b>而非体力活②\x20有<b>具体的失败经历</b>（试过什么不行）③\x20有<b>可迁移的认知沉淀</b>。<br>模板：“最难的不是让它跑通，而是<b>让它稳定</b>。跑通只要prompt\x20调对就行，但真实用户的问法千奇百怪。我最开始\x20SQL\x20生成正确率只有\x20X左右，问题集中在字段映射错和口径理解错。我做了三件事：schema\x20裁剪、口径库\x20RAG\x20注入、执行反馈修正循环。<b>这件事让我明白\x20LLM\x20应用的核心工作量不在调用模型，而在给它建好约束与验证机制。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>最后那句<b>认知沉淀</b>是加分核心——它说明你能从具体项目里抽象出方法论。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>如果初期的具体数字你不记得，别编——说“早期版本明显不稳定，主要错在字段映射”比编一个假数字安全得多。“'},{'c':'story','s':0x2,'lv':'⭐','q':_0x3549c4(0x188),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':_0x3549c4(0x2c7),'s':0x2,'lv':'🔥','q':_0x3549c4(0x264),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检，答不出就去补</span><br>①\x2098%/96%\x20的测试集多大、谁判、怎么判？<br>②\x20307\x20个字段怎么进prompt\x20的？（schema\x20裁剪策略）<br>③\x20字段别名库怎么建的、多少条？<br>④\x20多轮对话的指代怎么消解的？<br>⑤\x20执行反馈修正最多重试几轮、会不会越改越错？<br>⑥\x20复杂多表\x20join\x20的成功率和单表比差多少？<br>⑦\x20为什么选\x20Qwen、哪个尺寸、为什么这个尺寸？<br>⑧\x20海光\x20DCU\x20上踩了什么坑？<br>⑨\x20安全怎么做的？（只读、权限、注入防护）<br>⑩\x20如果重做，你会改哪三件事？<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>这十个问题就是你的复习清单</b>。每个都写下3-5\x20句的答案并练到能顺畅说出——项目面80%\x20的问题都在这里面。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>第\x20⑩\x20题最能拉分也最容易翻车：<b>准备三个具体的改进点</b>（自动化评测、混合检索、RL\x20优化），别答“没什么好改的”。“'},{'c':_0x3549c4(0x2c7),'s':0x3,'lv':'⭐','q':_0x3549c4(0x27b),'a':_0x3549c4(0x244)},{'c':_0x3549c4(0x2c7),'s':0x3,'lv':'🔥','q':_0x3549c4(0x22c),'a':_0x3549c4(0x2b4)},{'c':_0x3549c4(0x2c7),'s':0x4,'lv':'⭐','q':_0x3549c4(0x30f),'a':_0x3549c4(0xcf)},{'c':'story','s':0x4,'lv':'⭐','q':_0x3549c4(0x1b6),'a':_0x3549c4(0x1a4)},{'c':'story','s':0x5,'lv':'⭐','q':_0x3549c4(0xb7),'a':_0x3549c4(0x106)},{'c':'story','s':0x5,'lv':'🔥','q':_0x3549c4(0x182),'a':_0x3549c4(0x22b)},{'c':_0x3549c4(0x2c7),'s':0x5,'lv':'🔥','q':'面试后\x2024\x20小时：复盘怎么做才有复利','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>每场面试结束后<b>立刻</b>（记忆最清楚时）记四件事：①<b>被问到的所有问题</b>（尽量原话）②\x20<b>答得不好的题</b>及当时的卡点③\x20面试官追问的<b>方向和深度</b>（反映团队真实关注点）④\x20我的改进动作。<br>然后：把答不好的题<b>当天补进手册的对应章节</b>，标为“还不熟”，进入闪卡循环。<br><span\x20class=\x27lb\x27>➤\x20为什么这件事回报最高</b><br>秋招是<b>多轮迭代</b>的过程：同一个问题会在不同公司反复出现。<b>第一次答崩不丢人，第二次还崩才是浪费。</b>面经复盘是把单次失败转化为全局提升的唯一机制。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>用附录\x20C\x20的面经复盘模板，每场一份，存在同一个文件夹里。三场之后你会看到明显的规律。“'},{'c':_0x3549c4(0xfd),'s':0x0,'lv':'⭐','q':_0x3549c4(0x307),'a':_0x3549c4(0x18b)},{'c':_0x3549c4(0xfd),'s':0x0,'lv':'⭐','q':_0x3549c4(0x1b2),'a':'<span\x20class=\x27lb\x27>◈\x20五件必做</span><br>①\x20<b>简历改版（最高优先级）</b>：加腾讯实习那一栏（哪怕先写在做的方向和技术栈）；删掉“AI\x20Infra\x20/\x20Post-training”意向、只留“大模型应用研发\x20/\x20LLM\x20Agent”；技能栏删掉“了解\x20vLLM、KV\x20Cache”这类扛不住追问的表述；学生工作压到2\x20行以内。<br>②\x20<b>找\x20mentor\x20谈一次</b>：问清转正HC\x20情况\x20+\x20争取一个能量化的产出（哪怕是内部\x20demo\x20或实验结论）。<br>③\x20<b>目标公司清单</b>：分三档（冲刺\x20/\x20主力\x20/\x20保底）各\x205-8\x20家，查清投递批次和截止时间。<br>④\x20<b>手册第六章刷完一轮</b>（主战场优先）。<br>⑤\x20<b>刷题热身</b>：Hot100\x20里的哈希/双指针/滑窗，每天\x203\x20题。<br><span\x20class=\x27lb\x27>➤\x20本周验收标准</span><br>周日晚上能做到：<b>简历发出去不心虚+\x206.8\x20节NL2SQL\x20五题能不看稿讲完</b>。“'},{'c':_0x3549c4(0xfd),'s':0x0,'lv':'🔥','q':'每天的时间分配模板（实习期版）','a':'<span\x20class=\x27lb\x27>◈\x20现实约束：白天在腾讯实习，可支配时间在早晚和周末</span><br><b>工作日（约\x202-2.5\x20小时）</b>：<br>·\x20早上\x2030\x20分钟：闪卡模式刷手册（通勤最佳，只刷“未掌握”）<br>·晚上\x2060\x20分钟：刷题（2-3\x20道，按题型集中）<br>·\x20晚上\x2030-60\x20分钟：手册精读一节+\x20把答不出的标记<br><b>周末（每天\x204-6\x20小时）</b>：<br>·\x20上午：模拟面试\x20/\x20讲述稿开口练（<b>必须出声</b>，默读没用）<br>·\x20下午：手册整章精读\x20+\x20投递与信息搜集<br>·\x20晚上：本周复盘，更新“不熟”清单<br><span\x20class=\x27lb\x27>⚠\x20关键纪律</span><br><b>面试期间优先级重排</b>：有面试的那一周，复盘\x20&gt;\x20补漏\x20&gt;\x20新知识。别在面试高峰期还想着系统学新东西。“'},{'c':'plan','s':0x1,'lv':'🔥','q':_0x3549c4(0xd1),'a':_0x3549c4(0x304)},{'c':_0x3549c4(0xfd),'s':0x1,'lv':'🔥','q':_0x3549c4(0x16a),'a':_0x3549c4(0x223)},{'c':_0x3549c4(0xfd),'s':0x2,'lv':'⭐','q':_0x3549c4(0x18e
