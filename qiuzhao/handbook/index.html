<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}
  .entry .q .idx{min-width:26px;font-size:.78rem}
  .entry .q .qt{font-size:.86rem}
  .entry .a{padding:10px 12px 12px;font-size:.84rem}
  .card-face{padding:18px 16px}

2ce23(0x156),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>快排</b>：平均\x20n\x20log\x20n、原地、不稳定——通用首选。<b>归并</b>：稳定\x20n\x20log\x20n、需\x20O(n)\x20空间——<b>链表排序首选</b>（链表归并不需额外空间），也是求逆序对的载体。<b>堆排</b>：n\x20log\x20n、原地、不稳定——适合\x20TopK\x20和优先队列。<b>计数/桶排</b>：值域小时可到\x20O(n)。稳定性含义：相等元素的相对顺序不变——多字段排序（先按\x20A\x20再按\x20B）时必须用稳定排序。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Python\x20的\x20sorted\x20是什么？”——Timsort，归并+插入的混合，<b>稳定</b>；“什么时候必须稳定？”——多轮排序保留前一轮结果时。““'},{'c':_0x52ce23(0x2ff),'s':0x2,'lv':'⭐','q':_0x52ce23(0x298),'a':_0x52ce23(0x1c8)},{'c':_0x52ce23(0x2ff),'s':0x2,'lv':'⭐','q':'LRU\x20Cache：O(1)\x20get\x20和\x20put','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':_0x52ce23(0x2ff),'s':0x2,'lv':'🔥','q':_0x52ce23(0x1af),'a':_0x52ce23(0x1ed)},{'c':_0x52ce23(0x2ff),'s':0x2,'lv':'🔥','q':'双指针：链表判环、找中点、找环入口','a':_0x52ce23(0x1f9)},{'c':_0x52ce23(0x2ff),'s':0x3,'lv':'⭐','q':'滑动窗口：适用题型与固定模板','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':_0x52ce23(0x2ff),'s':0x3,'lv':'🔥','q':_0x52ce23(0x2c9),'a':_0x52ce23(0x199)},{'c':_0x52ce23(0x2ff),'s':0x3,'lv':'🔥','q':_0x52ce23(0x22a),'a':_0x52ce23(0x1c0)},{'c':_0x52ce23(0x2ff),'s':0x3,'lv':'🔥','q':'区间问题：合并、插入、调度','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':_0x52ce23(0x2ff),'s':0x4,'lv':'⭐','q':_0x52ce23(0xd0),'a':_0x52ce23(0x174)},{'c':'code','s':0x4,'lv':'🔥','q':_0x52ce23(0x274),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>网格搜索（岛屿数量\x20200）</b>：遍历网格，遇到\x20\x271\x27\x20就\x20DFS/BFS\x20把整块染成\x270\x27，计数\x20+1；注意\x20<b>visited\x20标记时机</b>（入队时标记而非出队时，否则重复入队）。<b>拓扑排序（207\x20课程表）</b>：统计入度→入度\x200\x20入队\x20→弹出并减邻接入度；<b>若弹出总数\x20&lt;\x20节点数则有环</b>。<b>回溯</b>：选择\x20→\x20递归\x20→\x20<b>撤销选择</b>，模板固定（全排列\x2046、子集\x2078、组合总和\x2039、N\x20皇后\x2051）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“BFS\x20和\x20DFS\x20怎么选？”——求<b>最短路径/最少步数</b>用\x20BFS（层数即步数），求<b>所有方案/连通性</b>用\x20DFS；“回溯怎么去重？”——先排序，同层跳过重复元素。““'},{'c':_0x52ce23(0x2ff),'s':0x5,'lv':'🔥','q':_0x52ce23(0x277),'a':_0x52ce23(0x149)},{'c':_0x52ce23(0x2ff),'s':0x5,'lv':'💎','q':_0x52ce23(0x13e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x52ce23(0x19d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x52ce23(0xc9),'a':_0x52ce23(0x1d1)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x52ce23(0x2b4),'a':_0x52ce23(0x2b0)},{'c':'ml','s':0x0,'lv':'🔥','q':'为什么要\x20warmup\x20+\x20cosine\x20decay？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Warmup</b>：训练初期参数远离最优、梯度噪声大（Adam\x20的二阶统计量还没攒够、估计不准），直接用大\x20lr\x20会震荡或发散；先用几百到几千步<b>线性升到峰值</b>。<b>Cosine\x20decay</b>：后期平滑降到接近零，让模型沉淀进更平坦的极小值，泛化更好。大模型\x20SFT\x20典型配置：warmup\x20ratio\x203%、cosine\x20衰减到峰值的\x2010%。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“不warmup\x20会怎样？”——常见现象是前几十步\x20loss\x20飙升甚至\x20NaN；“为什么不降到\x200？”——留一点残余\x20lr\x20避免完全停止学习，也便于后续继续训练。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':'混合精度训练：fp16\x20vs\x20bf16','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省显存加速，<b>权重主副本和优化器状态保\x20fp32</b>\x20保精度。<b>fp16</b>：尾数多、动态范围小\x20→\x20易上溢/下溢，必须配\x20<b>loss\x20scaling</b>（放大\x20loss\x20让小梯度不被舍入吃掉）。<b>bf16</b>：指数位与\x20fp32\x20相同（动态范围一样大）、尾数少\x20→\x20<b>基本不溢出、免\x20loss\x20scaling</b>，是当前大模型训练主流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“精度低了效果会掉吗？”——训练几乎无损（因为主副本是\x20fp32）；“fp8\x20呢？”——H100\x20起支持，训练已有实践，但需要更精细的缩放策略。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x52ce23(0x2a5),'a':_0x52ce23(0x15f)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x52ce23(0x1ce),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>BN</b>\x20沿\x20batch\x20维归一化\x20→\x20依赖\x20batch\x20统计量，推理要用滑动平均，batch\x20小或序列变长时不稳定，NLP\x20变长序列场景直接失效。<b>LN</b>\x20沿特征维对每个样本独立归一化\x20→与\x20batch\x20无关，<b>训练和推理行为完全一致</b>。进阶：<b>Pre-LN</b>（LN\x20放在残差分支之前）训练稳定性好、现代\x20LLM\x20标配；<b>RMSNorm</b>\x20去掉减均值只做缩放，计算更省、效果相当，Llama/Qwen\x20在用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Pre-LN和\x20Post-LN\x20差别？”——Post-LN\x20极限性能略好但需要小心\x20warmup\x20否则难收敛；Pre-LN\x20梯度更稳、深层可训，工业上选稳定；“归一化到底在解决什么？”——稳定每层输入分布、平滑损失曲面，让更大\x20lr\x20可用。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':_0x52ce23(0x2e4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ReLU</b>：max(0,x)，快但负区梯度为零（神经元死亡）。<b>GELU</b>：x·Φ(x)，平滑版\x20ReLU，BERT/GPT\x20系用。<b>SiLU/Swish</b>：x·sigmoid(x)，平滑且有轻微负值。<b>SwiGLU</b>（现代\x20LLM\x20FFN\x20标配）：FFN(x)\x20=\x20(xW₁\x20⊙\x20SiLU(xW₃))W₂——<b>门控机制引入乘性交互</b>，表达能力更强；代价是多一个投影矩阵，所以通常把中间维度调小以保持参数量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么门控有效？”——乘性交互让网络能表达“条件性通过”，比纯加性变换表达力更强，实验上稳定优于\x20ReLU/GELU；“为什么\x20FFN\x20中间维度是\x208/3\x20倍而不是\x204\x20倍？”——正是为了在加了第三个矩阵后保持总参数量不变。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x52ce23(0x258)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x52ce23(0x2dc),'a':_0x52ce23(0x2a4)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x52ce23(0x1da),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>信号：训练\x20loss\x20持续降但<b>验证\x20loss\x20转升</b>；训练集指标远好于测试集；模型开始复述训练样本。对策按大模型语境的性价比排序：①\x20<b>更多/更干净的数据</b>（永远最有效）②\x20<b>早停</b>——监控验证集，SFT\x20里\x20epoch\x20设\x202~3\x20就是经验性防过拟合\x20③\x20<b>用\x20LoRA\x20限制可训练参数量</b>（小数据尤其有效）④\x20weight\x20decay\x20/\x20dropout\x20⑤\x20数据混合与多任务。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“小数据微调怎么防？”——LoRA\x20+\x20小\x20r\x20+\x20少\x20epoch\x20+\x20早停\x20+\x20掺通用数据，四件套；<b>你的\x20611\x20条数据场景正好适用这套组合，被问“数据这么少怎么保证不过拟合”时按这个答。</b>““““'},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x52ce23(0x27f)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x52ce23(0x2ef),'a':_0x52ce23(0x2ca)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x52ce23(0x24a),'a':_0x52ce23(0x2ae)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x52ce23(0x312)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x52ce23(0x1d5),'a':_0x52ce23(0x212)},{'c':'ml','s':0x3,'lv':'⭐','q':'训练显存都花在哪了？（能算这笔账就赢一半）','a':_0x52ce23(0x2be)},{'c':'ml','s':0x3,'lv':'💎','q':_0x52ce23(0x245),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>目的：用更低位宽表示权重（和/或激活）以省显存、提吞吐。<b>训练后量化\x20PTQ</b>（主流）：<b>GPTQ</b>逐层最小化量化误差、需要校准集；<b>AWQ</b>\x20识别并保护“重要通道”（激活幅值大的权重），精度损失更小、推理更快。<b>NF4</b>（QLoRA\x20用）针对正态分布权重设计。<b>W8A8</b>\x20指权重和激活都量化到\x208bit，吞吐收益更大但精度风险更高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“INT4\x20掉点吗？”——小模型掉得明显，大模型相对耐受；关键看任务，结构化/推理任务更敏感；“什么时候别量化？”——精度要求极高、或显存本来就够时。““““'},{'c':'llm','s':0x0,'lv':'⭐','q':_0x52ce23(0x2ec),'a':_0x52ce23(0x1e9)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x52ce23(0xe8),'a':_0x52ce23(0x128)},{'c':_0x52ce23(0x18d),'s':0x0,'lv':'🔥','q':_0x52ce23(0xc4),'a':_0x52ce23(0xf7)},{'c':_0x52ce23(0x18d),'s':0x0,'lv':'🔥','q':_0x52ce23(0x1cf),'a':_0x52ce23(0x20b)},{'c':_0x52ce23(0x18d),'s':0x1,'lv':'⭐','q':_0x52ce23(0xf1),'a':_0x52ce23(0x1d8)},{'c':_0x52ce23(0x18d),'s':0x1,'lv':'🔥','q':_0x52ce23(0x137),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x52ce23(0x18d),'s':0x1,'lv':'🔥','q':_0x52ce23(0xd2),'a':_0x52ce23(0x2ee)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x52ce23(0xfa),'a':_0x52ce23(0x113)},{'c':_0x52ce23(0x18d),'s':0x2,'lv':'⭐','q':'参数量与显存估算（必考口算）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>口诀：<b>fp16/bf16\x20下\x201B\x20参数\x20≈\x202GB</b>。推理仅权重：7B≈14GB，INT8\x20减半，INT4\x20再减半（再加\x20KV\x20Cache\x20和激活的余量）。全量微调（Adam）：fp32\x20主权重4\x20+\x20梯度4\x20+\x20两个动量8≈\x20<b>每参数\x2016~20\x20字节</b>\x20→\x207B\x20需\x20100GB+，单卡不可能。所以\x20QLoRA：基座量化到\x204bit\x20冻结、只训\x20LoRA（&lt;1%\x20参数），单卡\x2024GB\x20微调\x207B\x20成立。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理还要留多少余量？”——KV\x20Cache\x20+\x20激活\x20+\x20框架开销，一般按权重的\x201.2~1.5\x20倍规划；“为什么权重要留\x20fp32\x20主副本？”——fp16\x20更新量太小会被舍入吃掉，主副本保精度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把这笔账和你论文里选\x20QLoRA\x20的理由挂钩：“611\x20条领域数据\x20+\x20有限算力，全量微调不现实且易过拟合，QLoRA\x20是性价比最优解”——有算术支撑的技术选型，比说“我用了\x20QLoRA”强十倍。““““““'},{'c':_0x52ce23(0x18d),'s':0x2,'lv':'💎','q':'推理加速手段速览（应用岗水位）','a':_0x52ce23(0x1c2)},{'c':_0x52ce23(0x18d),'s':0x3,'lv':'⭐','q':_0x52ce23(0x1ff),'a':_0x52ce23(0x185)},{'c':_0x52ce23(0x18d),'s':0x3,'lv':'🔥','q':_0x52ce23(0x2f3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(x_i)=e^{x_i}/Σe^{x_j}，x\x20大时\x20e^x\x20上溢。稳定版：<b>先减\x20max</b>——e^{x_i-max}/Σe^{x_j-max}，数学等价、数值安全。logsumexp\x20=\x20max\x20+\x20log\x20Σe^{x_j-max}，用于算log\x20概率（交叉熵、logprobs）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么面试爱考？”——手撕\x20attention\x20的第一个考点；且推理框架里所有采样、beam\x20search、困惑度计算都建在\x20logprobs\x20上，数值稳定是工程底线。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>手写\x20attention\x20时直接\x20exp\x20不减\x20max，是最常见的“会写但不专业”破绽。““““““'},{'c':_0x52ce23(0x18d),'s':0x4,'lv':'🔥','q':_0x52ce23(0x26c),'a':_0x52ce23(0x1e4)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x52ce23(0x282),'a':_0x52ce23(0x148)},{'c':_0x52ce23(0x18d),'s':0x5,'lv':'🔥','q':_0x52ce23(0xe0),'a':_0x52ce23(0x316)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x52ce23(0x2d3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':_0x52ce23(0x18d),'s':0x5,'lv':'🔥','q':'Qwen\x20/\x20Llama\x20/\x20DeepSeek：架构差异一句话说清','a':_0x52ce23(0x234)},{'c':_0x52ce23(0x18d),'s':0x5,'lv':'💎','q':_0x52ce23(0x187),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':_0x52ce23(0x18d),'s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':_0x52ce23(0x1ad)},{'c':_0x52ce23(0x18d),'s':0x6,'lv':'⭐','q':_0x52ce23(0x1d2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':_0x52ce23(0x18d),'s':0x6,'lv':'🔥','q':_0x52ce23(0x2b9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':'llm','s':0x7,'lv':'⭐','q':_0x52ce23(0x135),'a':_0x52ce23(0x201)},{'c':_0x52ce23(0x18d),'s':0x7,'lv':'🔥','q':_0x52ce23(0x1eb),'a':_0x52ce23(0x267)},{'c':_0x52ce23(0x18d),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x52ce23(0x1a2)},{'c':_0x52ce23(0x18d),'s':0x7,'lv':'💎','q':_0x52ce23(0x106),'a':_0x52ce23(0x304)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x52ce23(0x1db),'a':_0x52ce23(0xdc)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x52ce23(0x244),'a':_0x52ce23(0x171)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x52ce23(0x24e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Q-learning：用贝尔曼最优方程做<b>时序差分</b>更新，Q(s,a)\x20←\x20Q(s,a)\x20+\x20α[r\x20+\x20γ\x20max_a\x27\x20Q(s\x27,a\x27)\x20−\x20Q(s,a)]，学到\x20Q\x20后贪心取\x20argmax\x20就是最优策略。它是\x20<b>off-policy</b>的（更新用\x20max，与实际采样策略无关），所以能用经验回放。<b>DQN</b>\x20三个关键工程技巧：①\x20神经网络近似\x20Q\x20②\x20<b>经验回放池</b>打破样本相关性\x20③\x20<b>目标网络</b>（延迟更新的\x20Q\x20副本）稳定\x20TD\x20目标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么需要目标网络？”——不然是“用自己预测自己”，目标随参数一起动会震荡甚至发散；“局限？”——只适合<b>离散动作</b>，连续/高维动作空间要用策略方法。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>游戏AI\x20的经典入口（Atari、棋牌类离散动作）——腾讯游戏算法场景可以从这里切入讲。““““““'},{'c':'rl','s':0x1,'lv':'💎','q':_0x52ce23(0x2a9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x52ce23(0x246),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':'PPO：为什么它是工业标准？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x52ce23(0x178),'a':_0x52ce23(0x154)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x52ce23(0x1dc),'a':_0x52ce23(0x230)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x52ce23(0x248),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':'GRPO：DeepSeek\x20为什么能扔掉\x20Critic','a':_0x52ce23(0x1d6)},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x52ce23(0x2fb)},{'c':'rl','s':0x3,'lv':'💎','q':_0x52ce23(0xe7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':'奖励塑形与奖励黑客（游戏\x20RL\x20的核心难题）','a':_0x52ce23(0x122)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x52ce23(0x239),'a':_0x52ce23(0x105)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x52ce23(0x299),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x52ce23(0x1e3),'a':_0x52ce23(0x15a)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x52ce23(0x2d2),'a':_0x52ce23(0xe9)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x52ce23(0x272),'a':_0x52ce23(0x306)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x52ce23(0x215),'a':_0x52ce23(0x271)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x52ce23(0x308),'a':_0x52ce23(0x163)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x52ce23(0x2ad),'a':_0x52ce23(0x204)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x52ce23(0x2df),'a':_0x52ce23(0x288)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x52ce23(0x221),'a':_0x52ce23(0x182)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x52ce23(0x2b7),'a':_0x52ce23(0x29a)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':_0x52ce23(0x108)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x52ce23(0x145),'a':_0x52ce23(0x151)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x52ce23(0x150),'a':_0x52ce23(0x13c)},{'c':'pt','s':0x2,'lv':'💎','q':_0x52ce23(0x23a),'a':_0x52ce23(0x2cc)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':_0x52ce23(0x129)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x52ce23(0x1bf),'a':_0x52ce23(0x1a8)},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x52ce23(0x123)},{'c':'pt','s':0x3,'lv':'🔥','q':'消融实验怎么设计才有说服力？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x52ce23(0x300),'a':_0x52ce23(0x29f)},{'c':'pt','s':0x3,'lv':'💎','q':_0x52ce23(0x2f0),'a':_0x52ce23(0xec)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x52ce23(0x175),'a':_0x52ce23(0x170)},{'c':_0x52ce23(0xbb),'s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x52ce23(0x2e3)},{'c':_0x52ce23(0xbb),'s':0x0,'lv':'⭐','q':_0x52ce23(0x1f8),'a':_0x52ce23(0x2af)},{'c':_0x52ce23(0xbb),'s':0x1,'lv':'⭐','q':_0x52ce23(0x1b8),'a':_0x52ce23(0xfe)},{'c':'app','s':0x1,'lv':'🔥','q':_0x52ce23(0x1fb),'a':_0x52ce23(0x25a)},{'c':_0x52ce23(0xbb),'s':0x1,'lv':'⭐','q':'Rerank\x20为什么有效？和粗排怎么分工？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x52ce23(0xbb),'s':0x2,'lv':'🔥','q':_0x52ce23(0x253),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x52ce23(0xbb),'s':0x2,'lv':'⭐','q':_0x52ce23(0x250),'a':_0x52ce23(0x281)},{'c':_0x52ce23(0xbb),'s':0x3,'lv':'🔥','q':_0x52ce23(0x1b6),'a':_0x52ce23(0xda)},{'c':_0x52ce23(0xbb),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x52ce23(0xbb),'s':0x4,'lv':'⭐','q':_0x52ce23(0x2f6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':_0x52ce23(0xbb),'s':0x4,'lv':'⭐','q':_0x52ce23(0x16d),'a':_0x52ce23(0x177)},{'c':_0x52ce23(0xbb),'s':0x4,'lv':'🔥','q':_0x52ce23(0x2eb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':_0x52ce23(0x1f5)},{'c':_0x52ce23(0xbb),'s':0x5,'lv':'🔥','q':_0x52ce23(0xe4),'a':_0x52ce23(0x141)},{'c':_0x52ce23(0xbb),'s':0x5,'lv':'💎','q':_0x52ce23(0x2ac),'a':_0x52ce23(0x1f4)},{'c':_0x52ce23(0xbb),'s':0x6,'lv':'⭐','q':_0x52ce23(0xcc),'a':_0x52ce23(0x2aa)},{'c':_0x52ce23(0xbb),'s':0x6,'lv':'⭐','q':_0x52ce23(0x287),'a':_0x52ce23(0x1e0)},{'c':'app','s':0x6,'lv':'🔥','q':_0x52ce23(0x2c3),'a':_0x52ce23(0x1bd)},{'c':'app','s':0x6,'lv':'💎','q':_0x52ce23(0x216),'a':_0x52ce23(0x1aa)},{'c':'app','s':0x7,'lv':'⭐','q':'NL2SQL\x20的五大难点与解法（主场第一题）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Schema\x20Linking</b>：口语字段映射到真实表/列\x20→\x20schema\x20裁剪\x20+\x20字段别名库\x20+\x20RAG\x20检索注入\x20②\x20<b>业务口径</b>：“上月销量”的定义\x20→\x20口径说明库\x20+\x20few-shot\x20示例\x20③\x20<b>复杂逻辑</b>：多表\x20join/嵌套聚合\x20→\x20任务分解、分步生成\x20④\x20<b>可靠性</b>：语法校验\x20+\x20执行反馈修正循环\x20+\x20查询要素完备性检查\x20⑤\x20<b>安全</b>：只读限制、行列权限、注入防护、LIMIT\x20强制。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>每个难点都会再挖一层（见本节后续条目）——这一条的答法决定面试官往哪挖。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>数据随时能报：10\x20张表\x20/\x20307\x20字段\x20/\x20约\x2090\x20万行真实工业数据，SQL\x20可执行率\x2098%、人工校验正确率\x2096%——<b>并且能讲清两个口径的区别</b>。““““““'},{'c':_0x52ce23(0xbb),'s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':_0x52ce23(0x2a8)},{'c':_0x52ce23(0xbb),'s':0x7,'lv':'⭐','q':_0x52ce23(0x30a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':_0x52ce23(0xbb),'s':0x7,'lv':'🔥','q':_0x52ce23(0x232),'a':_0x52ce23(0x2da)},{'c':_0x52ce23(0xbb),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多轮</b>：指代消解（“那上月呢”→\x20补全成完整查询意图）+\x20会话状态显式维护（已选表、时间范围）+\x20历史摘要管理。<b>权限</b>：生成前按用户权限过滤可见\x20schema（行列级）＋\x20只读账号\x20＋\x20LIMIT\x20强制\x20＋\x20危险关键字拦截（DROP/DELETE/UPDATE）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“schema\x20过滤和生成后拦截哪个好？”——都要：生成前过滤减少出错面，生成后拦截兜底，这叫<b>纵深防御</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>和「Prompt\x20Injection」那条连成完整的安全故事：输入防护\x20+\x20权限最小化\x20+\x20输出拦截，三层都真实做过。““““““'},{'c':_0x52ce23(0x11e),'s':0x0,'lv':'⭐','q':_0x52ce23(0x25b),'a':_0x52ce23(0x1a1)},{'c':_0x52ce23(0x11e),'s':0x0,'lv':'⭐','q':_0x52ce23(0x17a),'a':_0x52ce23(0x28b)},{'c':'eng','s':0x0,'lv':'🔥','q':_0x52ce23(0x251),'a':_0x52ce23(0x1d9)},{'c':'eng','s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x52ce23(0x273)},{'c':_0x52ce23(0x11e),'s':0x1,'lv':'🔥','q':_0x52ce23(0x313),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“幻读怎么解决？”——RR\x20下靠间隙锁（next-key\x20lock）；“分析型查询关心什么？”——你的场景主要是只读一致性快照，长事务会导致\x20undo\x20堆积，要注意。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>应用岗能讲清“四级别\x20+\x20MVCC\x20一句话\x20+\x20读写不互斥”就够，不必背锁的所有细节。“““'},{'c':'eng','s':0x1,'lv':'🔥','q':'JOIN\x20与聚合查询的性能要点','a':_0x52ce23(0x198)},{'c':_0x52ce23(0x11e),'s':0x2,'lv':'⭐','q':_0x52ce23(0x1a9),'a':_0x52ce23(0x16f)},{'c':'eng','s':0x2,'lv':'🔥','q':_0x52ce23(0x240),'a':_0x52ce23(0x2e9)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x52ce23(0x1ee),'a':_0x52ce23(0x2c2)},{'c':'eng','s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':_0x52ce23(0x11e),'s':0x3,'lv':'🔥','q':_0x52ce23(0x1c4),'a':_0x52ce23(0x19e)},{'c':_0x52ce23(0x11e),'s':0x4,'lv':'⭐','q':'系统设计题：设计一个企业级\x20RAG\x20问答服务','a':_0x52ce23(0x1e2)},{'c':_0x52ce23(0x11e),'s':0x4,'lv':'🔥','q':_0x52ce23(0xe6),'a':_0x52ce23(0x2bc)},{'c':_0x52ce23(0x11e),'s':0x4,'lv':'🔥','q':'服务性能：QPS、延迟指标与瓶颈定位','a':_0x52ce23(0x12a)},{'c':_0x52ce23(0x11e),'s':0x4,'lv':'💎','q':'系统设计题：多轮对话服务的状态怎么管','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心原则：<b>应用层无状态，会话状态外置</b>（Redis\x20存活跃会话\x20+\x20数据库落历史），这样服务可水平扩展、重启不丢会话。状态内容分层：结构化状态（当前任务、已确认参数）+\x20消息历史（可摘要压缩）+\x20用户画像（长期记忆，向量化）。要设计：会话\x20TTL、历史长度上限与压缩策略、并发同一会话的加锁、以及<b>敏感数据的存储与清理策略</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“历史太长怎么办？”——滑窗\x20+\x20摘要\x20+\x20结构化状态三层策略（见第六章\x206.6）；“怎么支持“重新生成”？”——保存每轮的请求快照（含检索结果和\x20prompt），才能可复现地重跑。“““'},{'c':_0x52ce23(0x11e),'s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':_0x52ce23(0x2c0)},{'c':'story','s':0x0,'lv':'⭐','q':_0x52ce23(0x12d),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':_0x52ce23(0xe2),'s':0x0,'lv':'⭐','q':'3\x20分钟自我介绍（现场面主版本）','a':_0x52ce23(0x180)},{'c':_0x52ce23(0xe2),'s':0x1,'lv':'⭐','q':'项目深挖的标准应答框架（STAR-T）','a':_0x52ce23(0x27c)},{'c':_0x52ce23(0xe2),'s':0x1,'lv':'⭐','q':_0x52ce23(0x30f),'a':_0x52ce23(0x235)},{'c':'story','s':0x2,'lv':'⭐','q':'NL2SQL\x20项目标准讲述稿（3\x20分钟版）','a':_0x52ce23(0x26f)},{'c':_0x52ce23(0xe2),'s':0x2,'lv':'🔥','q':'NL2SQL\x20项目的十个必问追问（自检清单）','a':_0x52ce23(0x18e)},{'c':'story','s':0x3,'lv':'⭐','q':_0x52ce23(0x14f),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>问题</b>：空分装置异常处置场景，大模型给的建议存在三个问题——<b>回答结构不稳定、缺少验证闭环、会生成不受支持的内容</b>。这三个问题在工业安全场景是不可接受的。<br><b>方法</b>：提出\x20OKC-SFT——把现场操作员的处置逻辑建模为六阶段知识链（<b>Diagnosis\x20→\x20Evidence\x20→\x20Causes\x20→\x20Actions\x20→\x20Verification\x20→\x20Risk\x20Boundary</b>），用结构化监督微调引导模型按这个链路输出。<br><b>数据</b>：基于操作规程、现场案例、工艺机理和专家经验构建\x20611\x20条监督样本，覆盖\x206\x20类任务；<b>不是凑数量，是按任务类型做覆盖设计</b>。<br><b>训练</b>：Qwen2.5-7B-Instruct\x20为基座，QLoRA\x20微调——611\x20条数据\x20+\x20有限算力下，全量微调既超显存又必过拟合。<br><b>实验</b>：三组对照（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）+\x20消融，证明提升来自<b>结构化监督</b>而非微调本身。<br><b>结果</b>：结构完整率\x2099.8%、关键点覆盖率\x200.5407→0.7378、Verification\x20与\x20Risk\x20Boundary\x20出现率\x20100%、幻觉率\x2034.4%→15.6%。<br><span\x20class=\x27lb\x27>⚓\x20金句（收尾用）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>“'},{'c':_0x52ce23(0xe2),'s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':_0x52ce23(0x14e)},{'c':'story','s':0x4,'lv':'⭐','q':'腾讯实习讲述稿（框架\x20+\x20待填清单）','a':_0x52ce23(0x159)},{'c':_0x52ce23(0xe2),'s':0x4,'lv':'⭐','q':_0x52ce23(0x162),'a':_0x52ce23(0x20a)},{'c':_0x52ce23(0xe2),'s':0x5,'lv':'⭐','q':'行为面五问：诚实但有准备的答法','a':_0x52ce23(0x27e)},{'c':'story','s':0x5,'lv':'🔥','q':_0x52ce23(0x255),'a':_0x52ce23(0x2c6)},{'c':'story','s':0x5,'lv':'🔥','q':_0x52ce23(0x147),'a':_0x52ce23(0x133)},{'c':'plan','s':0x0,'lv':'⭐','q':_0x52ce23(0x217),'a':'<span\x20class
