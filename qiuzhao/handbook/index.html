<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

ile\x20left\x20&lt;\x20right:<br>mid\x20=\x20(left\x20+\x20right)\x20//\x202<br>\u3000if\x20check(mid):\x20right\x20=\x20mid<br>\u3000else:\x20left\x20=\x20mid\x20+\x201<br>return\x20left<br>其中\x20check(mid)\x20表示“mid\x20满足条件”，返回的是<b>第一个满足条件的位置</b>。核心纪律：<b>区间语义全程一致</b>，mid\x20取左中位数时\x20right=mid\x20不会死循环。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“找最后一个满足的？”——把问题转成“第一个不满足的位置\x20−\x201”，别另写一套模板；“变种题？”——搜索旋转数组（33）、寻找峰值（162）、第一个错误版本（278）、答案二分（如“分割数组的最大值”410）。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>只背一种模板并把它写熟</b>，比记三种模板更可靠——现场紧张时记忆最容易串。““'},{'c':_0x70a2d6(0xd1),'s':0x1,'lv':'⭐','q':_0x70a2d6(0x2e0),'a':_0x70a2d6(0x1d4)},{'c':_0x70a2d6(0xd1),'s':0x1,'lv':'🔥','q':_0x70a2d6(0x211),'a':_0x70a2d6(0x258)},{'c':_0x70a2d6(0xd1),'s':0x2,'lv':'⭐','q':'反转链表：迭代、递归、K\x20个一组','a':_0x70a2d6(0x251)},{'c':_0x70a2d6(0xd1),'s':0x2,'lv':'⭐','q':_0x70a2d6(0x1e6),'a':_0x70a2d6(0x22c)},{'c':'code','s':0x2,'lv':'🔥','q':'二叉树：遍历、层序与最近公共祖先','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>递归三要素</b>：参数与返回值、终止条件、单层逻辑——想清这三点再写。<b>层序（BFS）</b>：队列\x20+\x20每轮记录当前层节点数分层输出（102）。<b>非递归前序</b>：栈，弹出访问后<b>先压右子再压左子</b>。<b>最近公共祖先（236）</b>：递归左右子树查找，若两侧都有返回则当前节点即答案，否则返回非空那侧。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“常考变种？”——锯齿层序（103）、右视图（199）、二叉树最大深度/直径、验证\x20BST（98，注意用上下界而非只比父子）、路径总和；“BST\x20的中序遍历有什么性质？”——升序，很多\x20BST\x20题的突破口。““'},{'c':_0x70a2d6(0xd1),'s':0x2,'lv':'🔥','q':'双指针：链表判环、找中点、找环入口','a':_0x70a2d6(0xd0)},{'c':'code','s':0x3,'lv':'⭐','q':'滑动窗口：适用题型与固定模板','a':_0x70a2d6(0x10e)},{'c':_0x70a2d6(0xd1),'s':0x3,'lv':'🔥','q':'单调栈与单调队列','a':_0x70a2d6(0x1b9)},{'c':_0x70a2d6(0xd1),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x19c),'a':_0x70a2d6(0x27f)},{'c':_0x70a2d6(0xd1),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x180),'a':_0x70a2d6(0x2bb)},{'c':'code','s':0x4,'lv':'⭐','q':_0x70a2d6(0x20b),'a':_0x70a2d6(0x29c)},{'c':_0x70a2d6(0xd1),'s':0x4,'lv':'🔥','q':_0x70a2d6(0x326),'a':_0x70a2d6(0x2ea)},{'c':_0x70a2d6(0xd1),'s':0x5,'lv':'🔥','q':_0x70a2d6(0x1d2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>生产者-消费者</b>：collections.deque\x20+\x20threading.Condition；put\x20时若满则\x20not_full.wait()，get\x20时若空则\x20not_empty.wait()，操作完notify\x20对方。核心是<b>用条件变量而非忙等</b>（忙等浪费\x20CPU）。<b>限流器</b>两种：<b>令牌桶</b>（按速率补充令牌，允许突发）、<b>漏桶</b>（恒定速率流出，平滑）；简单实现可用“上次请求时间\x20+\x20速率”计算当前可用令牌数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Python\x20有现成的吗？”——queue.Queue\x20本身线程安全（内部就是锁+条件变量），但面试要你手写原理；“异步版怎么写？”——asyncio.Queue\x20+\x20asyncio.Semaphore。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>限流器是\x20LLM\x20服务的必备件：防止打爆下游模型服务、控制成本——<b>能说出这个应用场景，题目就从“八股”变成了“工程”</b>。““'},{'c':_0x70a2d6(0xd1),'s':0x5,'lv':'💎','q':_0x70a2d6(0x147),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x70a2d6(0x158),'a':_0x70a2d6(0xf2)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x70a2d6(0x22f),'a':_0x70a2d6(0x21d)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x70a2d6(0x1cb),'a':_0x70a2d6(0x310)},{'c':'ml','s':0x0,'lv':'🔥','q':'为什么要\x20warmup\x20+\x20cosine\x20decay？','a':_0x70a2d6(0xf6)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x70a2d6(0x1c3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省显存加速，<b>权重主副本和优化器状态保\x20fp32</b>\x20保精度。<b>fp16</b>：尾数多、动态范围小\x20→\x20易上溢/下溢，必须配\x20<b>loss\x20scaling</b>（放大\x20loss\x20让小梯度不被舍入吃掉）。<b>bf16</b>：指数位与\x20fp32\x20相同（动态范围一样大）、尾数少\x20→\x20<b>基本不溢出、免\x20loss\x20scaling</b>，是当前大模型训练主流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“精度低了效果会掉吗？”——训练几乎无损（因为主副本是\x20fp32）；“fp8\x20呢？”——H100\x20起支持，训练已有实践，但需要更精细的缩放策略。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x70a2d6(0xea),'a':_0x70a2d6(0x1e8)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x70a2d6(0x235),'a':_0x70a2d6(0x19b)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x70a2d6(0x2b0),'a':_0x70a2d6(0xf4)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x70a2d6(0x2a1),'a':_0x70a2d6(0xf0)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x70a2d6(0x15d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':_0x70a2d6(0x1de)},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x70a2d6(0x181)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x70a2d6(0x2d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x70a2d6(0x320),'a':_0x70a2d6(0x218)},{'c':'ml','s':0x2,'lv':'💎','q':_0x70a2d6(0x143),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x70a2d6(0x157),'a':_0x70a2d6(0x2ed)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x70a2d6(0x110),'a':_0x70a2d6(0x120)},{'c':'ml','s':0x3,'lv':'💎','q':_0x70a2d6(0x315),'a':_0x70a2d6(0x2f8)},{'c':_0x70a2d6(0x19f),'s':0x0,'lv':'⭐','q':'Self-Attention\x20的完整公式与每一步含义','a':_0x70a2d6(0x15c)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x70a2d6(0x30b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x70a2d6(0x19f),'s':0x0,'lv':'🔥','q':_0x70a2d6(0x1f0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>瓶颈是\x20<b>KV\x20Cache\x20的显存与访存带宽</b>，不是计算。MHA：Q/K/V\x20头数相同（32\x20头），Cache\x20最大。MQA：所有\x20Q\x20头共享1\x20组\x20K/V，Cache\x20缩到\x201/32，但质量掉得明显。<b>GQA</b>：折中——Q\x20头分组、组内共享\x20K/V（32\x20Q\x20头配\x208\x20KV\x20头），Cache\x20缩\x204\x20倍、质量几乎无损，所以成为工业标准（Llama-2/3-70B、Qwen2\x20全系）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“更进一步呢？”——DeepSeek\x20的\x20MLA\x20用低秩投影压缩\x20KV，压缩率更高且质量更好；“为什么不是压计算？”——decode\x20阶段是访存瓶颈（memory-bound），省访存才是省时间。““““““'},{'c':_0x70a2d6(0x19f),'s':0x0,'lv':'🔥','q':_0x70a2d6(0x140),'a':_0x70a2d6(0x329)},{'c':'llm','s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x70a2d6(0x19f),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x70a2d6(0x19f),'s':0x1,'lv':'🔥','q':_0x70a2d6(0x241),'a':_0x70a2d6(0x14a)},{'c':_0x70a2d6(0x19f),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x70a2d6(0x292)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x70a2d6(0x22b),'a':_0x70a2d6(0x226)},{'c':_0x70a2d6(0x19f),'s':0x2,'lv':'💎','q':_0x70a2d6(0x307),'a':_0x70a2d6(0x1f5)},{'c':_0x70a2d6(0x19f),'s':0x3,'lv':'⭐','q':_0x70a2d6(0x259),'a':_0x70a2d6(0x23a)},{'c':_0x70a2d6(0x19f),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x208),'a':_0x70a2d6(0x264)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x70a2d6(0x1dc),'a':_0x70a2d6(0x2c3)},{'c':_0x70a2d6(0x19f),'s':0x4,'lv':'🔥','q':_0x70a2d6(0xdd),'a':_0x70a2d6(0x254)},{'c':_0x70a2d6(0x19f),'s':0x5,'lv':'🔥','q':_0x70a2d6(0x1d5),'a':_0x70a2d6(0x32b)},{'c':_0x70a2d6(0x19f),'s':0x5,'lv':'🔥','q':_0x70a2d6(0x1a0),'a':_0x70a2d6(0x319)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x70a2d6(0x14d),'a':_0x70a2d6(0x1ec)},{'c':_0x70a2d6(0x19f),'s':0x5,'lv':'💎','q':_0x70a2d6(0x2cd),'a':_0x70a2d6(0xf1)},{'c':_0x70a2d6(0x19f),'s':0x5,'lv':'🔥','q':_0x70a2d6(0x29a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x70a2d6(0x19f),'s':0x6,'lv':'⭐','q':_0x70a2d6(0x139),'a':_0x70a2d6(0xd4)},{'c':'llm','s':0x6,'lv':'🔥','q':_0x70a2d6(0x17b),'a':_0x70a2d6(0x2ce)},{'c':_0x70a2d6(0x19f),'s':0x7,'lv':'⭐','q':_0x70a2d6(0x127),'a':_0x70a2d6(0x183)},{'c':_0x70a2d6(0x19f),'s':0x7,'lv':'🔥','q':_0x70a2d6(0x148),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x70a2d6(0x19f),'s':0x7,'lv':'🔥','q':_0x70a2d6(0x126),'a':_0x70a2d6(0x141)},{'c':_0x70a2d6(0x19f),'s':0x7,'lv':'💎','q':_0x70a2d6(0x131),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x70a2d6(0x289),'a':_0x70a2d6(0xe1)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x70a2d6(0x1b4),'a':_0x70a2d6(0x1db)},{'c':'rl','s':0x1,'lv':'🔥','q':'Q-learning\x20与\x20DQN：价值方法怎么工作','a':_0x70a2d6(0x15f)},{'c':'rl','s':0x1,'lv':'💎','q':_0x70a2d6(0x20a),'a':_0x70a2d6(0x1a2)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x70a2d6(0x267),'a':_0x70a2d6(0x210)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x70a2d6(0x167),'a':_0x70a2d6(0x2b5)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x70a2d6(0x1f7),'a':_0x70a2d6(0x323)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x70a2d6(0x198),'a':_0x70a2d6(0x2c1)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x70a2d6(0x2a9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x70a2d6(0x222)},{'c':'rl','s':0x3,'lv':'💎','q':_0x70a2d6(0x116),'a':_0x70a2d6(0x23b)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x70a2d6(0xef),'a':_0x70a2d6(0x297)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x70a2d6(0x122),'a':_0x70a2d6(0x32c)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x70a2d6(0x1ce),'a':_0x70a2d6(0x200)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x70a2d6(0x137),'a':_0x70a2d6(0x2b2)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x70a2d6(0x1fc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x70a2d6(0x118),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x70a2d6(0x21c),'a':_0x70a2d6(0x13c)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x70a2d6(0x2c5),'a':_0x70a2d6(0x101)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x70a2d6(0x31d),'a':_0x70a2d6(0x184)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x70a2d6(0x111),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x70a2d6(0x2a0),'a':_0x70a2d6(0x262)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x70a2d6(0x32a),'a':_0x70a2d6(0x245)},{'c':'pt','s':0x1,'lv':'💎','q':_0x70a2d6(0x205),'a':_0x70a2d6(0x1d9)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x70a2d6(0x195),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x70a2d6(0x309)},{'c':'pt','s':0x2,'lv':'💎','q':'完整后训练流水线：一个真实项目会怎么排','a':_0x70a2d6(0x2a6)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x70a2d6(0x282),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x70a2d6(0x1b5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'消融实验怎么设计才有说服力？','a':_0x70a2d6(0x27a)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x70a2d6(0x146),'a':_0x70a2d6(0x2c2)},{'c':'pt','s':0x3,'lv':'💎','q':_0x70a2d6(0x11a),'a':_0x70a2d6(0x2a7)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x70a2d6(0x296),'s':0x0,'lv':'⭐','q':_0x70a2d6(0x1f4),'a':_0x70a2d6(0x2c6)},{'c':'app','s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':_0x70a2d6(0x27e)},{'c':_0x70a2d6(0x296),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x70a2d6(0x213)},{'c':'app','s':0x1,'lv':'🔥','q':_0x70a2d6(0x209),'a':_0x70a2d6(0x11e)},{'c':_0x70a2d6(0x296),'s':0x1,'lv':'⭐','q':'Rerank\x20为什么有效？和粗排怎么分工？','a':_0x70a2d6(0x2c7)},{'c':_0x70a2d6(0x296),'s':0x2,'lv':'🔥','q':_0x70a2d6(0x1b7),'a':_0x70a2d6(0x1b8)},{'c':_0x70a2d6(0x296),'s':0x2,'lv':'⭐','q':_0x70a2d6(0x2aa),'a':_0x70a2d6(0x237)},{'c':_0x70a2d6(0x296),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x1e4),'a':_0x70a2d6(0xd8)},{'c':'app','s':0x3,'lv':'💎','q':_0x70a2d6(0x178),'a':_0x70a2d6(0x1fe)},{'c':_0x70a2d6(0x296),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':'app','s':0x4,'lv':'⭐','q':_0x70a2d6(0x172),'a':_0x70a2d6(0x2fd)},{'c':'app','s':0x4,'lv':'🔥','q':_0x70a2d6(0x1d8),'a':_0x70a2d6(0x271)},{'c':_0x70a2d6(0x296),'s':0x4,'lv':'🔥','q':_0x70a2d6(0x318),'a':_0x70a2d6(0x239)},{'c':_0x70a2d6(0x296),'s':0x5,'lv':'🔥','q':_0x70a2d6(0x2e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':_0x70a2d6(0x296),'s':0x5,'lv':'💎', x70a2d6(0x177),'s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x70a2d6(0x1dd)},{'c':_0x70a2d6(0x177),'s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':_0x70a2d6(0x28b)},{'c':'eng','s':0x1,'lv':'🔥','q':_0x70a2d6(0x2e5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':_0x70a2d6(0x177),'s':0x2,'lv':'⭐','q':_0x70a2d6(0x29f),'a':_0x70a2d6(0x123)},{'c':_0x70a2d6(0x177),'s':0x2,'lv':'🔥','q':_0x70a2d6(0x1bb),'a':_0x70a2d6(0x30f)},{'c':_0x70a2d6(0x177),'s':0x3,'lv':'🔥','q':'Docker：镜像、容器与部署最佳实践','a':_0x70a2d6(0x23d)},{'c':_0x70a2d6(0x177),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x1a5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':_0x70a2d6(0x177),'s':0x3,'lv':'🔥','q':_0x70a2d6(0x1fb),'a':_0x70a2d6(0x13b)},{'c':_0x70a2d6(0x177),'s':0x4,'lv':'⭐','q':_0x70a2d6(0x1c4),'a':_0x70a2d6(0x16c)},{'c':_0x70a2d6(0x177),'s':0x4,'lv':'🔥','q':_0x70a2d6(0x2b3),'a':_0x70a2d6(0x152)},{'c':_0x70a2d6(0x177),'s':0x4,'lv':'🔥','q':'服务性能：QPS、延迟指标与瓶颈定位','a':_0x70a2d6(0x2ee)},{'c':_0x70a2d6(0x177),'s':0x4,'lv':'💎','q':_0x70a2d6(0xd5),'a':_0x70a2d6(0xee)},{'c':_0x70a2d6(0x177),'s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个层面：①\x20<b>数据不出域</b>——这正是私有化部署的核心诉求，模型、向量库、日志全部本地\x20②\x20<b>权限最小化</b>——服务账号只读、文档级\x20ACL\x20在检索时过滤、行列级数据权限\x20③\x20<b>日志脱敏</b>——prompt\x20和响应可能含敏感信息，记录前脱敏或加密，设保留期\x20④\x20<b>可审计</b>——谁在什么时候问了什么、系统给了什么依据，要可追溯。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么工业客户坚持私有化？”——数据合规与商业秘密，这是国产算力\x20+\x20开源模型方案的存在理由；<b>你的项目正是这个背景，能讲清诉求逻辑就显得懂业务</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把“海光\x20DCU\x20+\x20Qwen\x20私有化\x20+\x20只读账号\x20+\x20行列权限”串成一条<b>合规驱动的架构决策链</b>，比单纯罗列技术栈有说服力得多。“““'},{'c':_0x70a2d6(0x1ed),'s':0x0,'lv':'⭐','q':_0x70a2d6(0x2e3),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':_0x70a2d6(0x1ed),'s':0x0,'lv':'⭐','q':'3\x20分钟自我介绍（现场面主版本）','a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':_0x70a2d6(0x1ed),'s':0x1,'lv':'⭐','q':'项目深挖的标准应答框架（STAR-T）','a':_0x70a2d6(0x2c8)},{'c':_0x70a2d6(0x1ed),'s':0x1,'lv':'⭐','q':_0x70a2d6(0x11c),'a':_0x70a2d6(0x2e7)},{'c':_0x70a2d6(0x1ed),'s':0x2,'lv':'⭐','q':_0x70a2d6(0xfb),'a':_0x70a2d6(0x2cb)},{'c':_0x70a2d6(0x1ed),'s':0x2,'lv':'🔥','q':_0x70a2d6(0xe2),'a':_0x70a2d6(0x1f6)},{'c':_0x70a2d6(0x1ed),'s':0x3,'lv':'⭐','q':'OKC-SFT\x20论文标准讲述稿（3\x20分钟版）','a':_0x70a2d6(0x284)},{'c':'story','s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':'<span\x20class=\x27lb\x27>◈\x20逐条自检</span><br>①\x20幻觉率的判定标准和流程？（必问，见\x205.4.5）<br>②\x20六个阶段是怎么定出来的、为什么是六个？<br>③\x20611\x20条数据的标注质量怎么保证、有没有多人校验？<br>④\x2090\x20条测试集是不是太小？统计上可信吗？<br>⑤\x20为什么不做\x20DPO\x20/\x20偏好对齐？<br>⑥\x20关键点覆盖率\x200.54→0.74\x20是怎么算的？<br>⑦\x20通用能力掉了吗？（有没有测MMLU/CMMLU）<br>⑧\x20为什么投\x20CAC\x20而不是ACL/EMNLP？<br><span\x20class=\x27lb\x27>➤\x20硬伤应对原则</span><br>④⑦\x20如果确实没做，<b>诚实承认\x20+\x20说明如果重做会怎么补</b>——“测试集\x2090\x20条对领域任务够用但统计功效有限，如果重做我会扩到\x20300\x20条并做多种子重复实验”。<b>承认局限并给出改进方案，比硬撑可信得多。</b><br>⑧\x20标准答法：“CAC\x20是自动化领域的会议，我的工作是工业控制场景的落地方法，投这里更贴合读者；如果做通用方法研究，我会选\x20NLP\x20会议。”——<b>把选择讲成定位，而不是能力上限。</b>“'},{'c':'story','s':0x4,'lv':'⭐','q':'腾讯实习讲述稿（框架\x20+\x20待填清单）','a':_0x70a2d6(0x1e0)},{'c':'story','s':0x4,'lv':'⭐','q':_0x70a2d6(0x151),'a':_0x70a2d6(0x31b)},{'c':_0x70a2d6(0x1ed),'s':0x5,'lv':'⭐','q':'行为面五问：诚实但有准备的答法','a':'<span\x20class=\x27lb\x27>◈\x20五个高频问题的应答骨架</span><br>①\x20<b>你最大的缺点</b>：说一个<b>真实但不致命</b>的\x20+\x20你的改进动作。可用：“我早期倾向于把系统做全（前后端都自己上），导致核心链路打磨时间被摊薄；现在我会先明确什么是核心指标，再决定资源分配。”<br>②\x20<b>遇到的最大挑战</b>：讲技术难点（见\x208.2.2），不讲“时间紧”。<br>③\x20<b>团队冲突怎么处理</b>：<b>用你的学生工作经历</b>——这是它唯一的高价值用途，讲一次跨团队协调的具体事例\x20+\x20你的处理逻辑。<br>④\x20<b>为什么选我们公司/这个岗位</b>：必须做功课——具体到<b>业务线、产品、技术方向</b>，别说“贵公司平台好”。<br>⑤\x20<b>职业规划</b>：1年成为能独立交付\x20LLM\x20应用的工程师，3\x20年在某个方向（Agent\x20可靠性\x20/\x20评测体系）有深度积累。<b>别说想做管理。</b><br><span\x20class=\x27lb\x27>➤\x20要点</span><br>行为面的评分标准是<b>真诚\x20+\x20结构清晰\x20+\x20有反思</b>，不是回答漂亮。“'},{'c':'story','s':0x5,'lv':'🔥','q':_0x70a2d6(0x134),'a':_0x70a2d6(0x11d)},{'c':'story','s':0x5,'lv':'🔥','q':_0x70a2d6(0x276),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>每场面试结束后<b>立刻</b>（记忆最清楚时）记四件事：①<b>被问到的所有问题</b>（尽量原话）②\x20<b>答得不好的题</b>及当时的卡点③\x20面试官追问的<b>方向和深度</b>（反映团队真实关注点）④\x20我的改进动作。<br>然后：把答不好的题<b>当天补进手册的对应章节</b>，标为“还不熟”，进入闪卡循环。<br><span\x20class=\x27lb\x27>➤\x20为什么这件事回报最高</b><br>秋招是<b>多轮迭代</b>的过程：同一个问题会在不同公司反复出现。<b>第一次答崩不丢人，第二次还崩才是浪费。</b>面经复盘是把单次失败转化为全局提升的唯一机制。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>用附录\x20C\x20的面经复盘模板，每场一份，存在同一个文件夹里。三场之后你会看到明显的规律。“'},{'c':_0x70a2d6(0x290),'s':0x0,'lv':'⭐','q':_0x70a2d6(0x193),'a':'<span\x20class=\x27lb\x27>◈\x20时间基准：今天\x202026-08-07，实习到\x209月，秋招正式批\x208-9\x20月投递、9-10\x20月面试高峰</span><br><b>W1（8/7-8/13）</b>简历定稿冲刺：把腾讯实习写进简历、删\x20Infra\x20意向、压缩学生工作篇幅；同步开始刷手册第六章。<br><b>W2（8/14-8/20）</b>投递启动：目标公司清单成型，开始投正式批；每天\x201\x20小时刷题\x20+\x20手册第三章。<br><b>W3（8/21-8/27）</b>笔试月：多数大厂笔试集中期；刷题优先级最高；手册第五章。<br><b>W4（8/28-9/3）</b>面试预热：第一批面试到来；每场必复盘；第八章讲述稿练到脱口而出。<br><b>W5-W6（9/4-9/17）</b><b>面试高峰</b>：主战场；每天复盘\x20+\x20补漏；实习收尾，把成果固化进简历。<br><b>W7-W8（9/18-10/2）</b>收割与补投：Offer\x20谈判、补投遗漏公司、二轮机会。<br><span\x20class=\x27lb\x27>⚠\x20关键判断</span><br><b>简历定稿是\x20W1\x20唯一的死线</b>——简历没定，后面所有投递都是浪费机会。“'},{'c':_0x70a2d6(0x290),'s':0x0,'lv':'⭐','q':_0x70a2d6(0x217),'a':'<span\x20class=\x27lb\x27>◈\x20五件必做</span><br>①\x20<b>简历改版（最高优先级）</b>：加腾讯实习那一栏（哪怕先写在做的方向和技术栈）；删掉“AI\x20Infra\x20/\x20Post-training”意向、只留“大模型应用研发\x20/\x20LLM\x20Agent”；技能栏删掉“了解\x20vLLM、KV\x20Cache”这类扛不住追问的表述；学生工作压到2\x20行以内。<br>②\x20<b>找\x20mentor\x20谈一次</b>：问清转正HC\x20情况\x20+\x20争取一个能量化的产出（哪怕是内部\x20demo\x20或实验结论）。<br>③\x20<b>目标公司清单</b>：分三档（冲刺\x20/\x20主力\x20/\x20保底）各\x205-8\x20家，查清投递批次和截止时间。<br>④\x20<b>手册第六章刷完一轮</b>（主战场优先）。<br>⑤\x20<b>刷题热身</b>：Hot100\x20里的哈希/双指针/滑窗，每天\x203\x20题。<br><span\x20class=\x27lb\x27>➤\x20本周验收标准</span><br>周日晚上能做到：<b>简历发出去不心虚+\x206.8\x20节NL2SQL\x20五题能不看稿讲完</b>。“'},{'c':_0x70a2d6(0x290),'s':0x0,'lv':'🔥','q':'每天的时间分配模板（实习期版）','a':_0x70a2d6(0x1b6)},{'c':_0x70a2d6(0x290),'s':0x1,'lv':'🔥','q':_0x70a2d6(0x21f),'a':'<span\x20class=\x27lb\x27>◈\x20三档分法</span><br><b>冲刺档</b>（5-8\x20家）：头部大厂核心\x20LLM\x20团队、明星\x20AI\x20创业公司。心态：练兵\x20+\x20撞运气。<br><b>主力档</b>（8-12\x20家）：大厂常规业务线的\x20AI\x20应用岗、行业头部公司的\x20AI\x20团队、优质中型公司——<b>这一档是你的真实收获区</b>，要投得最全、准备得最认真。<br><b>保底档</b>（5-8\x20家）：国企/研究院/传统行业数字化部门的\x20AI\x20岗、以及地域匹配的稳定选择。<br><span\x20class=\x27lb\x27>➤\x20投递纪律</span><br>·<b>先投主力档练手，再投冲刺档</b>——别把最想去的公司放在面试状态最差的时候<br>·\x20每家投前花\x2015\x20分钟查<b>业务线和技术方向</b>，反问环节和“为什么选我们”都靠这个<br>·\x20<b>宁可少投但每家都准备</b>，海投无准备是最低效的策略<br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>投递截止时间比你想象的早——<b>清单里每家都要标死线</b>。“'},{'c':'plan','s':0x1,'lv':'🔥','q':_0x70a2d6(0x2ba),'a':'<span\x20class=\x27lb\x27>◈\x20必备字段</span><br>公司\x20/\x20部门与业务线\x20/\x20岗位名称\x20/\x20档位（冲刺·主力·保底）/\x20投递渠道（官网·内推·校招平台）/\x20内推人\x20/\x20<b>投递日期</b>\x20/\x20<b>截止日期</b>\x20/\x20当前状态（待投·已投·笔试·一面·二面·HR面·Offer·挂）/\x20<b>下一步动作与时间</b>\x20/\x20备注（面试官关注点、薪资信息）。<br><span\x20class=\x27lb\x27>➤\x20使用纪律</span><br>·\x20<b>每天更新一次</b>，5\x20分钟<br>·\x20“下一步动作”必须写具体日期，否则机会会在等待中过期<br>·\x20挂了的也留着，并在备注里写<b>挂在哪一环</b>——三条记录之后你能看出自己的系统性短板<br><span\x20class=\x27lb\x27>⚓\x20工具建议</span><br>飞书/腾讯文档表格即可，不用搞复杂。<b>关键是每天真的更新</b>。“'},{'c':_0x70a2d6(0x290),'s':0x2,'lv':'⭐','q':'面经复盘模板（每场面试后\x2024\x20小时内填）','a':_0x70a2d6(0x28e)},{'c':'plan','s':0x2,'lv':'🔥','q':_0x70a2d6(0x10c),'a':'<span\x20class=\x27lb\x27>◈\x20三种练法（从易到难）</span><br>①\x20<b>自问自答\x20+\x20录音</b>：打开手册随机抽题，出声回答并录音，回听时注意——有没有结构、有没有嗯啊、有没有说到点上。<b>回听是最痛苦也最有效的一步。</b><br>②\x20<b>让\x20AI\x20当面试官</b>：把你的简历和项目细节喂给模型，要求它扮演严格的面试官连续追问三层，不许放水。<br>③\x20<b>找人真练</b>：同学互面、学长学姐、或者<b>把前几场真实面试当模拟</b>（这就是先投主力档的意义）。<br><span\x20class=\x27lb\x27>➤\x20必须出声练的三样</span><br>·\x203\x20分钟自我介绍（练到掐表精准）<br>·\x20NL2SQL\x20项目讲述稿<br>·\x20OKC-SFT\x20论文讲述稿<br><span\x20class=\x27lb\x27>⚠\x20关键</span><br><b>看懂\x20≠\x20讲得出</b>。手册里的答案你默读时觉得都会，开口说会发现完全是另一回事——<b>这是本手册最容易被忽略的使用要求。<
