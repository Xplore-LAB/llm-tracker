<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5d7677(0x2cb),'a':_0x5d7677(0x206)},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x5d7677(0x237)},{'c':'ml','s':0x2,'lv':'🔥','q':'偏差-方差权衡，以及它在大模型时代的变化','a':_0x5d7677(0x1d4)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5d7677(0x280),'a':_0x5d7677(0x328)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x5d7677(0x177)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x5d7677(0x315),'a':_0x5d7677(0x241)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x5d7677(0x2bc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x5d7677(0x2fb),'a':_0x5d7677(0x2ff)},{'c':_0x5d7677(0x1bf),'s':0x0,'lv':'⭐','q':_0x5d7677(0x195),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x5d7677(0x1bf),'s':0x0,'lv':'⭐','q':'为什么需要多头注意力（Multi-Head）？','a':_0x5d7677(0x209)},{'c':'llm','s':0x0,'lv':'🔥','q':_0x5d7677(0x270),'a':_0x5d7677(0x2e5)},{'c':_0x5d7677(0x1bf),'s':0x0,'lv':'🔥','q':_0x5d7677(0x319),'a':_0x5d7677(0x2e8)},{'c':_0x5d7677(0x1bf),'s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x5d7677(0x1bf),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x5d7677(0x1bf),'s':0x1,'lv':'🔥','q':_0x5d7677(0x2f8),'a':_0x5d7677(0x1ac)},{'c':_0x5d7677(0x1bf),'s':0x2,'lv':'⭐','q':_0x5d7677(0x3ad),'a':_0x5d7677(0x30d)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x5d7677(0x239),'a':_0x5d7677(0x1e2)},{'c':_0x5d7677(0x1bf),'s':0x 论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':'llm','s':0x5,'lv':'💎','q':_0x5d7677(0x3ae),'a':_0x5d7677(0x37a)},{'c':'llm','s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':'llm','s':0x6,'lv':'⭐','q':_0x5d7677(0x242),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':'llm','s':0x6,'lv':'🔥','q':_0x5d7677(0x1c4),'a':_0x5d7677(0x271)},{'c':'llm','s':0x7,'lv':'⭐','q':_0x5d7677(0x307),'a':_0x5d7677(0x395)},{'c':_0x5d7677(0x1bf),'s':0x7,'lv':'🔥','q':_0x5d7677(0x1ce),'a':_0x5d7677(0x18e)},{'c':'llm','s':0x7,'lv':'🔥','q':_0x5d7677(0x1fb),'a':_0x5d7677(0x2c5)},{'c':_0x5d7677(0x1bf),'s':0x7,'lv':'💎','q':_0x5d7677(0x3a3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5d7677(0x29d),'a':_0x5d7677(0x1fd)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5d7677(0x3cd),'a':_0x5d7677(0x370)},{'c':'rl','s':0x1,'lv':'🔥','q':'Q-learning\x20与\x20DQN：价值方法怎么工作','a':_0x5d7677(0x233)},{'c':'rl','s':0x1,'lv':'💎','q':_0x5d7677(0x36c),'a':_0x5d7677(0x3c9)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':_0x5d7677(0x1fe)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5d7677(0x1ff),'a':_0x5d7677(0x2a6)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x5d7677(0x259),'a':_0x5d7677(0x22b)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5d7677(0x221),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>SFT</b>：指令微调得到初始策略\x20π_ref\x20②\x20<b>训练奖励模型\x20RM</b>：同一\x20prompt\x20多个回答人工排序，用\x20pairwise\x20loss\x20训一个打分器（好回答分高于坏回答）③\x20<b>PPO\x20优化</b>：以\x20RM\x20打分为奖励更新策略，同时加\x20<b>KL\x20惩罚</b>约束不要偏离\x20π_ref\x20太远。奖励实际形式：R\x20=\x20RM(x,y)\x20−\x20β·KL(π‖π_ref)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“KL\x20防什么？”——防\x20reward\x20hacking（模型找\x20RM\x20漏洞，比如无脑变长、堆礼貌词）和能力退化；“RM\x20的问题？”——它只是人类偏好的<b>代理</b>，训练久了策略会过拟合这个代理，所以要监控\x20KL\x20和输出长度、定期换新数据训RM。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“为什么不直接用人类打分做奖励”——因为人工反馈太慢太贵，RM\x20是把稀疏人类信号<b>放大成可微、可高频查询的奖励函数</b>。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5d7677(0x28b),'a':_0x5d7677(0x200)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5d7677(0x25f),'a':_0x5d7677(0x3cb)},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x5d7677(0x342)},{'c':'rl','s':0x3,'lv':'💎','q':_0x5d7677(0x27e),'a':_0x5d7677(0x2bb)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5d7677(0x299),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5d7677(0x341),'a':_0x5d7677(0x1da)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20在解决什么问题？天花板在哪？','a':_0x5d7677(0x168)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5d7677(0x3bc),'a':_0x5d7677(0x32f)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5d7677(0x383),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':_0x5d7677(0x379)},{'c':'pt','s':0x1,'lv':'⭐','q':'LoRA：低秩假设到底在假设什么？','a':_0x5d7677(0x3be)},{'c':'pt','s':0x1,'lv':'⭐','q':'QLoRA：在\x20LoRA\x20之上又省了什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5d7677(0x39c),'a':_0x5d7677(0x214)},{'c':'pt','s':0x1,'lv':'🔥','q':'灾难性遗忘：怎么发现、怎么缓解','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5d7677(0x19b),'a':_0x5d7677(0x286)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':_0x5d7677(0x38c)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x5d7677(0x348),'a':_0x5d7677(0x285)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5d7677(0x1ca),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x5d7677(0x178),'a':_0x5d7677(0x2d8)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5d7677(0x37c),'a':_0x5d7677(0x34e)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5d7677(0x230),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x5d7677(0x322)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5d7677(0x2b3),'a':_0x5d7677(0x2b7)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5d7677(0x3bf),'a':_0x5d7677(0x314)},{'c':'pt','s':0x3,'lv':'💎','q':_0x5d7677(0x1a0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>必须先定义“什么算幻觉”——这是最容易被追问崩的地方。可操作的定义：<b>输出中包含无法由给定资料/领域知识支持的事实性断言</b>。测量方法：①\x20人工标注（金标准，要有标注规范和多人一致性）②\x20LLM-as-a-Judge\x20逐条判定（要人工校准）③\x20自动化：NLI\x20模型判断输出与参考是否\x20entailment。报数必须带三要素：<b>分母（多少条）、判定者（人/模型）、抽样方式</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“34.4%\x20→\x2015.6%\x20是怎么算的？”——这题一定会被问，你必须能一口答出：<b>测试集多少条、谁判、按什么规则判、是否盲评</b>。答不上来这个数字就废了。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>报一个漂亮数字但说不清口径，比不报更糟——面试官会怀疑整份简历的真实性。<b>这是你论文数据的防御工事，务必先想清楚。</b>“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5d7677(0x1e4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x5d7677(0x2ce),'s':0x0,'lv':'⭐','q':_0x5d7677(0x326),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':_0x5d7677(0x2ce),'s':0x0,'lv':'⭐','q':_0x5d7677(0x1ab),'a':_0x5d7677(0x17d)},{'c':_0x5d7677(0x2ce),'s':0x1,'lv':'⭐','q':_0x5d7677(0x245),'a':_0x5d7677(0x278)},{'c':_0x5d7677(0x2ce),'s':0x1,'lv':'🔥','q':_0x5d7677(0x180),'a':_0x5d7677(0x1c9)},{'c':'app','s':0x1,'lv':'⭐','q':_0x5d7677(0x26b),'a':_0x5d7677(0x1f1)},{'c':_0x5d7677(0x2ce),'s':0x2,'lv':'🔥','q':_0x5d7677(0x231),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x5d7677(0x2ce),'s':0x2,'lv':'⭐','q':_0x5d7677(0x368),'a':_0x5d7677(0x39a)},{'c':_0x5d7677(0x2ce),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x5d7677(0x1cf)},{'c':'app','s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':_0x5d7677(0x293)},{'c':_0x5d7677(0x2ce),'s':0x4,'lv':'⭐','q':_0x5d7677(0x1e7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':_0x5d7677(0x2ce),'s':0x4,'lv':'⭐','q':_0x5d7677(0x2f3),'a':_0x5d7677(0x256)},{'c':_0x5d7677(0x2ce),'s':0x4,'lv':'🔥','q':_0x5d7677(0x24f),'a':_0x5d7677(0x295)},{'c':'app','s':0x4,'lv':'🔥','q':_0x5d7677(0x199),'a':_0x5d7677(0x2e7)},{'c':_0x5d7677(0x2ce),'s':0x5,'lv':'🔥','q':_0x5d7677(0x21f),'a':_0x5d7677(0x189)},{'c':_0x5d7677(0x2ce),'s':0x5,'lv':'💎','q':_0x5d7677(0x3c4),'a':_0x5d7677(0x30e)},{'c':_0x5d7677(0x2ce),'s':0x6,'lv':'⭐','q':_0x5d7677(0x389),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':'app','s':0x6,'lv':'⭐','q':_0x5d7677(0x2db),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>攻击面：用户输入或<b>检索到的内容</b>里藏指令（“忽略之前的指令……”），模型可能照办——RAG\x20场景里检索内容也是不可信输入。三层防线：<b>输入侧</b>（指令与数据分隔、可疑模式检测）→\x20<b>权限侧</b>（只读账号、最小权限、危险操作人审）→\x20<b>输出侧</b>（动作执行前校验、敏感操作二次确认）。核心认知：<b>prompt\x20层永远防不死，必须权限层兜底。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20SQL\x20注入的异同？”——同属“数据被当指令执行”，防御思路同源：参数化分隔\x20+\x20最小权限。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20的只读账号\x20+\x20LIMIT\x20强制\x20+\x20行列权限，就是权限层防线的现成案例。““““““'},{'c':_0x5d7677(0x2ce),'s':0x6,'lv':'🔥','q':_0x5d7677(0x2a5),'a':_0x5d7677(0x325)},{'c':_0x5d7677(0x2ce),'s':0x6,'lv':'💎','q':_0x5d7677(0x2aa),'a':_0x5d7677(0x33b)},{'c':'app','s':0x7,'lv':'⭐','q':_0x5d7677(0x16b),'a':_0x5d7677(0x2c3)},{'c':_0x5d7677(0x2ce),'s':0x7,'lv':'🔥','q':_0x5d7677(0x31d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':_0x5d7677(0x2ce),'s':0x7,'lv':'⭐','q':_0x5d7677(0x1d8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':_0x5d7677(0x2ce),'s':0x7,'lv':'🔥','q':'执行反馈修正循环：怎么设计才不翻车？','a':_0x5d7677(0x272)},{'c':_0x5d7677(0x2ce),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x5d7677(0x301)},{'c':_0x5d7677(0x19e),'s':0x0,'lv':'⭐','q':_0x5d7677(0x369),'a':_0x5d7677(0x3a4)},{'c':_0x5d7677(0x19e),'s':0x0,'lv':'⭐','q':'asyncio：协程、事件循环、常见坑','a':_0x5d7677(0x289)},{'c':_0x5d7677(0x19e),'s':0x0,'lv':'🔥','q':_0x5d7677(0x36d),'a':_0x5d7677(0x34b)},{'c':_0x5d7677(0x19e),'s':0x1,'lv':'⭐','q':_0x5d7677(0x3a0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':_0x5d7677(0x19e),'s':0x1,'lv':'🔥','q':_0x5d7677(0x2d2),'a':_0x5d7677(0x3c8)},{'c':_0x5d7677(0x19e),'s':0x1,'lv':'🔥','q':_0x5d7677(0x1a3),'a':_0x5d7677(0x1e5)},{'c':_0x5d7677(0x19e),'s':0x2,'lv':'⭐','q':_0x5d7677(0x2d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>状态码：2xx成功（200/201/204）、4xx\x20客户端错（400\x20参数\x20/\x20401\x20未认证\x20/\x20403\x20无权限\x20/\x20404\x20/<b>429\x20限流</b>）、5xx\x20服务端错（500\x20/\x20502\x20网关\x20/\x20503\x20过载\x20/\x20<b>504\x20超时</b>）。幂等：GET/PUT/DELETE\x20幂等，POST\x20不幂等。<b>LLM\x20接口特有</b>：流式响应用\x20<b>SSE</b>（text/event-stream，单向、简单、比\x20WebSocket\x20更合适）；重试要配<b>指数退避</b>；遇\x20429\x20要排队降级而不是猛重试。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20WebSocket？”——LLM\x20输出是单向流，SSE\x20更轻、天然走\x20HTTP、易过代理；“超时怎么设？”——首token（TTFT）和总时长分别设，长任务改异步任务\x20+\x20轮询/回调。“““'},{'c':'eng','s':0x2,'lv':'🔥','q':_0x5d7677(0x220),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':_0x5d7677(0x19e),'s':0x3,'lv':'🔥','q':'Docker：镜像、容器与部署最佳实践','a':_0x5d7677(0x202)},{'c':_0x5d7677(0x19e),'s':0x3,'lv':'🔥','q':_0x5d7677(0x366),'a':_0x5d7677(0x164)},{'c':_0x5d7677(0x19e),'s':0x3,'lv':'🔥','q':_0x5d7677(0x24a),'a':_0x5d7677(0x306)},{'c':_0x5d7677(0x19e),'s':0x4,'lv':'⭐','q':_0x5d7677(0x1cb),'a':_0x5d7677(0x1eb)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x5d7677(0x3b9),'a':_0x5d7677(0x1a6)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x5d7677(0x392),'a':_0x5d7677(0x21a)},{'c':_0x5d7677(0x19e),'s':0x4,'lv':'💎','q':_0x5d7677(0x2f4),'a':_0x5d7677(0x2e4)},{'c':'eng','s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':_0x5d7677(0x2be)},{'c':_0x5d7677(0x222),'s':0x0,'lv':'⭐','q':_0x5d7677(0x300),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':'story','s':0x0,'lv':'⭐','q':'3\x20分钟自我介绍（现场面主版本）','a':_0x5d7677(0x1d9)},{'c':_0x5d7677(0x222),'s':0x1,'lv':'⭐','q':_0x5d7677(0x1e8),'a':_0x5d7677(0x317)},{'c':_0x5d7677(0x222),'s':0x1,'lv':'⭐','q':_0x5d7677(0x353),'a':_0x5d7677(0x3a8)},{'c':_0x5d7677(0x222),'s':0x2,'lv':'⭐','q':_0x5d7677(0x25b),'a':_0x5d7677(0x38f)},{'c':_0x5d7677(0x222),'s':0x2,'lv':'🔥','q':_0x5d7677(0x23f),'a':_0x5d7677(0x3c2)},{'c':'story','s':0x3,'lv':'⭐','q':_0x5d7677(0x305),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>问题</b>：空分装置异常处置场景，大模型给的建议存在三个问题——<b>回答结构不稳定、缺少验证闭环、会生成不受支持的内容</b>。这三个问题在工业安全场景是不可接受的。<br><b>方法</b>：提出\x20OKC-SFT——把现场操作员的处置逻辑建模为六阶段知识链（<b>Diagnosis\x20→\x20Evidence\x20→\x20Causes\x20→\x20Actions\x20→\x20Verification\x20→\x20Risk\x20Boundary</b>），用结构化监督微调引导模型按这个链路输出。<br><b>数据</b>：基于操作规程、现场案例、工艺机理和专家经验构建\x20611\x20条监督样本，覆盖\x206\x20类任务；<b>不是凑数量，是按任务类型做覆盖设计</b>。<br><b>训练</b>：Qwen2.5-7B-Instruct\x20为基座，QLoRA\x20微调——611\x20条数据\x20+\x20有限算力下，全量微调既超显存又必过拟合。<br><b>实验</b>：三组对照（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）+\x20消融，证明提升来自<b>结构化监督</b>而非微调本身。<br><b>结果</b>：结构完整率\x2099.8%、关键点覆盖率\x200.5407→0.7378、Verification\x20与\x20Risk\x20Boundary\x20出现率\x20100%、幻觉率\x2034.4%→15.6%。<br><span\x20class=\x27lb\x27>⚓\x20金句（收尾用）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>“'},{'c':_0x5d7677(0x222),'s':0x3,'lv':'🔥','q':_0x5d7677(0x1b8),'a':_0x5d7677(0x1e1)},{'c':'story','s':0x4,'lv':'⭐','q':_0x5d7677(0x2a4),'a':_0x5d7677(0x327)},{'c':_0x5d7677(0x222),'s':0x4,'lv':'⭐','q':'“游戏算法和\x20LLM\x20应用岗有什么关系？”（必问）','a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+\x20RL”这个方法词升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>千万别说“我是被调剂过去的”或“我其实想做\x20LLM\x20但没拿到”——一句话让整段经历变成减分项。“'},{'c':_0x5d7677(0x222),'s':0x5,'lv':'⭐','q':_0x5d7677(0x16d),'a':_0x5d7677(0x324)},{'c':_0x5d7677(0x222),'s':0x5,'lv':'🔥','q':_0x5d7677(0x247),'a':_0x5d7677(0x17c)},{'c':_0x5d7677(0x222),'s':0x5,'lv':'🔥','q':_0x5d7677(0x196),'a':_0x5d7677(0x309)},{'c':_0x5d7677(0x
