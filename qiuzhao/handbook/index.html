<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x5a82f4(0x210),'a':_0x5a82f4(0x396)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5a82f4(0x1f9),'a':_0x5a82f4(0x3c5)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5a82f4(0x2cb),'a':_0x5a82f4(0x1b4)},{'c':'ml','s':0x0,'lv':'🔥','q':'梯度累积与梯度裁剪','a':_0x5a82f4(0x2ac)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x5a82f4(0x2f0),'a':_0x5a82f4(0x199)},{'c':'ml','s':0x1,'lv':'🔥','q':'激活函数：ReLU\x20/\x20GELU\x20/\x20SiLU\x20/\x20SwiGLU','a':_0x5a82f4(0x1e3)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>全零\x20→\x20所有神经元完全对称、收到相同梯度，永远学不出差异（对称性破坏失败）。<b>Xavier</b>：方差\x202/(fan_in+fan_out)，适配\x20tanh/sigmoid，保持前向后向方差稳定。<b>He</b>：方差\x202/fan_in，适配\x20ReLU\x20族——因为\x20ReLU\x20砍掉一半输出，方差要加倍补偿。大模型语境：初始化尺度还要按<b>深度缩放</b>（如输出投影按\x201/√(2N)\x20缩小），否则深层残差累积会让激活爆炸。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“初始化不当的症状？”——开局\x20loss\x20异常大或\x20NaN、或者\x20loss\x20长期不动；“为什么\x20LoRA\x20的\x20B\x20可以初始化为零？”——因为\x20A\x20是随机的，A·B\x20整体不为对称零，且这样保证起点\x20ΔW=0。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5a82f4(0x32a),'a':_0x5a82f4(0x242)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5a82f4(0x2de),'a':_0x5a82f4(0x3d3)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5a82f4(0x2f9),'a':_0x5a82f4(0x2ca)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5a82f4(0x279),'a':_0x5a82f4(0x1ed)},{'c':'ml','s':0x2,'lv':'🔥','q':'类别不平衡怎么处理','a':_0x5a82f4(0x228)},{'c':'ml','s':0x2,'lv':'💎','q':_0x5a82f4(0x303),'a':_0x5a82f4(0x350)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x5a82f4(0x3a5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>数据并行（DDP）</b>：每卡一份完整模型、切数据、梯度\x20all-reduce\x20同步——最简单，通信量约等于模型大小。<b>张量并行</b>：层内切矩阵（Megatron），卡间每层都要通信，<b>只适合单机高带宽（NVLink）</b>。<b>流水线并行</b>：按层切成多段串行，有<b>气泡（bubble）</b>浪费，靠\x20micro-batch\x20缓解。<b>ZeRO</b>（DeepSpeed）：把优化器状态/梯度/参数依次分片到各卡（stage\x201/2/3），显存大幅下降，通信换显存。实践：大规模训练是<b>三种并行\x20+\x20ZeRO\x20的组合（3D\x20并行）</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“7B\x20微调该用什么？”——单卡\x20QLoRA\x20就够；多卡全量微调用\x20ZeRO-2/3\x20或\x20FSDP；“应用岗要懂到什么程度？”——<b>知道各自解决什么问题、什么时候选哪个</b>即可，再深属于Infra\x20岗范畴。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x5a82f4(0x23c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x5a82f4(0x200),'a':_0x5a82f4(0x271)},{'c':_0x5a82f4(0x300),'s':0x0,'lv':'⭐','q':_0x5a82f4(0x35f),'a':_0x5a82f4(0x1f0)},{'c':_0x5a82f4(0x300),'s':0x0,'lv':'⭐','q':'为什么需要多头注意力（Multi-Head）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x5a82f4(0x300),'s':0x0,'lv':'🔥','q':_0x5a82f4(0x239),'a':_0x5a82f4(0x19c)},{'c':_0x5a82f4(0x300),'s':0x0,'lv':'🔥','q':_0x5a82f4(0x2a5),'a':_0x5a82f4(0x340)},{'c':_0x5a82f4(0x300),'s':0x1,'lv':'⭐','q':_0x5a82f4(0x1e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x5a82f4(0x300),'s':0x1,'lv':'🔥','q':_0x5a82f4(0x1cb),'a':_0x5a82f4(0x1f8)},{'c':'llm','s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':_0x5a82f4(0x3b7)},{'c':_0x5a82f4(0x300),'s':0x2,'lv':'⭐','q':_0x5a82f4(0x384),'a':_0x5a82f4(0x186)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x5a82f4(0x2f5),'a':_0x5a82f4(0x211)},{'c':_0x5a82f4(0x300),'s':0x2,'lv':'💎','q':_0x5a82f4(0x356),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类：①\x20<b>批处理</b>——continuous\x20batching（vLLM，请求到达即插入，GPU\x20不空转，吞吐提升最大的单点）\x20②\x20<b>注意力与显存</b>——PagedAttention、FlashAttention、KV\x20量化\x20③\x20<b>模型压缩</b>——量化（GPTQ/AWQ权重量化、W8A8）、蒸馏、剪枝\x20④\x20<b>解码策略</b>——投机解码（小模型起草、大模型批量验证，无损加速）、Medusa\x20多头预测。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“先上哪个？”——先vLLM（continuous\x20batching\x20+\x20PagedAttention\x20开箱即得），再考虑量化；“投机解码为什么无损？”——验证阶段用大模型的分布做接受/拒绝采样，输出分布与原模型一致。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>应用岗到这个水位（知道名词\x20+\x20一句话原理\x20+\x20选型顺序）就够，别硬装Infra\x20深度——被追问\x20CUDA\x20实现会崩。““““““'},{'c':_0x5a82f4(0x300),'s':0x3,'lv':'⭐','q':_0x5a82f4(0x324),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(logits/T)：T\x20大→分布变平（更随机多样），T\x20小→更尖锐（更确定），T→0\x20等价贪心。top-k：只在概率最高\x20k\x20个\x20token\x20里采样（固定截断）。<b>top-p（nucleus）</b>：取累积概率达\x20p\x20的最小\x20token\x20集合（动态截断，比\x20top-k\x20自适应）。工程经验：严肃任务（NL2SQL\x20/\x20代码\x20/\x20抽取）T=0~0.3；创作类\x200.7~1.0；<b>别同时激进调\x20T\x20和\x20top-p</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么复读？”——贪心/低温陷入局部最优形成循环，用\x20repetition_penalty\x20或适度提温；“T=0\x20一定可复现吗？”——不完全，浮点非确定性和批处理顺序会引入微小差异。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20用低温\x20+\x20结构约束，是“任务性质决定采样策略”的现成例子。““““““'},{'c':_0x5a82f4(0x300),'s':0x3,'lv':'🔥','q':_0x5a82f4(0x383),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(x_i)=e^{x_i}/Σe^{x_j}，x\x20大时\x20e^x\x20上溢。稳定版：<b>先减\x20max</b>——e^{x_i-max}/Σe^{x_j-max}，数学等价、数值安全。logsumexp\x20=\x20max\x20+\x20log\x20Σe^{x_j-max}，用于算log\x20概率（交叉熵、logprobs）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么面试爱考？”——手撕\x20attention\x20的第一个考点；且推理框架里所有采样、beam\x20search、困惑度计算都建在\x20logprobs\x20上，数值稳定是工程底线。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>手写\x20attention\x20时直接\x20exp\x20不减\x20max，是最常见的“会写但不专业”破绽。““““““'},{'c':_0x5a82f4(0x300),'s':0x4,'lv':'🔥','q':_0x5a82f4(0x35b),'a':_0x5a82f4(0x26d)},{'c':_0x5a82f4(0x300),'s':0x4,'lv':'🔥','q':'预训练数据工程：配比、清洗、去重','a':_0x5a82f4(0x33a)},{'c':_0x5a82f4(0x300),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':_0x5a82f4(0x218)},{'c':_0x5a82f4(0x300),'s':0x5,'lv':'🔥','q':_0x5a82f4(0x28b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x5a82f4(0x224),'a':_0x5a82f4(0x1ef)},{'c':_0x5a82f4(0x300),'s':0x5,'lv':'💎','q':_0x5a82f4(0x3ba),'a':_0x5a82f4(0x1bc)},{'c':_0x5a82f4(0x300),'s':0x5,'lv':'🔥','q':_0x5a82f4(0x1d5),'a':_0x5a82f4(0x3c9)},{'c':_0x5a82f4(0x300),'s':0x6,'lv':'⭐','q':'推理模型（R1\x20/\x20o1）与普通模型的本质区别','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':_0x5a82f4(0x300),'s':0x6,'lv':'🔥','q':_0x5a82f4(0x256),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':_0x5a82f4(0x300),'s':0x7,'lv':'⭐','q':_0x5a82f4(0x2d3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因四层：①\x20训练数据本身有错/有噪\x20②\x20next-token\x20目标只奖励“像人话”，不奖励“是真的”\x20③\x20模型不知道自己不知道（知识边界缺失）\x20④\x20采样随机性引入漂移。缓解按链路排：数据清洗\x20→\x20SFT\x20加入<b>拒答与边界样本</b>\x20→\x20偏好对齐惩罚编造\x20→\x20<b>RAG\x20外挂知识\x20+\x20引用溯源</b>\x20→\x20结构化输出约束\x20→\x20生成后一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能彻底消除吗？”——不能，它是概率生成的内在属性；工程目标是<b>把幻觉控制在可接受范围并让它可被发现</b>（溯源、置信度、拒答）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>OKC-SFT\x20直接打这个问题：六段式知识链强制模型输出\x20Verification\x20和\x20Risk\x20Boundary，幻觉率\x2034.4%→15.6%，Verification/Risk\x20Boundary\x20出现率\x20100%——<b>“我不是在让模型少说错，是在让它必须自证”</b>，这句话能让面试官记住你。““““““'},{'c':_0x5a82f4(0x300),'s':0x7,'lv':'🔥','q':_0x5a82f4(0x1cd),'a':_0x5a82f4(0x2a4)},{'c':_0x5a82f4(0x300),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x5a82f4(0x1f1)},{'c':'llm','s':0x7,'lv':'💎','q':_0x5a82f4(0x1cf),'a':_0x5a82f4(0x38b)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5a82f4(0x18c),'a':_0x5a82f4(0x21e)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5a82f4(0x26b),'a':_0x5a82f4(0x299)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x5a82f4(0x3c2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Q-learning：用贝尔曼最优方程做<b>时序差分</b>更新，Q(s,a)\x20←\x20Q(s,a)\x20+\x20α[r\x20+\x20γ\x20max_a\x27\x20Q(s\x27,a\x27)\x20−\x20Q(s,a)]，学到\x20Q\x20后贪心取\x20argmax\x20就是最优策略。它是\x20<b>off-policy</b>的（更新用\x20max，与实际采样策略无关），所以能用经验回放。<b>DQN</b>\x20三个关键工程技巧：①\x20神经网络近似\x20Q\x20②\x20<b>经验回放池</b>打破样本相关性\x20③\x20<b>目标网络</b>（延迟更新的\x20Q\x20副本）稳定\x20TD\x20目标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么需要目标网络？”——不然是“用自己预测自己”，目标随参数一起动会震荡甚至发散；“局限？”——只适合<b>离散动作</b>，连续/高维动作空间要用策略方法。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>游戏AI\x20的经典入口（Atari、棋牌类离散动作）——腾讯游戏算法场景可以从这里切入讲。““““““'},{'c':'rl','s':0x1,'lv':'💎','q':_0x5a82f4(0x37c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5a82f4(0x3c7),'a':_0x5a82f4(0x1d9)},{'c':'rl','s':0x2,'lv':'⭐','q':'PPO：为什么它是工业标准？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x5a82f4(0x2e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5a82f4(0x219),'a':_0x5a82f4(0x223)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5a82f4(0x28f),'a':_0x5a82f4(0x22c)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5a82f4(0x17e),'a':_0x5a82f4(0x1ad)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x5a82f4(0x1d3),'a':_0x5a82f4(0x311)},{'c':'rl','s':0x3,'lv':'💎','q':_0x5a82f4(0x36d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5a82f4(0x19f),'a':_0x5a82f4(0x29f)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5a82f4(0x272),'a':_0x5a82f4(0x298)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20在解决什么问题？天花板在哪？','a':_0x5a82f4(0x35e)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5a82f4(0x352),'a':_0x5a82f4(0x397)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':_0x5a82f4(0x1ab)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5a82f4(0x2d6),'a':_0x5a82f4(0x2dc)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5a82f4(0x290),'a':_0x5a82f4(0x1ee)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x5a82f4(0x34a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x5a82f4(0x344),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':'LoRA的\x20rank\x20和\x20alpha\x20怎么定？','a':_0x5a82f4(0x198)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5a82f4(0x18f),'a':_0x5a82f4(0x24f)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5a82f4(0x288),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x5a82f4(0x1db),'a':_0x5a82f4(0x36e)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x5a82f4(0x3da),'a':_0x5a82f4(0x243)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5a82f4(0x29b),'a':_0x5a82f4(0x283)},{'c':'pt','s':0x2,'lv':'💎','q':_0x5a82f4(0x25e),'a':_0x5a82f4(0x33e)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5a82f4(0x37a),'a':_0x5a82f4(0x394)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5a82f4(0x18d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5a82f4(0x381),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'消融实验怎么设计才有说服力？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x5a82f4(0x3b1)},{'c':'pt','s':0x3,'lv':'💎','q':_0x5a82f4(0x363),'a':_0x5a82f4(0x244)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5a82f4(0x281),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x5a82f4(0x225),'s':0x0,'lv':'⭐','q':_0x5a82f4(0x309),'a':_0x5a82f4(0x36b)},{'c':_0x5a82f4(0x225),'s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':_0x5a82f4(0x372)},{'c':'app','s':0x1,'lv':'⭐','q':_0x5a82f4(0x1a5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':'app','s':0x1,'lv':'🔥','q':_0x5a82f4(0x346),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x5a82f4(0x225),'s':0x1,'lv':'⭐','q':'Rerank\x20为什么有效？和粗排怎么分工？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x5a82f4(0x225),'s':0x2,'lv':'🔥','q':_0x5a82f4(0x28a),'a':_0x5a82f4(0x208)},{'c':_0x5a82f4(0x225),'s':0x2,'lv':'⭐','q':_0x5a82f4(0x3ab),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x5a82f4(0x225),'s':0x3,'lv':'🔥','q':_0x5a82f4(0x2bf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':_0x5a82f4(0x225),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x5a82f4(0x225),'s':0x4,'lv':'⭐','q':_0x5a82f4(0x1e4),'a':_0x5a82f4(0x3ca)},{'c':_0x5a82f4(0x225),'s':0x4,'lv':'⭐','q':_0x5a82f4(0x245),'a':_0x5a82f4(0x1e2)},{'c':_0x5a82f4(0x225),'s':0x4,'lv':'🔥','q':'Plan-and-Execute\x20vs\x20ReAct：怎么选？','a':_0x5a82f4(0x2a7)},{'c':_0x5a82f4(0x225),'s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':_0x5a82f4(0x1c9)},{'c':'app','s':0x5,'lv':'🔥','q':_0x5a82f4(0x2bb),'a':_0x5a82f4(0x237)},{'c':_0x5a82f4(0x225),'s':0x5,'lv':'💎','q':_0x5a82f4(0x307),'a':_0x5a82f4(0x3bd)},{'c':_0x5a82f4(0x225),'s':0x6,'lv':'⭐','q':_0x5a82f4(0x34b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x5a82f4(0x225),'s':0x6,'lv':'⭐','q':_0x5a82f4(0x2ce),'a':_0x5a82f4(0x3c4)},{'c':'app','s':0x6,'lv':'🔥','q':_0x5a82f4(0x373),'a':_0x5a82f4(0x276)},{'c':_0x5a82f4(0x225),'s':0x6,'lv':'💎','q':_0x5a82f4(0x1ea),'a':_0x5a82f4(0x32b)},{'c':_0x5a82f4(0x225),'s':0x7,'lv':'⭐','q':_0x5a82f4(0x2f8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Schema\x20Linking</b>：口语字段映射到真实表/列\x20→\x20schema\x20裁剪\x20+\x20字段别名库\x20+\x20RAG\x20检索注入\x20②\x20<b>业务口径</b>：“上月销量”的定义\x20→\x20口径说明库\x20+\x20few-shot\x20示例\x20③\x20<b>复杂逻辑</b>：多表\x20join/嵌套聚合\x20→\x20任务分解、分步生成\x20④\x20<b>可靠性</b>：语法校验\x20+\x20执行反馈修正循环\x20+\x20查询要素完备性检查\x20⑤\x20<b>安全</b>：只读限制、行列权限、注入防护、LIMIT\x20强制。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>每个难点都会再挖一层（见本节后续条目）——这一条的答法决定面试官往哪挖。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>数据随时能报：10\x20张表\x20/\x20307\x20字段\x20/\x20约\x2090\x20万行真实工业数据，SQL\x20可执行率\x2098%、人工校验正确率\x2096%——<b>并且能讲清两个口径的区别</b>。““““““'},{'c':_0x5a82f4(0x225),'s':0x7,'lv':'🔥','q':_0x5a82f4(0x2a2),'a':_0x5a82f4(0x1d0)},{'c':_0x5a82f4(0x225),'s':0x7,'lv':'⭐','q':_0x5a82f4(0x240),'a':_0x5a82f4(0x358)},{'c':_0x5a82f4(0x225),'s':0x7,'lv':'🔥','q':_0x5a82f4(0x306),'a':_0x5a82f4(0x21c)},{'c':_0x5a82f4(0x225),'s':0x7,'lv':'🔥','q':_0x5a82f4(0x22a),'a':_0x5a82f4(0x36f)},{'c':_0x5a82f4(0x2df),'s':0x0,'lv':'⭐','q':'Python\x20GIL：是什么、影响什么、怎么绕','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':'eng','s':0x0,'lv':'⭐','q':_0x5a82f4(0x212),'a':_0x5a82f4(0x2ff)},{'c':'eng','s':0x0,'lv':'🔥','q':_0x5a82f4(0x260),'a':_0x5a82f4(0x17c)},{'c':'eng','s':0x1,'lv':'⭐','q':_0x5a82f4(0x1e0),'a':_0x5a82f4(0x1ca)},{'c':_0x5a82f4(0x2df),'s':0x1,'lv':'🔥','q':_0x5a82f4(0x357),'a':_0x5a82f4(0x287)},{'c':_0x5a82f4(0x2df),'s':0x1,'lv':'🔥','q':_0x5a82f4(0x368),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':_0x5a82f4(0x2df),'s':0x2,'lv':'⭐','q':_0x5a82f4(0x387),'a':_0x5a82f4(0x2b1)},{'c':_0x5a82f4(0x2df),'s':0x2,'lv':'🔥','q':_0x5a82f4(0x2cf),'a':_0x5a82f4(0x25d)},{'c':_0x5a82f4(0x2df),'s':0x3,'lv':'🔥','q':_0x5a82f4(0x2ee),'a':_0x5a82f4(0x2c5)},{'c':_0x5a82f4(0x2df),'s':0x3,'lv':'🔥','q':_0x5a82f4(0x3c0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':_0x5a82f4(0x2df),'s':0x3,'lv':'🔥','q':'Git：rebase\x20vs\x20merge\x20与救命操作','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':'eng','s':0x4,'lv':'⭐','q':_0x5a82f4(0x30b),'a':_0x5a82f4(0x1a6)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x5a82f4(0x21d),'a':_0x5a82f4(0x1d7)},{'c':_0x5a82f4(0x2df),'s':0x4,'lv':'🔥','q':_0x5a82f4(0x196),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>通用指标：QPS/TPS、延迟（<b>看\x20P95/P99，不看平均</b>）、错误率、饱和度。<b>LLM\x20服务特有指标</b>
