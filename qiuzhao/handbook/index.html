<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x20核心回答</span><br><b>迭代</b>（首选，O(1)\x20空间）：prev=None,\x20cur=head；循环内四步固定顺序——nxt=cur.next\x20→\x20cur.next=prev\x20→\x20prev=cur\x20→\x20cur=nxt；返回\x20prev。<b>递归</b>：newHead=reverse(head.next)，然后\x20head.next.next=head、head.next=None，返回newHead。<b>K\x20个一组（LeetCode\x2025，困难高频）</b>：用哨兵节点\x20+\x20每次先探测是否够\x20k\x20个，够则反转该段并接回，注意保存段前驱和段尾。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“递归空间复杂度？”——O(n)\x20栈深度，长链表可能爆栈；“怎么少出错？”——<b>画图+\x20用哨兵节点（dummy\x20head）消除头节点特判</b>，这是链表题通用降错技巧。““'},{'c':_0x2288d0(0x1c4),'s':0x2,'lv':'⭐','q':_0x2288d0(0x39b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':_0x2288d0(0x1c4),'s':0x2,'lv':'🔥','q':_0x2288d0(0x256),'a':_0x2288d0(0x2b2)},{'c':'code','s':0x2,'lv':'🔥','q':_0x2288d0(0x28d),'a':_0x2288d0(0x381)},{'c':_0x2288d0(0x1c4),'s':0x3,'lv':'⭐','q':'滑动窗口：适用题型与固定模板','a':_0x2288d0(0x351)},{'c':_0x2288d0(0x1c4),'s':0x3,'lv':'🔥','q':'单调栈与单调队列','a':_0x2288d0(0x206)},{'c':_0x2288d0(0x1c4),'s':0x3,'lv':'🔥','q':_0x2288d0(0x38e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>前缀和</b>：pre[i]=前\x20i\x20项和，区间和\x20[l,r]\x20=\x20pre[r+1]−pre[l]，O(1)\x20查询。<b>前缀和\x20+\x20哈希</b>是高频组合：<b>和为\x20K\x20的子数组（560）</b>——遍历时用哈希记录各前缀和出现次数，查找\x20pre[i]−K\x20是否出现过。<b>差分</b>：区间批量加法的逆操作——在\x20l\x20处\x20+v、r+1\x20处\x20−v，最后求前缀和还原（区间更新\x20O(1)）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么哈希里要先放\x20{0:1}？”——处理“从下标\x200\x20开始的子数组”这种边界；“二维版？”——二维前缀和（304），矩阵区域和用容斥。““'},{'c':_0x2288d0(0x1c4),'s':0x3,'lv':'🔥','q':_0x2288d0(0x219),'a':_0x2288d0(0x24f)},{'c':_0x2288d0(0x1c4),'s':0x4,'lv':'⭐','q':_0x2288d0(0x3a8),'a':_0x2288d0(0x1b5)},{'c':'code','s':0x4,'lv':'🔥','q':'BFS\x20/\x20DFS：网格、拓扑与回溯','a':_0x2288d0(0x220)},{'c':_0x2288d0(0x1c4),'s':0x5,'lv':'🔥','q':_0x2288d0(0x31a),'a':_0x2288d0(0x20f)},{'c':_0x2288d0(0x1c4),'s':0x5,'lv':'💎','q':'刷题策略：时间有限该怎么刷','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x2288d0(0x33f),'a':_0x2288d0(0x2bc)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x2288d0(0x2ed),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x2288d0(0x26d),'a':_0x2288d0(0x343)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x2288d0(0x367),'a':_0x2288d0(0x3e7)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x2288d0(0x296),'a':_0x2288d0(0x295)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x2288d0(0x1f6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x2288d0(0x37a),'a':_0x2288d0(0x2c9)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x2288d0(0x1d4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ReLU</b>：max(0,x)，快但负区梯度为零（神经元死亡）。<b>GELU</b>：x·Φ(x)，平滑版\x20ReLU，BERT/GPT\x20系用。<b>SiLU/Swish</b>：x·sigmoid(x)，平滑且有轻微负值。<b>SwiGLU</b>（现代\x20LLM\x20FFN\x20标配）：FFN(x)\x20=\x20(xW₁\x20⊙\x20SiLU(xW₃))W₂——<b>门控机制引入乘性交互</b>，表达能力更强；代价是多一个投影矩阵，所以通常把中间维度调小以保持参数量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么门控有效？”——乘性交互让网络能表达“条件性通过”，比纯加性变换表达力更强，实验上稳定优于\x20ReLU/GELU；“为什么\x20FFN\x20中间维度是\x208/3\x20倍而不是\x204\x20倍？”——正是为了在加了第三个矩阵后保持总参数量不变。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':_0x2288d0(0x243),'a':_0x2288d0(0x2de)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x2288d0(0x34c)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x2288d0(0x266),'a':_0x2288d0(0x248)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2288d0(0x2b3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2288d0(0x3f8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2288d0(0x370),'a':_0x2288d0(0x22c)},{'c':'ml','s':0x2,'lv':'💎','q':_0x2288d0(0x3d4),'a':_0x2288d0(0x307)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x2288d0(0x3f6),'a':_0x2288d0(0x345)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x2288d0(0x2f0),'a':_0x2288d0(0x24d)},{'c':'ml','s':0x3,'lv':'💎','q':'量化：INT8\x20/\x20INT4\x20/\x20GPTQ\x20/\x20AWQ\x20一句话区分','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>目的：用更低位宽表示权重（和/或激活）以省显存、提吞吐。<b>训练后量化\x20PTQ</b>（主流）：<b>GPTQ</b>逐层最小化量化误差、需要校准集；<b>AWQ</b>\x20识别并保护“重要通道”（激活幅值大的权重），精度损失更小、推理更快。<b>NF4</b>（QLoRA\x20用）针对正态分布权重设计。<b>W8A8</b>\x20指权重和激活都量化到\x208bit，吞吐收益更大但精度风险更高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“INT4\x20掉点吗？”——小模型掉得明显，大模型相对耐受；关键看任务，结构化/推理任务更敏感；“什么时候别量化？”——精度要求极高、或显存本来就够时。““““'},{'c':_0x2288d0(0x265),'s':0x0,'lv':'⭐','q':_0x2288d0(0x1e7),'a':_0x2288d0(0x28f)},{'c':_0x2288d0(0x265),'s':0x0,'lv':'⭐','q':_0x2288d0(0x278),'a':_0x2288d0(0x263)},{'c':_0x2288d0(0x265),'s':0x0,'lv':'🔥','q':_0x2288d0(0x213),'a':_0x2288d0(0x28a)},{'c':_0x2288d0(0x265),'s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':_0x2288d0(0x298)},{'c':'llm','s':0x1,'lv':'⭐','q':_0x2288d0(0x334),'a':_0x2288d0(0x282)},{'c':_0x2288d0(0x265),'s':0x1,'lv':'🔥','q':_0x2288d0(0x24c),'a':_0x2288d0(0x236)},{'c':_0x2288d0(0x265),'s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':_0x2288d0(0x1e6)},{'c':'llm','s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':'llm','s':0x2,'lv':'⭐','q':_0x2288d0(0x23c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>口诀：<b>fp16/bf16\x20下\x201B\x20参数\x20≈\x202GB</b>。推理仅权重：7B≈14GB，INT8\x20减半，INT4\x20再减半（再加\x20KV\x20Cache\x20和激活的余量）。全量微调（Adam）：fp32\x20主权重4\x20+\x20梯度4\x20+\x20两个动量8≈\x20<b>每参数\x2016~20\x20字节</b>\x20→\x207B\x20需\x20100GB+，单卡不可能。所以\x20QLoRA：基座量化到\x204bit\x20冻结、只训\x20LoRA（&lt;1%\x20参数），单卡\x2024GB\x20微调\x207B\x20成立。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理还要留多少余量？”——KV\x20Cache\x20+\x20激活\x20+\x20框架开销，一般按权重的\x201.2~1.5\x20倍规划；“为什么权重要留\x20fp32\x20主副本？”——fp16\x20更新量太小会被舍入吃掉，主副本保精度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把这笔账和你论文里选\x20QLoRA\x20的理由挂钩：“611\x20条领域数据\x20+\x20有限算力，全量微调不现实且易过拟合，QLoRA\x20是性价比最优解”——有算术支撑的技术选型，比说“我用了\x20QLoRA”强十倍。““““““'},{'c':'llm','s':0x2,'lv':'💎','q':_0x2288d0(0x38f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类：①\x20<b>批处理</b>——continuous\x20batching（vLLM，请求到达即插入，GPU\x20不空转，吞吐提升最大的单点）\x20②\x20<b>注意力与显存</b>——PagedAttention、FlashAttention、KV\x20量化\x20③\x20<b>模型压缩</b>——量化（GPTQ/AWQ权重量化、W8A8）、蒸馏、剪枝\x20④\x20<b>解码策略</b>——投机解码（小模型起草、大模型批量验证，无损加速）、Medusa\x20多头预测。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“先上哪个？”——先vLLM（continuous\x20batching\x20+\x20PagedAttention\x20开箱即得），再考虑量化；“投机解码为什么无损？”——验证阶段用大模型的分布做接受/拒绝采样，输出分布与原模型一致。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>应用岗到这个水位（知道名词\x20+\x20一句话原理\x20+\x20选型顺序）就够，别硬装Infra\x20深度——被追问\x20CUDA\x20实现会崩。““““““'},{'c':'llm','s':0x3,'lv':'⭐','q':_0x2288d0(0x2a2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(logits/T)：T\x20大→分布变平（更随机多样），T\x20小→更尖锐（更确定），T→0\x20等价贪心。top-k：只在概率最高\x20k\x20个\x20token\x20里采样（固定截断）。<b>top-p（nucleus）</b>：取累积概率达\x20p\x20的最小\x20token\x20集合（动态截断，比\x20top-k\x20自适应）。工程经验：严肃任务（NL2SQL\x20/\x20代码\x20/\x20抽取）T=0~0.3；创作类\x200.7~1.0；<b>别同时激进调\x20T\x20和\x20top-p</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么复读？”——贪心/低温陷入局部最优形成循环，用\x20repetition_penalty\x20或适度提温；“T=0\x20一定可复现吗？”——不完全，浮点非确定性和批处理顺序会引入微小差异。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20用低温\x20+\x20结构约束，是“任务性质决定采样策略”的现成例子。““““““'},{'c':_0x2288d0(0x265),'s':0x3,'lv':'🔥','q':'数值稳定的\x20softmax\x20与\x20logsumexp','a':_0x2288d0(0x1d3)},{'c':_0x2288d0(0x265),'s':0x4,'lv':'🔥','q':_0x2288d0(0x1ba),'a':_0x2288d0(0x209)},{'c':_0x2288d0(0x265),'s':0x4,'lv':'🔥','q':_0x2288d0(0x2e3),'a':_0x2288d0(0x318)},{'c':_0x2288d0(0x265),'s':0x5,'lv':'🔥','q':_0x2288d0(0x1ef),'a':_0x2288d0(0x38b)},{'c':_0x2288d0(0x265),'s':0x5,'lv':'🔥','q':'为什么主流是\x20Decoder-only？','a':_0x2288d0(0x274)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x2288d0(0x344),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x2288d0(0x265),'s':0x5,'lv':'💎','q':_0x2288d0(0x1c1),'a':_0x2288d0(0x2da)},{'c':_0x2288d0(0x265),'s':0x5,'lv':'🔥','q':_0x2288d0(0x2a7),'a':_0x2288d0(0x2a9)},{'c':_0x2288d0(0x265),'s':0x6,'lv':'⭐','q':_0x2288d0(0x2ea),'a':_0x2288d0(0x40d)},{'c':'llm','s':0x6,'lv':'🔥','q':_0x2288d0(0x27c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':_0x2288d0(0x265),'s':0x7,'lv':'⭐','q':_0x2288d0(0x3de),'a':_0x2288d0(0x21d)},{'c':'llm','s':0x7,'lv':'🔥','q':'怎么判断模型“知不知道自己不知道”？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x2288d0(0x265),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>不更新任何参数，只在\x20prompt\x20里给示例，模型就能完成新任务——GPT-3\x20的核心发现。主流解释（面试够用）：预训练中见过海量“任务-示例-答案”结构，模型学会了在上下文中做<b>模式补全\x20/\x20隐式贝叶斯任务推断</b>；也有研究认为注意力可以实现类似梯度下降的隐式优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“示例怎么选影响大吗？”——非常大：数量（3-5个通常够）、<b>格式一致性</b>（比内容正确性影响更大）、顺序（近端示例影响更强）、与query\x20的相似度（检索式选例更优）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目把\x20SQL\x20示例入库、按\x20query\x20检索注入，就是“检索式\x20few-shot\x20选例”的工程实现——这是\x20ICL\x20原理的直接应用。““““““'},{'c':'llm','s':0x7,'lv':'💎','q':_0x2288d0(0x371),'a':_0x2288d0(0x1b4)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x2288d0(0x31d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>马尔可夫决策过程\x20MDP\x20=\x20⟨S,\x20A,\x20P,\x20R,\x20γ⟩：状态空间、动作空间、状态转移概率、奖励函数、折扣因子。<b>马尔可夫性</b>：下一状态只依赖当前状态和动作，与更早历史无关。目标：学一个策略\x20π(a|s)\x20最大化<b>期望累积折扣回报</b>\x20G_t\x20=\x20Σ\x20γᵏ\x20r_{t+k}。γ\x20控制远视程度（0只看眼前，接近\x201\x20极度远视）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“RL\x20和监督学习的本质区别？”——监督学习有标准答案（每步都告诉你对不对），RL\x20只有<b>延迟且稀疏的标量奖励</b>，且数据分布由自己的策略决定（非i.i.d.）；“为什么要折扣？”——保证无限期回报收敛，同时表达对时间的偏好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把\x20LLM\x20生成套进这个框架：状态=已生成的上下文，动作=下一个\x20token，奖励=整段回答的人类偏好分——这就是\x20RLHF\x20的建模方式。这句话能一秒证明你不是死记概念。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x2288d0(0x2ca),'a':_0x2288d0(0x37c)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x2288d0(0x2e8),'a':_0x2288d0(0x415)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x2288d0(0x32e)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x2288d0(0x35a),'a':_0x2288d0(0x1fa)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x2288d0(0x280),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':_0x2288d0(0x2d4)},{'c':'rl','s':0x3,'lv':'⭐','q':'DPO：怎么把\x20RL\x20问题变成监督学习','a':_0x2288d0(0x255)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x2288d0(0x363),'a':_0x2288d0(0x32a)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x2288d0(0x311),'a':_0x2288d0(0x254)},{'c':'rl','s':0x3,'lv':'💎','q':_0x2288d0(0x391),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x2288d0(0x225),'a':_0x2288d0(0x374)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x2288d0(0x1c6),'a':_0x2288d0(0x20d)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x2288d0(0x1ed),'a':_0x2288d0(0x3d2)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x2288d0(0x399)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':_0x2288d0(0x2a1)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x2288d0(0x1a2),'a':_0x2288d0(0x3be)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':_0x2288d0(0x261)},{'c':'pt','s':0x1,'lv':'⭐','q':'LoRA：低秩假设到底在假设什么？','a':_0x2288d0(0x1b6)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x2288d0(0x1b9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x2288d0(0x1ac),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x2288d0(0x40b),'a':_0x2288d0(0x393)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x2288d0(0x23e),'a':_0x2288d0(0x269)},{'c':'pt','s':0x1,'lv':'💎','q':_0x2288d0(0x228),'a':_0x2288d0(0x3b5)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x2288d0(0x356),'a':_0x2288d0(0x2e7)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x2288d0(0x3b9),'a':_0x2288d0(0x1cc)},{'c':'pt','s':0x2,'lv':'💎','q':'完整后训练流水线：一个真实项目会怎么排','a':_0x2288d0(0x27e)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':_0x2288d0(0x2c7)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':_0x2288d0(0x242)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x2288d0(0x1ca),'a':_0x2288d0(0x419)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x2288d0(0x3bb),'a':_0x2288d0(0x32c)},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x2288d0(0x310)},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x2288d0(0x1c5)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x2288d0(0x3d9),'a':_0x2288d0(0x1d6)},{'c':_0x2288d0(0x365),'s':0x0,'lv':'⭐','q':_0x2288d0(0x303),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':_0x2288d0(0x365),'s':0x0,'lv':'⭐','q':_0x2288d0(0x2d8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x2288d0(0x365),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x2288d0(0x3a9)},{'c':_0x2288d0(0x365),'s':0x1,'lv':'🔥','q':'为什么要混合检索（向量\x20+\x20BM25）？','a':_0x2288d0(0x35d)},{'c':_0x2288d0(0x365),'s':0x1,'lv':'⭐','q':_0x2288d0(0x3e9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x2288d0(0x365),'s':0x2,'lv':'🔥','q':_0x2288d0(0x268),'a':_0x2288d0(0x324)},{'c':_0x2288d0(0x365),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x2288d0(0x3eb)},{'c':_0x2288d0(0x365),'s':0x3,'lv':'🔥','q':_0x2288d0(0x401),'a':_0x2288d0(0x3f2)},{'c':_0x2288d0(0x365),'s':0x3,'lv':'💎','q':_0x2288d0(0x33e),'a':_0x2288d0(0x26e)},{'c':_0x2288d0(0x365),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':_0x2288d0(0x20e)},{'c':_0x2288d0(0x365),'s':0x4,'lv':'⭐','q':'ReAct：Reason\x20+\x20Act\x20模式讲清楚','a':_0x2288d0(0x3f7)},{'c':_0x2288d0(0x365),'s':0x4,'lv':'🔥','q':'Plan-and-Execute\x20vs\x20ReAct：怎么选？','a':_0x2288d0(0x394)},{'c':_0x2288d0(0x365),'s':0x4,'lv':'🔥','q':_0x2288d0(0x227),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':'app','s':0x5,'lv':'🔥','q':_0x2288d0(0x2f1),'a':_0x2288d0(0x397)},{'c':_0x2288d0(0x365),'s':0x5,'lv':'💎','q':_0x2288d0(0x246),'a':_0x2288d0(0x22d)},{'c':_0x2288d0(0x365),'s':0x6,'lv':'⭐','q':_0x2288d0(0x3c8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x2288d0(0x365),'s':0x6,'lv':'⭐','q':_0x2288d0(0x1a1),'a':_0x2288d0(0x3f3)},{'c':_0x2288d0(0x365),'s':0x6,'lv':'🔥','q':_0x2288d0(0x281),'a':_0x2288d0(0x416)},{'c':'app','s':0x6,'lv':'💎','q':_0x2288d0(0x275),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':'app','s':0x7,'lv':'⭐','q':_0x2288d0(0x2c4),'a':_0x2288d0(0x222)},{'c':_0x2288d0(0x365),'s':0x7,'lv':'🔥','q':_0x2288d0(0x330),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':_0x2288d0(0x365),'s':0x7,'lv':'⭐','q':'可执行率\x20vs\x20正确率：评估口径必须讲清','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':_0x2288d0(0x365),'s':0x7,'lv':'🔥','q':_0x2288d0(0x2c5),'a':_0x2288d0(0x201)},{'c':_0x2288d0(0x365),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x2288d0(0x22e)},{'c':_0x2288d0(0x1ab),'s':0x0,'lv':'⭐','q':_0x2288d0(0x2cf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':_0x2288d0(0x1ab),'s':0x0,'lv':'⭐','q':'asyncio：协程、事件循环、常见坑','a':_0x2288d0(0x29d)},{'c':_0x2288d0(0x1ab),'s':0x0,'lv':'🔥','q':_0x2288d0(0x21e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>装饰器</b>本质是“函数包装函数”，@dec\x20等价于\x20f\x20=\x20dec(f)。带参数的装饰器是三层结构（参数层\x20→\x20装饰器层\x20→\x20wrapper\x20层），务必加\x20<b>functools.wraps</b>\x20保留原函数元信息。其他高频：<b>生成器</b>（yield，惰性求值省内存，处理大文件/流式响应必用）、<b>上下文管理器</b>（with\x20/\x20__enter__\x20__exit__，资源确保释放）、<b>深浅拷贝</b>（浅拷贝只复制容器、嵌套对象仍共享）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“默认参数用可变对象的坑？”——def\x20f(x=[])\x20所有调用共享同一个\x20list，经典\x20bug；“生成器和列表的区别？”——生成器不一次性占内存，适合流式；<b>LLM\x20流式输出（SSE）本质就是生成器</b>。“““'},{'c':_0x2288d0(0x1ab),'s':0x1,'lv':'⭐','q':_0x2288d0(0x283),'a':_0x2288d0(0x377
