<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

,'lv':'⭐','q':_0x5c4793(0x220),'a':_0x5c4793(0x262)},{'c':'code','s':0x2,'lv':'⭐','q':_0x5c4793(0x304),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':_0x5c4793(0x271),'s':0x2,'lv':'🔥','q':_0x5c4793(0x1ea),'a':_0x5c4793(0x3ee)},{'c':_0x5c4793(0x271),'s':0x2,'lv':'🔥','q':_0x5c4793(0x449),'a':_0x5c4793(0x2c8)},{'c':_0x5c4793(0x271),'s':0x3,'lv':'⭐','q':_0x5c4793(0x43e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':_0x5c4793(0x271),'s':0x3,'lv':'🔥','q':_0x5c4793(0x30a),'a':_0x5c4793(0x44d)},{'c':_0x5c4793(0x271),'s':0x3,'lv':'🔥','q':'前缀和、差分与哈希优化','a':_0x5c4793(0x3c1)},{'c':_0x5c4793(0x271),'s':0x3,'lv':'🔥','q':_0x5c4793(0x33f),'a':_0x5c4793(0x420)},{'c':_0x5c4793(0x271),'s':0x4,'lv':'⭐','q':_0x5c4793(0x3f6),'a':_0x5c4793(0x41d)},{'c':_0x5c4793(0x271),'s':0x4,'lv':'🔥','q':_0x5c4793(0x3ff),'a':_0x5c4793(0x274)},{'c':_0x5c4793(0x271),'s':0x5,'lv':'🔥','q':'手写线程安全队列与限流器','a':_0x5c4793(0x3a8)},{'c':_0x5c4793(0x271),'s':0x5,'lv':'💎','q':'刷题策略：时间有限该怎么刷','a':_0x5c4793(0x3ce)},{'c':'ml','s':0x0,'lv':'⭐','q':'反向传播的本质是什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x5c4793(0x290),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x5c4793(0x211),'a':_0x5c4793(0x327)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5c4793(0x32d),'a':_0x5c4793(0x410)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5c4793(0x432),'a':_0x5c4793(0x1e9)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5c4793(0x3d6),'a':_0x5c4793(0x314)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x5c4793(0x391),'a':_0x5c4793(0x447)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x5c4793(0x429),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ReLU</b>：max(0,x)，快但负区梯度为零（神经元死亡）。<b>GELU</b>：x·Φ(x)，平滑版\x20ReLU，BERT/GPT\x20系用。<b>SiLU/Swish</b>：x·sigmoid(x)，平滑且有轻微负值。<b>SwiGLU</b>（现代\x20LLM\x20FFN\x20标配）：FFN(x)\x20=\x20(xW₁\x20⊙\x20SiLU(xW₃))W₂——<b>门控机制引入乘性交互</b>，表达能力更强；代价是多一个投影矩阵，所以通常把中间维度调小以保持参数量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么门控有效？”——乘性交互让网络能表达“条件性通过”，比纯加性变换表达力更强，实验上稳定优于\x20ReLU/GELU；“为什么\x20FFN\x20中间维度是\x208/3\x20倍而不是\x204\x20倍？”——正是为了在加了第三个矩阵后保持总参数量不变。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x5c4793(0x27b)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5c4793(0x34c),'a':_0x5c4793(0x42d)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5c4793(0x210),'a':_0x5c4793(0x2fc)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5c4793(0x2a9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':'偏差-方差权衡，以及它在大模型时代的变化','a':_0x5c4793(0x41c)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5c4793(0x238),'a':_0x5c4793(0x2d8)},{'c':'ml','s':0x2,'lv':'💎','q':_0x5c4793(0x31f),'a':_0x5c4793(0x330)},{'c':'ml','s':0x3,'lv':'⭐','q':'数据并行\x20/\x20张量并行\x20/\x20流水线并行\x20/\x20ZeRO','a':_0x5c4793(0x2a3)},{'c':'ml','s':0x3,'lv':'⭐','q':'训练显存都花在哪了？（能算这笔账就赢一半）','a':_0x5c4793(0x212)},{'c':'ml','s':0x3,'lv':'💎','q':_0x5c4793(0x2fa),'a':_0x5c4793(0x2f7)},{'c':_0x5c4793(0x43c),'s':0x0,'lv':'⭐','q':_0x5c4793(0x2e8),'a':_0x5c4793(0x2f1)},{'c':_0x5c4793(0x43c),'s':0x0,'lv':'⭐','q':'为什么需要多头注意力（Multi-Head）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':'llm','s':0x0,'lv':'🔥','q':_0x5c4793(0x365),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>瓶颈是\x20<b>KV\x20Cache\x20的显存与访存带宽</b>，不是计算。MHA：Q/K/V\x20头数相同（32\x20头），Cache\x20最大。MQA：所有\x20Q\x20头共享1\x20组\x20K/V，Cache\x20缩到\x201/32，但质量掉得明显。<b>GQA</b>：折中——Q\x20头分组、组内共享\x20K/V（32\x20Q\x20头配\x208\x20KV\x20头），Cache\x20缩\x204\x20倍、质量几乎无损，所以成为工业标准（Llama-2/3-70B、Qwen2\x20全系）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“更进一步呢？”——DeepSeek\x20的\x20MLA\x20用低秩投影压缩\x20KV，压缩率更高且质量更好；“为什么不是压计算？”——decode\x20阶段是访存瓶颈（memory-bound），省访存才是省时间。““““““'},{'c':'llm','s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>不是近似算法，是精确注意力的\x20IO\x20感知实现。</b>痛点：标准实现把\x20n×n\x20注意力矩阵写进\x20HBM（显存）再读回，瓶颈在访存不在算力。做法：<b>tiling\x20分块</b>\x20+\x20在\x20SRAM（片上高速缓存）里用\x20<b>online\x20softmax</b>\x20增量归一化，全程不实例化完整注意力矩阵。收益：显存\x20O(n²)→O(n)，速度快数倍。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“online\x20softmax\x20怎么做的？”——边遍历边维护\x20running\x20max\x20和\x20running\x20sum，用缩放因子修正之前的部分和；“v2/v3\x20改了什么？”——v2\x20优化并行划分减少非矩阵运算，v3\x20用满\x20Hopper\x20的异步拷贝与\x20FP8。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说它“降低了计算复杂度”是错的——复杂度还是\x20O(n²)，降的是访存。““““““'},{'c':_0x5c4793(0x43c),'s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':_0x5c4793(0x21d)},{'c':_0x5c4793(0x43c),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':'llm','s':0x1,'lv':'🔥','q':_0x5c4793(0x39d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>实验现象：模型对长上下文<b>开头和结尾</b>的信息利用最好，中间的容易被忽略，形成\x20U\x20形曲线。工程对策：①\x20关键信息放两端\x20②\x20RAG\x20时把rerank\x20后最相关的\x20chunk\x20放首尾\x20③\x20控制上下文长度，别以为塞得多就答得好——噪声会稀释注意力\x20④\x20长文档先摘要再定位。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“成因？”——因果注意力的位置偏置+\x20训练数据里重要信息常在首尾的分布先验；“怎么验证？”——自己造\x20needle\x20测试，把答案埋在不同深度看召回。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这是\x20RAG\x20里的真实踩坑点，讲出来直接证明你调过效果、不是只跑通demo。““““““'},{'c':'llm','s':0x2,'lv':'⭐','q':_0x5c4793(0x382),'a':_0x5c4793(0x33c)},{'c':_0x5c4793(0x43c),'s':0x2,'lv':'⭐','q':'参数量与显存估算（必考口算）','a':_0x5c4793(0x269)},{'c':_0x5c4793(0x43c),'s':0x2,'lv':'💎','q':'推理加速手段速览（应用岗水位）','a':_0x5c4793(0x392)},{'c':'llm','s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':_0x5c4793(0x375)},{'c':_0x5c4793(0x43c),'s':0x3,'lv':'🔥','q':_0x5c4793(0x225),'a':_0x5c4793(0x285)},{'c':_0x5c4793(0x43c),'s':0x4,'lv':'🔥','q':_0x5c4793(0x3bf),'a':_0x5c4793(0x229)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x5c4793(0x26a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':_0x5c4793(0x43c),'s':0x5,'lv':'🔥','q':_0x5c4793(0x2ab),'a':_0x5c4793(0x2d4)},{'c':_0x5c4793(0x43c),'s':0x5,'lv':'🔥','q':_0x5c4793(0x442),'a':_0x5c4793(0x421)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x5c4793(0x364),'a':_0x5c4793(0x34f)},{'c':_0x5c4793(0x43c),'s':0x5,'lv':'💎','q':_0x5c4793(0x324),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x5c4793(0x360),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x5c4793(0x43c),'s':0x6,'lv':'⭐','q':'推理模型（R1\x20/\x20o1）与普通模型的本质区别','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':_0x5c4793(0x43c),'s':0x6,'lv':'🔥','q':_0x5c4793(0x247),'a':_0x5c4793(0x37d)},{'c':_0x5c4793(0x43c),'s':0x7,'lv':'⭐','q':'幻觉的成因与全链路缓解手段','a':_0x5c4793(0x2ae)},{'c':_0x5c4793(0x43c),'s':0x7,'lv':'🔥','q':_0x5c4793(0x23e),'a':_0x5c4793(0x3fc)},{'c':_0x5c4793(0x43c),'s':0x7,'lv':'🔥','q':_0x5c4793(0x448),'a':_0x5c4793(0x25d)},{'c':_0x5c4793(0x43c),'s':0x7,'lv':'💎','q':'涌现能力（Emergent\x20Abilities）与它的争议','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x5c4793(0x3b1)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5c4793(0x317),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x5c4793(0x1f6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Q-learning：用贝尔曼最优方程做<b>时序差分</b>更新，Q(s,a)\x20←\x20Q(s,a)\x20+\x20α[r\x20+\x20γ\x20max_a\x27\x20Q(s\x27,a\x27)\x20−\x20Q(s,a)]，学到\x20Q\x20后贪心取\x20argmax\x20就是最优策略。它是\x20<b>off-policy</b>的（更新用\x20max，与实际采样策略无关），所以能用经验回放。<b>DQN</b>\x20三个关键工程技巧：①\x20神经网络近似\x20Q\x20②\x20<b>经验回放池</b>打破样本相关性\x20③\x20<b>目标网络</b>（延迟更新的\x20Q\x20副本）稳定\x20TD\x20目标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么需要目标网络？”——不然是“用自己预测自己”，目标随参数一起动会震荡甚至发散；“局限？”——只适合<b>离散动作</b>，连续/高维动作空间要用策略方法。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>游戏AI\x20的经典入口（Atari、棋牌类离散动作）——腾讯游戏算法场景可以从这里切入讲。““““““'},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x5c4793(0x3e9)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5c4793(0x240),'a':_0x5c4793(0x3c4)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5c4793(0x30f),'a':_0x5c4793(0x2af)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x5c4793(0x321),'a':_0x5c4793(0x3a7)},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':_0x5c4793(0x341)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5c4793(0x23a),'a':_0x5c4793(0x31e)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5c4793(0x398),'a':_0x5c4793(0x38c)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x5c4793(0x3a5),'a':_0x5c4793(0x42e)},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':_0x5c4793(0x280)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5c4793(0x419),'a':_0x5c4793(0x1f3)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5c4793(0x3d1),'a':_0x5c4793(0x329)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5c4793(0x3d4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5c4793(0x25c),'a':_0x5c4793(0x315)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5c4793(0x2e5),'a':_0x5c4793(0x267)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':_0x5c4793(0x422)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':'LoRA：低秩假设到底在假设什么？','a':_0x5c4793(0x214)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x5c4793(0x232),'a':_0x5c4793(0x2f4)},{'c':'pt','s':0x1,'lv':'🔥','q':'LoRA的\x20rank\x20和\x20alpha\x20怎么定？','a':_0x5c4793(0x2f0)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5c4793(0x43b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5c4793(0x286),'a':_0x5c4793(0x345)},{'c':'pt','s':0x1,'lv':'💎','q':_0x5c4793(0x246),'a':_0x5c4793(0x3dc)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x5c4793(0x2e7),'a':_0x5c4793(0x33b)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5c4793(0x2f2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x5c4793(0x418),'a':_0x5c4793(0x253)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5c4793(0x44b),'a':_0x5c4793(0x367)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5c4793(0x242),'a':_0x5c4793(0x2a6)},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x5c4793(0x3d2)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5c4793(0x2c4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>通用</b>：MMLU/CMMLU/C-Eval（知识问答）。<b>代码</b>：HumanEval/MBPP（pass@k）。<b>推理</b>：GSM8K/MATH。<b>对话</b>：MT-Bench、AlpacaEval（LLM\x20裁判\x20+\x20人类偏好）。<b>长文本</b>：needle-in-haystack、RULER。<b>陷阱</b>：①\x20<b>数据污染</b>——基准题进了训练集，跑分虚高（要做去污染检查）②\x20<b>刷榜≠好用</b>——针对基准优化的模型在真实业务上未必强③\x20单一指标掩盖问题（平均分高但某类任务崩）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么检查污染？”——n-gram\x20重叠检测、基准题的困惑度异常低是信号；“更可信的做法？”——<b>自建贴合业务的私有评测集</b>，这是工业界的共识。“““““'},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x5c4793(0x266)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5c4793(0x2b7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x5c4793(0x32e),'s':0x0,'lv':'⭐','q':_0x5c4793(0x385),'a':_0x5c4793(0x36e)},{'c':'app','s':0x0,'lv':'⭐','q':_0x5c4793(0x2fb),'a':_0x5c4793(0x24a)},{'c':_0x5c4793(0x32e),'s':0x1,'lv':'⭐','q':_0x5c4793(0x1ee),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':'app','s':0x1,'lv':'🔥','q':_0x5c4793(0x244),'a':_0x5c4793(0x3c7)},{'c':_0x5c4793(0x32e),'s':0x1,'lv':'⭐','q':_0x5c4793(0x3b0),'a':_0x5c4793(0x24c)},{'c':_0x5c4793(0x32e),'s':0x2,'lv':'🔥','q':_0x5c4793(0x2b0),'a':_0x5c4793(0x296)},{'c':_0x5c4793(0x32e),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x5c4793(0x2a0)},{'c':'app','s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x5c4793(0x292)},{'c':'app','s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':_0x5c4793(0x3d0)},{'c':_0x5c4793(0x32e),'s':0x4,'lv':'⭐','q':_0x5c4793(0x243),'a':_0x5c4793(0x3f8)},{'c':'app','s':0x4,'lv':'⭐','q':'ReAct：Reason\x20+\x20Act\x20模式讲清楚','a':_0x5c4793(0x3d9)},{'c':_0x5c4793(0x32e),'s':0x4,'lv':'🔥','q':'Plan-and-Execute\x20vs\x20ReAct：怎么选？','a':_0x5c4793(0x334)},{'c':'app','s':0x4,'lv':'🔥','q':_0x5c4793(0x2d9),'a':_0x5c4793(0x440)},{'c':_0x5c4793(0x32e),'s':0x5,'lv':'🔥','q':_0x5c4793(0x2f3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':'app','s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':_0x5c4793(0x1e8)},{'c':'app','s':0x6,'lv':'⭐','q':_0x5c4793(0x294),'a':_0x5c4793(0x303)},{'c':'app','s':0x6,'lv':'⭐','q':_0x5c4793(0x207),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span
