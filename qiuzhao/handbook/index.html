<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':'反向传播的本质是什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':'梯度消失\x20/\x20爆炸：成因与五种对策','a':_0x521587(0x3cc)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x521587(0x1f6),'a':_0x521587(0x256)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x521587(0x260),'a':_0x521587(0x3ed)},{'c':'ml','s':0x0,'lv':'🔥','q':'混合精度训练：fp16\x20vs\x20bf16','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省显存加速，<b>权重主副本和优化器状态保\x20fp32</b>\x20保精度。<b>fp16</b>：尾数多、动态范围小\x20→\x20易上溢/下溢，必须配\x20<b>loss\x20scaling</b>（放大\x20loss\x20让小梯度不被舍入吃掉）。<b>bf16</b>：指数位与\x20fp32\x20相同（动态范围一样大）、尾数少\x20→\x20<b>基本不溢出、免\x20loss\x20scaling</b>，是当前大模型训练主流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“精度低了效果会掉吗？”——训练几乎无损（因为主副本是\x20fp32）；“fp8\x20呢？”——H100\x20起支持，训练已有实践，但需要更精细的缩放策略。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x521587(0x2c6),'a':_0x521587(0x2af)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x521587(0x220),'a':_0x521587(0x341)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x521587(0x3f7),'a':_0x521587(0x269)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>全零\x20→\x20所有神经元完全对称、收到相同梯度，永远学不出差异（对称性破坏失败）。<b>Xavier</b>：方差\x202/(fan_in+fan_out)，适配\x20tanh/sigmoid，保持前向后向方差稳定。<b>He</b>：方差\x202/fan_in，适配\x20ReLU\x20族——因为\x20ReLU\x20砍掉一半输出，方差要加倍补偿。大模型语境：初始化尺度还要按<b>深度缩放</b>（如输出投影按\x201/√(2N)\x20缩小），否则深层残差累积会让激活爆炸。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“初始化不当的症状？”——开局\x20loss\x20异常大或\x20NaN、或者\x20loss\x20长期不动；“为什么\x20LoRA\x20的\x20B\x20可以初始化为零？”——因为\x20A\x20是随机的，A·B\x20整体不为对称零，且这样保证起点\x20ΔW=0。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x521587(0x327),'a':_0x521587(0x39c)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x521587(0x380),'a':_0x521587(0x3d9)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x521587(0x366),'a':_0x521587(0x39a)},{'c':'ml','s':0x2,'lv':'🔥','q':'偏差-方差权衡，以及它在大模型时代的变化','a':_0x521587(0x223)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x521587(0x259),'a':_0x521587(0x1c3)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x521587(0x1b2)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x521587(0x278),'a':_0x521587(0x32f)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x521587(0x230),'a':_0x521587(0x2b0)},{'c':'ml','s':0x3,'lv':'💎','q':_0x521587(0x284),'a':_0x521587(0x3e5)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x521587(0x22b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x521587(0x31f),'s':0x0,'lv':'⭐','q':_0x521587(0x33d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x521587(0x31f),'s':0x0,'lv':'🔥','q':_0x521587(0x3e7),'a':_0x521587(0x38c)},{'c':_0x521587(0x31f),'s':0x0,'lv':'🔥','q':_0x521587(0x400),'a':_0x521587(0x326)},{'c':_0x521587(0x31f),'s':0x1,'lv':'⭐','q':_0x521587(0x30d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x521587(0x31f),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x521587(0x31f),'s':0x1,'lv':'🔥','q':_0x521587(0x3da),'a':_0x521587(0x3dd)},{'c':_0x521587(0x31f),'s':0x2,'lv':'⭐','q':_0x521587(0x3b8),'a':_0x521587(0x33c)},{'c':_0x521587(0x31f),'s':0x2,'lv':'⭐','q':_0x521587(0x22a),'a':_0x521587(0x291)},{'c':'llm','s':0x2,'lv':'💎','q':_0x521587(0x1db),'a':_0x521587(0x202)},{'c':_0x521587(0x31f),'s':0x3,'lv':'⭐','q':_0x521587(0x38a),'a':_0x521587(0x344)},{'c':_0x521587(0x31f),'s':0x3,'lv':'🔥','q':_0x521587(0x424),'a':_0x521587(0x3a4)},{'c':'llm','s':0x4,'lv':'🔥','q':'BPE\x20分词：原理与它带来的后遗症','a':_0x521587(0x369)},{'c':_0x521587(0x31f),'s':0x4,'lv':'🔥','q':_0x521587(0x209),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':_0x521587(0x31f),'s':0x5,'lv':'🔥','q':_0x521587(0x397),'a':_0x521587(0x2e9)},{'c':_0x521587(0x31f),'s':0x5,'lv':'🔥','q':'为什么主流是\x20Decoder-only？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x521587(0x3c0),'a':_0x521587(0x20d)},{'c':'llm','s':0x5,'lv':'💎','q':_0x521587(0x287),'a':_0x521587(0x238)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x521587(0x1cd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x521587(0x31f),'s':0x6,'lv':'⭐','q':_0x521587(0x2bf),'a':_0x521587(0x237)},{'c':'llm','s':0x6,'lv':'🔥','q':_0x521587(0x1f2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':_0x521587(0x31f),'s':0x7,'lv':'⭐','q':_0x521587(0x37a),'a':_0x521587(0x3fd)},{'c':_0x521587(0x31f),'s':0x7,'lv':'🔥','q':_0x521587(0x355),'a':_0x521587(0x3c4)},{'c':_0x521587(0x31f),'s':0x7,'lv':'🔥','q':_0x521587(0x1e4),'a':_0x521587(0x1ce)},{'c':_0x521587(0x31f),'s':0x7,'lv':'💎','q':_0x521587(0x349),'a':_0x521587(0x1d9)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x521587(0x3a8),'a':_0x521587(0x236)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x521587(0x20a),'a':_0x521587(0x224)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x521587(0x27e),'a':_0x521587(0x38d)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x521587(0x3a5),'a':_0x521587(0x34a)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x521587(0x3d4),'a':_0x521587(0x1f3)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x521587(0x374),'a':_0x521587(0x36a)},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':_0x521587(0x3d1)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x521587(0x265),'a':_0x521587(0x2d1)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x521587(0x340),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':_0x521587(0x1be),'a':_0x521587(0x384)},{'c':'rl','s':0x3,'lv':'💎','q':_0x521587(0x2b9),'a':_0x521587(0x3e6)},{'c':'rl','s':0x4,'lv':'🔥','q':'奖励塑形与奖励黑客（游戏\x20RL\x20的核心难题）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':_0x521587(0x23b)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x521587(0x388),'a':_0x521587(0x3a6)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x521587(0x277),'a':_0x521587(0x2f1)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x521587(0x1ec),'a':_0x521587(0x417)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x521587(0x28b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':_0x521587(0x1dc)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x521587(0x27b),'a':_0x521587(0x34c)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x521587(0x319),'a':_0x521587(0x395)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x521587(0x33e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x521587(0x3b5),'a':_0x521587(0x1eb)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x521587(0x321),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x521587(0x2fb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Adapter</b>：层间插入小瓶颈网络——有效但增加推理延迟（不能合并）。<b>Prefix/Prompt\x20Tuning</b>：只训一小段可学习的虚拟token\x20前缀——参数极少但占用上下文长度、效果不稳。<b>LoRA</b>：低秩旁路，可合并零延迟——事实标准。<b>DoRA</b>：把\x20ΔW\x20分解为幅度和方向分别学习，效果优于\x20LoRA\x20且同样可合并。<b>AdaLoRA</b>：动态给不同层分配不同\x20rank。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20LoRA\x20赢了？”——可合并（零推理开销）+\x20效果接近全量\x20+\x20实现简单\x20+\x20可热插拔，四点齐备。“““““'},{'c':'pt','s':0x2,'lv':'⭐','q':_0x521587(0x35d),'a':_0x521587(0x2f5)},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x521587(0x386)},{'c':'pt','s':0x2,'lv':'💎','q':_0x521587(0x3c1),'a':_0x521587(0x2d7)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x521587(0x37b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x521587(0x34b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x521587(0x2b7),'a':_0x521587(0x26c)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x521587(0x365),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x521587(0x3df),'a':_0x521587(0x248)},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x521587(0x23f)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x521587(0x225),'a':_0x521587(0x2ad)},{'c':_0x521587(0x2f4),'s':0x0,'lv':'⭐','q':_0x521587(0x415),'a':_0x521587(0x26e)},{'c':'app','s':0x0,'lv':'⭐','q':_0x521587(0x270),'a':_0x521587(0x1d5)},{'c':'app','s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x521587(0x3af)},{'c':_0x521587(0x2f4),'s':0x1,'lv':'🔥','q':_0x521587(0x204),'a':_0x521587(0x3ea)},{'c':_0x521587(0x2f4),'s':0x1,'lv':'⭐','q':_0x521587(0x3b3),'a':_0x521587(0x403)},{'c':_0x521587(0x2f4),'s':0x2,'lv':'🔥','q':_0x521587(0x40c),'a':_0x521587(0x2ef)},{'c':_0x521587(0x2f4),'s':0x2,'lv':'⭐','q':_0x521587(0x20e),'a':_0x521587(0x25e)},{'c':_0x521587(0x2f4),'s':0x3,'lv':'🔥','q':_0x521587(0x3ae),'a':_0x521587(0x2e7)},{'c':'app','s':0x3,'lv':'💎','q':_0x521587(0x293),'a':_0x521587(0x3a0)},{'c':_0x521587(0x2f4),'s':0x4,'lv':'⭐','q':_0x521587(0x3b4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':'app','s':0x4,'lv':'⭐','q':_0x521587(0x3be),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>让模型交替输出\x20Thought（推理）→\x20Action（调工具）→\x20Observation（结果）→\x20Thought……直到给出答案。价值：“想”和“做”交织，推理过程显式化，工具结果指导下一步——比直接输出答案可靠，比纯\x20CoT\x20多了与世界交互的能力。本质上\x20<b>ReAct\x20=\x20CoT\x20+\x20工具使用</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价？”——多轮调用、延迟高、token\x20贵、可能死循环（必须设\x20max_steps）；“现代框架和它的关系？”——LangGraph\x20等的\x20agent\x20loop\x20本质都是\x20ReAct\x20的工程化封装。““““““'},{'c':_0x521587(0x2f4),'s':0x4,'lv':'🔥','q':_0x521587(0x1a5),'a':_0x521587(0x38f)},{'c':_0x521587(0x2f4),'s':0x4,'lv':'🔥','q':_0x521587(0x1f5),'a':_0x521587(0x37c)},{'c':'app','s':0x5,'lv':'🔥','q':_0x521587(0x2cf),'a':_0x521587(0x302)},{'c':'app','s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':_0x521587(0x379)},{'c':_0x521587(0x2f4),'s':0x6,'lv':'⭐','q':_0x521587(0x416),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x521587(0x2f4),'s':0x6,'lv':'⭐','q':_0x521587(0x1af),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>攻击面：用户输入或<b>检索到的内容</b>里藏指令（“忽略之前的指令……”），模型可能照办——RAG\x20场景里检索内容也是不可信输入。三层防线：<b>输入侧</b>（指令与数据分隔、可疑模式检测）→\x20<b>权限侧</b>（只读账号、最小权限、危险操作人审）→\x20<b>输出侧</b>（动作执行前校验、敏感操作二次确认）。核心认知：<b>prompt\x20层永远防不死，必须权限层兜底。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20SQL\x20注入的异同？”——同属“数据被当指令执行”，防御思路同源：参数化分隔\x20+\x20最小权限。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20的只读账号\x20+\x20LIMIT\x20强制\x20+\x20行列权限，就是权限层防线的现成案例。““““““'},{'c':'app','s':0x6,'lv':'🔥','q':_0x521587(0x342),'a':_0x521587(0x218)},{'c':_0x521587(0x2f4),'s':0x6,'lv':'💎','q':_0x521587(0x3fb),'a':_0x521587(0x24a)},{'c':_0x521587(0x2f4),'s':0x7,'lv':'⭐','q':'NL2SQL\x20的五大难点与解法（主场第一题）','a':_0x521587(0x2a8)},{'c':'app','s':0x7,'lv':'🔥','q':_0x521587(0x39d),'a':_0x521587(0x30e)},{'c':_0x521587(0x2f4),'s':0x7,'lv':'⭐','q':_0x521587(0x1e3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':_0x521587(0x2f4),'s':0x7,'lv':'🔥','q':_0x521587(0x358),'a':_0x521587(0x383)},{'c':'app','s':0x7,'lv':'🔥','q':_0x521587(0x279),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多轮</b>：指代消解（“那上月呢”→\x20补全成完整查询意图）+\x20会话状态显式维护（已选表、时间范围）+\x20历史摘要管理。<b>权限</b>：生成前按用户权限过滤可见\x20schema（行列级）＋\x20只读账号\x20＋\x20LIMIT\x20强制\x20＋\x20危险关键字拦截（DROP/DELETE/UPDATE）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“schema\x20过滤和生成后拦截哪个好？”——都要：生成前过滤减少出错面，生成后拦截兜底，这叫<b>纵深防御</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>和「Prompt\x20Injection」那条连成完整的安全故事：输入防护\x20+\x20权限最小化\x20+\x20输出拦截，三层都真实做过。““““““'},{'c':_0x521587(0x359),'s':0x0,'lv':'⭐','q':_0x521587(0x2c4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':_0x521587(0x359),'s':0x0,'lv':'⭐','q':_0x521587(0x3cf),'a':_0x521587(0x37f)},{'c':_0x521587(0x359),'s':0x0,'lv':'🔥','q':_0x521587(0x333),'a':_0x521587(0x3db)},{'c':_0x521587(0x359),'s':0x1,'lv':'⭐','q':_0x521587(0x3ff),'a':_0x521587(0x3f2)},{'c':_0x521587(0x359),'s':0x1,'lv':'🔥','q':_0x521587(0x407),'a':_0x521587(0x352)},{'c':_0x521587(0x359),'s':0x1,'lv':'🔥','q':_0x521587(0x1f9),'a':_0x521587(0x2ba)},{'c':_0x521587(0x359),'s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':_0x521587(0x258)},{'c':_0x521587(0x359),'s':0x2,'lv':'🔥','q':'幂等性与重试：可靠性的地基','a':_0x521587(0x1fb)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x521587(0x221),'a':_0x521587(0x1bd)},{'c':_0x521587(0x359),'s':0x3,'lv':'🔥','q':_0x521587(0x1e0),'a':_0x521587(0x1fe)},{'c':_0x521587(0x359),'s':0x3,'lv':'🔥','q':_0x521587(0x27c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':_0x521587(0x359),'s':0x4,'lv':'⭐','q':_0x521587(0x339),'a':_0x521587(0x2ec)},{'c':_0x521587(0x359),'s':0x4,'lv':'🔥','q':_0x521587(0x304),'a':_0x521587(0x3fa)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x521587(0x313),'a':_0x521587(0x3e3)},{'c':_0x521587(0x359),'s':0x4,'lv':'💎','q':_0x521587(0x35a),'a':_0x521587(0x215)},{'c':_0x521587(0x359),'s':0x4,'lv':'💎','q':_0x521587(0x263),'a':_0x521587(0x217)},{'c':_0x521587(0x1e8),'s':0x0,'lv':'⭐','q':'60秒自我介绍（电话面\x20/\x20开场用）','a':_0x521587(0x3ac)},{'c':'story','s':0x0,'lv':'⭐','q':_0x521587(0x330),'a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':'story','s':0x1,'lv':'⭐','q':_0x521587(0x1d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>面试官挖项目，本质在问五件事，按这个顺序主动交付：<br>①\x20<b>背景与目标</b>——谁的痛点、为什么值得做、你的角色<br>②\x20<b>难点</b>——技术上最难的\x202-3\x20点（不是“工作量大”，是<b>技术判断难</b>）<br>③\x20<b>权衡</b>——你考虑过哪些方案、为什么选这个、放弃了什么（<b>这一层最能区分候选人</b>）<br>④\x20<b>数据</b>——效果指标\x20+\x20口径\x20+\x20怎么测的<br>⑤\x20<b>复盘</b>——哪里做得不好、如果重做会怎么改<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>大多数候选人只讲\x20①②④，<b>而面试官真正想听的是\x20③\x20和\x20⑤</b>——它们证明你有技术判断力和反思能力，不是执行工具。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“你遇到最大的困难”时，答“数据太少/时间太紧”是废答案；要答<b>技术性困难\x20+\x20你的解法+\x20学到什么</b>。“'},{'c':_0x521587(0x1e8),'s':0x1,'lv':'⭐','q':_0x521587(0x2eb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好答案的三个特征：①难点是<b>技术判断</b>而非体力活②\x20有<b>具体的失败经历</b>（试过什么不行）③\x20有<b>可迁移的认知沉淀</b>。<br>模板：“最难的不是让它跑通，而是<b>让它稳定</b>。跑通只要prompt\x20调对就行，但真实用户的问法千奇百怪。我最开始\x20SQL\x20生成正确率只有\x20X左右，问题集中在字段映射错和口径理解错。我做了三件事：schema\x20裁剪、口径库\x20RAG\x20注入、执行反馈修正循环。<b>这件事让我明白\x20LLM\x20应用的核心工作量不在调用模型，而在给它建好约束与验证机制。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>最后那句<b>认知沉淀</b>是加分核心——它说明你能从具体项目里抽象出方法论。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>如果初期的具体数字你不记得，别编——说“早期版本明显不稳定，主要错在字段映射”比编一个假数字安全得多。“'},{'c':_0x521587(0x1e8),'s':0x2,'lv':'⭐','q':_0x521587(0x2d0),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':'story','s':0x2,'lv':'🔥','q':_0x521587(0x2f9),'a':_0x521587(0x306)},{'c':_0x521587(0x1e8),'s':0x3,'lv':'⭐','q':'OKC-SFT\x20论文标准讲述稿（3\x20分钟版）','a':_0x521587(0x23c)},{'c':_0x521587(0x1e8),'s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':_0x521587(0x3f1)},{'c':'story','s':0x4,'lv':'⭐','q':_0x521587(0x427),'a':_0x521587(0x21a)},{'c':'story','s':0x4,'lv':'⭐','q':'“游戏算法和\x20LLM\x20应用岗有什么关系？”（必问）','a':_0x521587(0x2ed)},{'c':_0x521587(0x1e8),'s':0x5,'lv':'⭐','q':'行为面五问：诚实但有准备的答法','a':_0x521587(0x3eb)},{'c':_0x521587(0x1e8),'s':0x5,'lv':'🔥','q':_0x521587(0x33b),'a':_0x521587(0x309)},{'c':_0x521587(0x1e8),'s':0x5,'lv':'🔥','q':_0x521587(0x367),'a':_0x521587(0x210)},{'c':'plan','s':0x0,'lv':'⭐','q':_0x521587(0x1c0),'a':_0x521587(0x3b2)},{'c':'plan','s':0x0,'lv':'⭐','q':_0x521587(0x329),'a':'<span\x20class=\x27lb\x27>◈\x20五件必做</span><br>①\x20<b>简历改版（最高优先级）</b>：加腾讯实习那一栏（哪怕先写在做的方向和技术栈）；删掉“AI\x20Infra\x20/\x20Post-training”意向、只留“大模型应用研发\x20/\x20LLM\x20Agent”；技能栏删掉“了解\x20vLLM、KV\x20Cache”这类扛不住追问的表述；学生工作压到2\x20行以内。<br>②\x20<b>找\x20mentor\x20谈一次</b>：问清转正HC\x20情况\x20+\x20争取一个能量化的产出（哪怕是内部\x20demo\x20或实验结论）。<br>③\x20<b>目标公司清单</b>：分三档（冲刺\x20/\x20主力\x20/\x20保底）各\x205-8\x20家，查清投递批次和截止时间。<br>④\x20<b>手册第六章刷完一轮</b>（主战场优先）。<br>⑤\x20<b>刷题热身</b>：Hot100\x20里的哈希/双指针/滑窗，每天\x203\x20题。<br><span\x20class=\x27lb\x27>
