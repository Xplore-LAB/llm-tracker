<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x27>◈\x20核心回答（先说四步再写代码）</span><br>①\x20<b>状态定义</b>（dp[i]\x20表示什么，说清楚）②\x20<b>转移方程</b>\x20③\x20<b>初始化与边界</b>\x20④\x20<b>遍历顺序</b>。<b>0-1\x20背包</b>：dp[i][w]=max(不选\x20i,\x20选\x20i)，空间压成一维时<b>容量必须逆序遍历</b>（防同一物品被重复选）。<b>编辑距离（72）</b>：dp[i][j]=word1\x20前\x20i\x20个变成\x20word2\x20前\x20j\x20个的最小操作数；字符相等取\x20dp[i−1][j−1]，否则\x20min(插入,\x20删除,\x20替换)+1。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么想到状态定义？”——从“最后一步怎么来的”倒推；“其他高频？”——最长递增子序列（300，含二分优化\x20O(n\x20log\x20n)）、最长公共子序列、打家劫舍、股票买卖系列。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试时<b>先口述四步再动手写</b>——直接闷头写代码，写错了面试官也不知道你会不会。““'},{'c':'code','s':0x4,'lv':'🔥','q':_0x5ab1cd(0x13d),'a':_0x5ab1cd(0x227)},{'c':_0x5ab1cd(0x1a2),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0x84),'a':_0x5ab1cd(0xf6)},{'c':_0x5ab1cd(0x1a2),'s':0x5,'lv':'💎','q':_0x5ab1cd(0x128),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条原则：①\x20<b>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x5ab1cd(0xd9),'a':_0x5ab1cd(0x238)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x1d8),'a':_0x5ab1cd(0x1b0)},{'c':'ml','s':0x0,'lv':'⭐','q':'Adam\x20为什么有效？显存代价是多少？','a':_0x5ab1cd(0x24b)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x150),'a':_0x5ab1cd(0x231)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x1e2),'a':_0x5ab1cd(0xc6)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x2b8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':'LayerNorm\x20vs\x20BatchNorm：为什么\x20Transformer\x20用\x20LN','a':_0x5ab1cd(0x208)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x268),'a':_0x5ab1cd(0xa8)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x2c9),'a':_0x5ab1cd(0x10d)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x5ab1cd(0x164),'a':_0x5ab1cd(0x8f)},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>信号：训练\x20loss\x20持续降但<b>验证\x20loss\x20转升</b>；训练集指标远好于测试集；模型开始复述训练样本。对策按大模型语境的性价比排序：①\x20<b>更多/更干净的数据</b>（永远最有效）②\x20<b>早停</b>——监控验证集，SFT\x20里\x20epoch\x20设\x202~3\x20就是经验性防过拟合\x20③\x20<b>用\x20LoRA\x20限制可训练参数量</b>（小数据尤其有效）④\x20weight\x20decay\x20/\x20dropout\x20⑤\x20数据混合与多任务。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“小数据微调怎么防？”——LoRA\x20+\x20小\x20r\x20+\x20少\x20epoch\x20+\x20早停\x20+\x20掺通用数据，四件套；<b>你的\x20611\x20条数据场景正好适用这套组合，被问“数据这么少怎么保证不过拟合”时按这个答。</b>““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x266),'a':_0x5ab1cd(0x260)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x21c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x5ab1cd(0xd7),'a':_0x5ab1cd(0x28e)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x5ab1cd(0x143)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x17c),'a':_0x5ab1cd(0x27e)},{'c':'ml','s':0x3,'lv':'⭐','q':'训练显存都花在哪了？（能算这笔账就赢一半）','a':_0x5ab1cd(0x257)},{'c':'ml','s':0x3,'lv':'💎','q':_0x5ab1cd(0x89),'a':_0x5ab1cd(0x108)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x1fd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x5ab1cd(0x141),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0x180),'a':_0x5ab1cd(0x223)},{'c':_0x5ab1cd(0x141),'s':0x0,'lv':'🔥','q':_0x5ab1cd(0xf3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>瓶颈是\x20<b>KV\x20Cache\x20的显存与访存带宽</b>，不是计算。MHA：Q/K/V\x20头数相同（32\x20头），Cache\x20最大。MQA：所有\x20Q\x20头共享1\x20组\x20K/V，Cache\x20缩到\x201/32，但质量掉得明显。<b>GQA</b>：折中——Q\x20头分组、组内共享\x20K/V（32\x20Q\x20头配\x208\x20KV\x20头），Cache\x20缩\x204\x20倍、质量几乎无损，所以成为工业标准（Llama-2/3-70B、Qwen2\x20全系）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“更进一步呢？”——DeepSeek\x20的\x20MLA\x20用低秩投影压缩\x20KV，压缩率更高且质量更好；“为什么不是压计算？”——decode\x20阶段是访存瓶颈（memory-bound），省访存才是省时间。““““““'},{'c':'llm','s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>不是近似算法，是精确注意力的\x20IO\x20感知实现。</b>痛点：标准实现把\x20n×n\x20注意力矩阵写进\x20HBM（显存）再读回，瓶颈在访存不在算力。做法：<b>tiling\x20分块</b>\x20+\x20在\x20SRAM（片上高速缓存）里用\x20<b>online\x20softmax</b>\x20增量归一化，全程不实例化完整注意力矩阵。收益：显存\x20O(n²)→O(n)，速度快数倍。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“online\x20softmax\x20怎么做的？”——边遍历边维护\x20running\x20max\x20和\x20running\x20sum，用缩放因子修正之前的部分和；“v2/v3\x20改了什么？”——v2\x20优化并行划分减少非矩阵运算，v3\x20用满\x20Hopper\x20的异步拷贝与\x20FP8。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说它“降低了计算复杂度”是错的——复杂度还是\x20O(n²)，降的是访存。““““““'},{'c':_0x5ab1cd(0x141),'s':0x1,'lv':'⭐','q':_0x5ab1cd(0x7c),'a':_0x5ab1cd(0x253)},{'c':_0x5ab1cd(0x141),'s':0x1,'lv':'🔥','q':'长上下文怎么扩？PI\x20/\x20NTK\x20/\x20YaRN\x20在做什么','a':_0x5ab1cd(0x281)},{'c':'llm','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x129),'a':_0x5ab1cd(0xee)},{'c':_0x5ab1cd(0x141),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x5ab1cd(0x22f)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x5ab1cd(0x245),'a':_0x5ab1cd(0x1f5)},{'c':_0x5ab1cd(0x141),'s':0x2,'lv':'💎','q':_0x5ab1cd(0x122),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类：①\x20<b>批处理</b>——continuous\x20batching（vLLM，请求到达即插入，GPU\x20不空转，吞吐提升最大的单点）\x20②\x20<b>注意力与显存</b>——PagedAttention、FlashAttention、KV\x20量化\x20③\x20<b>模型压缩</b>——量化（GPTQ/AWQ权重量化、W8A8）、蒸馏、剪枝\x20④\x20<b>解码策略</b>——投机解码（小模型起草、大模型批量验证，无损加速）、Medusa\x20多头预测。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“先上哪个？”——先vLLM（continuous\x20batching\x20+\x20PagedAttention\x20开箱即得），再考虑量化；“投机解码为什么无损？”——验证阶段用大模型的分布做接受/拒绝采样，输出分布与原模型一致。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>应用岗到这个水位（知道名词\x20+\x20一句话原理\x20+\x20选型顺序）就够，别硬装Infra\x20深度——被追问\x20CUDA\x20实现会崩。““““““'},{'c':_0x5ab1cd(0x141),'s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':_0x5ab1cd(0xb9)},{'c':_0x5ab1cd(0x141),'s':0x3,'lv':'🔥','q':_0x5ab1cd(0x199),'a':_0x5ab1cd(0x191)},{'c':'llm','s':0x4,'lv':'🔥','q':'BPE\x20分词：原理与它带来的后遗症','a':_0x5ab1cd(0x107)},{'c':_0x5ab1cd(0x141),'s':0x4,'lv':'🔥','q':_0x5ab1cd(0x26c),'a':_0x5ab1cd(0x27b)},{'c':_0x5ab1cd(0x141),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0x8b),'a':_0x5ab1cd(0x28c)},{'c':_0x5ab1cd(0x141),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0x1b2),'a':_0x5ab1cd(0x23f)},{'c':_0x5ab1cd(0x141),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0xcd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x5ab1cd(0x141),'s':0x5,'lv':'💎','q':_0x5ab1cd(0x288),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x5ab1cd(0x1c3),'a':_0x5ab1cd(0xf0)},{'c':_0x5ab1cd(0x141),'s':0x6,'lv':'⭐','q':_0x5ab1cd(0x1df),'a':_0x5ab1cd(0x144)},{'c':_0x5ab1cd(0x141),'s':0x6,'lv':'🔥','q':_0x5ab1cd(0x279),'a':_0x5ab1cd(0x83)},{'c':_0x5ab1cd(0x141),'s':0x7,'lv':'⭐','q':_0x5ab1cd(0x186),'a':_0x5ab1cd(0xa1)},{'c':_0x5ab1cd(0x141),'s':0x7,'lv':'🔥','q':_0x5ab1cd(0xe1),'a':_0x5ab1cd(0x1ae)},{'c':_0x5ab1cd(0x141),'s':0x7,'lv':'🔥','q':_0x5ab1cd(0x237),'a':_0x5ab1cd(0x2ad)},{'c':_0x5ab1cd(0x141),'s':0x7,'lv':'💎','q':_0x5ab1cd(0xec),'a':_0x5ab1cd(0xaa)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x2b0),'a':_0x5ab1cd(0x202)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x212),'a':_0x5ab1cd(0x2a4)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x179),'a':_0x5ab1cd(0x71)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5ab1cd(0x205),'a':_0x5ab1cd(0x19d)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x5ab1cd(0x146),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x28d),'a':_0x5ab1cd(0x1f7)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x29c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>SFT</b>：指令微调得到初始策略\x20π_ref\x20②\x20<b>训练奖励模型\x20RM</b>：同一\x20prompt\x20多个回答人工排序，用\x20pairwise\x20loss\x20训一个打分器（好回答分高于坏回答）③\x20<b>PPO\x20优化</b>：以\x20RM\x20打分为奖励更新策略，同时加\x20<b>KL\x20惩罚</b>约束不要偏离\x20π_ref\x20太远。奖励实际形式：R\x20=\x20RM(x,y)\x20−\x20β·KL(π‖π_ref)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“KL\x20防什么？”——防\x20reward\x20hacking（模型找\x20RM\x20漏洞，比如无脑变长、堆礼貌词）和能力退化；“RM\x20的问题？”——它只是人类偏好的<b>代理</b>，训练久了策略会过拟合这个代理，所以要监控\x20KL\x20和输出长度、定期换新数据训RM。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“为什么不直接用人类打分做奖励”——因为人工反馈太慢太贵，RM\x20是把稀疏人类信号<b>放大成可微、可高频查询的奖励函数</b>。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x273),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x13f),'a':_0x5ab1cd(0x97)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x5ab1cd(0x1a4),'a':_0x5ab1cd(0x269)},{'c':'rl','s':0x3,'lv':'💎','q':_0x5ab1cd(0x165),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5ab1cd(0x75),'a':_0x5ab1cd(0x1b4)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x5ab1cd(0x193),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x1d5),'a':_0x5ab1cd(0x286)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x14b),'a':_0x5ab1cd(0x24e)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x235),'a':_0x5ab1cd(0x90)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x17d),'a':_0x5ab1cd(0x218)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x5ab1cd(0x125),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x5ab1cd(0x201),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x5ab1cd(0x102),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5ab1cd(0xfd),'a':_0x5ab1cd(0x9c)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5ab1cd(0xea),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x130),'a':_0x5ab1cd(0x15b)},{'c':'pt','s':0x1,'lv':'💎','q':_0x5ab1cd(0x99),'a':_0x5ab1cd(0xbf)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x5ab1cd(0x2bd),'a':_0x5ab1cd(0x181)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x29b),'a':_0x5ab1cd(0x2bf)},{'c':'pt','s':0x2,'lv':'💎','q':_0x5ab1cd(0x220),'a':_0x5ab1cd(0x207)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x192),'a':_0x5ab1cd(0x6d)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x241),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x5ab1cd(0x19f),'a':_0x5ab1cd(0x114)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5ab1cd(0x80),'a':_0x5ab1cd(0xfa)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x5ab1cd(0x1bf),'a':_0x5ab1cd(0x1ba)},{'c':'pt','s':0x3,'lv':'💎','q':_0x5ab1cd(0xe7),'a':_0x5ab1cd(0x1c1)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':_0x5ab1cd(0xdb)},{'c':_0x5ab1cd(0x1f6),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0xac),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':_0x5ab1cd(0x1f6),'s':0x0,'lv':'⭐','q':'Chunking\x20怎么切？常见策略对比','a':_0x5ab1cd(0x29e)},{'c':_0x5ab1cd(0x1f6),'s':0x1,'lv':'⭐','q':_0x5ab1cd(0x2c2),'a':_0x5ab1cd(0x2a3)},{'c':_0x5ab1cd(0x1f6),'s':0x1,'lv':'🔥','q':_0x5ab1cd(0x25d),'a':_0x5ab1cd(0xc9)},{'c':_0x5ab1cd(0x1f6),'s':0x1,'lv':'⭐','q':_0x5ab1cd(0x1f1),'a':_0x5ab1cd(0x133)},{'c':_0x5ab1cd(0x1f6),'s':0x2,'lv':'🔥','q':_0x5ab1cd(0x1b3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':'app','s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x5ab1cd(0x258)},{'c':_0x5ab1cd(0x1f6),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':'app','s':0x3,'lv':'💎','q':_0x5ab1cd(0x234),'a':_0x5ab1cd(0x78)},{'c':_0x5ab1cd(0x1f6),'s':0x4,'lv':'⭐','q':_0x5ab1cd(0x214),'a':_0x5ab1cd(0x2cf)},{'c':_0x5ab1cd(0x1f6),'s':0x4,'lv':'⭐','q':_0x5ab1cd(0x200),'a':_0x5ab1cd(0x25a)},{'c':_0x5ab1cd(0x1f6),'s':0x4,'lv':'🔥','q':_0x5ab1cd(0xa4),'a':_0x5ab1cd(0x1ef)},{'c':_0x5ab1cd(0x1f6),'s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':_0x5ab1cd(0x1f6),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0x2b6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':'app','s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x5ab1cd(0x1f6),'s':0x6,'lv':'⭐','q':_0x5ab1cd(0x2d4),'a':_0x5ab1cd(0x1d1)},{'c':_0x5ab1cd(0x1f6),'s':0x6,'lv':'⭐','q':'Prompt\x20Injection：LLM\x20应用的头号安全问题','a':_0x5ab1cd(0x157)},{'c':'app','s':0x6,'lv':'🔥','q':'LLM\x20应用上线后：可观测性与成本怎么管？','a':_0x5ab1cd(0x22e)},{'c':_0x5ab1cd(0x1f6),'s':0x6,'lv':'💎','q':_0x5ab1cd(0x117),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':_0x5ab1cd(0x1f6),'s':0x7,'lv':'⭐','q':_0x5ab1cd(0x23e),'a':_0x5ab1cd(0x171)},{'c':_0x5ab1cd(0x1f6),'s':0x7,'lv':'🔥','q':_0x5ab1cd(0x2a8),'a':_0x5ab1cd(0x1b7)},{'c':_0x5ab1cd(0x1f6),'s':0x7,'lv':'⭐','q':_0x5ab1cd(0x17f),'a':_0x5ab1cd(0x14d)},{'c':_0x5ab1cd(0x1f6),'s':0x7,'lv':'🔥','q':_0x5ab1cd(0xfb),'a':_0x5ab1cd(0x27a)},{'c':'app','s':0x7,'lv':'🔥','q':_0x5ab1cd(0x2ae),'a':_0x5ab1cd(0x25f)},{'c':'eng','s':0x0,'lv':'⭐','q':_0x5ab1cd(0x10c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':'eng','s':0x0,'lv':'⭐','q':_0x5ab1cd(0xad),'a':_0x5ab1cd(0x211)},{'c':_0x5ab1cd(0x1c7),'s':0x0,'lv':'🔥','q':_0x5ab1cd(0x25b),'a':_0x5ab1cd(0x292)},{'c':_0x5ab1cd(0x1c7),'s':0x1,'lv':'⭐','q':_0x5ab1cd(0x280),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':_0x5ab1cd(0x1c7),'s':0x1,'lv':'🔥','q':_0x5ab1cd(0xed),'a':_0x5ab1cd(0x233)},{'c':_0x5ab1cd(0x1c7),'s':0x1,'lv':'🔥','q':_0x5ab1cd(0xa7),'a':_0x5ab1cd(0xdc)},{'c':_0x5ab1cd(0x1c7),'s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':_0x5ab1cd(0x1c4)},{'c':'eng','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x184),'a':_0x5ab1cd(0xd0)},{'c':_0x5ab1cd(0x1c7),'s':0x3,'lv':'🔥','q':_0x5ab1cd(0xd6),'a':_0x5ab1cd(0xb4)},{'c':_0x5ab1cd(0x1c7),'s':0x3,'lv':'🔥','q':_0x5ab1cd(0x12d),'a':_0x5ab1cd(0x215)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x5ab1cd(0x101),'a':_0x5ab1cd(0x262)},{'c':_0x5ab1cd(0x1c7),'s':0x4,'lv':'⭐','q':_0x5ab1cd(0x11f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x5ab1cd(0x1c7),'s':0x4,'lv':'🔥','q':_0x5ab1cd(0x194),'a':_0x5ab1cd(0xc1)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x5ab1cd(0x1b9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>通用指标：QPS/TPS、延迟（<b>看\x20P95/P99，不看平均</b>）、错误率、饱和度。<b>LLM\x20服务特有指标</b>：<b>TTFT</b>（首\x20token\x20延迟，受\x20prefill\x20和排队影响，直接决定用户体感）、<b>TPOT</b>（每\x20token\x20间隔，受\x20decode\x20影响）、吞吐（tokens/s）。定位路径：监控先定层（网关→应用→检索→模型）→\x20trace\x20找慢环节\x20→\x20针对优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“TTFT\x20高怎么优化？”——减少输入长度（prompt\x20瘦身、检索精简）、prefix\x20caching（系统提示词复用）、提升调度优先级；“吞吐低怎么办？”——上continuous\x20batching（vLLM）、量化、增大\x20batch。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只说“看QPS\x20和延迟”是通用答案；<b>说出\x20TTFT/TPOT\x20才证明你做过\x20LLM\x20服务</b>。“““'},{'c':_0x5ab1cd(0x1c7),'s':0x4,'lv':'💎','q':_0x5ab1cd(0x103),'a':_0x5ab1cd(0x2c8)},{'c':_0x5ab1cd(0x1c7),'s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':_0x5ab1cd(0x172)},{'c':_0x5ab1cd(0x19e),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0x190),'a':_0x5ab1cd(0x76)},{'c':_0x5ab1cd(0x19e),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0x161),'a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':'story','s':0x1,'lv':'⭐','q':'项目深挖的标准应答框架（STAR-T）','a':_0x5ab1cd(0x70)},{'c':_0x5ab1cd(0x19e),'s':0x1,'lv':'⭐','q':_0x5ab1cd(0x20e),'a':_0x5ab1cd(0x217)},{'c':_0x5ab1cd(0x19e),'s':0x2,'lv':'⭐','q':_0x5ab1cd(0x134),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':_0x5ab1cd(0x19e),'s':0x2,'lv':'🔥','q':_0x5ab1cd(0x2b9),'a':_0x5ab1cd(0x24a)},{'c':_0x5ab1cd(0x19e),'s':0x3,'lv':'⭐','q':_0x5ab1cd(0x15f),'a':_0x5ab1cd(0x249)},{'c':_0x5ab1cd(0x19e),'s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':_0x5ab1cd(0x72)},{'c':_0x5ab1cd(0x19e),'s':0x4,'lv':'⭐','q':_0x5ab1cd(0x9e),'a':_0x5ab1cd(0x148)},{'c':_0x5ab1cd(0x19e),'s':0x4,'lv':'⭐','q':'“游戏算法和\x20LLM\x20应用岗有什么关系？”（必问）','a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+\x20RL”这个方法词升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>千万别说“我是被调剂过去的”或“我其实想做\x20LLM\x20但没拿到”——一句话让整段经历变成减分项。“'},{'c':_0x5ab1cd(0x19e),'s':0x5,'lv':'⭐','q':_0x5ab1cd(0x267),'a':'<span\x20class=\x27lb\x27>◈\x20五个高频问题的应答骨架</span><br>①\x20<b>你最大的缺点</b>：说一个<b>真实但不致命</b>的\x20+\x20你的改进动作。可用：“我早期倾向于把系统做全（前后端都自己上），导致核心链路打磨时间被摊薄；现在我会先明确什么是核心指标，再决定资源分配。”<br>②\x20<b>遇到的最大挑战</b>：讲技术难点（见\x208.2.2），不讲“时间紧”。<br>③\x20<b>团队冲突怎么处理</b>：<b>用你的学生工作经历</b>——这是它唯一的高价值用途，讲一次跨团队协调的具体事例\x20+\x20你的处理逻辑。<br>④\x20<b>为什么选我们公司/这个岗位</b>：必须做功课——具体到<b>业务线、产品、技术方向</b>，别说“贵公司平台好”。<br>⑤\x20<b>职业规划</b>：1年成为能独立交付\x20LLM\x20应用的工程师，3\x20年在某个方向（Agent\x20可靠性\x20/\x20评测体系）有深度积累。<b>别说想做管理。</b><br><span\x20class=\x27lb\x27>➤\x20要点</span><br>行为面的评分标准是<b>真诚\x20+\x20结构清晰\x20+\x20有反思</b>，不是回答漂亮。“'},{'c':_0x5ab1cd(0x19e),'s':0x5,'lv':'🔥','q':'“你有什么想问我的？”——反问环节怎么用','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>这不是客套，是<b>你唯一能主动展示判断力的环节</b>，也是你收集决策信息的机会。<br><b>推荐问题（按面试官层级选）</b>：<br>·\x20技术面：“团队现在的\x20LLM\x20应用主要卡在哪个环节——效果、成本还是可靠性？”（显示你知道真实痛点在哪）<br>·\x20技术面：“团队在评测体系上是怎么做的？有没有固定的回归评估集？”（这个问题会让懂的面试官立刻对你改观）<br>·\x20leader\x20面：“这个岗位一年后，什么样算做得好？”<br>·\x20HR\x20面：新人培养机制、团队构成、业务节奏。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>别问“我表现怎么样”（把评价压力给对方）、别问薪资（留给\x20HR）、<b>别说“没有问题”</b>——那等于说你对这份工作不好奇。“'},{'c':_0x5ab1cd(0x19e),'s':0x5,'lv':'🔥','q':_0x5ab1cd(0xc8),'a':_0x5ab1cd(0xe9)},{'c':_0x5ab1cd(0x1ea),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0x1e7),'a':_0x5ab1cd(0x153)},{'c':_0x5ab1cd(0x1ea),'s':0x0,'lv':'⭐','q':_0x5ab1cd(0x251),'a':_0x5ab1cd(0xd2)},{'c':_0x5ab1cd(0x1ea),'s':0x0,'lv':'🔥','q':_0x5ab1cd(0x1ab),'a':_0x5ab1cd(0x85)},{'c':_0x5ab1cd(0x1ea),'s':0x1,'lv':'🔥','q':_0x5ab1cd(0x298),'a':_0x5ab1cd(0x1f3)},{'c':'plan','s':0x1,'lv':'🔥','q':_0x5ab1cd(0x11e),'a':_0x5ab1cd(0x177)},{'c':_0x5ab1cd(0x1ea),'s':0x2,'lv':'⭐','q':_0x5ab1cd(0x256),'a':'<span\x20class=\x27lb\x27>◈\x20模板（直接复制使用）</span><br><b>基本信息</b>：公司\x20/\x20部门\x20/\x20轮次\x20/\x20日期\x20/\x20时长\x20/\x20面试官画像（技术深度、关注方向）<br><b>被问问题清单</b>：逐条记录，尽量原话，标注\x20✅答好\x20/\x20⚠️勉强\x20/\x20❌答崩<br><b>答崩的题</b>：题目\x20+\x20我当时怎么答的\x20+\x20卡在哪\x20+\x20<b>正确答案应该是什么</b><br><b>面试官的追问方向</b>：他反复挖的是什么？（反映团队真实关注点）<br><b>我的表现问题</b>：语速、结构、有没有答非所问、有没有沉默<br><b>下一步动作</b>：要补的知识点（写进手册哪一节）+\x20要改的表达习惯<br><span\x20class=\x27lb\x27>➤\x20复利机制</span><br>把❌\x20的题<b>当天补进手册对应章节</b>并标记“还不熟”→\x20进闪卡循环\x20→\x20下次遇到就是✅。<b>这是整本手册最重要的使用方式：让它随你的面试一起长大。</b>“'},{'c':'plan','s':0x2,'lv':'🔥','q':_0x5ab1cd(0x204),'a':_0x5ab1cd(0x163)},{'c':_0x5ab1cd(0x1ea),'s':0x3,'lv':'🔥','q':_0x5ab1cd(0x183),'a':_0x5ab1cd
