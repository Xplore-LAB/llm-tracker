<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

x47fd0a(0x128)},{'c':_0x47fd0a(0xe1),'s':0x2,'lv':'🔥','q':_0x47fd0a(0x168),'a':_0x47fd0a(0x177)},{'c':_0x47fd0a(0xe1),'s':0x2,'lv':'🔥','q':_0x47fd0a(0x248),'a':_0x47fd0a(0x2c2)},{'c':_0x47fd0a(0xe1),'s':0x3,'lv':'⭐','q':_0x47fd0a(0x15b),'a':_0x47fd0a(0x164)},{'c':_0x47fd0a(0xe1),'s':0x3,'lv':'🔥','q':_0x47fd0a(0x2aa),'a':_0x47fd0a(0x166)},{'c':'code','s':0x3,'lv':'🔥','q':_0x47fd0a(0x250),'a':_0x47fd0a(0x178)},{'c':_0x47fd0a(0xe1),'s':0x3,'lv':'🔥','q':'区间问题：合并、插入、调度','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':_0x47fd0a(0xe1),'s':0x4,'lv':'⭐','q':_0x47fd0a(0x205),'a':_0x47fd0a(0x13c)},{'c':_0x47fd0a(0xe1),'s':0x4,'lv':'🔥','q':_0x47fd0a(0x141),'a':_0x47fd0a(0x254)},{'c':'code','s':0x5,'lv':'🔥','q':_0x47fd0a(0x1da),'a':_0x47fd0a(0x267)},{'c':_0x47fd0a(0xe1),'s':0x5,'lv':'💎','q':_0x47fd0a(0x1a3),'a':_0x47fd0a(0x130)},{'c':'ml','s':0x0,'lv':'⭐','q':'反向传播的本质是什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x47fd0a(0xb8),'a':_0x47fd0a(0x19d)},{'c':'ml','s':0x0,'lv':'⭐','q':'Adam\x20为什么有效？显存代价是多少？','a':_0x47fd0a(0x1bb)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x47fd0a(0xe8),'a':_0x47fd0a(0xc4)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x47fd0a(0x2ef),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省 位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x47fd0a(0x289),'s':0x1,'lv':'🔥','q':_0x47fd0a(0x220),'a':_0x47fd0a(0x1b9)},{'c':_0x47fd0a(0x289),'s':0x1,'lv':'🔥','q':_0x47fd0a(0xcf),'a':_0x47fd0a(0x28d)},{'c':_0x47fd0a(0x289),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x47fd0a(0x1ef)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x47fd0a(0x30d),'a':_0x47fd0a(0x121)},{'c':_0x47fd0a(0x289),'s':0x2,'lv':'💎','q':_0x47fd0a(0x12c),'a':_0x47fd0a(0x1e7)},{'c':_0x47fd0a(0x289),'s':0x3,'lv':'⭐','q':_0x47fd0a(0xc6),'a':_0x47fd0a(0x1a6)},{'c':_0x47fd0a(0x289),'s':0x3,'lv':'🔥','q':_0x47fd0a(0x2a3),'a':_0x47fd0a(0x1aa)},{'c':'llm','s':0x4,'lv':'🔥','q':'BPE\x20分词：原理与它带来的后遗症','a':_0x47fd0a(0x310)},{'c':_0x47fd0a(0x289),'s':0x4,'lv':'🔥','q':_0x47fd0a(0x2c7),'a':_0x47fd0a(0x1b2)},{'c':_0x47fd0a(0x289),'s':0x5,'lv':'🔥','q':_0x47fd0a(0x1f8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>结论：loss\x20与参数量N、数据量\x20D、算力\x20C呈<b>幂律关系</b>，可预测——这才是敢投巨资训大模型的依据。<b>Chinchilla\x20的修正</b>：早期模型普遍“过大而欠训”，给定算力下\x20N\x20和\x20D\x20应<b>同比例增长</b>（经验值约\x2020\x20tokens/参数）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么现在的小模型比几年前的大模型强？”——按Chinchilla\x20之后的认知，用远超“最优比例”的数据量训小模型，虽然训练不最优但<b>推理成本低</b>，工业上更划算（Llama-3\x208B\x20用了15T\x20tokens）；“Scaling\x20会撞墙吗？”——高质量数据是当前主要约束，业界转向后训练与推理时计算（test-time\x20compute）找增量。““““““'},{'c':_0x47fd0a(0x289),'s':0x5,'lv':'🔥','q':_0x47fd0a(0x212),'a':_0x47fd0a(0x22a)},{'c':_0x47fd0a(0x289),'s':0x5,'lv':'🔥','q':_0x47fd0a(0x209),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x47fd0a(0x289),'s':0x5,'lv':'💎','q':_0x47fd0a(0xab),'a':_0x47fd0a(0x24a)},{'c':_0x47fd0a(0x289),'s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x47fd0a(0x289),'s':0x6,'lv':'⭐','q':_0x47fd0a(0x308),'a':_0x47fd0a(0x1f6)},{'c':_0x47fd0a(0x289),'s':0x6,'lv':'🔥','q':_0x47fd0a(0xe0),'a':_0x47fd0a(0x284)},{'c':_0x47fd0a(0x289),'s':0x7,'lv':'⭐','q':'幻觉的成因与全链路缓解手段','a':_0x47fd0a(0x1c4)},{'c':_0x47fd0a(0x289),'s':0x7,'lv':'🔥','q':_0x47fd0a(0xf6),'a':_0x47fd0a(0xb7)},{'c':_0x47fd0a(0x289),'s':0x7,'lv':'🔥','q':_0x47fd0a(0x294),'a':_0x47fd0a(0x14c)},{'c':_0x47fd0a(0x289),'s':0x7,'lv':'💎','q':_0x47fd0a(0x187),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x47fd0a(0x1ce),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>马尔可夫决策过程\x20MDP\x20=\x20⟨S,\x20A,\x20P,\x20R,\x20γ⟩：状态空间、动作空间、状态转移概率、奖励函数、折扣因子。<b>马尔可夫性</b>：下一状态只依赖当前状态和动作，与更早历史无关。目标：学一个策略\x20π(a|s)\x20最大化<b>期望累积折扣回报</b>\x20G_t\x20=\x20Σ\x20γᵏ\x20r_{t+k}。γ\x20控制远视程度（0只看眼前，接近\x201\x20极度远视）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“RL\x20和监督学习的本质区别？”——监督学习有标准答案（每步都告诉你对不对），RL\x20只有<b>延迟且稀疏的标量奖励</b>，且数据分布由自己的策略决定（非i.i.d.）；“为什么要折扣？”——保证无限期回报收敛，同时表达对时间的偏好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把\x20LLM\x20生成套进这个框架：状态=已生成的上下文，动作=下一个\x20token，奖励=整段回答的人类偏好分——这就是\x20RLHF\x20的建模方式。这句话能一秒证明你不是死记概念。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x47fd0a(0x118),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':'Q-learning\x20与\x20DQN：价值方法怎么工作','a':_0x47fd0a(0x274)},{'c':'rl','s':0x1,'lv':'💎','q':_0x47fd0a(0x2c5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x47fd0a(0x22c),'a':_0x47fd0a(0x2ec)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x47fd0a(0x1ab),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x47fd0a(0x113),'a':_0x47fd0a(0x14a)},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':_0x47fd0a(0x29c)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x47fd0a(0x185),'a':_0x47fd0a(0x1e1)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x47fd0a(0x2d6),'a':_0x47fd0a(0x144)},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x47fd0a(0xdb)},{'c':'rl','s':0x3,'lv':'💎','q':_0x47fd0a(0x2af),'a':_0x47fd0a(0xe5)},{'c':'rl','s':0x4,'lv':'🔥','q':'奖励塑形与奖励黑客（游戏\x20RL\x20的核心难题）','a':_0x47fd0a(0x2d9)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x47fd0a(0xd3),'a':_0x47fd0a(0x16b)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x47fd0a(0x108),'a':_0x47fd0a(0xd4)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x47fd0a(0xf7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x47fd0a(0x2a2),'a':_0x47fd0a(0x1db)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x47fd0a(0xb4),'a':_0x47fd0a(0x23b)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x47fd0a(0x116),'a':_0x47fd0a(0x1b1)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x47fd0a(0xac),'a':_0x47fd0a(0x18d)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x47fd0a(0x2fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x47fd0a(0xa3),'a':_0x47fd0a(0x257)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':_0x47fd0a(0x22b)},{'c':'pt','s':0x2,'lv':'⭐','q':'RLHF\x20/\x20DPO\x20/\x20GRPO\x20在Post-training\x20里的定位','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x47fd0a(0x2f9)},{'c':'pt','s':0x2,'lv':'💎','q':_0x47fd0a(0x157),'a':_0x47fd0a(0x207)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x47fd0a(0x29d),'a':_0x47fd0a(0x208)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':_0x47fd0a(0x1b0)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x47fd0a(0x21f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用强模型当裁判评估输出——便宜、快、可规模化，与人工评估的相关性可达\x2080%+。<b>四个已知偏差（必答）</b>：①\x20<b>位置偏差</b>（偏爱先出现的答案）→\x20交换顺序评两次取一致结果\x20②\x20<b>冗长偏差</b>（偏爱长答案）→\x20控制长度或显式指示③\x20<b>自我偏好</b>（偏爱自家模型风格）④\x20<b>分数膨胀</b>（都打\x204-5\x20分）→\x20用\x20pairwise\x20比较代替绝对打分。缓解组合：明确的打分细则（G-Eval\x20式）+\x20pairwise\x20+\x20位置交换\x20+\x20人工抽检校准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么情况下不能用？”——评估维度依赖专业领域知识（如工艺安全边界）时，裁判模型本身不懂，必须人工；“怎么验证裁判可信？”——用一小批人工标注集测裁判与人的一致率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里用过它+\x20做了消融实验——把“为什么信它、怎么控偏差、哪些维度仍用人工”讲清楚，这是评测能力的直接证明。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x47fd0a(0x287),'a':_0x47fd0a(0x18a)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x47fd0a(0xdd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>通用</b>：MMLU/CMMLU/C-Eval（知识问答）。<b>代码</b>：HumanEval/MBPP（pass@k）。<b>推理</b>：GSM8K/MATH。<b>对话</b>：MT-Bench、AlpacaEval（LLM\x20裁判\x20+\x20人类偏好）。<b>长文本</b>：needle-in-haystack、RULER。<b>陷阱</b>：①\x20<b>数据污染</b>——基准题进了训练集，跑分虚高（要做去污染检查）②\x20<b>刷榜≠好用</b>——针对基准优化的模型在真实业务上未必强③\x20单一指标掩盖问题（平均分高但某类任务崩）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么检查污染？”——n-gram\x20重叠检测、基准题的困惑度异常低是信号；“更可信的做法？”——<b>自建贴合业务的私有评测集</b>，这是工业界的共识。“““““'},{'c':'pt','s':0x3,'lv':'💎','q':_0x47fd0a(0x11a),'a':_0x47fd0a(0x194)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':_0x47fd0a(0x234)},{'c':'app','s':0x0,'lv':'⭐','q':_0x47fd0a(0x21e),'a':_0x47fd0a(0xba)},{'c':_0x47fd0a(0x2b8),'s':0x0,'lv':'⭐','q':_0x47fd0a(0x137),'a':_0x47fd0a(0x277)},{'c':_0x47fd0a(0x2b8),'s':0x1,'lv':'⭐','q':_0x47fd0a(0x134),'a':_0x47fd0a(0x19f)},{'c':_0x47fd0a(0x2b8),'s':0x1,'lv':'🔥','q':_0x47fd0a(0x213),'a':_0x47fd0a(0x15f)},{'c':_0x47fd0a(0x2b8),'s':0x1,'lv':'⭐','q':_0x47fd0a(0x102),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x2,'lv':'🔥','q':_0x47fd0a(0x16c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x2,'lv':'⭐','q':_0x47fd0a(0x229),'a':_0x47fd0a(0x24b)},{'c':_0x47fd0a(0x2b8),'s':0x3,'lv':'🔥','q':_0x47fd0a(0x2bd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':'app','s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x4,'lv':'⭐','q':_0x47fd0a(0x10e),'a':_0x47fd0a(0x10d)},{'c':'app','s':0x4,'lv':'⭐','q':_0x47fd0a(0x2de),'a':_0x47fd0a(0x1c8)},{'c':_0x47fd0a(0x2b8),'s':0x4,'lv':'🔥','q':_0x47fd0a(0x1fb),'a':_0x47fd0a(0x188)},{'c':_0x47fd0a(0x2b8),'s':0x4,'lv':'🔥','q':_0x47fd0a(0x2cd),'a':_0x47fd0a(0x150)},{'c':'app','s':0x5,'lv':'🔥','q':_0x47fd0a(0x2b3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x5,'lv':'💎','q':_0x47fd0a(0x25d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x6,'lv':'⭐','q':_0x47fd0a(0x2a8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x6,'lv':'⭐','q':_0x47fd0a(0xe7),'a':_0x47fd0a(0x30a)},{'c':_0x47fd0a(0x2b8),'s':0x6,'lv':'🔥','q':_0x47fd0a(0x13f),'a':_0x47fd0a(0x1b3)},{'c':_0x47fd0a(0x2b8),'s':0x6,'lv':'💎','q':_0x47fd0a(0x251),'a':_0x47fd0a(0x19a)},{'c':_0x47fd0a(0x2b8),'s':0x7,'lv':'⭐','q':_0x47fd0a(0x25b),'a':_0x47fd0a(0x149)},{'c':'app','s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':_0x47fd0a(0x2b8),'s':0x7,'lv':'⭐','q':_0x47fd0a(0xd2),'a':_0x47fd0a(0x203)},{'c':_0x47fd0a(0x2b8),'s':0x7,'lv':'🔥','q':_0x47fd0a(0xc8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>生成\x20SQL\x20→\x20语法校验\x20→\x20沙箱执行\x20→\x20报错或结果异常（空集、行数爆炸）→\x20<b>错误信息结构化回喂</b>模型重写\x20→\x20重试\x20N\x20轮封顶\x20→\x20仍失败则拒答/转人工。两个关键设计：错误信息要让模型知道“哪错了”（不是只说“错了”）；轮数必须封顶，防循环烧钱。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“会不会越改越错？”——会，所以封顶\x20+\x20保留初版对比；“提升多少？”——你项目里可执行率到\x2098%，很大程度靠这一环。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br>这套“生成-验证-修正”闭环和\x20OKC-SFT\x20的\x20Verification\x20字段是同一个思想：<b>让输出经过验证再交付</b>——两个项目在此交汇。““““““'},{'c':_0x47fd0a(0x2b8),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多轮</b>：指代消解（“那上月呢”→\x20补全成完整查询意图）+\x20会话状态显式维护（已选表、时间范围）+\x20历史摘要管理。<b>权限</b>：生成前按用户权限过滤可见\x20schema（行列级）＋\x20只读账号\x20＋\x20LIMIT\x20强制\x20＋\x20危险关键字拦截（DROP/DELETE/UPDATE）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“schema\x20过滤和生成后拦截哪个好？”——都要：生成前过滤减少出错面，生成后拦截兜底，这叫<b>纵深防御</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>和「Prompt\x20Injection」那条连成完整的安全故事：输入防护\x20+\x20权限最小化\x20+\x20输出拦截，三层都真实做过。““““““'},{'c':_0x47fd0a(0x20c),'s':0x0,'lv':'⭐','q':_0x47fd0a(0x253),'a':_0x47fd0a(0x26f)},{'c':'eng','s':0x0,'lv':'⭐','q':_0x47fd0a(0x2b0),'a':_0x47fd0a(0x11c)},{'c':_0x47fd0a(0x20c),'s':0x0,'lv':'🔥','q':_0x47fd0a(0x247),'a':_0x47fd0a(0xc9)},{'c':_0x47fd0a(0x20c),'s':0x1,'lv':'⭐','q':_0x47fd0a(0x2f3),'a':_0x47fd0a(0x30c)},{'c':'eng','s':0x1,'lv':'🔥','q':_0x47fd0a(0x243),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x
