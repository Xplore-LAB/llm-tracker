<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable],.monaco-editor,.monaco-editor *{-webkit-user-select:text!important;user-select:text!important}
</style>

分（如“分割数组的最大值”410）。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>只背一种模板并把它写熟</b>，比记三种模板更可靠——现场紧张时记忆最容易串。““'},{'c':_0x37b89f(0x124),'s':0x1,'lv':'⭐','q':_0x37b89f(0x266),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>partition</b>：选\x20pivot（务必<b>随机化</b>防最坏情况），双指针把\x20≤pivot\x20的放左、&gt;pivot\x20的放右，返回\x20pivot\x20最终下标\x20p。<b>快排</b>：递归\x20[l,p−1]\x20和\x20[p+1,r]，平均\x20O(n\x20log\x20n)、最坏\x20O(n²)、原地、不稳定。<b>快速选择（LeetCode\x20215）</b>：partition\x20后只递归<b>包含第\x20k\x20个元素的那一侧</b>，平均\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“海量数据\x20TopK\x20怎么做？”——维护大小为\x20k\x20的<b>小顶堆</b>，O(n\x20log\x20k)，内存只占\x20k；数据分布在多机则各机求局部\x20TopK\x20再归并；“为什么快排常数比归并小？”——原地、缓存友好、无额外分配。““'},{'c':_0x37b89f(0x124),'s':0x1,'lv':'🔥','q':'排序算法对比与稳定性','a':_0x37b89f(0x1bb)},{'c':_0x37b89f(0x124),'s':0x2,'lv':'⭐','q':_0x37b89f(0x216),'a':_0x37b89f(0x215)},{'c':_0x37b89f(0x124),'s':0x2,'lv':'⭐','q':_0x37b89f(0x207),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':'code','s':0x2,'lv':'🔥','q':_0x37b89f(0x15e),'a':_0x37b89f(0x96)},{'c':_0x37b89f(0x124),'s':0x2,'lv':'🔥','q':'双指针：链表判环、找中点、找环入口','a':_0x37b89f(0x20c)},{'c':_0x37b89f(0x124),'s':0x3,'lv':'⭐','q':_0x37b89f(0x1c2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':_0x37b89f(0x124),'s':0x3,'lv':'🔥','q':'单调栈与单调队列','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>单调栈</b>解决“找下一个/上一个更大或更小元素”：维护栈内单调递减（找更大），新元素把栈顶比它小的都弹出，<b>被弹出元素的“下一个更大元素”就是当前元素</b>。每元素进出各一次\x20→\x20O(n)。<b>单调队列</b>（双端队列）解决<b>滑动窗口最大值（239）</b>：队首保持最大，入队时从尾部弹掉比自己小的，出窗口时从队首弹掉过期下标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“经典题？”——每日温度（739）、柱状图中最大的矩形（84）、接雨水（42）、去除重复字母（316）；“怎么判断该用单调栈？”——题目问“最近的更大/更小”或涉及“以某元素为最值的最大区间”。““'},{'c':_0x37b89f(0x124),'s':0x3,'lv':'🔥','q':_0x37b89f(0x214),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>前缀和</b>：pre[i]=前\x20i\x20项和，区间和\x20[l,r]\x20=\x20pre[r+1]−pre[l]，O(1)\x20查询。<b>前缀和\x20+\x20哈希</b>是高频组合：<b>和为\x20K\x20的子数组（560）</b>——遍历时用哈希记录各前缀和出现次数，查找\x20pre[i]−K\x20是否出现过。<b>差分</b>：区间批量加法的逆操作——在\x20l\x20处\x20+v、r+1\x20处\x20−v，最后求前缀和还原（区间更新\x20O(1)）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么哈希里要先放\x20{0:1}？”——处理“从下标\x200\x20开始的子数组”这种边界；“二维版？”——二维前缀和（304），矩阵区域和用容斥。““'},{'c':'code','s':0x3,'lv':'🔥','q':_0x37b89f(0x2a2),'a':_0x37b89f(0x244)},{'c':_0x37b89f(0x124),'s':0x4,'lv':'⭐','q':_0x37b89f(0xb2),'a':_0x37b89f(0x2c6)},{'c':_0x37b89f(0x124),'s':0x4,'lv':'🔥','q':_0x37b89f(0xc9),'a':_0x37b89f(0x175)},{'c':_0x37b89f(0x124),'s':0x5,'lv':'🔥','q':_0x37b89f(0x1e2),'a':_0x37b89f(0x1b2)},{'c':'code','s':0x5,'lv':'💎','q':_0x37b89f(0x25d),'a':_0x37b89f(0x2b6)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x37b89f(0xcb),'a':_0x37b89f(0xf9)},{'c':'ml','s':0x0,'lv':'⭐','q':'梯度消失\x20/\x20爆炸：成因与五种对策','a':_0x37b89f(0x148)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x37b89f(0x2e8),'a':_0x37b89f(0x265)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x37b89f(0xe2),'a':_0x37b89f(0x27e)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x37b89f(0x250),'a':_0x37b89f(0x281)},{'c':'ml','s':0x0,'lv':'🔥','q':'梯度累积与梯度裁剪','a':_0x37b89f(0x2ba)},{'c':'ml','s':0x1,'lv':'⭐','q':'LayerNorm\x20vs\x20BatchNorm：为什么\x20Transformer\x20用\x20LN','a':_0x37b89f(0x1ff)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x37b89f(0x259),'a':_0x37b89f(0x1cc)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x37b89f(0x16e)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x37b89f(0x269)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x37b89f(0x29b),'a':_0x37b89f(0x272)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x37b89f(0x202),'a':_0x37b89f(0x1ad)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x37b89f(0x145),'a':_0x37b89f(0xd6)},{'c':'ml','s':0x2,'lv':'🔥','q':'类别不平衡怎么处理','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x37b89f(0x162),'a':_0x37b89f(0x1fa)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x37b89f(0x1d1),'a':_0x37b89f(0x2ca)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x37b89f(0x29f),'a':_0x37b89f(0x1a1)},{'c':'ml','s':0x3,'lv':'💎','q':_0x37b89f(0x1b5),'a':_0x37b89f(0x28b)},{'c':_0x37b89f(0xc5),'s':0x0,'lv':'⭐','q':_0x37b89f(0x1c5),'a':_0x37b89f(0x142)},{'c':'llm','s':0x0,'lv':'⭐','q':'为什么需要多头注意力（Multi-Head）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x37b89f(0xc5),'s':0x0,'lv':'🔥','q':'MHA\x20/\x20GQA\x20/\x20MQA\x20的区别与选择逻辑','a':_0x37b89f(0x105)},{'c':'llm','s':0x0,'lv':'🔥','q':_0x37b89f(0x141),'a':_0x37b89f(0x299)},{'c':_0x37b89f(0xc5),'s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':_0x37b89f(0x2e7)},{'c':'llm','s':0x1,'lv':'🔥','q':_0x37b89f(0xba),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x37b89f(0xc5),'s':0x1,'lv':'🔥','q':_0x37b89f(0x2da),'a':_0x37b89f(0x91)},{'c':_0x37b89f(0xc5),'s':0x2,'lv':'⭐','q':_0x37b89f(0x170),'a':_0x37b89f(0xa7)},{'c':_0x37b89f(0xc5),'s':0x2,'lv':'⭐','q':_0x37b89f(0x2aa),'a':_0x37b89f(0x1bd)},{'c':_0x37b89f(0xc5),'s':0x2,'lv':'💎','q':_0x37b89f(0x27c),'a':_0x37b89f(0x2ec)},{'c':_0x37b89f(0xc5),'s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(logits/T)：T\x20大→分布变平（更随机多样），T\x20小→更尖锐（更确定），T→0\x20等价贪心。top-k：只在概率最高\x20k\x20个\x20token\x20里采样（固定截断）。<b>top-p（nucleus）</b>：取累积概率达\x20p\x20的最小\x20token\x20集合（动态截断，比\x20top-k\x20自适应）。工程经验：严肃任务（NL2SQL\x20/\x20代码\x20/\x20抽取）T=0~0.3；创作类\x200.7~1.0；<b>别同时激进调\x20T\x20和\x20top-p</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么复读？”——贪心/低温陷入局部最优形成循环，用\x20repetition_penalty\x20或适度提温；“T=0\x20一定可复现吗？”——不完全，浮点非确定性和批处理顺序会引入微小差异。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20用低温\x20+\x20结构约束，是“任务性质决定采样策略”的现成例子。““““““'},{'c':'llm','s':0x3,'lv':'🔥','q':_0x37b89f(0x2db),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(x_i)=e^{x_i}/Σe^{x_j}，x\x20大时\x20e^x\x20上溢。稳定版：<b>先减\x20max</b>——e^{x_i-max}/Σe^{x_j-max}，数学等价、数值安全。logsumexp\x20=\x20max\x20+\x20log\x20Σe^{x_j-max}，用于算log\x20概率（交叉熵、logprobs）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么面试爱考？”——手撕\x20attention\x20的第一个考点；且推理框架里所有采样、beam\x20search、困惑度计算都建在\x20logprobs\x20上，数值稳定是工程底线。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>手写\x20attention\x20时直接\x20exp\x20不减\x20max，是最常见的“会写但不专业”破绽。““““““'},{'c':'llm','s':0x4,'lv':'🔥','q':_0x37b89f(0xa8),'a':_0x37b89f(0x1de)},{'c':_0x37b89f(0xc5),'s':0x4,'lv':'🔥','q':_0x37b89f(0x2d8),'a':_0x37b89f(0x24f)},{'c':_0x37b89f(0xc5),'s':0x5,'lv':'🔥','q':_0x37b89f(0x136),'a':_0x37b89f(0x1d0)},{'c':_0x37b89f(0xc5),'s':0x5,'lv':'🔥','q':_0x37b89f(0x174),'a':_0x37b89f(0x284)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x37b89f(0x183),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':'llm','s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':_0x37b89f(0x15f)},{'c':_0x37b89f(0xc5),'s':0x5,'lv':'🔥','q':_0x37b89f(0x2be),'a':_0x37b89f(0x267)},{'c':_0x37b89f(0xc5),'s':0x6,'lv':'⭐','q':_0x37b89f(0x2e2),'a':_0x37b89f(0x2d9)},{'c':_0x37b89f(0xc5),'s':0x6,'lv':'🔥','q':_0x37b89f(0xcf),'a':_0x37b89f(0x99)},{'c':_0x37b89f(0xc5),'s':0x7,'lv':'⭐','q':_0x37b89f(0xbe),'a':_0x37b89f(0x144)},{'c':_0x37b89f(0xc5),'s':0x7,'lv':'🔥','q':_0x37b89f(0x22b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x37b89f(0xc5),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x37b89f(0x1a5)},{'c':_0x37b89f(0xc5),'s':0x7,'lv':'💎','q':'涌现能力（Emergent\x20Abilities）与它的争议','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x37b89f(0x21d)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x37b89f(0x213),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x37b89f(0x2b0),'a':_0x37b89f(0x93)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x37b89f(0x204)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x37b89f(0x110),'a':_0x37b89f(0x9a)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x37b89f(0x109),'a':_0x37b89f(0x252)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x37b89f(0x288),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x37b89f(0x164),'a':_0x37b89f(0x233)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x37b89f(0x1fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x37b89f(0x253),'a':_0x37b89f(0x184)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x37b89f(0x173),'a':_0x37b89f(0x1e6)},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':_0x37b89f(0x128)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x37b89f(0x1b0),'a':_0x37b89f(0x1c4)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x37b89f(0x1c0),'a':_0x37b89f(0x22c)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x37b89f(0xbc),'a':_0x37b89f(0x1dd)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x37b89f(0x2a8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>LIMA\x20的著名结论：<b>“Less\x20Is\x20More\x20for\x20Alignment”</b>——1000\x20条精选数据可胜过数万条噪声数据；对齐阶段模型主要在学格式与风格，不是学知识。实践清单：①\x20<b>任务类型覆盖</b>（多样性>\x20数量）②\x20严格去重与去模板化\x20③\x20长度分布合理（别全是短答）④\x20<b>格式绝对一致</b>——一个坏样本就能教会模型坏格式\x20⑤\x20人工抽检\x20+\x20模型过滤双保险。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断数据够不够？”——看验证集指标是否随数据量饱和；“怎么衡量多样性？”——指令语义聚类分布、任务类型覆盖率、去重后剩余率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>611\x20条数据覆盖\x206\x20类任务（变量解释/工况识别/原因分析/操作生成/安全提醒/处置后验证）——<b>“我不是凑数量，是按任务类型做覆盖设计”</b>，这正是\x20LIMA\x20结论的正确实践，能把“数据少”讲成“数据精”。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x37b89f(0x258),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x37b89f(0x2b9),'a':_0x37b89f(0xc7)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x37b89f(0x1f1),'a':_0x37b89f(0xd1)},{'c':'pt','s':0x1,'lv':'⭐','q':'LoRA：低秩假设到底在假设什么？','a':_0x37b89f(0x9e)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x37b89f(0xd9),'a':_0x37b89f(0xa1)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x37b89f(0x121),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x37b89f(0x129),'a':_0x37b89f(0x2c1)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x37b89f(0x246),'a':_0x37b89f(0x1e0)},{'c':'pt','s':0x1,'lv':'💎','q':_0x37b89f(0x209),'a':_0x37b89f(0xdd)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x37b89f(0xd0),'a':_0x37b89f(0x29c)},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x37b89f(0xc3)},{'c':'pt','s':0x2,'lv':'💎','q':_0x37b89f(0x295),'a':_0x37b89f(0x17f)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':_0x37b89f(0xdf)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x37b89f(0x2b8),'a':_0x37b89f(0x12e)},{'c':'pt','s':0x3,'lv':'🔥','q':'消融实验怎么设计才有说服力？','a':_0x37b89f(0x200)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x37b89f(0xed),'a':_0x37b89f(0x27d)},{'c':'pt','s':0x3,'lv':'💎','q':_0x37b89f(0xe9),'a':_0x37b89f(0x10c)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x37b89f(0x29d),'a':_0x37b89f(0x226)},{'c':_0x37b89f(0x296),'s':0x0,'lv':'⭐','q':_0x37b89f(0x14a),'a':_0x37b89f(0xa0)},{'c':_0x37b89f(0x296),'s':0x0,'lv':'⭐','q':_0x37b89f(0x220),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x37b89f(0x296),'s':0x1,'lv':'⭐','q':_0x37b89f(0x23a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x37b89f(0x296),'s':0x1,'lv':'🔥','q':_0x37b89f(0x268),'a':_0x37b89f(0x1d5)},{'c':'app','s':0x1,'lv':'⭐','q':_0x37b89f(0x1ef),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>粗排（向量/BM25\x20双塔）：query\x20和文档独立编码，快但交互浅，负责从万级候选召回\x20top\x2050。精排（reranker，如\x20bge-reranker）：query+文档拼起来过\x20cross-encoder\x20深度交互，慢但准，负责\x2050\x20选\x205。<b>经典\x20recall→precision\x20漏斗：用速度换召回，用精度换最终质量。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不直接全量\x20cross-encoder？”——每个文档一次前向，万级文档延迟扛不住；“低延迟场景怎么办？”——可以只粗排+业务规则，讲出这个权衡显示成本意识。““““““'},{'c':_0x37b89f(0x296),'s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x37b89f(0x291)},{'c':'app','s':0x2,'lv':'⭐','q':_0x37b89f(0x22a),'a':_0x37b89f(0x29a)},{'c':_0x37b89f(0x296),'s':0x3,'lv':'🔥','q':_0x37b89f(0x152),'a':_0x37b89f(0x118)},{'c':'app','s':0x3,'lv':'💎','q':_0x37b89f(0xe6),'a':_0x37b89f(0x127)},{'c':'app','s':0x4,'lv':'⭐','q':_0x37b89f(0x2df),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':_0x37b89f(0x296),'s':0x4,'lv':'⭐','q':_0x37b89f(0x15a),'a':_0x37b89f(0x12c)},{'c':'app','s':0x4,'lv':'🔥','q':_0x37b89f(0x112),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':_0x37b89f(0x296),'s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':_0x37b89f(0x115)},{'c':_0x37b89f(0x296),'s':0x5,'lv':'🔥','q':_0x37b89f(0x126),'a':_0x37b89f(0xd4)},{'c':_0x37b89f(0x296),'s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':_0x37b89f(0x18f)},{'c':_0x37b89f(0x296),'s':0x6,'lv':'⭐','q':_0x37b89f(0x238),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x37b89f(0x296),'s':0x6,'lv':'⭐','q':_0x37b89f(0xa3),'a':_0x37b89f(0x24c)},{'c':_0x37b89f(0x296),'s':0x6,'lv':'🔥','q':_0x37b89f(0x197),'a':_0x37b89f(0x2cb)},{'c':_0x37b89f(0x296),'s':0x6,'lv':'💎','q':'RAG\x20vs\x20微调：什么问题上哪个？','a':_0x37b89f(0x119)},{'c':'app','s':0x7,'lv':'⭐','q':_0x37b89f(0x2dc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Schema\x20Linking</b>：口语字段映射到真实表/列\x20→\x20schema\x20裁剪\x20+\x20字段别名库\x20+\x20RAG\x20检索注入\x20②\x20<b>业务口径</b>：“上月销量”的定义\x20→\x20口径说明库\x20+\x20few-shot\x20示例\x20③\x20<b>复杂逻辑</b>：多表\x20join/嵌套聚合\x20→\x20任务分解、分步生成\x20④\x20<b>可靠性</b>：语法校验\x20+\x20执行反馈修正循环\x20+\x20查询要素完备性检查\x20⑤\x20<b>安全</b>：只读限制、行列权限、注入防护、LIMIT\x20强制。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>每个难点都会再挖一层（见本节后续条目）——这一条的答法决定面试官往哪挖。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>数据随时能报：10\x20张表\x20/\x20307\x20字段\x20/\x20约\x2090\x20万行真实工业数据，SQL\x20可执行率\x2098%、人工校验正确率\x2096%——<b>并且能讲清两个口径的区别</b>。““““““'},{'c':_0x37b89f(0x296),'s':0x7,'lv':'🔥','q':_0x37b89f(0x2ee),'a':_0x37b89f(0x1f3)},{'c':'app','s':0x7,'lv':'⭐','q':_0x37b89f(0x90),'a':_0x37b89f(0x25b)},{'c':'app','s':0x7,'lv':'🔥','q':_0x37b89f(0x158),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>生成\x20SQL\x20→\x20语法校验\x20→\x20沙箱执行\x20→\x20报错或结果异常（空集、行数爆炸）→\x20<b>错误信息结构化回喂</b>模型重写\x20→\x20重试\x20N\x20轮封顶\x20→\x20仍失败则拒答/转人工。两个关键设计：错误信息要让模型知道“哪错了”（不是只说“错了”）；轮数必须封顶，防循环烧钱。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“会不会越改越错？”——会，所以封顶\x20+\x20保留初版对比；“提升多少？”——你项目里可执行率到\x2098%，很大程度靠这一环。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br>这套“生成-验证-修正”闭环和\x20OKC-SFT\x20的\x20Verification\x20字段是同一个思想：<b>让输出经过验证再交付</b>——两个项目在此交汇。““““““'},{'c':_0x37b89f(0x296),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x37b89f(0x283)},{'c':_0x37b89f(0x189),'s':0x0,'lv':'⭐','q':_0x37b89f(0x191),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':_0x37b89f(0x189),'s':0x0,'lv':'⭐','q':_0x37b89f(0x132),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型：单线程内由<b>事件循环</b>调度多个协程，遇到\x20await\x20就让出控制权、IO\x20完成后被唤醒——一个线程可承载上万并发连接。三个概念：coroutine（协程对象，不await\x20不执行）、Task（被调度的执行单元）、事件循环。<b>最大的坑</b>：在async\x20函数里调用<b>阻塞</b>操作（time.sleep、同步\x20requests、重CPU\x20计算）会卡死整个事件循环——必须换asyncio.sleep\x20/\x20httpx\x20/\x20aiohttp，或用\x20run_in_executor\x20丢到线程池。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么并发跑多个请求？”——asyncio.gather或\x20create_task；“怎么控制并发数？”——Semaphore\x20限流，防打爆下游模型服务。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Agent\x20里并发调多个工具、批量调LLM\x20都靠这套——能讲出Semaphore\x20限流就显工程经验。“““'},{'c':_0x37b89f(0x189),'s':0x0,'lv':'🔥','q':_0x37b89f(0x261),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>装饰器</b>本质是“函数包装函数”，@dec\x20等价于\x20f\x20=\x20dec(f)。带参数的装饰器是三层结构（参数层\x20→\x20装饰器层\x20→\x20wrapper\x20层），务必加\x20<b>functools.wraps</b>\x20保留原函数元信息。其他高频：<b>生成器</b>（yield，惰性求值省内存，处理大文件/流式响应必用）、<b>上下文管理器</b>（with\x20/\x20__enter__\x20__exit__，资源确保释放）、<b>深浅拷贝</b>（浅拷贝只复制容器、嵌套对象仍共享）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“默认参数用可变对象的坑？”——def\x20f(x=[])\x20所有调用共享同一个\x20list，经典\x20bug；“生成器和列表的区别？”——生成器不一次性占内存，适合流式；<b>LLM\x20流式输出（SSE）本质就是生成器</b>。“““'},{'c':_0x37b89f(0x189),'s':0x1,'lv':'⭐','q':_0x37b89f(0x1e4),'a':_0x37b89f(0x245)},{'c':_0x37b89f(0x189),'s':0x1,'lv':'🔥','q':_0x37b89f(0x194),'a':_0x37b89f(0xef)},{'c':_0x37b89f(0x189),'s':0x1,'lv':'🔥','q':_0x37b89f(0xbf),'a':_0x37b89f(0x1a7)},{'c':'eng','s':0x2,'lv':'⭐','q':_0x37b89f(0x1fd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>状态码：2xx成功（200/201/204）、4xx\x20客户端错（400\x20参数\x20/\x20401\x20未认证\x20/\x20403\x20无权限\x20/\x20404\x20/<b>429\x20限流</b>）、5xx\x20服务端错（500\x20/\x20502\x20网关\x20/\x20503\x20过载\x20/\x20<b>504\x20超时</b>）。幂等：GET/PUT/DELETE\x20幂等，POST\x20不幂等。<b>LLM\x20接口特有</b>：流式响应用\x20<b>SSE</b>（text/event-stream，单向、简单、比\x20WebSocket\x20更合适）；重试要配<b>指数退避</b>；遇\x20429\x20要排队降级而不是猛重试。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20WebSocket？”——LLM\x20输出是单向流，SSE\x20更轻、天然走\x20HTTP、易过代理；“超时怎么设？”——首token（TTFT）和总时长分别设，长任务改异步任务\x20+\x20轮询/回调。“““'},{'c':'eng','s':0x2,'lv':'🔥','q':_0x37b89f(0x185),'a':_0x37b89f(0x262)},{'c':_0x37b89f(0x189),'s':0x3,'lv':'🔥','q':_0x37b89f(0x181),'a':_0x37b89f(0x1f6)},{'c':_0x37b89f(0x189),'s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':'eng','s':0x3,'lv':'🔥','q':_0x37b89f(0x23b),'a':_0x37b89f(0x10e)},{'c':_0x37b89f(0x189),'s':0x4,'lv':'⭐','q':_0x37b89f(0x16c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':'eng','s':0x4,'lv':'🔥','q':_0x37b89f(0x154),'a':_0x37b89f(0x113)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x37b89f(0x1a3),'a':_0x37b89f(0x2a1)},{'c':_0x37b89f(0x189),'s':0x4,'lv':'💎','q':'系统设计题：多轮对话服务的状态怎么管','a':_0x37b89f(0x235)},{'c':_0x37b89f(0x189),'s':0x4,'lv':'💎','q':_0x37b89f(0x1f2),'a':_0x37b89f(0x249)},{'c':_0x37b89f(0x188),'s':0x0,'lv':'⭐','q':_0x37b89f(0x22f),'a':_0x37b89f(0x1e3)},{'c':'story','s':0x0,'lv':'⭐','q':'3\x20分钟自我介绍（现场面主版本）','a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':'story','s':0x1,'lv':'⭐','q':_0x37b89f(0x1eb),'a':_0x37b89f(0x1a8)},{'c':_0x37b89f(0x188),'s':0x1,'lv':'⭐','q':_0x37b89f(0xae),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好答案的三个特征：①难点是<b>技术判断</b>而非体力活②\x20有<b>具体的失败经历</b>（试过什么不行）③\x20有<b>可迁移的认知沉淀</b>。<br>模板：“最难的不是让它跑通，而是<b>让它稳定</b>。跑通只要prompt\x20调对就行，但真实用户的问法千奇百怪。我最开始\x20SQL\x20生成正确率只有\x20X左右，问题集中在字段映射错和口径理解错。我做了三件事：schema\x20裁剪、口径库\x20RAG\x20注入、执行反馈修正循环。<b>这件事让我明白\x20LLM\x20应用的核心工作量不在调用模型，而在给它建好约束与验证机制。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>最后那句<b>认知沉淀</b>是加分核心——它说明你能从具体项目里抽象出方法论。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>如果初期的具体数字你不记得，别编——说“早期版本明显不稳定，主要错在字段映射”比编一个假数字安全得多。“'},{'c':'story','s':0x2,'lv':'⭐','q':_0x37b89f(0x94),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':_0x37b89f(0x188),'s':0x2,'lv':'🔥','q':'NL2SQL\x20项目的十个必问追问（自检清单）','a':_0x37b89f(0x106)},{'c':_0x37b89f(0x188),'s':0x3,'lv':'⭐','q':_0x37b89f(0x219),'a':_0x37b89f(0x171)},{'c':_0x37b89f(0x188),'s':0x3,'lv':'🔥','q':_0x37b89f(0x1ba),'a':_0x37b89f(0x134)},{'c':'story','s':0x4,'lv':'
