<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

v':'🔥','q':_0x3a702a(0x32b),'a':_0x3a702a(0x3c3)},{'c':_0x3a702a(0x2ff),'s':0x2,'lv':'🔥','q':_0x3a702a(0x322),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>快慢指针</b>：fast\x20走\x202\x20步、slow\x20走\x201\x20步。①<b>判环（141）</b>：能相遇即有环，fast\x20到None\x20即无环\x20②\x20<b>找中点（876）</b>：fast\x20到尾时slow\x20在中点（回文链表\x20234、排序链表\x20148\x20的前置步骤）③\x20<b>找环入口（142）</b>：相遇后把一个指针放回\x20head，两指针<b>同速前进</b>，再次相遇处即入口（可用数学推导证明）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么同速走能找到入口？”——设头到入口\x20a、入口到相遇点\x20b、环长\x20c，可推出\x20a\x20=\x20c−b（模环长），所以两段等长；能推这个式子是加分项。““'},{'c':_0x3a702a(0x2ff),'s':0x3,'lv':'⭐','q':'滑动窗口：适用题型与固定模板','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>适用：<b>连续</b>子串/子数组，求满足某约束的最长/最短。模板：<br>for\x20right\x20in\x20range(n):<br>\u3000加入\x20s[right]\x20更新窗口状态<br>\u3000while\x20窗口不合法（或已满足）:移出\x20s[left];\x20left\x20+=\x201<br>\u3000更新答案<br>关键：窗口状态用哈希表/计数器维护，每个元素<b>最多进出各一次</b>\x20→\x20O(n)。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“最长和最短的模板差别？”——求最长：不合法时收缩，收缩后更新答案；求最短：满足时就收缩并在收缩过程中更新答案；“经典题？”——无重复字符最长子串（3）、最小覆盖子串（76）、找所有字母异位词（438）、水果成篮（904）。““'},{'c':_0x3a702a(0x2ff),'s':0x3,'lv':'🔥','q':_0x3a702a(0x37b),'a':_0x3a702a(0x282)},{'c':'code','s':0x3,'lv':'🔥','q':_0x3a702a(0x22c),'a':_0x3a702a(0x355)},{'c':'code','s':0x3,'lv':'🔥','q':_0x3a702a(0x248),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':_0x3a702a(0x2ff),'s':0x4,'lv':'⭐','q':_0x3a702a(0x2f8),'a':_0x3a702a(0x2d6)},{'c':_0x3a702a(0x2ff),'s':0x4,'lv':'🔥','q':_0x3a702a(0x2b9),'a':_0x3a702a(0x35c)},{'c':_0x3a702a(0x2ff),'s':0x5,'lv':'🔥','q':'手写线程安全队列与限流器','a':_0x3a702a(0x33e)},{'c':_0x3a702a(0x2ff),'s':0x5,'lv':'💎','q':_0x3a702a(0x2f6),'a':_0x3a702a(0x28f)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3a702a(0x3ff),'a':_0x3a702a(0x29b)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3a702a(0x1c4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x3a702a(0x2ea),'a':_0x3a702a(0x3d7)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x3a702a(0x1a0),'a':_0x3a702a(0x3ef)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x3a702a(0x3b9),'a':_0x3a702a(0x3b7)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x3a702a(0x356),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x3a702a(0x3df),'a':_0x3a702a(0x39a)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x3a702a(0x2f1),'a':_0x3a702a(0x1ce)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x3a702a(0x25c),'a':_0x3a702a(0x2a3)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x3a702a(0x395),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x3a702a(0x246),'a':_0x3a702a(0x23b)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x3a702a(0x345),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x3a702a(0x317),'a':_0x3a702a(0x2c2)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x3a702a(0x35e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x3a702a(0x1b5),'a':_0x3a702a(0x320)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x3a702a(0x299),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>数据并行（DDP）</b>：每卡一份完整模型、切数据、梯度\x20all-reduce\x20同步——最简单，通信量约等于模型大小。<b>张量并行</b>：层内切矩阵（Megatron），卡间每层都要通信，<b>只适合单机高带宽（NVLink）</b>。<b>流水线并行</b>：按层切成多段串行，有<b>气泡（bubble）</b>浪费，靠\x20micro-batch\x20缓解。<b>ZeRO</b>（DeepSpeed）：把优化器状态/梯度/参数依次分片到各卡（stage\x201/2/3），显存大幅下降，通信换显存。实践：大规模训练是<b>三种并行\x20+\x20ZeRO\x20的组合（3D\x20并行）</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“7B\x20微调该用什么？”——单卡\x20QLoRA\x20就够；多卡全量微调用\x20ZeRO-2/3\x20或\x20FSDP；“应用岗要懂到什么程度？”——<b>知道各自解决什么问题、什么时候选哪个</b>即可，再深属于Infra\x20岗范畴。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x3a702a(0x269),'a':_0x3a702a(0x2a4)},{'c':'ml','s':0x3,'lv':'💎','q':'量化：INT8\x20/\x20INT4\x20/\x20GPTQ\x20/\x20AWQ\x20一句话区分','a':_0x3a702a(0x24e)},{'c':_0x3a702a(0x366),'s':0x0,'lv':'⭐','q':_0x3a702a(0x20f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x3a702a(0x366),'s':0x0,'lv':'⭐','q':_0x3a702a(0x1c9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x3a702a(0x366),'s':0x0,'lv':'🔥','q':_0x3a702a(0x2dc),'a':_0x3a702a(0x2a2)},{'c':'llm','s':0x0,'lv':'🔥','q':_0x3a702a(0x329),'a':_0x3a702a(0x1ad)},{'c':_0x3a702a(0x366),'s':0x1,'lv':'⭐','q':_0x3a702a(0x400),'a':_0x3a702a(0x36c)},{'c':_0x3a702a(0x366),'s':0x1,'lv':'🔥','q':_0x3a702a(0x3fd),'a':_0x3a702a(0x1f3)},{'c':_0x3a702a(0x366),'s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':_0x3a702a(0x26f)},{'c':_0x3a702a(0x366),'s':0x2,'lv':'⭐','q':_0x3a702a(0x281),'a':_0x3a702a(0x2e0)},{'c':_0x3a702a(0x366),'s':0x2,'lv':'⭐','q':_0x3a702a(0x379),'a':_0x3a702a(0x2ec)},{'c':_0x3a702a(0x366),'s':0x2,'lv':'💎','q':_0x3a702a(0x2e8),'a':_0x3a702a(0x22f)},{'c':'llm','s':0x3,'lv':'⭐','q':_0x3a702a(0x27c),'a':_0x3a702a(0x254)},{'c':_0x3a702a(0x366),'s':0x3,'lv':'🔥','q':_0x3a702a(0x199),'a':_0x3a702a(0x29a)},{'c':_0x3a702a(0x366),'s':0x4,'lv':'🔥','q':_0x3a702a(0x219),'a':_0x3a702a(0x2cb)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x3a702a(0x1a5),'a':_0x3a702a(0x32a)},{'c':_0x3a702a(0x366),'s':0x5,'lv':'🔥','q':_0x3a702a(0x2f2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>结论：loss\x20与参数量N、数据量\x20D、算力\x20C呈<b>幂律关系</b>，可预测——这才是敢投巨资训大模型的依据。<b>Chinchilla\x20的修正</b>：早期模型普遍“过大而欠训”，给定算力下\x20N\x20和\x20D\x20应<b>同比例增长</b>（经验值约\x2020\x20tokens/参数）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么现在的小模型比几年前的大模型强？”——按Chinchilla\x20之后的认知，用远超“最优比例”的数据量训小模型，虽然训练不最优但<b>推理成本低</b>，工业上更划算（Llama-3\x208B\x20用了15T\x20tokens）；“Scaling\x20会撞墙吗？”——高质量数据是当前主要约束，业界转向后训练与推理时计算（test-time\x20compute）找增量。““““““'},{'c':_0x3a702a(0x366),'s':0x5,'lv':'🔥','q':_0x3a702a(0x373),'a':_0x3a702a(0x38f)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x3a702a(0x25b),'a':_0x3a702a(0x306)},{'c':'llm','s':0x5,'lv':'💎','q':_0x3a702a(0x3fb),'a':_0x3a702a(0x1d8)},{'c':_0x3a702a(0x366),'s':0x5,'lv':'🔥','q':_0x3a702a(0x3f0),'a':_0x3a702a(0x206)},{'c':'llm','s':0x6,'lv':'⭐','q':_0x3a702a(0x261),'a':_0x3a702a(0x2ce)},{'c':_0x3a702a(0x366),'s':0x6,'lv':'🔥','q':_0x3a702a(0x19c),'a':_0x3a702a(0x229)},{'c':_0x3a702a(0x366),'s':0x7,'lv':'⭐','q':'幻觉的成因与全链路缓解手段','a':_0x3a702a(0x388)},{'c':_0x3a702a(0x366),'s':0x7,'lv':'🔥','q':_0x3a702a(0x31f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x3a702a(0x366),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x3a702a(0x398)},{'c':_0x3a702a(0x366),'s':0x7,'lv':'💎','q':_0x3a702a(0x267),'a':_0x3a702a(0x1b9)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x3a702a(0x19a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>马尔可夫决策过程\x20MDP\x20=\x20⟨S,\x20A,\x20P,\x20R,\x20γ⟩：状态空间、动作空间、状态转移概率、奖励函数、折扣因子。<b>马尔可夫性</b>：下一状态只依赖当前状态和动作，与更早历史无关。目标：学一个策略\x20π(a|s)\x20最大化<b>期望累积折扣回报</b>\x20G_t\x20=\x20Σ\x20γᵏ\x20r_{t+k}。γ\x20控制远视程度（0只看眼前，接近\x201\x20极度远视）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“RL\x20和监督学习的本质区别？”——监督学习有标准答案（每步都告诉你对不对），RL\x20只有<b>延迟且稀疏的标量奖励</b>，且数据分布由自己的策略决定（非i.i.d.）；“为什么要折扣？”——保证无限期回报收敛，同时表达对时间的偏好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把\x20LLM\x20生成套进这个框架：状态=已生成的上下文，动作=下一个\x20token，奖励=整段回答的人类偏好分——这就是\x20RLHF\x20的建模方式。这句话能一秒证明你不是死记概念。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x3a702a(0x2e3),'a':_0x3a702a(0x1f4)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x3a702a(0x31d),'a':_0x3a702a(0x295)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x3a702a(0x3bb)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x3a702a(0x351),'a':_0x3a702a(0x334)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x3a702a(0x2eb),'a':_0x3a702a(0x403)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x3a702a(0x3ec),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3a702a(0x1fd),'a':_0x3a702a(0x1f7)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3a702a(0x34d),'a':_0x3a702a(0x1d0)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x3a702a(0x2af),'a':_0x3a702a(0x1c1)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x3a702a(0x3d4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一条主线：<b>不断削减对辅助模型和在线采样的依赖</b>。PPO：完整\x20RL，要\x20actor+critic+RM+reference\x20四模型，效果强但工程重。DPO：把奖励解析掉，<b>去掉\x20RM\x20和\x20RL\x20循环</b>，变离线监督学习——便宜稳定，但没探索。GRPO：保留在线\x20RL\x20的探索能力，但<b>去掉\x20critic</b>，用组内相对优势\x20+\x20可验证奖励——在推理任务上取得突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“实际项目怎么选？”——数据是成对偏好、要快出结果\x20→\x20DPO；任务有自动可验证的正确性（代码/数学/SQL）→\x20GRPO\x20类方法；有充足算力和标注团队要做通用对齐\x20→\x20PPO。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把NL2SQL\x20接进来：<b>“SQL\x20的执行结果是天然的可验证奖励信号——这个任务其实非常适合\x20GRPO\x20类方法，是我这个项目下一步最有价值的延伸方向。”</b>这句话把项目、RL\x20知识、技术前瞻三者串起来，是能让面试官眼睛一亮的答案。““““““'},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':_0x3a702a(0x27f)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x3a702a(0x235),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x3a702a(0x1a9),'a':_0x3a702a(0x1b0)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20在解决什么问题？天花板在哪？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x3a702a(0x2ae),'a':_0x3a702a(0x2cf)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3a702a(0x30a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3a702a(0x3ac),'a':_0x3a702a(0x260)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x3a702a(0x2ef),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x3a702a(0x1b6),'a':_0x3a702a(0x23d)},{'c':'pt','s':0x1,'lv':'⭐','q':'QLoRA：在\x20LoRA\x20之上又省了什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x3a702a(0x1e9),'a':_0x3a702a(0x3fc)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x3a702a(0x28e),'a':_0x3a702a(0x301)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x3a702a(0x3c5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x3a702a(0x21e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Adapter</b>：层间插入小瓶颈网络——有效但增加推理延迟（不能合并）。<b>Prefix/Prompt\x20Tuning</b>：只训一小段可学习的虚拟token\x20前缀——参数极少但占用上下文长度、效果不稳。<b>LoRA</b>：低秩旁路，可合并零延迟——事实标准。<b>DoRA</b>：把\x20ΔW\x20分解为幅度和方向分别学习，效果优于\x20LoRA\x20且同样可合并。<b>AdaLoRA</b>：动态给不同层分配不同\x20rank。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20LoRA\x20赢了？”——可合并（零推理开销）+\x20效果接近全量\x20+\x20实现简单\x20+\x20可热插拔，四点齐备。“““““'},{'c':'pt','s':0x2,'lv':'⭐','q':_0x3a702a(0x36e),'a':_0x3a702a(0x3b8)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x3a702a(0x386),'a':_0x3a702a(0x21b)},{'c':'pt','s':0x2,'lv':'💎','q':_0x3a702a(0x23e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x3a702a(0x364),'a':_0x3a702a(0x381)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x3a702a(0x3af)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x3a702a(0x1d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x3a702a(0x2f3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>通用</b>：MMLU/CMMLU/C-Eval（知识问答）。<b>代码</b>：HumanEval/MBPP（pass@k）。<b>推理</b>：GSM8K/MATH。<b>对话</b>：MT-Bench、AlpacaEval（LLM\x20裁判\x20+\x20人类偏好）。<b>长文本</b>：needle-in-haystack、RULER。<b>陷阱</b>：①\x20<b>数据污染</b>——基准题进了训练集，跑分虚高（要做去污染检查）②\x20<b>刷榜≠好用</b>——针对基准优化的模型在真实业务上未必强③\x20单一指标掩盖问题（平均分高但某类任务崩）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么检查污染？”——n-gram\x20重叠检测、基准题的困惑度异常低是信号；“更可信的做法？”——<b>自建贴合业务的私有评测集</b>，这是工业界的共识。“““““'},{'c':'pt','s':0x3,'lv':'💎','q':_0x3a702a(0x34c),'a':_0x3a702a(0x310)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x3a702a(0x20c),'a':_0x3a702a(0x1d9)},{'c':'app','s':0x0,'lv':'⭐','q':_0x3a702a(0x3c0),'a':_0x3a702a(0x3a0)},{'c':'app','s':0x0,'lv':'⭐','q':_0x3a702a(0x341),'a':_0x3a702a(0x2da)},{'c':'app','s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x3a702a(0x1e4)},{'c':_0x3a702a(0x18c),'s':0x1,'lv':'🔥','q':_0x3a702a(0x239),'a':_0x3a702a(0x38c)},{'c':_0x3a702a(0x18c),'s':0x1,'lv':'⭐','q':_0x3a702a(0x28b),'a':_0x3a702a(0x25d)},{'c':'app','s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x3a702a(0x255)},{'c':'app','s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x3a702a(0x18c),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x3a702a(0x285)},{'c':'app','s':0x3,'lv':'💎','q':_0x3a702a(0x1a2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x3a702a(0x18c),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':_0x3a702a(0x35b)},{'c':_0x3a702a(0x18c),'s':0x4,'lv':'⭐','q':_0x3a702a(0x3a8),'a':_0x3a702a(0x319)},{'c':_0x3a702a(0x18c),'s':0x4,'lv':'🔥','q':_0x3a702a(0x18d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':_0x3a702a(0x232),'a':_0x3a702a(0x27b)},{'c':_0x3a702a(0x18c),'s':0x5,'lv':'🔥','q':_0x3a702a(0x3a1),'a':_0x3a702a(0x241)},{'c':_0x3a702a(0x18c),'s':0x5,'lv':'💎','q':_0x3a702a(0x378),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x3a702a(0x18c),'s':0x6,'lv':'⭐','q':'结构化输出怎么保证？（JSON\x20总是不合法怎么办）','a':_0x3a702a(0x1b3)},{'c':_0x3a702a(0x18c),'s':0x6,'lv':'⭐','q':_0x3a702a(0x360),'a':_0x3a702a(0x2ba)},{'c':_0x3a702a(0x18c),'s':0x6,'lv':'🔥','q':'LLM\x20应用上线后：可观测性与成本怎么管？','a':_0x3a702a(0x1e6)},{'c':_0x3a702a(0x18c),'s':0x6,'lv':'💎','q':_0x3a702a(0x3ea),'a':_0x3a702a(0x25f)},{'c':_0x3a702a(0x18c),'s':0x7,'lv':'⭐','q':_0x3a702a(0x1f8),'a':_0x3a702a(0x271)},{'c':_0x3a702a(0x18c),'s':0x7,'lv':'🔥','q':_0x3a702a(0x318),'a':_0x3a702a(0x39c)},{'c':_0x3a702a(0x18c),'s':0x7,'lv':'⭐','q':'可执行率\x20vs\x20正确率：评估口径必须讲清','a':_0x3a702a(0x1b4)},{'c':_0x3a702a(0x18c),'s':0x7,'lv':'🔥','q':_0x3a702a(0x333),'a':_0x3a702a(0x390)},{'c':_0x3a702a(0x18c),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x3a702a(0x22b)},{'c':'eng','s':0x0,'lv':'⭐','q':_0x3a702a(0x2aa),'a':_0x3a702a(0x245)},{'c':_0x3a702a(0x1ba),'s':0x0,'lv':'⭐','q':_0x3a702a(0x1a1),'a':_0x3a702a(0x236)},{'c':_0x3a702a(0x1ba),'s':0x0,'lv':'🔥','q':_0x3a702a(0x198),'a':_0x3a702a(0x244)},{'c':_0x3a702a(0x1ba),'s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':_0x3a702a(0x1ba),'s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':_0x3a702a(0x1ef)},{'c':_0x3a702a(0x1ba),'s':0x1,'lv':'🔥','q':_0x3a702a(0x1b2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':'eng','s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>状态码：2xx成功（200/201/204）、4xx\x20客户端错（400\x20参数\x20/\x20401\x20未认证\x20/\x20403\x20无权限\x20/\x20404\x20/<b>429\x20限流</b>）、5xx\x20服务端错（500\x20/\x20502\x20网关\x20/\x20503\x20过载\x20/\x20<b>504\x20超时</b>）。幂等：GET/PUT/DELETE\x20幂等，POST\x20不幂等。<b>LLM\x20接口特有</b>：流式响应用\x20<b>SSE</b>（text/event-stream，单向、简单、比\x20WebSocket\x20更合适）；重试要配<b>指数退避</b>；遇\x20429\x20要排队降级而不是猛重试。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20WebSocket？”——LLM\x20输出是单向流，SSE\x20更轻、天然走\x20HTTP、易过代理；“超时怎么设？”——首token（TTFT）和总时长分别设，长任务改异步任务\x20+\x20轮询/回调。“““'},{'c':_0x3a702a(0x1ba),'s':0x2,'lv':'🔥','q':'幂等性与重试：可靠性的地基','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':_0x3a702a(0x1ba),'s':0x3,'lv':'🔥','q':_0x3a702a(0x367),'a':_0x3a702a(0x300)},{'c':_0x3a702a(0x1ba),'s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':_0x3a702a(0x344)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x3a702a(0x384),'a':_0x3a702a(0x2dd)},{'c':_0x3a702a(0x1ba),'s':0x4,'lv':'⭐','q':_0x3a702a(0x39f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x3a702a(0x1ba),'s':0x4,'lv':'🔥','q':_0x3a702a(0x3f7),'a':_0x3a702a(0x374)},{'c':_0x3a702a(0x1ba),'s':0x4,'lv':'🔥','q':'服务性能：QPS、延迟指标与瓶颈定位','a':_0x3a702a(0x2c5)},{'c':'eng','s':0x4,'lv':'💎','q':_0x3a702a(0x30c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心原则：<b>应用层无状态，会话状态外置</b>（Redis\x20存活跃会话\x20+\x20数据库落历史），这样服务可水平扩展、重启不丢会话。状态内容分层：结构化状态（当前任务、已确认参数）+\x20消息历史（可摘要压缩）+\x20用户画像（长期记忆，向量化）。要设计：会话\x20TTL、历史长度上限与压缩策略、并发同一会话的加锁、以及<b>敏感数据的存储与清理策略</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“历史太长怎么办？”——滑窗\x20+\x20摘要\x20+\x20结构化状态三层策略（见第六章\x206.6）；“怎么支持“重新生成”？”——保存每轮的请求快照（含检索结果和\x20prompt），才能可复现地重跑。“““'},{'c':'eng','s':0x4,'lv':'💎','q':'数据与隐私：私有化部署要注意什么','a':_0x3a702a(0x1c3)},{'c':_0x3a702a(0x3a4),'s':0x0,'lv':'⭐','q':_0x3a702a(0x3ce),'a':_0x3a702a(0x24b)},{'c':_0x3a702a(0x3a4),'s':0x0,'lv':'⭐','q':_0x3a702a(0x2cc),'a':_0x3a702a(0x331)},{'c':'story','s':0x1,'lv':'⭐','q':_0x3a702a(0x224),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>面试官挖项目，本质在问五件事，按这个顺序主动交付：<br>①\x20<b>背景与目标</b>——谁的痛点、为什么值得做、你的角色<br>②\x20<b>难点</b>——技术上最难的\x202-3\x20点（不是“工作量大”，是<b>技术判断难</b>）<br>③\x20<b>权衡</b>——你考虑过哪些方案、为什么选这个、放弃了什么（<b>这一层最能区分候选人</b>）<br>④\x20<b>数据</b>——效果指标\x20+\x20口径\x20+\x20怎么测的<br>⑤\x20<b>复盘</b>——哪里做得不好、如果重做会怎么改<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>大多数候选人只讲\x20①②④，<b>而面试官真正想听的是\x20③\x20和\x20⑤</b>——它们证明你有技术判断力和反思能力，不是执行工具。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“你遇到最大的困难”时，答“数据太少/时间太紧”是废答案；要答<b>技术性困难\x20+\x20你的解法+\x20学到什么</b>。“'},{'c':_0x3a702a(0x3a4),'s':0x1,'lv':'⭐','q':'“这个项目最难的是什么”——通用高分答法','a':_0x3a702a(0x34e)},{'c':_0x3a702a(0x3a4),'s':0x2,'lv':'⭐','q':_0x3a702a(0x377),'a':_0x3a702a(0x3a9)},{'c':'story','s':0x2,'lv':'🔥','q':_0x3a702a(0x35d),'a':_0x3a702a(0x3cf)},{'c':_0x3a702a(0x3a4),'s':0x3,'lv':'⭐','q':_0x3a702a(0x389),'a':_0x3a702a(0x353)},{'c':_0x3a702a(0x3a4),'s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':_0x3a702a(0x313)},{'c':_0x3a702a(0x3a4),'s':0x4,'lv':'⭐','q':_0x3a702a(0x2c6),'a':_0x3a702a(0x3a6)},{'c':_0x3a702a(0x3a4),'s':0x4,'lv':'⭐','q':_0x3a702a(0x39d),'a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+
