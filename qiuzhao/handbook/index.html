<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

_0x350de5(0x10f)},{'c':'code','s':0x1,'lv':'🔥','q':'排序算法对比与稳定性','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>快排</b>：平均\x20n\x20log\x20n、原地、不稳定——通用首选。<b>归并</b>：稳定\x20n\x20log\x20n、需\x20O(n)\x20空间——<b>链表排序首选</b>（链表归并不需额外空间），也是求逆序对的载体。<b>堆排</b>：n\x20log\x20n、原地、不稳定——适合\x20TopK\x20和优先队列。<b>计数/桶排</b>：值域小时可到\x20O(n)。稳定性含义：相等元素的相对顺序不变——多字段排序（先按\x20A\x20再按\x20B）时必须用稳定排序。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Python\x20的\x20sorted\x20是什么？”——Timsort，归并+插入的混合，<b>稳定</b>；“什么时候必须稳定？”——多轮排序保留前一轮结果时。““'},{'c':'code','s':0x2,'lv':'⭐','q':_0x350de5(0x19d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>迭代</b>（首选，O(1)\x20空间）：prev=None,\x20cur=head；循环内四步固定顺序——nxt=cur.next\x20→\x20cur.next=prev\x20→\x20prev=cur\x20→\x20cur=nxt；返回\x20prev。<b>递归</b>：newHead=reverse(head.next)，然后\x20head.next.next=head、head.next=None，返回newHead。<b>K\x20个一组（LeetCode\x2025，困难高频）</b>：用哨兵节点\x20+\x20每次先探测是否够\x20k\x20个，够则反转该段并接回，注意保存段前驱和段尾。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“递归空间复杂度？”——O(n)\x20栈深度，长链表可能爆栈；“怎么少出错？”——<b>画图+\x20用哨兵节点（dummy\x20head）消除头节点特判</b>，这是链表题通用降错技巧。““'},{'c':_0x350de5(0x21a),'s':0x2,'lv':'⭐','q':_0x350de5(0x23a),'a':_0x350de5(0xa5)},{'c':_0x350de5(0x21a),'s':0x2,'lv':'🔥','q':_0x350de5(0x2d0),'a':_0x350de5(0x248)},{'c':'code','s':0x2,'lv':'🔥','q':_0x350de5(0x1ee),'a':_0x350de5(0xe9)},{'c':_0x350de5(0x21a),'s':0x3,'lv':'⭐','q':_0x350de5(0x1df),'a':_0x350de5(0x258)},{'c':_0x350de5(0x21a),'s':0x3,'lv':'🔥','q':_0x350de5(0x233),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>单调栈</b>解决“找下一个/上一个更大或更小元素”：维护栈内单调递减（找更大），新元素把栈顶比它小的都弹出，<b>被弹出元素的“下一个更大元素”就是当前元素</b>。每元素进出各一次\x20→\x20O(n)。<b>单调队列</b>（双端队列）解决<b>滑动窗口最大值（239）</b>：队首保持最大，入队时从尾部弹掉比自己小的，出窗口时从队首弹掉过期下标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“经典题？”——每日温度（739）、柱状图中最大的矩形（84）、接雨水（42）、去除重复字母（316）；“怎么判断该用单调栈？”——题目问“最近的更大/更小”或涉及“以某元素为最值的最大区间”。““'},{'c':'code','s':0x3,'lv':'🔥','q':_0x350de5(0x1ea),'a':_0x350de5(0x203)},{'c':_0x350de5(0x21a),'s':0x3,'lv':'🔥','q':_0x350de5(0x300),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':'code','s':0x4,'lv':'⭐','q':_0x350de5(0x1fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（先说四步再写代码）</span><br>①\x20<b>状态定义</b>（dp[i]\x20表示什么，说清楚）②\x20<b>转移方程</b>\x20③\x20<b>初始化与边界</b>\x20④\x20<b>遍历顺序</b>。<b>0-1\x20背包</b>：dp[i][w]=max(不选\x20i,\x20选\x20i)，空间压成一维时<b>容量必须逆序遍历</b>（防同一物品被重复选）。<b>编辑距离（72）</b>：dp[i][j]=word1\x20前\x20i\x20个变成\x20word2\x20前\x20j\x20个的最小操作数；字符相等取\x20dp[i−1][j−1]，否则\x20min(插入,\x20删除,\x20替换)+1。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么想到状态定义？”——从“最后一步怎么来的”倒推；“其他高频？”——最长递增子序列（300，含二分优化\x20O(n\x20log\x20n)）、最长公共子序列、打家劫舍、股票买卖系列。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试时<b>先口述四步再动手写</b>——直接闷头写代码，写错了面试官也不知道你会不会。““'},{'c':_0x350de5(0x21a),'s':0x4,'lv':'🔥','q':_0x350de5(0x17c),'a':_0x350de5(0xf0)},{'c':_0x350de5(0x21a),'s':0x5,'lv':'🔥','q':'手写线程安全队列与限流器','a':_0x350de5(0xcb)},{'c':_0x350de5(0x21a),'s':0x5,'lv':'💎','q':'刷题策略：时间有限该怎么刷','a':_0x350de5(0x283)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x350de5(0xff),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':'梯度消失\x20/\x20爆炸：成因与五种对策','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x350de5(0x1a2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Adam\x20=\x20<b>一阶动量</b>（梯度的指数滑动平均，平滑方向）+\x20<b>二阶动量</b>（梯度平方的滑动平均，做逐参数自适应步长）+\x20偏差修正。优势：收敛快、对超参不敏感、稀疏梯度友好——大模型默认选择。<b>代价（必背算术）</b>：每个参数多存两个\x20fp32\x20状态\x20=\x208\x20字节；加上\x20fp32\x20主权重和梯度，全量微调约\x20<b>16\x20字节/参数</b>，7B\x20就是\x20112GB\x20量级——这是“7B\x20全量微调必须多卡、单卡只能\x20LoRA”的根本原因。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“AdamW\x20和\x20Adam\x20的区别？”——AdamW\x20把\x20weight\x20decay\x20从梯度里<b>解耦</b>出来直接作用于权重，正则效果更正确，是现在的标准；“SGD\x20还有用吗？”——CV\x20里精调有时泛化更好，但LLM\x20场景几乎全用\x20AdamW。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这笔账直接支撑你选\x20QLoRA\x20的理由——见第三章「参数量与显存估算」。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':'为什么要\x20warmup\x20+\x20cosine\x20decay？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Warmup</b>：训练初期参数远离最优、梯度噪声大（Adam\x20的二阶统计量还没攒够、估计不准），直接用大\x20lr\x20会震荡或发散；先用几百到几千步<b>线性升到峰值</b>。<b>Cosine\x20decay</b>：后期平滑降到接近零，让模型沉淀进更平坦的极小值，泛化更好。大模型\x20SFT\x20典型配置：warmup\x20ratio\x203%、cosine\x20衰减到峰值的\x2010%。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“不warmup\x20会怎样？”——常见现象是前几十步\x20loss\x20飙升甚至\x20NaN；“为什么不降到\x200？”——留一点残余\x20lr\x20避免完全停止学习，也便于后续继续训练。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x350de5(0x309),'a':_0x350de5(0x2b2)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x350de5(0x249),'a':_0x350de5(0x11e)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x350de5(0x2b1),'a':_0x350de5(0x2a7)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x350de5(0x159),'a':_0x350de5(0x2ab)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x350de5(0x301),'a':_0x350de5(0x2ad)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x350de5(0x120)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x350de5(0x275),'a':_0x350de5(0x14e)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x350de5(0x1db),'a':_0x350de5(0x26b)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x350de5(0x257),'a':_0x350de5(0x215)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x350de5(0x25f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x350de5(0xe5),'a':_0x350de5(0x17d)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x350de5(0x2c6),'a':_0x350de5(0x16a)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x350de5(0xaf),'a':_0x350de5(0xa8)},{'c':'ml','s':0x3,'lv':'💎','q':_0x350de5(0xb5),'a':_0x350de5(0x292)},{'c':_0x350de5(0x27c),'s':0x0,'lv':'⭐','q':_0x350de5(0x178),'a':_0x350de5(0x172)},{'c':_0x350de5(0x27c),'s':0x0,'lv':'⭐','q':_0x350de5(0x2c3),'a':_0x350de5(0x273)},{'c':'llm','s':0x0,'lv':'🔥','q':'MHA\x20/\x20GQA\x20/\x20MQA\x20的区别与选择逻辑','a':_0x350de5(0x305)},{'c':_0x350de5(0x27c),'s':0x0,'lv':'🔥','q':_0x350de5(0x1fb),'a':_0x350de5(0x1dd)},{'c':'llm','s':0x1,'lv':'⭐','q':_0x350de5(0x2bd),'a':_0x350de5(0xa2)},{'c':_0x350de5(0x27c),'s':0x1,'lv':'🔥','q':_0x350de5(0x2fa),'a':_0x350de5(0x268)},{'c':_0x350de5(0x27c),'s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':_0x350de5(0x25c)},{'c':_0x350de5(0x27c),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x350de5(0x148)},{'c':_0x350de5(0x27c),'s':0x2,'lv':'⭐','q':_0x350de5(0x282),'a':_0x350de5(0x125)},{'c':_0x350de5(0x27c),'s':0x2,'lv':'💎','q':_0x350de5(0x2f1),'a':_0x350de5(0xac)},{'c':_0x350de5(0x27c),'s':0x3,'lv':'⭐','q':_0x350de5(0x1b6),'a':_0x350de5(0x11c)},{'c':_0x350de5(0x27c),'s':0x3,'lv':'🔥','q':'数值稳定的\x20softmax\x20与\x20logsumexp','a':_0x350de5(0x22c)},{'c':_0x350de5(0x27c),'s':0x4,'lv':'🔥','q':_0x350de5(0xba),'a':_0x350de5(0x29a)},{'c':_0x350de5(0x27c),'s':0x4,'lv':'🔥','q':_0x350de5(0x2dc),'a':_0x350de5(0x10c)},{'c':_0x350de5(0x27c),'s':0x5,'lv':'🔥','q':_0x350de5(0x2d2),'a':_0x350de5(0x2ee)},{'c':_0x350de5(0x27c),'s':0x5,'lv':'🔥','q':_0x350de5(0xdf),'a':_0x350de5(0x1fa)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x350de5(0xf2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':'llm','s':0x5,'lv':'💎','q':_0x350de5(0x105),'a':_0x350de5(0x29e)},{'c':_0x350de5(0x27c),'s':0x5,'lv':'🔥','q':_0x350de5(0x2d5),'a':_0x350de5(0x166)},{'c':_0x350de5(0x27c),'s':0x6,'lv':'⭐','q':_0x350de5(0x1c6),'a':_0x350de5(0x1d5)},{'c':_0x350de5(0x27c),'s':0x6,'lv':'🔥','q':_0x350de5(0x29b),'a':_0x350de5(0x2df)},{'c':_0x350de5(0x27c),'s':0x7,'lv':'⭐','q':_0x350de5(0x26a),'a':_0x350de5(0x19e)},{'c':_0x350de5(0x27c),'s':0x7,'lv':'🔥','q':_0x350de5(0x1f0),'a':_0x350de5(0xb4)},{'c':'llm','s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x350de5(0xd2)},{'c':_0x350de5(0x27c),'s':0x7,'lv':'💎','q':_0x350de5(0x25b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>现象：某些能力（多步推理、指令遵循）在模型规模跨过阈值后<b>突然出现</b>，小模型上几乎为零。<b>争议</b>：有研究指出“涌现”很大程度是<b>评测指标不连续</b>造成的错觉——用严格的0/1\x20精确匹配会看到突变，换成连续指标（token\x20级编辑距离、logprob）曲线其实是平滑上升的。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“这个争议对工程有什么意义？”——提醒你<b>指标设计会塑造你看到的结论</b>：评估设计不当会误判模型能力的进步与退化。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>直接呼应你论文里的评测体系——结构完整率、关键点覆盖率这类连续指标，比单一的“对/错”更能看清模型在哪一段变好了。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>马尔可夫决策过程\x20MDP\x20=\x20⟨S,\x20A,\x20P,\x20R,\x20γ⟩：状态空间、动作空间、状态转移概率、奖励函数、折扣因子。<b>马尔可夫性</b>：下一状态只依赖当前状态和动作，与更早历史无关。目标：学一个策略\x20π(a|s)\x20最大化<b>期望累积折扣回报</b>\x20G_t\x20=\x20Σ\x20γᵏ\x20r_{t+k}。γ\x20控制远视程度（0只看眼前，接近\x201\x20极度远视）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“RL\x20和监督学习的本质区别？”——监督学习有标准答案（每步都告诉你对不对），RL\x20只有<b>延迟且稀疏的标量奖励</b>，且数据分布由自己的策略决定（非i.i.d.）；“为什么要折扣？”——保证无限期回报收敛，同时表达对时间的偏好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>把\x20LLM\x20生成套进这个框架：状态=已生成的上下文，动作=下一个\x20token，奖励=整段回答的人类偏好分——这就是\x20RLHF\x20的建模方式。这句话能一秒证明你不是死记概念。““““““'},{'c':'rl','s':0x0,'lv':'⭐','q':_0x350de5(0x1b4),'a':_0x350de5(0xd7)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x350de5(0x2c2),'a':_0x350de5(0x231)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':_0x350de5(0x183)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':'PPO：为什么它是工业标准？','a':_0x350de5(0x1d1)},{'c':'rl','s':0x2,'lv':'🔥','q':'on-policy\x20vs\x20off-policy：区别与影响','a':_0x350de5(0x1e4)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x350de5(0x199),'a':_0x350de5(0x2d6)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x350de5(0x234),'a':_0x350de5(0x16c)},{'c':'rl','s':0x3,'lv':'⭐','q':'GRPO：DeepSeek\x20为什么能扔掉\x20Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x350de5(0x295)},{'c':'rl','s':0x3,'lv':'💎','q':_0x350de5(0x22a),'a':_0x350de5(0x252)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x350de5(0x12e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x350de5(0x227),'a':_0x350de5(0x163)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x350de5(0x277),'a':_0x350de5(0xa0)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x350de5(0x167)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x350de5(0x1b8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x350de5(0x211),'a':_0x350de5(0x12c)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x350de5(0x123),'a':_0x350de5(0x133)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x350de5(0xc4),'a':_0x350de5(0x294)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x350de5(0x2bf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x350de5(0x193),'a':_0x350de5(0xdc)},{'c':'pt','s':0x1,'lv':'🔥','q':'灾难性遗忘：怎么发现、怎么缓解','a':_0x350de5(0x1e1)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x350de5(0x18e),'a':_0x350de5(0x182)},{'c':'pt','s':0x1,'lv':'💎','q':_0x350de5(0x140),'a':_0x350de5(0x10b)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x350de5(0x2ec),'a':_0x350de5(0x1ff)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x350de5(0x21d),'a':_0x350de5(0x1e2)},{'c':'pt','s':0x2,'lv':'💎','q':_0x350de5(0x12b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x350de5(0x10a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x350de5(0x2cb),'a':_0x350de5(0x264)},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x350de5(0x147)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x350de5(0x121),'a':_0x350de5(0x101)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x350de5(0x189),'a':_0x350de5(0x15b)},{'c':'pt','s':0x3,'lv':'💎','q':_0x350de5(0x232),'a':_0x350de5(0x269)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x350de5(0x272),'a':_0x350de5(0x106)},{'c':'app','s':0x0,'lv':'⭐','q':_0x350de5(0x28a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>离线建库：文档解析\x20→\x20清洗\x20→\x20切分\x20→\x20embedding\x20向量化\x20→\x20入向量库建索引。在线问答：query\x20改写\x20→\x20混合检索\x20→\x20rerank\x20精排\x20→\x20组装\x20prompt\x20→\x20LLM\x20生成\x20→\x20引用溯源展示。关键认知：<b>每一步独立可优化，评估时检索质量与生成质量必须分开归因</b>——分不清病灶就治不好病。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪一步最影响效果？”——多数场景是切分与检索（垃圾进垃圾出）；“延迟瓶颈在哪？”——生成占大头，检索是毫秒级。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目的知识库模块就是这个链路：字段口径\x20+\x20SQL\x20示例入库，按\x20query\x20检索注入生成过程。““““““'},{'c':_0x350de5(0x17e),'s':0x0,'lv':'⭐','q':_0x350de5(0x1c5),'a':_0x350de5(0x174)},{'c':_0x350de5(0x17e),'s':0x1,'lv':'⭐','q':_0x350de5(0x28c),'a':_0x350de5(0x137)},{'c':_0x350de5(0x17e),'s':0x1,'lv':'🔥','q':'为什么要混合检索（向量\x20+\x20BM25）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x2
