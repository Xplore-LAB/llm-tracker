<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

':_0x1033fc(0x1a7),'s':0x2,'lv':'🔥','q':'二叉树：遍历、层序与最近公共祖先','a':_0x1033fc(0x2ef)},{'c':_0x1033fc(0x1a7),'s':0x2,'lv':'🔥','q':_0x1033fc(0x391),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>快慢指针</b>：fast\x20走\x202\x20步、slow\x20走\x201\x20步。①<b>判环（141）</b>：能相遇即有环，fast\x20到None\x20即无环\x20②\x20<b>找中点（876）</b>：fast\x20到尾时slow\x20在中点（回文链表\x20234、排序链表\x20148\x20的前置步骤）③\x20<b>找环入口（142）</b>：相遇后把一个指针放回\x20head，两指针<b>同速前进</b>，再次相遇处即入口（可用数学推导证明）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么同速走能找到入口？”——设头到入口\x20a、入口到相遇点\x20b、环长\x20c，可推出\x20a\x20=\x20c−b（模环长），所以两段等长；能推这个式子是加分项。““'},{'c':_0x1033fc(0x1a7),'s':0x3,'lv':'⭐','q':_0x1033fc(0x399),'a':_0x1033fc(0x32a)},{'c':'code','s':0x3,'lv':'🔥','q':_0x1033fc(0x322),'a':_0x1033fc(0x2ba)},{'c':'code','s':0x3,'lv':'🔥','q':_0x1033fc(0x333),'a':_0x1033fc(0x36b)},{'c':_0x1033fc(0x1a7),'s':0x3,'lv':'🔥','q':_0x1033fc(0x14f),'a':_0x1033fc(0x1e1)},{'c':_0x1033fc(0x1a7),'s':0x4,'lv':'⭐','q':_0x1033fc(0x2dc),'a':_0x1033fc(0x240)},{'c':_0x1033fc(0x1a7),'s':0x4,'lv':'🔥','q':_0x1033fc(0x243),'a':_0x1033fc(0x1d3)},{'c':_0x1033fc(0x1a7),'s':0x5,'lv':'🔥','q':'手写线程安全队列与限流器','a':_0x1033fc(0x363)},{'c':_0x1033fc(0x1a7),'s':0x5,'lv':'💎','q':_0x1033fc(0x21a),'a':_0x1033fc(0x303)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x1033fc(0x15c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>链式法则\x20+\x20计算图缓存中间结果</b>：前向时保存每层激活值，反向时从损失出发逐层复用这些值算梯度。关键理解——它不是“再算一遍”，而是<b>用显存换时间</b>，把\x20O(参数量²)\x20的朴素求导降到一次反向遍历。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么占那么多显存？”——激活值要全部留到反向；序列越长、batch\x20越大越吃显存；“怎么省？”——<b>梯度检查点</b>（activation\x20checkpointing）：只存少量节点，反向时重算中间激活，<b>用算力换显存</b>，大模型训练必开。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>能说出“前向存激活、反向复用”和“检查点是反向交易”这两句，就超过大多数只会背链式法则的候选人。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x1033fc(0x1bd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x1033fc(0x233),'a':_0x1033fc(0x2e3)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x1033fc(0x16f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Warmup</b>：训练初期参数远离最优、梯度噪声大（Adam\x20的二阶统计量还没攒够、估计不准），直接用大\x20lr\x20会震荡或发散；先用几百到几千步<b>线性升到峰值</b>。<b>Cosine\x20decay</b>：后期平滑降到接近零，让模型沉淀进更平坦的极小值，泛化更好。大模型\x20SFT\x20典型配置：warmup\x20ratio\x203%、cosine\x20衰减到峰值的\x2010%。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“不warmup\x20会怎样？”——常见现象是前几十步\x20loss\x20飙升甚至\x20NaN；“为什么不降到\x200？”——留一点残余\x20lr\x20避免完全停止学习，也便于后续继续训练。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x1033fc(0x206),'a':_0x1033fc(0x388)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x1033fc(0x238),'a':_0x1033fc(0x294)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x1033fc(0x232),'a':_0x1033fc(0x2a6)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x1033fc(0x22a),'a':_0x1033fc(0x186)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x1033fc(0x169)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x1033fc(0x2b9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x1033fc(0x146),'a':_0x1033fc(0x2f8)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x1033fc(0x141),'a':_0x1033fc(0x334)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x1033fc(0x1b2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':'类别不平衡怎么处理','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x1033fc(0x36f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x1033fc(0x1f2),'a':_0x1033fc(0x32d)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x1033fc(0x200),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':'量化：INT8\x20/\x20INT4\x20/\x20GPTQ\x20/\x20AWQ\x20一句话区分','a':_0x1033fc(0x198)},{'c':_0x1033fc(0x2ec),'s':0x0,'lv':'⭐','q':_0x1033fc(0x33d),'a':_0x1033fc(0x2a9)},{'c':_0x1033fc(0x2ec),'s':0x0,'lv':'⭐','q':_0x1033fc(0x1c8),'a':_0x1033fc(0x235)},{'c':_0x1033fc(0x2ec),'s':0x0,'lv':'🔥','q':'MHA\x20/\x20GQA\x20/\x20MQA\x20的区别与选择逻辑','a':_0x1033fc(0x1c0)},{'c':_0x1033fc(0x2ec),'s':0x0,'lv':'🔥','q':_0x1033fc(0x221),'a':_0x1033fc(0x29a)},{'c':'llm','s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':_0x1033fc(0x30f)},{'c':_0x1033fc(0x2ec),'s':0x1,'lv':'🔥','q':_0x1033fc(0x1b3),'a':_0x1033fc(0x29e)},{'c':_0x1033fc(0x2ec),'s':0x1,'lv':'🔥','q':_0x1033fc(0x278),'a':_0x1033fc(0x27e)},{'c':_0x1033fc(0x2ec),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x1033fc(0x2ad)},{'c':_0x1033fc(0x2ec),'s':0x2,'lv':'⭐','q':_0x1033fc(0x31d),'a':_0x1033fc(0x350)},{'c':_0x1033fc(0x2ec),'s':0x2,'lv':'💎','q':_0x1033fc(0x2bf),'a':_0x1033fc(0x210)},{'c':_0x1033fc(0x2ec),'s':0x3,'lv':'⭐','q':_0x1033fc(0x205),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(logits/T)：T\x20大→分布变平（更随机多样），T\x20小→更尖锐（更确定），T→0\x20等价贪心。top-k：只在概率最高\x20k\x20个\x20token\x20里采样（固定截断）。<b>top-p（nucleus）</b>：取累积概率达\x20p\x20的最小\x20token\x20集合（动态截断，比\x20top-k\x20自适应）。工程经验：严肃任务（NL2SQL\x20/\x20代码\x20/\x20抽取）T=0~0.3；创作类\x200.7~1.0；<b>别同时激进调\x20T\x20和\x20top-p</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么复读？”——贪心/低温陷入局部最优形成循环，用\x20repetition_penalty\x20或适度提温；“T=0\x20一定可复现吗？”——不完全，浮点非确定性和批处理顺序会引入微小差异。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20用低温\x20+\x20结构约束，是“任务性质决定采样策略”的现成例子。““““““'},{'c':_0x1033fc(0x2ec),'s':0x3,'lv':'🔥','q':'数值稳定的\x20softmax\x20与\x20logsumexp','a':_0x1033fc(0x26b)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x1033fc(0x1cc),'a':_0x1033fc(0x223)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x1033fc(0x335),'a':_0x1033fc(0x316)},{'c':_0x1033fc(0x2ec),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':_0x1033fc(0x36d)},{'c':_0x1033fc(0x2ec),'s':0x5,'lv':'🔥','q':'为什么主流是\x20Decoder-only？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':_0x1033fc(0x2ec),'s':0x5,'lv':'🔥','q':_0x1033fc(0x361),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':'llm','s':0x5,'lv':'💎','q':_0x1033fc(0x1c5),'a':_0x1033fc(0x39a)},{'c':_0x1033fc(0x2ec),'s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':_0x1033fc(0x2b5)},{'c':'llm','s':0x6,'lv':'⭐','q':_0x1033fc(0x261),'a':_0x1033fc(0x1d2)},{'c':'llm','s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':_0x1033fc(0x358)},{'c':_0x1033fc(0x2ec),'s':0x7,'lv':'⭐','q':_0x1033fc(0x18f),'a':_0x1033fc(0x1af)},{'c':_0x1033fc(0x2ec),'s':0x7,'lv':'🔥','q':_0x1033fc(0x211),'a':_0x1033fc(0x395)},{'c':_0x1033fc(0x2ec),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':_0x1033fc(0x386)},{'c':_0x1033fc(0x2ec),'s':0x7,'lv':'💎','q':_0x1033fc(0x244),'a':_0x1033fc(0x282)},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x1033fc(0x1ce)},{'c':'rl','s':0x0,'lv':'⭐','q':'价值函数与贝尔曼方程','a':_0x1033fc(0x2c8)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x1033fc(0x2e2),'a':_0x1033fc(0x14d)},{'c':'rl','s':0x1,'lv':'💎','q':_0x1033fc(0x172),'a':_0x1033fc(0x23f)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x1033fc(0x30d),'a':_0x1033fc(0x393)},{'c':'rl','s':0x2,'lv':'🔥','q':'on-policy\x20vs\x20off-policy：区别与影响','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':'RLHF\x20三阶段与\x20PPO\x20在其中的位置','a':_0x1033fc(0x190)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x1033fc(0x311),'a':_0x1033fc(0x1de)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x1033fc(0x30b),'a':_0x1033fc(0x184)},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一条主线：<b>不断削减对辅助模型和在线采样的依赖</b>。PPO：完整\x20RL，要\x20actor+critic+RM+reference\x20四模型，效果强但工程重。DPO：把奖励解析掉，<b>去掉\x20RM\x20和\x20RL\x20循环</b>，变离线监督学习——便宜稳定，但没探索。GRPO：保留在线\x20RL\x20的探索能力，但<b>去掉\x20critic</b>，用组内相对优势\x20+\x20可验证奖励——在推理任务上取得突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“实际项目怎么选？”——数据是成对偏好、要快出结果\x20→\x20DPO；任务有自动可验证的正确性（代码/数学/SQL）→\x20GRPO\x20类方法；有充足算力和标注团队要做通用对齐\x20→\x20PPO。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把NL2SQL\x20接进来：<b>“SQL\x20的执行结果是天然的可验证奖励信号——这个任务其实非常适合\x20GRPO\x20类方法，是我这个项目下一步最有价值的延伸方向。”</b>这句话把项目、RL\x20知识、技术前瞻三者串起来，是能让面试官眼睛一亮的答案。““““““'},{'c':'rl','s':0x3,'lv':'💎','q':_0x1033fc(0x187),'a':_0x1033fc(0x17a)},{'c':'rl','s':0x4,'lv':'🔥','q':'奖励塑形与奖励黑客（游戏\x20RL\x20的核心难题）','a':_0x1033fc(0x25f)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x1033fc(0x360),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x1033fc(0x385),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x1033fc(0x25e),'a':_0x1033fc(0x2e7)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x1033fc(0x1dd),'a':_0x1033fc(0x2d5)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x1033fc(0x151),'a':_0x1033fc(0x1b9)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x1033fc(0x2ce),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x1033fc(0x321),'a':_0x1033fc(0x216)},{'c':'pt','s':0x1,'lv':'⭐','q':'QLoRA：在\x20LoRA\x20之上又省了什么？','a':_0x1033fc(0x283)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x1033fc(0x2d0),'a':_0x1033fc(0x1ba)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x1033fc(0x265),'a':_0x1033fc(0x18b)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x1033fc(0x325),'a':_0x1033fc(0x241)},{'c':'pt','s':0x1,'lv':'💎','q':_0x1033fc(0x255),'a':_0x1033fc(0x1fd)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x1033fc(0x159),'a':_0x1033fc(0x2be)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x1033fc(0x377),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x1033fc(0x222),'a':_0x1033fc(0x209)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x1033fc(0x324),'a':_0x1033fc(0x13f)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':_0x1033fc(0x27d)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x1033fc(0x1f0),'a':_0x1033fc(0x23b)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x1033fc(0x353),'a':_0x1033fc(0x35c)},{'c':'pt','s':0x3,'lv':'🔥','q':'常见评测基准与它们的陷阱','a':_0x1033fc(0x306)},{'c':'pt','s':0x3,'lv':'💎','q':'幻觉率怎么测？口径怎么定','a':_0x1033fc(0x2f3)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x1033fc(0x1cf),'a':_0x1033fc(0x20f)},{'c':_0x1033fc(0x173),'s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x1033fc(0x245)},{'c':'app','s':0x0,'lv':'⭐','q':_0x1033fc(0x1e7),'a':_0x1033fc(0x144)},{'c':_0x1033fc(0x173),'s':0x1,'lv':'⭐','q':_0x1033fc(0x1eb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x1033fc(0x173),'s':0x1,'lv':'🔥','q':_0x1033fc(0x17b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x1033fc(0x173),'s':0x1,'lv':'⭐','q':_0x1033fc(0x2c3),'a':_0x1033fc(0x387)},{'c':_0x1033fc(0x173),'s':0x2,'lv':'🔥','q':_0x1033fc(0x207),'a':_0x1033fc(0x24d)},{'c':_0x1033fc(0x173),'s':0x2,'lv':'⭐','q':_0x1033fc(0x30a),'a':_0x1033fc(0x330)},{'c':_0x1033fc(0x173),'s':0x3,'lv':'🔥','q':_0x1033fc(0x35d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':_0x1033fc(0x173),'s':0x3,'lv':'💎','q':_0x1033fc(0x18e),'a':_0x1033fc(0x22c)},{'c':_0x1033fc(0x173),'s':0x4,'lv':'⭐','q':_0x1033fc(0x171),'a':_0x1033fc(0x1e0)},{'c':'app','s':0x4,'lv':'⭐','q':_0x1033fc(0x2db),'a':_0x1033fc(0x35f)},{'c':'app','s':0x4,'lv':'🔥','q':_0x1033fc(0x296),'a':_0x1033fc(0x2a0)},{'c':_0x1033fc(0x173),'s':0x4,'lv':'🔥','q':_0x1033fc(0x375),'a':_0x1033fc(0x23c)},{'c':_0x1033fc(0x173),'s':0x5,'lv':'🔥','q':'多轮对话的上下文怎么管理？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':'app','s':0x5,'lv':'💎','q':_0x1033fc(0x183),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x1033fc(0x173),'s':0x6,'lv':'⭐','q':_0x1033fc(0x15d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':_0x1033fc(0x173),'s':0x6,'lv':'⭐','q':_0x1033fc(0x21b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>攻击面：用户输入或<b>检索到的内容</b>里藏指令（“忽略之前的指令……”），模型可能照办——RAG\x20场景里检索内容也是不可信输入。三层防线：<b>输入侧</b>（指令与数据分隔、可疑模式检测）→\x20<b>权限侧</b>（只读账号、最小权限、危险操作人审）→\x20<b>输出侧</b>（动作执行前校验、敏感操作二次确认）。核心认知：<b>prompt\x20层永远防不死，必须权限层兜底。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20SQL\x20注入的异同？”——同属“数据被当指令执行”，防御思路同源：参数化分隔\x20+\x20最小权限。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20的只读账号\x20+\x20LIMIT\x20强制\x20+\x20行列权限，就是权限层防线的现成案例。““““““'},{'c':'app','s':0x6,'lv':'🔥','q':_0x1033fc(0x37e),'a':_0x1033fc(0x300)},{'c':_0x1033fc(0x173),'s':0x6,'lv':'💎','q':_0x1033fc(0x38f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':_0x1033fc(0x173),'s':0x7,'lv':'⭐','q':_0x1033fc(0x24b),'a':_0x1033fc(0x1bc)},{'c':_0x1033fc(0x173),'s':0x7,'lv':'🔥','q':_0x1033fc(0x28e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':'app','s':0x7,'lv':'⭐','q':_0x1033fc(0x317),'a':_0x1033fc(0x2fb)},{'c':_0x1033fc(0x173),'s':0x7,'lv':'🔥','q':'执行反馈修正循环：怎么设计才不翻车？','a':_0x1033fc(0x257)},{'c':'app','s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x1033fc(0x2ee)},{'c':_0x1033fc(0x1c6),'s':0x0,'lv':'⭐','q':_0x1033fc(0x175),'a':_0x1033fc(0x343)},{'c':_0x1033fc(0x1c6),'s':0x0,'lv':'⭐','q':_0x1033fc(0x2d2),'a':_0x1033fc(0x27f)},{'c':_0x1033fc(0x1c6),'s':0x0,'lv':'🔥','q':_0x1033fc(0x164),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>装饰器</b>本质是“函数包装函数”，@dec\x20等价于\x20f\x20=\x20dec(f)。带参数的装饰器是三层结构（参数层\x20→\x20装饰器层\x20→\x20wrapper\x20层），务必加\x20<b>functools.wraps</b>\x20保留原函数元信息。其他高频：<b>生成器</b>（yield，惰性求值省内存，处理大文件/流式响应必用）、<b>上下文管理器</b>（with\x20/\x20__enter__\x20__exit__，资源确保释放）、<b>深浅拷贝</b>（浅拷贝只复制容器、嵌套对象仍共享）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“默认参数用可变对象的坑？”——def\x20f(x=[])\x20所有调用共享同一个\x20list，经典\x20bug；“生成器和列表的区别？”——生成器不一次性占内存，适合流式；<b>LLM\x20流式输出（SSE）本质就是生成器</b>。“““'},{'c':'eng','s':0x1,'lv':'⭐','q':_0x1033fc(0x1b7),'a':_0x1033fc(0x37f)},{'c':'eng','s':0x1,'lv':'🔥','q':_0x1033fc(0x1ae),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“幻读怎么解决？”——RR\x20下靠间隙锁（next-key\x20lock）；“分析型查询关心什么？”——你的场景主要是只读一致性快照，长事务会导致\x20undo\x20堆积，要注意。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>应用岗能讲清“四级别\x20+\x20MVCC\x20一句话\x20+\x20读写不互斥”就够，不必背锁的所有细节。“““'},{'c':_0x1033fc(0x1c6),'s':0x1,'lv':'🔥','q':_0x1033fc(0x26e),'a':_0x1033fc(0x2e5)},{'c':_0x1033fc(0x1c6),'s':0x2,'lv':'⭐','q':_0x1033fc(0x21d),'a':_0x1033fc(0x271)},{'c':_0x1033fc(0x1c6),'s':0x2,'lv':'🔥','q':_0x1033fc(0x274),'a':_0x1033fc(0x319)},{'c':_0x1033fc(0x1c6),'s':0x3,'lv':'🔥','q':_0x1033fc(0x362),'a':_0x1033fc(0x1a2)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x1033fc(0x310),'a':_0x1033fc(0x397)},{'c':_0x1033fc(0x1c6),'s':0x3,'lv':'🔥','q':_0x1033fc(0x307),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':_0x1033fc(0x1c6),'s':0x4,'lv':'⭐','q':_0x1033fc(0x20d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x1033fc(0x1c6),'s':0x4,'lv':'🔥','q':_0x1033fc(0x191),'a':_0x1033fc(0x1b1)},{'c':_0x1033fc(0x1c6),'s':0x4,'lv':'🔥','q':_0x1033fc(0x2f7),'a':_0x1033fc(0x382)},{'c':_0x1033fc(0x1c6),'s':0x4,'lv':'💎','q':_0x1033fc(0x22f),'a':_0x1033fc(0x177)},{'c':_0x1033fc(0x1c6),'s':0x4,'lv':'💎','q':_0x1033fc(0x367),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个层面：①\x20<b>数据不出域</b>——这正是私有化部署的核心诉求，模型、向量库、日志全部本地\x20②\x20<b>权限最小化</b>——服务账号只读、文档级\x20ACL\x20在检索时过滤、行列级数据权限\x20③\x20<b>日志脱敏</b>——prompt\x20和响应可能含敏感信息，记录前脱敏或加密，设保留期\x20④\x20<b>可审计</b>——谁在什么时候问了什么、系统给了什么依据，要可追溯。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么工业客户坚持私有化
