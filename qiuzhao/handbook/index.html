<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

=\x27lb\x27>◈\x20核心回答</span><br>做法：前向/反向用低精度（fp16/bf16）省显存加速，<b>权重主副本和优化器状态保\x20fp32</b>\x20保精度。<b>fp16</b>：尾数多、动态范围小\x20→\x20易上溢/下溢，必须配\x20<b>loss\x20scaling</b>（放大\x20loss\x20让小梯度不被舍入吃掉）。<b>bf16</b>：指数位与\x20fp32\x20相同（动态范围一样大）、尾数少\x20→\x20<b>基本不溢出、免\x20loss\x20scaling</b>，是当前大模型训练主流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“精度低了效果会掉吗？”——训练几乎无损（因为主副本是\x20fp32）；“fp8\x20呢？”——H100\x20起支持，训练已有实践，但需要更精细的缩放策略。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x15813f(0x2fa),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>梯度累积</b>：显存放不下大\x20batch\x20就拆成\x20N\x20个\x20micro-batch，梯度累加\x20N\x20次再\x20step——<b>等效于大\x20batch，代价是速度变慢</b>（通信/计算不变但串行）。注意\x20loss\x20要除以\x20N\x20保持尺度一致。<b>梯度裁剪</b>：把<b>全局梯度范数</b>（所有参数梯度拼成一个向量算\x20L2）clip\x20到阈值（通常\x201.0），防突发大梯度炸掉训练——大模型训练几乎必开。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“等效\x20batch\x20size\x20怎么算？”——micro_batch\x20×\x20累积步数\x20×\x20卡数；“裁剪逐参数还是全局？”——<b>全局范数</b>，逐参数裁剪会破坏梯度方向。““““'},{'c':'ml','s':0x1,'lv':'⭐','q':_0x15813f(0x31d),'a':_0x15813f(0x281)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x15813f(0xdd),'a':_0x15813f(0x25f)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>全零\x20→\x20所有神经元完全对称、收到相同梯度，永远学不出差异（对称性破坏失败）。<b>Xavier</b>：方差\x202/(fan_in+fan_out)，适配\x20tanh/sigmoid，保持前向后向方差稳定。<b>He</b>：方差\x202/fan_in，适配\x20ReLU\x20族——因为\x20ReLU\x20砍掉一半输出，方差要加倍补偿。大模型语境：初始化尺度还要按<b>深度缩放</b>（如输出投影按\x201/√(2N)\x20缩小），否则深层残差累积会让激活爆炸。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“初始化不当的症状？”——开局\x20loss\x20异常大或\x20NaN、或者\x20loss\x20长期不动；“为什么\x20LoRA\x20的\x20B\x20可以初始化为零？”——因为\x20A\x20是随机的，A·B\x20整体不为对称零，且这样保证起点\x20ΔW=0。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x15813f(0xe6),'a':_0x15813f(0xd4)},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':_0x15813f(0xd0)},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x15813f(0x15f)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x15813f(0x1da),'a':_0x15813f(0x27d)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x15813f(0x2d6),'a':_0x158 ²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':_0x15813f(0x180),'s':0x2,'lv':'⭐','q':_0x15813f(0x32f),'a':_0x15813f(0x15e)},{'c':_0x15813f(0x180),'s':0x2,'lv':'💎','q':_0x15813f(0x1df),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类：①\x20<b>批处理</b>——continuous\x20batching（vLLM，请求到达即插入，GPU\x20不空转，吞吐提升最大的单点）\x20②\x20<b>注意力与显存</b>——PagedAttention、FlashAttention、KV\x20量化\x20③\x20<b>模型压缩</b>——量化（GPTQ/AWQ权重量化、W8A8）、蒸馏、剪枝\x20④\x20<b>解码策略</b>——投机解码（小模型起草、大模型批量验证，无损加速）、Medusa\x20多头预测。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“先上哪个？”——先vLLM（continuous\x20batching\x20+\x20PagedAttention\x20开箱即得），再考虑量化；“投机解码为什么无损？”——验证阶段用大模型的分布做接受/拒绝采样，输出分布与原模型一致。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>应用岗到这个水位（知道名词\x20+\x20一句话原理\x20+\x20选型顺序）就够，别硬装Infra\x20深度——被追问\x20CUDA\x20实现会崩。““““““'},{'c':_0x15813f(0x180),'s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':_0x15813f(0x232)},{'c':_0x15813f(0x180),'s':0x3,'lv':'🔥','q':_0x15813f(0x152),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(x_i)=e^{x_i}/Σe^{x_j}，x\x20大时\x20e^x\x20上溢。稳定版：<b>先减\x20max</b>——e^{x_i-max}/Σe^{x_j-max}，数学等价、数值安全。logsumexp\x20=\x20max\x20+\x20log\x20Σe^{x_j-max}，用于算log\x20概率（交叉熵、logprobs）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么面试爱考？”——手撕\x20attention\x20的第一个考点；且推理框架里所有采样、beam\x20search、困惑度计算都建在\x20logprobs\x20上，数值稳定是工程底线。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>手写\x20attention\x20时直接\x20exp\x20不减\x20max，是最常见的“会写但不专业”破绽。““““““'},{'c':_0x15813f(0x180),'s':0x4,'lv':'🔥','q':_0x15813f(0x172),'a':_0x15813f(0x305)},{'c':_0x15813f(0x180),'s':0x4,'lv':'🔥','q':_0x15813f(0x222),'a':_0x15813f(0xe2)},{'c':_0x15813f(0x180),'s':0x5,'lv':'🔥','q':_0x15813f(0xe3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>结论：loss\x20与参数量N、数据量\x20D、算力\x20C呈<b>幂律关系</b>，可预测——这才是敢投巨资训大模型的依据。<b>Chinchilla\x20的修正</b>：早期模型普遍“过大而欠训”，给定算力下\x20N\x20和\x20D\x20应<b>同比例增长</b>（经验值约\x2020\x20tokens/参数）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么现在的小模型比几年前的大模型强？”——按Chinchilla\x20之后的认知，用远超“最优比例”的数据量训小模型，虽然训练不最优但<b>推理成本低</b>，工业上更划算（Llama-3\x208B\x20用了15T\x20tokens）；“Scaling\x20会撞墙吗？”——高质量数据是当前主要约束，业界转向后训练与推理时计算（test-time\x20compute）找增量。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x15813f(0x310),'a':_0x15813f(0x14f)},{'c':'llm','s':0x5,'lv':'🔥','q':'Qwen\x20/\x20Llama\x20/\x20DeepSeek：架构差异一句话说清','a':_0x15813f(0x13a)},{'c':_0x15813f(0x180),'s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':_0x15813f(0x2cc)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x15813f(0x252),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x15813f(0x180),'s':0x6,'lv':'⭐','q':_0x15813f(0x2f4),'a':_0x15813f(0x274)},{'c':_0x15813f(0x180),'s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>有效的原因：把多步推理<b>显式展开成中间\x20token</b>，等价于给模型更多“计算步数”和工作记忆，避免一步跨越到答案。触发方式：few-shot\x20示范、zero-shot（“让我们一步步思考”）、或模型已内化（推理模型）。边界：①\x20简单任务上反而可能变差（过度思考）\x20②\x20<b>思维链不等于真实推理过程</b>——它可能是事后合理化，所以别把CoT\x20当可信解释\x20③\x20错误会沿链传播放大。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么增强\x20CoT？”——自一致性（多次采样投票）、思维树（ToT\x20搜索分支）、外部工具验证；“和ReAct\x20的关系？”——ReAct\x20=\x20CoT\x20+\x20工具交互，让每步推理能被真实世界结果校正。““““““'},{'c':_0x15813f(0x180),'s':0x7,'lv':'⭐','q':_0x15813f(0x193),'a':_0x15813f(0x255)},{'c':_0x15813f(0x180),'s':0x7,'lv':'🔥','q':_0x15813f(0x169),'a':_0x15813f(0x188)},{'c':_0x15813f(0x180),'s':0x7,'lv':'🔥','q':_0x15813f(0x105),'a':_0x15813f(0x18c)},{'c':_0x15813f(0x180),'s':0x7,'lv':'💎','q':_0x15813f(0x254),'a':_0x15813f(0x1de)},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x15813f(0x2ba)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x15813f(0x228),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x15813f(0x199),'a':_0x15813f(0x20a)},{'c':'rl','s':0x1,'lv':'💎','q':'探索与利用（Exploration\x20vs\x20Exploitation）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x15813f(0x30b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x15813f(0x203),'a':_0x15813f(0x166)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x15813f(0x30a),'a':_0x15813f(0x123)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x15813f(0x130),'a':_0x15813f(0x328)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x15813f(0x1fe),'a':_0x15813f(0x1e3)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x15813f(0x160),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':_0x15813f(0x1fc),'a':_0x15813f(0x1b9)},{'c':'rl','s':0x3,'lv':'💎','q':_0x15813f(0x1d8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x15813f(0x1a7),'a':_0x15813f(0x1bb)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x15813f(0x2f3),'a':_0x15813f(0x226)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x15813f(0x257),'a':_0x15813f(0x2cb)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x15813f(0x269),'a':_0x15813f(0xe4)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x15813f(0x182),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>人工编写</b>：质量最高、成本最高，用于核心种子集。<b>Self-Instruct</b>：用少量种子任务让强模型自动扩写指令+回答，再过滤——低成本扩量。<b>Evol-Instruct</b>（WizardLM）：对已有指令做“进化”——加约束、提复杂度、换场景，产出更难的样本。工业现实：<b>强模型蒸馏\x20+\x20人工精修核心集\x20+\x20线上真实数据回流</b>，三源混合。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“合成数据的风险？”——同质化（多样性不足）、错误放大、分布偏离真实用户；对策是过滤\x20+\x20人工抽检\x20+\x20混入真实数据；“合规？”——用厂商模型输出做训练数据受\x20ToS\x20约束，商用要看条款。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的数据来自操作规程、现场案例、工艺机理、专家经验——<b>真实领域知识源，不是蒸馏合成</b>，这在工业场景是明确的加分项，要主动说。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':_0x15813f(0x209)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x15813f(0x216),'a':_0x15813f(0x17c)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x15813f(0x21c),'a':_0x15813f(0x184)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x15813f(0x1f1),'a':_0x15813f(0x16f)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x15813f(0x30d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':_0x15813f(0x220)},{'c':'pt','s':0x1,'lv':'💎','q':'PEFT\x20家族：Prefix\x20/\x20Adapter\x20/\x20DoRA\x20一句话区分','a':_0x15813f(0x1e4)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x15813f(0x1bf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':'偏好数据怎么收集？标注口径怎么统一？','a':_0x15813f(0x2ff)},{'c':'pt','s':0x2,'lv':'💎','q':'完整后训练流水线：一个真实项目会怎么排','a':_0x15813f(0x2ad)},{'c':'pt','s':0x2,'lv':'🔥','q':'训练框架选型：LLaMA-Factory\x20/\x20ms-swift\x20/\x20TRL','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x15813f(0x300),'a':_0x15813f(0x2ef)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x15813f(0x11f),'a':_0x15813f(0x2ca)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x15813f(0x278),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原则：<b>一次只动一个变量</b>，其余全部固定（数据、超参、随机种子、评测集）。目的是回答“效果提升到底来自哪一部分”。你论文的三组对照是标准范式：<b>Base（仅提示词约束）→\x20QA-SFT（普通问答微调）→\x20OKC-SFT（结构化知识链监督）</b>——逐层剥离，证明提升来自“结构化监督”而不是“微调本身”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么排除随机性？”——多个随机种子跑多次报均值方差（小数据尤其重要）；“怎么防自欺欺人？”——评测集提前冻结、评估者不知组别（盲评）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌答法）</span><br>被问“你怎么证明是你的方法起作用而不是微调本身起作用”——<b>这就是消融实验存在的意义，而你已经做了。</b>直接讲三组对照的设计逻辑，这是很多候选人（甚至一些论文）都缺的科学严谨性。“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x15813f(0x230),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>通用</b>：MMLU/CMMLU/C-Eval（知识问答）。<b>代码</b>：HumanEval/MBPP（pass@k）。<b>推理</b>：GSM8K/MATH。<b>对话</b>：MT-Bench、AlpacaEval（LLM\x20裁判\x20+\x20人类偏好）。<b>长文本</b>：needle-in-haystack、RULER。<b>陷阱</b>：①\x20<b>数据污染</b>——基准题进了训练集，跑分虚高（要做去污染检查）②\x20<b>刷榜≠好用</b>——针对基准优化的模型在真实业务上未必强③\x20单一指标掩盖问题（平均分高但某类任务崩）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么检查污染？”——n-gram\x20重叠检测、基准题的困惑度异常低是信号；“更可信的做法？”——<b>自建贴合业务的私有评测集</b>，这是工业界的共识。“““““'},{'c':'pt','s':0x3,'lv':'💎','q':_0x15813f(0x2af),'a':_0x15813f(0x1ef)},{'c':'pt','s':0x3,'lv':'🔥','q':'结构化输出监督：OKC-SFT\x20这类方法为什么有效','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':_0x15813f(0x31f),'s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x15813f(0x2a8)},{'c':'app','s':0x0,'lv':'⭐','q':_0x15813f(0x1a9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':_0x15813f(0x31f),'s':0x1,'lv':'⭐','q':_0x15813f(0x2df),'a':_0x15813f(0x1b3)},{'c':_0x15813f(0x31f),'s':0x1,'lv':'🔥','q':_0x15813f(0x315),'a':_0x15813f(0x2c3)},{'c':_0x15813f(0x31f),'s':0x1,'lv':'⭐','q':_0x15813f(0x133),'a':_0x15813f(0x13d)},{'c':'app','s':0x2,'lv':'🔥','q':_0x15813f(0x132),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x15813f(0x31f),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x15813f(0x31f),'s':0x3,'lv':'🔥','q':_0x15813f(0x149),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':_0x15813f(0x31f),'s':0x3,'lv':'💎','q':_0x15813f(0x32a),'a':_0x15813f(0xe1)},{'c':_0x15813f(0x31f),'s':0x4,'lv':'⭐','q':_0x15813f(0x2bf),'a':_0x15813f(0x31a)},{'c':_0x15813f(0x31f),'s':0x4,'lv':'⭐','q':_0x15813f(0x27b),'a':_0x15813f(0x1cb)},{'c':'app','s':0x4,'lv':'🔥','q':_0x15813f(0x2bb),'a':_0x15813f(0x325)},{'c':_0x15813f(0x31f),'s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':_0x15813f(0x31f),'s':0x5,'lv':'🔥','q':_0x15813f(0x287),'a':_0x15813f(0x2a1)},{'c':_0x15813f(0x31f),'s':0x5,'lv':'💎','q':_0x15813f(0xd6),'a':_0x15813f(0x118)},{'c':_0x15813f(0x31f),'s':0x6,'lv':'⭐','q':_0x15813f(0x231),'a':_0x15813f(0xd3)},{'c':_0x15813f(0x31f),'s':0x6,'lv':'⭐','q':_0x15813f(0x323),'a':_0x15813f(0x106)},{'c':'app','s':0x6,'lv':'🔥','q':_0x15813f(0x146),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可观测</b>：全链路\x20trace——每次调用记录\x20prompt/响应/耗时/token\x20消耗/工具轨迹，工具用\x20Langfuse/LangSmith\x20或自建日志表；线上效果靠采样评估\x20+\x20用户行为信号（重试率、采纳率、人工介入率）监控。<b>成本三杠杆</b>：模型路由（简单问题给小模型）、prompt\x20瘦身（历史压缩、检索精简）、缓存（相同/相似\x20query\x20直接命中）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么发现线上效果退化？”——固定评估集定期回归\x20+\x20行为信号异动告警。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署场景讲“GPU\x20资源有限\x20→\x20按问题复杂度路由不同尺寸模型”，贴工业实际。““““““'},{'c':_0x15813f(0x31f),'s':0x6,'lv':'💎','q':'RAG\x20vs\x20微调：什么问题上哪个？','a':_0x15813f(0x1a6)},{'c':'app','s':0x7,'lv':'⭐','q':_0x15813f(0x1e5),'a':_0x15813f(0x2f9)},{'c':_0x15813f(0x31f),'s':0x7,'lv':'🔥','q':_0x15813f(0x134),'a':_0x15813f(0x151)},{'c':_0x15813f(0x31f),'s':0x7,'lv':'⭐','q':_0x15813f(0x204),'a':_0x15813f(0xe8)},{'c':_0x15813f(0x31f),'s':0x7,'lv':'🔥','q':_0x15813f(0x1ed),'a':_0x15813f(0x2d0)},{'c':_0x15813f(0x31f),'s':0x7,'lv':'🔥','q':_0x15813f(0x140),'a':_0x15813f(0x318)},{'c':_0x15813f(0x12d),'s':0x0,'lv':'⭐','q':_0x15813f(0x1ff),'a':_0x15813f(0xd7)},{'c':_0x15813f(0x12d),'s':0x0,'lv':'⭐','q':_0x15813f(0xf2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型：单线程内由<b>事件循环</b>调度多个协程，遇到\x20await\x20就让出控制权、IO\x20完成后被唤醒——一个线程可承载上万并发连接。三个概念：coroutine（协程对象，不await\x20不执行）、Task（被调度的执行单元）、事件循环。<b>最大的坑</b>：在async\x20函数里调用<b>阻塞</b>操作（time.sleep、同步\x20requests、重CPU\x20计算）会卡死整个事件循环——必须换asyncio.sleep\x20/\x20httpx\x20/\x20aiohttp，或用\x20run_in_executor\x20丢到线程池。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么并发跑多个请求？”——asyncio.gather或\x20create_task；“怎么控制并发数？”——Semaphore\x20限流，防打爆下游模型服务。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Agent\x20里并发调多个工具、批量调LLM\x20都靠这套——能讲出Semaphore\x20限流就显工程经验。“““'},{'c':_0x15813f(0x12d),'s':0x0,'lv':'🔥','q':_0x15813f(0xc9),'a':_0x15813f(0x2d9)},{'c':_0x15813f(0x12d),'s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x15813f(0x2f0)},{'c':_0x15813f(0x12d),'s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':_0x15813f(0x16d)},{'c':_0x15813f(0x12d),'s':0x1,'lv':'🔥','q':_0x15813f(0xfe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':_0x15813f(0x12d),'s':0x2,'lv':'⭐','q':_0x15813f(0x20c),'a':_0x15813f(0x2a6)},{'c':_0x15813f(0x12d),'s':0x2,'lv':'🔥','q':_0x15813f(0x1c0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':_0x15813f(0x12d),'s':0x3,'lv':'🔥','q':_0x15813f(0x253),'a':_0x15813f(0x2a4)},{'c':_0x15813f(0x12d),'s':0x3,'lv':'🔥','q':_0x15813f(0x24d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）、top\x20④\x20进程\x20→\x20ps\x20aux\x20|\x20grep，kill\x20先\x20-15\x20再\x20-9\x20⑤\x20网络\x20→\x20curl\x20-v\x20测接口连通与耗时。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“显存不释放怎么办？”——nvidia-smi\x20找残留进程\x20kill；Python\x20侧\x20del\x20+\x20torch.cuda.empty_cache()；“怎么看\x20GPU\x20是否真在算？”——nvidia-smi\x20的\x20GPU-Util\x20和显存占用要一起看，占了显存不代表在算。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说“先看端口、再看日志、再看磁盘和显存”这个<b>顺序</b>，比罗列一堆命令更能证明你真排查过故障。“““'},{'c':_0x15813f(0x12d),'s':0x3,'lv':'🔥','q':'Git：rebase\x20vs\x20merge\x20与救命操作','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：
