<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable],.monaco-editor,.monaco-editor *{-webkit-user-select:text!important;user-select:text!important}
</style>

</span><br><b>Warmup</b>：训练初期参数远离最优、梯度噪声大（Adam\x20的二阶统计量还没攒够、估计不准），直接用大\x20lr\x20会震荡或发散；先用几百到几千步<b>线性升到峰值</b>。<b>Cosine\x20decay</b>：后期平滑降到接近零，让模型沉淀进更平坦的极小值，泛化更好。大模型\x20SFT\x20典型配置：warmup\x20ratio\x203%、cosine\x20衰减到峰值的\x2010%。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“不warmup\x20会怎样？”——常见现象是前几十步\x20loss\x20飙升甚至\x20NaN；“为什么不降到\x200？”——留一点残余\x20lr\x20避免完全停止学习，也便于后续继续训练。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x2bc05f(0x363),'a':_0x2bc05f(0x232)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x2bc05f(0x243),'a':_0x2bc05f(0x3b4)},{'c':'ml','s':0x1,'lv':'⭐','q':'LayerNorm\x20vs\x20BatchNorm：为什么\x20Transformer\x20用\x20LN','a':_0x2bc05f(0x17c)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x2bc05f(0x2b4),'a':_0x2bc05f(0x176)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x2bc05f(0x25d),'a':_0x2bc05f(0x3b9)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x2bc05f(0x295),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x2bc05f(0x17f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>信号：训练\x20loss\x20持续降但<b>验证\x20loss\x20转升</b>；训练集指标远好于测试集；模型开始复述训练样本。对策按大模型语境的性价比排序：①\x20<b>更多/更干净的数据</b>（永远最有效）②\x20<b>早停</b>——监控验证集，SFT\x20里\x20epoch\x20设\x202~3\x20就是经验性防过拟合\x20③\x20<b>用\x20LoRA\x20限制可训练参数量</b>（小数据尤其有效）④\x20weight\x20decay\x20/\x20dropout\x20⑤\x20数据混合与多任务。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“小数据微调怎么防？”——LoRA\x20+\x20小\x20r\x20+\x20少\x20epoch\x20+\x20早停\x20+\x20掺通用数据，四件套；<b>你的\x20611\x20条数据场景正好适用这套组合，被问“数据这么少怎么保证不过拟合”时按这个答。</b>““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2bc05f(0x2e0),'a':_0x2bc05f(0x187)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2bc05f(0x1f1),'a':_0x2bc05f(0x346)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x2bc05f(0x32b),'a':_0x2bc05f(0x264)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x2bc05f(0x3bb),'a':_0x2bc05f(0x36d)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x2bc05f(0x1df),'a':_0x2bc05f(0x31b)},{'c':'ml','s':0x3,'lv':'💎','q':_0x2bc05f(0x21e),'a':_0x2bc05f(0x284)},{'c':_0x2bc05f(0x21b),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x31e),'a':_0x2bc05f(0x2fc)},{'c':_0x2bc05f(0x21b),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x3a3),'a':_0x2bc05f(0x241)},{'c':_0x2bc05f(0x21b),'s':0x0,'lv':'🔥','q':_0x2bc05f(0x1d8),'a':_0x2bc05f(0x19c)},{'c':_0x2bc05f(0x21b),'s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>不是近似算法，是精确注意力的\x20IO\x20感知实现。</b>痛点：标准实现把\x20n×n\x20注意力矩阵写进\x20HBM（显存）再读回，瓶颈在访存不在算力。做法：<b>tiling\x20分块</b>\x20+\x20在\x20SRAM（片上高速缓存）里用\x20<b>online\x20softmax</b>\x20增量归一化，全程不实例化完整注意力矩阵。收益：显存\x20O(n²)→O(n)，速度快数倍。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“online\x20softmax\x20怎么做的？”——边遍历边维护\x20running\x20max\x20和\x20running\x20sum，用缩放因子修正之前的部分和；“v2/v3\x20改了什么？”——v2\x20优化并行划分减少非矩阵运算，v3\x20用满\x20Hopper\x20的异步拷贝与\x20FP8。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>说它“降低了计算复杂度”是错的——复杂度还是\x20O(n²)，降的是访存。““““““'},{'c':_0x2bc05f(0x21b),'s':0x1,'lv':'⭐','q':'RoPE：旋转位置编码的原理与优势','a':_0x2bc05f(0x3d2)},{'c':_0x2bc05f(0x21b),'s':0x1,'lv':'🔥','q':_0x2bc05f(0x1d4),'a':_0x2bc05f(0x211)},{'c':_0x2bc05f(0x21b),'s':0x1,'lv':'🔥','q':_0x2bc05f(0x377),'a':_0x2bc05f(0x201)},{'c':_0x2bc05f(0x21b),'s':0x2,'lv':'⭐','q':_0x2bc05f(0x19d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':_0x2bc05f(0x21b),'s':0x2,'lv':'⭐','q':_0x2bc05f(0x204),'a':_0x2bc05f(0x29f)},{'c':_0x2bc05f(0x21b),'s':0x2,'lv':'💎','q':_0x2bc05f(0x1e6),'a':_0x2bc05f(0x28f)},{'c':_0x2bc05f(0x21b),'s':0x3,'lv':'⭐','q':'temperature\x20/\x20top-p\x20/\x20top-k\x20怎么调？','a':_0x2bc05f(0x2fd)},{'c':_0x2bc05f(0x21b),'s':0x3,'lv':'🔥','q':_0x2bc05f(0x1c7),'a':_0x2bc05f(0x3d9)},{'c':_0x2bc05f(0x21b),'s':0x4,'lv':'🔥','q':_0x2bc05f(0x1e9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>BPE（字节对编码）：从字符/字节开始，反复合并语料中最高频的相邻\x20pair，直到词表达标（32k~150k）。好处：任意文本可编码（无\x20OOV）、词表可控。<b>后遗症（面试爱考）</b>：①\x20数字被切成任意片段\x20→\x20算术能力差（“9.11\x20和\x209.9\x20谁大”翻车）②\x20中文单字可能占\x202-3\x20token\x20→\x20又贵又慢\x20③\x20空格/大小写敏感\x20④\x20字符级任务差（数不清\x20strawberry\x20有几个\x20r）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么缓解数字问题？”——数字单独按位切分（Llama\x20系做法）；“中文模型怎么优化？”——扩充中文词表\x20+\x20继续预训练，token\x20效率能提升明显。““““““'},{'c':_0x2bc05f(0x21b),'s':0x4,'lv':'🔥','q':'预训练数据工程：配比、清洗、去重','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':_0x2bc05f(0x21b),'s':0x5,'lv':'🔥','q':_0x2bc05f(0x272),'a':_0x2bc05f(0x25a)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x2bc05f(0x2d4),'a':_0x2bc05f(0x1fa)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x2bc05f(0x21d),'a':_0x2bc05f(0x195)},{'c':_0x2bc05f(0x21b),'s':0x5,'lv':'💎','q':_0x2bc05f(0x2b0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把\x20FFN\x20换成\x20N\x20个专家子网络\x20+\x20一个路由器，每个\x20token\x20只激活\x20top-k\x20个专家（如\x208\x20选\x202）。效果：<b>总参数量（知识容量）暴涨，但每\x20token\x20的计算量只按激活专家算</b>——稀疏激活让\x20FLOPs\x20与稠密小模型相当。代表：Mixtral\x208×7B、DeepSeek-V3、Qwen-MoE。代价：显存要装下全部专家（省算力不省显存）、需要\x20auxiliary\x20loss\x20做负载均衡防止专家“饿死”、分布式部署更复杂。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理部署难在哪？”——专家并行的通信开销、batch\x20内token\x20路由到不同专家导致负载不均；“微调\x20MoE\x20的坑？”——小数据微调容易破坏路由平衡。““““““'},{'c':_0x2bc05f(0x21b),'s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':_0x2bc05f(0x302)},{'c':_0x2bc05f(0x21b),'s':0x6,'lv':'⭐','q':_0x2bc05f(0x1a2),'a':_0x2bc05f(0x342)},{'c':_0x2bc05f(0x21b),'s':0x6,'lv':'🔥','q':'CoT\x20为什么有效？它的边界在哪','a':_0x2bc05f(0x376)},{'c':_0x2bc05f(0x21b),'s':0x7,'lv':'⭐','q':_0x2bc05f(0x1d3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因四层：①\x20训练数据本身有错/有噪\x20②\x20next-token\x20目标只奖励“像人话”，不奖励“是真的”\x20③\x20模型不知道自己不知道（知识边界缺失）\x20④\x20采样随机性引入漂移。缓解按链路排：数据清洗\x20→\x20SFT\x20加入<b>拒答与边界样本</b>\x20→\x20偏好对齐惩罚编造\x20→\x20<b>RAG\x20外挂知识\x20+\x20引用溯源</b>\x20→\x20结构化输出约束\x20→\x20生成后一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能彻底消除吗？”——不能，它是概率生成的内在属性；工程目标是<b>把幻觉控制在可接受范围并让它可被发现</b>（溯源、置信度、拒答）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>OKC-SFT\x20直接打这个问题：六段式知识链强制模型输出\x20Verification\x20和\x20Risk\x20Boundary，幻觉率\x2034.4%→15.6%，Verification/Risk\x20Boundary\x20出现率\x20100%——<b>“我不是在让模型少说错，是在让它必须自证”</b>，这句话能让面试官记住你。““““““'},{'c':_0x2bc05f(0x21b),'s':0x7,'lv':'🔥','q':_0x2bc05f(0x246),'a':_0x2bc05f(0x217)},{'c':'llm','s':0x7,'lv':'🔥','q':_0x2bc05f(0x38d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>不更新任何参数，只在\x20prompt\x20里给示例，模型就能完成新任务——GPT-3\x20的核心发现。主流解释（面试够用）：预训练中见过海量“任务-示例-答案”结构，模型学会了在上下文中做<b>模式补全\x20/\x20隐式贝叶斯任务推断</b>；也有研究认为注意力可以实现类似梯度下降的隐式优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“示例怎么选影响大吗？”——非常大：数量（3-5个通常够）、<b>格式一致性</b>（比内容正确性影响更大）、顺序（近端示例影响更强）、与query\x20的相似度（检索式选例更优）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目把\x20SQL\x20示例入库、按\x20query\x20检索注入，就是“检索式\x20few-shot\x20选例”的工程实现——这是\x20ICL\x20原理的直接应用。““““““'},{'c':_0x2bc05f(0x21b),'s':0x7,'lv':'💎','q':'涌现能力（Emergent\x20Abilities）与它的争议','a':_0x2bc05f(0x362)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x2bc05f(0x1dc),'a':_0x2bc05f(0x318)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x2bc05f(0x18e),'a':_0x2bc05f(0x277)},{'c':'rl','s':0x1,'lv':'🔥','q':'Q-learning\x20与\x20DQN：价值方法怎么工作','a':_0x2bc05f(0x327)},{'c':'rl','s':0x1,'lv':'💎','q':_0x2bc05f(0x1ba),'a':_0x2bc05f(0x2f3)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x2bc05f(0x369),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x2bc05f(0x17d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':'on-policy\x20vs\x20off-policy：区别与影响','a':_0x2bc05f(0x21c)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x2bc05f(0x380),'a':_0x2bc05f(0x29a)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x2bc05f(0x385),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':'GRPO：DeepSeek\x20为什么能扔掉\x20Critic','a':_0x2bc05f(0x1ec)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x2bc05f(0x2d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一条主线：<b>不断削减对辅助模型和在线采样的依赖</b>。PPO：完整\x20RL，要\x20actor+critic+RM+reference\x20四模型，效果强但工程重。DPO：把奖励解析掉，<b>去掉\x20RM\x20和\x20RL\x20循环</b>，变离线监督学习——便宜稳定，但没探索。GRPO：保留在线\x20RL\x20的探索能力，但<b>去掉\x20critic</b>，用组内相对优势\x20+\x20可验证奖励——在推理任务上取得突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“实际项目怎么选？”——数据是成对偏好、要快出结果\x20→\x20DPO；任务有自动可验证的正确性（代码/数学/SQL）→\x20GRPO\x20类方法；有充足算力和标注团队要做通用对齐\x20→\x20PPO。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把NL2SQL\x20接进来：<b>“SQL\x20的执行结果是天然的可验证奖励信号——这个任务其实非常适合\x20GRPO\x20类方法，是我这个项目下一步最有价值的延伸方向。”</b>这句话把项目、RL\x20知识、技术前瞻三者串起来，是能让面试官眼睛一亮的答案。““““““'},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ORM（结果奖励）</b>：只看最终答案对不对——标注便宜、信号稀疏，长推理链上难定位到底哪一步错了（信用分配难）。<b>PRM（过程奖励）</b>：给推理链的每一步打分——信号密集、更好指导，但标注昂贵，且容易被“看起来合理”的步骤骗过。实践：ORM\x20简单可靠，是\x20R1\x20路线的选择（配合规则奖励）；PRM\x20在数学推理上有效但成本高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“稀疏奖励的信用分配怎么缓解？”——过程奖励、蒙特卡洛回溯估计每步价值、或者干脆增大采样量让统计信号说话（GRPO\x20的思路）。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x2bc05f(0x3ad),'a':_0x2bc05f(0x1b1)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':_0x2bc05f(0x35f)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x2bc05f(0x287),'a':_0x2bc05f(0x1a9)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x2bc05f(0x356),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>LIMA\x20的著名结论：<b>“Less\x20Is\x20More\x20for\x20Alignment”</b>——1000\x20条精选数据可胜过数万条噪声数据；对齐阶段模型主要在学格式与风格，不是学知识。实践清单：①\x20<b>任务类型覆盖</b>（多样性>\x20数量）②\x20严格去重与去模板化\x20③\x20长度分布合理（别全是短答）④\x20<b>格式绝对一致</b>——一个坏样本就能教会模型坏格式\x20⑤\x20人工抽检\x20+\x20模型过滤双保险。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断数据够不够？”——看验证集指标是否随数据量饱和；“怎么衡量多样性？”——指令语义聚类分布、任务类型覆盖率、去重后剩余率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>611\x20条数据覆盖\x206\x20类任务（变量解释/工况识别/原因分析/操作生成/安全提醒/处置后验证）——<b>“我不是凑数量，是按任务类型做覆盖设计”</b>，这正是\x20LIMA\x20结论的正确实践，能把“数据少”讲成“数据精”。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':_0x2bc05f(0x20a)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x2bc05f(0x361),'a':_0x2bc05f(0x34e)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x2bc05f(0x218),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x2bc05f(0x1f6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x2bc05f(0x1c5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x2bc05f(0x198),'a':_0x2bc05f(0x2a8)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x2bc05f(0x275),'a':_0x2bc05f(0x2ef)},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x2bc05f(0x388),'a':_0x2bc05f(0x1c2)},{'c':'pt','s':0x2,'lv':'⭐','q':'RLHF\x20/\x20DPO\x20/\x20GRPO\x20在Post-training\x20里的定位','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x2bc05f(0x313),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x2bc05f(0x2bc),'a':_0x2bc05f(0x359)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x2bc05f(0x1cf),'a':_0x2bc05f(0x2ed)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x2bc05f(0x1e1)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x2bc05f(0x2c3),'a':_0x2bc05f(0x2f2)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x2bc05f(0x344),'a':_0x2bc05f(0x2d0)},{'c':'pt','s':0x3,'lv':'💎','q':_0x2bc05f(0x1c3),'a':_0x2bc05f(0x30a)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x2bc05f(0x36b),'a':_0x2bc05f(0x288)},{'c':_0x2bc05f(0x386),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x2e2),'a':_0x2bc05f(0x3aa)},{'c':_0x2bc05f(0x386),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x192),'a':_0x2bc05f(0x26b)},{'c':_0x2bc05f(0x386),'s':0x1,'lv':'⭐','q':_0x2bc05f(0x343),'a':_0x2bc05f(0x353)},{'c':_0x2bc05f(0x386),'s':0x1,'lv':'🔥','q':_0x2bc05f(0x202),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':'app','s':0x1,'lv':'⭐','q':_0x2bc05f(0x2b7),'a':_0x2bc05f(0x2f0)},{'c':_0x2bc05f(0x386),'s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x2bc05f(0x265)},{'c':'app','s':0x2,'lv':'⭐','q':_0x2bc05f(0x2ac),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x2bc05f(0x386),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用户问题常有指代、省略、口语化，直接检索效果差。三件套：<b>query\x20改写</b>（多轮场景把“它/那个/上月呢”补全成独立问题）、<b>HyDE</b>（先让\x20LLM\x20生成假设答案，用答案的向量去检索——答案空间比问题空间更接近文档空间）、<b>子问题分解</b>（复杂问题拆开分别查）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“HyDE\x20什么时候失效？”——假设答案本身就错时会带偏检索（幻觉传染），事实精度要求高的场景慎用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20多轮问答里“那上个月呢”必须先改写成完整查询意图再进\x20pipeline——真实用过这个手段。““““““'},{'c':_0x2bc05f(0x386),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x2bc05f(0x386),'s':0x4,'lv':'⭐','q':_0x2bc05f(0x31d),'a':_0x2bc05f(0x2d5)},{'c':'app','s':0x4,'lv':'⭐','q':_0x2bc05f(0x2a9),'a':_0x2bc05f(0x2c5)},{'c':_0x2bc05f(0x386),'s':0x4,'lv':'🔥','q':'Plan-and-Execute\x20vs\x20ReAct：怎么选？','a':_0x2bc05f(0x383)},{'c':_0x2bc05f(0x386),'s':0x4,'lv':'🔥','q':'多\x20Agent\x20协作与\x20MCP\x20协议（2026\x20新考点）','a':_0x2bc05f(0x255)},{'c':_0x2bc05f(0x386),'s':0x5,'lv':'🔥','q':_0x2bc05f(0x2ab),'a':_0x2bc05f(0x387)},{'c':_0x2bc05f(0x386),'s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':_0x2bc05f(0x3a6)},{'c':'app','s':0x6,'lv':'⭐','q':'结构化输出怎么保证？（JSON\x20总是不合法怎么办）','a':_0x2bc05f(0x384)},{'c':_0x2bc05f(0x386),'s':0x6,'lv':'⭐','q':_0x2bc05f(0x3b6),'a':_0x2bc05f(0x1fe)},{'c':_0x2bc05f(0x386),'s':0x6,'lv':'🔥','q':'LLM\x20应用上线后：可观测性与成本怎么管？','a':_0x2bc05f(0x1a3)},{'c':_0x2bc05f(0x386),'s':0x6,'lv':'💎','q':'RAG\x20vs\x20微调：什么问题上哪个？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>RAG\x20管<b>知识问题</b>：事实性、时效性、私有数据、可溯源。微调管<b>行为问题</b>：输出格式、语气风格、领域任务模式。黄金法则：<b>别用微调让模型背知识</b>（会忘、会幻觉、更新贵）；<b>别用\x20RAG\x20教模型做事</b>（注入示例不稳定）。两个都要时：先\x20RAG\x20后微调，微调数据里混入\x20RAG\x20场景样本，教模型“基于资料回答”。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全场最佳串线）</span><br>你的两个项目恰好各证一边：OKC-SFT\x20管行为（六段式处置结构），NL2SQL\x20的\x20RAG\x20管知识（口径/别名库）——“我用两个项目分别验证了这条法则的两边”，一句话把整份简历串成一条线。““““““'},{'c':_0x2bc05f(0x386),'s':0x7,'lv':'⭐','q':_0x2bc05f(0x303),'a':_0x2bc05f(0x1db)},{'c':'app','s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':_0x2bc05f(0x2f9)},{'c':'app','s':0x7,'lv':'⭐','q':'可执行率\x20vs\x20正确率：评估口径必须讲清','a':_0x2bc05f(0x22c)},{'c':'app','s':0x7,'lv':'🔥','q':_0x2bc05f(0x1a4),'a':_0x2bc05f(0x2a5)},{'c':_0x2bc05f(0x386),'s':0x7,'lv':'🔥','q':_0x2bc05f(0x37c),'a':_0x2bc05f(0x2da)},{'c':_0x2bc05f(0x319),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x20e),'a':_0x2bc05f(0x1d2)},{'c':'eng','s':0x0,'lv':'⭐','q':_0x2bc05f(0x3b5),'a':_0x2bc05f(0x324)},{'c':_0x2bc05f(0x319),'s':0x0,'lv':'🔥','q':_0x2bc05f(0x3d5),'a':_0x2bc05f(0x1be)},{'c':_0x2bc05f(0x319),'s':0x1,'lv':'⭐','q':'SQL\x20索引原理与慢查询优化路径','a':_0x2bc05f(0x185)},{'c':_0x2bc05f(0x319),'s':0x1,'lv':'🔥','q':_0x2bc05f(0x293),'a':_0x2bc05f(0x2d2)},{'c':'eng','s':0x1,'lv':'🔥','q':_0x2bc05f(0x2ce),'a':_0x2bc05f(0x248)},{'c':_0x2bc05f(0x319),'s':0x2,'lv':'⭐','q':_0x2bc05f(0x190),'a':_0x2bc05f(0x2f1)},{'c':_0x2bc05f(0x319),'s':0x2,'lv':'🔥','q':_0x2bc05f(0x32c),'a':_0x2bc05f(0x1f5)},{'c':_0x2bc05f(0x319),'s':0x3,'lv':'🔥','q':_0x2bc05f(0x1eb),'a':_0x2bc05f(0x177)},{'c':_0x2bc05f(0x319),'s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':_0x2bc05f(0x24e)},{'c':_0x2bc05f(0x319),'s':0x3,'lv':'🔥','q':_0x2bc05f(0x1a6),'a':_0x2bc05f(0x1ae)},{'c':_0x2bc05f(0x319),'s':0x4,'lv':'⭐','q':_0x2bc05f(0x1ab),'a':_0x2bc05f(0x228)},{'c':'eng','s':0x4,'lv':'🔥','q':_0x2bc05f(0x1f8),'a':_0x2bc05f(0x2c4)},{'c':_0x2bc05f(0x319),'s':0x4,'lv':'🔥','q':_0x2bc05f(0x233),'a':_0x2bc05f(0x3a0)},{'c':_0x2bc05f(0x319),'s':0x4,'lv':'💎','q':_0x2bc05f(0x3c8),'a':_0x2bc05f(0x2dc)},{'c':_0x2bc05f(0x319),'s':0x4,'lv':'💎','q':_0x2bc05f(0x2b5),'a':_0x2bc05f(0x3a2)},{'c':_0x2bc05f(0x335),'s':0x0,'lv':'⭐','q':'60秒自我介绍（电话面\x20/\x20开场用）','a':_0x2bc05f(0x2b3)},{'c':'story','s':0x0,'lv':'⭐','q':_0x2bc05f(0x1bc),'a':_0x2bc05f(0x1b6)},{'c':'story','s':0x1,'lv':'⭐','q':_0x2bc05f(0x301),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>面试官挖项目，本质在问五件事，按这个顺序主动交付：<br>①\x20<b>背景与目标</b>——谁的痛点、为什么值得做、你的角色<br>②\x20<b>难点</b>——技术上最难的\x202-3\x20点（不是“工作量大”，是<b>技术判断难</b>）<br>③\x20<b>权衡</b>——你考虑过哪些方案、为什么选这个、放弃了什么（<b>这一层最能区分候选人</b>）<br>④\x20<b>数据</b>——效果指标\x20+\x20口径\x20+\x20怎么测的<br>⑤\x20<b>复盘</b>——哪里做得不好、如果重做会怎么改<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>大多数候选人只讲\x20①②④，<b>而面试官真正想听的是\x20③\x20和\x20⑤</b>——它们证明你有技术判断力和反思能力，不是执行工具。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“你遇到最大的困难”时，答“数据太少/时间太紧”是废答案；要答<b>技术性困难\x20+\x20你的解法+\x20学到什么</b>。“'},{'c':'story','s':0x1,'lv':'⭐','q':_0x2bc05f(0x330),'a':_0x2bc05f(0x1e3)},{'c':_0x2bc05f(0x335),'s':0x2,'lv':'⭐','q':'NL2SQL\x20项目标准讲述稿（3\x20分钟版）','a':_0x2bc05f(0x2b9)},{'c':_0x2bc05f(0x335),'s':0x2,'lv':'🔥','q':_0x2bc05f(0x24c),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检，答不出就去补</span><br>①\x2098%/96%\x20的测试集多大、谁判、怎么判？<br>②\x20307\x20个字段怎么进prompt\x20的？（schema\x20裁剪策略）<br>③\x20字段别名库怎么建的、多少条？<br>④\x20多轮对话的指代怎么消解的？<br>⑤\x20执行反馈修正最多重试几轮、会不会越改越错？<br>⑥\x20复杂多表\x20join\x20的成功率和单表比差多少？<br>⑦\x20为什么选\x20Qwen、哪个尺寸、为什么这个尺寸？<br>⑧\x20海光\x20DCU\x20上踩了什么坑？<br>⑨\x20安全怎么做的？（只读、权限、注入防护）<br>⑩\x20如果重做，你会改哪三件事？<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>这十个问题就是你的复习清单</b>。每个都写下3-5\x20句的答案并练到能顺畅说出——项目面80%\x20的问题都在这里面。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>第\x20⑩\x20题最能拉分也最容易翻车：<b>准备三个具体的改进点</b>（自动化评测、混合检索、RL\x20优化），别答“没什么好改的”。“'},{'c':_0x2bc05f(0x335),'s':0x3,'lv':'⭐','q':'OKC-SFT\x20论文标准讲述稿（3\x20分钟版）','a':_0x2bc05f(0x18b)},{'c':_0x2bc05f(0x335),'s':0x3,'lv':'🔥','q':'论文的八个必问追问（含硬伤应对）','a':'<span\x20class=\x27lb\x27>◈\x20逐条自检</span><br>①\x20幻觉率的判定标准和流程？（必问，见\x205.4.5）<br>②\x20六个阶段是怎么定出来的、为什么是六个？<br>③\x20611\x20条数据的标注质量怎么保证、有没有多人校验？<br>④\x2090\x20条测试集是不是太小？统计上可信吗？<br>⑤\x20为什么不做\x20DPO\x20/\x20偏好对齐？<br>⑥\x20关键点覆盖率\x200.54→0.74\x20是怎么算的？<br>⑦\x20通用能力掉了吗？（有没有测MMLU/CMMLU）<br>⑧\x20为什么投\x20CAC\x20而不是ACL/EMNLP？<br><span\x20class=\x27lb\x27>➤\x20硬伤应对原则</span><br>④⑦\x20如果确实没做，<b>诚实承认\x20+\x20说明如果重做会怎么补</b>——“测试集\x2090\x20条对领域任务够用但统计功效有限，如果重做我会扩到\x20300\x20条并做多种子重复实验”。<b>承认局限并给出改进方案，比硬撑可信得多。</b><br>⑧\x20标准答法：“CAC\x20是自动化领域的会议，我的工作是工业控制场景的落地方法，投这里更贴合读者；如果做通用方法研究，我会选\x20NLP\x20会议。”——<b>把选择讲成定位，而不是能力上限。</b>“'},{'c':'story','s':0x4,'lv':'⭐','q':_0x2bc05f(0x393),'a':'<span\x20class=\x27lb\x27>◈讲述框架（按这个填）</span><br>①\x20<b>一句话定位</b>：“我在腾讯\x20___\x20做LLM\x20驱动的游戏算法研究，具体方向是\x20___。”<br>②\x20<b>业务问题</b>：这个方向要解决游戏里的什么问题？（NPC\x20智能、剧情生成、玩家陪伴、内容生产效率……）<br>③\x20<b>你的工作</b>：你具体负责什么？技术栈？<br>④\x20<b>产出</b>：做出了什么（demo\x20/\x20模块\x20/\x20实验结论\x20/\x20数据），<b>尽量量化</b>。<br>⑤\x20<b>认知收获</b>：在大厂环境学到什么（工程规范、评测流程、协作方式）。<br><span\x20class=\x27lb\x27>➤\x20待你补充的信息（填完我就能写成完整讲述稿）</span><br>·所在\x20BG\x20/\x20团队方向<br>·\x20具体做的任务和技术栈<br>·\x20到\x208\x20月底能拿出的可量化成果<br>·\x20有没有接触内部模型/平台（可讲的范围内）<br><span\x20class=\x27lb\x27>⚠\x20保密提醒</span><br>内部数据、未公开模型细节、业务指标<b>不能讲</b>。讲述时聚焦<b>方法与你的思考过程</b>，遇到敏感处主动说“这部分涉及内部信息，我讲方法层面”——这个处理本身就是职业素养的体现。“'},{'c':_0x2bc05f(0x335),'s':0x4,'lv':'⭐','q':_0x2bc05f(0x382),'a':_0x2bc05f(0x257)},{'c':_0x2bc05f(0x335),'s':0x5,'lv':'⭐','q':'行为面五问：诚实但有准备的答法','a':_0x2bc05f(0x2d9)},{'c':'story','s':0x5,'lv':'🔥','q':_0x2bc05f(0x247),'a':_0x2bc05f(0x389)},{'c':_0x2bc05f(0x335),'s':0x5,'lv':'🔥','q':'面试后\x2024\x20小时：复盘怎么做才有复利','a':_0x2bc05f(0x20b)},{'c':_0x2bc05f(0x3b1),'s':0x0,'lv':'⭐','q':_0x2bc05f(0x33b),'a':'<span\x20class=\x27lb\x27>◈\x20时间基准：今天\x202026-08-07，实习到\x209月，秋招正式批\x208-9\x20月投递、9-10\x20月面试高峰</span><br><b>W1（8/7-8/13）</b>简历定稿冲刺：把腾讯实习写进简历、删\x20Infra\x20意向、压缩学生工作篇幅；同步开始刷手册第六章。<br><b>W2（8/14-8/20）</b>投递启动：目标公司清单成型，开始投正式批；每天\x201\x20小时刷题\x20+\x20手册第三章。<br><b>W3（8/21-8/27）</b>笔试月：多数大厂笔试集中期；刷题优先级最高；手册第五章。<br><b>W4（8/28-9/3）</b>面试预热：第一批面试到来；每场必复盘；第八章讲述稿练到脱口而出。<br><b>W5-W6（9/4-9/17）</b><b>面试高峰</b>：主战场；每天复盘\x20+\x20补漏；实习收尾，把成果固化进简历。<br><b>W7-W8（9/18-10/2）</b>收割与补投：Offer\x20谈判、补投遗漏公司、二轮机会。<br><span\x20class=\x27lb\x27>⚠\x20关键判断</span><br><b>简历定稿是
