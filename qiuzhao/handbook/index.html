<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable],.monaco-editor,.monaco-editor *{-webkit-user-select:text!important;user-select:text!important}
</style>

162）、第一个错误版本（278）、答案二分（如“分割数组的最大值”410）。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>只背一种模板并把它写熟</b>，比记三种模板更可靠——现场紧张时记忆最容易串。““'},{'c':_0x410c2b(0x390),'s':0x1,'lv':'⭐','q':'快速排序与快速选择（TopK\x20核心）','a':_0x410c2b(0x1f2)},{'c':'code','s':0x1,'lv':'🔥','q':_0x410c2b(0x2f0),'a':_0x410c2b(0x2cc)},{'c':_0x410c2b(0x390),'s':0x2,'lv':'⭐','q':'反转链表：迭代、递归、K\x20个一组','a':_0x410c2b(0x222)},{'c':_0x410c2b(0x390),'s':0x2,'lv':'⭐','q':_0x410c2b(0x245),'a':_0x410c2b(0x311)},{'c':_0x410c2b(0x390),'s':0x2,'lv':'🔥','q':_0x410c2b(0x3e2),'a':_0x410c2b(0x353)},{'c':'code','s':0x2,'lv':'🔥','q':'双指针：链表判环、找中点、找环入口','a':_0x410c2b(0x2d7)},{'c':_0x410c2b(0x390),'s':0x3,'lv':'⭐','q':_0x410c2b(0x402),'a':_0x410c2b(0x3ea)},{'c':_0x410c2b(0x390),'s':0x3,'lv':'🔥','q':_0x410c2b(0x240),'a':_0x410c2b(0x360)},{'c':_0x410c2b(0x390),'s':0x3,'lv':'🔥','q':_0x410c2b(0x345),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>前缀和</b>：pre[i]=前\x20i\x20项和，区间和\x20[l,r]\x20=\x20pre[r+1]−pre[l]，O(1)\x20查询。<b>前缀和\x20+\x20哈希</b>是高频组合：<b>和为\x20K\x20的子数组（560）</b>——遍历时用哈希记录各前缀和出现次数，查找\x20pre[i]−K\x20是否出现过。<b>差分</b>：区间批量加法的逆操作——在\x20l\x20处\x20+v、r+1\x20处\x20−v，最后求前缀和还原（区间更新\x20O(1)）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么哈希里要先放\x20{0:1}？”——处理“从下标\x200\x20开始的子数组”这种边界；“二维版？”——二维前缀和（304），矩阵区域和用容斥。““'},{'c':_0x410c2b(0x390),'s':0x3,'lv':'🔥','q':_0x410c2b(0x321),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':_0x410c2b(0x390),'s':0x4,'lv':'⭐','q':'动态规划：四步法与两道必会题','a':_0x410c2b(0x263)},{'c':_0x410c2b(0x390),'s':0x4,'lv':'🔥','q':_0x410c2b(0x2e3),'a':_0x410c2b(0x322)},{'c':_0x410c2b(0x390),'s':0x5,'lv':'🔥','q':_0x410c2b(0x2c2),'a':_0x410c2b(0x3ef)},{'c':_0x410c2b(0x390),'s':0x5,'lv':'💎','q':_0x410c2b(0x24b),'a':_0x410c2b(0x268)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x410c2b(0x23f),'a':_0x410c2b(0x38f)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x410c2b(0x1c2),'a':_0x410c2b(0x28d)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x410c2b(0x201),'a':_0x410c2b(0x1f1)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x410c2b(0x2c1),'a':_0x410c2b(0x364)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x410c2b(0x2c5),'a':_0x410c2b(0x370)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x410c2b(0x262),'a':_0x410c2b(0x326)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x410c2b(0x235),'a':_0x410c2b(0x428)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x410c2b(0x398),'a':_0x410c2b(0x24c)},{'c':'ml','s':0x1,'lv':'🔥','q':'权重初始化：为什么不能全零？','a':_0x410c2b(0x328)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x410c2b(0x343),'a':_0x410c2b(0x277)},{'c':'ml','s':0x2,'lv':'⭐','q':'过拟合：信号与对策清单','a':_0x410c2b(0x292)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x410c2b(0x3bc),'a':_0x410c2b(0x28f)},{'c':'ml','s':0x2,'lv':'🔥','q':'偏差-方差权衡，以及它在大模型时代的变化','a':_0x410c2b(0x247)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x410c2b(0x2de),'a':_0x410c2b(0x242)},{'c':'ml','s':0x2,'lv':'💎','q':_0x410c2b(0x2b9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x410c2b(0x3e3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>数据并行（DDP）</b>：每卡一份完整模型、切数据、梯度\x20all-reduce\x20同步——最简单，通信量约等于模型大小。<b>张量并行</b>：层内切矩阵（Megatron），卡间每层都要通信，<b>只适合单机高带宽（NVLink）</b>。<b>流水线并行</b>：按层切成多段串行，有<b>气泡（bubble）</b>浪费，靠\x20micro-batch\x20缓解。<b>ZeRO</b>（DeepSpeed）：把优化器状态/梯度/参数依次分片到各卡（stage\x201/2/3），显存大幅下降，通信换显存。实践：大规模训练是<b>三种并行\x20+\x20ZeRO\x20的组合（3D\x20并行）</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“7B\x20微调该用什么？”——单卡\x20QLoRA\x20就够；多卡全量微调用\x20ZeRO-2/3\x20或\x20FSDP；“应用岗要懂到什么程度？”——<b>知道各自解决什么问题、什么时候选哪个</b>即可，再深属于Infra\x20岗范畴。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x410c2b(0x32f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x410c2b(0x3b8),'a':_0x410c2b(0x3ed)},{'c':_0x410c2b(0x31c),'s':0x0,'lv':'⭐','q':_0x410c2b(0x2bf),'a':_0x410c2b(0x3af)},{'c':_0x410c2b(0x31c),'s':0x0,'lv':'⭐','q':'为什么需要多头注意力（Multi-Head）？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x410c2b(0x31c),'s':0x0,'lv':'🔥','q':_0x410c2b(0x2af),'a':_0x410c2b(0x315)},{'c':_0x410c2b(0x31c),'s':0x0,'lv':'🔥','q':_0x410c2b(0x308),'a':_0x410c2b(0x357)},{'c':_0x410c2b(0x31c),'s':0x1,'lv':'⭐','q':_0x410c2b(0x3a4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把位置信息编码成对\x20Q/K\x20向量<b>按位置角度做旋转</b>：旋转后\x20q_m·k_n\x20的内积只依赖<b>相对位置\x20m-n</b>，于是绝对位置的旋转自然导出相对位置的注意力。优势：相对位置、零额外参数、理论可外推、实现简单——现代LLM（Llama/Qwen/DeepSeek）的事实标准。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么高低维用不同频率？”——低维高频管局部、高维低频管长程，形成多尺度位置感知；“外推为什么会崩？”——训练长度外的旋转角度模型没见过，注意力\x20logits\x20分布异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署时如果做过长上下文配置（rope_scaling），这里就是现成的实践谈资。““““““'},{'c':_0x410c2b(0x31c),'s':0x1,'lv':'🔥','q':_0x410c2b(0x314),'a':_0x410c2b(0x207)},{'c':_0x410c2b(0x31c),'s':0x1,'lv':'🔥','q':_0x410c2b(0x2e0),'a':_0x410c2b(0x362)},{'c':_0x410c2b(0x31c),'s':0x2,'lv':'⭐','q':_0x410c2b(0x415),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：自回归生成时\x20token\x20t\x20的\x20K/V\x20在后续每步都被重复使用，缓存下来后每步只算新\x20token\x20的\x20Q/K/V，总复杂度从\x20O(n³)\x20级降到\x20O(n²)。<b>代价是显存</b>：每层每token\x20存\x20K\x20和\x20V\x20=\x202\x20×\x20层数\x20×\x20d_model\x20×\x20精度字节；7B（32\x20层/4096\x20维/fp16）约\x20<b>0.5MB/token</b>，长上下文\x20×\x20大\x20batch\x20下Cache\x20能超过模型权重本身。优化：GQA/MLA\x20压缩、PagedAttention（vLLM\x20分页管理、减少碎片）、KV\x20量化、滑窗淘汰。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“prefill\x20和\x20decode\x20有什么不同？”——prefill\x20并行算全部输入（compute-bound），decode\x20逐\x20token（memory-bound），这是两个优化方向的分界；“PagedAttention\x20的核心思想？”——借操作系统虚拟内存分页，按块分配、逻辑连续物理离散。““““““'},{'c':_0x410c2b(0x31c),'s':0x2,'lv':'⭐','q':_0x410c2b(0x3da),'a':_0x410c2b(0x255)},{'c':_0x410c2b(0x31c),'s':0x2,'lv':'💎','q':_0x410c2b(0x3d6),'a':_0x410c2b(0x385)},{'c':'llm','s':0x3,'lv':'⭐','q':_0x410c2b(0x26c),'a':_0x410c2b(0x2d4)},{'c':'llm','s':0x3,'lv':'🔥','q':_0x410c2b(0x34c),'a':_0x410c2b(0x2b2)},{'c':'llm','s':0x4,'lv':'🔥','q':_0x410c2b(0x3aa),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>BPE（字节对编码）：从字符/字节开始，反复合并语料中最高频的相邻\x20pair，直到词表达标（32k~150k）。好处：任意文本可编码（无\x20OOV）、词表可控。<b>后遗症（面试爱考）</b>：①\x20数字被切成任意片段\x20→\x20算术能力差（“9.11\x20和\x209.9\x20谁大”翻车）②\x20中文单字可能占\x202-3\x20token\x20→\x20又贵又慢\x20③\x20空格/大小写敏感\x20④\x20字符级任务差（数不清\x20strawberry\x20有几个\x20r）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么缓解数字问题？”——数字单独按位切分（Llama\x20系做法）；“中文模型怎么优化？”——扩充中文词表\x20+\x20继续预训练，token\x20效率能提升明显。““““““'},{'c':_0x410c2b(0x31c),'s':0x4,'lv':'🔥','q':_0x410c2b(0x3f1),'a':_0x410c2b(0x394)},{'c':_0x410c2b(0x31c),'s':0x5,'lv':'🔥','q':_0x410c2b(0x352),'a':_0x410c2b(0x2e5)},{'c':_0x410c2b(0x31c),'s':0x5,'lv':'🔥','q':_0x410c2b(0x1db),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':_0x410c2b(0x31c),'s':0x5,'lv':'🔥','q':_0x410c2b(0x212),'a':_0x410c2b(0x36a)},{'c':'llm','s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':_0x410c2b(0x1d3)},{'c':_0x410c2b(0x31c),'s':0x5,'lv':'🔥','q':_0x410c2b(0x30e),'a':_0x410c2b(0x412)},{'c':_0x410c2b(0x31c),'s':0x6,'lv':'⭐','q':_0x410c2b(0x3d0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':'llm','s':0x6,'lv':'🔥','q':_0x410c2b(0x371),'a':_0x410c2b(0x2a9)},{'c':_0x410c2b(0x31c),'s':0x7,'lv':'⭐','q':_0x410c2b(0x1d4),'a':_0x410c2b(0x31e)},{'c':'llm','s':0x7,'lv':'🔥','q':_0x410c2b(0x36e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三类信号：①\x20<b>logprob\x20/\x20困惑度</b>——低置信度是弱信号（但校准很差，模型常自信地错）\x20②\x20<b>自一致性</b>——多次采样答案发散说明不确定（比logprob\x20更可靠）\x20③\x20<b>让模型显式表达</b>——SFT\x20阶段训练它输出置信度或拒答。工程做法：不确定就<b>降级</b>（转RAG\x20检索、转人工、明确说不知道），而不是硬答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么校准差？”——RLHF\x20会让模型倾向于给出确定、令人满意的回答，反而损害校准；“怎么评估？”——ECE（期望校准误差）、拒答场景的准确率-覆盖率曲线。““““““'},{'c':_0x410c2b(0x31c),'s':0x7,'lv':'🔥','q':_0x410c2b(0x30a),'a':_0x410c2b(0x2b1)},{'c':'llm','s':0x7,'lv':'💎','q':_0x410c2b(0x37c),'a':_0x410c2b(0x2c3)},{'c':'rl','s':0x0,'lv':'⭐','q':'RL\x20的基本框架：MDP\x20五元组说清楚','a':_0x410c2b(0x307)},{'c':'rl','s':0x0,'lv':'⭐','q':'价值函数与贝尔曼方程','a':_0x410c2b(0x36f)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x410c2b(0x20d),'a':_0x410c2b(0x3b9)},{'c':'rl','s':0x1,'lv':'💎','q':_0x410c2b(0x248),'a':_0x410c2b(0x323)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':_0x410c2b(0x221)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x410c2b(0x37e),'a':_0x410c2b(0x29d)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x410c2b(0x20f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x410c2b(0x388),'a':_0x410c2b(0x301)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x410c2b(0x3d7),'a':_0x410c2b(0x2a6)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x410c2b(0x3cf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x410c2b(0x356)},{'c':'rl','s':0x3,'lv':'💎','q':'过程奖励\x20vs\x20结果奖励（PRM\x20vs\x20ORM）','a':_0x410c2b(0x361)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x410c2b(0x1f9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>奖励塑形</b>：稀疏奖励（只在赢/输时给分）学不动，需要设计中间奖励引导学习。但设计不当就出\x20<b>reward\x20hacking</b>——智能体钻奖励函数的空子拿高分却不完成真实目标（经典案例：赛艇游戏里agent\x20发现绕圈刷道具比冲线得分更高，于是永远不比赛）。防御：奖励函数保持与真实目标一致、加约束项、多指标交叉验证、人工看轨迹回放。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20的联系？”——RLHF\x20里的\x20reward\x20hacking\x20完全同源：模型学会讨好\x20RM\x20的表面特征（变长、堆结构词）而非真的更有用，所以要\x20KL\x20约束\x20+\x20监控长度。<b>“游戏\x20RL\x20里的\x20reward\x20hacking\x20和\x20RLHF\x20里的是同一个问题”——这句话能把你的实习经历和\x20LLM\x20岗直接接通。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>腾讯实习如果碰到过奖励设计/调参，这是最好的讲述切入点。““““““'},{'c':'rl','s':0x4,'lv':'🔥','q':_0x410c2b(0x3de),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x410c2b(0x33f),'a':_0x410c2b(0x350)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>LIMA\x20的著名结论：<b>“Less\x20Is\x20More\x20for\x20Alignment”</b>——1000\x20条精选数据可胜过数万条噪声数据；对齐阶段模型主要在学格式与风格，不是学知识。实践清单：①\x20<b>任务类型覆盖</b>（多样性>\x20数量）②\x20严格去重与去模板化\x20③\x20长度分布合理（别全是短答）④\x20<b>格式绝对一致</b>——一个坏样本就能教会模型坏格式\x20⑤\x20人工抽检\x20+\x20模型过滤双保险。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断数据够不够？”——看验证集指标是否随数据量饱和；“怎么衡量多样性？”——指令语义聚类分布、任务类型覆盖率、去重后剩余率。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>611\x20条数据覆盖\x206\x20类任务（变量解释/工况识别/原因分析/操作生成/安全提醒/处置后验证）——<b>“我不是凑数量，是按任务类型做覆盖设计”</b>，这正是\x20LIMA\x20结论的正确实践，能把“数据少”讲成“数据精”。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x410c2b(0x29f),'a':_0x410c2b(0x1bb)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x410c2b(0x373),'a':_0x410c2b(0x1ec)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x410c2b(0x2e4),'a':_0x410c2b(0x2ec)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x410c2b(0x3db),'a':_0x410c2b(0x257)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x410c2b(0x1f0),'a':_0x410c2b(0x2e6)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x410c2b(0x1d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x410c2b(0x2d5),'a':_0x410c2b(0x342)},{'c':'pt','s':0x1,'lv':'💎','q':_0x410c2b(0x260),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Adapter</b>：层间插入小瓶颈网络——有效但增加推理延迟（不能合并）。<b>Prefix/Prompt\x20Tuning</b>：只训一小段可学习的虚拟token\x20前缀——参数极少但占用上下文长度、效果不稳。<b>LoRA</b>：低秩旁路，可合并零延迟——事实标准。<b>DoRA</b>：把\x20ΔW\x20分解为幅度和方向分别学习，效果优于\x20LoRA\x20且同样可合并。<b>AdaLoRA</b>：动态给不同层分配不同\x20rank。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20LoRA\x20赢了？”——可合并（零推理开销）+\x20效果接近全量\x20+\x20实现简单\x20+\x20可热插拔，四点齐备。“““““'},{'c':'pt','s':0x2,'lv':'⭐','q':_0x410c2b(0x3e6),'a':_0x410c2b(0x243)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x410c2b(0x327),'a':_0x410c2b(0x282)},{'c':'pt','s':0x2,'lv':'💎','q':'完整后训练流水线：一个真实项目会怎么排','a':_0x410c2b(0x232)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x410c2b(0x422),'a':_0x410c2b(0x380)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x410c2b(0x287),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x410c2b(0x341),'a':_0x410c2b(0x3ab)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x410c2b(0x1cf),'a':_0x410c2b(0x3bb)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x410c2b(0x39e),'a':_0x410c2b(0x205)},{'c':'pt','s':0x3,'lv':'💎','q':_0x410c2b(0x3a6),'a':_0x410c2b(0x3e1)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x410c2b(0x33a),'a':_0x410c2b(0x3c3)},{'c':_0x410c2b(0x3d1),'s':0x0,'lv':'⭐','q':_0x410c2b(0x24e),'a':_0x410c2b(0x1cd)},{'c':_0x410c2b(0x3d1),'s':0x0,'lv':'⭐','q':_0x410c2b(0x40b),'a':_0x410c2b(0x271)},{'c':_0x410c2b(0x3d1),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x410c2b(0x3d1),'s':0x1,'lv':'🔥','q':_0x410c2b(0x316),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x410c2b(0x3d1),'s':0x1,'lv':'⭐','q':_0x410c2b(0x2b8),'a':_0x410c2b(0x24d)},{'c':_0x410c2b(0x3d1),'s':0x2,'lv':'🔥','q':_0x410c2b(0x389),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x410c2b(0x3d1),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x410c2b(0x41b)},{'c':'app','s':0x3,'lv':'🔥','q':_0x410c2b(0x338),'a':_0x410c2b(0x2d9)},{'c':_0x410c2b(0x3d1),'s':0x3,'lv':'💎','q':_0x410c2b(0x3df),'a':_0x410c2b(0x2bc)},{'c':_0x410c2b(0x3d1),'s':0x4,'lv':'⭐','q':_0x410c2b(0x3ec),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>原理：工具\x20schema（名称/参数/说明）注入\x20prompt\x20→\x20模型输出结构化调用请求（JSON）→\x20<b>你的代码</b>执行\x20→\x20结果回填\x20→\x20模型继续生成。关键认知：<b>模型自己不会执行任何工具，它只是“提议”调用。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问（坑与对策）</span><br>参数幻觉（编造字段/格式错）→\x20JSON\x20schema\x20校验+重试；该调不调/乱调\x20→\x20工具描述写清触发条件；多工具混淆\x20→\x20控制工具数量、描述差异化；执行失败\x20→\x20错误信息结构化回喂，让模型自我修正。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目的“执行反馈修正”就是第\x204\x20条的实战：报错\x20SQL\x20连错误信息一起回喂模型重写。““““““'},{'c':_0x410c2b(0x3d1),'s':0x4,'lv':'⭐','q':_0x410c2b(0x254),'a':_0x410c2b(0x423)},{'c':'app','s':0x4,'lv':'🔥','q':_0x410c2b(0x424),'a':_0x410c2b(0x32d)},{'c':_0x410c2b(0x3d1),'s':0x4,'lv':'🔥','q':_0x410c2b(0x2b5),'a':_0x410c2b(0x1fa)},{'c':_0x410c2b(0x3d1),'s':0x5,'lv':'🔥','q':'多轮对话的上下文怎么管理？','a':_0x410c2b(0x237)},{'c':_0x410c2b(0x3d1),'s':0x5,'lv':'💎','q':_0x410c2b(0x369),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x410c2b(0x3d1),'s':0x6,'lv':'⭐','q':'结构化输出怎么保证？（JSON\x20总是不合法怎么办）','a':_0x410c2b(0x39a)},{'c':_0x410c2b(0x3d1),'s':0x6,'lv':'⭐','q':'Prompt\x20Injection：LLM\x20应用的头号安全问题','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>攻击面：用户输入或<b>检索到的内容</b>里藏指令（“忽略之前的指令……”），模型可能照办——RAG\x20场景里检索内容也是不可信输入。三层防线：<b>输入侧</b>（指令与数据分隔、可疑模式检测）→\x20<b>权限侧</b>（只读账号、最小权限、危险操作人审）→\x20<b>输出侧</b>（动作执行前校验、敏感操作二次确认）。核心认知：<b>prompt\x20层永远防不死，必须权限层兜底。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20SQL\x20注入的异同？”——同属“数据被当指令执行”，防御思路同源：参数化分隔\x20+\x20最小权限。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20的只读账号\x20+\x20LIMIT\x20强制\x20+\x20行列权限，就是权限层防线的现成案例。““““““'},{'c':'app','s':0x6,'lv':'🔥','q':_0x410c2b(0x228),'a':_0x410c2b(0x1c8)},{'c':_0x410c2b(0x3d1),'s':0x6,'lv':'💎','q':_0x410c2b(0x393),'a':_0x410c2b(0x3a7)},{'c':'app', ,'lv':'⭐','q':_0x410c2b(0x1df),'a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':_0x410c2b(0x418),'s':0x1,'lv':'⭐','q':_0x410c2b(0x21f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>面试官挖项目，本质在问五件事，按这个顺序主动交付：<br>①\x20<b>背景与目标</b>——谁的痛点、为什么值得做、你的角色<br>②\x20<b>难点</b>——技术上最难的\x202-3\x20点（不是“工作量大”，是<b>技术判断难</b>）<br>③\x20<b>权衡</b>——你考虑过哪些方案、为什么选这个、放弃了什么（<b>这一层最能区分候选人</b>）<br>④\x20<b>数据</b>——效果指标\x20+\x20口径\x20+\x20怎么测的<br>⑤\x20<b>复盘</b>——哪里做得不好、如果重做会怎么改<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>大多数候选人只讲\x20①②④，<b>而面试官真正想听的是\x20③\x20和\x20⑤</b>——它们证明你有技术判断力和反思能力，不是执行工具。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“你遇到最大的困难”时，答“数据太少/时间太紧”是废答案；要答<b>技术性困难\x20+\x20你的解法+\x20学到什么</b>。“'},{'c':'story','s':0x1,'lv':'⭐','q':_0x410c2b(0x334),'a':_0x410c2b(0x41d)},{'c':_0x410c2b(0x418),'s':0x2,'lv':'⭐','q':_0x410c2b(0x374),'a':_0x410c2b(0x23e)},{'c':_0x410c2b(0x418),'s':0x2,'lv':'🔥','q':_0x410c2b(0x1cc),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检，答不出就去补</span><br>①\x2098%/96%\x20的测试集多大、谁判、怎么判？<br>②\x20307\x20个字段怎么进prompt\x20的？（schema\x20裁剪策略）<br>③\x20字段别名库怎么建的、多少条？<br>④\x20多轮对话的指代怎么消解的？<br>⑤\x20执行反馈修正最多重试几轮、会不会越改越错？<br>⑥\x20复杂多表\x20join\x20的成功率和单表比差多少？<br>⑦\x20为什么选\x20Qwen、哪个尺寸、为什么这个尺寸？<br>⑧\x20海光\x20DCU\x20上踩了什么坑？<br>⑨\x20安全怎么做的？（只读、权限、注入防护）<br>⑩\x20如果重做，你会改哪三件事？<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>这十个问题就是你的复习清单</b>。每个都写下3-5
