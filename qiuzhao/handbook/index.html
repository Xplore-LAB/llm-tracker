<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

>按题型刷而不是按顺序刷</b>——同类型连做\x205\x20题，形成肌肉记忆\x20②\x20<b>优先级</b>：哈希/双指针/滑窗/二分\x20→\x20链表/树/BFS·DFS\x20→\x20DP/回溯\x20→\x20单调栈/堆；LeetCode\x20Hot\x20100\x20是性价比最高的题单\x20③\x20<b>刷题≠看题解</b>——先自己写\x2020\x20分钟，卡住再看，然后<b>关掉题解重写一遍</b>\x20④\x20<b>笔试和面试要求不同</b>：笔试拼速度和AC，面试拼<b>讲清思路\x20+\x20边界处理\x20+\x20复杂度分析</b>。<br><span\x20class=\x27lb\x27>➤\x20面试现场纪律</span><br>先<b>问清输入范围和边界</b>（空输入、单元素、重复元素）→\x20口述思路和复杂度并确认\x20→\x20再写代码\x20→\x20主动举例验证。<b>沉默地写代码是最差的表现。</b><br><span\x20class=\x27lb\x27>⚠\x20提醒</span><br>本章只提供模板与判断逻辑，<b>手感必须靠实际敲键盘获得</b>——这一章是索引，不是替代品。““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x4fe920(0x297),'a':_0x4fe920(0x29f)},{'c':'ml','s':0x0,'lv':'⭐','q':'梯度消失\x20/\x20爆炸：成因与五种对策','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：深层网络梯度<b>连乘</b>——每层雅可比的谱范数若持续小于\x201\x20就指数衰减（消失），大于\x201\x20就指数放大（爆炸）；sigmoid/tanh\x20的饱和区导数趋零会加剧消失。对策：①合适初始化（Xavier/He，控制每层方差）②\x20归一化层（LN/RMSNorm）③\x20<b>残差连接</b>——给梯度一条恒等映射的“高速公路”，这是深层网络能训起来的根本原因\x20④\x20<b>梯度裁剪</b>（大模型标配，clip\x20全局范数到\x201.0）⑤换\x20ReLU\x20族激活。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“残差为什么有效？”——y=x+F(x)\x20的导数含常数项\x201，梯度至少能原样传回，不会被连乘吃光；“LLM\x20训练常见的\x20loss\x20spike\x20是哪种？”——多为爆炸类，靠梯度裁剪\x20+\x20降lr\x20+\x20跳过坏\x20batch\x20处理。““““'},{'c':'ml','s':0x0,'lv':'⭐','q':_0x4fe920(0x3af),'a':_0x4fe920(0x189)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x4fe920(0x1f0),'a':_0x4fe920(0x18d)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x4fe920(0x330),'a':_0x4fe920(0x282)},{'c':'ml','s':0x0,'lv':'🔥','q':'梯度累积与梯度裁剪','a':_0x4fe920(0x18a)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x4fe920(0x369),'a':_0x4fe920(0x25d)},{'c':'ml','s':0x1,'lv':'🔥','q':'激活函数：ReLU\x20/\x20GELU\x20/\x20SiLU\x20/\x20SwiGLU','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ReLU</b>：max(0,x)，快但负区梯度为零（神经元死亡）。<b>GELU</b>：x·Φ(x)，平滑版\x20ReLU，BERT/GPT\x20系用。<b>SiLU/Swish</b>：x·sigmoid(x)，平滑且有轻微负值。<b>SwiGLU</b>（现代\x20LLM\x20FFN\x20标配）：FFN(x)\x20=\x20(xW₁\x20⊙\x20SiLU(xW₃))W₂——<b>门控机制引入乘性交互</b>，表达能力更强；代价是多一个投影矩阵，所以通常把中间维度调小以保持参数量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么门控有效？”——乘性交互让网络能表达“条件性通过”，比纯加性变换表达力更强，实验上稳定优于\x20ReLU/GELU；“为什么\x20FFN\x20中间维度是\x208/3\x20倍而不是\x204\x20倍？”——正是为了在加了第三个矩阵后保持总参数量不变。““““'},{'c':'ml','s':0x1,'lv':'🔥','q':_0x4fe920(0x2b7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>全零\x20→\x20所有神经元完全对称、收到相同梯度，永远学不出差异（对称性破坏失败）。<b>Xavier</b>：方差\x202/(fan_in+fan_out)，适配\x20tanh/sigmoid，保持前向后向方差稳定。<b>He</b>：方差\x202/fan_in，适配\x20ReLU\x20族——因为\x20ReLU\x20砍掉一半输出，方差要加倍补偿。大模型语境：初始化尺度还要按<b>深度缩放</b>（如输出投影按\x201/√(2N)\x20缩小），否则深层残差累积会让激活爆炸。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“初始化不当的症状？”——开局\x20loss\x20异常大或\x20NaN、或者\x20loss\x20长期不动；“为什么\x20LoRA\x20的\x20B\x20可以初始化为零？”——因为\x20A\x20是随机的，A·B\x20整体不为对称零，且这样保证起点\x20ΔW=0。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x4fe920(0x1f9)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x4fe920(0x237),'a':_0x4fe920(0x195)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4fe920(0x23e),'a':_0x4fe920(0x2b3)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4fe920(0x2bc),'a':_0x4fe920(0x387)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4fe920(0x383),'a':_0x4fe920(0x271)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':_0x4fe920(0x384)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x4fe920(0x2c6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>数据并行（DDP）</b>：每卡一份完整模型、切数据、梯度\x20all-reduce\x20同步——最简单，通信量约等于模型大小。<b>张量并行</b>：层内切矩阵（Megatron），卡间每层都要通信，<b>只适合单机高带宽（NVLink）</b>。<b>流水线并行</b>：按层切成多段串行，有<b>气泡（bubble）</b>浪费，靠\x20micro-batch\x20缓解。<b>ZeRO</b>（DeepSpeed）：把优化器状态/梯度/参数依次分片到各卡（stage\x201/2/3），显存大幅下降，通信换显存。实践：大规模训练是<b>三种并行\x20+\x20ZeRO\x20的组合（3D\x20并行）</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“7B\x20微调该用什么？”——单卡\x20QLoRA\x20就够；多卡全量微调用\x20ZeRO-2/3\x20或\x20FSDP；“应用岗要懂到什么程度？”——<b>知道各自解决什么问题、什么时候选哪个</b>即可，再深属于Infra\x20岗范畴。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x4fe920(0x213),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x4fe920(0x246),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>目的：用更低位宽表示权重（和/或激活）以省显存、提吞吐。<b>训练后量化\x20PTQ</b>（主流）：<b>GPTQ</b>逐层最小化量化误差、需要校准集；<b>AWQ</b>\x20识别并保护“重要通道”（激活幅值大的权重），精度损失更小、推理更快。<b>NF4</b>（QLoRA\x20用）针对正态分布权重设计。<b>W8A8</b>\x20指权重和激活都量化到\x208bit，吞吐收益更大但精度风险更高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“INT4\x20掉点吗？”——小模型掉得明显，大模型相对耐受；关键看任务，结构化/推理任务更敏感；“什么时候别量化？”——精度要求极高、或显存本来就够时。““““'},{'c':_0x4fe920(0x3bc),'s':0x0,'lv':'⭐','q':'Self-Attention\x20的完整公式与每一步含义','a':_0x4fe920(0x2a8)},{'c':_0x4fe920(0x3bc),'s':0x0,'lv':'⭐','q':_0x4fe920(0x3a5),'a':_0x4fe920(0x177)},{'c':'llm','s':0x0,'lv':'🔥','q':_0x4fe920(0x39a),'a':_0x4fe920(0x325)},{'c':_0x4fe920(0x3bc),'s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':_0x4fe920(0x32a)},{'c':'llm','s':0x1,'lv':'⭐','q':_0x4fe920(0x2e4),'a':_0x4fe920(0x328)},{'c':_0x4fe920(0x3bc),'s':0x1,'lv':'🔥','q':_0x4fe920(0x34b),'a':_0x4fe920(0x1ed)},{'c':_0x4fe920(0x3bc),'s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':_0x4fe920(0x199)},{'c':_0x4fe920(0x3bc),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x4fe920(0x2bf)},{'c':_0x4fe920(0x3bc),'s':0x2,'lv':'⭐','q':'参数量与显存估算（必考口算）','a':_0x4fe920(0x280)},{'c':_0x4fe920(0x3bc),'s':0x2,'lv':'💎','q':_0x4fe920(0x289),'a':_0x4fe920(0x2ba)},{'c':_0x4fe920(0x3bc),'s':0x3,'lv':'⭐','q':_0x4fe920(0x1d2),'a':_0x4fe920(0x220)},{'c':_0x4fe920(0x3bc),'s':0x3,'lv':'🔥','q':'数值稳定的\x20softmax\x20与\x20logsumexp','a':_0x4fe920(0x3a7)},{'c':_0x4fe920(0x3bc),'s':0x4,'lv':'🔥','q':_0x4fe920(0x170),'a':_0x4fe920(0x291)},{'c':_0x4fe920(0x3bc),'s':0x4,'lv':'🔥','q':_0x4fe920(0x2d1),'a':_0x4fe920(0x329)},{'c':_0x4fe920(0x3bc),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':_0x4fe920(0x375)},{'c':_0x4fe920(0x3bc),'s':0x5,'lv':'🔥','q':_0x4fe920(0x3a8),'a':_0x4fe920(0x175)},{'c':_0x4fe920(0x3bc),'s':0x5,'lv':'🔥','q':_0x4fe920(0x33a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x4fe920(0x3bc),'s':0x5,'lv':'💎','q':_0x4fe920(0x336),'a':_0x4fe920(0x39c)},{'c':'llm','s':0x5,'lv':'🔥','q':'五个模型的架构差异：一张表答完','a':_0x4fe920(0x30b)},{'c':'llm','s':0x6,'lv':'⭐','q':_0x4fe920(0x331),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心变化：<b>把算力从训练时挪到推理时</b>（test-time\x20compute）——模型先生成一段长思维链自我推理、验证、回溯，再给出答案，用“想更久”换正确率。训练方式的关键突破：<b>用可验证奖励做大规模\x20RL</b>（答案对不对、格式对不对可以自动判定），DeepSeek-R1\x20用\x20GRPO\x20证明了纯\x20RL\x20也能激发出反思、自我纠错等行为，无需海量人工标注的思维链。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“适用边界？”——数学、代码、逻辑等<b>有明确验证信号</b>的任务收益大；开放写作、闲聊收益小还更贵更慢；“工程代价？”——输出\x20token\x20数暴涨，成本和延迟显著上升，要按任务路由。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年这题几乎必问。别只说“会思考”，要讲出“可验证奖励\x20+\x20RL\x20+\x20推理时计算”这三个关键词。““““““'},{'c':'llm','s':0x6,'lv':'🔥','q':_0x4fe920(0x2e0),'a':_0x4fe920(0x3c1)},{'c':_0x4fe920(0x3bc),'s':0x7,'lv':'⭐','q':_0x4fe920(0x300),'a':_0x4fe920(0x1b1)},{'c':_0x4fe920(0x3bc),'s':0x7,'lv':'🔥','q':_0x4fe920(0x261),'a':_0x4fe920(0x260)},{'c':_0x4fe920(0x3bc),'s':0x7,'lv':'🔥','q':'In-Context\x20Learning：为什么不训练也能学？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>不更新任何参数，只在\x20prompt\x20里给示例，模型就能完成新任务——GPT-3\x20的核心发现。主流解释（面试够用）：预训练中见过海量“任务-示例-答案”结构，模型学会了在上下文中做<b>模式补全\x20/\x20隐式贝叶斯任务推断</b>；也有研究认为注意力可以实现类似梯度下降的隐式优化。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“示例怎么选影响大吗？”——非常大：数量（3-5个通常够）、<b>格式一致性</b>（比内容正确性影响更大）、顺序（近端示例影响更强）、与query\x20的相似度（检索式选例更优）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20项目把\x20SQL\x20示例入库、按\x20query\x20检索注入，就是“检索式\x20few-shot\x20选例”的工程实现——这是\x20ICL\x20原理的直接应用。““““““'},{'c':_0x4fe920(0x3bc),'s':0x7,'lv':'💎','q':_0x4fe920(0x34c),'a':_0x4fe920(0x20d)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x4fe920(0x19b),'a':_0x4fe920(0x176)},{'c':'rl','s':0x0,'lv':'⭐','q':'价值函数与贝尔曼方程','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x4fe920(0x2c3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Q-learning：用贝尔曼最优方程做<b>时序差分</b>更新，Q(s,a)\x20←\x20Q(s,a)\x20+\x20α[r\x20+\x20γ\x20max_a\x27\x20Q(s\x27,a\x27)\x20−\x20Q(s,a)]，学到\x20Q\x20后贪心取\x20argmax\x20就是最优策略。它是\x20<b>off-policy</b>的（更新用\x20max，与实际采样策略无关），所以能用经验回放。<b>DQN</b>\x20三个关键工程技巧：①\x20神经网络近似\x20Q\x20②\x20<b>经验回放池</b>打破样本相关性\x20③\x20<b>目标网络</b>（延迟更新的\x20Q\x20副本）稳定\x20TD\x20目标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么需要目标网络？”——不然是“用自己预测自己”，目标随参数一起动会震荡甚至发散；“局限？”——只适合<b>离散动作</b>，连续/高维动作空间要用策略方法。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>游戏AI\x20的经典入口（Atari、棋牌类离散动作）——腾讯游戏算法场景可以从这里切入讲。““““““'},{'c':'rl','s':0x1,'lv':'💎','q':_0x4fe920(0x33e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>核心矛盾：只利用已知最优会错过更好的选择，只探索则学不到高回报策略。常用手段：<b>ε-greedy</b>（以\x20ε\x20概率随机，最简单）、<b>Boltzmann/softmax\x20采样</b>（按价值高低概率化选择，等价于温度采样）、<b>UCB</b>（给不确定的动作加探索奖励）、<b>内在奖励</b>（好奇心驱动，奖励“新状态”）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和\x20LLM\x20采样的关系？”——temperature/top-p\x20本质就是探索-利用的旋钮：低温=利用（确定性输出），高温=探索（多样性）。<b>能把这两件事联系起来，是这一章最值钱的一句话。</b><br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RLHF\x20里\x20KL\x20惩罚也是这个权衡的变体：约束探索半径，防止策略跑出参考模型的合理区域。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x4fe920(0x165),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x4fe920(0x264),'a':_0x4fe920(0x2d2)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x4fe920(0x376),'a':_0x4fe920(0x248)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x4fe920(0x320),'a':_0x4fe920(0x277)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x4fe920(0x3b4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>关键洞察：带\x20KL\x20约束的奖励最大化问题有<b>闭式最优解</b>，最优策略与参考策略的<b>对数概率比</b>正好等于奖励（差一个归一化常数）。于是可以把奖励参数化掉，直接对偏好对\x20(chosen,\x20rejected)\x20做二分类式监督学习：<br>L\x20=\x20−log\x20σ(β·[(log\x20π(y_w|x)\x20−\x20log\x20π_ref(y_w|x))\x20−\x20(log\x20π(y_l|x)\x20−\x20log\x20π_ref(y_l|x))])<br>好处：<b>不需要\x20RM、不需要在线采样、不需要\x20PPO</b>——单阶段、稳定、便宜。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“局限？”——完全依赖离线偏好数据质量，没有在线探索；有<b>长度偏置</b>（偏爱长回答）；对分布外数据鲁棒性不如在线\x20RL；“变体？”——IPO（改损失防过拟合）、KTO（只需单条好/坏标注，不用成对）、ORPO（把\x20SFT\x20和偏好合成一个阶段）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>如果被问“你的论文为什么只做\x20SFT\x20没做\x20DPO”：诚实答“领域数据只有\x20611\x20条、构造偏好对的标注成本和一致性难保证；我优先用结构化监督解决输出可靠性问题，偏好对齐是下一步的自然延伸”——把局限讲成路线图，而不是硬伤。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x4fe920(0x23f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PPO\x20的重负担是\x20<b>Critic\x20网络</b>（与策略同量级、难训、占显存）。GRPO（Group\x20Relative\x20Policy\x20Optimization）的做法：对同一\x20prompt\x20<b>采样一组回答（如\x208-16\x20个）</b>，用<b>组内奖励的归一化值</b>（减均值除标准差）作为优势估计——<b>用组内相对比较替代绝对价值估计</b>，Critic\x20直接删掉。配合<b>规则化可验证奖励</b>（答案对不对、格式对不对，自动判定），在数学与代码推理上效果爆发，是\x20DeepSeek-R1\x20的核心方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么组内相对就够了？”——策略梯度只需要“这个回答比同批其他回答好还是差”，不需要绝对价值；“适用前提？”——奖励要能自动、廉价、大量地算出来（可验证任务），开放生成任务上不好用。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>2026\x20年高频题。答案要点三个词：<b>组内相对优势、无\x20critic、可验证奖励</b>。““““““'},{'c':'rl','s':0x3,'lv':'🔥','q':_0x4fe920(0x34f),'a':_0x4fe920(0x1a8)},{'c':'rl','s':0x3,'lv':'💎','q':_0x4fe920(0x245),'a':_0x4fe920(0x221)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x4fe920(0x368),'a':_0x4fe920(0x26c)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':_0x4fe920(0x1f7)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20在解决什么问题？天花板在哪？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>作用：把预训练的“续写机器”对齐到<b>指令遵循与对话格式</b>——教模型「怎么说话」，而不是灌输新知识。天花板三条：①\x20只学正例，没有“什么是坏回答”的信号\x20②\x20上限受数据质量约束，无法超越示范数据\x20③\x20对风格、价值观、安全边界这类偏好问题力不从心。所以后面要接偏好对齐——<b>SFT\x20教格式，偏好优化对口味。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“SFT\x20能加新知识吗？”——很有限且危险：小数据学不进去，大数据又容易灾难性遗忘，且学到的知识易幻觉。<b>知识用RAG，行为用\x20SFT</b>；“需要多少数据？”——见下一条。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20OKC-SFT\x20正是典型的“行为对齐”：不是教模型空分工艺知识，而是教它<b>按六段式结构组织处置指令</b>——这个定位讲清楚，说明你没混淆\x20SFT\x20的作用边界。“““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x4fe920(0x2b2),'a':_0x4fe920(0x1e9)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x4fe920(0x3bb),'a':_0x4fe920(0x2cb)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x4fe920(0x178),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x4fe920(0x22d),'a':_0x4fe920(0x1a5)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x4fe920(0x381),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三个技术叠加：①\x20<b>4bit\x20NF4\x20量化</b>基座权重并冻结（NF4\x20是针对正态分布权重的信息论最优量化，反传时反量化到\x20bf16\x20计算）②\x20<b>双重量化</b>——把量化常数再量化，进一步压缩\x20③\x20<b>分页优化器</b>——显存峰值时把优化器状态临时卸载到\x20CPU\x20内存。结果：单卡\x2024GB\x20微调\x207B\x20轻松、48GB\x20可碰\x2065B。代价：有精度损失和速度损失，但多数下游任务可接受。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“量化了还能训吗？”——基座冻结不更新，只有\x20LoRA\x20分支（bf16）参与梯度更新，所以量化误差不会累积；“什么时候别用？”——追求极限效果、算力充足时用LoRA/全量更好。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（必背）</span><br>选QLoRA\x20的完整理由链：<b>“领域数据\x20611\x20条\x20+\x20单卡算力\x20+\x20要保留\x20Qwen\x20通用能力\x20→全量微调既超显存又必过拟合，QLoRA\x20是唯一合理解。”</b>把技术选型讲成有算术和约束支撑的决策，而不是“我用了个流行方法”。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':'LoRA的\x20rank\x20和\x20alpha\x20怎么定？','a':_0x4fe920(0x30f)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x4fe920(0x2ec),'a':_0x4fe920(0x29a)},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':_0x4fe920(0x37c)},{'c':'pt','s':0x1,'lv':'💎','q':_0x4fe920(0x348),'a':_0x4fe920(0x193)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x4fe920(0x1da),'a':_0x4fe920(0x1df)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x4fe920(0x25c),'a':_0x4fe920(0x23a)},{'c':'pt','s':0x2,'lv':'💎','q':'完整后训练流水线：一个真实项目会怎么排','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x4fe920(0x1af),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x4fe920(0x35c),'a':_0x4fe920(0x190)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x4fe920(0x1b3),'a':_0x4fe920(0x2a2)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4fe920(0x1cd),'a':_0x4fe920(0x1d5)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4fe920(0x3ab),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>通用</b>：MMLU/CMMLU/C-Eval（知识问答）。<b>代码</b>：HumanEval/MBPP（pass@k）。<b>推理</b>：GSM8K/MATH。<b>对话</b>：MT-Bench、AlpacaEval（LLM\x20裁判\x20+\x20人类偏好）。<b>长文本</b>：needle-in-haystack、RULER。<b>陷阱</b>：①\x20<b>数据污染</b>——基准题进了训练集，跑分虚高（要做去污染检查）②\x20<b>刷榜≠好用</b>——针对基准优化的模型在真实业务上未必强③\x20单一指标掩盖问题（平均分高但某类任务崩）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么检查污染？”——n-gram\x20重叠检测、基准题的困惑度异常低是信号；“更可信的做法？”——<b>自建贴合业务的私有评测集</b>，这是工业界的共识。“““““'},{'c':'pt','s':0x3,'lv':'💎','q':_0x4fe920(0x25a),'a':_0x4fe920(0x259)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4fe920(0x386),'a':_0x4fe920(0x31d)},{'c':_0x4fe920(0x3c2),'s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x4fe920(0x322)},{'c':_0x4fe920(0x3c2),'s':0x0,'lv':'⭐','q':_0x4fe920(0x2fd),'a':_0x4fe920(0x25b)},{'c':'app','s':0x1,'lv':'⭐','q':_0x4fe920(0x1fa),'a':_0x4fe920(0x21c)},{'c':'app','s':0x1,'lv':'🔥','q':_0x4fe920(0x1f4),'a':_0x4fe920(0x2fb)},{'c':'app','s':0x1,'lv':'⭐','q':'Rerank\x20为什么有效？和粗排怎么分工？','a':_0x4fe920(0x1ae)},{'c':_0x4fe920(0x3c2),'s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x4fe920(0x27e)},{'c':_0x4fe920(0x3c2),'s':0x2,'lv':'⭐','q':_0x4fe920(0x2e8),'a':_0x4fe920(0x2c4)},{'c':_0x4fe920(0x3c2),'s':0x3,'lv':'🔥','q':_0x4fe920(0x187),'a':_0x4fe920(0x2a1)},{'c':_0x4fe920(0x3c2),'s':0x3,'lv':'💎','q':_0x4fe920(0x389),'a':_0x4fe920(0x3b3)},{'c':_0x4fe920(0x3c2),'s':0x4,'lv':'⭐','q':_0x4fe920(0x28a),'a':_0x4fe920(0x1dc)},{'c':_0x4fe920(0x3c2),'s':0x4,'lv':'⭐','q':_0x4fe920(0x379),'a':_0x4fe920(0x1a3)},{'c':_0x4fe920(0x3c2),'s':0x4,'lv':'🔥','q':_0x4fe920(0x2f1),'a':_0x4fe920(0x3ba)},{'c':_0x4fe920(0x3c2),'s':0x4,'lv':'🔥','q':_0x4fe920(0x3b8),'a':_0x4fe920(0x1e3)},{'c':'app','s':0x5,'lv':'🔥','q':_0x4fe920(0x377),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：窗口有限、历史越长越贵、无关历史稀释注意力。四种策略<b>按可靠性排序</b>：①\x20关键信息抽成<b>结构化状态</b>显式维护（最可靠）②\x20老历史摘要压缩携带\x20③\x20query\x20改写成独立问题，历史只做参考\x20④\x20滑窗截断（最简单）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么结构化状态最可靠？”——把原文塞给模型让它自己找关键信息，等于把难点丢回给模型；显式状态是工程确定性。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里用户选定的表、时间范围，就是该抽成会话状态的典型——别让它沉在对话原文里。““““““'},{'c':_0x4fe920(0x3c2),'s':0x5,'lv':'💎','q':'Agent\x20的记忆系统怎么设计？','a':_0x4fe920(0x321)},{'c':_0x4fe920(0x3c2),'s':0x6,'lv':'⭐','q':_0x4fe920(0x32f),'a':_0x4fe920(0x242)},{'c':_0x4fe920(0x3c2),'s':0x6,'lv':'⭐','q':'Prompt\x20Injection：LLM\x20应用的头号安全问题','a':_0x4fe920(0x2fa)},{'c':_0x4fe920(0x3c2),'s':0x6,'lv':'🔥','q':_0x4fe920(0x1cf),'a':_0x4fe920(0x311)},{'c':_0x4fe920(0x3c2),'s':0x6,'lv':'💎','q':'RAG\x20vs\x20微调：什么问题上哪个？','a':_0x4fe920(0x208)},{'c':_0x4fe920(0x3c2),'s':0x7,'lv':'⭐','q':_0x4fe920(0x1a2),'a':_0x4fe920(0x27b)},{'c':_0x4fe920(0x3c2),'s':0x7,'lv':'🔥','q':_0x4fe920(0x3a3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Schema\x20全塞\x20prompt\x20不行：超窗口、稀释注意力、映射错误率飙升。组合拳：<b>schema\x20裁剪</b>（检索/规则先选出相关表列，只把它们放进\x20prompt）＋\x20<b>字段描述与别名库</b>（RAG\x20检索最相关字段说明注入）＋\x20<b>few-shot\x20示例</b>示范映射模式\x20＋\x20<b>生成前要素完备性校验</b>（问题里的每个查询要素是否都落到了字段上）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么验证\x20linking\x20对不对？”——生成前校验要素完备性，生成后看\x20SQL\x20引用的表列是否都在候选集合内。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文级讲法一句话：<b>“我把\x20linking\x20当检索问题做，而不是当生成问题做。”</b>““““““'},{'c':_0x4fe920(0x3c2),'s':0x7,'lv':'⭐','q':_0x4fe920(0x36f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':_0x4fe920(0x3c2),'s':0x7,'lv':'🔥','q':_0x4fe920(0x2b0),'a':_0x4fe920(0x323)},{'c':_0x4fe920(0x3c2),'s':0x7,'lv':'🔥','q':_0x4fe920(0x372),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多轮</b>：指代消解（“那上月呢”→\x20补全成完整查询意图）+\x20会话状态显式维护（已选表、时间范围）+\x20历史摘要管理。<b>权限</b>：生成前按用户权限过滤可见\x20schema（行列级）＋\x20只读账号\x20＋\x20LIMIT\x20强制\x20＋\x20危险关键字拦截（DROP/DELETE/UPDATE）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“schema\x20过滤和生成后拦截哪个好？”——都要：生成前过滤减少出错面，生成后拦截兜底，这叫<b>纵深防御</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>和「Prompt\x20Injection」那条连成完整的安全故事：输入防护\x20+\x20权限最小化\x20+\x20输出拦截，三层都真实做过。““““““'},{'c':'eng','s':0x0,'lv':'⭐','q':_0x4fe920(0x2e9),'a':_0x4fe920(0x1c7)},{'c':_0x4fe920(0x31b),'s':0x0,'lv':'⭐','q':_0x4fe920(0x224),'a':_0x4fe920(0x27d)},{'c':_0x4fe920(0x31b),'s':0x0,'lv':'🔥','q':_0x4fe920(0x3bf),'a':_0x4fe920(0x3bd)},{'c':'eng','s':0x1,'lv':'⭐','q':_0x4fe920(0x327),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':'eng','s':0x1,'lv':'🔥','q':_0x4fe920(0x23c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>ACID</b>：原子性、一致性、隔离性、持久性。隔离级别从弱到强：读未提交（脏读）→\x20<b>读已提交\x20RC</b>（不可重复读）→\x20<b>可重复读\x20RR</b>（MySQL\x20默认，MVCC\x20实现）→\x20串行化。<b>MVCC</b>：每行维护版本链\x20+\x20读视图（read\x20view），读操作读快照不加锁\x20→\x20<b>读写不互斥</b>，这是高并发的关键。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“幻读怎么解决？”——RR\x20下靠间隙锁（next-key\x20lock）；“分析型查询关心什么？”——你的场景主要是只读一致性快照，长事务会导致\x20undo\x20堆积，要注意。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>应用岗能讲清“四级别\x20+\x20MVCC\x20一句话\x20+\x20读写不互斥”就够，不必背锁的所有细节。“““'},{'c':'eng','s':0x1,'lv':'🔥','q':_0x4fe920(0x396),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>JOIN\x20原则：<b>小表驱动大表</b>、join\x20字段必须有索引且<b>类型一致</b>（类型不一致会导致隐式转换、索引失效）、避免多表大join\x20直接上（考虑先过滤再join）。聚合优化：GROUP\x20BY\x20列建索引可避免临时表和排序；COUNT(*)\x20优于\x20COUNT(列)（后者要判空）；能提前过滤就用\x20WHERE\x20而不是\x20HAVING。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“执行计划里最怕看到什么？”——Using\x20temporary（临时表）、Using\x20filesort（额外排序）、type=ALL（全表扫描）、rows\x20数量级异常。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>NL2SQL\x20里“多表联查”是明确的难点——能讲出<b>“我在\x20prompt\x20里约束了\x20join\x20条件必须完整、并做了执行前的语法与代价检查”</b>就是加分。“““'},{'c':_0x4fe920(0x31b),'s':0x2,'lv':'⭐' (0x17f),'a':_0x4fe920(0x267)},{'c':_0x4fe920(0x31b),'s':0x4,'lv':'💎','q':_0x4fe920(0x1fe),'a':_0x4fe920(0x305)},{'c':_0x4fe920(0x33c),'s':0x0,'lv':'⭐','q':_0x4fe920(0x3c3),'a':_0x4fe920(0x216)},{'c':'story','s':0x0,'lv':'⭐','q':_0x4fe920(0x219),'a':_0x4fe920(0x397)},{'c':'story','s':0x1,'lv':'⭐','q':_0x4fe920(0x1cb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>面试官挖项目，本质在问五件事，按这个顺序主动交付：<br>①\x20<b>背景与目标</b>——谁的痛点、为什么值得做、你的角色<br>②\x20<b>难点</b>——技术上最难的\x202-3\x20点（不是“工作量大”，是<b>技术判断难</b>）<br>③\x20<b>权衡</b>——你考虑过哪些方案、为什么选这个、放弃了什么（<b>这一层最能区分候选人</b>）<br>④\x20<b>数据</b>——效果指标\x20+\x20口径\x20+\x20怎么测的<br>⑤\x20<b>复盘</b>——哪里做得不好、如果重做会怎么改<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>大多数候选人只讲\x20①②④，<b>而面试官真正想听的是\x20③\x20和\x20⑤</b>——它们证明你有技术判断力和反思能力，不是执行工具。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>被问“你遇到最大的困难”时，答“数据太少/时间太紧”是废答案；要答<b>技术性困难\x20+\x20你的解法+\x20学到什么</b>。“'},{'c':_0x4fe920(0x33c),'s':0x1,'lv':'⭐','q':_0x4fe920(0x20a),'a':_0x4fe920(0x35e)},{'c':_0x4fe920(0x33c),'s':0x2,'lv':'⭐','q':'NL2SQL\x20项目标准讲述稿（3\x20分钟版）','a':_0x4fe920(0x1f5)},{'c':_0x4fe920(0x33c),'s':0x2,'lv':'🔥','q':_0x4fe920(0x274),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检，答不出就去补</span><br>①\x2098%/96%\x20的测试集多大、谁判、怎么判？<br>②\x20307\x20个字段怎么进prompt\x20的？（schema\x20裁剪策略）<br>③\x20字段别名库怎么建的、多少条？<br>④\x20多轮对话的指代怎么消解的？<br>⑤\x20执行反馈修正最多重试几轮、会不会越改越错？<br>⑥\x20复杂多表\x20join\x20的成功率和单表比差多少？<br>⑦\x20为什么选\x20Qwen、哪个尺寸、为什么这个尺寸？<br>⑧\x20海光\x20DCU\x20上踩了什么坑？<br>⑨\x20安全怎么做的？（只读、权限、注入防护）<br>⑩\x20如果重做，你会改哪三件事？<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>这十个问题就是你的复习清单</b>。每个都写下3-5\x20句的答案并练到能顺畅说出——项目面80%\x20的问题都在这里面。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>第\x20⑩\x20题最能拉分也最容易翻车：<b>准备三个具体的改进点</b>（自动化评测、混合检索、RL\x20优化），别答“没什么好改的”。“'},{'c':'story','s':0x3,'lv':'⭐','q':_0x4fe920(0x1fd),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>问题</b>：空分装置异常处置场景，大模型给的建议存在三个问题——<b>回答结构不稳定、缺少验证闭环、会生成不受支持的内容</b>。这三个问题在工业安全场景是不可接受的。<br><b>方法</b>：提出\x20OKC-SFT——把现场操作员的处置逻辑建模为六阶段知识链（<b>Diagnosis\x20→\x20Evidence\x20→\x20Causes\x20→\x20Actions\x20→\x20Verification\x20→\x20Risk\x20Boundary</b>），用结构化监督微调引导模型按这个链路输出。<br><b>数据</b>：基于操作规程、现场案例、工艺机理和专家经验构建\x20611\x20条监督样本，覆盖\x206\x20类任务；<b>不是凑数量，是按任务类型做覆盖设计</b>。<br><b>训练</b>：Qwen2.5-7B-Instruct\x20为基座，QLoRA\x20微调——611\x20条数据\x20+\x20有限算力下，全量微调既超显存又必过拟合。<br><b>实验</b>：三组对照（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）+\x20消融，证明提升来自<b>结构化监督</b>而非微调本身。<br><b>结果</b>：结构完整率\x2099.8%、关键点覆盖率\x200.5407→0.7378、Verification\x20与\x20Risk\x20Boundary\x20出现率\x20100%、幻觉率\x2034.4%→15.6%。<br><span\x20class=\x27lb\x27>⚓\x20金句（收尾用）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>“'},{'c':_0x4fe920(0x33c),'s':0x3,'lv':'🔥','q':_0x4fe920(0x278),'a':_0x4fe920(0x29b)},{'c':'story','s':0x4,'lv':'⭐','q':_0x4fe920(0x313),'a':'<span\x20class=\x27lb\x27>◈讲述框架（按这个填）</span><br>①\x20<b>一句话定位</b>：“我在腾讯\x20___\x20做LLM\x20驱动的游戏算法研究，具体方向是\x20___。”<br>②\x20<b>业务问题</b>：这个方向要解决游戏里的什么问题？（NPC\x20智能、剧情生成、玩家陪伴、内容生产效率……）<br>③\x20<b>你的工作</b>：你具体负责什么？技术栈？<br>④\x20<b>产出</b>：做出了什么（demo\x20/\x20模块\x20/\x20实验结论\x20/\x20数据），<b>尽量量化</b>。<br>⑤\x20<b>认知收获</b>：在大厂环境学到什么（工程规范、评测流程、协作方式）。<br><span\x20class=\x27lb\x27>➤\x20待你补充的信息（填完我就能写成完整讲述稿）</span><br>·所在\x20BG\x20/\x20团队方向<br>·\x20具体做的任务和技术栈<br>·\x20到\x208\x20月底能拿出的可量化成果<br>·\x20有没有接触内部模型/平台（可讲的范围内）<br><span\x20class=\x27lb\x27>⚠\x20保密提醒</span><br>内部数据、未公开模型细节、业务指标<b>不能讲</b>。讲述时聚焦<b>方法与你的思考过程</b>，遇到敏感处主动说“这部分涉及内部信息，我讲方法层面”——这个处理本身就是职业素养的体现。“'},{'c':'story','s':0x4,'lv':'⭐','q':_0x4fe920(0x36c),'a':_0x4fe920(0x1ab)},{'c':_0x4fe920(0x33c),'s':0x5,'lv':'⭐','q':_0x4fe920(0x35d),'a':_0x4fe920(0x174)},{'c':_0x4fe920(0x33c),'s':0x5,'lv':'🔥','q':_0x4fe920(0x21e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>这不是客套，是<b>你唯一能主动展示判断力的环节</b>，也是你收集决策信息的机会。<br><b>推荐问题（按面试官层级选）</b>：<br>·\x20技术面：“团队现在的\x20LLM\x20应用主要卡在哪个环节——效果、成本还是可靠性？”（显示你知道真实痛点在哪）<br>·\x20技术面：“团队在评测体系上是怎么做的？有没有固定的回归评估集？”（这个问题会让懂的面试官立刻对你改观）<br>·\x20leader\x20面：“这个岗位一年后，什么样算做得好？”<br>·\x20HR\x20面：新人培养机制、团队构成、业务节奏。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>别问“我表现怎么样”（把评价压力给对方）、别问薪资（留给\x20HR）、<b>别说“没有问题”</b>——那
