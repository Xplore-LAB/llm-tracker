<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

369c61(0xc6)},{'c':'ml','s':0x2,'lv':'💎','q':'实验设计：怎么让结论可信','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五条纪律：①\x20<b>控制变量</b>——一次只改一个因素\x20②\x20<b>固定随机种子</b>并跑多次报均值±方差（小数据尤其必要）③\x20<b>训练/验证/测试严格隔离</b>，测试集只在最后用一次\x20④\x20<b>基线要公平</b>——别拿调优后的自己方法和没调过的基线比⑤\x20<b>报告完整</b>——超参、数据量、评测口径都写清，否则不可复现。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么判断提升是真的？”——多种子重复看方差是否覆盖差距；样本足够时做显著性检验；“最常见的自欺欺人？”——用测试集反复调参（等于把测试集变成了验证集）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文里的三组对照实验（Base\x20/\x20QA-SFT\x20/\x20OKC-SFT）就是这套纪律的实践——把它讲成“方法论”，而不只是“我做了实验”。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':'数据并行\x20/\x20张量并行\x20/\x20流水线并行\x20/\x20ZeRO','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>数据并行（DDP）</b>：每卡一份完整模型、切数据、梯度\x20all-reduce\x20同步——最简单，通信量约等于模型大小。<b>张量并行</b>：层内切矩阵（Megatron），卡间每层都要通信，<b>只适合单机高带宽（NVLink）</b>。<b>流水线并行</b>：按层切成多段串行，有<b>气泡（bubble）</b>浪费，靠\x20micro-batch\x20缓解。<b>ZeRO</b>（DeepSpeed）：把优化器状态/梯度/参数依次分片到各卡（stage\x201/2/3），显存大幅下降，通信换显存。实践：大规模训练是<b>三种并行\x20+\x20ZeRO\x20的组合（3D\x20并行）</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“7B\x20微调该用什么？”——单卡\x20QLoRA\x20就够；多卡全量微调用\x20ZeRO-2/3\x20或\x20FSDP；“应用岗要懂到什么程度？”——<b>知道各自解决什么问题、什么时候选哪个</b>即可，再深属于Infra\x20岗范畴。““““'},{'c':'ml','s':0x3,'lv':'⭐','q':_0x369c61(0x295),'a':_0x369c61(0x21e)},{'c':'ml','s':0x3,'lv':'💎','q':_0x369c61(0xea),'a':_0x369c61(0x15b)},{'c':_0x369c61(0x112),'s':0x0,'lv':'⭐','q':_0x369c61(0x1cc),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Attention(Q,K,V)\x20=\x20softmax(QKᵀ/√d_k)·V。四步：①\x20QKᵀ\x20算出每个\x20token\x20与其他\x20token\x20的相关性打分\x20②\x20<b>除以\x20√d_k</b>——点积方差随维度线性增长，不缩放会把\x20softmax\x20推进饱和区导致梯度消失，缩放让方差归1\x20③\x20softmax\x20归一化成注意力分布\x20④乘\x20V\x20按权重加权求和。复杂度<b>O(n²·d)</b>，n\x20是序列长度——这就是长文本的根本瓶颈。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“Q/K/V\x20为什么要三个不同的投影？”——Q\x20是“我要找什么”、K\x20是“我能提供什么标识”、V\x20是“我实际的内容”，解耦匹配与取值；“mask\x20怎么加？”——把\x20-inf\x20填到屏蔽位，softmax\x20后自然变0。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只会背公式不会讲\x20√d_k\x20的作用\x20=\x20没真懂。这是第一道分水岭。““““““'},{'c':_0x369c61(0x112),'s':0x0,'lv':'⭐','q':_0x369c61(0xcb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':_0x369c61(0x112),'s':0x0,'lv':'🔥','q':_0x369c61(0xf2),'a':_0x369c61(0x9e)},{'c':_0x369c61(0x112),'s':0x0,'lv':'🔥','q':_0x369c61(0x2ad),'a':_0x369c61(0x164)},{'c':_0x369c61(0x112),'s':0x1,'lv':'⭐','q':_0x369c61(0x242),'a':_0x369c61(0x22f)},{'c':_0x369c61(0x112),'s':0x1,'lv':'🔥','q':_0x369c61(0x23f),'a':_0x369c61(0x14b)},{'c':_0x369c61(0x112),'s':0x1,'lv':'🔥','q':_0x369c61(0x1e9),'a':_0x369c61(0x25f)},{'c':_0x369c61(0x112),'s':0x2,'lv':'⭐','q':_0x369c61(0x263),'a':_0x369c61(0x246)},{'c':_0x369c61(0x112),'s':0x2,'lv':'⭐','q':'参数量与显存估算（必考口算）','a':_0x369c61(0xf1)},{'c':_0x369c61(0x112),'s':0x2,'lv':'💎','q':_0x369c61(0x2df),'a':_0x369c61(0x1e5)},{'c':_0x369c61(0x112),'s':0x3,'lv':'⭐','q':_0x369c61(0x133),'a':_0x369c61(0x25b)},{'c':'llm','s':0x3,'lv':'🔥','q':_0x369c61(0x2e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>softmax(x_i)=e^{x_i}/Σe^{x_j}，x\x20大时\x20e^x\x20上溢。稳定版：<b>先减\x20max</b>——e^{x_i-max}/Σe^{x_j-max}，数学等价、数值安全。logsumexp\x20=\x20max\x20+\x20log\x20Σe^{x_j-max}，用于算log\x20概率（交叉熵、logprobs）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么面试爱考？”——手撕\x20attention\x20的第一个考点；且推理框架里所有采样、beam\x20search、困惑度计算都建在\x20logprobs\x20上，数值稳定是工程底线。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>手写\x20attention\x20时直接\x20exp\x20不减\x20max，是最常见的“会写但不专业”破绽。““““““'},{'c':_0x369c61(0x112),'s':0x4,'lv':'🔥','q':_0x369c61(0x262),'a':_0x369c61(0x13a)},{'c':_0x369c61(0x112),'s':0x4,'lv':'🔥','q':_0x369c61(0x106),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共识：<b>数据质量决定模型上限</b>。四件事：①\x20<b>清洗</b>——规则+模型双重过滤（乱码、广告、低质），质量分类器打分\x20②\x20<b>去重</b>——文档级\x20MinHash/SimHash\x20+\x20段落级精确去重，重复数据会导致记忆化和效率浪费\x20③\x20<b>配比</b>——网页/代码/书籍/学术/多语言按比例混合，代码数据能提升推理能力（重要经验）\x20④\x20<b>去污染</b>——剔除与评测基准重合的样本，否则跑分虚高。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“数据不够了怎么办？”——多轮\x20epoch\x20收益递减、合成数据\x20+\x20质量筛选是当前主流方向；“为什么加代码提升推理？”——代码有严格的结构与因果链，是高质量的推理监督信号。““““““'},{'c':_0x369c61(0x112),'s':0x5,'lv':'🔥','q':_0x369c61(0xbc),'a':_0x369c61(0x229)},{'c':_0x369c61(0x112),'s':0x5,'lv':'🔥','q':_0x369c61(0x21c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线：Encoder-only（BERT，理解任务）、Encoder-Decoder（T5，seq2seq）、Decoder-only（GPT\x20系）。Decoder-only\x20胜出的原因：①\x20<b>统一的\x20next-token\x20目标</b>，预训练与下游对话/指令形式天然一致，无需改造\x20②\x20训练推理架构一致、工程极简\x20③\x20scaling\x20下表现不劣\x20④\x20in-context\x20learning\x20能力涌现。代价是causal\x20mask\x20只能看左侧、双向理解偏弱——被规模弥补了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“检索/分类还用\x20BERT\x20吗？”——用，embedding\x20和\x20rerank\x20模型仍以双向编码器为主（bge\x20系），因为需要双向语义且推理便宜。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>RAG\x20里\x20embedding/reranker\x20用的正是编码器模型——“生成用\x20decoder、检索用\x20encoder”这个分工你实际用过。““““““'},{'c':_0x369c61(0x112),'s':0x5,'lv':'🔥','q':_0x369c61(0x18c),'a':_0x369c61(0x11f)},{'c':_0x369c61(0x112),'s':0x5,'lv':'💎','q':_0x369c61(0x292),'a':_0x369c61(0x256)},{'c':_0x369c61(0x112),'s':0x5,'lv':'🔥','q':_0x369c61(0x257),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x369c61(0x112),'s':0x6,'lv':'⭐','q':_0x369c61(0x2b6),'a':_0x369c61(0x186)},{'c':_0x369c61(0x112),'s':0x6,'lv':'🔥','q':_0x369c61(0x2cb),'a':_0x369c61(0x2b3)},{'c':_0x369c61(0x112),'s':0x7,'lv':'⭐','q':_0x369c61(0x1cf),'a':_0x369c61(0x226)},{'c':_0x369c61(0x112),'s':0x7,'lv':'🔥','q':_0x369c61(0x247),'a':_0x369c61(0x216)},{'c':_0x369c61(0x112),'s':0x7,'lv':'🔥','q':_0x369c61(0x183),'a':_0x369c61(0x1f8)},{'c':'llm','s':0x7,'lv':'💎','q':_0x369c61(0x1ee),'a':_0x369c61(0x18b)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x369c61(0xfb),'a':_0x369c61(0x155)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x369c61(0xd7),'a':_0x369c61(0xb8)},{'c':'rl','s':0x1,'lv':'🔥','q':_0x369c61(0x227),'a':_0x369c61(0xfe)},{'c':'rl','s':0x1,'lv':'💎','q':_0x369c61(0xee),'a':_0x369c61(0x220)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>直接参数化策略\x20π_θ(a|s)\x20并对期望回报做梯度上升。<b>策略梯度定理</b>：∇J\x20=\x20E[∇log\x20π_θ(a|s)\x20·\x20G_t]——直觉是“<b>提高高回报动作的对数概率，压低低回报动作的</b>”。REINFORCE\x20用整条轨迹的回报，无偏但方差极大。<b>Actor-Critic</b>：Actor\x20出动作、Critic\x20估价值，用优势\x20A(s,a)\x20替代原始回报做权重——大幅降方差，是\x20PPO\x20的骨架。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么策略方法优于价值方法？”——天然支持连续/高维动作空间、可输出随机策略、收敛性质更好；“方差从哪来？”——回报是整条轨迹采样的结果，噪声大，所以要基线和Critic。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>能写出\x20∇log\x20π\x20·\x20A\x20这个形式并解释它的直觉，比背名词重要十倍——DPO/GRPO\x20的损失都是它的变形。““““““'},{'c':'rl','s':0x2,'lv':'⭐','q':_0x369c61(0x228),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>问题：策略梯度一步更新太大就会崩（策略跑飞后采样数据全废）。PPO\x20的解法是<b>限制单次更新幅度</b>：用重要性采样比\x20r_t\x20=\x20π_θ(a|s)/π_old(a|s)\x20复用旧数据，并对目标做\x20<b>clip</b>——当比值超出\x20[1−ε,\x201+ε]（ε\x20常取\x200.2）就截断梯度，让策略不敢一步走太远。相比\x20TRPO\x20的二阶约束，PPO\x20只用一阶\x20+\x20裁剪，实现简单、稳定、样本效率尚可，所以成为默认选择。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“重要性采样为什么必要？”——让\x20on-policy\x20算法能在同一批数据上做多次更新，提升样本效率；“PPO\x20在\x20LLM\x20上的痛点？”——要同时载入\x20actor\x20/\x20critic\x20/\x20reward\x20model\x20/\x20reference\x20四个模型，显存与工程复杂度极高，训练不稳定，这直接催生了\x20DPO\x20和\x20GRPO。““““““'},{'c':'rl','s':0x2,'lv':'🔥','q':_0x369c61(0x2ae),'a':_0x369c61(0xf0)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x369c61(0x2ed),'a':_0x369c61(0x27b)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x369c61(0x222),'a':_0x369c61(0x1b4)},{'c':'rl','s':0x3,'lv':'⭐','q':'GRPO：DeepSeek\x20为什么能扔掉\x20Critic','a':_0x369c61(0x16d)},{'c':'rl','s':0x3,'lv':'🔥','q':_0x369c61(0x2c9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一条主线：<b>不断削减对辅助模型和在线采样的依赖</b>。PPO：完整\x20RL，要\x20actor+critic+RM+reference\x20四模型，效果强但工程重。DPO：把奖励解析掉，<b>去掉\x20RM\x20和\x20RL\x20循环</b>，变离线监督学习——便宜稳定，但没探索。GRPO：保留在线\x20RL\x20的探索能力，但<b>去掉\x20critic</b>，用组内相对优势\x20+\x20可验证奖励——在推理任务上取得突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“实际项目怎么选？”——数据是成对偏好、要快出结果\x20→\x20DPO；任务有自动可验证的正确性（代码/数学/SQL）→\x20GRPO\x20类方法；有充足算力和标注团队要做通用对齐\x20→\x20PPO。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（高价值）</span><br>把NL2SQL\x20接进来：<b>“SQL\x20的执行结果是天然的可验证奖励信号——这个任务其实非常适合\x20GRPO\x20类方法，是我这个项目下一步最有价值的延伸方向。”</b>这句话把项目、RL\x20知识、技术前瞻三者串起来，是能让面试官眼睛一亮的答案。““““““'},{'c':'rl','s':0x3,'lv':'💎','q':_0x369c61(0x1f4),'a':_0x369c61(0x175)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x369c61(0x12e),'a':_0x369c61(0x26b)},{'c':'rl','s':0x4,'lv':'🔥','q':'游戏\x20AI\x20中的\x20RL：从环境到落地的关键问题','a':_0x369c61(0x255)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x369c61(0x297),'a':_0x369c61(0x27d)},{'c':'pt','s':0x0,'lv':'⭐','q':'SFT\x20数据：质量\x20vs\x20数量怎么权衡','a':_0x369c61(0xba)},{'c':'pt','s':0x0,'lv':'🔥','q':_0x369c61(0x102),'a':_0x369c61(0x19d)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型配置：<b>lr</b>\x20全量微调\x201e-5~2e-5，LoRA\x20可到\x201e-4~2e-4（LoRA\x20参数少需要更大\x20lr）；<b>epoch</b>\x202~3（多了就过拟合）；warmup\x203%，cosine\x20衰减到峰值\x2010%。两个易忽略的关键点：①\x20<b>loss\x20mask</b>——只对回答部分算\x20loss，不对\x20prompt\x20算（否则模型学着去生成问题）②\x20<b>packing</b>——把多条短样本拼成一条满长度序列提升训练效率，但要用\x20attention\x20mask\x20隔断不同样本，否则串味。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“忘了\x20loss\x20mask\x20会怎样？”——模型倾向复述/生成问题，指令遵循变差，是新手最常见事故；“chat\x20template\x20出错的症状？”——loss\x20曲线异常、推理时不停生成或答非所问，<b>排查第一步永远是检查\x20template</b>。“““““'},{'c':'pt','s':0x0,'lv':'🔥','q':_0x369c61(0x14c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>正常形态：快速下降后趋平（典型从\x202+\x20降到\x200.5~1.0\x20区间），带轻微波动。异常诊断：<br>·<b>loss\x20不降或震荡</b>\x20→\x20lr\x20过大\x20/\x20数据格式错（先查\x20chat\x20template\x20和\x20loss\x20mask）<br>·\x20<b>骤降到近\x200</b>\x20→\x20过拟合、数据泄漏、或答案泄露进了输入<br>·\x20<b>train降\x20eval\x20升</b>\x20→\x20过拟合，早停或减\x20epoch<br>·\x20<b>突然\x20spike</b>\x20→\x20坏样本或梯度爆炸，检查数据+\x20开梯度裁剪<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“loss\x20低就说明效果好吗？”——不，loss\x20只反映\x20token\x20级拟合，<b>业务指标才是标准</b>；能说出这句话说明你真跑过实验。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能讲出你\x20QLoRA\x20微调时\x20loss\x20从多少降到多少、怎么定\x20epoch、遇到什么异常——<b>有真实曲线记忆的候选人极少，这是天然的可信度证明</b>。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':_0x369c61(0x2d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>假设：微调时权重的<b>更新量ΔW\x20是低秩的</b>——ΔW\x20=\x20B·A，其中\x20B∈R^{d×r}、A∈R^{r×d}，r≪d。于是可训练参数从\x20d²\x20降到\x202dr（d=4096、r=16\x20时约减少\x20250\x20倍），原权重完全冻结。推理时\x20ΔW\x20可<b>合并回原矩阵，零额外延迟</b>。为什么假设成立：预训练模型已具备通用能力，下游适配只需在一个低维子空间里调整方向。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“作用在哪些层？”——最初只在\x20attention\x20的\x20q/v，现在实践上加到全部线性层（含\x20FFN）效果更好；“为什么\x20A\x20用高斯初始化、B\x20用零？”——保证训练开始时\x20ΔW=0，模型从原始状态平滑出发。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“LoRA\x20省显存是因为参数少”只说对一半——<b>更主要是省掉了优化器状态和梯度</b>（那才是显存大头）。“““““'},{'c':'pt','s':0x1,'lv':'⭐','q':'QLoRA：在\x20LoRA\x20之上又省了什么？','a':_0x369c61(0x25e)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x369c61(0x1e7),'a':_0x369c61(0x19e)},{'c':'pt','s':0x1,'lv':'🔥','q':_0x369c61(0x129),'a':_0x369c61(0xe8)},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':_0x369c61(0x12a)},{'c':'pt','s':0x1,'lv':'💎','q':_0x369c61(0x163),'a':_0x369c61(0x1b9)},{'c':'pt','s':0x2,'lv':'⭐','q':'RLHF\x20/\x20DPO\x20/\x20GRPO\x20在Post-training\x20里的定位','a':_0x369c61(0x201)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x369c61(0x24d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>来源：人工排序（最贵最准）、用户行为信号（点赞/重新生成/复制，便宜但噪声大）、AI\x20反馈（RLAIF，用强模型代替人标）。<b>核心难点是标注一致性</b>——不同标注员对“好”的理解不同。对策：把“有用/真实/无害”拆解成可判定的具体条款写进标注规范；多人标注算一致性（Cohen\x27s\x20Kappa）；争议样本走仲裁。格式上\x20<b>pairwise（A\x20比\x20B\x20好）比绝对打分更稳定</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么防reward\x20hacking？”——监控输出长度与\x20KL；奖励里加长度惩罚；定期用新数据重训\x20RM；“RLAIF\x20靠谱吗？”——在有明确规则的维度（格式、安全）可用，主观质量维度仍需人工校准。“““““'},{'c':'pt','s':0x2,'lv':'💎','q':_0x369c61(0x2b5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x369c61(0x1e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>LLaMA-Factory</b>：配置驱动、支持模型与方法最全（SFT/DPO/PPO/量化）、上手最快，国内使用最广。<b>ms-swift</b>（魔搭）：与\x20Qwen\x20生态贴合好，中文模型支持完善。<b>TRL</b>（HuggingFace）：贴近底层、灵活可改，适合要自定义\x20loss\x20或训练循环。<b>DeepSpeed/FSDP</b>\x20是底层分布式与显存优化，被上面的框架封装调用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你用的哪个、为什么？”——按你的实际情况答，重点讲<b>为什么选它</b>（模型支持、QLoRA\x20支持、国产算力适配）以及踩过什么坑；“框架的局限？”——高度封装导致定制难、版本更新快容易踩兼容问题。“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x369c61(0x195),'a':_0x369c61(0x254)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x369c61(0x285),'a':_0x369c61(0x146)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x369c61(0x2f9),'a':_0x369c61(0x11d)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x369c61(0xa6),'a':_0x369c61(0x2c2)},{'c':'pt','s':0x3,'lv':'💎','q':_0x369c61(0x2da),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>必须先定义“什么算幻觉”——这是最容易被追问崩的地方。可操作的定义：<b>输出中包含无法由给定资料/领域知识支持的事实性断言</b>。测量方法：①\x20人工标注（金标准，要有标注规范和多人一致性）②\x20LLM-as-a-Judge\x20逐条判定（要人工校准）③\x20自动化：NLI\x20模型判断输出与参考是否\x20entailment。报数必须带三要素：<b>分母（多少条）、判定者（人/模型）、抽样方式</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“34.4%\x20→\x2015.6%\x20是怎么算的？”——这题一定会被问，你必须能一口答出：<b>测试集多少条、谁判、按什么规则判、是否盲评</b>。答不上来这个数字就废了。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>报一个漂亮数字但说不清口径，比不报更糟——面试官会怀疑整份简历的真实性。<b>这是你论文数据的防御工事，务必先想清楚。</b>“““““'},{'c':'pt','s':0x3,'lv':'🔥','q':_0x369c61(0xec),'a':_0x369c61(0xaf)},{'c':'app','s':0x0,'lv':'⭐','q':'RAG\x20全链路：从文档到回答的每一步','a':_0x369c61(0x2db)},{'c':_0x369c61(0xfd),'s':0x0,'lv':'⭐','q':_0x369c61(0x126),'a':_0x369c61(0x113)},{'c':_0x369c61(0xfd),'s':0x1,'lv':'⭐','q':_0x369c61(0x206),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>embedding\x20模型把文本编码为稠密向量，语义近则向量近。度量首选<b>余弦相似度</b>（免疫文本长度）。规模大了用\x20ANN\x20索引：HNSW\x20召回高但费内存，IVF-PQ\x20省内存但召回略损。选型：已有\x20PostgreSQL\x20就用\x20PGVector（架构减法），独立检索服务再考虑\x20Milvus/Qdrant。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“embedding\x20模型怎么选？”——中文场景看\x20bge/m3e\x20系，参考\x20C-MTEB\x20榜单\x20+\x20自己的评估集实测；“维度越高越好？”——不一定，存储和计算成本线性涨，收益递减。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>项目里\x20307\x20个字段的别名匹配就是语义检索场景——字段说明向量化，query\x20来时检索最相关字段注入\x20prompt。““““““'},{'c':_0x369c61(0xfd),'s':0x1,'lv':'🔥','q':_0x369c61(0x182),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>向量检索擅长语义泛化，但会漏精确匹配（型号、编号、字段名、专有名词）；BM25\x20擅长词面精确匹配，但没有语义理解。工业标配：<b>两路各取\x20top-k，RRF（倒数排名融合）合并，再\x20rerank</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>RRF\x20公式：score\x20=\x20Σ\x201/(k+rank)，k\x20常取\x2060，不需要调权重是它的优点；“两路权重怎么定？”——别手拍，在评估集上跑网格搜索。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>“工业场景字段名是强词面信号，纯向量检索会丢，所以我上了混合检索”——真实痛点驱动的选型最有说服力。““““““'},{'c':_0x369c61(0xfd),'s':0x1,'lv':'⭐','q':_0x369c61(0x274),'a':_0x369c61(0x170)},{'c':_0x369c61(0xfd),'s':0x2,'lv':'🔥','q':_0x369c61(0xc3),'a':_0x369c61(0x260)},{'c':_0x369c61(0xfd),'s':0x2,'lv':'⭐','q':_0x369c61(0x132),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x369c61(0xfd),'s':0x3,'lv':'🔥','q':_0x369c61(0x11a),'a':_0x369c61(0x29d)},{'c':_0x369c61(0xfd),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Agentic\x20RAG</b>：把检索变成\x20agent\x20的工具，模型自主决定“要不要查、查什么、查几次、结果够不够”——从固定\x20pipeline\x20变自主循环，适合多跳复杂问题。<b>GraphRAG</b>：抽实体关系建知识图谱\x20+\x20社区摘要，回答“这批文档整体讲了什么”这类全局性问题——传统向量\x20RAG\x20答不了。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——Agentic\x20路线调用次数和延迟倍增；GraphRAG\x20建图贵、更新难。“什么时候用？”——80%\x20的场景基础\x20RAG\x20+\x20rerank\x20就够了，先证明简单方案不够再升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别硬推高级方案——先讲清它解决什么问题、代价是什么，这才是工程成熟度。““““““'},{'c':_0x369c61(0xfd),'s':0x4,'lv':'⭐','q':_0x369c61(0x105),'a':_0x369c61(0x165)},{'c':_0x369c61(0xfd),'s':0x4,'lv':'⭐','q':_0x369c61(0x12f),'a':_0x369c61(0x1be)},{'c':_0x369c61(0xfd),'s':0x4,'lv':'🔥','q':_0x369c61(0x1fe),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':_0x369c61(0xfd),'s':0x4,'lv':'🔥','q':_0x369c61(0x1fd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':_0x369c61(0xfd),'s':0x5,'lv':'🔥','q':_0x369c61(0x244),'a':_0x369c61(0x147)},{'c':'app','s':0x5,'lv':'💎','q':_0x369c61(0x2f8),'a':_0x369c61(0xa1)},{'c':_0x369c61(0xfd),'s':0x6,'lv':'⭐','q':'结构化输出怎么保证？（JSON\x20总是不合法怎么办）','a':_0x369c61(0xd2)},{'c':_0x369c61(0xfd),'s':0x6,'lv':'⭐','q':_0x369c61(0xeb),'a':_0x369c61(0x2ec)},{'c':_0x369c61(0xfd),'s':0x6,'lv':'🔥','q':_0x369c61(0x2b2),'a':_0x369c61(0x120)},{'c':_0x369c61(0xfd),'s':0x6,'lv':'💎','q':_0x369c61(0xe3),'a':_0x369c61(0x2cf)},{'c':_0x369c61(0xfd),'s':0x7,'lv':'⭐','q':_0x369c61(0x2c6),'a':_0x369c61(0xd3)},{'c':_0x369c61(0xfd),'s':0x7,'lv':'🔥','q':'Schema\x20Linking\x20专深：307\x20个字段怎么办？','a':_0x369c61(0xe9)},{'c':_0x369c61(0xfd),'s':0x7,'lv':'⭐','q':_0x369c61(0x180),'a':_0x369c61(0x1bd)},{'c':'app','s':0x7,'lv':'🔥','q':_0x369c61(0x202),'a':_0x369c61(0x123)},{'c':_0x369c61(0xfd),'s':0x7,'lv':'🔥','q':_0x369c61(0x29c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多轮</b>：指代消解（“那上月呢”→\x20补全成完整查询意图）+\x20会话状态显式维护（已选表、时间范围）+\x20历史摘要管理。<b>权限</b>：生成前按用户权限过滤可见\x20schema（行列级）＋\x20只读账号\x20＋\x20LIMIT\x20强制\x20＋\x20危险关键字拦截（DROP/DELETE/UPDATE）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“schema\x20过滤和生成后拦截哪个好？”——都要：生成前过滤减少出错面，生成后拦截兜底，这叫<b>纵深防御</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>和「Prompt\x20Injection」那条连成完整的安全故事：输入防护\x20+\x20权限最小化\x20+\x20输出拦截，三层都真实做过。““““““'},{'c':_0x369c61(0x17f),'s':0x0,'lv':'⭐','q':'Python\x20GIL：是什么、影响什么、怎么绕','a':_0x369c61(0x240)},{'c':_0x369c61(0x17f),'s':0x0,'lv':'⭐','q':_0x369c61(0x261),'a':_0x369c61(0x299)},{'c':_0x369c61(0x17f),'s':0x0,'lv':'🔥','q':_0x369c61(0x2e6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>装饰器</b>本质是“函数包装函数”，@dec\x20等价于\x20f\x20=\x20dec(f)。带参数的装饰器是三层结构（参数层\x20→\x20装饰器层\x20→\x20wrapper\x20层），务必加\x20<b>functools.wraps</b>\x20保留原函数元信息。其他高频：<b>生成器</b>（yield，惰性求值省内存，处理大文件/流式响应必用）、<b>上下文管理器</b>（with\x20/\x20__enter__\x20__exit__，资源确保释放）、<b>深浅拷贝</b>（浅拷贝只复制容器、嵌套对象仍共享）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“默认参数用可变对象的坑？”——def\x20f(x=[])\x20所有调用共享同一个\x20list，经典\x20bug；“生成器和列表的区别？”——生成器不一次性占内存，适合流式；<b>LLM\x20流式输出（SSE）本质就是生成器</b>。“““'},{'c':_0x369c61(0x17f),'s':0x1,'lv':'⭐','q':_0x369c61(0x110),'a':_0x369c61(0xca)},{'c':_0x369c61(0x17f),'s':0x1,'lv':'🔥','q':_0x369c61(0x2e3),'a':_0x369c61(0x29e)},{'c':_0x369c61(0x17f),'s':0x1,'lv':'🔥','q':_0x369c61(0x148),'a':_0x369c61(0x293)},{'c':'eng','s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':_0x369c61(0x2b8)},{'c':_0x369c61(0x17f),'s':0x2,'lv':'🔥','q':_0x369c61(0x207),'a':_0x369c61(0x1ff)},{'c':_0x369c61(0x17f),'s':0x3,'lv':'🔥','q':_0x369c61(0x2bb),'a':_0x369c61(0x1c8)},{'c':_0x369c61(0x17f),'s':0x3,'lv':'🔥','q':_0x369c61(0x1df),'a':_0x369c61(0x10c)},{'c':'eng','s':0x3,'lv':'🔥','q':_0x369c61(0x1dd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>merge</b>：保留完整历史、产生合并节点——安全，公共分支用它。<b>rebase</b>：把本地提交搬到目标分支最新点之后，历史线性干净——<b>只对自己未推送的分支用</b>，对已推送的公共分支\x20rebase\x20会破坏他人历史（事故）。救命操作：<b>git\x20reflog</b>\x20能找回几乎任何丢失的提交；reset\x20--soft（保留暂存）/\x20--mixed（保留工作区）/\x20--hard（全丢，危险）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冲突怎么处理？”——手工解决冲突标记\x20→\x20git\x20add\x20→\x20rebase\x20--continue\x20或提交；“commit\x20写错了？”——未推送用\x20--amend，已推送就新提交修正（别强推公共分支）。“““'},{'c':_0x369c61(0x17f),'s':0x4,'lv':'⭐','q':'系统设计题：设计一个企业级\x20RAG\x20问答服务','a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按这个框架答）</span><br>①\x20<b>澄清需求</b>——用户量/QPS、文档规模与更新频率、延迟要求、是否要溯源、私有化还是云\x20②\x20<b>整体架构</b>——网关（鉴权/限流）→\x20应用服务（FastAPI\x20异步）→\x20检索层（向量库\x20+\x20BM25\x20+\x20reranker）→\x20模型层（vLLM\x20部署）→\x20存储（文档库/向量库/会话库/日志）\x20③\x20<b>离线链路</b>——文档接入、解析、切分、向量化、增量更新与版本管理\x20④\x20<b>关键设计点</b>——缓存（相似\x20query\x20命中）、流式输出（SSE）、降级（检索失败/模型超时的兜底）、权限（文档级\x20ACL\x20必须在检索时过滤而不是生成后过滤）⑤\x20<b>可观测与评估</b>——trace、评估集回归、线上信号。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么扩容？”——应用层无状态可水平扩；模型层按GPU\x20池化+\x20请求排队；向量库分片；“成本怎么控？”——模型路由（简单问题小模型）、缓存、prompt\x20瘦身。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br><b>先澄清需求再画架构</b>——直接开始画图是系统设计题最大的扣分点。“““'},{'c':_0x369c61(0x17f),'s':0x4,'lv':'🔥','q':'系统设计题：容量与成本估算怎么算','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三步：①\x20<b>算\x20token\x20量</b>——日活×\x20人均会话数\x20×\x20每会话平均输入/输出\x20token\x20②\x20<b>算算力</b>——推理吞吐按“单卡每秒可产出\x20tokens”估（受模型大小、batch、量化影响），除出需要多少卡；注意\x20<b>prefill\x20和\x20decode\x20分开算</b>（长输入吃\x20prefill\x20算力，长输出吃\x20decode\x20时间）③\x20<b>算显存</b>——权重（1B≈2GB）+\x20KV\x20Cache（每token\x20每层\x202×d×精度，乘以并发数和上下文长度）+\x20余量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“并发上不去为什么？”——多半是\x20KV\x20Cache\x20占满导致可并发序列数受限，用\x20GQA\x20模型\x20/\x20KV\x20量化\x20/\x20限制上下文长度解决；“怎么保P99\x20延迟？”——限制单请求最大生成长度\x20+\x20请求队列\x20+\x20优先级调度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能把这套算术和第二/三章的显存账本串起来讲，是应用岗里少见的<b>系统性思维</b>。“““'},{'c':_0x369c61(0x17f),'s':0x4,'lv':'🔥','q':_0x369c61(0x27f),'a':_0x369c61(0x2a8)},{'c':_0x369c61(0x17f),'s':0x4,'lv':'💎','q':'系统设计题：多轮对话服务的状态怎么管','a':_0x369c61(0x2a1)},{'c':'eng','s':0x4,'lv':'💎','q':_0x369c61(0x2ee),'a':_0x369c61(0x1d0)},{'c':_0x369c61(0x140),'s':0x0,'lv':'⭐','q':_0x369c61(0x28e),'a':'<span\x20class=\x27lb\x27>◈\x20结构：身份\x20→\x20核心能力\x20→\x20一个亮点\x20→\x20求职意向</span><br>“面试官好，我是胡章权，浙江大学控制工程专业27\x20届硕士。我的主线是<b>大模型应用与\x20Agent\x20开发</b>：独立完成过一个工业场景的\x20NL2SQL\x20智能查询系统，从\x20Qwen\x20私有化部署、Agent\x20查询链路到前端交付全链路自己做，在\x2010\x20张表、307\x20个字段、约\x2090\x20万行真实运营数据上做到\x20SQL\x20可执行率\x2098%；同时以第一作者完成一篇结构化微调的论文，把模型输出的幻觉率从\x2034%\x20降到\x2015%。目前在腾讯做\x20LLM\x20驱动的游戏算法研究。我希望投递大模型应用研发\x20/\x20Agent\x20工程师方向。”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>数字必须带、方向必须清、只留一个钩子让对方问</b>。60\x20秒的目标不是讲完，是<b>让面试官想追问</b>。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别背学生工作和奖学金——技术岗开场讲这些等于浪费黄金\x2060\x20秒。“'},{'c':_0x369c61(0x140),'s':0x0,'lv':'⭐','q':_0x369c61(0x13b),'a':_0x369c61(0x2f4)},{'c':_0x369c61(0x140),'s':0x1,'lv':'⭐','q':_0x369c61(0xb3),'a':_0x369c61(0x174)},{'c':_0x369c61(0x140),'s':0x1,'lv':'⭐','q':_0x369c61(0x24b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好答案的三个特征：①难点是<b>技术判断</b>而非体力活②\x20有<b>具体的失败经历</b>（试过什么不行）③\x20有<b>可迁移的认知沉淀</b>。<br>模板：“最难的不是让它跑通，而是<b>让它稳定</b>。跑通只要prompt\x20调对就行，但真实用户的问法千奇百怪。我最开始\x20SQL\x20生成正确率只有\x20X左右，问题集中在字段映射错和口径理解错。我做了三件事：schema\x20裁剪、口径库\x20RAG\x20注入、执行反馈修正循环。<b>这件事让我明白\x20LLM\x20应用的核心工作量不在调用模型，而在给它建好约束与验证机制。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>最后那句<b>认知沉淀</b>是加分核心——它说明你能从具体项目里抽象出方法论。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>如果初期的具体数字你不记得，别编——说“早期版本明显不稳定，主要错在字段映射”比编一个假数字安全得多。“'},{'c':_0x369c61(0x140),'s':0x2,'lv':'⭐','q':_0x369c61(0x1e2),'a':'<span\x20class=\x27lb\x27>◈\x20讲述稿</span><br><b>背景</b>：工业气体运营场景，业务人员要查数据但不会写\x20SQL，数据库\x2010\x20张表、307\x20个字段、约\x2090\x20万行；痛点是\x20schema\x20复杂、字段别名多、业务口径不统一。<br><b>方案</b>：在海光DCU\x20上私有化部署\x20Qwen（数据不出域是硬约束），FastAPI\x20封装推理服务，对接\x20PostgreSQL。查询链路设计成多阶段\x20pipeline：<b>意图识别\x20→\x20任务分解\x20→\x20Schema\x20Linking\x20→\x20SQL\x20生成\x20→\x20执行反馈修正</b>。把数据库查询、字段解释、结果校验封装成工具供调用。<br><b>关键技术判断</b>：①\x20Schema\x20Linking\x20当<b>检索问题</b>做（裁剪\x20+\x20别名库\x20RAG），不是当生成问题做②\x20用<b>固定\x20pipeline\x20而非自由\x20ReAct</b>——流程确定性高的任务，可靠性优先③\x20引入查询要素完备性校验，生成前先确认信息够不够。<br><b>结果</b>：SQL\x20可执行率\x2098%、人工校验正确率\x2096%，支持多轮问答、表格与趋势图可视化。<br><b>复盘</b>：评估集规模偏小、没做自动化正确率评测（金标准\x20SQL\x20比对）；下一步最有价值的方向是<b>把\x20SQL\x20执行结果当可验证奖励做\x20RL\x20优化</b>。<br><span\x20class=\x27lb\x27>⚠\x20必须准备</span><br>“98%\x20和\x2096%怎么测的”——这题必被问，见第六章\x206.8.3。“'},{'c':_0x369c61(0x140),'s':0x2,'lv':'🔥','q'
