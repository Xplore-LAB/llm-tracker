<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

前缀和还原（区间更新\x20O(1)）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么哈希里要先放\x20{0:1}？”——处理“从下标\x200\x20开始的子数组”这种边界；“二维版？”——二维前缀和（304），矩阵区域和用容斥。““'},{'c':_0x4f56ae(0x2ef),'s':0x3,'lv':'🔥','q':'区间问题：合并、插入、调度','a':_0x4f56ae(0x342)},{'c':'code','s':0x4,'lv':'⭐','q':_0x4f56ae(0x24b),'a':_0x4f56ae(0x1f4)},{'c':_0x4f56ae(0x2ef),'s':0x4,'lv':'🔥','q':_0x4f56ae(0x313),'a':_0x4f56ae(0x395)},{'c':'code','s':0x5,'lv':'🔥','q':_0x4f56ae(0x2d5),'a':_0x4f56ae(0x294)},{'c':_0x4f56ae(0x2ef),'s':0x5,'lv':'💎','q':_0x4f56ae(0x1b7),'a':_0x4f56ae(0x2ba)},{'c':'ml','s':0x0,'lv':'⭐','q':'反向传播的本质是什么？','a':_0x4f56ae(0x322)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x4f56ae(0x1a5),'a':_0x4f56ae(0x253)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x4f56ae(0x218),'a':_0x4f56ae(0x394)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x4f56ae(0x3d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>Warmup</b>：训练初期参数远离最优、梯度噪声大（Adam\x20的二阶统计量还没攒够、估计不准），直接用大\x20lr\x20会震荡或发散；先用几百到几千步<b>线性升到峰值</b>。<b>Cosine\x20decay</b>：后期平滑降到接近零，让模型沉淀进更平坦的极小值，泛化更好。大模型\x20SFT\x20典型配置：warmup\x20ratio\x203%、cosine\x20衰减到峰值的\x2010%。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“不warmup\x20会怎样？”——常见现象是前几十步\x20loss\x20飙升甚至\x20NaN；“为什么不降到\x200？”——留一点残余\x20lr\x20避免完全停止学习，也便于后续继续训练。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x4f56ae(0x2f5),'a':_0x4f56ae(0x2be)},{'c':'ml','s':0x0,'lv':'🔥','q':'梯度累积与梯度裁剪','a':_0x4f56ae(0x25a)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x4f56ae(0x1da),'a':_0x4f56ae(0x1a3)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x4f56ae(0x1a8),'a':_0x4f56ae(0x262)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x4f56ae(0x3ef),'a':_0x4f56ae(0x2c6)},{'c':'ml','s':0x2,'lv':'⭐','q':'交叉熵损失：为什么和\x20softmax\x20是一对','a':_0x4f56ae(0x406)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x4f56ae(0x2e2),'a':_0x4f56ae(0x243)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4f56ae(0x3c5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>P</b>=TP/(TP+FP)：预测为正的有多准——<b>误报代价高</b>时看它。<b>R</b>=TP/(TP+FN)：真实正例找回多少——<b>漏报代价高</b>时看它（如安全告警、疾病筛查）。<b>F1</b>：P与\x20R\x20的调和平均，偏袒较小值，防止单边刷分。<b>AUC</b>：ROC\x20曲线下面积，衡量<b>排序能力</b>、与阈值无关、对类别不平衡不敏感。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“类别极度不平衡看什么？”——PR-AUC\x20比\x20ROC-AUC\x20更敏感；“阈值怎么定？”——不按0.5，按业务代价（漏报\x20vs\x20误报的相对损失）在\x20PR\x20曲线上选。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目的“可执行率”是\x20P\x20的思路，“人工校验正确率”另设口径——<b>能主动区分两者，就是这条知识的实战证明</b>。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4f56ae(0x2bf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x4f56ae(0x20e),'a':_0x4f56ae(0x39b)},{'c':'ml','s':0x2,'lv':'💎','q':_0x4f56ae(0x26f),'a':_0x4f56ae(0x24c)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x4f56ae(0x25b),'a':_0x4f56ae(0x230)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x4f56ae(0x1d9),'a':_0x4f56ae(0x29d)},{'c':'ml','s':0x3,'lv':'💎','q':_0x4f56ae(0x1d8),'a':_0x4f56ae(0x226)},{'c':_0x4f56ae(0x37f),'s':0x0,'lv':'⭐','q':_0x4f56ae(0x384),'a':_0x4f56ae(0x34f)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x4f56ae(0x3f5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>单头只能学一种“关注模式”。多头把\x20d\x20维切成\x20h\x20份（如\x204096\x20→\x2032\x20头\x20×\x20128\x20维），每头在<b>独立子空间</b>里学不同的依赖关系（语法、指代、位置、语义），最后拼接过\x20Wo\x20融合。关键点：<b>总计算量与单头相当</b>（维度被切分了）——不是变贵，是变丰富。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“头数越多越好？”——不是，头太多每头维度过小、表达能力不足，经验上\x20head_dim\x20保持\x2064~128；“有冗余头吗？”——有，剪枝研究表明部分头可去除而性能几乎不掉。““““““'},{'c':'llm','s':0x0,'lv':'🔥','q':_0x4f56ae(0x28c),'a':_0x4f56ae(0x3e1)},{'c':_0x4f56ae(0x37f),'s':0x0,'lv':'🔥','q':'FlashAttention：它到底优化了什么？','a':_0x4f56ae(0x2b1)},{'c':_0x4f56ae(0x37f),'s':0x1,'lv':'⭐','q':_0x4f56ae(0x32a),'a':_0x4f56ae(0x2fa)},{'c':_0x4f56ae(0x37f),'s':0x1,'lv':'🔥','q':_0x4f56ae(0x27a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x4f56ae(0x37f),'s':0x1,'lv':'🔥','q':'Lost\x20in\x20the\x20Middle：长上下文的注意力偏置','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>实验现象：模型对长上下文<b>开头和结尾</b>的信息利用最好，中间的容易被忽略，形成\x20U\x20形曲线。工程对策：①\x20关键信息放两端\x20②\x20RAG\x20时把rerank\x20后最相关的\x20chunk\x20放首尾\x20③\x20控制上下文长度，别以为塞得多就答得好——噪声会稀释注意力\x20④\x20长文档先摘要再定位。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“成因？”——因果注意力的位置偏置+\x20训练数据里重要信息常在首尾的分布先验；“怎么验证？”——自己造\x20needle\x20测试，把答案埋在不同深度看召回。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这是\x20RAG\x20里的真实踩坑点，讲出来直接证明你调过效果、不是只跑通demo。““““““'},{'c':_0x4f56ae(0x37f),'s':0x2,'lv':'⭐','q':'KV\x20Cache：原理、显存账本、优化手段','a':_0x4f56ae(0x229)},{'c':'llm','s':0x2,'lv':'⭐','q':_0x4f56ae(0x23b),'a':_0x4f56ae(0x1a2)},{'c':_0x4f56ae(0x37f),'s':0x2,'lv':'💎','q':_0x4f56ae(0x209),'a':_0x4f56ae(0x3d2)},{'c':_0x4f56ae(0x37f),'s':0x3,'lv':'⭐','q':_0x4f56ae(0x1e1),'a':_0x4f56ae(0x2d2)},{'c':_0x4f56ae(0x37f),'s':0x3,'lv':'🔥','q':_0x4f56ae(0x3c2),'a':_0x4f56ae(0x375)},{'c':_0x4f56ae(0x37f),'s':0x4,'lv':'🔥','q':_0x4f56ae(0x1ab),'a':_0x4f56ae(0x1ec)},{'c':_0x4f56ae(0x37f),'s':0x4,'lv':'🔥','q':_0x4f56ae(0x1ac),'a':_0x4f56ae(0x3ee)},{'c':_0x4f56ae(0x37f),'s':0x5,'lv':'🔥','q':'Scaling\x20Law：它告诉了我们什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>结论：loss\x20与参数量N、数据量\x20D、算力\x20C呈<b>幂律关系</b>，可预测——这才是敢投巨资训大模型的依据。<b>Chinchilla\x20的修正</b>：早期模型普遍“过大而欠训”，给定算力下\x20N\x20和\x20D\x20应<b>同比例增长</b>（经验值约\x2020\x20tokens/参数）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么现在的小模型比几年前的大模型强？”——按Chinchilla\x20之后的认知，用远超“最优比例”的数据量训小模型，虽然训练不最优但<b>推理成本低</b>，工业上更划算（Llama-3\x208B\x20用了15T\x20tokens）；“Scaling\x20会撞墙吗？”——高质量数据是当前主要约束，业界转向后训练与推理时计算（test-time\x20compute）找增量。““““““'},{'c':'llm','s':0x5,'lv':'🔥','q':_0x4f56ae(0x367),'a':_0x4f56ae(0x208)},{'c':_0x4f56ae(0x37f),'s':0x5,'lv':'🔥','q':_0x4f56ae(0x392),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>共同底盘：Decoder-only\x20+\x20RoPE\x20+\x20RMSNorm\x20+\x20SwiGLU\x20+\x20GQA（现代标配）。差异：<b>Llama</b>系是开源基线范式的确立者；<b>Qwen</b>\x20中文与多语言强、词表对中文更友好、尺寸谱系全（0.5B→72B）、国内私有化部署首选；<b>DeepSeek</b>\x20主打\x20MoE\x20+<b>MLA</b>（低秩压缩\x20KV，推理更省）+强化学习驱动的推理能力（R1）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你为什么选\x20Qwen？”——中文场景效果好、生态与微调工具链成熟、尺寸可选、许可宽松、DCU\x20等国产算力适配情况较好；“怎么选尺寸？”——按显存和延迟预算倒推，先用\x207B\x20验证链路，效果不够再上。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你项目和论文都用\x20Qwen\x20系，这条必须能答得干脆——“为什么选它”是私有化部署项目的必问题。““““““'},{'c':_0x4f56ae(0x37f),'s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':_0x4f56ae(0x355)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x4f56ae(0x30f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x20——\x20<b>架构与\x20V3\x20完全一致</b>，差别只在训练方法。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20671B\x20的\x20DeepSeek\x20的\x20KV\x20Cache\x20比\x208B\x20的\x20Llama\x20还小？”——MLA\x20把\x20K/V\x20投影到\x20512\x20维潜空间再缓存，而\x20GQA\x20只是减少\x20KV\x20头数；<b>压缩率差一个量级</b>。“R1\x20和\x20V3\x20架构差别？”——<b>没有差别</b>，推理能力全部来自\x20GRPO\x20训练。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>顶栏「🏗️\x20架构演进」页面有这五个模型的<b>可交互结构图、并排差异对比、显存计算器</b>，所有数字取自官方\x20config.json\x20并已独立验算。想练口算显存就去那里拖滑块。'},{'c':_0x4f56ae(0x37f),'s':0x6,'lv':'⭐','q':_0x4f56ae(0x1ae),'a':_0x4f56ae(0x2e5)},{'c':_0x4f56ae(0x37f),'s':0x6,'lv':'🔥','q':_0x4f56ae(0x30c),'a':_0x4f56ae(0x237)},{'c':_0x4f56ae(0x37f),'s':0x7,'lv':'⭐','q':_0x4f56ae(0x2cd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因四层：①\x20训练数据本身有错/有噪\x20②\x20next-token\x20目标只奖励“像人话”，不奖励“是真的”\x20③\x20模型不知道自己不知道（知识边界缺失）\x20④\x20采样随机性引入漂移。缓解按链路排：数据清洗\x20→\x20SFT\x20加入<b>拒答与边界样本</b>\x20→\x20偏好对齐惩罚编造\x20→\x20<b>RAG\x20外挂知识\x20+\x20引用溯源</b>\x20→\x20结构化输出约束\x20→\x20生成后一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能彻底消除吗？”——不能，它是概率生成的内在属性；工程目标是<b>把幻觉控制在可接受范围并让它可被发现</b>（溯源、置信度、拒答）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（王牌）</span><br>OKC-SFT\x20直接打这个问题：六段式知识链强制模型输出\x20Verification\x20和\x20Risk\x20Boundary，幻觉率\x2034.4%→15.6%，Verification/Risk\x20Boundary\x20出现率\x20100%——<b>“我不是在让模型少说错，是在让它必须自证”</b>，这句话能让面试官记住你。““““““'},{'c':_0x4f56ae(0x37f),'s':0x7,'lv':'🔥','q':'怎么判断模型“知不知道自己不知道”？','a':_0x4f56ae(0x2f9)},{'c':_0x4f56ae(0x37f),'s':0x7,'lv':'🔥','q':_0x4f56ae(0x21f),'a':_0x4f56ae(0x358)},{'c':'llm','s':0x7,'lv':'💎','q':_0x4f56ae(0x3c9),'a':_0x4f56ae(0x234)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x4f56ae(0x36f),'a':_0x4f56ae(0x39e)},{'c':'rl','s':0x0,'lv':'⭐','q':_0x4f56ae(0x2bd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>V(s)：从状态\x20s\x20出发按策略走的期望回报。Q(s,a)：在\x20s\x20执行动作\x20a\x20之后再按策略走的期望回报。<b>贝尔曼方程</b>把长期价值拆成“即时奖励\x20+\x20折扣后的后继状态价值”：Q(s,a)\x20=\x20E[r\x20+\x20γ·max_a\x27\x20Q(s\x27,a\x27)]——这个递归结构是几乎所有\x20RL\x20算法的地基。<b>优势函数</b>\x20A(s,a)\x20=\x20Q(s,a)\x20−\x20V(s)：这个动作比平均水平好多少，比绝对价值更适合指导策略更新（方差更小）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么用优势而不是回报？”——减去基线V(s)\x20不改变梯度期望但显著降低方差，训练更稳；“V和\x20Q\x20的关系？”——V(s)\x20=\x20E_{a~π}[Q(s,a)]。““““““'},{'c':'rl','s':0x1,'lv':'🔥','q':_0x4f56ae(0x3b8),'a':_0x4f56ae(0x385)},{'c':'rl','s':0x1,'lv':'💎','q':_0x4f56ae(0x19c),'a':_0x4f56ae(0x214)},{'c':'rl','s':0x2,'lv':'⭐','q':'策略梯度：REINFORCE\x20到Actor-Critic','a':_0x4f56ae(0x2f2)},{'c':'rl','s':0x2,'lv':'⭐','q':_0x4f56ae(0x24a),'a':_0x4f56ae(0x3a4)},{'c':'rl','s':0x2,'lv':'🔥','q':_0x4f56ae(0x33e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>on-policy</b>（REINFORCE、PPO）：学习用的数据必须来自当前策略，数据用完即弃\x20→\x20样本效率低但稳定、实现简单。<b>off-policy</b>（Q-learning、DQN、SAC）：可以用其他策略（历史经验池）的数据\x20→\x20样本效率高，但存在分布偏移，需要重要性修正或特殊设计来稳定。PPO\x20用重要性采样\x20+\x20clip，属于“<b>近似\x20on-policy</b>”——允许少量复用，兼顾两者。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20后训练场景为什么在意这个？”——采样（rollout）成本极高（每条要生成完整回答），所以样本效率直接决定训练成本；这也是离线方法\x20DPO\x20受欢迎的原因——直接用预先收集好的偏好数据，零\x20rollout。““““““'},{'c':'rl','s':0x3,'lv':'⭐','q':_0x4f56ae(0x308),'a':_0x4f56ae(0x33d)},{'c':'rl','s':0x3,'lv':'⭐','q':'DPO：怎么把\x20RL\x20问题变成监督学习','a':_0x4f56ae(0x25e)},{'c':'rl','s':0x3,'lv':'⭐','q':_0x4f56ae(0x2d7),'a':_0x4f56ae(0x319)},{'c':'rl','s':0x3,'lv':'🔥','q':'PPO\x20→\x20DPO\x20→\x20GRPO：这条演进线怎么讲','a':_0x4f56ae(0x3b9)},{'c':'rl','s':0x3,'lv':'💎','q':_0x4f56ae(0x291),'a':_0x4f56ae(0x311)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x4f56ae(0x1f5),'a':_0x4f56ae(0x3ec)},{'c':'rl','s':0x4,'lv':'🔥','q':_0x4f56ae(0x29a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个关键问题：①\x20<b>环境与仿真效率</b>——RL\x20极度依赖采样量，仿真器吞吐（并行环境数）往往是瓶颈\x20②\x20<b>状态与动作空间设计</b>——特征怎么编码、动作怎么离散化，往往比换算法更影响效果\x20③\x20<b>自对弈与课程学习</b>——从弱对手逐步提升难度（AlphaGo/OpenAI\x20Five\x20的路线）④\x20<b>可玩性≠\x20最优性</b>——游戏\x20AI\x20目标常常不是“最强”，而是“有趣、拟人、难度可调”，这和纯性能导向的\x20RL\x20目标不同。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20能给游戏\x20AI\x20带来什么？”——把\x20NPC\x20的对话/决策交给\x20LLM，用自然语言做行为规划与角色扮演，RL\x20管操作层、LLM\x20管语义与意图层，这是当前\x20LLM\x20驱动游戏\x20AI\x20的主流思路。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（实习专用）</span><br>面LLM\x20岗时被问“你在腾讯做游戏算法，和这个岗位有什么关系？”——标准答法：<b>“我在做的正是\x20LLM\x20驱动的游戏智能体，RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索利用、策略优化。我在游戏场景踩的奖励设计坑，直接迁移到理解\x20RLHF\x20的reward\x20hacking。”</b>这个回答把看起来跑偏的实习变成加分项。““““““'},{'c':'pt','s':0x0,'lv':'⭐','q':_0x4f56ae(0x300),'a':_0x4f56ae(0x1dd)},{'c':'pt','s':0x0,'lv':'⭐','q':_0x4f56ae(0x23f),'a':_0x4f56ae(0x35a)},{'c':'pt','s':0x0,'lv':'🔥','q':'指令数据构造方法：人工\x20/\x20Self-Instruct\x20/\x20Evol-Instruct','a':_0x4f56ae(0x39d)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20训练配置：lr\x20/\x20epoch\x20/\x20packing\x20/\x20loss\x20mask','a':_0x4f56ae(0x2f4)},{'c':'pt','s':0x0,'lv':'🔥','q':'SFT\x20的\x20loss\x20曲线怎么读？','a':_0x4f56ae(0x376)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x4f56ae(0x328),'a':_0x4f56ae(0x257)},{'c':'pt','s':0x1,'lv':'⭐','q':_0x4f56ae(0x377),'a':_0x4f56ae(0x320)},{'c':'pt','s':0x1,'lv':'🔥','q':'LoRA的\x20rank\x20和\x20alpha\x20怎么定？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>r（秩）=\x20适配容量</b>：小\x20r\x20省显存但表达受限，大\x20r\x20逼近全量微调。经验：简单任务/小数据\x20r=8~16；复杂领域适配\x20r=32~64；超过\x20128\x20通常不如直接全量。<b>alpha\x20=\x20缩放系数</b>，实际更新\x20=\x20(alpha/r)·BA，所以\x20alpha/r\x20相当于\x20LoRA\x20分支的<b>等效学习率倍数</b>。常见做法：alpha=2r\x20或\x20alpha=r，然后固定它、只调\x20lr。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“r\x20越大越好吗？”——不是，小数据下大\x20r\x20更容易过拟合；“怎么快速定？”——先\x20r=16跑基线，看验证指标是否受容量限制再决定加不加。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>同时调\x20r和\x20alpha\x20会让等效学习率变化不可控——<b>固定\x20alpha/r\x20比例，只调一个变量</b>，这是实验方法论的体现。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':_0x4f56ae(0x266),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成因：微调梯度把通用能力对应的权重拉向领域最优点——学新忘旧。<b>发现</b>：除了领域指标，必须跑通用基准（MMLU/CMMLU/C-Eval）看掉不掉点，以及测通用对话是否变呆。<b>缓解</b>（按性价比）：①\x20<b>数据混合</b>——领域数据掺\x205~20%\x20通用指令数据（最常用最有效）②\x20LoRA\x20类\x20PEFT\x20冻结主干，天然保护\x20③\x20小\x20lr\x20+\x20少\x20epoch\x20④\x20正则（L2-SP\x20往原权重罚、KL\x20惩罚）⑤\x20模型合并（model\x20merge）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LoRA\x20完全不会遗忘吗？”——会但轻得多，因为主干不动、ΔW\x20幅度受限；“怎么定混合比例？”——按“领域指标不掉、通用基准掉点在容忍范围内”做网格试验。“““““'},{'c':'pt','s':0x1,'lv':'🔥','q':'全量微调\x20/\x20LoRA\x20/\x20Prompt+RAG：选型决策树','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>决策顺序（<b>永远从最便宜的开始</b>）：①\x20<b>Prompt\x20+\x20RAG</b>——零训练成本、知识可实时更新，先用它验证需求和上限\x20②\x20<b>LoRA/QLoRA</b>——中小数据、单卡、要保通用能力、要多任务热插拔（不同\x20LoRA\x20当插件切换）③\x20<b>全量微调</b>——大数据、多卡、要改动模型深层能力（新语言、强领域风格）。判断维度：数据量、算力预算、知识时效性、延迟要求、是否需要多任务复用。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么知道该升级方案了？”——当\x20prompt\x20工程调到边际收益趋零、且失败案例集中在“格式/行为不稳定”而非“知识缺失”时，才该上微调。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你两个项目正好各在一端：NL2SQL\x20走\x20Prompt+RAG\x20路线，论文走\x20QLoRA\x20路线——<b>“同一套判断标准，两个不同结论”</b>，这比只会一种方法强得多。“““““'},{'c':'pt','s':0x1,'lv':'💎','q':_0x4f56ae(0x326),'a':_0x4f56ae(0x3c8)},{'c':'pt','s':0x2,'lv':'⭐','q':_0x4f56ae(0x224),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>完整后训练流水线：<b>继续预训练（可选）→\x20SFT\x20→\x20偏好对齐\x20→\x20评测</b>。偏好对齐三条路线：<b>RLHF(PPO)</b>\x20效果强但要四模型、工程重；<b>DPO</b>\x20把奖励解析掉变离线监督学习，稳定便宜、是中小团队首选；<b>GRPO</b>\x20保留在线探索但去掉\x20critic，用组内相对优势+\x20可验证奖励，在推理任务上突破。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么\x20SFT\x20之后还要对齐？”——SFT\x20只学正例、无法表达“更好/更差”的相对偏好，也压不住幻觉与不安全输出。<br><span\x20class=\x27lb\x27>⚓\x20交叉引用</span><br>算法细节在<b>第四章强化学习</b>（4.4/4.5\x20节）已展开——面试若深挖\x20PPO\x20的\x20clip、DPO\x20的推导，翻那一章。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x4f56ae(0x22f),'a':_0x4f56ae(0x1cb)},{'c':'pt','s':0x2,'lv':'💎','q':_0x4f56ae(0x19d),'a':_0x4f56ae(0x339)},{'c':'pt','s':0x2,'lv':'🔥','q':_0x4f56ae(0x3bb),'a':_0x4f56ae(0x2e1)},{'c':'pt','s':0x3,'lv':'⭐','q':'如何设计一个领域模型的评测体系（论文核心）','a':_0x4f56ae(0x3a1)},{'c':'pt','s':0x3,'lv':'⭐','q':'LLM-as-a-Judge：可靠吗？怎么用才靠谱','a':_0x4f56ae(0x3f0)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4f56ae(0x35f),'a':_0x4f56ae(0x245)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4f56ae(0x222),'a':_0x4f56ae(0x20b)},{'c':'pt','s':0x3,'lv':'💎','q':_0x4f56ae(0x2b5),'a':_0x4f56ae(0x1dc)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x4f56ae(0x35c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>机制：把专家的<b>思维流程固化成输出结构</b>（如诊断→证据→原因→措施→验证→风险边界），让模型必须逐字段生成。为什么有效：①\x20<b>结构即约束</b>——强制字段消除了“想说什么说什么”的自由度，输出稳定性大幅提升\x20②\x20<b>把隐式推理显式化</b>——每个字段都是一个子任务，等价于内置了\x20CoT\x20③\x20<b>可验证字段倒逼自检</b>——要求写出Verification\x20和\x20Risk\x20Boundary，模型必须为结论找支撑，幻觉自然下降\x20④\x20<b>可审计</b>——字段化输出便于人工核验与自动校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价是什么？”——输出变长（成本↑）、灵活性下降、结构设计本身需要领域专家参与；“怎么迁移到别的领域？”——本质是“把领域专家的工作流程翻译成输出\x20schema”，医疗诊断、风控审核、故障排查都适用。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br><b>“我做的不是让模型少说错话，是让它必须自证。”</b>——这句话是你论文最好的一句总结，也是这本手册里最值得背下来的一句。“““““'},{'c':'app','s':0x0,'lv':'⭐','q':_0x4f56ae(0x1e7),'a':_0x4f56ae(0x277)},{'c':_0x4f56ae(0x2d9),'s':0x0,'lv':'⭐','q':_0x4f56ae(0x401),'a':_0x4f56ae(0x32e)},{'c':_0x4f56ae(0x2d9),'s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x4f56ae(0x3f9)},{'c':_0x4f56ae(0x2d9),'s':0x1,'lv':'🔥','q':_0x4f56ae(0x399),'a':_0x4f56ae(0x267)},{'c':_0x4f56ae(0x2d9),'s':0x1,'lv':'⭐','q':_0x4f56ae(0x346),'a':_0x4f56ae(0x2a3)},{'c':_0x4f56ae(0x2d9),'s':0x2,'lv':'🔥','q':_0x4f56ae(0x396),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个指标分两组：<b>检索侧</b>——Context\x20Recall（该查到的查到没）+\x20Context\x20Precision（查回的有多少真有用）；<b>生成侧</b>——Faithfulness（回答是否忠于资料，防幻觉核心指标）+\x20Answer\x20Relevancy（是否切题）。工程做法：建\x2050-200\x20条带金标准的评估集，每次改\x20chunking/检索/prompt\x20都跑回归。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评估集哪来？”——真实用户\x20query\x20+\x20人工标注金标准文档/答案；“RAGAS\x20的局限？”——它自己也用\x20LLM\x20评分，LLM-as-a-Judge\x20的所有偏差它都有，关键决策要人工抽检校准。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>“没有评估集就没有优化，只有玄学”——这句话可以直接说给面试官。““““““'},{'c':_0x4f56ae(0x2d9),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>五道防线按链路排：①\x20prompt\x20忠实度约束（“仅根据资料回答，不知道就说不知道”）②\x20要求引用溯源（倒逼模型对来源负责，也便于人工核验）③\x20检索分数过低/为空直接拒答，别硬答\x20④\x20rerank\x20提精度，减少噪声上下文（噪声也是幻觉源）⑤\x20生成后\x20NLI\x20一致性校验。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么衡量幻觉有没有降下来？”——faithfulness\x20指标\x20+\x20人工抽检幻觉率，报数带口径（分母、谁判、抽样方式）。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>论文幻觉率\x2034.4%→15.6%\x20的指标设计可以直接迁移：核心思想都是“让模型对来源负责、强制自检”。““““““'},{'c':_0x4f56ae(0x2d9),'s':0x3,'lv':'🔥','q':'Query\x20改写与\x20HyDE：检索前处理怎么做？','a':_0x4f56ae(0x3eb)},{'c':_0x4f56ae(0x2d9),'s':0x3,'lv':'💎','q':'Agentic\x20RAG\x20与\x20GraphRAG：什么时候需要它们？','a':_0x4f56ae(0x1c7)},{'c':_0x4f56ae(0x2d9),'s':0x4,'lv':'⭐','q':_0x4f56ae(0x1b4),'a':_0x4f56ae(0x1e3)},{'c':_0x4f56ae(0x2d9),'s':0x4,'lv':'⭐','q':'ReAct：Reason\x20+\x20Act\x20模式讲清楚','a':_0x4f56ae(0x3f3)},{'c':'app','s':0x4,'lv':'🔥','q':_0x4f56ae(0x2ed),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':_0x4f56ae(0x357),'a':_0x4f56ae(0x287)},{'c':'app','s':0x5,'lv':'🔥','q':_0x4f56ae(0x23c),'a':_0x4f56ae(0x21a)},{'c':_0x4f56ae(0x2d9),'s':0x5,'lv':'💎','q':_0x4f56ae(0x1ff),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>分层：<b>工作记忆</b>（当前窗口内）→\x20<b>短期记忆</b>（会话级结构化状态）→\x20<b>长期记忆</b>（跨会话，向量化存取，用时检索注入）。关键不在“存”，而在三个决策：<b>写什么进去</b>（不是所有对话都值得记）、<b>怎么检索</b>（相关性\x20+\x20时间衰减）、<b>如何遗忘与保护隐私</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“长期记忆是不是又一个\x20RAG？”——本质是，只是数据源从文档换成了用户历史；参考\x20MemGPT\x20的分页内存思想。““““““'},{'c':_0x4f56ae(0x2d9),'s':0x6,'lv':'⭐','q':_0x4f56ae(0x39f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':'app','s':0x6,'lv':'⭐','q':_0x4f56ae(0x3fd),'a':_0x4f56ae(0x329)},{'c':_0x4f56ae(0x2d9),'s':0x6,'lv':'🔥','q':_0x4f56ae(0x2a0),'a':_0x4f56ae(0x271)},{'c':_0x4f56ae(0x2d9),'s':0x6,'lv':'💎','q':_0x4f56ae(0x2f6),'a':_0x4f56ae(0x347)},{'c':'app','s':0x7,'lv':'⭐','q':_0x4f56ae(0x1f9),'a':_0x4f56ae(0x2fe)},{'c':_0x4f56ae(0x2d9),'s':0x7,'lv':'🔥','q':_0x4f56ae(0x2fc),'a':_0x4f56ae(0x2f7)},{'c':'app','s':0x7,'lv':'⭐','q':'可执行率\x20vs\x20正确率：评估口径必须讲清','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>可执行率</b>（SQL\x20能跑不报错）只证明语法和\x20schema\x20合法，不证明查的是用户要的；<b>正确率</b>必须人工或金标准\x20SQL\x20比对（结果集一致\x20or\x20逻辑等价）。报数三要素：分母是什么、谁来判、抽样还是全量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么自动评正确率？”——测试集配金标准\x20SQL\x20比结果集（EX\x20指标）；“EX\x20的局限？”——结果对≠逻辑对（比如空结果集巧合），所以要加人工抽检。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>只报一个“准确率\x2095%”不讲口径\x20=\x20告诉面试官你没做过真实验。主动拆口径，反而是加分项。““““““'},{'c':'app','s':0x7,'lv':'🔥','q':_0x4f56ae(0x293),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>生成\x20SQL\x20→\x20语法校验\x20→\x20沙箱执行\x20→\x20报错或结果异常（空集、行数爆炸）→\x20<b>错误信息结构化回喂</b>模型重写\x20→\x20重试\x20N\x20轮封顶\x20→\x20仍失败则拒答/转人工。两个关键设计：错误信息要让模型知道“哪错了”（不是只说“错了”）；轮数必须封顶，防循环烧钱。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“会不会越改越错？”——会，所以封顶\x20+\x20保留初版对比；“提升多少？”——你项目里可执行率到\x2098%，很大程度靠这一环。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（金句）</span><br>这套“生成-验证-修正”闭环和\x20OKC-SFT\x20的\x20Verification\x20字段是同一个思想：<b>让输出经过验证再交付</b>——两个项目在此交汇。““““““'},{'c':_0x4f56ae(0x2d9),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x4f56ae(0x2ab)},{'c':_0x4f56ae(0x251),'s':0x0,'lv':'⭐','q':_0x4f56ae(0x1db),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>GIL（全局解释器锁）：CPython\x20中同一时刻只允许一个线程执行\x20Python\x20字节码。影响：<b>CPU\x20密集</b>任务多线程无效（切换还有开销）；<b>IO\x20密集</b>任务多线程有效（等待\x20IO\x20时会释放\x20GIL）。绕过：CPU\x20密集\x20→\x20multiprocessing\x20或\x20C\x20扩展/NumPy；IO\x20密集\x20→\x20多线程或<b>asyncio</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20服务受影响吗？”——推理算力在GPU\x20上，Python\x20层主要做<b>请求调度和\x20IO</b>，所以\x20asyncio\x20就够；这也是\x20FastAPI\x20+\x20vLLM\x20这类异步架构的由来；“3.13\x20的\x20free-threading？”——实验性无\x20GIL\x20版本，生态兼容仍在推进。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20FastAPI\x20服务里并发调模型接口，就是“IO\x20密集用异步”的实践。“““'},{'c':'eng','s':0x0,'lv':'⭐','q':_0x4f56ae(0x359),'a':_0x4f56ae(0x1b9)},{'c':_0x4f56ae(0x251),'s':0x0,'lv':'🔥','q':_0x4f56ae(0x2d8),'a':_0x4f56ae(0x1d6)},{'c':_0x4f56ae(0x251),'s':0x1,'lv':'⭐','q':_0x4f56ae(0x2e9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':_0x4f56ae(0x251),'s':0x1,'lv':'🔥','q':'事务、隔离级别与\x20MVCC','a':_0x4f56ae(0x244)},{'c':_0x4f56ae(0x251),'s':0x1,'lv':'🔥','q':_0x4f56ae(0x2c7),'a':_0x4f56ae(0x34a)},{'c':_0x4f56ae(0x251),'s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':_0x4f56ae(0x232)},{'c':_0x4f56ae(0x251),'s':0x2,'lv':'🔥','q':_0x4f56ae(0x39c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':_0x4f56ae(0x251),'s':0x3,'lv':'🔥','q':_0x4f56ae(0x386),'a':_0x4f56ae(0x211)},{'c':_0x4f56ae(0x251),'s':0x3,'lv':'🔥','q':'Linux\x20排查：故障定位的标准顺序','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>按顺序排查才显专业</b>：①\x20服务起不来→\x20<b>ss\x20-tlnp\x20/\x20lsof\x20-i:端口</b>\x20看端口占用\x20②\x20看日志\x20→\x20tail\x20-f、grep\x20-C、journalctl\x20③\x20资源\x20→\x20<b>nvidia-smi</b>（显存/利用率）、free\x20-h（内存）、<b>df\x20-h</b>（磁盘写满是隐蔽杀手）
