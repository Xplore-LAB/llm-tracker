<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<title>LLM 秋招手册 · 大模型应用 / Agent 工程师</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#3d5a99; --accent-deep:#2c4271; --accent-soft:#eef2fa;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7dcff!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

/* ---------- 手写板 ---------- */
#pad-view{display:none;height:100%;padding:16px 20px}
.pad-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.pad-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad-toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad-toolbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.pad-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.pad-hint{font-size:12px;color:var(--ink3)}
#pad-editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* ---------- 题单 ---------- */
#list-view{display:none;height:100%;padding:20px;overflow-y:auto}
.list-wrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.list-hero{text-align:center;padding:10px 0 4px}
.list-hero h2{font-family:var(--serif);font-size:19px;letter-spacing:1px}
.list-hero .sub{font-size:12.5px;color:var(--ink3);margin-top:6px}
.list-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.list-progress .track{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.list-progress .fill{height:100%;background:var(--ok);transition:width .3s}
.week-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.week-head{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.week-head .wk{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;letter-spacing:1px}
.week-head .wn{color:var(--ink2);font-weight:600;font-size:13px}
.list-q{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.list-q:last-child{border-bottom:none}
.list-q .check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-q .qt{flex:1;color:var(--ink)}
.list-q .qt.done{color:var(--ink3);text-decoration:line-through}
.diff{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.diff.Easy{background:var(--ok-soft);color:var(--ok)}
.diff.Medium{background:var(--warn-soft);color:var(--warn)}
.diff.Hard{background:#fde8e8;color:#d64545}
.list-q .prem{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.list-q a{color:var(--accent);text-decoration:none;font-size:12px}
.list-q a:hover{text-decoration:underline}
/* ---------- 刷题模式 ---------- */
#quiz-view{display:none;flex-direction:column;height:100%;gap:14px;padding:20px;overflow-y:auto}
.quiz-config{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.quiz-config h2{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.quiz-config .note{font-size:12.5px;color:var(--ink3)}
.quiz-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.quiz-row .lbl{font-size:12.5px;color:var(--ink2);min-width:52px;font-weight:600}
.quiz-row select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer}
.quiz-row select:focus{outline:none;border-color:var(--accent)}
.quiz-start{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:2px}
.quiz-start:hover{background:var(--accent-deep)}
.quiz-run{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.quiz-progress .track{flex:1;margin:0 14px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent);transition:width .3s}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.quiz-card .qtag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;letter-spacing:1px}
.quiz-card .qtitle{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.65}
.quiz-answer{display:none;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.quiz-answer.show{display:block}
.quiz-answer b{color:var(--accent)}
.quiz-reveal{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600}
.quiz-reveal:hover{background:var(--accent);color:#fff}
.quiz-judge{display:none;gap:14px}
.quiz-judge.show{display:flex}
.quiz-judge button{flex:1;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent}
.quiz-judge .no{background:var(--warn-soft);color:var(--warn)}
.quiz-judge .yes{background:var(--ok-soft);color:var(--ok)}
.quiz-done{max-width:640px;margin:0 auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.quiz-done .score{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent)}
.quiz-done .statline{color:var(--ink2);font-size:14px}
.quiz-done .wrong-list{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.quiz-done .wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.quiz-done .wrong-item:hover{border-color:var(--warn)}
.quiz-done .actions{display:flex;gap:12px;justify-content:center}
.quiz-done .actions button{border-radius:8px;padding:10px 26px;cursor:pointer;font-size:14px}
.quiz-done .again{background:var(--accent);color:#fff;border:none}
.quiz-done .config{background:var(--panel);border:1px solid var(--line);color:var(--ink2)}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:10;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding:3px}
  .mode-tabs button{white-space:nowrap;padding:6px 14px;font-size:12.5px;letter-spacing:0}
  .overall{order:11;margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  .progress-track{flex:1}
  .page{padding:20px 14px 70px}
  .entry .q{padding:13px 14px;gap:9px}
  .entry .a{padding:12px 14px 14px}
  .entry .q .idx{min-width:30px}
  .search-box{flex-wrap:wrap}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:2px}
  .expand-btns button{white-space:nowrap}
  .card-face{padding:22px 20px}
  .card-scene{height:320px}
  .quiz-card{padding:20px 18px}
  .toc-hero h1{font-size:26px}
  .ch-hero h1{font-size:24px}
  .sec-head{flex-wrap:wrap}
  .sec-head .sc{margin-left:0;flex-basis:100%}
  .toc-hero{padding:22px 14px 18px}
  .toc-hero h1{font-size:18px;letter-spacing:0;line-height:1.4}
  .toc-hero .en{font-size:10px;letter-spacing:3px}
  .toc-hero .sub{font-size:.78rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:11px;flex-wrap:wrap;gap:.3rem}
  .ch-hero{padding:20px 14px 16px}
  .ch-hero h1{font-size:16px;letter-spacing:0;line-height:1.4}
  .ch-hero .kicker{font-size:10px;letter-spacing:2px}
  .ch-hero .sub{font-size:.76rem;padding:0 .3rem}
  .sec-head{flex-wrap:wrap;gap:.4rem}
  .sec-head h2{font-size:1rem}
  .sec-head .sc{flex-basis:100%;margin-left:0}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1.05rem}
  .toc-item{flex-wrap:wrap;padding:9px 10px}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.78rem}
  .toc-item .num{font-size:.95rem}
  .search-box{padding:.55rem .7rem}
  .search-box input{font-size:.85rem;padding:6px 9px}
  .overall{padding:.5rem .7rem;gap:.5rem}
  .entry .q{padding:11px 12px;gap:8px;flex-wrap:wrap}

/span><br><b>哈希表\x20+\x20双向链表</b>。哈希表\x20key→节点实现\x20O(1)\x20定位；双向链表按使用顺序排列（头=最新，尾=最旧）实现\x20O(1)\x20移动与淘汰。<b>get</b>：命中则把节点移到头部并返回值。<b>put</b>：存在则更新值\x20+\x20移到头部；不存在则新建插入头部，若超容量则删除尾节点并同步删哈希表项。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么必须双向链表？”——删除任意节点需要知道前驱，单链表做不到\x20O(1)；“怎么减少边界\x20bug？”——用<b>哨兵头尾节点</b>，插入删除无需判空；“Python\x20有捷径吗？”——OrderedDict.move_to_end，但面试通常要求手写。<br><span\x20class=\x27lb\x27>⚓\x20联系工程</span><br>LLM\x20服务里的\x20prompt\x20缓存、KV\x20Cache\x20淘汰策略，用的都是这类思想。““'},{'c':'code','s':0x2,'lv':'🔥','q':_0x41a65c(0x12b),'a':_0x41a65c(0x301)},{'c':'code','s':0x2,'lv':'🔥','q':_0x41a65c(0x25f),'a':_0x41a65c(0x291)},{'c':_0x41a65c(0x168),'s':0x3,'lv':'⭐','q':'滑动窗口：适用题型与固定模板','a':_0x41a65c(0x179)},{'c':_0x41a65c(0x168),'s':0x3,'lv':'🔥','q':_0x41a65c(0x1dd),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>单调栈</b>解决“找下一个/上一个更大或更小元素”：维护栈内单调递减（找更大），新元素把栈顶比它小的都弹出，<b>被弹出元素的“下一个更大元素”就是当前元素</b>。每元素进出各一次\x20→\x20O(n)。<b>单调队列</b>（双端队列）解决<b>滑动窗口最大值（239）</b>：队首保持最大，入队时从尾部弹掉比自己小的，出窗口时从队首弹掉过期下标。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“经典题？”——每日温度（739）、柱状图中最大的矩形（84）、接雨水（42）、去除重复字母（316）；“怎么判断该用单调栈？”——题目问“最近的更大/更小”或涉及“以某元素为最值的最大区间”。““'},{'c':_0x41a65c(0x168),'s':0x3,'lv':'🔥','q':'前缀和、差分与哈希优化','a':_0x41a65c(0x1b8)},{'c':_0x41a65c(0x168),'s':0x3,'lv':'🔥','q':'区间问题：合并、插入、调度','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>合并区间（56）</b>：<b>按起点排序</b>，遍历维护当前区间——若新区间起点\x20≤\x20当前终点则合并（终点取\x20max），否则收尾并开新区间。<b>无重叠区间/区间调度（435）</b>：贪心<b>按终点排序</b>，每次选结束最早的——终点越早留给后面的空间越大。<b>会议室\x20II（253）</b>：最小堆维护各会议室的结束时间，或用差分/扫描线统计同时刻最大重叠数。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“什么时候按起点排、什么时候按终点排？”——<b>合并类按起点、选择最多不重叠类按终点</b>，这个判断是区间题的核心分水岭。““'},{'c':_0x41a65c(0x168),'s':0x4,'lv':'⭐','q':_0x41a65c(0x1cb),'a':_0x41a65c(0x1ca)},{'c':_0x41a65c(0x168),'s':0x4,'lv':'🔥','q':'BFS\x20/\x20DFS：网格、拓扑与回溯','a':_0x41a65c(0x272)},{'c':_0x41a65c(0x168),'s':0x5,'lv':'🔥','q':_0x41a65c(0x18e),'a':_0x41a65c(0x171)},{'c':_0x41a65c(0x168),'s':0x5,'lv':'💎','q':_0x41a65c(0x17f),'a':_0x41a65c(0x19b)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x41a65c(0x1bf),'a':_0x41a65c(0x18b)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x41a65c(0x195),'a':_0x41a65c(0x163)},{'c':'ml','s':0x0,'lv':'⭐','q':_0x41a65c(0x14e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>Adam\x20=\x20<b>一阶动量</b>（梯度的指数滑动平均，平滑方向）+\x20<b>二阶动量</b>（梯度平方的滑动平均，做逐参数自适应步长）+\x20偏差修正。优势：收敛快、对超参不敏感、稀疏梯度友好——大模型默认选择。<b>代价（必背算术）</b>：每个参数多存两个\x20fp32\x20状态\x20=\x208\x20字节；加上\x20fp32\x20主权重和梯度，全量微调约\x20<b>16\x20字节/参数</b>，7B\x20就是\x20112GB\x20量级——这是“7B\x20全量微调必须多卡、单卡只能\x20LoRA”的根本原因。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“AdamW\x20和\x20Adam\x20的区别？”——AdamW\x20把\x20weight\x20decay\x20从梯度里<b>解耦</b>出来直接作用于权重，正则效果更正确，是现在的标准；“SGD\x20还有用吗？”——CV\x20里精调有时泛化更好，但LLM\x20场景几乎全用\x20AdamW。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>这笔账直接支撑你选\x20QLoRA\x20的理由——见第三章「参数量与显存估算」。““““'},{'c':'ml','s':0x0,'lv':'🔥','q':_0x41a65c(0x2a5),'a':_0x41a65c(0x1be)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x41a65c(0x173),'a':_0x41a65c(0x1fd)},{'c':'ml','s':0x0,'lv':'🔥','q':_0x41a65c(0x18a),'a':_0x41a65c(0xa7)},{'c':'ml','s':0x1,'lv':'⭐','q':_0x41a65c(0x1e8),'a':_0x41a65c(0x255)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x41a65c(0x1c0),'a':_0x41a65c(0x1af)},{'c':'ml','s':0x1,'lv':'🔥','q':_0x41a65c(0x2d4),'a':_0x41a65c(0x1a6)},{'c':'ml','s':0x2,'lv':'⭐','q':_0x41a65c(0xf9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>L\x20=\x20−Σ\x20y\x20log\x20p。softmax\x20把logits\x20变成概率分布，交叉熵度量它与真实分布的差距。为什么天生配对：<b>合起来对\x20logits\x20求导后梯度恰好\x20=\x20p\x20−\x20y</b>（预测减真值），形式极简、数值稳定、梯度不饱和。LLM\x20语境：next-token\x20prediction\x20就是在词表维度上做\x20softmax\x20+\x20交叉熵；<b>困惑度\x20PPL\x20=\x20exp(平均交叉熵)</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不用\x20MSE？”——分类任务上\x20MSE\x20配\x20sigmoid\x20会梯度饱和（预测很错时梯度反而小），交叉熵没这个问题；“label\x20smoothing\x20干什么？”——把\x20one-hot\x20软化，防止模型对某个\x20token\x20过度自信，提升泛化和校准。““““'},{'c':'ml','s':0x2,'lv':'⭐','q':_0x41a65c(0xe0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>信号：训练\x20loss\x20持续降但<b>验证\x20loss\x20转升</b>；训练集指标远好于测试集；模型开始复述训练样本。对策按大模型语境的性价比排序：①\x20<b>更多/更干净的数据</b>（永远最有效）②\x20<b>早停</b>——监控验证集，SFT\x20里\x20epoch\x20设\x202~3\x20就是经验性防过拟合\x20③\x20<b>用\x20LoRA\x20限制可训练参数量</b>（小数据尤其有效）④\x20weight\x20decay\x20/\x20dropout\x20⑤\x20数据混合与多任务。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“小数据微调怎么防？”——LoRA\x20+\x20小\x20r\x20+\x20少\x20epoch\x20+\x20早停\x20+\x20掺通用数据，四件套；<b>你的\x20611\x20条数据场景正好适用这套组合，被问“数据这么少怎么保证不过拟合”时按这个答。</b>““““'},{'c':'ml','s':0x2,'lv':'🔥','q':'Precision\x20/\x20Recall\x20/\x20F1\x20/\x20AUC\x20分别刻画什么','a':_0x41a65c(0x187)},{'c':'ml','s':0x2,'lv':'🔥','q':_0x41a65c(0x181),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>经典分解：误差\x20=\x20偏差²\x20+\x20方差\x20+\x20不可约噪声。高偏差=欠拟合（模型太简单），高方差=过拟合（模型太复杂或数据太少）。<b>大模型时代的修正</b>：出现<b>双下降（double\x20descent）</b>现象——参数量越过插值阈值后，继续加大模型反而使测试误差<b>再次下降</b>，所以“更大的模型+更多数据”常常同时压低偏差和方差。这解释了为什么现代实践里“加大规模”经常是正解。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“那还需要正则吗？”——需要，尤其小数据微调场景；规模的红利建立在<b>数据量和质量跟得上</b>的前提下，数据噪声会成为新的天花板。““““'},{'c':'ml','s':0x2,'lv':'🔥','q':_0x41a65c(0x2b2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类手段：①\x20<b>采样</b>——过采样少数类/欠采样多数类（SMOTE\x20在高维文本上慎用）②\x20<b>损失加权</b>——class\x20weight\x20或\x20<b>focal\x20loss</b>（压低易分类样本的权重，聚焦难例）③\x20<b>阈值移动</b>——不按\x200.5\x20切，按业务代价选④\x20<b>指标换掉</b>——别看\x20accuracy（99%\x20负样本时全预测负也有99%），看\x20PR\x20曲线/F1/PR-AUC。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景有对应问题吗？”——有：SFT\x20数据里任务类型分布不均，模型会偏向多数类任务；对策是<b>按任务类型做覆盖与配比设计</b>，这正是你论文里\x206\x20类任务均衡设计的意义。““““'},{'c':'ml','s':0x2,'lv':'💎','q':_0x41a65c(0x207),'a':_0x41a65c(0x1a3)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x41a65c(0x1e5),'a':_0x41a65c(0x162)},{'c':'ml','s':0x3,'lv':'⭐','q':_0x41a65c(0x19f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四大块：①\x20<b>模型权重</b>——fp16\x20下\x202\x20字节/参数\x20②\x20<b>梯度</b>——与权重同量级\x20③\x20<b>优化器状态</b>——Adam\x20两个动量，fp32\x20下\x208\x20字节/参数（<b>最大头</b>）④\x20<b>激活值</b>——与\x20batch\x20size、序列长度、层数正相关，梯度检查点可大幅压缩。全量微调总计约\x2016~20\x20字节/参数。<b>LoRA\x20省的主要是\x20②③</b>：冻结主干后无需为绝大部分参数存梯度和优化器状态，这才是它省显存的核心，不只是“可训练参数少”。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“推理显存怎么算？”——权重\x20+\x20KV\x20Cache\x20+\x20激活，一般按权重的\x201.2~1.5\x20倍规划；“OOM\x20了先降什么？”——batch\x20size\x20→\x20序列长度\x20→\x20开梯度检查点\x20→\x20换\x20QLoRA。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>私有化部署项目里如果调过这些参数，这条就是你的实战谈资。““““'},{'c':'ml','s':0x3,'lv':'💎','q':_0x41a65c(0x1e3),'a':_0x41a65c(0x99)},{'c':_0x41a65c(0x186),'s':0x0,'lv':'⭐','q':_0x41a65c(0x211),'a':_0x41a65c(0x7c)},{'c':'llm','s':0x0,'lv':'⭐','q':_0x41a65c(0x290),'a':_0x41a65c(0xcf)},{'c':_0x41a65c(0x186),'s':0x0,'lv':'🔥','q':_0x41a65c(0x196),'a':_0x41a65c(0x174)},{'c':_0x41a65c(0x186),'s':0x0,'lv':'🔥','q':_0x41a65c(0x137),'a':_0x41a65c(0xb9)},{'c':_0x41a65c(0x186),'s':0x1,'lv':'⭐','q':_0x41a65c(0x1e7),'a':_0x41a65c(0xba)},{'c':'llm','s':0x1,'lv':'🔥','q':_0x41a65c(0x1bb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条路线组合使用：①\x20<b>位置编码外推</b>——PI（位置线性插值，把长位置压回训练范围）、NTK-aware（按维度非均匀调频率，保住高频局部信息）、YaRN（NTK\x20+\x20注意力温度修正，效果最好），几乎零成本扩\x202-4\x20倍\x20②\x20<b>高效注意力</b>——FlashAttention\x20省显存、滑窗/稀疏注意力降复杂度\x20③\x20<b>长文本继续训练</b>——让模型真的学会用长窗口。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“宣称\x201M\x20context\x20可信吗？”——要看\x20needle-in-haystack\x20和\x20RULER\x20这类有效长度测试，标称长度和有效长度常有明显差距。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别只背名字。能说出“PI\x20是均匀压缩会损失高频局部信息，NTK\x20按维度区分对待”，水位立刻不同。““““““'},{'c':_0x41a65c(0x186),'s':0x1,'lv':'🔥','q':_0x41a65c(0x23d),'a':_0x41a65c(0x170)},{'c':_0x41a65c(0x186),'s':0x2,'lv':'⭐','q':_0x41a65c(0x27c),'a':_0x41a65c(0x18f)},{'c':_0x41a65c(0x186),'s':0x2,'lv':'⭐','q':_0x41a65c(0x8c),'a':_0x41a65c(0x228)},{'c':'llm','s':0x2,'lv':'💎','q':_0x41a65c(0x135),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四类：①\x20<b>批处理</b>——continuous\x20batching（vLLM，请求到达即插入，GPU\x20不空转，吞吐提升最大的单点）\x20②\x20<b>注意力与显存</b>——PagedAttention、FlashAttention、KV\x20量化\x20③\x20<b>模型压缩</b>——量化（GPTQ/AWQ权重量化、W8A8）、蒸馏、剪枝\x20④\x20<b>解码策略</b>——投机解码（小模型起草、大模型批量验证，无损加速）、Medusa\x20多头预测。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“先上哪个？”——先vLLM（continuous\x20batching\x20+\x20PagedAttention\x20开箱即得），再考虑量化；“投机解码为什么无损？”——验证阶段用大模型的分布做接受/拒绝采样，输出分布与原模型一致。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>应用岗到这个水位（知道名词\x20+\x20一句话原理\x20+\x20选型顺序）就够，别硬装Infra\x20深度——被追问\x20CUDA\x20实现会崩。““““““'},{'c':'llm','s':0x3,'lv':'⭐','q':_0x41a65c(0x9a),'a':_0x41a65c(0x2f0)},{'c':_0x41a65c(0x186),'s':0x3,'lv':'🔥','q':_0x41a65c(0x98),'a':_0x41a65c(0xe4)},{'c':_0x41a65c(0x186),'s':0x4,'lv':'🔥','q':_0x41a65c(0xea),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>BPE（字节对编码）：从字符/字节开始，反复合并语料中最高频的相邻\x20pair，直到词表达标（32k~150k）。好处：任意文本可编码（无\x20OOV）、词表可控。<b>后遗症（面试爱考）</b>：①\x20数字被切成任意片段\x20→\x20算术能力差（“9.11\x20和\x209.9\x20谁大”翻车）②\x20中文单字可能占\x202-3\x20token\x20→\x20又贵又慢\x20③\x20空格/大小写敏感\x20④\x20字符级任务差（数不清\x20strawberry\x20有几个\x20r）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么缓解数字问题？”——数字单独按位切分（Llama\x20系做法）；“中文模型怎么优化？”——扩充中文词表\x20+\x20继续预训练，token\x20效率能提升明显。““““““'},{'c':'llm','s':0x4,'lv':'🔥','q':_0x41a65c(0xa4),'a':_0x41a65c(0x160)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x41a65c(0xe6),'a':_0x41a65c(0x2ad)},{'c':_0x41a65c(0x186),'s':0x5,'lv':'🔥','q':_0x41a65c(0xf8),'a':_0x41a65c(0x210)},{'c':_0x41a65c(0x186),'s':0x5,'lv':'🔥','q':_0x41a65c(0x226),'a':_0x41a65c(0xf7)},{'c':_0x41a65c(0x186),'s':0x5,'lv':'💎','q':'MoE：为什么能又大又省？','a':_0x41a65c(0x142)},{'c':'llm','s':0x5,'lv':'🔥','q':_0x41a65c(0x247),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（按KV\x20Cache\x20排序，最能体现设计水平）</span><br><b>GPT-2\x20XL</b>\x20300\x20KiB/token\x20——\x20MHA\x20+\x20绝对位置编码\x20+\x20LayerNorm\x20+\x20GELU，全是后来被换掉的东西。<br><b>Llama\x203\x208B</b>\x20128\x20KiB\x20——\x20GQA(32:8)\x20+\x20RoPE(θ=500k)\x20+\x20RMSNorm\x20+\x20SwiGLU，<b>开源\x20Dense\x20范式的确立者</b>。<br><b>Qwen3\x208B</b>\x20144\x20KiB\x20——\x20同底盘+\x20<b>QK-Norm</b>\x20稳训练\x20+\x20词表扩到\x20152k（中文效率）+\x20θ=1M。<br><b>DeepSeek-V3</b>\x2068.6\x20KiB\x20——\x20<b>MLA\x20低秩压缩\x20KV</b>（kv_lora_rank=512）+\x20256\x20专家选\x208\x20+\x201\x20共享专家\x20+\x20前\x203\x20层\x20dense，671B\x20只激活\x2037B。<br><b>DeepSeek-R1</b>\x2068.6\x20KiB\x2 ,'q':_0x41a65c(0x23f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>典型顺序：①\x20<b>领域继续预训练</b>（有大量领域无标注语料时才做，注入领域语言分布）②\x20<b>SFT</b>（教任务格式，掺通用数据防遗忘）③\x20<b>偏好对齐</b>（DPO\x20起步，有可验证奖励再上\x20GRPO）④\x20<b>评测与回归</b>（领域指标\x20+\x20通用基准\x20+\x20badcase\x20集）⑤\x20上线后<b>数据回流</b>形成迭代闭环。关键原则：<b>每一步都要有独立的评估门禁</b>，否则问题会在后面步骤里被掩盖。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“能跳步吗？”——能，多数业务只做\x20SFT（甚至只做\x20prompt）；上偏好对齐的前提是<b>你已经能稳定测出“更好”是什么</b>。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>被问“你的论文后面还能怎么做”——按这个流水线答：偏好数据构造\x20→\x20DPO\x20对齐\x20→\x20用\x20SQL/规则可验证奖励尝试\x20GRPO。有路线图的候选人显得有后劲。“““““'},{'c':'pt','s':0x2,'lv':'🔥','q':_0x41a65c(0x1f7),'a':_0x41a65c(0x2cc)},{'c':'pt','s':0x3,'lv':'⭐','q':_0x41a65c(0xcb),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四层结构：①\x20<b>通用基准</b>——MMLU/CMMLU/C-Eval看有没有掉通用能力\x20②\x20<b>领域指标</b>——业务自定义，必须可自动计算或有明确人工口径\x20③\x20<b>LLM-as-a-Judge</b>——规模化主观评估\x20④\x20<b>线上信号</b>——采纳率、重试率、人工介入率。三条铁律：<b>先定指标再动手</b>、测试集与训练集<b>严格隔离防泄漏</b>、维护一份\x20<b>badcase\x20回归集</b>每次改动都跑。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么设计领域指标？”——从失败模式反推：模型会怎么错，就为那种错设一个指标。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子（全书最强之一）</span><br>你论文里的五个维度就是这个方法论的教科书实践：<b>结构字段完整率、关键点覆盖率、Verification\x20出现率、Risk\x20Boundary\x20出现率、幻觉率</b>——每一个都对应一种具体的失败模式。这句话要背下来：“<b>我的指标不是拍脑袋定的，是从模型会犯的五类错误反推出来的。</b>”“““““'},{'c':'pt','s':0x3,'lv':'⭐','q':_0x41a65c(0x151),'a':_0x41a65c(0x216)},{'c':'pt','s':0x3,'lv':'🔥','q':'消融实验怎么设计才有说服力？','a':_0x41a65c(0x233)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x41a65c(0x1bd),'a':_0x41a65c(0x13a)},{'c':'pt','s':0x3,'lv':'💎','q':_0x41a65c(0x146),'a':_0x41a65c(0x114)},{'c':'pt','s':0x3,'lv':'🔥','q':_0x41a65c(0x1ed),'a':_0x41a65c(0x190)},{'c':_0x41a65c(0x136),'s':0x0,'lv':'⭐','q':_0x41a65c(0x2eb),'a':_0x41a65c(0x224)},{'c':_0x41a65c(0x136),'s':0x0,'lv':'⭐','q':_0x41a65c(0x2d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>固定长度：简单但切断语义。<b>按结构切分</b>（标题/段落/表格感知）是技术文档首选；10-20%\x20overlap\x20缓解边界语义断裂；<b>父子块</b>（小块做检索、取回父块做上下文）兼顾精度与信息完整。中文经验值\x20300-500\x20字/块起步调。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“块太大/太小各有什么问题？”——太大稀释相关性且贵，太小语义不完整；“表格怎么切？”——表头随块携带，或转成\x20Markdown/文本描述再切。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别一上来就上语义切分——贵且收益未必覆盖成本。先用结构切分\x20+\x20评估集验证，效果不好再升级。““““““'},{'c':'app','s':0x1,'lv':'⭐','q':'向量检索的原理与度量选择','a':_0x41a65c(0x2e1)},{'c':_0x41a65c(0x136),'s':0x1,'lv':'🔥','q':_0x41a65c(0x24b),'a':_0x41a65c(0x284)},{'c':_0x41a65c(0x136),'s':0x1,'lv':'⭐','q':_0x41a65c(0x197),'a':_0x41a65c(0x2ae)},{'c':_0x41a65c(0x136),'s':0x2,'lv':'🔥','q':'RAG\x20系统怎么评估？（RAGAS\x20框架）','a':_0x41a65c(0x220)},{'c':_0x41a65c(0x136),'s':0x2,'lv':'⭐','q':'RAG\x20里的幻觉怎么控制？','a':_0x41a65c(0x2c0)},{'c':_0x41a65c(0x136),'s':0x3,'lv':'🔥','q':_0x41a65c(0x2d9),'a':_0x41a65c(0x1e0)},{'c':_0x41a65c(0x136),'s':0x3,'lv':'💎','q':_0x41a65c(0x296),'a':_0x41a65c(0x1a2)},{'c':_0x41a65c(0x136),'s':0x4,'lv':'⭐','q':'Function\x20Calling\x20的原理与坑','a':_0x41a65c(0x29f)},{'c':_0x41a65c(0x136),'s':0x4,'lv':'⭐','q':_0x41a65c(0x16d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>让模型交替输出\x20Thought（推理）→\x20Action（调工具）→\x20Observation（结果）→\x20Thought……直到给出答案。价值：“想”和“做”交织，推理过程显式化，工具结果指导下一步——比直接输出答案可靠，比纯\x20CoT\x20多了与世界交互的能力。本质上\x20<b>ReAct\x20=\x20CoT\x20+\x20工具使用</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“代价？”——多轮调用、延迟高、token\x20贵、可能死循环（必须设\x20max_steps）；“现代框架和它的关系？”——LangGraph\x20等的\x20agent\x20loop\x20本质都是\x20ReAct\x20的工程化封装。““““““'},{'c':_0x41a65c(0x136),'s':0x4,'lv':'🔥','q':_0x41a65c(0x21d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>ReAct\x20边想边做：灵活，但容易短视、走偏、步数膨胀。Plan-and-Execute\x20先一次性生成完整计划再逐步执行、必要时\x20replan：全局性强、可控，但计划可能因环境变化失效。复杂任务用分层：高层\x20plan\x20+\x20步内\x20ReAct。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“你的\x20NL2SQL\x20是哪种？”——预设\x20pipeline（意图识别→任务分解→Schema\x20Linking→SQL\x20生成→执行修正），属于固定流程。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别为炫技上自主\x20agent：<b>流程确定性高的任务，固定\x20pipeline\x20的可靠性远高于自由\x20ReAct</b>——“能固定流程就固定流程”这句话要在面试里说出来。““““““'},{'c':'app','s':0x4,'lv':'🔥','q':_0x41a65c(0x22c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>多\x20Agent</b>：把复杂任务拆给专员（规划/检索/执行/校验），编排方式有主管-工人、对等协作等。价值在分工与上下文隔离；代价是协调成本和错误传播——<b>能单\x20agent\x20解决就别拆</b>。<b>MCP（Model\x20Context\x20Protocol）</b>：Anthropic\x20推的工具/数据源接入标准协议，类比“AI\x20应用的\x20USB-C”——server\x20暴露工具与资源，client\x20统一调用，把\x20M\x20个应用接\x20N\x20个工具的\x20M×N\x20问题变成\x20M+N。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“MCP\x20标准化了什么？”——工具发现、参数\x20schema、传输协议；“和\x20Function\x20Calling\x20的关系？”——FC\x20是模型输出调用的能力，MCP\x20是工具侧接入的标准，互补。““““““'},{'c':'app','s':0x5,'lv':'🔥','q':_0x41a65c(0x22e),'a':_0x41a65c(0x167)},{'c':_0x41a65c(0x136),'s':0x5,'lv':'💎','q':_0x41a65c(0x2b9),'a':_0x41a65c(0x118)},{'c':_0x41a65c(0x136),'s':0x6,'lv':'⭐','q':_0x41a65c(0x106),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>手段从软到硬：①\x20prompt\x20给\x20schema\x20+\x20few-shot\x20示例\x20②\x20JSON\x20mode\x20/\x20response_format（厂商\x20API）③\x20<b>约束解码</b>（outlines/xgrammar：采样时直接屏蔽不合法\x20token，100%\x20合规）④\x20后处理：修复库\x20+\x20schema\x20校验\x20+\x20带错误信息的重试。工程组合：<b>约束解码兜底\x20+\x20校验重试双保险</b>。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“约束解码会影响生成质量吗？”——屏蔽\x20token\x20会轻微改变采样分布，实务上利远大于弊。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Function\x20Calling\x20参数生成、NL2SQL\x20的中间产物（意图、schema\x20选择结果）都靠这套保障。““““““'},{'c':'app','s':0x6,'lv':'⭐','q':_0x41a65c(0x1f0),'a':_0x41a65c(0x8f)},{'c':_0x41a65c(0x136),'s':0x6,'lv':'🔥','q':_0x41a65c(0xfd),'a':_0x41a65c(0x10a)},{'c':_0x41a65c(0x136),'s':0x6,'lv':'💎','q':_0x41a65c(0xbb),'a':_0x41a65c(0xd0)},{'c':_0x41a65c(0x136),'s':0x7,'lv':'⭐','q':'NL2SQL\x20的五大难点与解法（主场第一题）','a':_0x41a65c(0xac)},{'c':'app','s':0x7,'lv':'🔥','q':_0x41a65c(0x2fd),'a':_0x41a65c(0x271)},{'c':_0x41a65c(0x136),'s':0x7,'lv':'⭐','q':_0x41a65c(0x2ba),'a':_0x41a65c(0x25a)},{'c':_0x41a65c(0x136),'s':0x7,'lv':'🔥','q':_0x41a65c(0xe1),'a':_0x41a65c(0xc1)},{'c':_0x41a65c(0x136),'s':0x7,'lv':'🔥','q':'多轮\x20NL2SQL\x20与权限控制','a':_0x41a65c(0x2f9)},{'c':_0x41a65c(0x28b),'s':0x0,'lv':'⭐','q':_0x41a65c(0x192),'a':_0x41a65c(0x11b)},{'c':_0x41a65c(0x28b),'s':0x0,'lv':'⭐','q':_0x41a65c(0x2af),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型：单线程内由<b>事件循环</b>调度多个协程，遇到\x20await\x20就让出控制权、IO\x20完成后被唤醒——一个线程可承载上万并发连接。三个概念：coroutine（协程对象，不await\x20不执行）、Task（被调度的执行单元）、事件循环。<b>最大的坑</b>：在async\x20函数里调用<b>阻塞</b>操作（time.sleep、同步\x20requests、重CPU\x20计算）会卡死整个事件循环——必须换asyncio.sleep\x20/\x20httpx\x20/\x20aiohttp，或用\x20run_in_executor\x20丢到线程池。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“怎么并发跑多个请求？”——asyncio.gather或\x20create_task；“怎么控制并发数？”——Semaphore\x20限流，防打爆下游模型服务。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>Agent\x20里并发调多个工具、批量调LLM\x20都靠这套——能讲出Semaphore\x20限流就显工程经验。“““'},{'c':_0x41a65c(0x28b),'s':0x0,'lv':'🔥','q':_0x41a65c(0x1cf),'a':_0x41a65c(0x2da)},{'c':_0x41a65c(0x28b),'s':0x1,'lv':'⭐','q':_0x41a65c(0x92),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>B+\x20树索引</b>：有序多路搜索树，叶子节点串成链表\x20→\x20等值和范围查询都快。<b>失效场景（高频考点）</b>：函数包裹索引列、隐式类型转换、前导模糊\x20LIKE\x20\x27%x\x27、联合索引不满足<b>最左前缀</b>。优化路径：慢查询日志定位\x20→\x20<b>EXPLAIN\x20看执行计划</b>（是否全表扫描、走了哪个索引、扫描行数）→\x20加合适索引或改写\x20SQL\x20→\x20覆盖索引避免回表\x20→\x20大表分页用游标（WHERE\x20id\x20>\x20?）而非大\x20OFFSET。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“联合索引顺序怎么定？”——高选择性/常用于等值的列放前面，遵循最左前缀；“为什么不给每列都建索引？”——写入变慢、占空间、优化器可能选错索引。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>你的\x20NL2SQL\x20生成的\x20SQL\x20要在\x2090\x20万行真实数据上跑——<b>“我会检查生成\x20SQL\x20的执行计划，避免全表扫描和笛卡尔积”</b>，这句话把SQL\x20功底和项目连起来。“““'},{'c':_0x41a65c(0x28b),'s':0x1,'lv':'🔥','q':_0x41a65c(0xb0),'a':_0x41a65c(0x2e7)},{'c':_0x41a65c(0x28b),'s':0x1,'lv':'🔥','q':_0x41a65c(0x26e),'a':_0x41a65c(0x1c5)},{'c':_0x41a65c(0x28b),'s':0x2,'lv':'⭐','q':'HTTP\x20/\x20RESTful：状态码、幂等与流式响应','a':_0x41a65c(0x25b)},{'c':_0x41a65c(0x28b),'s':0x2,'lv':'🔥','q':_0x41a65c(0x1b2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>场景：网络重试、用户重复提交、消息重复消费——同一请求会到达多次。实现四招：①\x20<b>幂等键</b>（客户端生成\x20request_id，服务端用去重表或Redis\x20SETNX）②\x20数据库唯一约束兜底\x20③\x20<b>状态机校验</b>（只允许合法状态流转）④\x20乐观锁（version\x20字段）。重试要配：指数退避\x20+\x20抖动（jitter）+\x20最大次数\x20+\x20<b>只重试可重试错误</b>（5xx/超时，不重试\x204xx）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“LLM\x20场景哪里用到？”——Agent\x20工具调用失败重试、流式响应断线重连、批量任务恢复；<b>Agent\x20调用有副作用的工具（写库、发消息）时，幂等键是必需品</b>，这是玩具\x20demo\x20和生产系统的分界。“““'},{'c':'eng','s':0x3,'lv':'🔥','q':_0x41a65c(0x2b3),'a':_0x41a65c(0x2c2)},{'c':_0x41a65c(0x28b),'s':0x3,'lv':'🔥','q':_0x41a65c(0xf3),'a':_0x41a65c(0x208)},{'c':_0x41a65c(0x28b),'s':0x3,'lv':'🔥','q':_0x41a65c(0x28e),'a':_0x41a65c(0x258)},{'c':_0x41a65c(0x28b),'s':0x4,'lv':'⭐','q':_0x41a65c(0x161),'a':_0x41a65c(0x218)},{'c':_0x41a65c(0x28b),'s':0x4,'lv':'🔥','q':_0x41a65c(0x2ca),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三步：①\x20<b>算\x20token\x20量</b>——日活×\x20人均会话数\x20×\x20每会话平均输入/输出\x20token\x20②\x20<b>算算力</b>——推理吞吐按“单卡每秒可产出\x20tokens”估（受模型大小、batch、量化影响），除出需要多少卡；注意\x20<b>prefill\x20和\x20decode\x20分开算</b>（长输入吃\x20prefill\x20算力，长输出吃\x20decode\x20时间）③\x20<b>算显存</b>——权重（1B≈2GB）+\x20KV\x20Cache（每token\x20每层\x202×d×精度，乘以并发数和上下文长度）+\x20余量。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“并发上不去为什么？”——多半是\x20KV\x20Cache\x20占满导致可并发序列数受限，用\x20GQA\x20模型\x20/\x20KV\x20量化\x20/\x20限制上下文长度解决；“怎么保P99\x20延迟？”——限制单请求最大生成长度\x20+\x20请求队列\x20+\x20优先级调度。<br><span\x20class=\x27lb\x27>⚓\x20简历钩子</span><br>能把这套算术和第二/三章的显存账本串起来讲，是应用岗里少见的<b>系统性思维</b>。“““'},{'c':'eng','s':0x4,'lv':'🔥','q':'服务性能：QPS、延迟指标与瓶颈定位','a':_0x41a65c(0x24e)},{'c':'eng','s':0x4,'lv':'💎','q':_0x41a65c(0x2a0),'a':_0x41a65c(0x184)},{'c':_0x41a65c(0x28b),'s':0x4,'lv':'💎','q':_0x41a65c(0x206),'a':_0x41a65c(0x144)},{'c':'story','s':0x0,'lv':'⭐','q':_0x41a65c(0x2e3),'a':_0x41a65c(0x18c)},{'c':_0x41a65c(0x193),'s':0x0,'lv':'⭐','q':_0x41a65c(0x1d6),'a':'<span\x20class=\x27lb\x27>◈\x20四段式</span><br>①\x20<b>身份与定位</b>（15\x20秒）：学校专业\x20+\x20一句话技术定位。<br>②\x20<b>项目主线</b>（80\x20秒）：NL2SQL\x20项目——痛点是什么（工业数据库\x20schema\x20复杂、字段别名多、业务口径不统一，业务人员不会写\x20SQL）、你怎么做（多阶段\x20Agent\x20流程\x20+\x20RAG\x20注入口径\x20+\x20执行反馈修正）、结果（可执行率\x2098%、人工校验正确率\x2096%）。<br>③\x20<b>研究主线</b>（50\x20秒）：OKC-SFT\x20论文——问题（大模型处置建议结构不稳、缺验证闭环）、方法（六阶段知识链监督微调\x20+\x20QLoRA）、结果（结构完整率\x2099.8%、幻觉率\x2034.4%→15.6%）+\x20三组对照实验。<br>④\x20<b>当前与意向</b>（25\x20秒）：腾讯LLM\x20驱动游戏算法实习\x20+\x20求职方向。<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>每段都遵循<b>问题\x20→\x20方法\x20→\x20结果</b>；不要平铺技术栈，要讲“为什么这么做”。<br><span\x20class=\x27lb\x27>⚠陷阱</span><br>超过\x203\x20分钟会被打断——练到能<b>掐着表讲完</b>，练5遍以上。“'},{'c':_0x41a65c(0x193),'s':0x1,'lv':'⭐','q':_0x41a65c(0x2e2),'a':_0x41a65c(0xf4)},{'c':_0x41a65c(0x193),'s':0x1,'lv':'⭐','q':_0x41a65c(0x1f4),'a':_0x41a65c(0x2cd)},{'c':'story','s':0x2,'lv':'⭐','q':'NL2SQL\x20项目标准讲述稿（3\x20分钟版）','a':_0x41a65c(0x24f)},{'c':_0x41a65c(0x193),'s':0x2,'lv':'🔥','q':_0x41a65c(0x1d3),'a':'<span\x20class=\x27lb\x27>◈\x20逐条自检，答不出就去补</span><br>①\x2098%/96%\x20的测试集多大、谁判、怎么判？<br>②\x20307\x20个字段怎么进prompt\x20的？（schema\x20裁剪策略）<br>③\x20字段别名库怎么建的、多少条？<br>④\x20多轮对话的指代怎么消解的？<br>⑤\x20执行反馈修正最多重试几轮、会不会越改越错？<br>⑥\x20复杂多表\x20join\x20的成功率和单表比差多少？<br>⑦\x20为什么选\x20Qwen、哪个尺寸、为什么这个尺寸？<br>⑧\x20海光\x20DCU\x20上踩了什么坑？<br>⑨\x20安全怎么做的？（只读、权限、注入防护）<br>⑩\x20如果重做，你会改哪三件事？<br><span\x20class=\x27lb\x27>➤\x20要点</span><br><b>这十个问题就是你的复习清单</b>。每个都写下3-5\x20句的答案并练到能顺畅说出——项目面80%\x20的问题都在这里面。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>第\x20⑩\x20题最能拉分也最容易翻车：<b>准备三个具体的改进点</b>（自动化评测、混合检索、RL\x20优化），别答“没什么好改的”。“'},{'c':'story','s':0x3,'lv':'⭐','q':_0x41a65c(0x8e),'a':_0x41a65c(0x1ea)},{'c':_0x41a65c(0x193),'s':0x3,'lv':'🔥','q':_0x41a65c(0xd2),'a':_0x41a65c(0x110)},{'c':_0x41a65c(0x193),'s':0x4,'lv':'⭐','q':_0x41a65c(0x13f),'a':'<span\x20class=\x27lb\x27>◈讲述框架（按这个填）</span><br>①\x20<b>一句话定位</b>：“我在腾讯\x20___\x20做LLM\x20驱动的游戏算法研究，具体方向是\x20___。”<br>②\x20<b>业务问题</b>：这个方向要解决游戏里的什么问题？（NPC\x20智能、剧情生成、玩家陪伴、内容生产效率……）<br>③\x20<b>你的工作</b>：你具体负责什么？技术栈？<br>④\x20<b>产出</b>：做出了什么（demo\x20/\x20模块\x20/\x20实验结论\x20/\x20数据），<b>尽量量化</b>。<br>⑤\x20<b>认知收获</b>：在大厂环境学到什么（工程规范、评测流程、协作方式）。<br><span\x20class=\x27lb\x27>➤\x20待你补充的信息（填完我就能写成完整讲述稿）</span><br>·所在\x20BG\x20/\x20团队方向<br>·\x20具体做的任务和技术栈<br>·\x20到\x208\x20月底能拿出的可量化成果<br>·\x20有没有接触内部模型/平台（可讲的范围内）<br><span\x20class=\x27lb\x27>⚠\x20保密提醒</span><br>内部数据、未公开模型细节、业务指标<b>不能讲</b>。讲述时聚焦<b>方法与你的思考过程</b>，遇到敏感处主动说“这部分涉及内部信息，我讲方法层面”——这个处理本身就是职业素养的体现。“'},{'c':_0x41a65c(0x193),'s':0x4,'lv':'⭐','q':_0x41a65c(0x1f5),'a':'<span\x20class=\x27lb\x27>◈\x20标准答法（背下来）</span><br>“<b>我做的正是\x20LLM\x20驱动的游戏智能体，这不是两个方向，是同一个方向的两个场景。</b>游戏\x20AI\x20里的\x20RL\x20和\x20LLM\x20后训练共享同一套框架——奖励设计、探索与利用的权衡、策略优化。举个具体的连接：我在游戏场景里理解的\x20reward\x20hacking，和\x20RLHF\x20里模型讨好奖励模型的表面特征，是完全同源的问题；游戏里靠约束奖励函数和看轨迹回放解决，RLHF\x20里靠\x20KL\x20惩罚和监控输出长度解决。<b>这段实习让我从训练侧补上了我此前偏应用侧的视角。</b>”<br><span\x20class=\x27lb\x27>➤\x20要点</span><br>核心是<b>主动建立连接，而不是解释跑偏</b>：把“游戏”这个场景词降级，把“LLM\x20驱动\x20+\x20RL”这个方法词升级。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>千万别说“我是被调剂过去的”或“我其实想做\x20LLM\x20但没拿到”——一句话让整段经历变成减分项。“'},{'c':'story','s':0x5,'lv':'⭐','q':_0x41a65c(0x111),'a':'<span\x20class=\x27lb\x27>◈\x20五个高频问题的应答骨架</span><br>①\x20<b>你最大的缺点</b>：说一个<b>真实但不致命</b>的\x20+\x20你的改进动作。可用：“我早期倾向于把系统做全（前后端都自己上），导致核心链路打磨时间被摊薄；现在我会先明确什么是核心指标，再决定资源分配。”<br>②\x20<b>遇到的最大挑战</b>：讲技术难点（见\x208.2.2），不讲“时间紧”。<br>③\x20<b>团队冲突怎么处理</b>：<b>用你的学生工作经历</b>——这是它唯一的高价值用途，讲一次跨团队协调的具体事例\x20+\x20你的处理逻辑。<br>④\x20<b>为什么选我们公司/这个岗位</b>：必须做功课——具体到<b>业务线、产品、技术方向</b>，别说“贵公司平台好”。<br>⑤\x20<b>职业规划</b>：1年成为能独立交付\x20LLM\x20应用的工程师，3\x20年在某个方向（Agent\x20可靠性\x20/\x20评测体系）有深度积累。<b>别说想做管理。</b><br><span\x20class=\x27lb\x27>➤\x20要点</span><br>行为面的评分标准是<b>真诚\x20+\x20结构清晰\x20+\x20有反思</b>，不是回答漂亮。“'},{'c':_0x41a65c(0x193),'s':0x5,'lv':'🔥','q':_0x41a65c(0xee),'a':_0x41a65c(0x15e)},{'c':_0x41a65c(0x193),'s':0x5,'lv':'🔥','q':_0x41a65c(0x88),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>每场面试结束后<b>立刻</b>（记忆最清楚时）记四件事：①<b>被问到的所有问题</b>（尽量原话）②\x20<b>答得不好的题</b>及当时的卡点③\x20面试官追问的<b>方向和深度</b>（反映团队真实关注点）④\x20我的改进动作。<br>然后：把答不好的题<b>当天补进手册的对应章节</b>，标为“还不熟”，进入闪卡循环。<br><span\x20class=\x27lb\x27>➤\x20为什么这件事回报最高</b><br>秋招是<b>多轮迭代</b>的过程：同一个问题会在不同公司反复出现。<b>第一次答崩不丢人，第二次还崩才是浪费。</b>面经复盘是把单次失败转化为全局提升的唯一机制。<br><span\x20class=\x27lb\x27>⚓\x20配套工具</span><br>用附录\x20C\x20的面经复盘模板，每场一份，存在同一个文件夹里。三场之后你会看到明显的规律。“'},{'c':_0x41a65c(0x2c7),'s':0x0,'lv':'⭐','q':'8\x20周作战日历
