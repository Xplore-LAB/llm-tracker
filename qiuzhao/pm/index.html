<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

ections':[_0x55192d(0x223),_0x55192d(0x1f9),_0x55192d(0x1ba)]},{'id':_0x55192d(0x22a),'icon':_0x55192d(0x284),'num':'附','title':'附录：作战工具','sub':_0x55192d(0x26b),'sections':[_0x55192d(0x1fc),_0x55192d(0x1d4),_0x55192d(0x211),_0x55192d(0x1af)]}],CARDS=[{'c':_0x55192d(0x274),'s':0x0,'lv':'⭐','q':_0x55192d(0x220),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>一句话：<b>发现值得解决的问题，定义解决方案，并推动它落地</b>。拆开是四件事：①\x20找问题（用户洞察、数据发现、业务目标拆解）②\x20定义方案（写清做什么、不做什么、做到什么程度算好）③\x20推动（拉齐开发、设计、测试、法务，拿到资源与排期）④\x20验收与迭代（对照目标复盘，决定下一步）。<b>写文档只是载体，拿结果才是职责。</b><br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和项目经理的区别？”——产品经理对「做什么和为什么」负责，项目经理对「什么时候交付」负责，小团队常一人兼任；“最大的价值点在哪？”——在信息最不对称的位置做决策：连接用户、业务和技术三方。<br><span\x20class=\x27lb\x27>⚠\x20转岗者提醒</span><br>算法岗习惯「给定问题求解」，PM\x20的常态是「问题本身要自己找」。面试时要展示你主动定义过问题的经历。'},{'c':_0x55192d(0x274),'s':0x0,'lv':'⭐','q':_0x55192d(0x1ab),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>行业通用的五维模型：①\x20<b>用户洞察</b>（能否还原真实场景与动机）②\x20<b>商业敏感</b>（能否算清成本收益）③\x20<b>产品设计</b>（方案的结构化表达能力）④\x20<b>项目推动</b>（跨角色拿到结果）⑤\x20<b>数据能力</b>（用数据验证判断）。各厂叫法不同，底层一致。<br><span\x20class=\x27lb\x27>➤\x20面试映射</span><br>每场\x20PM\x20面试的题基本都能归到这五维：案例分析考洞察与商业，产品\x20sense\x20考设计，简历深挖考推动，数据题考实验素养。<br><span\x20class=\x27lb\x27>⚓\x20你的不对称优势</span><br>算法背景天然点亮第五维，AI\x20岗位还会加分第二维（token\x20成本、算力成本你都真算过）。短板通常在第一维和第三维，准备重心放这里。'},{'c':_0x55192d(0x274),'s':0x0,'lv':'🔥','q':_0x55192d(0x21a),'a':_0x55192d(0x1ee)},{'c':_0x55192d(0x274),'s':0x0,'lv':'🔥','q':'技术背景做\x20PM\x20的优势与常见失败模式','a':_0x55192d(0x275)},{'c':'basics','s':0x1,'lv':'⭐','q':_0x55192d(0x241),'a':_0x55192d(0x224)},{'c':_0x55192d(0x274),'s':0x1,'lv':'🔥','q':_0x55192d(0x1ea),'a':_0x55192d(0x24c)},{'c':'basics','s':0x1,'lv':'🔥','q':_0x55192d(0x280),'a':_0x55192d(0x1dc)},{'c':_0x55192d(0x274),'s':0x2,'lv':'🔥','q':_0x55192d(0x278),'a':_0x55192d(0x1a2)},{'c':_0x55192d(0x274),'s':0x2,'lv':'💎','q':_0x55192d(0x252),'a':_0x55192d(0x26e)},{'c':_0x55192d(0x221),'s':0x0,'lv':'⭐','q':_0x55192d(0x20d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>模型产品\x20PM</b>：面向模型本身（训练平台、模型\x20API、开源生态），要懂训练流程与评测体系，客户是开发者\x20②\x20<b>AI\x20应用\x20PM</b>：把模型能力嵌入具体场景（Copilot、智能客服、AI\x20助手），要懂能力边界与场景匹配\x20③\x20<b>工具链\x20PM</b>：做标注平台、评测平台、Agent\x20编排工具，要懂算法工作流\x20④\x20<b>行业方案\x20PM</b>：把\x20AI\x20卖给金融、医疗等行业，要懂行业\x20Know-how\x20与合规。<br><span\x20class=\x27lb\x27>⚓\x20转岗建议</span><br>你的\x20NL2SQL\x20Agent\x20与微调经历对\x20①③\x20是直接对口证据；对\x20②\x20需要补场景叙事。投递时同一份经历可以针对不同形态改写强调点。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试前务必搞清目标团队属于哪种形态，「做\x20AI\x20产品」的回答会显得没做功课。'},{'c':'aipm','s':0x0,'lv':'⭐','q':'大模型产品的五种形态：Chat\x20/\x20Copilot\x20/\x20Agent\x20/\x20嵌入增强\x20/\x20API','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Chat</b>：对话即产品（通用助手），竞争在模型能力与生态\x20②\x20<b>Copilot</b>：嵌入既有工作流辅助人（代码补全、写作助手），用户保有最终决定权，容错高\x20③\x20<b>Agent</b>：模型自主规划执行多步任务，体验上限高但可靠性挑战大\x20④\x20<b>嵌入式增强</b>：用户感知不到\x20AI\x20的存在（搜索排序、输入法预测），最稳但最不性感\x20⑤\x20<b>API/基础设施</b>：卖给开发者，拼稳定性、价格与文档。<br><span\x20class=\x27lb\x27>➤\x20产品设计含义</span><br>形态决定交互与兜底策略：Copilot\x20可以「建议\x20+\x20一键采纳」，Agent\x20必须「过程可见\x20+\x20可中断\x20+\x20事后可回滚」。<br><span\x20class=\x27lb\x27>⚓\x20面试钩子</span><br>用这个框架分析任何\x20AI\x20产品，能瞬间展示结构化思维。'},{'c':_0x55192d(0x221),'s':0x0,'lv':'🔥','q':'AI\x20PM\x20与传统\x20PM\x20最大的三点差异','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>输出是概率的</b>：同一输入不保证同一输出，需求文档要定义「合格率」而非「正确」，验收方式从断言变成抽样评测\x20②\x20<b>效果与体验强耦合</b>：延迟、成本、效果三者互相牵制，PM\x20要做三角权衡（更快更便宜往往更笨）③\x20<b>数据闭环即产品</b>：用户使用数据反哺模型迭代，产品架构要为回流设计，反馈通道本身就是功能。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“传统需求评审还适用吗？”——流程适用，文档结构要变：增加「能力边界声明」「badcase\x20处理策略」「评测标准」三个新章节。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>这三点差异你都在一线踩过：概率输出（评测集思维）、三角权衡（LoRA\x20vs\x20全量的成本账）、数据闭环（OKC-SFT\x20的样本构造），全部是现成案例。'},{'c':_0x55192d(0x221),'s':0x1,'lv':'⭐','q':_0x55192d(0x23f),'a':_0x55192d(0x21e)},{'c':'aipm','s':0x1,'lv':'⭐','q':_0x55192d(0x26a),'a':_0x55192d(0x1b1)},{'c':_0x55192d(0x221),'s':0x1,'lv':'🔥','q':_0x55192d(0x272),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>评测集对\x20AI\x20PM\x20的意义等同于需求文档对传统\x20PM：它定义了「什么算好」。构成要素：①\x20<b>场景覆盖</b>：按真实使用分布抽样，别只放\x20easy\x20case\x20②\x20<b>标注标准</b>：什么算对、什么算部分对，写裁决规则\x20③\x20<b>分层基线</b>：区分必过的核心集与可宽容的进阶集\x20④\x20<b>更新机制</b>：线上\x20badcase\x20定期回流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评测集多大合适？”——看场景方差，小场景几十条也能用，关键是分布准确；“谁维护？”——PM\x20定标准与优先级，算法执行，标注外包但抽检。<br><span\x20class=\x27lb\x27>⚓\x20你做过</span><br>你的\x2061\x20条测试集就是小而准的样板。面试讲「我怎么决定测试集覆盖哪些变体」，比讲微调细节更能打动\x20PM\x20面试官。'},{'c':_0x55192d(0x221),'s':0x2,'lv':'⭐','q':'Token\x20成本的产品账：一次调用多少钱','a':_0x55192d(0x1ad)},{'c':_0x55192d(0x221),'s':0x2,'lv':'🔥','q':_0x55192d(0x203),'a':_0x55192d(0x209)},{'c':'aipm','s':0x2,'lv':'🔥','q':_0x55192d(0x1c3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>长上下文打开三种产品可能：多轮记忆（整个会话历史可引用）、长文档理解（整本书、整个代码库）、少样本示例（few-shot\x20放进\x20prompt）。但窗口大≠免费：①\x20输入成本随长度线性涨\x20②\x20超长上下文的<b>中间遗忘</b>现象（关键信息放中间容易被忽略）③\x20延迟随长度增加。<br><span\x20class=\x27lb\x27>➤\x20产品策略</span><br>记忆分层：近几轮全文保留，更早的摘要压缩，关键事实抽取存档；文档场景做检索分段喂入而非整本塞入。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别说「上下文越长越好」。主动提\x20lost\x20in\x20the\x20middle\x20现象与成本权衡，是懂行的标志。'},{'c':_0x55192d(0x221),'s':0x3,'lv':'⭐','q':_0x55192d(0x1c2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>飞轮链条：<b>更多用户\x20→\x20更多真实使用数据与\x20badcase\x20→\x20更准的评测与训练信号\x20→\x20模型/策略更贴合场景\x20→\x20体验更好\x20→\x20更多用户</b>。PM\x20的任务是给每一环装上产品机制：反馈入口（点赞点踩、纠错编辑）、回流管线（badcase\x20自动归集去重）、闭环验证（迭代后先在历史\x20badcase\x20上回归）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冷启动没数据怎么办？”——用公开数据或合成数据先建基线评测，再靠种子用户积累；“反馈数据脏怎么办？”——点赞点踩噪音大，要配权重（编辑行为比点赞信号强）。<br><span\x20class=\x27lb\x27>⚓\x20你的叙事</span><br>OKC-SFT\x20本质是人工构造数据启动飞轮的案例：没有用户数据时，用领域知识造出\x20611\x20条高质量样本照样转起来。'},{'c':_0x55192d(0x221),'s':0x3,'lv':'🔥','q':_0x55192d(0x22e),'a':_0x55192d(0x20e)},{'c':_0x55192d(0x248),'s':0x0,'lv':'⭐','q':_0x55192d(0x235),'a':_0x55192d(0x1ec)},{'c':_0x55192d(0x248),'s':0x0,'lv':'🔥','q':_0x55192d(0x1ff),'a':_0x55192d(0x21b)},{'c':'method','s':0x0,'lv':'🔥','q':_0x55192d(0x26f),'a':_0x55192d(0x276)},{'c':_0x55192d(0x248),'s':0x1,'lv':'⭐','q':_0x55192d(0x1ed),'a':_0x55192d(0x249)},{'c':_0x55192d(0x248),'s':0x1,'lv':'🔥','q':_0x55192d(0x281),'a':_0x55192d(0x1bb)},{'c':_0x55192d(0x248),'s':0x2,'lv':'⭐','q':_0x55192d(0x259),'a':_0x55192d(0x1cd)},{'c':'method','s':0x2,'lv':'🔥','q':'MVP\x20思维：怎么裁出最小可验证版本','a':_0x55192d(0x1e4)},{'c':_0x55192d(0x248),'s':0x3,'lv':'⭐','q':_0x55192d(0x268),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>北极星指标是<b>唯一</b>最能代表「用户获得核心价值」的量：搜索产品是「成功搜索次数」，IM\x20是「发送消息的用户数」，工具是「完成任务的次数」。选型三标准：反映用户价值（非收入）、可操作（团队能影响）、先导性（预示长期成功）。体系分层：北极星\x20→\x20驱动指标拆解（按漏斗或按等式拆成可影响因子）→\x20护栏指标（防作恶：质量、留存、投诉率）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不能用\x20DAU\x20当北极星？”——DAU\x20可被补贴和推送吹起来，不必然代表价值交付，易诱导短视动作。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20产品特有</span><br>AI\x20产品要加一对专用护栏：<b>回答合格率</b>（质量下限）与<b>单次服务成本</b>（商业下限），北极星涨而护栏崩，等于在烧钱买增长。'},{'c':_0x55192d(0x248),'s':0x3,'lv':'🔥','q':_0x55192d(0x23b),'a':_0x55192d(0x1aa)},{'c':_0x55192d(0x248),'s':0x3,'lv':'🔥','q':_0x55192d(0x23c),'a':_0x55192d(0x208)},{'c':_0x55192d(0x286),'s':0x0,'lv':'⭐','q':_0x55192d(0x1c1),'a':_0x55192d(0x1cc)},{'c':_0x55192d(0x286),'s':0x0,'lv':'🔥','q':_0x55192d(0x1ce),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>离线评测</b>：固定评测集跑分，便宜快速、可复现，用于版本准入门槛（回归测试思维）。<b>在线评估</b>：A/B\x20实验看真实用户行为，贵但真，用于最终裁决。纪律：离线涨在线跌的情况很常见（评测集分布偏了），所以两者必须串联：离线过门槛\x20→\x20小流量在线\x20→\x20全量。第三件工具<b>人工抽检</b>：每周抽样线上真实回答人工打分，弥补评测集漂移。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“离线在线不一致怎么排查？”——查评测集与真实分布的偏差（用户问的和你测的不是一个分布）、查指标定义差异、查新奇效应。<br><span\x20class=\x27lb\x27>⚓\x20算法背景</span><br>这套方法论你熟到骨髓（训练集/验证集/线上），面试只需换成产品词汇。这是转岗面试里你最稳的阵地。'},{'c':_0x55192d(0x286),'s':0x0,'lv':'🔥','q':_0x55192d(0x28c),'a':_0x55192d(0x240)},{'c':_0x55192d(0x286),'s':0x0,'lv':'🔥','q':_0x55192d(0x1d9),'a':_0x55192d(0x225)},{'c':_0x55192d(0x286),'s':0x1,'lv':'⭐','q':_0x55192d(0x1d3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>订阅制</b>（月费解锁额度）：面向\x20C\x20端，收入可预测，核心矛盾是重度用户亏钱，要设计公平使用政策\x20②\x20<b>按量计费\x20/\x20API</b>：面向\x20B\x20端开发者，透明但用户成本焦虑大，常用阶梯价与资源包缓解\x20③\x20<b>增值分层</b>（免费基础\x20+\x20付费高级模型）：转化漏斗逻辑，免费档当获客渠道\x20④\x20<b>效果分成</b>（按完成任务计费，如按成交）：对齐最深但计量最难。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“定价怎么锚定？”——锚定用户替代方案成本（人工价\x20×\x20折扣），而非自己的成本加成；成本只决定价格下限。<br><span\x20class=\x27lb\x27>⚓\x20趋势认知</span><br>模型推理成本持续下探，价格战下「按\x20token\x20计费」利润被压薄，向工作流与结果收费迁移是行业共识方向，面试谈定价必提。'},{'c':_0x55192d(0x286),'s':0x1,'lv':'🔥','q':_0x55192d(0x21d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>模型本身很难是护城河（能力趋同、开源追赶），可守的是四层：①\x20<b>场景数据闭环</b>：使用数据回流让产品在特定场景越用越准，通用模型追不上\x20②\x20<b>工作流嵌入</b>：深度嵌入用户流程（IDE\x20插件、办公套件），迁移成本高\x20③\x20<b>独占数据与知识资产</b>：版权内容、专业知识库、领域标注积累\x20④\x20<b>分发与生态</b>：预装、应用商店位、开发者生态。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>「套壳产品有护城河吗」——壳本身没有，壳里沉淀的数据与工作流可能有。判断标准：用户离开时损失什么。<br><span\x20class=\x27lb\x27>⚓\x20你的领域优势</span><br>聊护城河时把「数据飞轮」这一环展开（你真构造过领域数据集），比背概念的候选人深一层。'},{'c':_0x55192d(0x286),'s':0x2,'lv':'⭐','q':_0x55192d(0x1da),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六步框架：①\x20<b>澄清目标</b>（问清考核的是产品哪个维度：增长/体验/商业化）②\x20<b>定义用户与场景</b>（分层，别「所有用户」）③\x20<b>拆解问题</b>（漏斗或供需两端，选一个\x20MECE\x20拆法）④\x20<b>提出方案</b>（2~3\x20个，标注成本与风险）⑤\x20<b>定指标与实验</b>（怎么验证哪个方案好）⑥\x20<b>权衡与结论</b>（资源有限先做哪个，为什么）。<br><span\x20class=\x27lb\x27>➤\x20高分细节</span><br>全程<b>边说边和面试官对齐</b>：每走一步问「这个方向可以吗」。案例分析考沟通协作多于考答案。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>两个死法：上来就答题不澄清（需求理解失败）；框架背得太顺但拆解空洞（每层没有真洞见）。框架是拐杖，洞见才是腿。'},{'c':_0x55192d(0x286),'s':0x2,'lv':'🔥','q':'地图与出行产品的分析框架（LBS\x20专项）','a':_0x55192d(0x20b)},{'c':'eval','s':0x2,'lv':'💎','q':_0x55192d(0x27b),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（背这个排查流）</span><br>①\x20<b>先验伪</b>：技术故障？埋点变更？统计口径改了？大盘同时跌（对照组也跌）说明是外因\x20②\x20<b>定位层级</b>：哪个环节掉的（曝光→点击→使用→完成→再来），漏斗定位法\x20③\x20<b>归因分簇</b>：新用户掉还是老用户掉、哪个场景掉、哪类输入掉（AI\x20特有：难例占比升了？流量结构变了？）④\x20<b>假说验证</b>：拉\x20badcase\x20抽查\x20+\x20分层下钻\x20⑤\x20<b>行动</b>：能回滚先回滚止血，再定向修复。<br><span\x20class=\x27lb\x27>➤\x20展示的素质</span><br>这题考三样：数据排查的秩序感（先验伪再归因）、AI\x20特有意识（输入分布漂移）、止损与修复的分离。<br><span\x20class=\x27lb\x27>⚓\x20你的叙事</span><br>「先验伪」思维你在算法侧天天用（训练没生效先查数据管道）。把它讲成产品语言，就是现成的行为面素材。'},{'c':_0x55192d(0x1dd),'s':0x0,'lv':'⭐','q':'算法转产品的转岗叙事：三段式故事线','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三段式：①\x20<b>触点</b>：实习中你离产品最近的一次观察（例：模型指标涨了但用户不买账，意识到价值交付在产品侧）②\x20<b>验证</b>：你做了什么动作验证自己适合且能干（主动承接需求定义、写方案、推动跨角色协作）③\x20<b>选择</b>：深思熟虑后的方向判断（AI\x20产品最缺懂模型的人，你的技术背景在产品岗位的边际价值更大）。<br><span\x20class=\x27lb\x27>➤\x20高分要领</span><br>动机必须具体到事件，泛泛的「喜欢和人打交道」会被追问击穿；结尾落在「我放弃了什么、想清楚了什么」，展示决策重量。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>别说「算法卷不动了所以转产品」。哪怕属实，它把转岗定义成逃逸而非进攻，叙事能量完全相反。'},{'c':'job','s':0x0,'lv':'⭐','q':_0x55192d(0x283),'a':_0x55192d(0x200)},{'c':_0x55192d(0x1dd),'s':0x0,'lv':'🔥','q':_0x55192d(0x1d6),'a':_0x55192d(0x266)},{'c':_0x55192d(0x1dd),'s':0x1,'lv':'⭐','q':_0x55192d(0x260),'a':_0x55192d(0x270)},{'c':_0x55192d(0x1dd),'s':0x1,'lv':'🔥','q':_0x55192d(0x27e),'a':_0x55192d(0x1db)},{'c':_0x55192d(0x1dd),'s':0x1,'lv':'🔥','q':_0x55192d(0x282),'a':_0x55192d(0x1f1)},{'c':'job','s':0x1,'lv':'🔥','q':'作品集：转岗者最硬的敲门砖怎么准备','a':_0x55192d(0x206)},{'c':_0x55192d(0x1dd),'s':0x1,'lv':'🔥','q':'反问环节：五类问题体现你的层次','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好反问让面试官记住你，按层次排：①\x20<b>业务纵深</b>：「这个产品当前最大的挑战是模型能力还是场景渗透？」（展示技术判断）②\x20<b>团队定位</b>：「PM\x20和算法的分工边界在团队里是怎么划的？」（转岗者必问，答案直接影响你入职体验）③\x20<b>决策机制</b>：「一个典型的功能从想法到上线，周期多长、谁拍板？」④\x20<b>个人成长</b>：「团队里做得最好的\x20PM\x20是什么背景、强在哪？」⑤\x20<b>善意收尾</b>：「今天聊下来您觉得我和这个岗位的差距主要在哪？」（真诚且高风险高回报）。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>不问薪资福利加班（HR\x20面再谈）、不问官网能查到的信息、不问「我表现得怎么样」。'},{'c':_0x55192d(0x1dd),'s':0x2,'lv':'⭐','q':_0x55192d(0x1e5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六维体检：①\x20<b>业务阶段</b>：从\x200\x20到\x201\x20的业务锻炼大但死亡率高，成熟业务学体系但可能只拧螺丝\x20②\x20<b>数据资产</b>：有用户与数据的业务，PM\x20有杠杆；纯汇报型岗位成长慢\x20③\x20<b>汇报线</b>：直属上级是不是做过产品的人，决定你的天花板\x20④\x20<b>PM\x20密度</b>：团队\x20PM\x20越少你越被当核心培养（一个团队只有一个\x20PM\x20时你什么都要干，成长最快）⑤\x20<b>算法耦合度</b>：AI\x20产品岗与算法团队的协作紧密度，决定你的技术背景能否变现\x20⑥\x20<b>可迁移性</b>：这个岗位攒的经验（行业、能力）跳槽时市场认不认。<br><span\x20class=\x27lb\x27>⚓\x20转岗者特别提醒</span><br>第一份产品工作宁选「能给完整闭环经验」的小盘子，不选「只负责写文档」的大盘子。前两年攒的是可复用的方法论。'},{'c':_0x55192d(0x1dd),'s':0x2,'lv':'💎','q':'算法与产品的双轨投递策略','a':_0x55192d(0x228)},{'c':'plan','s':0x0,'lv':'⭐','q':_0x55192d(0x212),'a':'<span\x20class=\x27lb\x27>◈\x20核心文档类</span><br>PRD\x20产品需求文档\x20/\x20MRD\x20市场需求文档\x20/\x20BRD\x20商业需求文档\x20/\x20User\x20Story\x20用户故事\x20/\x20Acceptance\x20Criteria\x20验收标准<br><span\x20class=\x27lb\x27>◈\x20指标与实验类</span><br>North\x20Star\x20Metric\x20北极星指标\x20/\x20DAU·MAU\x20日·月活\x20/\x20Retention\x20留存\x20/\x20Churn\x20流失\x20/\x20Conversion\x20Funnel\x20转化漏斗\x20/\x20LTV\x20用户生命周期价值\x20/\x20CAC\x20获客成本\x20/\x20NPS\x20净推荐值\x20/\x20A/B\x20Test\x20对照实验\x20/\x20Guardrail\x20Metric\x20护栏指标\x20/\x20Novelty\x20Effect\x20新奇效应\x20/\x20Simpson\x27s\x20Paradox\x20辛普森悖论<br><span\x20class=\x27lb\x27>◈\x20市场与商业类</span><br>TAM·SAM·SOM\x20总盘·可服务·可获取市场\x20/\x20PMF\x20产品市场契合\x20/\x20Go-to-Market\x20上市策略\x20/\x20Unit\x20Economics\x20单位经济模型\x20/\x20Moat\x20护城河\x20/\x20Churn\x20Rate\x20流失率\x20/\x20ARPU\x20每用户平均收入<br><span\x20class=\x27lb\x27>◈\x20AI\x20产品类</span><br>TTFT\x20首\x20token\x20延迟\x20/\x20TPOT\x20每\x20token\x20时延\x20/\x20Hallucination\x20幻觉\x20/\x20Grounding\x20依据锚定\x20/\x20Evals\x20评测\x20/\x20Rubric\x20评分标准\x20/\x20LLM-as-judge\x20模型裁判\x20/\x20Guardrail\x20兜底护栏\x20/\x20Red\x20Teaming\x20红队测试\x20/\x20Wizard\x20of\x20Oz\x20绿野仙踪（人肉模拟）<br><span\x20class=\x27lb\x27>➤\x20用法</span><br>面试中文叙述、术语用英文点睛，每个术语都要能一句话解释，只挂名不解释反而露怯。'},{'c':_0x55192d(0x22a),'s':0x1,'lv':'🔥','q':'案例分析模板（面试现场可直接套用）','a':'<span\x20class=\x27lb\x27>◈\x20通用六步（背熟）</span><br>①\x20澄清目标：「这个产品/功能的成功标准是什么？考核增长、体验还是收入？」<br>②\x20用户与场景：「核心用户分\x20X\x20类，最高价值的是…，典型场景是…」<br>③\x20结构化拆解：漏斗（认知→使用→留存→推荐）或供需（用户需求端\x20×\x20产品供给端），二选一并说明理由<br>④\x20方案：每个方案带「预期收益\x20/\x20成本\x20/\x20风险」三标注<br>⑤\x20验证：主指标\x20+\x20护栏指标\x20+\x20实验设计（样本量、周期）<br>⑥\x20结论：「资源有限先做方案一，因为…；方案二排在…之后」<br><span\x20class=\x27lb\x27>➤\x20AI\x20题加一步</span><br>在②③之间插入「能力边界评估」：目标方案对模型能力的要求是什么、当前模型达不达得到、不达得到怎么绕。<br><span\x20class=\x27lb\x27>⚠\x20现场纪律</span><br>每步结束和面试官对齐一次。闷头走完六步零交互，等于把协作面试答成了笔试。'},{'c':_0x55192d(0x22a),'s':0x2,'lv':'🔥','q'
