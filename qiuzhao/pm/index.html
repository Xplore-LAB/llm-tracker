<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

':_0x454256(0x19e),'sections':[_0x454256(0x20f),_0x454256(0x200),_0x454256(0x1df),_0x454256(0x18a)]}],CARDS=[{'c':_0x454256(0x184),'s':0x0,'lv':'⭐','q':'产品经理的核心职责到底是什么？','a':_0x454256(0x148)},{'c':_0x454256(0x184),'s':0x0,'lv':'⭐','q':_0x454256(0x174),'a':_0x454256(0x214)},{'c':'basics','s':0x0,'lv':'🔥','q':_0x454256(0x1d9),'a':_0x454256(0x190)},{'c':_0x454256(0x184),'s':0x0,'lv':'🔥','q':'技术背景做\x20PM\x20的优势与常见失败模式','a':'<span\x20class=\x27lb\x27>◈\x20优势</span><br>①\x20和算法/开发的对话成本几乎为零，能判断工时与可行性\x20②\x20不会被「模型做不到」搪塞，能识破技术免责话术\x20③\x20能设计技术敏感的产品方案（缓存、分级模型、边界处理）④\x20AI\x20团队最缺「懂模型的产品」，你是稀缺供给。<br><span\x20class=\x27lb\x27>⚠\x20三种失败模式</span><br>①\x20<b>越位做架构</b>：给开发指定实现方案，招人反感\x20②\x20<b>用技术指标代替用户价值</b>：把「准确率提升\x203\x20个点」当成果，说不出用户获得了什么\x20③\x20<b>回避模糊性</b>：产品问题常常没有标准答案，习惯刷题思维的人会在开放问题前卡壳。<br><span\x20class=\x27lb\x27>➤\x20面试话术</span><br>被问「技术会不会是包袱」时，正面承认失败模式的存在，再讲你如何刻意练习用户视角。这个答案本身就在展示自省能力。'},{'c':_0x454256(0x184),'s':0x1,'lv':'⭐','q':'一个需求从提出到上线的完整生命周期','a':'<span\x20class=\x27lb\x27>◈\x20核心回答（背下这条主线）</span><br>①\x20<b>发现</b>：用户反馈\x20/\x20数据异动\x20/\x20业务目标拆解\x20②\x20<b>论证</b>：算收益与成本，排优先级（常见框架：价值÷成本、RICE）③\x20<b>立项</b>：讲清背景、目标、衡量指标\x20④\x20<b>PRD</b>：功能详述、边界与异常流、埋点\x20⑤\x20<b>评审</b>：需求评审\x20→\x20技术方案评审\x20→\x20测试用例评审\x20⑥\x20<b>开发跟进</b>：每日同步，变更及时同步文档\x20⑦\x20<b>测试验收</b>：PM\x20按验收标准逐条过\x20⑧\x20<b>灰度发布</b>：小流量观察核心指标\x20⑨\x20<b>全量与复盘</b>：对照立项目标出数据结论。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪个环节最容易出事？”——评审后的<b>变更管理</b>：开发中途改需求不改文档，测试按旧版用例跑，上线即事故。<br><span\x20class=\x27lb\x27>⚓\x20算法背景加分</span><br>AI\x20需求在第⑦⑧环有特殊性：验收面对的是概率性输出，要用评测集和抽样标准代替「对/错」二值验收，后面第四章展开。'},{'c':'basics','s':0x1,'lv':'🔥','q':_0x454256(0x18b),'a':_0x454256(0x143)},{'c':'basics','s':0x1,'lv':'🔥','q':_0x454256(0x179),'a':_0x454256(0x1ac)},{'c':_0x454256(0x184),'s':0x2,'lv':'🔥','q':'没有职权怎么推动跨团队协作？','a':_0x454256(0x1ec)},{'c':'basics','s':0x2,'lv':'💎','q':_0x454256(0x1ba),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三条纪律：①\x20<b>带着方案汇报问题</b>：说清现状、风险、你倾向的选项和理由，让老板做选择题而非问答题\x20②\x20<b>同步节奏可预期</b>：固定频率同步进展与风险，别让老板从别处得知你的项目出事了\x20③\x20<b>理解老板的目标函数</b>：他的\x20KPI\x20是什么、他向上承诺了什么，你的项目如何嵌入。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“老板的决策明显有问题怎么办？”——先执行有歧义的部分，同时用数据佐证你的判断，保留复盘证据；注意「明显有问题」往往是因为你看不到他的信息面。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>转岗者常见误区：把向上管理等同于「汇报技巧」。它真正的内核是<b>降低上级对你的监督成本</b>，信任是这样攒出来的。'},{'c':_0x454256(0x204),'s':0x0,'lv':'⭐','q':'AI\x20产品经理的四种岗位形态与能力要求差异','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>模型产品\x20PM</b>：面向模型本身（训练平台、模型\x20API、开源生态），要懂训练流程与评测体系，客户是开发者\x20②\x20<b>AI\x20应用\x20PM</b>：把模型能力嵌入具体场景（Copilot、智能客服、AI\x20助手），要懂能力边界与场景匹配\x20③\x20<b>工具链\x20PM</b>：做标注平台、评测平台、Agent\x20编排工具，要懂算法工作流\x20④\x20<b>行业方案\x20PM</b>：把\x20AI\x20卖给金融、医疗等行业，要懂行业\x20Know-how\x20与合规。<br><span\x20class=\x27lb\x27>⚓\x20转岗建议</span><br>你的\x20NL2SQL\x20Agent\x20与微调经历对\x20①③\x20是直接对口证据；对\x20②\x20需要补场景叙事。投递时同一份经历可以针对不同形态改写强调点。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试前务必搞清目标团队属于哪种形态，「做\x20AI\x20产品」的回答会显得没做功课。'},{'c':'aipm','s':0x0,'lv':'⭐','q':_0x454256(0x1a1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>Chat</b>：对话即产品（通用助手），竞争在模型能力与生态\x20②\x20<b>Copilot</b>：嵌入既有工作流辅助人（代码补全、写作助手），用户保有最终决定权，容错高\x20③\x20<b>Agent</b>：模型自主规划执行多步任务，体验上限高但可靠性挑战大\x20④\x20<b>嵌入式增强</b>：用户感知不到\x20AI\x20的存在（搜索排序、输入法预测），最稳但最不性感\x20⑤\x20<b>API/基础设施</b>：卖给开发者，拼稳定性、价格与文档。<br><span\x20class=\x27lb\x27>➤\x20产品设计含义</span><br>形态决定交互与兜底策略：Copilot\x20可以「建议\x20+\x20一键采纳」，Agent\x20必须「过程可见\x20+\x20可中断\x20+\x20事后可回滚」。<br><span\x20class=\x27lb\x27>⚓\x20面试钩子</span><br>用这个框架分析任何\x20AI\x20产品，能瞬间展示结构化思维。'},{'c':_0x454256(0x204),'s':0x0,'lv':'🔥','q':_0x454256(0x1a3),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>输出是概率的</b>：同一输入不保证同一输出，需求文档要定义「合格率」而非「正确」，验收方式从断言变成抽样评测\x20②\x20<b>效果与体验强耦合</b>：延迟、成本、效果三者互相牵制，PM\x20要做三角权衡（更快更便宜往往更笨）③\x20<b>数据闭环即产品</b>：用户使用数据反哺模型迭代，产品架构要为回流设计，反馈通道本身就是功能。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“传统需求评审还适用吗？”——流程适用，文档结构要变：增加「能力边界声明」「badcase\x20处理策略」「评测标准」三个新章节。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>这三点差异你都在一线踩过：概率输出（评测集思维）、三角权衡（LoRA\x20vs\x20全量的成本账）、数据闭环（OKC-SFT\x20的样本构造），全部是现成案例。'},{'c':_0x454256(0x204),'s':0x1,'lv':'⭐','q':_0x454256(0x1f4),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把模型能力按「场景\x20×\x20表现」分四象限写清：<b>核心区</b>（高频场景且表现稳定，主推）、<b>降级区</b>（高频但表现不稳，需兜底策略）、<b>长尾区</b>（低频且表现不稳，明确拒绝或引导转人工）、<b>惊喜区</b>（低频但表现超预期，可做营销点）。每区配对交互策略：核心区直接输出，降级区加确认步骤，长尾区礼貌拒答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“边界数据从哪来？”——评测集分场景统计正确率\x20+\x20线上\x20badcase\x20归因，两者交叉出边界地图。“边界会漂移吗？”——会，模型升级后要重新标定，版本管理是\x20AI\x20PM\x20的日常。<br><span\x20class=\x27lb\x27>⚓\x20算法背景叙事</span><br>你做过\x20611\x20条场景化样本的数据集，本质上就是给「粗氩塔氮塞」这一个场景画边界。把这段经历翻译成边界思维，面试官立刻能听懂你的价值。'},{'c':_0x454256(0x204),'s':0x1,'lv':'⭐','q':_0x454256(0x1d8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>产品经理治幻觉不靠「让模型不胡说」，靠<b>架构性防线</b>：①\x20<b>产品形态规避</b>：高风险场景不让模型自由生成（改选择题、改提取任务）②\x20<b>检索锚定</b>：RAG\x20让输出有据可依并展示引用源\x20③\x20<b>置信度门槛</b>：低置信转人工或提示「不确定」④\x20<b>交互兜底</b>：免责声明、一键反馈、可编辑输出\x20⑤\x20<b>事后校验</b>：规则引擎或二次模型审核关键事实。<br><span\x20class=\x27lb\x27>➤\x20按场景选防线</span><br>医疗法律类五道全上；创意写作只需②⑤；客服答商品参数要①②。<br><span\x20class=\x27lb\x27>⚓\x20你的论文叙事</span><br>OKC-SFT\x20把幻觉率从\x2034.4%\x20降到\x2015.6%，说明你懂「数据侧」治理；面试补一句「剩余\x2015.6%\x20要靠产品侧防线承接」，就从算法视角切到了\x20PM\x20视角，这句话是转岗叙事的题眼。'},{'c':_0x454256(0x204),'s':0x1,'lv':'🔥','q':_0x454256(0x20e),'a':_0x454256(0x138)},{'c':_0x454256(0x204),'s':0x2,'lv':'⭐','q':'Token\x20成本的产品账：一次调用多少钱','a':_0x454256(0x1a6)},{'c':_0x454256(0x204),'s':0x2,'lv':'🔥','q':'延迟的产品感知与优化：TTFT\x20决定生死','a':_0x454256(0x177)},{'c':'aipm','s':0x2,'lv':'🔥','q':_0x454256(0x139),'a':_0x454256(0x14c)},{'c':'aipm','s':0x3,'lv':'⭐','q':'数据飞轮：AI\x20产品的核心壁垒怎么转起来','a':_0x454256(0x19c)},{'c':_0x454256(0x204),'s':0x3,'lv':'🔥','q':_0x454256(0x1a2),'a':_0x454256(0x1e2)},{'c':_0x454256(0x20b),'s':0x0,'lv':'⭐','q':_0x454256(0x144),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>对任何候选需求问七个问题：①\x20<b>谁</b>在用（画像具体到一个人）②\x20<b>何时何地</b>（场景越具体越真）③\x20<b>做什么</b>（任务是什么）④\x20<b>没有它会怎样</b>（痛点强度：忍着/绕路/放弃）⑤\x20<b>现在用什么替代</b>（竞品包括\x20Excel\x20和人肉）⑥\x20<b>用了之后多好</b>（可量化的收益）⑦\x20<b>愿不愿意付代价</b>（钱、学习成本、迁移成本）。七问都答得顺，需求大概率真。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“用户说的和做的不一致怎么办？”——做的优先级高于说的，访谈结论要用行为数据校验。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20特有</span><br>AI\x20需求多问一句第八问：这是<b>模型能力半径内</b>的需求吗？技术不可达的需求再痛也是伪需求。'},{'c':_0x454256(0x20b),'s':0x0,'lv':'🔥','q':'真需求\x20vs\x20伪需求：三个经典判据','a':_0x454256(0x1b2)},{'c':_0x454256(0x20b),'s':0x0,'lv':'🔥','q':_0x454256(0x170),'a':_0x454256(0x14f)},{'c':_0x454256(0x20b),'s':0x1,'lv':'⭐','q':_0x454256(0x1c6),'a':_0x454256(0x13b)},{'c':_0x454256(0x20b),'s':0x1,'lv':'🔥','q':_0x454256(0x1cb),'a':_0x454256(0x1a0)},{'c':_0x454256(0x20b),'s':0x2,'lv':'⭐','q':_0x454256(0x13e),'a':_0x454256(0x205)},{'c':_0x454256(0x20b),'s':0x2,'lv':'🔥','q':'MVP\x20思维：怎么裁出最小可验证版本','a':_0x454256(0x15a)},{'c':'method','s':0x3,'lv':'⭐','q':_0x454256(0x1cd),'a':_0x454256(0x198)},{'c':'method','s':0x3,'lv':'🔥','q':_0x454256(0x19a),'a':_0x454256(0x1b0)},{'c':_0x454256(0x20b),'s':0x3,'lv':'🔥','q':'漏斗、留存与\x20NPS：三个最常用的指标工具','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>转化漏斗</b>：把主流程拆成步骤看流失，优化最大流失点收益最高；注意步骤定义要贴用户动作而非系统事件\x20②\x20<b>留存曲线</b>：次日/7\x20日/30\x20日留存，健康产品的曲线最终走平（找到稳定活跃人群）；曲线持续下滑到零说明没有留存价值\x20③\x20<b>NPS</b>：推荐者占比减贬损者占比，衡量口碑意愿；缺点是粗糙，配开放追问「为什么打这个分」才有信息量。<br><span\x20class=\x27lb\x27>➤\x20AI\x20产品变体</span><br>AI\x20功能看「任务完成率」与「重试率」：用户问了没得到答案，换个问法再问，重试率高说明首次命中率差，这是\x20AI\x20版的流失信号。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>指标是地图不是地形：数据异动先查埋点变更与技术故障，再谈用户归因，一半的「用户行为剧变」其实是统计口径改了。'},{'c':'eval','s':0x0,'lv':'⭐','q':_0x454256(0x15d),'a':_0x454256(0x1fa)},{'c':_0x454256(0x14e),'s':0x0,'lv':'🔥','q':'离线评测与在线评估的差异及组合用法','a':_0x454256(0x17c)},{'c':_0x454256(0x14e),'s':0x0,'lv':'🔥','q':'LLM-as-judge：用模型评模型的方法与坑','a':_0x454256(0x207)},{'c':_0x454256(0x14e),'s':0x0,'lv':'🔥','q':_0x454256(0x16b),'a':_0x454256(0x183)},{'c':_0x454256(0x14e),'s':0x1,'lv':'⭐','q':_0x454256(0x17f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>订阅制</b>（月费解锁额度）：面向\x20C\x20端，收入可预测，核心矛盾是重度用户亏钱，要设计公平使用政策\x20②\x20<b>按量计费\x20/\x20API</b>：面向\x20B\x20端开发者，透明但用户成本焦虑大，常用阶梯价与资源包缓解\x20③\x20<b>增值分层</b>（免费基础\x20+\x20付费高级模型）：转化漏斗逻辑，免费档当获客渠道\x20④\x20<b>效果分成</b>（按完成任务计费，如按成交）：对齐最深但计量最难。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“定价怎么锚定？”——锚定用户替代方案成本（人工价\x20×\x20折扣），而非自己的成本加成；成本只决定价格下限。<br><span\x20class=\x27lb\x27>⚓\x20趋势认知</span><br>模型推理成本持续下探，价格战下「按\x20token\x20计费」利润被压薄，向工作流与结果收费迁移是行业共识方向，面试谈定价必提。'},{'c':_0x454256(0x14e),'s':0x1,'lv':'🔥','q':_0x454256(0x169),'a':_0x454256(0x13a)},{'c':'eval','s':0x2,'lv':'⭐','q':_0x454256(0x17a),'a':_0x454256(0x208)},{'c':_0x454256(0x14e),'s':0x2,'lv':'🔥','q':_0x454256(0x137),'a':_0x454256(0x1a9)},{'c':_0x454256(0x14e),'s':0x2,'lv':'💎','q':_0x454256(0x133),'a':_0x454256(0x1e6)},{'c':_0x454256(0x1e7),'s':0x0,'lv':'⭐','q':_0x454256(0x13c),'a':_0x454256(0x1f6)},{'c':'job','s':0x0,'lv':'⭐','q':'简历改写：从技术语言到产品语言','a':_0x454256(0x161)},{'c':_0x454256(0x1e7),'s':0x0,'lv':'🔥','q':'校招\x20PM\x20与技术岗的面试流程差异','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20面试四件套：①\x20<b>自我介绍\x20+\x20简历深挖</b>（考转岗叙事，见\x205.1.1）②\x20<b>产品案例/设计题</b>（「为\x20X\x20人群设计\x20Y」或「分析\x20Z\x20产品为什么成功」，考结构化拆解）③\x20<b>产品\x20sense\x20闲聊</b>（「最近用什么\x20App，说说它哪里好哪里差」，考日常观察力与标准）④\x20<b>行为面</b>（冲突、失败、推动力，STAR\x20法则作答）。技术深度通常不单独考，但会在简历深挖里被验证真伪。<br><span\x20class=\x27lb\x27>⚓\x20备考优先级</span><br>转岗者最弱的是③：技术岗求职者往往三年没认真体验过产品。从今天开始每天拆一个产品细节，攒三十条再上面试场。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>案例分析别套模型公司技术栈（没人问你\x20transformer）。反过来的信息差才是你的武器：聊到\x20AI\x20产品时再放技术深度。'},{'c':_0x454256(0x1e7),'s':0x1,'lv':'⭐','q':_0x454256(0x162),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>STAR：Situation（背景一句）、Task（你的职责与目标）、Action（你具体做了什么，占\x2070%\x20篇幅，重点写决策与权衡）、Result（量化结果\x20+\x20学到什么）。三道必考题与要点：①\x20<b>最大挫折/失败</b>：真失败\x20+\x20归因到自己可改的行为\x20+\x20后来怎么改的，忌假失败（「太追求完美」）②\x20<b>意见冲突</b>：展示先理解对方逻辑、再用数据或实验推进，忌「我说服了他」式胜利叙事\x20③\x20<b>主动性</b>：没人要求你做了什么分外之事。<br><span\x20class=\x27lb\x27>⚓\x20素材库</span><br>你的现成弹药：推动「算法输出\x20JSON、LLM\x20只做转述」的职责分离规范（协作）；数据集从\x20858\x20条基线砍到\x20611\x20条场景化样本的取舍（决策权衡）。'},{'c':'job','s':0x1,'lv':'🔥','q':_0x454256(0x181),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三层递进：①\x20<b>正面回答动机</b>（具体事件触发的兴趣，见转岗叙事）②\x20<b>展示对产品工作的清醒认知</b>（你知道它意味着什么：大量沟通、模糊性、为别人的体验负责，仍选择它）③\x20<b>落回独特价值</b>（你的算法背景在\x20AI\x20产品团队是稀缺资产，你清楚自己的比较优势在哪）。<br><span\x20class=\x27lb\x27>➤\x20追问预案</span><br>“过两年模型能力人人都会懂，你的优势还在吗？”——答：技术判断力会贬值，但「与技术团队共创产品的信任关系」和「数据闭环的工程直觉」沉淀在方法论里，且我到时会积累出真正的产品能力。展示你想过纵深问题。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>任何贬低算法岗的表述（「做工程太枯燥」）都会连带贬低面试官的团队构成，保持对两个岗位的双重尊重。'},{'c':_0x454256(0x1e7),'s':0x1,'lv':'🔥','q':_0x454256(0x182),'a':_0x454256(0x1b3)},{'c':_0x454256(0x1e7),'s':0x1,'lv':'🔥','q':_0x454256(0x19f),'a':_0x454256(0x145)},{'c':_0x454256(0x1e7),'s':0x1,'lv':'🔥','q':'反问环节：五类问题体现你的层次','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好反问让面试官记住你，按层次排：①\x20<b>业务纵深</b>：「这个产品当前最大的挑战是模型能力还是场景渗透？」（展示技术判断）②\x20<b>团队定位</b>：「PM\x20和算法的分工边界在团队里是怎么划的？」（转岗者必问，答案直接影响你入职体验）③\x20<b>决策机制</b>：「一个典型的功能从想法到上线，周期多长、谁拍板？」④\x20<b>个人成长</b>：「团队里做得最好的\x20PM\x20是什么背景、强在哪？」⑤\x20<b>善意收尾</b>：「今天聊下来您觉得我和这个岗位的差距主要在哪？」（真诚且高风险高回报）。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>不问薪资福利加班（HR\x20面再谈）、不问官网能查到的信息、不问「我表现得怎么样」。'},{'c':_0x454256(0x1e7),'s':0x2,'lv':'⭐','q':_0x454256(0x1e1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六维体检：①\x20<b>业务阶段</b>：从\x200\x20到\x201\x20的业务锻炼大但死亡率高，成熟业务学体系但可能只拧螺丝\x20②\x20<b>数据资产</b>：有用户与数据的业务，PM\x20有杠杆；纯汇报型岗位成长慢\x20③\x20<b>汇报线</b>：直属上级是不是做过产品的人，决定你的天花板\x20④\x20<b>PM\x20密度</b>：团队\x20PM\x20越少你越被当核心培养（一个团队只有一个\x20PM\x20时你什么都要干，成长最快）⑤\x20<b>算法耦合度</b>：AI\x20产品岗与算法团队的协作紧密度，决定你的技术背景能否变现\x20⑥\x20<b>可迁移性</b>：这个岗位攒的经验（行业、能力）跳槽时市场认不认。<br><span\x20class=\x27lb\x27>⚓\x20转岗者特别提醒</span><br>第一份产品工作宁选「能给完整闭环经验」的小盘子，不选「只负责写文档」的大盘子。前两年攒的是可复用的方法论。'},{'c':_0x454256(0x1e7),'s':0x2,'lv':'💎','q':_0x454256(0x1d1),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>双轨不是骑墙，是资产配置：①\x20<b>主轨算法</b>：你的论文、项目、实习经历对算法岗是满配，秋招主线不放松\x20②\x20<b>副轨产品</b>：投递集中在与算法强耦合的\x20AI\x20PM\x20岗（策略产品、模型产品、AI\x20应用），这类岗位你的转岗成本最低\x20③\x20<b>叙事隔离</b>：两套简历、两套故事线，同一公司内部避免同时投互斥岗位（系统里会被标记动机不纯）。<br><span\x20class=\x27lb\x27>➤\x20时间分配建议</span><br>算法面试准备投入约七成，产品三成：产品面试的核心素材（案例分析框架、产品\x20sense）可以碎片化积累，算法的刷题与八股必须整块时间。<br><span\x20class=\x27lb\x27>⚠\x20决策时机</span><br>拿到双\x20offer\x20再做选择，用真实选项代替空想；选择标准回到上一条「值不值得去」的六维体检，而非岗位名称的美感。'},{'c':_0x454256(0x12b),'s':0x0,'lv':'⭐','q':_0x454256(0x1d5),'a':_0x454256(0x206)},{'c':'plan','s':0x1,'lv':'🔥','q':_0x454256(0x18d),'a':'<span\x20class=\x27lb\x27>◈\x20通用六步（背熟）</span><br>①\x20澄清目标：「这个产品/功能的成功标准是什么？考核增长、体验还是收入？」<br>②\x20用户与场景：「核心用户分\x20X\x20类，最高价值的是…，典型场景是…」<br>③\x20结构化拆解：漏斗（认知→使用→留存→推荐）或供需（用户需求端\x20×\x20产品供给端），二选一并说明理由<br>④\x20方案：每个方案带「预期收益\x20/\x20成本\x20/\x20风险」三标注<br>⑤\x20验证：主指标\x20+\x20护栏指标\x20+\x20实验设计（样本量、周期）<br>⑥\x20结论：「资源有限先做方案一，因为…；方案二排在…之后」<br><span\x20class=\x27lb\x27>➤\x20AI\x20题加一步</span><br>在②③之间插入「能力边界评估」：目标方案对模型能力的要求是什么、当前模型达不达得到、不达得到怎么绕。<br><span\x20class=\x27lb\x27>⚠\x20现场纪律</span><br>每步结束和面试官对齐一次。闷头走完六步零交互，等于把协作面试答成了笔试。'},{'c':_0x454256(0x12b),'s':0x2,'lv':'🔥','q':_0x454256(0x201),'a':_0x454256(0x1cc)},{'c':_0x454256(0x12b),'s':0x3,'lv':'💎','q':'这本手册怎么用（使用说明）','a':_0x454256(0x1d3)}],STORE_KEY='llm-pm-handbook-progress-v1';let progress={};try{progress=JSON[_0x454256(0x1dd)](localStorage['getItem'](STORE_KEY)||'{}');}catch(_0x518f24){}function saveProgress(){const _0x1f2dc5=_0x454256;localStorage[_0x1f2dc5(0x13f)](STORE_KEY,JSON[_0x1f2dc5(0x1ea)](progress));}function cardId(_0xcca70){return'c'+_0xcca70;}let mode='book',currentChap='all',levelFilter=_0x454256(0x130);const $=_0x268aee=>document[_0x454256(0x195)](_0x268aee);function chapOf(_0x4da2f8){return CHAPTERS['find'](_0x4f2fa8=>_0x4f2fa8['id']===_0x4da2f8);}function chapIdx(_0x26b4be){const _0x5685f9=_0x454256;return CHAPTERS[_0x5685f9(0x211)](_0xca09e5=>_0xca09e5['id']===_0x26b4be);}function chapCards(_0x1f793a){const _0x41ab97=_0x454256;return CARDS[_0x41ab97(0x1e4)]((_0xed1283,_0x878dc)=>_0xed1283['c']===_0x1f793a?_0x878dc:-(0x1*0x22ea+-0x648+-0x15d*0x15))[_0x41ab97(0x1c9)](_0x464103=>_0x464103>=-0x22db*0x1+-0x831+0x89c*0x5);}function knownCount
