<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

2c1a4e(0x189)]}],CARDS=[{'c':_0x2c1a4e(0x17b),'s':0x0,'lv':'⭐','q':'产品经理的核心职责到底是什么？','a':_0x2c1a4e(0x121)},{'c':_0x2c1a4e(0x17b),'s':0x0,'lv':'⭐','q':'PM\x20的能力模型：面试官在考察什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>行业通用的五维模型：①\x20<b>用户洞察</b>（能否还原真实场景与动机）②\x20<b>商业敏感</b>（能否算清成本收益）③\x20<b>产品设计</b>（方案的结构化表达能力）④\x20<b>项目推动</b>（跨角色拿到结果）⑤\x20<b>数据能力</b>（用数据验证判断）。各厂叫法不同，底层一致。<br><span\x20class=\x27lb\x27>➤\x20面试映射</span><br>每场\x20PM\x20面试的题基本都能归到这五维：案例分析考洞察与商业，产品\x20sense\x20考设计，简历深挖考推动，数据题考实验素养。<br><span\x20class=\x27lb\x27>⚓\x20你的不对称优势</span><br>算法背景天然点亮第五维，AI\x20岗位还会加分第二维（token\x20成本、算力成本你都真算过）。短板通常在第一维和第三维，准备重心放这里。'},{'c':_0x2c1a4e(0x17b),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x120),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>按工作对象分：<b>功能型</b>（交互与流程，如改一个下单页）、<b>策略型</b>（规则与模型逻辑，如推荐排序、风控阈值）、<b>数据型</b>（指标体系与实验，如增长团队）、<b>平台型</b>（面向内部或\x20B\x20端的工具与\x20API）、<b>商业型</b>（定价、售卖、生态）。AI\x20时代新增：<b>模型产品\x20PM</b>（做基础模型或训练平台）与\x20<b>AI\x20应用\x20PM</b>（把模型能力包进场景）。<br><span\x20class=\x27lb\x27>⚓\x20转岗建议</span><br>算法转产品最顺的落点是<b>策略型\x20PM\x20和\x20AI\x20应用\x20PM</b>：前者日常工作就是和算法工程师对话，后者需要懂模型边界。纯功能型岗位对交互功底要求高，你的相对优势小。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别把「策略产品经理」理解成写\x20SQL\x20的，它的核心是把业务目标翻译成可优化的目标函数，这正是你会的。'},{'c':_0x2c1a4e(0x17b),'s':0x0,'lv':'🔥','q':'技术背景做\x20PM\x20的优势与常见失败模式','a':_0x2c1a4e(0x139)},{'c':_0x2c1a4e(0x17b),'s':0x1,'lv':'⭐','q':_0x2c1a4e(0x199),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（背下这条主线）</span><br>①\x20<b>发现</b>：用户反馈\x20/\x20数据异动\x20/\x20业务目标拆解\x20②\x20<b>论证</b>：算收益与成本，排优先级（常见框架：价值÷成本、RICE）③\x20<b>立项</b>：讲清背景、目标、衡量指标\x20④\x20<b>PRD</b>：功能详述、边界与异常流、埋点\x20⑤\x20<b>评审</b>：需求评审\x20→\x20技术方案评审\x20→\x20测试用例评审\x20⑥\x20<b>开发跟进</b>：每日同步，变更及时同步文档\x20⑦\x20<b>测试验收</b>：PM\x20按验收标准逐条过\x20⑧\x20<b>灰度发布</b>：小流量观察核心指标\x20⑨\x20<b>全量与复盘</b>：对照立项目标出数据结论。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪个环节最容易出事？”——评审后的<b>变更管理</b>：开发中途改需求不改文档，测试按旧版用例跑，上线即事故。<br><span\x20class=\x27lb\x27>⚓\x20算法背景加分</span><br>AI\x20需求在第⑦⑧环有特殊性：验收面对的是概率性输出，要用评测集和抽样标准代替「对/错」二值验收，后面第四章展开。'},{'c':_0x2c1a4e(0x17b),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x15f),'a':_0x2c1a4e(0x11d)},{'c':'basics','s':0x1,'lv':'🔥','q':_0x2c1a4e(0x13f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>通用公式：<b>优先级\x20=\x20价值\x20÷\x20成本</b>。价值看覆盖面（多少用户）×\x20频次\x20×\x20痛感强度\x20×\x20商业贡献；成本看开发量\x20×\x20风险\x20×\x20机会成本。落地常用\x20<b>RICE</b>：Reach（触达量）×\x20Impact（单人收益，0.25~3\x20分档）×\x20Confidence（信心，按数据/直觉分档）÷\x20Effort（人周）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“老板的需求怎么排？”——先问清老板要解决的问题是什么，多数时候你能用更低成本的方式满足同一目标，这叫向上管理需求而非执行需求；“ROI\x20算不清怎么办？”——先跑小流量实验或做意向调研，用增量信息降低不确定性。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试案例里只讲「做了什么」不讲「为什么先做这个」，是产品思维缺失的典型信号。'},{'c':_0x2c1a4e(0x17b),'s':0x2,'lv':'🔥','q':_0x2c1a4e(0x1ca),'a':_0x2c1a4e(0x150)},{'c':_0x2c1a4e(0x17b),'s':0x2,'lv':'💎','q':_0x2c1a4e(0x123),'a':_0x2c1a4e(0x1bc)},{'c':_0x2c1a4e(0x1c4),'s':0x0,'lv':'⭐','q':_0x2c1a4e(0x1c0),'a':_0x2c1a4e(0x13b)},{'c':_0x2c1a4e(0x1c4),'s':0x0,'lv':'⭐','q':'大模型产品的五种形态：Chat\x20/\x20Copilot\x20/\x20Agent\x20/\x20嵌入增强\x20/\x20API','a':_0x2c1a4e(0x156)},{'c':_0x2c1a4e(0x1c4),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x1d4),'a':_0x2c1a4e(0x153)},{'c':_0x2c1a4e(0x1c4),'s':0x1,'lv':'⭐','q':'模型能力边界怎么写进\x20PRD：可用边界四分法','a':_0x2c1a4e(0x1e9)},{'c':_0x2c1a4e(0x1c4),'s':0x1,'lv':'⭐','q':'幻觉的产品侧治理：五道防线','a':_0x2c1a4e(0x11f)},{'c':_0x2c1a4e(0x1c4),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x1e8),'a':_0x2c1a4e(0x174)},{'c':_0x2c1a4e(0x1c4),'s':0x2,'lv':'⭐','q':_0x2c1a4e(0x1cd),'a':_0x2c1a4e(0x111)},{'c':_0x2c1a4e(0x1c4),'s':0x2,'lv':'🔥','q':_0x2c1a4e(0x16c),'a':_0x2c1a4e(0x1ab)},{'c':'aipm','s':0x2,'lv':'🔥','q':_0x2c1a4e(0x13a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>长上下文打开三种产品可能：多轮记忆（整个会话历史可引用）、长文档理解（整本书、整个代码库）、少样本示例（few-shot\x20放进\x20prompt）。但窗口大≠免费：①\x20输入成本随长度线性涨\x20②\x20超长上下文的<b>中间遗忘</b>现象（关键信息放中间容易被忽略）③\x20延迟随长度增加。<br><span\x20class=\x27lb\x27>➤\x20产品策略</span><br>记忆分层：近几轮全文保留，更早的摘要压缩，关键事实抽取存档；文档场景做检索分段喂入而非整本塞入。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试别说「上下文越长越好」。主动提\x20lost\x20in\x20the\x20middle\x20现象与成本权衡，是懂行的标志。'},{'c':_0x2c1a4e(0x1c4),'s':0x3,'lv':'⭐','q':'数据飞轮：AI\x20产品的核心壁垒怎么转起来','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>飞轮链条：<b>更多用户\x20→\x20更多真实使用数据与\x20badcase\x20→\x20更准的评测与训练信号\x20→\x20模型/策略更贴合场景\x20→\x20体验更好\x20→\x20更多用户</b>。PM\x20的任务是给每一环装上产品机制：反馈入口（点赞点踩、纠错编辑）、回流管线（badcase\x20自动归集去重）、闭环验证（迭代后先在历史\x20badcase\x20上回归）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“冷启动没数据怎么办？”——用公开数据或合成数据先建基线评测，再靠种子用户积累；“反馈数据脏怎么办？”——点赞点踩噪音大，要配权重（编辑行为比点赞信号强）。<br><span\x20class=\x27lb\x27>⚓\x20你的叙事</span><br>OKC-SFT\x20本质是人工构造数据启动飞轮的案例：没有用户数据时，用领域知识造出\x20611\x20条高质量样本照样转起来。'},{'c':_0x2c1a4e(0x1c4),'s':0x3,'lv':'🔥','q':'AI\x20产品的合规红线清单','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条高压线：①\x20<b>生成内容标识</b>：深度合成内容需显著标识，这是监管硬要求\x20②\x20<b>个人信息保护</b>：用户输入进训练要单独授权，默认勾选违法；敏感个人信息（生物识别、医疗）从严\x20③\x20<b>数据出境</b>：调用境外模型\x20API\x20上传境内数据可能触发数据出境评估\x20④\x20<b>内容安全</b>：生成式\x20AI\x20服务需备案并有内容审核机制，涉政治、医疗、金融等垂直领域有额外资质要求。<br><span\x20class=\x27lb\x27>➤\x20PM\x20的落地动作</span><br>PRD\x20里加合规章节：数据流向图、用户授权文案、审核兜底策略、备案状态。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>合规是挂掉整条产品线级别的风险，面试提到任何数据方案时主动补一句合规考量，成熟度立刻不同。'},{'c':_0x2c1a4e(0x147),'s':0x0,'lv':'⭐','q':'需求分析的场景七问','a':_0x2c1a4e(0x162)},{'c':_0x2c1a4e(0x147),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x1c2),'a':_0x2c1a4e(0x182)},{'c':'method','s':0x0,'lv':'🔥','q':_0x2c1a4e(0x112),'a':_0x2c1a4e(0x134)},{'c':_0x2c1a4e(0x147),'s':0x1,'lv':'⭐','q':_0x2c1a4e(0x198),'a':_0x2c1a4e(0x1c7)},{'c':_0x2c1a4e(0x147),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x1b4),'a':_0x2c1a4e(0x1a9)},{'c':_0x2c1a4e(0x147),'s':0x2,'lv':'⭐','q':_0x2c1a4e(0x197),'a':_0x2c1a4e(0x16f)},{'c':_0x2c1a4e(0x147),'s':0x2,'lv':'🔥','q':_0x2c1a4e(0x1b0),'a':_0x2c1a4e(0x184)},{'c':_0x2c1a4e(0x147),'s':0x3,'lv':'⭐','q':_0x2c1a4e(0x1d9),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>北极星指标是<b>唯一</b>最能代表「用户获得核心价值」的量：搜索产品是「成功搜索次数」，IM\x20是「发送消息的用户数」，工具是「完成任务的次数」。选型三标准：反映用户价值（非收入）、可操作（团队能影响）、先导性（预示长期成功）。体系分层：北极星\x20→\x20驱动指标拆解（按漏斗或按等式拆成可影响因子）→\x20护栏指标（防作恶：质量、留存、投诉率）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不能用\x20DAU\x20当北极星？”——DAU\x20可被补贴和推送吹起来，不必然代表价值交付，易诱导短视动作。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20产品特有</span><br>AI\x20产品要加一对专用护栏：<b>回答合格率</b>（质量下限）与<b>单次服务成本</b>（商业下限），北极星涨而护栏崩，等于在烧钱买增长。'},{'c':_0x2c1a4e(0x147),'s':0x3,'lv':'🔥','q':_0x2c1a4e(0x1d5),'a':_0x2c1a4e(0x1a8)},{'c':_0x2c1a4e(0x147),'s':0x3,'lv':'🔥','q':_0x2c1a4e(0x1df),'a':_0x2c1a4e(0x1ba)},{'c':_0x2c1a4e(0x1a5),'s':0x0,'lv':'⭐','q':_0x2c1a4e(0x1d7),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>两套语言、一个翻译：<b>准确率/召回率</b>\x20→\x20任务完成率、重试率；<b>幻觉率</b>\x20→\x20投诉率、纠错编辑率；<b>困惑度</b>\x20→\x20基本无产品对应（只做内部监控）；<b>TTFT/TPOT</b>\x20→\x20首屏等待时长、会话放弃率；<b>评测分数</b>\x20→\x20用户点赞点踩率、NPS。PM\x20的日常就是做这张映射表的owner：算法报内部指标，PM\x20翻译成业务语言向上汇报。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“两个指标打架怎么办？”（如幻觉率降了但回答变啰嗦，用户\x20completion\x20率降）——回到目标函数排序：本季度北极星是什么，就牺牲哪个。权衡表是\x20PM\x20的核心产出。<br><span\x20class=\x27lb\x27>⚓\x20你的转岗题眼</span><br>「我做算法时习惯把指标优化到极致，做产品要学的是为用户体验设指标天花板」：面试讲这句，说明你完成了视角切换。'},{'c':_0x2c1a4e(0x1a5),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x1c8),'a':_0x2c1a4e(0x19d)},{'c':_0x2c1a4e(0x1a5),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x119),'a':_0x2c1a4e(0x17f)},{'c':_0x2c1a4e(0x1a5),'s':0x0,'lv':'🔥','q':'AI\x20功能的\x20ROI\x20账：收益侧与成本侧怎么列','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>成本侧</b>：模型调用费（输入输出\x20token）+\x20推理基础设施\x20+\x20数据标注与人力\x20+\x20研发摊销。<b>收益侧</b>四选一或多选：①\x20提效省钱（替代人工工时\x20×\x20时薪）②\x20转化提升（转化率增量\x20×\x20客单价\x20×\x20流量）③\x20留存提升（LTV\x20增量）④\x20付费新增（订阅增量收入）。公式：净收益\x20=\x20增量收入\x20+\x20节约成本\x20−\x20变动成本\x20−\x20固定投入。<br><span\x20class=\x27lb\x27>➤\x20面试算术示范</span><br>客服\x20AI\x20替代\x2030%\x20人工会话：假设日会话\x2010\x20万、人工单次成本\x202\x20元、AI\x20单次\x200.05\x20元、拦截率\x2030%，日省约\x205.85\x20万元，年化约两千万，对照研发投入两年回本。会现场列这种账的\x20PM\x20凤毛麟角。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别忘了算隐性成本：badcase\x20客诉处理、品牌损伤、合规整改，三项都可能是大头。'},{'c':'eval','s':0x1,'lv':'⭐','q':_0x2c1a4e(0x1d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>订阅制</b>（月费解锁额度）：面向\x20C\x20端，收入可预测，核心矛盾是重度用户亏钱，要设计公平使用政策\x20②\x20<b>按量计费\x20/\x20API</b>：面向\x20B\x20端开发者，透明但用户成本焦虑大，常用阶梯价与资源包缓解\x20③\x20<b>增值分层</b>（免费基础\x20+\x20付费高级模型）：转化漏斗逻辑，免费档当获客渠道\x20④\x20<b>效果分成</b>（按完成任务计费，如按成交）：对齐最深但计量最难。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“定价怎么锚定？”——锚定用户替代方案成本（人工价\x20×\x20折扣），而非自己的成本加成；成本只决定价格下限。<br><span\x20class=\x27lb\x27>⚓\x20趋势认知</span><br>模型推理成本持续下探，价格战下「按\x20token\x20计费」利润被压薄，向工作流与结果收费迁移是行业共识方向，面试谈定价必提。'},{'c':_0x2c1a4e(0x1a5),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x143),'a':_0x2c1a4e(0x17a)},{'c':_0x2c1a4e(0x1a5),'s':0x2,'lv':'⭐','q':_0x2c1a4e(0x12e),'a':_0x2c1a4e(0x19e)},{'c':_0x2c1a4e(0x1a5),'s':0x2,'lv':'🔥','q':_0x2c1a4e(0x1ee),'a':_0x2c1a4e(0x179)},{'c':_0x2c1a4e(0x1a5),'s':0x2,'lv':'💎','q':_0x2c1a4e(0x13e),'a':_0x2c1a4e(0x165)},{'c':_0x2c1a4e(0x187),'s':0x0,'lv':'⭐','q':_0x2c1a4e(0x144),'a':_0x2c1a4e(0x1a1)},{'c':'job','s':0x0,'lv':'⭐','q':_0x2c1a4e(0x14a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>翻译三原则：①\x20<b>成果主语从模型变用户/业务</b>：「幻觉率\x2034.4%→15.6%」改成「通过数据质量治理将领域问答可靠性提升一倍，支撑\x20X\x20场景上线」②\x20<b>补充角色视角</b>：写清你在项目里发现的问题、做的取舍、推动的事，而非只写技术实现\x20③\x20<b>保留技术深度作为信任状</b>：关键指标留着（降本、性能数字），它们证明你懂行。<br><span\x20class=\x27lb\x27>➤\x20案例改写示范</span><br>NL2SQL\x20Agent：技术版「10\x20表\x20307\x20字段\x2098%\x20可执行率」→\x20产品版「识别出业务自助取数场景的转化瓶颈，主导设计\x20NL2SQL\x20方案，自然语言到查询的可用率达\x2098%，验证了场景可行性」。<br><span\x20class=\x27lb\x27>⚓\x20一句话</span><br>同一份经历，技术岗简历答「你怎么做的」，产品岗简历答「你为什么判断它值得做、怎么证明做成了」。'},{'c':_0x2c1a4e(0x187),'s':0x0,'lv':'🔥','q':_0x2c1a4e(0x14e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20面试四件套：①\x20<b>自我介绍\x20+\x20简历深挖</b>（考转岗叙事，见\x205.1.1）②\x20<b>产品案例/设计题</b>（「为\x20X\x20人群设计\x20Y」或「分析\x20Z\x20产品为什么成功」，考结构化拆解）③\x20<b>产品\x20sense\x20闲聊</b>（「最近用什么\x20App，说说它哪里好哪里差」，考日常观察力与标准）④\x20<b>行为面</b>（冲突、失败、推动力，STAR\x20法则作答）。技术深度通常不单独考，但会在简历深挖里被验证真伪。<br><span\x20class=\x27lb\x27>⚓\x20备考优先级</span><br>转岗者最弱的是③：技术岗求职者往往三年没认真体验过产品。从今天开始每天拆一个产品细节，攒三十条再上面试场。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>案例分析别套模型公司技术栈（没人问你\x20transformer）。反过来的信息差才是你的武器：聊到\x20AI\x20产品时再放技术深度。'},{'c':'job','s':0x1,'lv':'⭐','q':_0x2c1a4e(0x130),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>STAR：Situation（背景一句）、Task（你的职责与目标）、Action（你具体做了什么，占\x2070%\x20篇幅，重点写决策与权衡）、Result（量化结果\x20+\x20学到什么）。三道必考题与要点：①\x20<b>最大挫折/失败</b>：真失败\x20+\x20归因到自己可改的行为\x20+\x20后来怎么改的，忌假失败（「太追求完美」）②\x20<b>意见冲突</b>：展示先理解对方逻辑、再用数据或实验推进，忌「我说服了他」式胜利叙事\x20③\x20<b>主动性</b>：没人要求你做了什么分外之事。<br><span\x20class=\x27lb\x27>⚓\x20素材库</span><br>你的现成弹药：推动「算法输出\x20JSON、LLM\x20只做转述」的职责分离规范（协作）；数据集从\x20858\x20条基线砍到\x20611\x20条场景化样本的取舍（决策权衡）。'},{'c':'job','s':0x1,'lv':'🔥','q':'「为什么做产品不做算法」：这道送命题的三层答法','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三层递进：①\x20<b>正面回答动机</b>（具体事件触发的兴趣，见转岗叙事）②\x20<b>展示对产品工作的清醒认知</b>（你知道它意味着什么：大量沟通、模糊性、为别人的体验负责，仍选择它）③\x20<b>落回独特价值</b>（你的算法背景在\x20AI\x20产品团队是稀缺资产，你清楚自己的比较优势在哪）。<br><span\x20class=\x27lb\x27>➤\x20追问预案</span><br>“过两年模型能力人人都会懂，你的优势还在吗？”——答：技术判断力会贬值，但「与技术团队共创产品的信任关系」和「数据闭环的工程直觉」沉淀在方法论里，且我到时会积累出真正的产品能力。展示你想过纵深问题。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>任何贬低算法岗的表述（「做工程太枯燥」）都会连带贬低面试官的团队构成，保持对两个岗位的双重尊重。'},{'c':'job','s':0x1,'lv':'🔥','q':'产品\x20sense\x20怎么练：每日一拆的功课表','a':_0x2c1a4e(0x125)},{'c':_0x2c1a4e(0x187),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x17d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20作品集三选一或组合：①\x20<b>产品拆解报告</b>（选目标公司产品，用第三章框架写\x205~10\x20页：现状、问题、方案、指标、实验设计）②\x20<b>竞品分析</b>（三款同类产品五维对比\x20+\x20决策建议）③\x20<b>原型\x20+\x20PRD</b>（一个\x20AI\x20功能的完整设计，含能力边界与评测标准）。你还有第四张牌：<b>AI\x20项目复盘的\x20PM\x20视角重述</b>（NL2SQL\x20Agent\x20的需求论证、方案取舍、数据闭环设计）。<br><span\x20class=\x27lb\x27>⚠\x20质量红线</span><br>一份深度作品胜过五份浅的。判断标准：拿掉你的名字，它是否仍有独立阅读价值。<br><span\x20class=\x27lb\x27>⚓\x20投放策略</span><br>附在简历后或面试主动展示，别问「要不要看」，直接说「我针对贵司\x20X\x20产品做了一份拆解，可以现在讲\x205\x20分钟吗」。'},{'c':_0x2c1a4e(0x187),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x10a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好反问让面试官记住你，按层次排：①\x20<b>业务纵深</b>：「这个产品当前最大的挑战是模型能力还是场景渗透？」（展示技术判断）②\x20<b>团队定位</b>：「PM\x20和算法的分工边界在团队里是怎么划的？」（转岗者必问，答案直接影响你入职体验）③\x20<b>决策机制</b>：「一个典型的功能从想法到上线，周期多长、谁拍板？」④\x20<b>个人成长</b>：「团队里做得最好的\x20PM\x20是什么背景、强在哪？」⑤\x20<b>善意收尾</b>：「今天聊下来您觉得我和这个岗位的差距主要在哪？」（真诚且高风险高回报）。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>不问薪资福利加班（HR\x20面再谈）、不问官网能查到的信息、不问「我表现得怎么样」。'},{'c':_0x2c1a4e(0x187),'s':0x2,'lv':'⭐','q':'怎么判断一个\x20PM\x20岗位值不值得去','a':_0x2c1a4e(0x148)},{'c':'job','s':0x2,'lv':'💎','q':'算法与产品的双轨投递策略','a':_0x2c1a4e(0x175)},{'c':_0x2c1a4e(0x108),'s':0x0,'lv':'⭐','q':_0x2c1a4e(0x164),'a':_0x2c1a4e(0x1b5)},{'c':_0x2c1a4e(0x108),'s':0x1,'lv':'🔥','q':_0x2c1a4e(0x117),'a':_0x2c1a4e(0x160)},{'c':'plan','s':0x2,'lv':'🔥','q':_0x2c1a4e(0x1c6),'a':'<span\x20class=\x27lb\x27>◈\x20第一周：认知与素材（每天约\x202\x20小时）</span><br>D1\x20本手册第一、二章通读，标「不熟」<br>D2\x20第三章\x20+\x20手册闪卡刷一遍<br>D3\x20写转岗叙事三段式（触点/验证/选择），出声练\x2010\x20遍<br>D4\x20简历产品版改写完成（用\x205.1.2\x20的翻译三原则）<br>D5\x20每日一拆开始：拆目标公司主产品一个功能<br>D6\x20拆竞品（三款同类五维对比），形成一页纸<br>D7\x20组装作品集初稿（产品拆解报告\x205\x20页）<br><span\x20class=\x27lb\x27>◈\x20第二周：实战与打磨</span><br>D8~D10\x20每天两道案例分析模拟（AI\x20录音复盘，用第六步框架）<br>D11\x20行为面素材库：按\x20STAR\x20写\x206\x20个故事（挫折/冲突/推动/失败/学习/选择）<br>D12\x20产品\x20sense\x20串讲：对着镜子讲\x205\x20个产品细节观点<br>D13\x20全真模拟一次（找同学或\x20AI\x20当面试官，含反问环节）<br>D14\x20查漏：重刷手册所有「不熟」条目，作品集定稿<br><span\x20class=\x27lb\x27>⚠\x20关键</span><br>叙事和故事必须<b>出声练</b>。默读会骗自己，开口才知道哪里卡。'},{'c':'plan','s':0x3,'lv':'💎','q':'这本手册怎么用（使用说明）','a':_0x2c1a4e(0x1e1)}],STORE_KEY='llm-pm-handbook-progress-v1';function _0x29fd(_0x49b1fe,_0x56e5d6){_0x49b1fe=_0x49b1fe-(-0x2*-0x9b2+0x2229+-0x3486);const _0x1014f9=_0x4aa1();let _0x107759=_0x1014f9[_0x49b1fe];if(_0x29fd['jhJZCK']===undefined){var _0x40385f=function(_0x5be577){const _0x11bf3e='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=';let _0x46419c='',_0x377dbf='';for(let _0x569e1c=0x6a7+-0x11f9+0xb52,_0x55c759,_0x260ff1,_0x4889b9=-0x235d+0x1*-0x2511+0x486e;_0x260ff1=_0x5be577['charAt'](_0x4889b9++);~_0x260ff1&&(_0x55c759=_0x569e1c%(0x10*-0x2e+0x34d*-0x1+0x631)?_0x55c759*(0x1058*-0x2+-0x1*-0x9c9+0x1727)+_0x260ff1:_0x260ff1,_0x569e1c++%(-0x1*0x24e5+-0xc75*0x2+0x3dd3))?_0x46419c+=String['fromCharCode'](0x11*-0xa4+0xd9a+-0x1b7&_0x55c759>>(-(0
