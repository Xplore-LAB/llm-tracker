<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

8fc61(0x2af),'a':_0x38fc61(0x233)},{'c':_0x38fc61(0x2b2),'s':0x0,'lv':'⭐','q':_0x38fc61(0x263),'a':_0x38fc61(0x247)},{'c':_0x38fc61(0x2b2),'s':0x0,'lv':'🔥','q':_0x38fc61(0x27c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>按工作对象分：<b>功能型</b>（交互与流程，如改一个下单页）、<b>策略型</b>（规则与模型逻辑，如推荐排序、风控阈值）、<b>数据型</b>（指标体系与实验，如增长团队）、<b>平台型</b>（面向内部或\x20B\x20端的工具与\x20API）、<b>商业型</b>（定价、售卖、生态）。AI\x20时代新增：<b>模型产品\x20PM</b>（做基础模型或训练平台）与\x20<b>AI\x20应用\x20PM</b>（把模型能力包进场景）。<br><span\x20class=\x27lb\x27>⚓\x20转岗建议</span><br>算法转产品最顺的落点是<b>策略型\x20PM\x20和\x20AI\x20应用\x20PM</b>：前者日常工作就是和算法工程师对话，后者需要懂模型边界。纯功能型岗位对交互功底要求高，你的相对优势小。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别把「策略产品经理」理解成写\x20SQL\x20的，它的核心是把业务目标翻译成可优化的目标函数，这正是你会的。'},{'c':_0x38fc61(0x2b2),'s':0x0,'lv':'🔥','q':'技术背景做\x20PM\x20的优势与常见失败模式','a':_0x38fc61(0x2b4)},{'c':_0x38fc61(0x2b2),'s':0x1,'lv':'⭐','q':_0x38fc61(0x28c),'a':_0x38fc61(0x211)},{'c':_0x38fc61(0x2b2),'s':0x1,'lv':'🔥','q':'PM\x20与算法工程师的协作界面在哪？','a':_0x38fc61(0x281)},{'c':_0x38fc61(0x2b2),'s':0x1,'lv':'🔥','q':_0x38fc61(0x23c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>通用公式：<b>优先级\x20=\x20价值\x20÷\x20成本</b>。价值看覆盖面（多少用户）×\x20频次\x20×\x20痛感强度\x20×\x20商业贡献；成本看开发量\x20×\x20风险\x20×\x20机会成本。落地常用\x20<b>RICE</b>：Reach（触达量）×\x20Impact（单人收益，0.25~3\x20分档）×\x20Confidence（信心，按数据/直觉分档）÷\x20Effort（人周）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“老板的需求怎么排？”——先问清老板要解决的问题是什么，多数时候你能用更低成本的方式满足同一目标，这叫向上管理需求而非执行需求；“ROI\x20算不清怎么办？”——先跑小流量实验或做意向调研，用增量信息降低不确定性。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试案例里只讲「做了什么」不讲「为什么先做这个」，是产品思维缺失的典型信号。'},{'c':_0x38fc61(0x2b2),'s':0x2,'lv':'🔥','q':'没有职权怎么推动跨团队协作？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20的推动力来自三样：①\x20<b>共识</b>：让对方认同这件事对他的价值（帮他背\x20KPI、给他数据、帮他减负）②\x20<b>确定性</b>：需求文档清晰、边界明确、变更少，别人和你合作省心\x20③\x20<b>升级路径</b>：拉齐无果时借助双方上级对齐目标，用事实而非情绪。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和开发冲突怎么处理？”——区分三类冲突：目标冲突（回上级对齐）、方案冲突（用数据或实验裁决）、情绪冲突（先私下沟通）。“排期被无限压缩怎么办？”——砍范围保核心，把功能分层，先上最小闭环。<br><span\x20class=\x27lb\x27>⚓\x20算法背景叙事</span><br>你在实习里推过「算法输出结构化\x20JSON、LLM\x20层只做转述」这种职责分离规范，本质就是跨角色共识设计，面试可直接当推动力案例讲。'},{'c':'basics','s':0x2,'lv':'💎','q':'向上管理：怎么和上级正确相处？','a':_0x38fc61(0x2ce)},{'c':'aipm','s':0x0,'lv':'⭐','q':_0x38fc61(0x1fc),'a':_0x38fc61(0x2a1)},{'c':_0x38fc61(0x1f7),'s':0x0,'lv':'⭐','q':_0x38fc61(0x2b5),'a':_0x38fc61(0x1f0)},{'c':_0x38fc61(0x1f7),'s':0x0,'lv':'🔥','q':_0x38fc61(0x1f2),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>输出是概率的</b>：同一输入不保证同一输出，需求文档要定义「合格率」而非「正确」，验收方式从断言变成抽样评测\x20②\x20<b>效果与体验强耦合</b>：延迟、成本、效果三者互相牵制，PM\x20要做三角权衡（更快更便宜往往更笨）③\x20<b>数据闭环即产品</b>：用户使用数据反哺模型迭代，产品架构要为回流设计，反馈通道本身就是功能。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“传统需求评审还适用吗？”——流程适用，文档结构要变：增加「能力边界声明」「badcase\x20处理策略」「评测标准」三个新章节。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>这三点差异你都在一线踩过：概率输出（评测集思维）、三角权衡（LoRA\x20vs\x20全量的成本账）、数据闭环（OKC-SFT\x20的样本构造），全部是现成案例。'},{'c':'aipm','s':0x1,'lv':'⭐','q':'模型能力边界怎么写进\x20PRD：可用边界四分法','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>把模型能力按「场景\x20×\x20表现」分四象限写清：<b>核心区</b>（高频场景且表现稳定，主推）、<b>降级区</b>（高频但表现不稳，需兜底策略）、<b>长尾区</b>（低频且表现不稳，明确拒绝或引导转人工）、<b>惊喜区</b>（低频但表现超预期，可做营销点）。每区配对交互策略：核心区直接输出，降级区加确认步骤，长尾区礼貌拒答。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“边界数据从哪来？”——评测集分场景统计正确率\x20+\x20线上\x20badcase\x20归因，两者交叉出边界地图。“边界会漂移吗？”——会，模型升级后要重新标定，版本管理是\x20AI\x20PM\x20的日常。<br><span\x20class=\x27lb\x27>⚓\x20算法背景叙事</span><br>你做过\x20611\x20条场景化样本的数据集，本质上就是给「粗氩塔氮塞」这一个场景画边界。把这段经历翻译成边界思维，面试官立刻能听懂你的价值。'},{'c':_0x38fc61(0x1f7),'s':0x1,'lv':'⭐','q':_0x38fc61(0x26a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>产品经理治幻觉不靠「让模型不胡说」，靠<b>架构性防线</b>：①\x20<b>产品形态规避</b>：高风险场景不让模型自由生成（改选择题、改提取任务）②\x20<b>检索锚定</b>：RAG\x20让输出有据可依并展示引用源\x20③\x20<b>置信度门槛</b>：低置信转人工或提示「不确定」④\x20<b>交互兜底</b>：免责声明、一键反馈、可编辑输出\x20⑤\x20<b>事后校验</b>：规则引擎或二次模型审核关键事实。<br><span\x20class=\x27lb\x27>➤\x20按场景选防线</span><br>医疗法律类五道全上；创意写作只需②⑤；客服答商品参数要①②。<br><span\x20class=\x27lb\x27>⚓\x20你的论文叙事</span><br>OKC-SFT\x20把幻觉率从\x2034.4%\x20降到\x2015.6%，说明你懂「数据侧」治理；面试补一句「剩余\x2015.6%\x20要靠产品侧防线承接」，就从算法视角切到了\x20PM\x20视角，这句话是转岗叙事的题眼。'},{'c':'aipm','s':0x1,'lv':'🔥','q':_0x38fc61(0x1e0),'a':_0x38fc61(0x21c)},{'c':_0x38fc61(0x1f7),'s':0x2,'lv':'⭐','q':_0x38fc61(0x2c0),'a':_0x38fc61(0x230)},{'c':'aipm','s':0x2,'lv':'🔥','q':_0x38fc61(0x264),'a':_0x38fc61(0x1ec)},{'c':_0x38fc61(0x1f7),'s':0x2,'lv':'🔥','q':_0x38fc61(0x212),'a':_0x38fc61(0x26f)},{'c':_0x38fc61(0x1f7),'s':0x3,'lv':'⭐','q':'数据飞轮：AI\x20产品的核心壁垒怎么转起来','a':_0x38fc61(0x2a4)},{'c':_0x38fc61(0x1f7),'s':0x3,'lv':'🔥','q':_0x38fc61(0x200),'a':_0x38fc61(0x272)},{'c':_0x38fc61(0x25b),'s':0x0,'lv':'⭐','q':_0x38fc61(0x239),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>对任何候选需求问七个问题：①\x20<b>谁</b>在用（画像具体到一个人）②\x20<b>何时何地</b>（场景越具体越真）③\x20<b>做什么</b>（任务是什么）④\x20<b>没有它会怎样</b>（痛点强度：忍着/绕路/放弃）⑤\x20<b>现在用什么替代</b>（竞品包括\x20Excel\x20和人肉）⑥\x20<b>用了之后多好</b>（可量化的收益）⑦\x20<b>愿不愿意付代价</b>（钱、学习成本、迁移成本）。七问都答得顺，需求大概率真。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“用户说的和做的不一致怎么办？”——做的优先级高于说的，访谈结论要用行为数据校验。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20特有</span><br>AI\x20需求多问一句第八问：这是<b>模型能力半径内</b>的需求吗？技术不可达的需求再痛也是伪需求。'},{'c':_0x38fc61(0x25b),'s':0x0,'lv':'🔥','q':_0x38fc61(0x276),'a':_0x38fc61(0x2d1)},{'c':_0x38fc61(0x25b),'s':0x0,'lv':'🔥','q':_0x38fc61(0x20f),'a':_0x38fc61(0x287)},{'c':'method','s':0x1,'lv':'⭐','q':_0x38fc61(0x21a),'a':_0x38fc61(0x28d)},{'c':_0x38fc61(0x25b),'s':0x1,'lv':'🔥','q':_0x38fc61(0x2ca),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>TAM</b>\x20总盘子（所有人都用）、<b>SAM</b>\x20可服务市场（你的目标客群）、<b>SOM</b>\x20可获取市场（几年内现实份额）。估算自上而下：大盘用户\x20×\x20渗透率\x20×\x20客单价\x20×\x20频次；或自下而上：种子渠道\x20×\x20转化率\x20×\x20扩散。两法互相校验，量级一致才可信。<br><span\x20class=\x27lb\x27>➤\x20面试演示</span><br>例：估「AI\x20简历优化工具」年市场。中国年求职者约\x206\x20千万（可查公开数据），愿意为工具付费的按\x205%\x20算\x20300\x20万人，年付\x20100\x20元，约\x203\x20亿元盘子，属小市场需扩场景。逻辑链清楚比数字精确重要一万倍。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试官考的是假设是否讲得通、敏感度是否自觉。每报一个数字主动说明「这个假设若错一半，结论如何变」。'},{'c':_0x38fc61(0x25b),'s':0x2,'lv':'⭐','q':_0x38fc61(0x29c),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>骨架十节：①\x20背景与问题（为什么做）②\x20目标与衡量指标（上线后看什么数）③\x20用户与场景\x20④\x20功能详述（流程图\x20+\x20交互稿）⑤\x20<b>边界与异常流</b>（AI\x20特有：能力边界四分法、badcase\x20策略、拒答规则）⑥\x20数据埋点\x20⑦\x20验收标准（AI\x20特有：评测集与抽样合格率）⑧\x20非功能需求（性能、合规、成本预算）⑨\x20排期与灰度计划\x20⑩\x20风险与预案。<br><span\x20class=\x27lb\x27>➤\x20质量判据</span><br>好\x20PRD\x20的标志：开发和测试看完<b>不需要来问你</b>。异常流写得越全，评审越顺。<br><span\x20class=\x27lb\x27>⚓\x20转岗叙事</span><br>面试被要求现场列\x20PRD\x20结构时，主动标出\x20⑤⑦\x20是\x20AI\x20需求新增项，展示你对两类产品差异的理解深度。'},{'c':_0x38fc61(0x25b),'s':0x2,'lv':'🔥','q':'MVP\x20思维：怎么裁出最小可验证版本','a':_0x38fc61(0x29d)},{'c':_0x38fc61(0x25b),'s':0x3,'lv':'⭐','q':_0x38fc61(0x216),'a':_0x38fc61(0x2a0)},{'c':_0x38fc61(0x25b),'s':0x3,'lv':'🔥','q':_0x38fc61(0x2be),'a':_0x38fc61(0x2ab)},{'c':_0x38fc61(0x25b),'s':0x3,'lv':'🔥','q':_0x38fc61(0x26b),'a':_0x38fc61(0x267)},{'c':_0x38fc61(0x21d),'s':0x0,'lv':'⭐','q':_0x38fc61(0x293),'a':_0x38fc61(0x268)},{'c':_0x38fc61(0x21d),'s':0x0,'lv':'🔥','q':_0x38fc61(0x24f),'a':_0x38fc61(0x282)},{'c':_0x38fc61(0x21d),'s':0x0,'lv':'🔥','q':_0x38fc61(0x28a),'a':_0x38fc61(0x2cd)},{'c':_0x38fc61(0x21d),'s':0x0,'lv':'🔥','q':'AI\x20功能的\x20ROI\x20账：收益侧与成本侧怎么列','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>成本侧</b>：模型调用费（输入输出\x20token）+\x20推理基础设施\x20+\x20数据标注与人力\x20+\x20研发摊销。<b>收益侧</b>四选一或多选：①\x20提效省钱（替代人工工时\x20×\x20时薪）②\x20转化提升（转化率增量\x20×\x20客单价\x20×\x20流量）③\x20留存提升（LTV\x20增量）④\x20付费新增（订阅增量收入）。公式：净收益\x20=\x20增量收入\x20+\x20节约成本\x20−\x20变动成本\x20−\x20固定投入。<br><span\x20class=\x27lb\x27>➤\x20面试算术示范</span><br>客服\x20AI\x20替代\x2030%\x20人工会话：假设日会话\x2010\x20万、人工单次成本\x202\x20元、AI\x20单次\x200.05\x20元、拦截率\x2030%，日省约\x205.85\x20万元，年化约两千万，对照研发投入两年回本。会现场列这种账的\x20PM\x20凤毛麟角。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别忘了算隐性成本：badcase\x20客诉处理、品牌损伤、合规整改，三项都可能是大头。'},{'c':_0x38fc61(0x21d),'s':0x1,'lv':'⭐','q':'大模型产品的四种收费模式与适用场景','a':_0x38fc61(0x27b)},{'c':'eval','s':0x1,'lv':'🔥','q':_0x38fc61(0x1e4),'a':_0x38fc61(0x20d)},{'c':_0x38fc61(0x21d),'s':0x2,'lv':'⭐','q':_0x38fc61(0x259),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六步框架：①\x20<b>澄清目标</b>（问清考核的是产品哪个维度：增长/体验/商业化）②\x20<b>定义用户与场景</b>（分层，别「所有用户」）③\x20<b>拆解问题</b>（漏斗或供需两端，选一个\x20MECE\x20拆法）④\x20<b>提出方案</b>（2~3\x20个，标注成本与风险）⑤\x20<b>定指标与实验</b>（怎么验证哪个方案好）⑥\x20<b>权衡与结论</b>（资源有限先做哪个，为什么）。<br><span\x20class=\x27lb\x27>➤\x20高分细节</span><br>全程<b>边说边和面试官对齐</b>：每走一步问「这个方向可以吗」。案例分析考沟通协作多于考答案。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>两个死法：上来就答题不澄清（需求理解失败）；框架背得太顺但拆解空洞（每层没有真洞见）。框架是拐杖，洞见才是腿。'},{'c':_0x38fc61(0x21d),'s':0x2,'lv':'🔥','q':'地图与出行产品的分析框架（LBS\x20专项）','a':_0x38fc61(0x25c)},{'c':_0x38fc61(0x21d),'s':0x2,'lv':'💎','q':'经典产品题拆解示范：AI\x20功能上线后指标下降怎么办','a':_0x38fc61(0x2bd)},{'c':_0x38fc61(0x210),'s':0x0,'lv':'⭐','q':_0x38fc61(0x2a6),'a':_0x38fc61(0x24d)},{'c':_0x38fc61(0x210),'s':0x0,'lv':'⭐','q':_0x38fc61(0x24e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>翻译三原则：①\x20<b>成果主语从模型变用户/业务</b>：「幻觉率\x2034.4%→15.6%」改成「通过数据质量治理将领域问答可靠性提升一倍，支撑\x20X\x20场景上线」②\x20<b>补充角色视角</b>：写清你在项目里发现的问题、做的取舍、推动的事，而非只写技术实现\x20③\x20<b>保留技术深度作为信任状</b>：关键指标留着（降本、性能数字），它们证明你懂行。<br><span\x20class=\x27lb\x27>➤\x20案例改写示范</span><br>NL2SQL\x20Agent：技术版「10\x20表\x20307\x20字段\x2098%\x20可执行率」→\x20产品版「识别出业务自助取数场景的转化瓶颈，主导设计\x20NL2SQL\x20方案，自然语言到查询的可用率达\x2098%，验证了场景可行性」。<br><span\x20class=\x27lb\x27>⚓\x20一句话</span><br>同一份经历，技术岗简历答「你怎么做的」，产品岗简历答「你为什么判断它值得做、怎么证明做成了」。'},{'c':_0x38fc61(0x210),'s':0x0,'lv':'🔥','q':_0x38fc61(0x28e),'a':_0x38fc61(0x1fd)},{'c':_0x38fc61(0x210),'s':0x1,'lv':'⭐','q':'行为面\x20STAR\x20法则与三个必被问到的题','a':_0x38fc61(0x22f)},{'c':_0x38fc61(0x210),'s':0x1,'lv':'🔥','q':_0x38fc61(0x237),'a':_0x38fc61(0x24c)},{'c':'job','s':0x1,'lv':'🔥','q':_0x38fc61(0x243),'a':_0x38fc61(0x285)},{'c':_0x38fc61(0x210),'s':0x1,'lv':'🔥','q':_0x38fc61(0x292),'a':_0x38fc61(0x2c5)},{'c':_0x38fc61(0x210),'s':0x1,'lv':'🔥','q':_0x38fc61(0x22a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好反问让面试官记住你，按层次排：①\x20<b>业务纵深</b>：「这个产品当前最大的挑战是模型能力还是场景渗透？」（展示技术判断）②\x20<b>团队定位</b>：「PM\x20和算法的分工边界在团队里是怎么划的？」（转岗者必问，答案直接影响你入职体验）③\x20<b>决策机制</b>：「一个典型的功能从想法到上线，周期多长、谁拍板？」④\x20<b>个人成长</b>：「团队里做得最好的\x20PM\x20是什么背景、强在哪？」⑤\x20<b>善意收尾</b>：「今天聊下来您觉得我和这个岗位的差距主要在哪？」（真诚且高风险高回报）。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>不问薪资福利加班（HR\x20面再谈）、不问官网能查到的信息、不问「我表现得怎么样」。'},{'c':'job','s':0x2,'lv':'⭐','q':_0x38fc61(0x1fa),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六维体检：①\x20<b>业务阶段</b>：从\x200\x20到\x201\x20的业务锻炼大但死亡率高，成熟业务学体系但可能只拧螺丝\x20②\x20<b>数据资产</b>：有用户与数据的业务，PM\x20有杠杆；纯汇报型岗位成长慢\x20③\x20<b>汇报线</b>：直属上级是不是做过产品的人，决定你的天花板\x20④\x20<b>PM\x20密度</b>：团队\x20PM\x20越少你越被当核心培养（一个团队只有一个\x20PM\x20时你什么都要干，成长最快）⑤\x20<b>算法耦合度</b>：AI\x20产品岗与算法团队的协作紧密度，决定你的技术背景能否变现\x20⑥\x20<b>可迁移性</b>：这个岗位攒的经验（行业、能力）跳槽时市场认不认。<br><span\x20class=\x27lb\x27>⚓\x20转岗者特别提醒</span><br>第一份产品工作宁选「能给完整闭环经验」的小盘子，不选「只负责写文档」的大盘子。前两年攒的是可复用的方法论。'},{'c':_0x38fc61(0x210),'s':0x2,'lv':'💎','q':_0x38fc61(0x244),'a':_0x38fc61(0x2c3)},{'c':_0x38fc61(0x23b),'s':0x0,'lv':'⭐','q':_0x38fc61(0x279),'a':_0x38fc61(0x24a)},{'c':'plan','s':0x1,'lv':'🔥','q':'案例分析模板（面试现场可直接套用）','a':'<span\x20class=\x27lb\x27>◈\x20通用六步（背熟）</span><br>①\x20澄清目标：「这个产品/功能的成功标准是什么？考核增长、体验还是收入？」<br>②\x20用户与场景：「核心用户分\x20X\x20类，最高价值的是…，典型场景是…」<br>③\x20结构化拆解：漏斗（认知→使用→留存→推荐）或供需（用户需求端\x20×\x20产品供给端），二选一并说明理由<br>④\x20方案：每个方案带「预期收益\x20/\x20成本\x20/\x20风险」三标注<br>⑤\x20验证：主指标\x20+\x20护栏指标\x20+\x20实验设计（样本量、周期）<br>⑥\x20结论：「资源有限先做方案一，因为…；方案二排在…之后」<br><span\x20class=\x27lb\x27>➤\x20AI\x20题加一步</span><br>在②③之间插入「能力边界评估」：目标方案对模型能力的要求是什么、当前模型达不达得到、不达得到怎么绕。<br><span\x20class=\x27lb\x27>⚠\x20现场纪律</span><br>每步结束和面试官对齐一次。闷头走完六步零交互，等于把协作面试答成了笔试。'},{'c':'plan','s':0x2,'lv':'🔥','q':'算法转产品的\x2014\x20天冲刺计划','a':'<span\x20class=\x27lb\x27>◈\x20第一周：认知与素材（每天约\x202\x20小时）</span><br>D1\x20本手册第一、二章通读，标「不熟」<br>D2\x20第三章\x20+\x20手册闪卡刷一遍<br>D3\x20写转岗叙事三段式（触点/验证/选择），出声练\x2010\x20遍<br>D4\x20简历产品版改写完成（用\x205.1.2\x20的翻译三原则）<br>D5\x20每日一拆开始：拆目标公司主产品一个功能<br>D6\x20拆竞品（三款同类五维对比），形成一页纸<br>D7\x20组装作品集初稿（产品拆解报告\x205\x20页）<br><span\x20class=\x27lb\x27>◈\x20第二周：实战与打磨</span><br>D8~D10\x20每天两道案例分析模拟（AI\x20录音复盘，用第六步框架）<br>D11\x20行为面素材库：按\x20STAR\x20写\x206\x20个故事（挫折/冲突/推动/失败/学习/选择）<br>D12\x20产品\x20sense\x20串讲：对着镜子讲\x205\x20个产品细节观点<br>D13\x20全真模拟一次（找同学或\x20AI\x20当面试官，含反问环节）<br>D14\x20查漏：重刷手册所有「不熟」条目，作品集定稿<br><span\x20class=\x27lb\x27>⚠\x20关键</span><br>叙事和故事必须<b>出声练</b>。默读会骗自己，开口才知道哪里卡。'},{'c':_0x38fc61(0x23b),'s':0x3,'lv':'💎','q':_0x38fc61(0x1f3),'a':_0x38fc61(0x1e8)}],STORE_KEY=_0x38fc61(0x277);function _0x4d54(){const _0x262b3f=['5lQN5zob5Qgi5l6l5yIg5P6q6z2I6k+v77YA5lIh6io9562u6Aky5Qgg5P62','z2v0sxrLBq','Bwv0Ag9K','phnWyw4Gy2XHC3m9j2XIjZ7IL4GG5Qc45B+d5zUE562upc9ZCgfUpJXICJ7LNldLM77KUQFLK4hNMOtKUiNLSylNU5pMNOtVVjRIKAaGpgi+5PwW5O2U5Bgcpc9IpU+8MUMbK+I3R+E9KEoaGvbpsE+8IowfToI2O+EcUE+8IEoaGEwUNUAxTUI3R+wgTEoaGEwfRos6PowiSoERME+8JoAGUow/G+AyRZXIpUMYNow6PUs4JUwVHUw6PJWVyJ7VViZPNAdPH4FPM4BOVABPMj/JGihKVjFLJixOVAJOV7NKUi7NLj/MGihLKiJKVzZLLOlLHBSG4PgHidXIpUw8LEAtJUwXGJWVyJ7VVjROT6/LVOtOP4tLIjlVViJML7BPL7qV6lED56A7l+I0UEEuQowKMUEBRUAGH++8IEoaGuvuqsdPOOtKVldVViJLH4BNOA7NJOFMMk/LJ6pNOPhNLj/LKB3NUR/VViNJGihMKjZNTklKUi7MJQJOJzdVViJMIB7LNldNGRNJGihMIB7OT6/NUR/JGihMIB7LKAJOVRNVViNIKAiGpgi+5zY65PMV5Bgcpc9IpU+8MUwVVoIiQUoaGEAjK+I9PUoaGEMHUUMJJUI9PUoaGEwfRos6PooaGEMQKEIHJooaGufeqvpJGilKVzpPQOZNMOtPMPdLVAlMJiFMOiFVVjPfveeG6k+V5BEU44cb5ygp6iIQ6yEn566x6ycF5BQM44cb6lEV5y+J5BYv5A+85O+q5yMn6yEp44ccpgjYpJXZCgfUignSyxnZpsDSyIC+4P6KiefjioE7K+wqIoEcUtWVC3bHBJ48yNi+6k+T6z+Z5lQK5lQs77Yi6AM+6AM25zY65PMV5ywn5OMl5OYb77Yj44cb5lIQ5OcN5yYw6lEV57Q/77Yi5lMG5OoV5A2M5lMG77Yj44cbqviG5A+86iIQ44cb5zYW54k55PM66io96zEU562u77YB5PwW5O2U5l6N55QeifbpssdOH6RLIQJLHAxLUPpKUi7LNldLNydMUixMTjFMMk/NU4/LHBGGteXnioIqVEwCSoEcUEoaGJXICJ48C3bHBIbJBgfZCZ0NBgiNpUkAKYdPNAlOR5xNRzBNLAu8l3nWyw4+pgjYpUIlPEEBRUAGH+wBOUMyN+AyR+wCSowBVUAwUEwqKE+8JoApKowjJEEGLoEPTUERNUwtGEs4Gos4QUwfT+s9K+wkN+IdVEEAHow3RUw8GU+8IowMGUAFKowUTUEAHoI9PUMbK+E6P+wVVoIiQU+8IE+8JoEuQoI/MEwXGUAHHUAETUAlHUE7MEMDOUIVLEwUMowqRo+8JoIVMUAeJ+s4JUE7K+AEHowpJoAlV+wiHUoaGG','5Qgi5l6l5yIg5P6q','5PYV6k+T6ycF5P+Lic8G5Qgi5l6l5QIH5P2/ic8G5yAY5yI66k6H5yIs','CxvLCNLtzwXLy3rVCKfSBa','zMXHC2G','y2fYzc1PBM5LCG','Dg9KBW','ue0G55Qe6io95yQB5QIH5z6l77YA6z2I6k+v5A6y5zYO6icd5A+F5lUa5lMi77YF','5BU26l+F55Qe5lQN5zob5OsF55+L5lIo5lYy5yYw77YAvfrg
