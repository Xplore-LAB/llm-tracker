<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和项目经理的区别？”——产品经理对「做什么和为什么」负责，项目经理对「什么时候交付」负责，小团队常一人兼任；“最大的价值点在哪？”——在信息最不对称的位置做决策：连接用户、业务和技术三方。<br><span\x20class=\x27lb\x27>⚠\x20转岗者提醒</span><br>算法岗习惯「给定问题求解」，PM\x20的常态是「问题本身要自己找」。面试时要展示你主动定义过问题的经历。'},{'c':_0x3a5956(0x1ba),'s':0x0,'lv':'⭐','q':'PM\x20的能力模型：面试官在考察什么？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>行业通用的五维模型：①\x20<b>用户洞察</b>（能否还原真实场景与动机）②\x20<b>商业敏感</b>（能否算清成本收益）③\x20<b>产品设计</b>（方案的结构化表达能力）④\x20<b>项目推动</b>（跨角色拿到结果）⑤\x20<b>数据能力</b>（用数据验证判断）。各厂叫法不同，底层一致。<br><span\x20class=\x27lb\x27>➤\x20面试映射</span><br>每场\x20PM\x20面试的题基本都能归到这五维：案例分析考洞察与商业，产品\x20sense\x20考设计，简历深挖考推动，数据题考实验素养。<br><span\x20class=\x27lb\x27>⚓\x20你的不对称优势</span><br>算法背景天然点亮第五维，AI\x20岗位还会加分第二维（token\x20成本、算力成本你都真算过）。短板通常在第一维和第三维，准备重心放这里。'},{'c':_0x3a5956(0x1ba),'s':0x0,'lv':'🔥','q':_0x3a5956(0x23e),'a':_0x3a5956(0x252)},{'c':_0x3a5956(0x1ba),'s':0x0,'lv':'🔥','q':_0x3a5956(0x293),'a':'<span\x20class=\x27lb\x27>◈\x20优势</span><br>①\x20和算法/开发的对话成本几乎为零，能判断工时与可行性\x20②\x20不会被「模型做不到」搪塞，能识破技术免责话术\x20③\x20能设计技术敏感的产品方案（缓存、分级模型、边界处理）④\x20AI\x20团队最缺「懂模型的产品」，你是稀缺供给。<br><span\x20class=\x27lb\x27>⚠\x20三种失败模式</span><br>①\x20<b>越位做架构</b>：给开发指定实现方案，招人反感\x20②\x20<b>用技术指标代替用户价值</b>：把「准确率提升\x203\x20个点」当成果，说不出用户获得了什么\x20③\x20<b>回避模糊性</b>：产品问题常常没有标准答案，习惯刷题思维的人会在开放问题前卡壳。<br><span\x20class=\x27lb\x27>➤\x20面试话术</span><br>被问「技术会不会是包袱」时，正面承认失败模式的存在，再讲你如何刻意练习用户视角。这个答案本身就在展示自省能力。'},{'c':_0x3a5956(0x1ba),'s':0x1,'lv':'⭐','q':_0x3a5956(0x1bf),'a':_0x3a5956(0x27f)},{'c':_0x3a5956(0x1ba),'s':0x1,'lv':'🔥','q':_0x3a5956(0x28c),'a':_0x3a5956(0x21e)},{'c':_0x3a5956(0x1ba),'s':0x1,'lv':'🔥','q':_0x3a5956(0x1d8),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>通用公式：<b>优先级\x20=\x20价值\x20÷\x20成本</b>。价值看覆盖面（多少用户）×\x20频次\x20×\x20痛感强度\x20×\x20商业贡献；成本看开发量\x20×\x20风险\x20×\x20机会成本。落地常用\x20<b>RICE</b>：Reach（触达量）×\x20Impact（单人收益，0.25~3\x20分档）×\x20Confidence（信心，按数据/直觉分档）÷\x20Effort（人周）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“老板的需求怎么排？”——先问清老板要解决的问题是什么，多数时候你能用更低成本的方式满足同一目标，这叫向上管理需求而非执行需求；“ROI\x20算不清怎么办？”——先跑小流量实验或做意向调研，用增量信息降低不确定性。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试案例里只讲「做了什么」不讲「为什么先做这个」，是产品思维缺失的典型信号。'},{'c':_0x3a5956(0x1ba),'s':0x2,'lv':'🔥','q':_0x3a5956(0x248),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20的推动力来自三样：①\x20<b>共识</b>：让对方认同这件事对他的价值（帮他背\x20KPI、给他数据、帮他减负）②\x20<b>确定性</b>：需求文档清晰、边界明确、变更少，别人和你合作省心\x20③\x20<b>升级路径</b>：拉齐无果时借助双方上级对齐目标，用事实而非情绪。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和开发冲突怎么处理？”——区分三类冲突：目标冲突（回上级对齐）、方案冲突（用数据或实验裁决）、情绪冲突（先私下沟通）。“排期被无限压缩怎么办？”——砍范围保核心，把功能分层，先上最小闭环。<br><span\x20class=\x27lb\x27>⚓\x20算法背景叙事</span><br>你在实习里推过「算法输出结构化\x20JSON、LLM\x20层只做转述」这种职责分离规范，本质就是跨角色共识设计，面试可直接当推动力案例讲。'},{'c':_0x3a5956(0x1ba),'s':0x2,'lv':'💎','q':'向上管理：怎么和上级正确相处？','a':_0x3a5956(0x27e)},{'c':_0x3a5956(0x1c1),'s':0x0,'lv':'⭐','q':_0x3a5956(0x24f),'a':_0x3a5956(0x1f4)},{'c':'aipm','s':0x0,'lv':'⭐','q':_0x3a5956(0x298),'a':_0x3a5956(0x1b7)},{'c':_0x3a5956(0x1c1),'s':0x0,'lv':'🔥','q':_0x3a5956(0x279),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>输出是概率的</b>：同一输入不保证同一输出，需求文档要定义「合格率」而非「正确」，验收方式从断言变成抽样评测\x20②\x20<b>效果与体验强耦合</b>：延迟、成本、效果三者互相牵制，PM\x20要做三角权衡（更快更便宜往往更笨）③\x20<b>数据闭环即产品</b>：用户使用数据反哺模型迭代，产品架构要为回流设计，反馈通道本身就是功能。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“传统需求评审还适用吗？”——流程适用，文档结构要变：增加「能力边界声明」「badcase\x20处理策略」「评测标准」三个新章节。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>这三点差异你都在一线踩过：概率输出（评测集思维）、三角权衡（LoRA\x20vs\x20全量的成本账）、数据闭环（OKC-SFT\x20的样本构造），全部是现成案例。'},{'c':_0x3a5956(0x1c1),'s':0x1,'lv':'⭐','q':_0x3a5956(0x1d6),'a':_0x3a5956(0x275)},{'c':'aipm','s':0x1,'lv':'⭐','q':_0x3a5956(0x262),'a':_0x3a5956(0x21f)},{'c':'aipm','s':0x1,'lv':'🔥','q':_0x3a5956(0x21b),'a':_0x3a5956(0x20f)},{'c':_0x3a5956(0x1c1),'s':0x2,'lv':'⭐','q':'Token\x20成本的产品账：一次调用多少钱','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>成本公式：<b>成本\x20=\x20(输入\x20token\x20+\x20输出\x20token\x20×\x20输出单价系数)\x20×\x20请求量</b>。输入输出单价不同（输出通常贵数倍），长对话历史会随轮次累积输入成本。降本四板斧：①\x20<b>上下文裁剪</b>（截断、摘要历史）②\x20<b>缓存</b>（相同前缀的\x20prompt\x20缓存计费打折）③\x20<b>分级模型</b>（简单请求走小模型，复杂走大模型）④\x20<b>控制输出长度</b>（限制\x20max\x20tokens、结构化输出）。<br><span\x20class=\x27lb\x27>➤\x20PM\x20必会的估算</span><br>报价\x20=\x20单次成本\x20×\x20目标毛利倒数。例：单次\x200.01\x20元、目标毛利\x2060%，则每次调用定价不低于\x200.025\x20元；再乘日活与人均次数得成本盘子。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>大多数\x20PM\x20不会算这笔账，你会。面试里主动算给面试官看，是算法转产品最硬的差异化时刻。'},{'c':_0x3a5956(0x1c1),'s':0x2,'lv':'🔥','q':_0x3a5956(0x220),'a':_0x3a5956(0x1e9)},{'c':_0x3a5956(0x1c1),'s':0x2,'lv':'🔥','q':_0x3a5956(0x294),'a':_0x3a5956(0x25f)},{'c':_0x3a5956(0x1c1),'s':0x3,'lv':'⭐','q':_0x3a5956(0x1db),'a':_0x3a5956(0x227)},{'c':_0x3a5956(0x1c1),'s':0x3,'lv':'🔥','q':_0x3a5956(0x1f6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条高压线：①\x20<b>生成内容标识</b>：深度合成内容需显著标识，这是监管硬要求\x20②\x20<b>个人信息保护</b>：用户输入进训练要单独授权，默认勾选违法；敏感个人信息（生物识别、医疗）从严\x20③\x20<b>数据出境</b>：调用境外模型\x20API\x20上传境内数据可能触发数据出境评估\x20④\x20<b>内容安全</b>：生成式\x20AI\x20服务需备案并有内容审核机制，涉政治、医疗、金融等垂直领域有额外资质要求。<br><span\x20class=\x27lb\x27>➤\x20PM\x20的落地动作</span><br>PRD\x20里加合规章节：数据流向图、用户授权文案、审核兜底策略、备案状态。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>合规是挂掉整条产品线级别的风险，面试提到任何数据方案时主动补一句合规考量，成熟度立刻不同。'},{'c':'method','s':0x0,'lv':'⭐','q':'需求分析的场景七问','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>对任何候选需求问七个问题：①\x20<b>谁</b>在用（画像具体到一个人）②\x20<b>何时何地</b>（场景越具体越真）③\x20<b>做什么</b>（任务是什么）④\x20<b>没有它会怎样</b>（痛点强度：忍着/绕路/放弃）⑤\x20<b>现在用什么替代</b>（竞品包括\x20Excel\x20和人肉）⑥\x20<b>用了之后多好</b>（可量化的收益）⑦\x20<b>愿不愿意付代价</b>（钱、学习成本、迁移成本）。七问都答得顺，需求大概率真。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“用户说的和做的不一致怎么办？”——做的优先级高于说的，访谈结论要用行为数据校验。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20特有</span><br>AI\x20需求多问一句第八问：这是<b>模型能力半径内</b>的需求吗？技术不可达的需求再痛也是伪需求。'},{'c':_0x3a5956(0x224),'s':0x0,'lv':'🔥','q':_0x3a5956(0x263),'a':_0x3a5956(0x29c)},{'c':_0x3a5956(0x224),'s':0x0,'lv':'🔥','q':_0x3a5956(0x247),'a':_0x3a5956(0x21c)},{'c':_0x3a5956(0x224),'s':0x1,'lv':'⭐','q':_0x3a5956(0x1e8),'a':_0x3a5956(0x215)},{'c':_0x3a5956(0x224),'s':0x1,'lv':'🔥','q':_0x3a5956(0x23d),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>TAM</b>\x20总盘子（所有人都用）、<b>SAM</b>\x20可服务市场（你的目标客群）、<b>SOM</b>\x20可获取市场（几年内现实份额）。估算自上而下：大盘用户\x20×\x20渗透率\x20×\x20客单价\x20×\x20频次；或自下而上：种子渠道\x20×\x20转化率\x20×\x20扩散。两法互相校验，量级一致才可信。<br><span\x20class=\x27lb\x27>➤\x20面试演示</span><br>例：估「AI\x20简历优化工具」年市场。中国年求职者约\x206\x20千万（可查公开数据），愿意为工具付费的按\x205%\x20算\x20300\x20万人，年付\x20100\x20元，约\x203\x20亿元盘子，属小市场需扩场景。逻辑链清楚比数字精确重要一万倍。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试官考的是假设是否讲得通、敏感度是否自觉。每报一个数字主动说明「这个假设若错一半，结论如何变」。'},{'c':'method','s':0x2,'lv':'⭐','q':'PRD\x20的标准结构（AI\x20版）','a':_0x3a5956(0x201)},{'c':_0x3a5956(0x224),'s':0x2,'lv':'🔥','q':_0x3a5956(0x257),'a':_0x3a5956(0x1ef)},{'c':_0x3a5956(0x224),'s':0x3,'lv':'⭐','q':'北极星指标与指标体系设计','a':_0x3a5956(0x28e)},{'c':_0x3a5956(0x224),'s':0x3,'lv':'🔥','q':_0x3a5956(0x267),'a':_0x3a5956(0x1c3)},{'c':_0x3a5956(0x224),'s':0x3,'lv':'🔥','q':_0x3a5956(0x1c5),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>转化漏斗</b>：把主流程拆成步骤看流失，优化最大流失点收益最高；注意步骤定义要贴用户动作而非系统事件\x20②\x20<b>留存曲线</b>：次日/7\x20日/30\x20日留存，健康产品的曲线最终走平（找到稳定活跃人群）；曲线持续下滑到零说明没有留存价值\x20③\x20<b>NPS</b>：推荐者占比减贬损者占比，衡量口碑意愿；缺点是粗糙，配开放追问「为什么打这个分」才有信息量。<br><span\x20class=\x27lb\x27>➤\x20AI\x20产品变体</span><br>AI\x20功能看「任务完成率」与「重试率」：用户问了没得到答案，换个问法再问，重试率高说明首次命中率差，这是\x20AI\x20版的流失信号。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>指标是地图不是地形：数据异动先查埋点变更与技术故障，再谈用户归因，一半的「用户行为剧变」其实是统计口径改了。'},{'c':_0x3a5956(0x1b5),'s':0x0,'lv':'⭐','q':_0x3a5956(0x24b),'a':_0x3a5956(0x212)},{'c':'eval','s':0x0,'lv':'🔥','q':'离线评测与在线评估的差异及组合用法','a':_0x3a5956(0x1ff)},{'c':'eval','s':0x0,'lv':'🔥','q':_0x3a5956(0x26a),'a':_0x3a5956(0x1b6)},{'c':'eval','s':0x0,'lv':'🔥','q':_0x3a5956(0x203),'a':_0x3a5956(0x1ed)},{'c':_0x3a5956(0x1b5),'s':0x1,'lv':'⭐','q':_0x3a5956(0x236),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>订阅制</b>（月费解锁额度）：面向\x20C\x20端，收入可预测，核心矛盾是重度用户亏钱，要设计公平使用政策\x20②\x20<b>按量计费\x20/\x20API</b>：面向\x20B\x20端开发者，透明但用户成本焦虑大，常用阶梯价与资源包缓解\x20③\x20<b>增值分层</b>（免费基础\x20+\x20付费高级模型）：转化漏斗逻辑，免费档当获客渠道\x20④\x20<b>效果分成</b>（按完成任务计费，如按成交）：对齐最深但计量最难。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“定价怎么锚定？”——锚定用户替代方案成本（人工价\x20×\x20折扣），而非自己的成本加成；成本只决定价格下限。<br><span\x20class=\x27lb\x27>⚓\x20趋势认知</span><br>模型推理成本持续下探，价格战下「按\x20token\x20计费」利润被压薄，向工作流与结果收费迁移是行业共识方向，面试谈定价必提。'},{'c':_0x3a5956(0x1b5),'s':0x1,'lv':'🔥','q':_0x3a5956(0x1ea),'a':_0x3a5956(0x1b9)},{'c':_0x3a5956(0x1b5),'s':0x2,'lv':'⭐','q':_0x3a5956(0x1cf),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六步框架：①\x20<b>澄清目标</b>（问清考核的是产品哪个维度：增长/体验/商业化）②\x20<b>定义用户与场景</b>（分层，别「所有用户」）③\x20<b>拆解问题</b>（漏斗或供需两端，选一个\x20MECE\x20拆法）④\x20<b>提出方案</b>（2~3\x20个，标注成本与风险）⑤\x20<b>定指标与实验</b>（怎么验证哪个方案好）⑥\x20<b>权衡与结论</b>（资源有限先做哪个，为什么）。<br><span\x20class=\x27lb\x27>➤\x20高分细节</span><br>全程<b>边说边和面试官对齐</b>：每走一步问「这个方向可以吗」。案例分析考沟通协作多于考答案。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>两个死法：上来就答题不澄清（需求理解失败）；框架背得太顺但拆解空洞（每层没有真洞见）。框架是拐杖，洞见才是腿。'},{'c':_0x3a5956(0x1b5),'s':0x2,'lv':'🔥','q':_0x3a5956(0x1f7),'a':_0x3a5956(0x24a)},{'c':_0x3a5956(0x1b5),'s':0x2,'lv':'💎','q':'经典产品题拆解示范：AI\x20功能上线后指标下降怎么办','a':_0x3a5956(0x1cc)},{'c':'job','s':0x0,'lv':'⭐','q':'算法转产品的转岗叙事：三段式故事线','a':_0x3a5956(0x1e7)},{'c':_0x3a5956(0x202),'s':0x0,'lv':'⭐','q':_0x3a5956(0x20d),'a':_0x3a5956(0x235)},{'c':_0x3a5956(0x202),'s':0x0,'lv':'🔥','q':_0x3a5956(0x27a),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20面试四件套：①\x20<b>自我介绍\x20+\x20简历深挖</b>（考转岗叙事，见\x205.1.1）②\x20<b>产品案例/设计题</b>（「为\x20X\x20人群设计\x20Y」或「分析\x20Z\x20产品为什么成功」，考结构化拆解）③\x20<b>产品\x20sense\x20闲聊</b>（「最近用什么\x20App，说说它哪里好哪里差」，考日常观察力与标准）④\x20<b>行为面</b>（冲突、失败、推动力，STAR\x20法则作答）。技术深度通常不单独考，但会在简历深挖里被验证真伪。<br><span\x20class=\x27lb\x27>⚓\x20备考优先级</span><br>转岗者最弱的是③：技术岗求职者往往三年没认真体验过产品。从今天开始每天拆一个产品细节，攒三十条再上面试场。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>案例分析别套模型公司技术栈（没人问你\x20transformer）。反过来的信息差才是你的武器：聊到\x20AI\x20产品时再放技术深度。'},{'c':_0x3a5956(0x202),'s':0x1,'lv':'⭐','q':_0x3a5956(0x261),'a':_0x3a5956(0x1de)},{'c':_0x3a5956(0x202),'s':0x1,'lv':'🔥','q':'「为什么做产品不做算法」：这道送命题的三层答法','a':_0x3a5956(0x1e2)},{'c':_0x3a5956(0x202),'s':0x1,'lv':'🔥','q':_0x3a5956(0x25c),'a':_0x3a5956(0x285)},{'c':'job','s':0x1,'lv':'🔥','q':'作品集：转岗者最硬的敲门砖怎么准备','a':_0x3a5956(0x25d)},{'c':_0x3a5956(0x202),'s':0x1,'lv':'🔥','q':'反问环节：五类问题体现你的层次','a':_0x3a5956(0x264)},{'c':_0x3a5956(0x202),'s':0x2,'lv':'⭐','q':_0x3a5956(0x1f0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六维体检：①\x20<b>业务阶段</b>：从\x200\x20到\x201\x20的业务锻炼大但死亡率高，成熟业务学体系但可能只拧螺丝\x20②\x20<b>数据资产</b>：有用户与数据的业务，PM\x20有杠杆；纯汇报型岗位成长慢\x20③\x20<b>汇报线</b>：直属上级是不是做过产品的人，决定你的天花板\x20④\x20<b>PM\x20密度</b>：团队\x20PM\x20越少你越被当核心培养（一个团队只有一个\x20PM\x20时你什么都要干，成长最快）⑤\x20<b>算法耦合度</b>：AI\x20产品岗与算法团队的协作紧密度，决定你的技术背景能否变现\x20⑥\x20<b>可迁移性</b>：这个岗位攒的经验（行业、能力）跳槽时市场认不认。<br><span\x20class=\x27lb\x27>⚓\x20转岗者特别提醒</span><br>第一份产品工作宁选「能给完整闭环经验」的小盘子，不选「只负责写文档」的大盘子。前两年攒的是可复用的方法论。'},{'c':_0x3a5956(0x202),'s':0x2,'lv':'💎','q':'算法与产品的双轨投递策略','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>双轨不是骑墙，是资产配置：①\x20<b>主轨算法</b>：你的论文、项目、实习经历对算法岗是满配，秋招主线不放松\x20②\x20<b>副轨产品</b>：投递集中在与算法强耦合的\x20AI\x20PM\x20岗（策略产品、模型产品、AI\x20应用），这类岗位你的转岗成本最低\x20③\x20<b>叙事隔离</b>：两套简历、两套故事线，同一公司内部避免同时投互斥岗位（系统里会被标记动机不纯）。<br><span\x20class=\x27lb\x27>➤\x20时间分配建议</span><br>算法面试准备投入约七成，产品三成：产品面试的核心素材（案例分析框架、产品\x20sense）可以碎片化积累，算法的刷题与八股必须整块时间。<br><span\x20class=\x27lb\x27>⚠\x20决策时机</span><br>拿到双\x20offer\x20再做选择，用真实选项代替空想；选择标准回到上一条「值不值得去」的六维体检，而非岗位名称的美感。'},{'c':_0x3a5956(0x284),'s':0x0,'lv':'⭐','q':_0x3a5956(0x1fd),'a':'<span\x20class=\x27lb\x27>◈\x20核心文档类</span><br>PRD\x20产品需求文档\x20/\x20MRD\x20市场需求文档\x20/\x20BRD\x20商业需求文档\x20/\x20User\x20Story\x20用户故事\x20/\x20Acceptance\x20Criteria\x20验收标准<br><span\x20class=\x27lb\x27>◈\x20指标与实验类</span><br>North\x20Star\x20Metric\x20北极星指标\x20/\x20DAU·MAU\x20日·月活\x20/\x20Retention\x20留存\x20/\x20Churn\x20流失\x20/\x20Conversion\x20Funnel\x20转化漏斗\x20/\x20LTV\x20用户生命周期价值\x20/\x20CAC\x20获客成本\x20/\x20NPS\x20净推荐值\x20/\x20A/B\x20Test\x20对照实验\x20/\x20Guardrail\x20Metric\x20护栏指标\x20/\x20Novelty\x20Effect\x20新奇效应\x20/\x20Simpson\x27s\x20Paradox\x20辛普森悖论<br><span\x20class=\x27lb\x27>◈\x20市场与商业类</span><br>TAM·SAM·SOM\x20总盘·可服务·可获取市场\x20/\x20PMF\x20产品市场契合\x20/\x20Go-to-Market\x20上市策略\x20/\x20Unit\x20Economics\x20单位经济模型\x20/\x20Moat\x20护城河\x20/\x20Churn\x20Rate\x20流失率\x20/\x20ARPU\x20每用户平均收入<br><span\x20class=\x27lb\x27>◈\x20AI\x20产品类</span><br>TTFT\x20首\x20token\x20延迟\x20/\x20TPOT\x20每\x20token\x20时延\x20/\x20Hallucination\x20幻觉\x20/\x20Grounding\x20依据锚定\x20/\x20Evals\x20评测\x20/\x20Rubric\x20评分标准\x20/\x20LLM-as-judge\x20模型裁判\x20/\x20Guardrail\x20兜底护栏\x20/\x20Red\x20Teaming\x20红队测试\x20/\x20Wizard\x20of\x20Oz\x20绿野仙踪（人肉模拟）<br><span\x20class=\x27lb\x27>➤\x20用法</span><br>面试中文叙述、术语用英文点睛，每个术语都要能一句话解释，只挂名不解释反而露怯。'},{'c':_0x3a5956(0x284),'s':0x1,'lv':'🔥','q':_0x3a5956(0x237),'a':'<span\x20class=\x27lb\x27>◈\x20通用六步（背熟）</span><br>①\x20澄清目标：「这个产品/功能的成功标准是什么？考核增长、体验还是收入？」<br>②\x20用户与场景：「核心用户分\x20X\x20类，最高价值的是…，典型场景是…」<br>③\x20结构化拆解：漏斗（认知→使用→留存→推荐）或供需（用户需求端\x20×\x20产品供给端），二选一并说明理由<br>④\x20方案：每个方案带「预期收益\x20/\x20成本\x20/\x20风险」三标注<br>⑤\x20验证：主指标\x20+\x20护栏指标\x20+\x20实验设计（样本量、周期）<br>⑥\x20结论：「资源有限先做方案一，因为…；方案二排在…之后」<br><span\x20class=\x27lb\x27>➤\x20AI\x20题加一步</span><br>在②③之间插入「能力边界评估」：目标方案对模型能力的要求是什么、当前模型达不达得到、不达得到怎么绕。<br><span\x20class=\x27lb\x27>⚠\x20现场纪律</span><br>每步结束和面试官对齐一次。闷头走完六步零交互，等于把协作面试答成了笔试。'},{'c':_0x3a5956(0x284),'s':0x2,'lv':'🔥','q':'算法转产品的\x2014\x20天冲刺计划','a':_0x3a5956(0x218)},{'c':_0x3a5956(0x284),'s':0x3,'lv':'💎','q':_0x3a5956(0x296),'a':_0x3a5956(0x29b)}],STORE_KEY='llm-pm-handbook-progress-v1';let progress={};try{progress=JSON[_0x3a5956(0x259)](localStorage[_0x3a5956(0x299)](STORE_KEY)||'{}');}catch(_0x8d2a1d){}function saveProgress(){const _0x271f61=_0x3a5956;localStorage[_0x271f61(0x1b8)](STORE_KEY,JSON[_0x271f61(0x1fe)](progress));}function cardId(_0x228d94){return'c'+_0x228d94;}let mode='book',currentChap=_0x3a5956(0x234),levelFilter='all';const $=_0x484c86=>document[_0x3a5956(0x209)](_0x484c86);function chapOf(_0x224dbb){const _0x29cded=_0x3a5956;return CHAPTERS[_0x29cded(0x1e0)](_0x4c7b50=>_0x4c7b50['id']===_0x224dbb);}function _0xdf81(_0x24c98d,_0x4117fc){_0x24c98d=_0x24c98d-(0xe5c+-0x24b1+0x180a);const _0x5100bd=_0x2
