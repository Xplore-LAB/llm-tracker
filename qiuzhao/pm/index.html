<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<title>AI 产品经理手册 · 算法转产品</title>
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#2a2721; --ink2:#6b6759; --ink3:#a39e8f;
  --line:#e7e4dc; --line2:#efece4;
  --accent:#2e6b5e; --accent-deep:#1f4c42; --accent-soft:#ecf4f1;
  --gold:#b08d57; --gold-soft:#faf5ec;
  --ok:#3d8a5a; --ok-soft:#edf6f0; --warn:#c05348; --warn-soft:#faf0ef;
  --radius:10px; --shadow:0 1px 2px rgba(42,39,33,.05),0 6px 20px rgba(42,39,33,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75}
#app{display:flex;flex-direction:column;height:100vh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.5px}
header .logo em{font-style:normal;color:var(--accent)}
header .logo small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
.mode-tabs{display:flex;background:var(--paper);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.mode-tabs button{border:none;background:transparent;padding:6px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:1px}
.mode-tabs button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.overall{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.progress-track{width:150px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5aa877);border-radius:3px;transition:width .3s}
/* ---------- 主体布局 ---------- */
main{display:flex;flex:1;overflow:hidden}
aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside .side-title{font-family:var(--serif);font-size:13px;color:var(--ink3);letter-spacing:3px;padding:0 10px 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
aside .chap{border-radius:8px;margin-bottom:2px}
aside .chap-head{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:8px}
aside .chap-head:hover{background:var(--paper)}
aside .chap.active>.chap-head{background:var(--accent-soft)}
aside .chap .num{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;width:20px;flex-shrink:0;text-align:center}
aside .chap .t{font-weight:600;font-size:13.5px;flex:1}
aside .chap .cnt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
aside .chap .secs{padding:2px 0 6px 39px;display:none}
aside .chap.open .secs{display:block}
aside .sec-link{display:block;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
aside .sec-link:hover{color:var(--accent);background:var(--paper)}
aside .chap .pbar{height:3px;background:var(--line2);border-radius:2px;margin:2px 10px 6px 39px;overflow:hidden}
aside .chap .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#content{flex:1;overflow-y:auto;padding:0;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto;padding:36px 40px 80px}
/* ---------- 目录页 ---------- */
.toc-hero{text-align:center;padding:38px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.toc-hero .en{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.toc-hero h1{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:2px}
.toc-hero .sub{color:var(--ink2);margin-top:12px;font-size:14px}
.toc-hero .meta{margin-top:20px;font-size:12.5px;color:var(--ink3)}
.toc-list{margin-top:28px}
.toc-item{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.toc-item:hover{background:var(--panel);box-shadow:var(--shadow)}
.toc-item .no{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);width:44px;flex-shrink:0;text-align:center}
.toc-item .info{flex:1}
.toc-item .ct{font-family:var(--serif);font-size:17px;font-weight:700}
.toc-item .cs{font-size:12.5px;color:var(--ink2);margin-top:3px}
.toc-item .stat{font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0}
.toc-item .stat b{color:var(--ok);font-size:14px}
/* ---------- 章节页 ---------- */
.ch-hero{padding:34px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ch-hero .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:1px}
.ch-hero .sub{color:var(--ink2);margin-top:10px;font-size:14px}
.ch-hero .ch-progress{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.ch-hero .ch-progress .bar{flex:1;max-width:280px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.ch-hero .ch-progress .bar i{display:block;height:100%;background:var(--ok)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .sn{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--accent)}
.sec-head .st{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px}
.sec-head .sc{font-size:12px;color:var(--ink3);margin-left:auto}
/* ---------- 条目卡片 ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .q{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.entry .q .idx{font-family:var(--serif);color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;min-width:44px}
.entry .q .qt{font-weight:600;flex:1;font-size:15px}
.entry .q .stp{font-size:11.5px;padding:2px 9px;border-radius:10px;flex-shrink:0;margin-top:2px}
.stp.known{background:var(--ok-soft);color:var(--ok)}
.stp.unknown{background:var(--warn-soft);color:var(--warn)}
.stp.new{background:var(--paper);color:var(--ink3)}
.entry .q .arrow{color:var(--ink3);flex-shrink:0;transition:transform .2s;font-size:12px;margin-top:4px}
.entry.open .q .arrow{transform:rotate(90deg)}
.entry .a{display:none;padding:14px 20px 16px 76px;border-top:1px dashed var(--line);background:#fdfdfc}
.entry.open .a{display:block}
.entry .a b{color:var(--accent)}
.entry .a .marks{margin-top:12px;display:flex;gap:8px}
.entry .a .marks button{border:1px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12.5px;background:transparent}
.entry .a .marks .mk{color:var(--ok);background:var(--ok-soft)}
.entry .a .marks .mu{color:var(--warn);background:var(--warn-soft)}
.lv{flex-shrink:0;font-size:12px;margin-top:3px}
.lb{display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.entry .a .lb:first-child{margin-top:0}
.card-face .atext .lb{margin:8px 0 2px}
.empty-chapter{padding:60px 0;text-align:center;color:var(--ink3)}
.empty-chapter .big{font-size:40px;margin-bottom:14px}
.fbtn.on{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#c7e3dc!important;font-weight:600}
.search-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;display:flex;gap:10px}
.search-box input{flex:1;max-width:440px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--panel)}
.search-box input:focus{border-color:var(--accent)}
.expand-btns{display:flex;gap:8px}
.expand-btns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.expand-btns button:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- 闪卡模式 ---------- */
#flash-view{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:20px}
.flash-opts{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:center}
.flash-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.flash-opts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.flash-opts button:hover{border-color:var(--accent);color:var(--accent)}
.card-scene{width:min(700px,94%);height:360px;perspective:1600px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:30px 38px;overflow-y:auto}
.card-face.back{transform:rotateY(180deg);background:#fdfdfc}
.card-face .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 12px;border-radius:10px;margin-bottom:14px;letter-spacing:1px}
.card-face .qtext{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65}
.card-face .hint{margin-top:auto;color:var(--ink3);font-size:12px;text-align:center;letter-spacing:1px}
.card-face .atext{font-size:15px}
.card-face .atext b{color:var(--accent)}
.flash-btns{display:flex;gap:16px}
.flash-btns button{border:1px solid transparent;border-radius:10px;padding:12px 44px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
.flash-btns button:active{transform:scale(.96)}
.flash-btns .no{background:var(--warn-soft);color:var(--warn)}
.flash-btns .yes{background:var(--ok-soft);color:var(--ok)}
.flash-meta{font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.flash-empty{color:var(--ink2);font-size:15px;text-align:center;padding:40px}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}

.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer}
.backlink:hover{color:var(--accent)}
@media (max-width:900px){aside{display:none}.page{padding:24px 18px 60px}}
/* ── 移动端顶栏折叠 ── */
.nav-toggle{display:none}
.hb-links{display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;height:auto;min-height:56px}
  header .logo{font-size:14px}
  header .logo small{display:none}
  .nav-toggle{display:inline-flex;align-items:center;gap:.35rem;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:inherit;margin-left:auto}
  .hb-links{display:none;flex-basis:100%;flex-direction:column;gap:4px;order:9}
  .hb-links.open{display:flex}
  .hb-links a{display:block;text-align:center}
  .mode-tabs{order:5}
  .overall{flex-basis:100%;order:6;justify-content:space-between}
  .toc-hero{padding:22px 0 18px}
  .toc-hero h1{font-size:22px}
  .toc-hero .sub{font-size:.76rem;padding:0 .4rem;line-height:1.55}
  .toc-hero .meta{font-size:10.5px;flex-wrap:wrap;gap:.3rem}
  .ch-hero h1{font-size:15px;line-height:1.45}
  .ch-hero .sub{font-size:.74rem;padding:0 .3rem;line-height:1.55}
  .ch-hero .kicker{font-size:9.5px;letter-spacing:1.5px}
  .ch-hero{padding:18px 12px 14px}
  .sec-head h2{font-size:.95rem}
  .sec-head .sc{flex-basis:100%;margin-left:0;font-size:.72rem}
  .chap-head{flex-wrap:wrap;gap:.3rem}
  .chap-head h2{font-size:1rem}
  .toc-item{padding:8px 9px;flex-wrap:wrap;gap:.3rem}
  .toc-item .ti{flex:1 1 100%;order:2;font-size:.76rem;line-height:1.5}
  .toc-item .num{font-size:.9rem}
  .search-box{padding:.5rem .65rem;flex-wrap:wrap;gap:.4rem}
  .search-box input{flex:1 1 100%;font-size:.82rem;padding:6px 9px}
  .overall{padding:.45rem .65rem;gap:.4rem;flex-wrap:wrap;font-size:11.5px}
  .entry{margin-bottom:.6rem}
  .entry .q{padding:10px 11px;gap:7px;flex-wrap:wrap}
  .entry .q .idx{min-width:24px;font-size:.74rem}
  .entry .q .qt{font-size:.82rem;line-height:1.45}
  .entry .a{padding:9px 11px 11px;font-size:.8rem;line-height:1.6;word-break:break-all}
  .card-face{padding:16px 14px}
  .card-scene{height:240px}
  .marks{flex-wrap:wrap;gap:.25rem}
  .marks .m{font-size:.62rem;padding:2px 5px}
  .expand-btns{overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:3px;gap:.3rem}
  .expand-btns button{font-size:.7rem;padding:4px 7px;white-space:nowrap}
  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
  #header-sub,#header-fresh{white-space:normal !important;word-break:break-all !important;overflow-wrap:break-word !important;max-width:100% !important;display:block;line-height:1.55 !important}
  .toc-hero h1,.toc-hero .sub,.toc-hero .meta,.ch-hero h1,.ch-hero .sub,.ch-hero .meta{max-width:100%;word-break:break-all;overflow-wrap:break-word;line-height:1.5}
  .toc-hero,.ch-hero{padding-left:1rem;padding-right:1rem}
  .era-card p,.panel p,.term p,.entry .a{font-size:.78rem !important;line-height:1.6}
  .badge{font-size:.6rem !important;padding:.12rem .45rem !important}
  .stat{font-size:.6rem !important;padding:.18rem .5rem !important}
}
html{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

4b(0x180),'icon':'🤖','num':'二','title':_0x2c064b(0x119),'sub':'算法背景的最大优势区\x20·\x20懂边界才能设计产品','sections':[_0x2c064b(0x1eb),_0x2c064b(0x117),'成本、延迟与体验','数据闭环与合规']},{'id':_0x2c064b(0x1aa),'icon':'📐','num':'三','title':_0x2c064b(0x13d),'sub':_0x2c064b(0x128),'sections':[_0x2c064b(0x1d3),_0x2c064b(0x161),_0x2c064b(0x168),'数据驱动与实验']},{'id':_0x2c064b(0x13e),'icon':'⚖️','num':'四','title':_0x2c064b(0x11d),'sub':_0x2c064b(0x15a),'sections':[_0x2c064b(0x1dc),_0x2c064b(0x163),_0x2c064b(0x114)]},{'id':_0x2c064b(0x1bf),'icon':'🎯','num':'五','title':_0x2c064b(0x160),'sub':'转岗叙事\x20·\x20简历改写\x20·\x20面试问答','sections':[_0x2c064b(0x1de),_0x2c064b(0x1ca),_0x2c064b(0x16f)]},{'id':_0x2c064b(0x146),'icon':_0x2c064b(0x1e9),'num':'附','title':'附录：作战工具','sub':'术语速查\x20/\x20案例模板\x20/\x20冲刺计划','sections':[_0x2c064b(0x1ec),_0x2c064b(0x12d),_0x2c064b(0x10d),_0x2c064b(0x1d8)]}],CARDS=[{'c':_0x2c064b(0x15f),'s':0x0,'lv':'⭐','q':'产品经理的核心职责到底是什么？','a':_0x2c064b(0x1d1)},{'c':_0x2c064b(0x15f),'s':0x0,'lv':'⭐','q':_0x2c064b(0x1a7),'a':_0x2c064b(0x133)},{'c':'basics','s':0x0,'lv':'🔥','q':'PM\x20的类型图谱：功能型\x20/\x20策略型\x20/\x20数据型怎么选？','a':_0x2c064b(0x198)},{'c':_0x2c064b(0x15f),'s':0x0,'lv':'🔥','q':'技术背景做\x20PM\x20的优势与常见失败模式','a':_0x2c064b(0x120)},{'c':_0x2c064b(0x15f),'s':0x1,'lv':'⭐','q':_0x2c064b(0x179),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答（背下这条主线）</span><br>①\x20<b>发现</b>：用户反馈\x20/\x20数据异动\x20/\x20业务目标拆解\x20②\x20<b>论证</b>：算收益与成本，排优先级（常见框架：价值÷成本、RICE）③\x20<b>立项</b>：讲清背景、目标、衡量指标\x20④\x20<b>PRD</b>：功能详述、边界与异常流、埋点\x20⑤\x20<b>评审</b>：需求评审\x20→\x20技术方案评审\x20→\x20测试用例评审\x20⑥\x20<b>开发跟进</b>：每日同步，变更及时同步文档\x20⑦\x20<b>测试验收</b>：PM\x20按验收标准逐条过\x20⑧\x20<b>灰度发布</b>：小流量观察核心指标\x20⑨\x20<b>全量与复盘</b>：对照立项目标出数据结论。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“哪个环节最容易出事？”——评审后的<b>变更管理</b>：开发中途改需求不改文档，测试按旧版用例跑，上线即事故。<br><span\x20class=\x27lb\x27>⚓\x20算法背景加分</span><br>AI\x20需求在第⑦⑧环有特殊性：验收面对的是概率性输出，要用评测集和抽样标准代替「对/错」二值验收，后面第四章展开。'},{'c':_0x2c064b(0x15f),'s':0x1,'lv':'🔥','q':_0x2c064b(0x143),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四个握手点：①\x20<b>需求输入</b>：PM\x20提供业务目标与场景样本，算法翻译成训练/评测目标\x20②\x20<b>效果预期对齐</b>：上线前约定离线指标与在线指标的映射（离线涨了在线不一定涨）③\x20<b>badcase\x20闭环</b>：用户投诉与人工审核回流成标注数据，驱动迭代\x20④\x20<b>边界声明</b>：算法要诚实告知能力边界（哪些输入不可靠），PM\x20据此设计兜底交互。<br><span\x20class=\x27lb\x27>⚓\x20你的独特价值</span><br>你做过模型微调，知道\x20badcase\x20回流到数据标注再到训练的完整链路成本。多数\x20PM\x20只会喊「效果不行」，你能提出「先建评测集再谈优化」这种工程化方案。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别在协作里替算法做技术决策。你的角色是把\x20badcase\x20归因清楚（场景问题还是模型问题还是数据问题），把选择权留给算法。'},{'c':_0x2c064b(0x15f),'s':0x1,'lv':'🔥','q':_0x2c064b(0x15c),'a':_0x2c064b(0x1c7)},{'c':_0x2c064b(0x15f),'s':0x2,'lv':'🔥','q':'没有职权怎么推动跨团队协作？','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20的推动力来自三样：①\x20<b>共识</b>：让对方认同这件事对他的价值（帮他背\x20KPI、给他数据、帮他减负）②\x20<b>确定性</b>：需求文档清晰、边界明确、变更少，别人和你合作省心\x20③\x20<b>升级路径</b>：拉齐无果时借助双方上级对齐目标，用事实而非情绪。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“和开发冲突怎么处理？”——区分三类冲突：目标冲突（回上级对齐）、方案冲突（用数据或实验裁决）、情绪冲突（先私下沟通）。“排期被无限压缩怎么办？”——砍范围保核心，把功能分层，先上最小闭环。<br><span\x20class=\x27lb\x27>⚓\x20算法背景叙事</span><br>你在实习里推过「算法输出结构化\x20JSON、LLM\x20层只做转述」这种职责分离规范，本质就是跨角色共识设计，面试可直接当推动力案例讲。'},{'c':_0x2c064b(0x15f),'s':0x2,'lv':'💎','q':_0x2c064b(0x1c8),'a':_0x2c064b(0x1c9)},{'c':_0x2c064b(0x180),'s':0x0,'lv':'⭐','q':_0x2c064b(0x195),'a':_0x2c064b(0x1e3)},{'c':'aipm','s':0x0,'lv':'⭐','q':_0x2c064b(0x11f),'a':_0x2c064b(0x134)},{'c':_0x2c064b(0x180),'s':0x0,'lv':'🔥','q':_0x2c064b(0x110),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>输出是概率的</b>：同一输入不保证同一输出，需求文档要定义「合格率」而非「正确」，验收方式从断言变成抽样评测\x20②\x20<b>效果与体验强耦合</b>：延迟、成本、效果三者互相牵制，PM\x20要做三角权衡（更快更便宜往往更笨）③\x20<b>数据闭环即产品</b>：用户使用数据反哺模型迭代，产品架构要为回流设计，反馈通道本身就是功能。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“传统需求评审还适用吗？”——流程适用，文档结构要变：增加「能力边界声明」「badcase\x20处理策略」「评测标准」三个新章节。<br><span\x20class=\x27lb\x27>⚓\x20你的优势</span><br>这三点差异你都在一线踩过：概率输出（评测集思维）、三角权衡（LoRA\x20vs\x20全量的成本账）、数据闭环（OKC-SFT\x20的样本构造），全部是现成案例。'},{'c':_0x2c064b(0x180),'s':0x1,'lv':'⭐','q':_0x2c064b(0x127),'a':_0x2c064b(0x192)},{'c':_0x2c064b(0x180),'s':0x1,'lv':'⭐','q':_0x2c064b(0x11a),'a':_0x2c064b(0x1df)},{'c':_0x2c064b(0x180),'s':0x1,'lv':'🔥','q':_0x2c064b(0x15e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>评测集对\x20AI\x20PM\x20的意义等同于需求文档对传统\x20PM：它定义了「什么算好」。构成要素：①\x20<b>场景覆盖</b>：按真实使用分布抽样，别只放\x20easy\x20case\x20②\x20<b>标注标准</b>：什么算对、什么算部分对，写裁决规则\x20③\x20<b>分层基线</b>：区分必过的核心集与可宽容的进阶集\x20④\x20<b>更新机制</b>：线上\x20badcase\x20定期回流。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“评测集多大合适？”——看场景方差，小场景几十条也能用，关键是分布准确；“谁维护？”——PM\x20定标准与优先级，算法执行，标注外包但抽检。<br><span\x20class=\x27lb\x27>⚓\x20你做过</span><br>你的\x2061\x20条测试集就是小而准的样板。面试讲「我怎么决定测试集覆盖哪些变体」，比讲微调细节更能打动\x20PM\x20面试官。'},{'c':_0x2c064b(0x180),'s':0x2,'lv':'⭐','q':_0x2c064b(0x129),'a':_0x2c064b(0x12f)},{'c':_0x2c064b(0x180),'s':0x2,'lv':'🔥','q':'延迟的产品感知与优化：TTFT\x20决定生死','a':_0x2c064b(0x1d9)},{'c':_0x2c064b(0x180),'s':0x2,'lv':'🔥','q':'上下文窗口的产品意义：记忆、长文档与成本三难','a':_0x2c064b(0x148)},{'c':_0x2c064b(0x180),'s':0x3,'lv':'⭐','q':_0x2c064b(0x17a),'a':_0x2c064b(0x14b)},{'c':_0x2c064b(0x180),'s':0x3,'lv':'🔥','q':_0x2c064b(0x141),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>四条高压线：①\x20<b>生成内容标识</b>：深度合成内容需显著标识，这是监管硬要求\x20②\x20<b>个人信息保护</b>：用户输入进训练要单独授权，默认勾选违法；敏感个人信息（生物识别、医疗）从严\x20③\x20<b>数据出境</b>：调用境外模型\x20API\x20上传境内数据可能触发数据出境评估\x20④\x20<b>内容安全</b>：生成式\x20AI\x20服务需备案并有内容审核机制，涉政治、医疗、金融等垂直领域有额外资质要求。<br><span\x20class=\x27lb\x27>➤\x20PM\x20的落地动作</span><br>PRD\x20里加合规章节：数据流向图、用户授权文案、审核兜底策略、备案状态。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>合规是挂掉整条产品线级别的风险，面试提到任何数据方案时主动补一句合规考量，成熟度立刻不同。'},{'c':_0x2c064b(0x1aa),'s':0x0,'lv':'⭐','q':_0x2c064b(0x14e),'a':_0x2c064b(0x137)},{'c':_0x2c064b(0x1aa),'s':0x0,'lv':'🔥','q':'真需求\x20vs\x20伪需求：三个经典判据','a':_0x2c064b(0x118)},{'c':_0x2c064b(0x1aa),'s':0x0,'lv':'🔥','q':'用户调研三件套：访谈、问卷、可用性测试的适用边界','a':_0x2c064b(0x10b)},{'c':_0x2c064b(0x1aa),'s':0x1,'lv':'⭐','q':_0x2c064b(0x191),'a':_0x2c064b(0x1e6)},{'c':_0x2c064b(0x1aa),'s':0x1,'lv':'🔥','q':_0x2c064b(0x1d0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>TAM</b>\x20总盘子（所有人都用）、<b>SAM</b>\x20可服务市场（你的目标客群）、<b>SOM</b>\x20可获取市场（几年内现实份额）。估算自上而下：大盘用户\x20×\x20渗透率\x20×\x20客单价\x20×\x20频次；或自下而上：种子渠道\x20×\x20转化率\x20×\x20扩散。两法互相校验，量级一致才可信。<br><span\x20class=\x27lb\x27>➤\x20面试演示</span><br>例：估「AI\x20简历优化工具」年市场。中国年求职者约\x206\x20千万（可查公开数据），愿意为工具付费的按\x205%\x20算\x20300\x20万人，年付\x20100\x20元，约\x203\x20亿元盘子，属小市场需扩场景。逻辑链清楚比数字精确重要一万倍。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>面试官考的是假设是否讲得通、敏感度是否自觉。每报一个数字主动说明「这个假设若错一半，结论如何变」。'},{'c':_0x2c064b(0x1aa),'s':0x2,'lv':'⭐','q':_0x2c064b(0x10f),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>骨架十节：①\x20背景与问题（为什么做）②\x20目标与衡量指标（上线后看什么数）③\x20用户与场景\x20④\x20功能详述（流程图\x20+\x20交互稿）⑤\x20<b>边界与异常流</b>（AI\x20特有：能力边界四分法、badcase\x20策略、拒答规则）⑥\x20数据埋点\x20⑦\x20验收标准（AI\x20特有：评测集与抽样合格率）⑧\x20非功能需求（性能、合规、成本预算）⑨\x20排期与灰度计划\x20⑩\x20风险与预案。<br><span\x20class=\x27lb\x27>➤\x20质量判据</span><br>好\x20PRD\x20的标志：开发和测试看完<b>不需要来问你</b>。异常流写得越全，评审越顺。<br><span\x20class=\x27lb\x27>⚓\x20转岗叙事</span><br>面试被要求现场列\x20PRD\x20结构时，主动标出\x20⑤⑦\x20是\x20AI\x20需求新增项，展示你对两类产品差异的理解深度。'},{'c':_0x2c064b(0x1aa),'s':0x2,'lv':'🔥','q':_0x2c064b(0x172),'a':_0x2c064b(0x182)},{'c':_0x2c064b(0x1aa),'s':0x3,'lv':'⭐','q':_0x2c064b(0x185),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>北极星指标是<b>唯一</b>最能代表「用户获得核心价值」的量：搜索产品是「成功搜索次数」，IM\x20是「发送消息的用户数」，工具是「完成任务的次数」。选型三标准：反映用户价值（非收入）、可操作（团队能影响）、先导性（预示长期成功）。体系分层：北极星\x20→\x20驱动指标拆解（按漏斗或按等式拆成可影响因子）→\x20护栏指标（防作恶：质量、留存、投诉率）。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“为什么不能用\x20DAU\x20当北极星？”——DAU\x20可被补贴和推送吹起来，不必然代表价值交付，易诱导短视动作。<br><span\x20class=\x27lb\x27>⚓\x20AI\x20产品特有</span><br>AI\x20产品要加一对专用护栏：<b>回答合格率</b>（质量下限）与<b>单次服务成本</b>（商业下限），北极星涨而护栏崩，等于在烧钱买增长。'},{'c':_0x2c064b(0x1aa),'s':0x3,'lv':'🔥','q':_0x2c064b(0x16b),'a':_0x2c064b(0x1ed)},{'c':_0x2c064b(0x1aa),'s':0x3,'lv':'🔥','q':_0x2c064b(0x1a2),'a':_0x2c064b(0x1d2)},{'c':_0x2c064b(0x13e),'s':0x0,'lv':'⭐','q':_0x2c064b(0x162),'a':_0x2c064b(0x10e)},{'c':'eval','s':0x0,'lv':'🔥','q':_0x2c064b(0x18c),'a':_0x2c064b(0x151)},{'c':_0x2c064b(0x13e),'s':0x0,'lv':'🔥','q':_0x2c064b(0x1d6),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>用法：固定一个强模型当裁判，给它评分标准（rubric）与参考答案，对输出打分。适用：大规模开放式生成任务（摘要质量、回复友好度）人工评不完的场景。可靠性三保障：①\x20裁判与被评模型不同源（避免自家偏好）②\x20抽样人评校准裁判一致性\x20③\x20rubric\x20具体到可操作（「准确涵盖三个要点各\x201\x20分」优于「回答质量\x201~10\x20分」）。<br><span\x20class=\x27lb\x27>⚠\x20三大坑</span><br>①\x20<b>位置偏好</b>：裁判偏爱某个位置的答案，比对时要换序两次\x20②\x20<b>长度偏好</b>：长答案得分虚高，rubric\x20要约束\x20③\x20<b>自我偏好</b>：裁判偏爱与自己风格相近的输出。<br><span\x20class=\x27lb\x27>⚓\x20你的论文叙事</span><br>OKC-SFT\x20的结构完整率、关键点覆盖率这类可验证指标设计，正是「把开放生成变成可自动评测」的思路，直接迁移到产品评测体系。'},{'c':'eval','s':0x0,'lv':'🔥','q':_0x2c064b(0x1e0),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br><b>成本侧</b>：模型调用费（输入输出\x20token）+\x20推理基础设施\x20+\x20数据标注与人力\x20+\x20研发摊销。<b>收益侧</b>四选一或多选：①\x20提效省钱（替代人工工时\x20×\x20时薪）②\x20转化提升（转化率增量\x20×\x20客单价\x20×\x20流量）③\x20留存提升（LTV\x20增量）④\x20付费新增（订阅增量收入）。公式：净收益\x20=\x20增量收入\x20+\x20节约成本\x20−\x20变动成本\x20−\x20固定投入。<br><span\x20class=\x27lb\x27>➤\x20面试算术示范</span><br>客服\x20AI\x20替代\x2030%\x20人工会话：假设日会话\x2010\x20万、人工单次成本\x202\x20元、AI\x20单次\x200.05\x20元、拦截率\x2030%，日省约\x205.85\x20万元，年化约两千万，对照研发投入两年回本。会现场列这种账的\x20PM\x20凤毛麟角。<br><span\x20class=\x27lb\x27>⚠\x20陷阱</span><br>别忘了算隐性成本：badcase\x20客诉处理、品牌损伤、合规整改，三项都可能是大头。'},{'c':_0x2c064b(0x13e),'s':0x1,'lv':'⭐','q':_0x2c064b(0x18e),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>①\x20<b>订阅制</b>（月费解锁额度）：面向\x20C\x20端，收入可预测，核心矛盾是重度用户亏钱，要设计公平使用政策\x20②\x20<b>按量计费\x20/\x20API</b>：面向\x20B\x20端开发者，透明但用户成本焦虑大，常用阶梯价与资源包缓解\x20③\x20<b>增值分层</b>（免费基础\x20+\x20付费高级模型）：转化漏斗逻辑，免费档当获客渠道\x20④\x20<b>效果分成</b>（按完成任务计费，如按成交）：对齐最深但计量最难。<br><span\x20class=\x27lb\x27>➤\x20常见追问</span><br>“定价怎么锚定？”——锚定用户替代方案成本（人工价\x20×\x20折扣），而非自己的成本加成；成本只决定价格下限。<br><span\x20class=\x27lb\x27>⚓\x20趋势认知</span><br>模型推理成本持续下探，价格战下「按\x20token\x20计费」利润被压薄，向工作流与结果收费迁移是行业共识方向，面试谈定价必提。'},{'c':_0x2c064b(0x13e),'s':0x1,'lv':'🔥','q':_0x2c064b(0x122),'a':_0x2c064b(0x1e8)},{'c':_0x2c064b(0x13e),'s':0x2,'lv':'⭐','q':_0x2c064b(0x11b),'a':_0x2c064b(0x159)},{'c':_0x2c064b(0x13e),'s':0x2,'lv':'🔥','q':_0x2c064b(0x183),'a':_0x2c064b(0x131)},{'c':'eval','s':0x2,'lv':'💎','q':_0x2c064b(0x1d5),'a':_0x2c064b(0x18d)},{'c':'job','s':0x0,'lv':'⭐','q':_0x2c064b(0x1cb),'a':_0x2c064b(0x115)},{'c':_0x2c064b(0x1bf),'s':0x0,'lv':'⭐','q':_0x2c064b(0x1a6),'a':_0x2c064b(0x1cd)},{'c':_0x2c064b(0x1bf),'s':0x0,'lv':'🔥','q':_0x2c064b(0x139),'a':_0x2c064b(0x1bb)},{'c':_0x2c064b(0x1bf),'s':0x1,'lv':'⭐','q':'行为面\x20STAR\x20法则与三个必被问到的题','a':_0x2c064b(0x149)},{'c':'job','s':0x1,'lv':'🔥','q':_0x2c064b(0x186),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>三层递进：①\x20<b>正面回答动机</b>（具体事件触发的兴趣，见转岗叙事）②\x20<b>展示对产品工作的清醒认知</b>（你知道它意味着什么：大量沟通、模糊性、为别人的体验负责，仍选择它）③\x20<b>落回独特价值</b>（你的算法背景在\x20AI\x20产品团队是稀缺资产，你清楚自己的比较优势在哪）。<br><span\x20class=\x27lb\x27>➤\x20追问预案</span><br>“过两年模型能力人人都会懂，你的优势还在吗？”——答：技术判断力会贬值，但「与技术团队共创产品的信任关系」和「数据闭环的工程直觉」沉淀在方法论里，且我到时会积累出真正的产品能力。展示你想过纵深问题。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>任何贬低算法岗的表述（「做工程太枯燥」）都会连带贬低面试官的团队构成，保持对两个岗位的双重尊重。'},{'c':'job','s':0x1,'lv':'🔥','q':_0x2c064b(0x1a4),'a':_0x2c064b(0x169)},{'c':_0x2c064b(0x1bf),'s':0x1,'lv':'🔥','q':_0x2c064b(0x112),'a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>PM\x20作品集三选一或组合：①\x20<b>产品拆解报告</b>（选目标公司产品，用第三章框架写\x205~10\x20页：现状、问题、方案、指标、实验设计）②\x20<b>竞品分析</b>（三款同类产品五维对比\x20+\x20决策建议）③\x20<b>原型\x20+\x20PRD</b>（一个\x20AI\x20功能的完整设计，含能力边界与评测标准）。你还有第四张牌：<b>AI\x20项目复盘的\x20PM\x20视角重述</b>（NL2SQL\x20Agent\x20的需求论证、方案取舍、数据闭环设计）。<br><span\x20class=\x27lb\x27>⚠\x20质量红线</span><br>一份深度作品胜过五份浅的。判断标准：拿掉你的名字，它是否仍有独立阅读价值。<br><span\x20class=\x27lb\x27>⚓\x20投放策略</span><br>附在简历后或面试主动展示，别问「要不要看」，直接说「我针对贵司\x20X\x20产品做了一份拆解，可以现在讲\x205\x20分钟吗」。'},{'c':'job','s':0x1,'lv':'🔥','q':'反问环节：五类问题体现你的层次','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>好反问让面试官记住你，按层次排：①\x20<b>业务纵深</b>：「这个产品当前最大的挑战是模型能力还是场景渗透？」（展示技术判断）②\x20<b>团队定位</b>：「PM\x20和算法的分工边界在团队里是怎么划的？」（转岗者必问，答案直接影响你入职体验）③\x20<b>决策机制</b>：「一个典型的功能从想法到上线，周期多长、谁拍板？」④\x20<b>个人成长</b>：「团队里做得最好的\x20PM\x20是什么背景、强在哪？」⑤\x20<b>善意收尾</b>：「今天聊下来您觉得我和这个岗位的差距主要在哪？」（真诚且高风险高回报）。<br><span\x20class=\x27lb\x27>⚠\x20红线</span><br>不问薪资福利加班（HR\x20面再谈）、不问官网能查到的信息、不问「我表现得怎么样」。'},{'c':_0x2c064b(0x1bf),'s':0x2,'lv':'⭐','q':'怎么判断一个\x20PM\x20岗位值不值得去','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>六维体检：①\x20<b>业务阶段</b>：从\x200\x20到\x201\x20的业务锻炼大但死亡率高，成熟业务学体系但可能只拧螺丝\x20②\x20<b>数据资产</b>：有用户与数据的业务，PM\x20有杠杆；纯汇报型岗位成长慢\x20③\x20<b>汇报线</b>：直属上级是不是做过产品的人，决定你的天花板\x20④\x20<b>PM\x20密度</b>：团队\x20PM\x20越少你越被当核心培养（一个团队只有一个\x20PM\x20时你什么都要干，成长最快）⑤\x20<b>算法耦合度</b>：AI\x20产品岗与算法团队的协作紧密度，决定你的技术背景能否变现\x20⑥\x20<b>可迁移性</b>：这个岗位攒的经验（行业、能力）跳槽时市场认不认。<br><span\x20class=\x27lb\x27>⚓\x20转岗者特别提醒</span><br>第一份产品工作宁选「能给完整闭环经验」的小盘子，不选「只负责写文档」的大盘子。前两年攒的是可复用的方法论。'},{'c':_0x2c064b(0x1bf),'s':0x2,'lv':'💎','q':'算法与产品的双轨投递策略','a':'<span\x20class=\x27lb\x27>◈\x20核心回答</span><br>双轨不是骑墙，是资产配置：①\x20<b>主轨算法</b>：你的论文、项目、实习经历对算法岗是满配，秋招主线不放松\x20②\x20<b>副轨产品</b>：投递集中在与算法强耦合的\x20AI\x20PM\x20岗（策略产品、模型产品、AI\x20应用），这类岗位你的转岗成本最低\x20③\x20<b>叙事隔离</b>：两套简历、两套故事线，同一公司内部避免同时投互斥岗位（系统里会被标记动机不纯）。<br><span\x20class=\x27lb\x27>➤\x20时间分配建议</span><br>算法面试准备投入约七成，产品三成：产品面试的核心素材（案例分析框架、产品\x20sense）可以碎片化积累，算法的刷题与八股必须整块时间。<br><span\x20class=\x27lb\x27>⚠\x20决策时机</span><br>拿到双\x20offer\x20再做选择，用真实选项代替空想；选择标准回到上一条「值不值得去」的六维体检，而非岗位名称的美感。'},{'c':'plan','s':0x0,'lv':'⭐','q':'PM\x20术语速查（中英对照）','a':_0x2c064b(0x12c)},{'c':_0x2c064b(0x146),'s':0x1,'lv':'🔥','q':_0x2c064b(0x19a),'a':_0x2c064b(0x1c4)},{'c':_0x2c064b(0x146),'s':0x2,'lv':'🔥','q':'算法转产品的\x2014\x20天冲刺计划','a':_0x2c064b(0x1b2)},{'c':_0x2c064b(0x146),'s':0x3,'lv':'💎','q':_0x2c064b(0x107),'a':_0x2c064b(0x184)}],STORE_KEY=_0x2c064b(0x1e2);let progress={};try{progress=JSON[_0x2c064b(0x1cc)](localStorage[_0x2c064b(0x152)](STORE_KEY)||'{}');}catch(_0x945c53){}function saveProgress(){const _0x4363ae=_0x2c064b;localStorage[_0x4363ae(0x1ab)](STORE_KEY,JSON['stringify'](progress));}function cardId(_0xde3c7b){return'c'+_0xde3c7b;}let mode=_0x2c064b(0x1b6),currentChap=_0x2c064b(0x1d7),levelFilter=_0x2c064b(0x1d7);const $=_0x573639=>document[_0x2c064b(0x177)](_0x573639);function chapOf(_0xa5efca){const _0x9ec0ef=_0x2c064b;return CHAPTERS[_0x9ec0ef(0x178)](_0x165db9=>_0x16
