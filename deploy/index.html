<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e9e3ce;color:#3b3926;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(rgba(92,92,56,.14) 1px,transparent 1.5px);background-size:22px 22px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(640px 420px at 12% 6%,rgba(138,75,45,.08),transparent 60%),radial-gradient(720px 520px at 88% 30%,rgba(92,92,56,.10),transparent 60%)}
header{background:linear-gradient(160deg,#46462a,#5c5c38 55%,#46462a);color:#f0ecd8;padding:2.2rem 2rem 1.8rem;text-align:center;position:relative;z-index:1;border-bottom:4px solid #8a4b2d}
header h1{font-size:2rem;font-weight:900;letter-spacing:.2em;text-shadow:0 2px 8px rgba(0,0,0,.35)}
header p{opacity:.78;font-size:.85rem;margin-top:.4rem;letter-spacing:.14em;color:#ddd5b4}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:rgba(233,227,206,.94);backdrop-filter:blur(8px);border-bottom:1px solid #c9c19f;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #5c5c38;background:#f2eedd;font-weight:600;font-size:.82rem;text-decoration:none;color:#55522f;transition:all .2s}
.tab:hover,.tab.active{background:#5c5c38;color:#f0ecd8}
.stats{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:1rem 1rem .2rem;position:relative;z-index:1}
.stat{background:#f2eedd;border:1px solid #c9c19f;border-radius:1rem;padding:.35rem 1rem;font-size:.78rem;color:#7a7457;box-shadow:0 2px 8px rgba(92,92,56,.1)}
.stat b{color:#4c4a2c;font-size:.95rem;margin-right:.15rem}
.era-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem;max-width:1180px;margin:1.2rem auto 3rem;padding:0 1.2rem;position:relative;z-index:1}
.era-card{position:relative;background:#f2eedd;border:1px solid #c9c19f;border-radius:8px;padding:1rem 1.15rem;cursor:pointer;box-shadow:0 5px 16px rgba(92,92,56,.14),inset 3px 0 0 var(--ec);transition:transform .25s,box-shadow .25s}
.era-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(92,92,56,.24),inset 3px 0 0 var(--ec)}
.era-num{color:var(--ec);font-size:.72rem;font-weight:800;margin-right:.4rem;opacity:.85;letter-spacing:.05em}
.era-go{position:absolute;top:.95rem;right:1rem;font-size:.72rem;font-weight:700;color:var(--ec)}
.era-head{max-width:980px;margin:1.2rem auto .8rem;padding:0 1.2rem;position:relative;z-index:1;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.back-btn{font-size:.78rem;font-weight:600;color:#55522f;background:#f2eedd;border:1.5px solid #5c5c38;border-radius:1rem;padding:.35rem .9rem;cursor:pointer;align-self:center}
.back-btn:hover{background:#5c5c38;color:#f0ecd8}
.era-head h2{font-size:1.32rem;font-weight:900;color:#33321f;letter-spacing:.12em}
.era-head .sub{font-size:.78rem;color:#7a7457}
.wrap{max-width:980px;margin:0 auto 3rem;padding:0 1.2rem;position:relative;z-index:1}
.panel{background:#f2eedd;border:1px solid #c9c19f;border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 5px 16px rgba(92,92,56,.12)}
.panel h3{font-size:1rem;font-weight:900;color:#33321f;margin-bottom:.5rem;letter-spacing:.08em}
.panel .intro{font-size:.8rem;color:#6d6848;line-height:1.65;margin-bottom:.5rem}
.note-line{font-size:.78rem;color:#8a4b2d;line-height:1.6;border-top:1px dashed #c9c19f;padding-top:.5rem;margin-top:.5rem}.note-link{display:inline-flex;align-items:center;margin:.35rem 0 0 .4rem;padding:.12rem .55rem;border:1px solid #a66a43;border-radius:999px;color:#74401f;background:#fff8e8;font-size:.74rem;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s ease,color .18s ease,transform .18s ease}.note-link:hover,.note-link:focus-visible{background:#8a4b2d;color:#fff;transform:translateY(-1px)}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;background:rgba(250,247,234,.7)}
.tbl th{background:rgba(92,92,56,.16);color:#4c4a2c;font-weight:700;text-align:left;padding:.45rem .6rem;border:1px solid #c9c19f;white-space:nowrap}
.tbl td{padding:.45rem .6rem;border:1px solid #d8d1b2;color:#5c5741;line-height:1.5;vertical-align:top}
.tbl tr:nth-child(even) td{background:rgba(92,92,56,.06)}
.tbl-wrap{overflow-x:auto}
.phase{position:relative;background:#f2eedd;border:1px solid #c9c19f;border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 5px 16px rgba(92,92,56,.12),inset 3px 0 0 #8a4b2d}
.phase::after{content:'FIELD MANUAL';position:absolute;right:.9rem;top:.8rem;font-size:.58rem;font-weight:700;letter-spacing:.18em;color:rgba(138,75,45,.42);border:1.5px solid rgba(138,75,45,.32);border-radius:4px;padding:.12rem .45rem;transform:rotate(-5deg)}
.phase h3{font-size:1rem;font-weight:900;color:#33321f;margin-bottom:.4rem;letter-spacing:.1em}
.phase li{font-size:.79rem;color:#5c5741;line-height:1.65}
.phase ul{padding-left:1.1rem}
.doc{background:#f2eedd;border:1px solid #c9c19f;border-radius:8px;margin-bottom:.9rem;box-shadow:0 4px 14px rgba(92,92,56,.1),inset 3px 0 0 #5c5c38;overflow:hidden}
.doc-head{padding:.85rem 1.1rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.doc-head:hover{background:rgba(92,92,56,.07)}
.doc-title{font-weight:900;font-size:.95rem;color:#33321f;letter-spacing:.04em}
.doc-date{font-size:.7rem;color:#a0986e}
.doc-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}
.dtag{font-size:.66rem;font-weight:600;color:#55522f;background:rgba(92,92,56,.14);border-radius:.6rem;padding:.12rem .55rem}
.doc-arr{color:#5c5c38;transition:transform .2s}
.doc.open .doc-arr{transform:rotate(180deg)}
.doc-body{display:none;padding:0 1.1rem .95rem}
.doc.open .doc-body{display:block}
.doc-sum{font-size:.8rem;color:#6d6848;line-height:1.65;margin-bottom:.5rem}
.doc-sec h4{font-size:.88rem;font-weight:900;color:#4c4a2c;margin:.6rem 0 .3rem;letter-spacing:.06em}
.doc-sec h4::before{content:'▸ ';color:#8a4b2d}
.doc-sec p{font-size:.79rem;color:#5c5741;line-height:1.65;margin-bottom:.4rem}
.doc.link{cursor:pointer}
.doc.link:hover{border-color:#5c5c38}
.doc.placeholder{border-style:dashed;opacity:.75;box-shadow:none}
.doc.placeholder .doc-head{cursor:default}
.doc-go{margin-left:auto;font-size:.74rem;font-weight:700;color:#8a4b2d}
footer{text-align:center;padding:1.5rem;color:#8f8865;font-size:.78rem;position:relative;z-index:1}
footer a{color:#5c5c38}
html.dark body{background:#232318;color:#ddd5b4}
html.dark body::before{background-image:radial-gradient(rgba(221,213,180,.08) 1px,transparent 1.5px)}
html.dark header{background:linear-gradient(160deg,#1b1b10,#2c2c1a 55%,#1b1b10);border-bottom-color:#8a4b2d}
html.dark .tabs{background:rgba(35,35,24,.94);border-color:#4a4630}
html.dark .tab{background:#2c2c1e;color:#c9c19f;border-color:#5c5c38}
html.dark .tab:hover,html.dark .tab.active{background:#5c5c38;color:#f0ecd8}
html.dark .stat,html.dark .era-card,html.dark .panel,html.dark .phase,html.dark .doc{background:#2c2c1e;border-color:#4a4630}
html.dark .stat{color:#a0986e}
html.dark .stat b,html.dark .era-name,html.dark .panel h3,html.dark .phase h3,html.dark .doc-title,html.dark .doc-sec h4,html.dark .era-head h2{color:#e5dfc2}
html.dark .era-desc,html.dark .era-head .sub{color:#a0986e}
html.dark .era-link path{stroke:#6d6848}
html.dark .era-link circle{fill:#6d6848}
html.dark .back-btn{background:#2c2c1e;color:#c9c19f}
html.dark .tbl th{background:rgba(92,92,56,.35);color:#ddd5b4;border-color:#4a4630}
html.dark .tbl td{border-color:#3d3a26;color:#c4bd9c}
html.dark .tbl tr:nth-child(even) td{background:rgba(92,92,56,.14)}
html.dark .tbl{background:rgba(44,44,30,.6)}
html.dark .phase li,html.dark .panel .intro,html.dark .doc-sum,html.dark .doc-sec p{color:#c4bd9c}
html.dark .dtag{color:#c9c19f;background:rgba(92,92,56,.35)}
html.dark .note-line{border-top-color:#4a4630}
@media(max-width:700px){.era-grid{grid-template-columns:1fr}}
/* ── 移动端导航折叠 ── */
.nav-toggle{display:none}
@media(max-width:768px){
  header{padding:1.3rem 1rem 1.1rem}
  header h1{font-size:1.4rem;letter-spacing:.1em}
  header p{font-size:.76rem}
  .nav-toggle{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.7rem auto .3rem;padding:.5rem 1.4rem;border-radius:2rem;border:2px solid #5c5c38;background:#f2eedd;color:#55522f;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit;position:sticky;top:0;z-index:11;box-shadow:0 2px 8px rgba(92,92,56,.18)}
  .tabs{display:none;flex-direction:column;align-items:stretch;gap:.4rem;padding:.7rem;position:static}
  .tabs.open{display:flex}
  .tab{text-align:center}
  .wrap{padding:0 .7rem}
  .panel{padding:.8rem .9rem}
  .panel h3{font-size:.95rem}
  .panel .intro{font-size:.76rem}
  .era-grid{padding:0 .7rem}
  html.dark .nav-toggle{background:#2c2c1e;color:#c9c19f;border-color:#5c5c38}
  .stats{padding:.7rem .6rem .15rem;gap:.3rem}
  .stat{font-size:.66rem;padding:.22rem .6rem}
  .era-grid{padding:0 .7rem;gap:.6rem;grid-template-columns:1fr}
  .era-card{padding:.85rem .9rem}
  .doc-head{flex-wrap:wrap;gap:.3rem}

  header{max-width:100%;overflow:hidden;padding-left:.8rem;padding-right:.8rem}
