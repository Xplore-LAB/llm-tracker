<script>try{if(localStorage.getItem('llm_theme')==='dark'||(!localStorage.getItem('llm_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
/* ambient background */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 400px at 15% 8%,rgba(124,58,237,.08),transparent 60%),
    radial-gradient(700px 500px at 85% 30%,rgba(8,145,178,.07),transparent 60%),
    radial-gradient(600px 500px at 20% 85%,rgba(217,119,6,.06),transparent 60%)}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;padding:2.2rem 2rem 1.8rem;text-align:center;position:relative;z-index:1}
header h1{font-size:2rem;letter-spacing:.08em;background:linear-gradient(90deg,#ffd89e,#fff,#b8c6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{opacity:.75;font-size:.85rem;margin-top:.4rem}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.8rem;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #302b63;background:white;font-weight:600;font-size:.82rem;text-decoration:none;color:#302b63;transition:all .2s}
.tab:hover,.tab.active{background:#302b63;color:white}
/* legend */
.legend{display:flex;justify-content:center;gap:.45rem;flex-wrap:wrap;padding:1rem 1rem .4rem;position:relative;z-index:1}
.lg-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:600;padding:.25rem .75rem;border-radius:1rem;border:1.5px solid var(--c);color:var(--c);background:white;cursor:pointer;user-select:none;transition:all .15s}
.lg-chip.on{background:var(--c);color:white}
.lg-chip.all{border-color:#302b63;color:#302b63}
.lg-chip.all.on{background:#302b63;color:white}
/* ── the tree ── */
.tree{position:relative;max-width:960px;margin:1rem auto 0;padding:1rem 0 4rem;z-index:1}
.spine{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);border-radius:4px;
  background:linear-gradient(180deg,#7c3aed,#0891b2,#d97706,#db2777,#16a34a,#302b63);
  box-shadow:0 0 12px rgba(48,43,99,.35),0 0 30px rgba(124,58,237,.18)}
/* year chapter */
.year-node{position:relative;text-align:center;margin:2.6rem 0 1.6rem;z-index:2}
.year-node .yr{display:inline-block;font-size:2rem;font-weight:800;letter-spacing:.06em;color:#302b63;background:white;border:3px solid #302b63;border-radius:2rem;padding:.15rem 1.4rem;box-shadow:0 4px 18px rgba(48,43,99,.18)}
/* event row: alternate sides */
.ev{position:relative;width:50%;padding:.5rem 3rem 1.4rem;opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;z-index:2}
.ev.show{opacity:1;transform:none}
.ev.left{left:0;text-align:right}
.ev.right{left:50%;text-align:left}
/* branch connector */
.ev::before{content:'';position:absolute;top:1.35rem;width:2.2rem;height:2px;background:var(--c);opacity:.75}
.ev.left::before{right:.8rem}
.ev.right::before{left:.8rem}
.ev::after{content:'';position:absolute;top:calc(1.35rem - 7px);width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid white;
  box-shadow:0 0 0 3px var(--c),0 0 14px var(--c)}
.ev.left::after{right:-8px}
.ev.right::after{left:-8px}
.card{display:inline-block;background:white;border-radius:14px;padding:.8rem 1.05rem;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1px solid #eee;max-width:100%;text-align:left;transition:transform .25s,box-shadow .25s;border-top:3px solid var(--c)}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(48,43,99,.18)}
.ev-date{font-size:.7rem;color:#999;letter-spacing:.04em;margin-bottom:.2rem}
.ev-cat{display:inline-block;font-size:.66rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,white);border-radius:1rem;padding:.1rem .5rem;margin-bottom:.3rem}
.ev-title{font-size:.95rem;font-weight:700;color:#23203d;line-height:1.4}
.ev-org{font-size:.74rem;font-weight:600;color:var(--c);margin:.15rem 0 .25rem}
.ev-note{font-size:.8rem;color:#555;line-height:1.6}
.ev-link{display:inline-block;margin-top:.4rem;font-size:.74rem;font-weight:600;color:#302b63;text-decoration:none}
.ev-link:hover{text-decoration:underline}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.78rem;position:relative;z-index:1}
/* dark mode */
html.dark body{background:#12141f;color:#d6d9e2}
html.dark .bg{background:
  radial-gradient(600px 400px at 15% 8%,rgba(124,58,237,.16),transparent 60%),
  radial-gradient(700px 500px at 85% 30%,rgba(8,145,178,.13),transparent 60%),
  radial-gradient(600px 500px at 20% 85%,rgba(217,119,6,.1),transparent 60%)}
html.dark .tabs{background:#1a1d2c;border-color:#2b2f45}
html.dark .tab{background:#1a1d2c;color:#b3ade6;border-color:#4c4783}
html.dark .tab:hover,html.dark .tab.active{background:#5b54b8;color:#fff;border-color:#5b54b8}
html.dark .lg-chip{background:#1e2233}
html.dark .lg-chip.on{color:#fff}
html.dark .year-node .yr{background:#1e2233;color:#b3ade6;border-color:#5b54b8}
html.dark .card{background:#1e2233;border-color:#2b2f45}
html.dark .ev-title{color:#e4e6ee}
html.dark .ev-note{color:#a9adbd}
html.dark .ev::after{border-color:#1e2233}
html.dark .ev-cat{background:color-mix(in srgb,var(--c) 22%,#1e2233)}
html.dark .ev-link{color:#9d95e8}
/* mobile: spine to the left */
@media(max-width:700px){
  .spine{left:16px}
  .year-node{text-align:left;padding-left:44px}
  .ev{width:100%;left:0!important;text-align:left!important;padding:.5rem .8rem 1.3rem 44px}
  .ev::before{left:20px;width:1.1rem}
  .ev::after{left:9px;right:auto!important}
}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <h1>📜 大模型编年史</h1>
  <p id="header-sub">从 Transformer 到百万上下文 · 一棵纵向生长的时间树</p>
</header>
<div class="tabs">
  <a class="tab" href="../">📄 论文追踪</a>
  <a class="tab" href="../models/">🧬 模型时序</a>
  <a class="tab" href="../timeline/">📅 时间轴</a>
  <a class="tab active" href="./">📜 编年史</a>
</div>
<div class="legend" id="legend"></div>
<div class="tree" id="tree"><div class="spine"></div></div>
<footer>🤖 <a href="https://xplore-lab.github.io/llm-tracker/" style="color:#302b63;font-weight:600;">大模型情报局</a> © 2026 <a href="https://github.com/Xplore-LAB" style="color:#302b63;">Xplore-LAB</a> · Data from arXiv · <a href="https://github.com/Xplore-LAB/llm-tracker" style="color:#302b63">GitHub</a></footer>
<script>
let CATS={}, EVENTS=[], ACTIVE=new Set();
fetch('../chronicle.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  CATS=d.categories; EVENTS=d.events;
  Object.keys(CATS).forEach(c=>ACTIVE.add(c));
  renderLegend(); renderTree();
}).catch(()=>{
  document.getElementById('tree').innerHTML+='<div style="text-align:center;color:#999;padding:3rem">编年史数据加载失败</div>';
});

function renderLegend(){
  const el=document.getElementById('legend');
  const all=`<span class="lg-chip all ${ACTIVE.size===Object.keys(CATS).length?'on':''}" onclick="toggleAll()">全部</span>`;
  el.innerHTML=all+Object.entries(CATS).map(([k,c])=>
    `<span class="lg-chip ${ACTIVE.has(k)?'on':''}" style="--c:${c.color}" onclick="toggleCat('${k}')">${c.icon} ${c.label}</span>`).join('');
}
function toggleCat(k){
  ACTIVE.has(k)?ACTIVE.delete(k):ACTIVE.add(k);
  renderLegend(); renderTree();
}
function toggleAll(){
  if(ACTIVE.size===Object.keys(CATS).length)ACTIVE.clear();
  else Object.keys(CATS).forEach(c=>ACTIVE.add(c));
  renderLegend(); renderTree();
}

function renderTree(){
  const tree=document.getElementById('tree');
  tree.innerHTML='<div class="spine"></div>';
  const years=[...new Set(EVENTS.map(e=>e.year))].sort((a,b)=>a-b);
  years.forEach(y=>{
    const evs=EVENTS.filter(e=>e.year===y&&ACTIVE.has(e.cat));
    if(!evs.length)return;
    const yn=document.createElement('div');
    yn.className='year-node';
    yn.innerHTML=`<span class="yr">${y}</span>`;
    tree.appendChild(yn);
    evs.forEach((e,i)=>{
      const c=CATS[e.cat];
      const div=document.createElement('div');
      div.className='ev '+(i%2===0?'left':'right');
      div.style.setProperty('--c',c.color);
      div.innerHTML=`<div class="card">
        <div class="ev-date">${e.date}</div>
        <span class="ev-cat">${c.icon} ${c.label}</span>
        <div class="ev-title">${e.title}</div>
        <div class="ev-org">${e.org}</div>
        <div class="ev-note">${e.note}</div>
        <a class="ev-link" href="${e.url}" target="_blank" rel="noopener">论文 / 官方来源 ↗</a>
      </div>`;
      tree.appendChild(div);
    });
  });
  observe();
}
let IO=null;
function observe(){
  if(IO)IO.disconnect();
  IO=new IntersectionObserver(es=>{
    es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('show');IO.unobserve(x.target);}});
  },{threshold:.12});
  document.querySelectorAll('.ev').forEach(el=>IO.observe(el));
}
</script>
</body>
</html>
