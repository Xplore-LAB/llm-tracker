<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3efe2;color:#26324b;min-height:100vh;overflow-x:hidden}
/* 方格研究日志纸 */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(46,94,138,.07) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(46,94,138,.07) 0 1px,transparent 1px 26px)}
body::after{content:'';position:fixed;top:0;bottom:0;left:64px;width:1.5px;pointer-events:none;z-index:0;
  background:rgba(176,58,46,.16)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(640px 420px at 10% 4%,rgba(46,94,138,.06),transparent 60%),
    radial-gradient(700px 500px at 90% 26%,rgba(176,58,46,.05),transparent 60%),
    radial-gradient(620px 520px at 16% 90%,rgba(61,122,82,.05),transparent 60%)}
header{background:#f8f4e8;color:#26324b;padding:2.1rem 2rem 1.35rem;text-align:center;position:relative;z-index:1;
  border-bottom:3px double #26324b}
header .kicker{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:#8a8270;margin-bottom:.5rem;font-weight:700}
header h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:2.05rem;letter-spacing:.12em;color:#26324b}
header p{opacity:.78;font-size:.85rem;margin-top:.45rem;letter-spacing:.1em;color:#4a5568}
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.9rem .8rem .8rem;background:rgba(248,244,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid #d8d2c0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #26324b;background:rgba(251,248,239,.9);font-weight:600;font-size:.82rem;text-decoration:none;color:#26324b;transition:all .2s;cursor:pointer;font-family:inherit}
.tab:hover,.tab.active{background:#26324b;color:#f8f4e8}
.nav-toggle{display:none}
.backbar{display:flex;justify-content:center;gap:.6rem;padding:.7rem 1rem 0;position:relative;z-index:1;flex-wrap:wrap;font-size:.76rem}
.backbar a{color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5);font-weight:600}
.backbar a:hover{border-bottom-style:solid}
.toolbar{display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.7rem 1rem .25rem;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:600;padding:.25rem .75rem;border-radius:1rem;border:1.5px solid var(--c,#8a8270);color:var(--c,#8a8270);background:rgba(251,248,239,.85);cursor:pointer;user-select:none;transition:all .15s}
.chip.on{background:var(--c,#8a8270);color:#fbf8ef}
.chip.all{border-color:#26324b;color:#26324b}
.chip.all.on{background:#26324b;color:#f8f4e8}
.search{display:flex;align-items:center;gap:.35rem;background:rgba(251,248,239,.9);border:1.5px solid #b8b2a0;border-radius:1rem;padding:.18rem .7rem;font-size:.78rem;color:#4a5568}
.search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:.78rem;color:#26324b;width:10rem}
.stats{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:.55rem 1rem .2rem;position:relative;z-index:1;align-items:center}
.stat{background:rgba(251,248,239,.88);border:1px solid #ddd4bd;border-radius:1rem;padding:.35rem 1rem;font-size:.78rem;color:#4a5568;box-shadow:0 2px 8px rgba(38,50,75,.07)}
.stat b{color:#26324b;font-size:.95rem;margin-right:.15rem}
.caveat{max-width:1180px;margin:.8rem auto 0;padding:0 1.2rem;position:relative;z-index:1}
.caveat-in{background:rgba(176,58,46,.05);border:1px dashed rgba(176,58,46,.45);border-radius:10px;padding:.6rem .95rem;font-size:.73rem;line-height:1.75;color:#57503f}
.caveat-in b{color:#b03a2e}
.legend{display:flex;justify-content:center;gap:.45rem;flex-wrap:wrap;padding:.7rem 0 .2rem;position:relative;z-index:1}
.lg{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;color:#57503f}
.lg i{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
/* 分组小节 */
.wrap{max-width:1180px;margin:0 auto 4rem;padding:0 1.2rem;position:relative;z-index:1}
.sec{display:flex;align-items:center;gap:.7rem;margin:1.6rem 0 .8rem}
.sec b{font-family:Georgia,'Songti SC',serif;font-size:1.08rem;color:#26324b;letter-spacing:.06em;white-space:nowrap}
.sec span{font-size:.7rem;color:#8a8270}
.sec::after{content:'';flex:1;height:1px;background:#d8d2c0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
/* 会议卡片 */
.ccard{background:rgba(251,248,239,.94);border:1px solid #ddd4bd;border-radius:12px;padding:1rem 1.15rem .9rem;
  box-shadow:0 4px 14px rgba(38,50,75,.09),inset 3px 0 0 var(--c);transition:transform .2s,box-shadow .2s;scroll-margin-top:80px}
.ccard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(38,50,75,.16),inset 3px 0 0 var(--c)}
.ccard.hl{outline:3px solid rgba(176,58,46,.55);outline-offset:2px}
.c-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.c-name{font-family:Georgia,'Songti SC',serif;font-size:1.15rem;font-weight:700;color:var(--c)}
.c-full{font-size:.68rem;color:#8a8270;line-height:1.4}
.c-stage{font-size:.64rem;font-weight:700;color:var(--c);border:1.3px solid var(--c);border-radius:.55rem;padding:.08rem .45rem;white-space:nowrap}
.c-meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.72rem;color:#57503f;margin:.45rem 0 .5rem;padding:.4rem .6rem;background:rgba(46,94,138,.05);border-radius:8px;line-height:1.6}
.c-meta b{color:#26324b;font-weight:700}
.c-intro{font-size:.82rem;color:#3c4760;line-height:1.8;margin-bottom:.55rem}
.c-hist{font-size:.73rem;color:#57503f;line-height:1.7;border-left:3px solid #d8d2c0;padding-left:.6rem;margin-bottom:.6rem}
.c-hist b{color:#8a8270;font-size:.66rem;letter-spacing:.1em}
.c-hist a{color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.c-evs{border-top:1px dashed #d8d2c0;padding-top:.5rem;margin-bottom:.55rem}
.c-evs-t{font-size:.66rem;font-weight:700;letter-spacing:.14em;color:#8a8270;margin-bottom:.3rem}
.c-ev{display:flex;align-items:baseline;gap:.5rem;font-size:.76rem;padding:.13rem 0;color:#4a5568;flex-wrap:wrap}
.c-ev .dt{flex:none;font-variant-numeric:tabular-nums;color:#b03a2e;font-weight:700;font-size:.7rem;min-width:9.2rem}
.c-ev .dt.long{min-width:9.2rem}
.c-ev .lb{font-weight:600;color:#3c4760}
.c-ev .lf{margin-left:auto;font-size:.66rem;font-weight:700;color:#b03a2e}
.c-ev .lf.ok{color:#3d7a52}
.c-ev.past{opacity:.45}
.c-links{display:flex;flex-wrap:wrap;gap:.45rem .9rem}
.c-links a{font-size:.72rem;font-weight:600;color:#26324b;text-decoration:none;border-bottom:1px solid transparent}
.c-links a:hover{border-bottom-color:#26324b}
/* 类型与会议标签（与科研前线页同一套视觉语义） */
.tchip{font-size:.62rem;font-weight:700;color:var(--tc);border:1.3px solid var(--tc);border-radius:.55rem;padding:.06rem .42rem;white-space:nowrap}
.stag{display:inline-block;font-size:.6rem;font-weight:600;color:#2e5e8a;background:transparent;border:1px solid rgba(46,94,138,.55);border-radius:2px;padding:.06rem .4rem;white-space:nowrap;vertical-align:.12em;letter-spacing:.04em}
.stag.focus{color:#6b6350;border-color:rgba(87,80,63,.5);border-style:dashed}
.empty{text-align:center;color:#8a8270;font-size:.82rem;padding:2.5rem 0;grid-column:1/-1}
footer{position:relative;z-index:1;text-align:center;padding:1.6rem 1rem 2.2rem;font-size:.74rem;color:#8a8270;border-top:1px solid #d8d2c0;background:rgba(248,244,232,.9)}
footer a{color:#26324b;text-decoration:none;border-bottom:1px dotted #8a8270}
/* dark mode */
html.dark body{background:#191c25;color:#d5dae6}
html.dark body::before{background:repeating-linear-gradient(0deg,rgba(150,180,220,.06) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(150,180,220,.06) 0 1px,transparent 1px 26px)}
html.dark header{background:#20242f;color:#d5dae6;border-bottom-color:#3a4658}
html.dark header h1{color:#d5dae6}
html.dark header p{color:#9aa3b5}
html.dark .tabs{background:rgba(32,36,47,.94);border-bottom-color:#333a4d}
html.dark .tab{background:#262b38;border-color:#4a5568;color:#c9d2e2}
html.dark .tab:hover,html.dark .tab.active{background:#c9d2e2;color:#1a1d26}
html.dark .backbar a{color:#8fb8dd}
html.dark .chip{background:#262b38}
html.dark .chip.all{border-color:#c9d2e2;color:#c9d2e2}
html.dark .chip.all.on{background:#c9d2e2;color:#1a1d26}
html.dark .search{background:#262b38;border-color:#4a5568;color:#9aa3b5}
html.dark .search input{color:#d5dae6}
html.dark .stat{background:#262b38;border-color:#333a4d;color:#9aa3b5}
html.dark .stat b{color:#e2e8f2}
html.dark .caveat-in{background:rgba(220,120,100,.07);border-color:rgba(220,120,100,.4);color:#9aa3b5}
html.dark .caveat-in b{color:#e89080}
html.dark .sec b{color:#e2e8f2}
html.dark .sec::after{background:#333a4d}
html.dark .ccard{background:#262b38;border-color:#333a4d;box-shadow:0 4px 14px rgba(0,0,0,.3),inset 3px 0 0 var(--c)}
html.dark .c-full{color:#7d8699}
html.dark .c-meta{background:rgba(143,184,221,.06);color:#9aa3b5}
html.dark .c-meta b{color:#e2e8f2}
html.dark .c-intro{color:#b8c1d4}
html.dark .c-hist{color:#9aa3b5;border-left-color:#333a4d}
html.dark .c-hist a{color:#8fb8dd}
html.dark .c-evs{border-top-color:#333a4d}
html.dark .c-ev{color:#9aa3b5}
html.dark .c-ev .lb{color:#b8c1d4}
html.dark .c-links a{color:#c9d2e2}
html.dark .stag{color:#8fb8dd;border-color:rgba(143,184,221,.55)}
html.dark .stag.focus{color:#9aa3b5;border-color:rgba(154,163,181,.5)}
html.dark .empty{color:#7d8699}
html.dark footer{background:#20242f;border-top-color:#333a4d;color:#7d8699}
html.dark footer a{color:#c9d2e2}
html.dark .nav-toggle{background:#262b38;color:#c9d2e2;border-color:#4a5568}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:768px){
  body::after{left:22px}
  header{padding:1.4rem 1rem 1.1rem}
  header h1{font-size:1.45rem;letter-spacing:.08em}
  header .kicker{font-size:.58rem;letter-spacing:.2em}
  header p{font-size:.74rem}
  .nav-toggle{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.7rem auto .3rem;padding:.5rem 1.4rem;border-radius:2rem;border:2px solid #26324b;background:#fbf8ef;color:#26324b;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit;position:sticky;top:0;z-index:11;box-shadow:0 2px 8px rgba(38,50,75,.15)}
  .tabs{display:none;flex-direction:column;align-items:stretch;gap:.4rem;padding:.7rem;position:static}
  .tabs.open{display:flex}
  .tab{text-align:center}
  .wrap,.caveat{padding-left:.8rem;padding-right:.8rem}
  .c-ev .dt{min-width:0}
  .c-ev .lf{margin-left:0;width:100%;text-align:right}
  .search input{width:7rem}
}
.nav-zone{font-size:.66rem;font-weight:700;letter-spacing:.06em;opacity:.48;border-left:1px solid currentColor;padding-left:.55rem;white-space:nowrap;-webkit-user-select:none;user-select:none}
.nav-zone:first-child{border-left:none;padding-left:0}
</style>
