<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3efe2;color:#26324b;min-height:100vh;overflow-x:hidden}
/* 方格研究日志纸 */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(46,94,138,.07) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(46,94,138,.07) 0 1px,transparent 1px 26px)}
body::after{content:'';position:fixed;top:0;bottom:0;left:64px;width:1.5px;pointer-events:none;z-index:0;
  background:rgba(176,58,46,.16)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(640px 420px at 10% 4%,rgba(46,94,138,.06),transparent 60%),
    radial-gradient(700px 500px at 90% 26%,rgba(176,58,46,.05),transparent 60%),
    radial-gradient(620px 520px at 16% 90%,rgba(61,122,82,.05),transparent 60%)}
/* masthead */
header{background:#f8f4e8;color:#26324b;padding:2.1rem 2rem 1.35rem;text-align:center;position:relative;z-index:1;
  border-bottom:3px double #26324b}
header .kicker{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:#8a8270;margin-bottom:.5rem;font-weight:700}
header h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:2.05rem;letter-spacing:.12em;color:#26324b}
header p{opacity:.78;font-size:.85rem;margin-top:.45rem;letter-spacing:.1em;color:#4a5568}
/* nav */
.tabs{display:flex;justify-content:center;gap:.6rem;padding:.9rem .8rem .8rem;background:rgba(248,244,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid #d8d2c0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:.45rem 1.1rem;border-radius:2rem;border:2px solid #26324b;background:rgba(251,248,239,.9);font-weight:600;font-size:.82rem;text-decoration:none;color:#26324b;transition:all .2s;cursor:pointer;font-family:inherit}
.tab:hover,.tab.active{background:#26324b;color:#f8f4e8}
.nav-toggle{display:none}
/* views + toolbar */
.views{display:flex;justify-content:center;gap:.45rem;padding:.85rem 1rem .1rem;position:relative;z-index:1;flex-wrap:wrap}
.vbtn{padding:.34rem 1rem;border-radius:.6rem;border:1.5px solid #b8b2a0;background:rgba(251,248,239,.85);font-size:.78rem;font-weight:600;color:#4a5568;cursor:pointer;font-family:inherit;transition:all .15s}
.vbtn:hover{border-color:#26324b}
.vbtn.on{background:#26324b;color:#f8f4e8;border-color:#26324b}
.toolbar{display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.8rem 1rem .25rem;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:600;padding:.25rem .75rem;border-radius:1rem;border:1.5px solid var(--c,#8a8270);color:var(--c,#8a8270);background:rgba(251,248,239,.85);cursor:pointer;user-select:none;transition:all .15s}
.chip.on{background:var(--c,#8a8270);color:#fbf8ef}
.chip.all{border-color:#26324b;color:#26324b}
.chip.all.on{background:#26324b;color:#f8f4e8}
.search{display:flex;align-items:center;gap:.35rem;background:rgba(251,248,239,.9);border:1.5px solid #b8b2a0;border-radius:1rem;padding:.18rem .7rem;font-size:.78rem;color:#4a5568}
.search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:.78rem;color:#26324b;width:10rem}
.stats{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:.55rem 1rem .2rem;position:relative;z-index:1;align-items:center}
.stat{background:rgba(251,248,239,.88);border:1px solid #ddd4bd;border-radius:1rem;padding:.35rem 1rem;font-size:.78rem;color:#4a5568;box-shadow:0 2px 8px rgba(38,50,75,.07)}
.stat b{color:#26324b;font-size:.95rem;margin-right:.15rem}
/* 口径框（防误读承重墙，勿删） */
.caveat{max-width:1180px;margin:.8rem auto 0;padding:0 1.2rem;position:relative;z-index:1}
.caveat-in{background:rgba(176,58,46,.05);border:1px dashed rgba(176,58,46,.45);border-radius:10px;padding:.6rem .95rem;font-size:.73rem;line-height:1.75;color:#57503f}
.caveat-in b{color:#b03a2e}
/* 倒计时横幅 */
.countdown{max-width:1180px;margin:1rem auto 0;padding:0 1.2rem;position:relative;z-index:1}
.cd-in{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;background:#fbf8ef;border:1.5px solid #26324b;border-radius:12px;padding:.9rem 1.2rem;box-shadow:3px 3px 0 rgba(38,50,75,.16)}
.cd-days{font-family:Georgia,'Songti SC',serif;font-size:2rem;font-weight:700;color:#b03a2e;min-width:4.6rem;text-align:center;line-height:1.05}
.cd-days small{display:block;font-size:.66rem;color:#8a8270;font-weight:400;letter-spacing:.15em;margin-top:.15rem}
.cd-body{flex:1;min-width:220px}
.cd-title{font-size:.98rem;font-weight:700;color:#26324b}
.cd-title .cd-s{color:var(--c)}
.cd-meta{font-size:.74rem;color:#57503f;margin-top:.25rem;line-height:1.6}
.cd-side{font-size:.74rem;color:#8a8270;text-align:right}
/* 方向看板 */
.board{max-width:1240px;margin:1.1rem auto 4rem;padding:0 1.2rem;position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.dcard{background:rgba(251,248,239,.94);border:1px solid #ddd4bd;border-radius:12px;padding:1.05rem 1.2rem .95rem;
  box-shadow:0 4px 14px rgba(38,50,75,.09),inset 3px 0 0 var(--c);transition:transform .2s,box-shadow .2s;scroll-margin-top:80px}
.dcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(38,50,75,.16),inset 3px 0 0 var(--c)}
.dcard.hl{outline:3px solid rgba(176,58,46,.55);outline-offset:2px}
.d-top{display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem}
.d-icon{font-size:1.25rem}
.d-title{font-family:Georgia,'Songti SC',serif;font-size:1.12rem;font-weight:700;color:#26324b}
.d-status{margin-left:auto;font-size:.66rem;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:.6rem;padding:.12rem .5rem;letter-spacing:.05em}
.d-sum{font-size:.83rem;color:#3c4760;line-height:1.75;margin-bottom:.55rem}
.d-kws{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem}
.d-kw{font-size:.66rem;font-weight:600;color:#2e5e8a;background:rgba(46,94,138,.08);border:1px solid rgba(46,94,138,.25);border-radius:.55rem;padding:.1rem .45rem}
.d-ms{border-top:1px dashed #d8d2c0;padding-top:.55rem;margin-bottom:.6rem}
.d-ms-t{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:#8a8270;margin-bottom:.35rem}
.d-mi{display:flex;gap:.55rem;font-size:.76rem;line-height:1.55;padding:.14rem 0;color:#4a5568}
.d-mi .dt{flex:none;font-variant-numeric:tabular-nums;color:#b03a2e;font-weight:700;font-size:.7rem;padding-top:.08rem;min-width:3.3rem}
.d-mi a{color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.d-mi a:hover{border-bottom-style:solid}
.d-next{background:rgba(176,58,46,.06);border-left:3px solid #b03a2e;border-radius:0 8px 8px 0;padding:.45rem .7rem;font-size:.76rem;line-height:1.7;color:#57503f}
.d-next b{color:#b03a2e;font-size:.68rem;letter-spacing:.12em}
.d-links{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.45rem}
.d-links a{font-size:.72rem;font-weight:600;color:#26324b;text-decoration:none;border-bottom:1px solid transparent}
.d-links a:hover{border-bottom-color:#26324b}
/* 会议时间轴 */
.tlwrap{max-width:980px;margin:1.1rem auto 1rem;padding:0 1.2rem 2rem;position:relative;z-index:1}
.legend{display:flex;justify-content:center;gap:.45rem;flex-wrap:wrap;padding:.2rem 0 .8rem}
.lg{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;color:#57503f}
.lg i{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
.month{display:flex;align-items:center;gap:.7rem;margin:1.5rem 0 .7rem}
.month b{font-family:Georgia,'Songti SC',serif;font-size:1.05rem;color:#26324b;letter-spacing:.06em;white-space:nowrap}
.month::after{content:'';flex:1;height:1px;background:#d8d2c0}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,#26324b,#8a8270);opacity:.35;border-radius:2px}
.evrow{position:relative;margin-bottom:.7rem;scroll-margin-top:80px}
.evrow .node{position:absolute;left:-24px;top:1.05rem;width:12px;height:12px;border-radius:50%;background:var(--c);border:2.5px solid #f3efe2;box-shadow:0 0 0 2px var(--c)}
.evcard{background:rgba(251,248,239,.94);border:1px solid #ddd4bd;border-radius:10px;padding:.6rem .95rem .55rem;
  box-shadow:0 3px 10px rgba(38,50,75,.08),inset 3px 0 0 var(--c);transition:transform .18s,box-shadow .18s}
.evcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,50,75,.14),inset 3px 0 0 var(--c)}
.evrow.hl .evcard{outline:3px solid rgba(176,58,46,.55);outline-offset:2px}
.evrow.past{opacity:.48}
.evrow.past .evcard{box-shadow:none}
.ev-l1{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ev-date{font-size:.72rem;font-weight:700;color:#8a8270;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ev-type{font-size:.64rem;font-weight:700;color:var(--tc);border:1.3px solid var(--tc);border-radius:.55rem;padding:.08rem .45rem}
.ev-left{margin-left:auto;font-size:.68rem;font-weight:700;color:#b03a2e}
.ev-left.now{color:#3d7a52}
.ev-l2{font-size:.92rem;font-weight:700;color:#26324b;margin-top:.2rem;line-height:1.5}
.ev-note{font-size:.74rem;color:#57503f;margin-top:.18rem;line-height:1.6}
.ev-link{display:inline-block;margin-top:.3rem;font-size:.72rem;font-weight:600;color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.ev-link:hover{border-bottom-style:solid}
.today{display:flex;align-items:center;gap:.6rem;margin:1rem 0;padding-left:26px}
.today span{font-size:.74rem;font-weight:700;color:#b03a2e;letter-spacing:.08em;white-space:nowrap}
.today::before{content:'📍'}
.today::after{content:'';flex:1;height:0;border-top:2px dashed rgba(176,58,46,.5)}
.pasttoggle{display:block;margin:.8rem auto 0;padding:.4rem 1.2rem;border-radius:1.4rem;border:1.5px dashed #8a8270;background:transparent;color:#57503f;font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit}
.pasttoggle:hover{border-color:#26324b;color:#26324b}
/* 分组切换 + 按会议分组 */
.gbar{display:flex;justify-content:center;align-items:center;gap:.45rem;margin-bottom:.75rem;font-size:.74rem;color:#8a8270;flex-wrap:wrap}
.gbar .vbtn{font-size:.72rem;padding:.26rem .85rem}
.sgroup{margin:1.35rem 0 .2rem;scroll-margin-top:80px;border-radius:10px}
.sgroup.hl{outline:3px solid rgba(176,58,46,.55);outline-offset:5px}
.sg-head{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.55rem}
.sg-dot{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px rgba(38,50,75,.12)}
.sg-name{font-family:Georgia,'Songti SC',serif;font-size:1.05rem;font-weight:700;color:var(--c)}
.sg-full{font-size:.7rem;color:#8a8270}
.sg-next{margin-left:auto;font-size:.7rem;font-weight:700;color:#b03a2e}
.sg-next.done{color:#8a8270;font-weight:600}
.sg-link{font-size:.72rem;font-weight:600;color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.sg-link:hover{border-bottom-style:solid}
.sg-stage{font-size:.64rem;font-weight:700;color:var(--c);border:1.3px solid var(--c);border-radius:.55rem;padding:.08rem .45rem;white-space:nowrap}
.sg-hist{font-size:.72rem;color:#57503f;line-height:1.65;margin:-.2rem 0 .55rem;padding-left:1.35rem}
.sg-hist a{color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.sg-hist a:hover{border-bottom-style:solid}
.legend.stg{margin-top:-.5rem}
.legend.stg .lg b{color:#26324b;font-weight:700}
.tk-sep{width:1px;height:1rem;background:#d8d2c0;margin:0 .15rem;flex:none}
/* 观望区 */
.watchwrap{max-width:980px;margin:0 auto 4.5rem;padding:0 1.2rem;position:relative;z-index:1}
.watch-t{display:flex;align-items:center;gap:.7rem;margin:1.6rem 0 .4rem}
.watch-t b{font-family:Georgia,'Songti SC',serif;font-size:1.05rem;color:#26324b;letter-spacing:.06em;white-space:nowrap}
.watch-t span{font-size:.7rem;color:#8a8270}
.watch-t::after{content:'';flex:1;height:1px;background:#d8d2c0}
.watchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem;margin-top:.7rem}
.wnote{background:#f7ecc9;border:1px solid #e3d5a5;border-radius:4px;padding:.7rem .9rem .65rem;position:relative;
  box-shadow:0 3px 9px rgba(38,50,75,.12);transform:rotate(-.5deg)}
.wnote:nth-child(2n){transform:rotate(.6deg)}
.wnote::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:64px;height:14px;background:rgba(176,58,46,.22);border-radius:2px}
.wn-name{font-weight:700;font-size:.86rem;color:#26324b}
.wn-full{font-size:.68rem;color:#8a8270;margin:.1rem 0 .3rem;line-height:1.5}
.wn-item{font-size:.76rem;font-weight:700;color:#b03a2e;line-height:1.55}
.wn-note{font-size:.72rem;color:#57503f;line-height:1.65;margin-top:.25rem}
.wn-note a{color:#2e5e8a;text-decoration:none;border-bottom:1px dotted rgba(46,94,138,.5)}
.empty{text-align:center;color:#8a8270;font-size:.82rem;padding:2.5rem 0}
footer{position:relative;z-index:1;text-align:center;padding:1.6rem 1rem 2.2rem;font-size:.74rem;color:#8a8270;border-top:1px solid #d8d2c0;background:rgba(248,244,232,.9)}
footer a{color:#26324b;text-decoration:none;border-bottom:1px dotted #8a8270}
/* dark mode */
html.dark body{background:#191c25;color:#d5dae6}
html.dark body::before{background:repeating-linear-gradient(0deg,rgba(150,180,220,.06) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(150,180,220,.06) 0 1px,transparent 1px 26px)}
html.dark header{background:#20242f;color:#d5dae6;border-bottom-color:#3a4658}
html.dark header h1{color:#d5dae6}
